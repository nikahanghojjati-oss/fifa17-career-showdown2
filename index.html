<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FIFA 17 Career Mode Showdown</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>

    <div id="background"></div>

    <div id="overlay"></div>

    <div id="app">

        <header>

            <div id="logoArea">

                <h1>FIFA 17</h1>

                <p>Career Mode Showdown</p>

            </div>

        </header>

        <main>

            <section id="mainMenu">

                <button class="menuButton" id="newShowdown">
                    New Showdown
                </button>

                <button class="menuButton" id="continueShowdown">
                    Continue Showdown
                </button>

                <button class="menuButton" id="statistics">
                    Statistics
                </button>

                <button class="menuButton" id="rules">
                    Rules
                </button>

                <button class="menuButton" id="settings">
                    Settings
                </button>

            </section>

        </main>

        <footer>

            Version 0.1.0

        </footer>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
