<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
FIFA 17 Career Mode Showdown
</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/layout.css">

<link rel="stylesheet" href="css/animations.css">

</head>


<body>


<div id="background"></div>

<div id="overlay"></div>



<!-- Loading Screen -->

<section id="loadingScreen">

<div class="loadingContent">

<h1>
CAREER MODE
</h1>

<h2>
SHOWDOWN
</h2>

<p id="loadingText">
Preparing Career Mode...
</p>

</div>

</section>



<!-- Main Application -->

<div id="app" class="hidden">



<header id="topHeader">

<div class="brand">

<h1>
CAREER MODE
</h1>

<p>
SHOWDOWN
</p>

</div>


<div class="seasonIndicator">

Season 1

</div>


</header>





<main>



<!-- Main Menu Screen -->

<section id="mainMenu" class="screen">


<button class="menuButton" id="newShowdown">

NEW SHOWDOWN

</button>



<button class="menuButton" id="continueShowdown">

CONTINUE CAREER

</button>



<button class="menuButton" id="statistics">

STATISTICS

</button>



<button class="menuButton" id="trophyRoom">

TROPHY ROOM

</button>



<button class="menuButton" id="rules">

RULE BOOK

</button>


</section>





<!-- Future screens will appear here -->

<section id="dashboard" class="screen hidden">


<h2>
CAREER DASHBOARD
</h2>


<div class="playerCards">


<div class="playerCard">

<h3>
PLAYER 1
</h3>

<p>
Club
</p>

<p>
League
</p>

<p>
Points
</p>


</div>



<div class="playerCard">


<h3>
PLAYER 2
</h3>

<p>
Club
</p>

<p>
League
</p>

<p>
Points
</p>


</div>


</div>


</section>




</main>



<footer>

FIFA 17 Career Mode Showdown

<br>

Version 0.2.0

</footer>



</div>



<script src="js/app.js"></script>


</body>

</html>
