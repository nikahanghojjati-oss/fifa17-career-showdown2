<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R8 League Wheel Proposal Reference</title>
<style>
:root{--black:#080b0e;--panel:#0d1216;--gold:#f3cc4f;--cream:#f5f0e4;--muted:#bdb49a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--black);color:var(--cream);font-family:"Segoe UI",Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% 32%,rgba(243,204,79,.12),transparent 34%),linear-gradient(135deg,#12181d,#080b0e 58%,#11171c)}
.shell{min-height:100vh;display:flex;flex-direction:column}header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;border-bottom:1px solid rgba(243,204,79,.45);background:rgba(8,11,14,.9)}
.brand{text-transform:uppercase}.brand strong{font:800 30px/1 "Arial Narrow","Segoe UI",sans-serif}.brand span{margin-left:9px;color:var(--gold);font-size:12px;letter-spacing:.16em}.season{padding:10px 15px;border-left:4px solid var(--gold);background:#131a1f;color:#d8d0bd;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
main{flex:1;display:grid;place-items:center;padding:22px}.stage{width:min(980px,96vw);text-align:center}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:8px}h1{margin:0 0 12px;font:800 54px/.9 "Arial Narrow","Segoe UI",sans-serif;text-transform:uppercase}
.state{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:#12191e;border:1px solid rgba(243,204,79,.2);color:#d8d0bd;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.state:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.arena{position:relative;width:min(610px,74vw);aspect-ratio:1;margin:0 auto 12px;display:grid;place-items:center}.arena:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 0 49%,rgba(243,204,79,.04) 49% 62%,transparent 62%),repeating-conic-gradient(from 0deg,rgba(243,204,79,.20) 0 1deg,transparent 1deg 15deg);mask:radial-gradient(circle,transparent 0 57%,#000 57% 75%,transparent 75%)}
.wheel{position:relative;width:68%;aspect-ratio:1;border-radius:50%;border:4px solid var(--gold);background:conic-gradient(#151c21 0 72deg,#0e1519 72deg 144deg,#1a2024 144deg 216deg,#0c1216 216deg 288deg,#171d21 288deg);box-shadow:0 0 0 10px #080b0e,0 0 0 12px rgba(243,204,79,.28),0 25px 55px rgba(0,0,0,.48)}
.wheel:after{content:"";position:absolute;inset:39%;border-radius:50%;background:#0a0f13;border:3px solid var(--gold);box-shadow:0 0 0 8px rgba(8,11,14,.7)}
.pointer{position:absolute;z-index:4;top:5%;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:31px solid var(--gold);filter:drop-shadow(0 5px 8px rgba(0,0,0,.45))}
.option{position:absolute;z-index:2;left:50%;top:50%;width:150px;margin-left:-75px;margin-top:-11px;color:var(--cream);font:800 13px/1 "Arial Narrow","Segoe UI",sans-serif;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 6px #000}.o1{transform:translateY(-145px)}.o2{transform:rotate(72deg) translateY(-145px) rotate(-72deg)}.o3{transform:rotate(144deg) translateY(-145px) rotate(-144deg)}.o4{transform:rotate(216deg) translateY(-145px) rotate(-216deg)}.o5{transform:rotate(288deg) translateY(-145px) rotate(-288deg)}
.result{width:min(650px,90vw);margin:0 auto 10px;padding:13px 18px;background:linear-gradient(90deg,transparent,#12191e 12% 88%,transparent);border-top:1px solid rgba(243,204,79,.3);border-bottom:1px solid rgba(243,204,79,.3)}.result span{display:block;color:var(--muted);font-size:9px;letter-spacing:.18em;text-transform:uppercase}.result strong{display:block;margin-top:3px;color:var(--cream);font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.actions{width:min(650px,90vw);margin:auto;display:grid;grid-template-columns:1fr 170px;gap:10px}.primary,.secondary{min-height:52px;border:0;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.primary{background:linear-gradient(135deg,#f7df87,#f3cc4f 58%,#bd8620);color:#0b0f12}.secondary{background:#171e23;color:var(--cream);border:1px solid rgba(245,240,228,.18)}
@media(max-width:760px){header{height:62px;padding:0 18px}.brand strong{font-size:20px}.brand span{display:none}.season{font-size:9px}.stage h1{font-size:42px}.arena{width:min(440px,92vw)}.wheel{width:74%}.option{width:116px;margin-left:-58px;font-size:10px}.o1{transform:translateY(-112px)}.o2{transform:rotate(72deg) translateY(-112px) rotate(-72deg)}.o3{transform:rotate(144deg) translateY(-112px) rotate(-144deg)}.o4{transform:rotate(216deg) translateY(-112px) rotate(-216deg)}.o5{transform:rotate(288deg) translateY(-112px) rotate(-288deg)}.actions{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell"><header><div class="brand"><strong>CAREER MODE</strong><span>SHOWDOWN // 17</span></div><div class="season">League Selection</div></header><main><section class="stage" id="leagueWheelScreen"><div class="eyebrow">RIVALRY SETUP // STAGE 02</div><h1>SELECT LEAGUE</h1><div class="state">HOST MAY SPIN</div><div class="arena"><div class="pointer" aria-hidden="true"></div><div class="wheel" id="leagueWheel"><span class="option o1">Premier League</span><span class="option o2">LaLiga</span><span class="option o3">Bundesliga</span><span class="option o4">Serie A</span><span class="option o5">Ligue 1</span></div></div><div class="result" id="selectedLeague" role="status"><span>Current Result</span><strong>Spin to select league</strong></div><div class="actions"><button class="primary" id="spinLeague">SPIN WHEEL</button><button class="secondary">BACK</button></div></section></main></div></body>
</html>
