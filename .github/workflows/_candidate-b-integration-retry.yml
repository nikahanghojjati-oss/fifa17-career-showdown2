name: Candidate B Guarded Integration Retry

on:
  push:
    branches: [agent/v1.1.2-candidate-b-import-analysis]

permissions:
  contents: write

concurrency:
  group: candidate-b-guarded-integration-retry
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-b-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 42

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v5
        with:
          ref: agent/v1.1.2-candidate-b-import-analysis
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Candidate B runtime, tests, docs and validator proposals
        run: python tools/apply_v112_candidate_b.py

      - name: Apply structural hardening and current-release validator alignment
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          import_path = Path('js/importAnalysis.js')
          source = import_path.read_text()
          replacement = '''    function isPlainImportObject(value){
              return Boolean(value && typeof value === "object" && !Array.isArray(value)
                  && Object.prototype.toString.call(value) === "[object Object]");
          }

          function cloneImportValue'''
          source, count = re.subn(
              r'    function isPlainImportObject\(value\)\{[\s\S]*?\n    \}\n\n    function cloneImportValue',
              replacement,
              source,
              count=1
          )
          if count != 1:
              raise SystemExit(f'Expected exactly one import plain-object helper, replaced {count}.')
          import_path.write_text(source)

          optional_path = Path('js/optionalModules.js')
          optional = optional_path.read_text()
          compact = '    await loadRuntimeScript("import-analysis","js/importAnalysis.js",()=>typeof window.analyzeCareerModeBackupFile==="function"&&typeof window.analyzeCareerModeBackupEnvelope==="function"&&typeof window.mountCareerModeImportAnalysisPanel==="function");'
          optional, count = re.subn(
              r'    await loadRuntimeScript\(\n        "import-analysis",\n        "js/importAnalysis\.js",\n        \(\) => typeof window\.analyzeCareerModeBackupFile === "function"\n            && typeof window\.analyzeCareerModeBackupEnvelope === "function"\n            && typeof window\.mountCareerModeImportAnalysisPanel === "function"\n    \);',
              compact,
              optional,
              count=1
          )
          if count != 1:
              raise SystemExit(f'Expected exactly one generated Candidate B lazy-loader, replaced {count}.')
          optional_path.write_text(optional)

          release_path = Path('RELEASE_V1.1.2.md')
          release = release_path.read_text()
          before = 'Application: `v1.1.2`\nRuntime revision: `1.1.2-r1`'
          after = 'Release tag: `v1.1.2`\n\nApplication: `v1.1.2`\nRuntime asset revision: `1.1.2-r1`'
          if before not in release:
              raise SystemExit('Candidate B release identity source not found.')
          release_path.write_text(release.replace(before, after, 1))

          static_path = Path('.github/workflows/validate-static-app.yml')
          static = static_path.read_text()
          replacements = [
              ("const expectedVersion = '1.1.1';", "const expectedVersion = '1.1.2';"),
              ("const expectedRevision = '1.1.1-r1';", "const expectedRevision = '1.1.2-r1';"),
              ("const releaseRecord = fs.readFileSync('RELEASE_V1.1.1.md', 'utf8');", "const releaseRecord = fs.readFileSync('RELEASE_V1.1.2.md', 'utf8');"),
              ("const previousReleaseRecord = fs.readFileSync('RELEASE_V1.1.0.md', 'utf8');", "const previousReleaseRecord = fs.readFileSync('RELEASE_V1.1.1.md', 'utf8');\n          const candidateAReleaseRecord = fs.readFileSync('RELEASE_V1.1.0.md', 'utf8');"),
              ("assert.ok(html.includes('v1.1.1 · Stable'), 'Stable user-facing footer identity is missing.');", "assert.ok(html.includes('v1.1.2 · Stable'), 'Stable user-facing footer identity is missing.');"),
              ("assert.ok(projectState.includes('**Application version:** v1.1.1 — Maintenance Candidate'), 'PROJECT_STATE current version is stale.');", "assert.ok(projectState.includes('**Application version:** v1.1.2 — Maintenance Candidate'), 'PROJECT_STATE current version is stale.');"),
              ("assert.ok(projectState.includes('**Runtime asset revision:** `1.1.1-r1`'), 'PROJECT_STATE runtime revision is stale.');", "assert.ok(projectState.includes('**Runtime asset revision:** `1.1.2-r1`'), 'PROJECT_STATE runtime revision is stale.');"),
              ("assert.ok(nextTask.includes('## Current baseline: v1.1.1 Maintenance Candidate'), 'NEXT_TASK does not identify the stable baseline.');", "assert.ok(nextTask.includes('## Current baseline: v1.1.2 Candidate B'), 'NEXT_TASK does not identify Candidate B as the current baseline.');"),
              ("assert.ok(readme.includes('**Application version:** v1.1.1 — Maintenance Candidate'), 'README current version is stale.');", "assert.ok(readme.includes('**Application version:** v1.1.2 — Maintenance Candidate'), 'README current version is stale.');"),
              ("assert.ok(changelog.includes('# v1.1.1 — James Rodríguez Real Madrid Source Refresh'), 'CHANGELOG v1.1.1 maintenance entry is missing.');", "assert.ok(changelog.includes('# v1.1.2 — Candidate B Import Analysis + Migration Preview'), 'CHANGELOG v1.1.2 Candidate B entry is missing.');\n          assert.ok(changelog.includes('# v1.1.1 — James Rodríguez Real Madrid Source Refresh'), 'Historical v1.1.1 maintenance entry is missing.');"),
              ("assert.ok(releaseRecord.includes('Release tag: `v1.1.1`'), 'Permanent v1.1.1 release record is incomplete.');", "assert.ok(releaseRecord.includes('Release tag: `v1.1.2`'), 'Permanent v1.1.2 release record is incomplete.');"),
              ("assert.ok(document.includes('1.1.1-r1'), `Current authority document ${index + 1} is missing the v1.1.1 runtime identity.`);", "assert.ok(document.includes('1.1.2-r1'), `Current authority document ${index + 1} is missing the v1.1.2 runtime identity.`);"),
              ("assert.ok(releaseRecord.includes('Runtime asset revision: `1.1.1-r1`'), 'The v1.1.1 release record must contain the current runtime identity.');", "assert.ok(releaseRecord.includes('Runtime asset revision: `1.1.2-r1`'), 'The v1.1.2 release record must contain the current runtime identity.');"),
              ("assert.ok(previousReleaseRecord.includes('1.1.0-r1'), 'The immutable v1.1.0 release record must retain its deployed r1 evidence.');", "assert.ok(previousReleaseRecord.includes('1.1.1-r1'), 'The immutable v1.1.1 release record must retain its deployed r1 evidence.');\n          assert.ok(candidateAReleaseRecord.includes('1.1.0-r1'), 'The immutable v1.1.0 Candidate A release record must retain its deployed r1 evidence.');")
          ]
          for old, new in replacements:
              if old not in static:
                  raise SystemExit(f'Static workflow current-release assertion not found: {old}')
              static = static.replace(old, new, 1)
          old_forbidden = "            'js/trophyRoom.js', 'js/settings.js', 'data/leagues.js', 'data/clubs.js'"
          new_forbidden = "            'js/trophyRoom.js', 'js/settings.js', 'js/backup.js', 'js/importAnalysis.js', 'js/legacy.js', 'data/leagues.js', 'data/clubs.js'"
          if old_forbidden not in static:
              raise SystemExit('Static eager-forbidden list source not found.')
          static_path.write_text(static.replace(old_forbidden, new_forbidden, 1))
          PY

      - name: Validate generated JavaScript and lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          find js data -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/contracts/import-analysis-contracts.cjs
          node --check tests/browser/import-analysis-audit.cjs

      - name: Run deterministic contracts
        run: npm run test:contracts

      - name: Prove startup budgets without raising thresholds
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib'),assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/(?:src|href)="((?:js|css|data)\/[^"?#]+)(?:\?v=([^"#]+))?"/g)].map(m=>m[1]);
          const raw=refs.reduce((n,p)=>n+fs.statSync(p).size,0);
          const gzip=refs.reduce((n,p)=>n+zlib.gzipSync(fs.readFileSync(p),{level:9}).length,0);
          console.log(`Candidate B eager startup: ${raw} raw bytes / ${gzip} gzip bytes across ${refs.length} assets.`);
          assert.ok(raw<=165000,`Startup raw budget exceeded: ${raw} > 165000`);
          assert.ok(gzip<=37500,`Startup gzip budget exceeded: ${gzip} > 37500`);
          assert.equal(refs.filter(p=>p==='js/importAnalysis.js').length,0,'Candidate B import analysis must remain lazy.');
          NODE

      - name: Run one complete changed-surface and regression burn-in
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-candidate-b-integration.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          CMS_AUDIT_RUN=integration npm run test:runtime-boundary
          CMS_AUDIT_RUN=integration npm run test:home-visual
          CMS_AUDIT_RUN=integration npm run test:football-visual
          CMS_AUDIT_RUN=integration npm run test:backup-browser
          CMS_AUDIT_RUN=integration npm run test:import-browser
          CMS_AUDIT_RUN=integration npm run test:browser

      - name: Audit remaining current-release references
        shell: bash
        run: |
          echo '--- workflow v1.1.1 references after Candidate B generation ---'
          grep -R -n --exclude='_candidate-b-integration-retry.yml' '1\.1\.1' .github/workflows || true
          echo '--- current runtime v1.1.1-r1 references outside immutable release history ---'
          grep -R -n '1\.1\.1-r1' index.html js data tests package.json package-lock.json NEXT_TASK.md PROJECT_STATE.md README.md RELEASE_V1.1.2.md || true

      - name: Stage generated workflow proposals outside workflow path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _candidate_b_generated_workflows
          cp .github/workflows/validate-stability-lane.yml _candidate_b_generated_workflows/validate-stability-lane.yml
          cp .github/workflows/validate-v110-release-burnin.yml _candidate_b_generated_workflows/validate-v110-release-burnin.yml
          cp .github/workflows/validate-static-app.yml _candidate_b_generated_workflows/validate-static-app.yml
          cp .github/workflows/validate-import-analysis.yml _candidate_b_generated_workflows/validate-import-analysis.yml
          git checkout -- .github/workflows/validate-stability-lane.yml .github/workflows/validate-v110-release-burnin.yml .github/workflows/validate-static-app.yml
          rm .github/workflows/validate-import-analysis.yml
          rm tools/apply_v112_candidate_b.py

      - name: Commit generated ordinary source and staged validator blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Implement v1.1.2 Candidate B import analysis [candidate-b-generated]'
          git push origin HEAD:agent/v1.1.2-candidate-b-import-analysis

      - name: Upload Candidate B integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-b-guarded-integration-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
