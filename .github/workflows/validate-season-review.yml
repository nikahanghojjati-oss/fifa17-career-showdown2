name: Validate Season Review

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  season-review-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate Season Review syntax and snapshot integrity
        shell: bash
        run: |
          set -euo pipefail
          node --check js/seasonEngine.js
          node --check js/optionalModules.js
          node --check js/diagnostics.js
          node tests/contracts/season-review-snapshot.cjs

      - name: Validate pre-commit architecture and rollback boundary
        shell: bash
        run: |
          set -euo pipefail
          node tests/contracts/season-review-architecture.cjs
