name: Temporary Post PR144 SLE Preseal Retry

on:
  push:
    branches:
      - agent/post-pr144-r2-production-handoff

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-pr144-r2-production-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Rebuild and validate mirrored SLE successor package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-post-pr144-sle-preseal.yml').read_text()
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          lines = block.splitlines()
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          exec(compile(normalized, '<preseal-generator>', 'exec'), {})

          # Divergent/closing WEC state must explicitly deny silent inheritance.
          status_path = Path('WORK_ENVIRONMENT_STATUS.json')
          status = json.loads(status_path.read_text())
          note = 'This is a closing-environment-only predecessor decision; the successor must not inherit predecessor transition authority and must initialize a fresh WEC with reset counters.'
          if note not in status['continuity']['evidenceNotes']:
              status['continuity']['evidenceNotes'].append(note)
          status_path.write_text(json.dumps(status, indent=2) + '\n')

          # Promoted runtimes are acknowledged by every current release-authority surface.
          roadmap_path = Path('POST_V1_ROADMAP_EXECUTION.md')
          roadmap = roadmap_path.read_text()
          marker = '# CURRENT PRODUCTION RUNTIME — v1.8.1 / 1.8.1-r2 — PR #144\n\nProduction-proven Connected Rivalry full-ID recovery UX is deployed at runtime `1.8.1-r2`; durable rivalry-ID shortening is abandoned and Stage 5 remains locked.\n\n'
          if '1.8.1-r2' not in roadmap[:2500]:
              roadmap_path.write_text(marker + roadmap)

          # Generation-aware promoted maintenance releases require a durable production proof.
          Path('V1.8.1_R2_PRODUCTION_PROOF.md').write_text('''# v1.8.1-r2 Production Proof — PR #144\n\nStatus: PRODUCTION-PROVEN\n\nApplication version: `v1.8.1`\nRuntime revision: `1.8.1-r2`\nPrevious known-good whole-shell runtime: `1.8.1-r1`\n\n## Exact publication evidence\n\n- PR #144 final exact head: `bc93407decbc5b8300013f1e23b558d686174566`.\n- All 14 permanent exact-head pull-request workflow families completed successfully.\n- Both automated review findings were corrected and their review threads resolved before publication.\n- Standing-authorized squash merge: `f3d26f5f9b8cee8996ecff296d6ca9bcc2c3fb18`.\n- Merged production tree: `e0ddc2e360a345705957bb535fd57fbfec3843a3`.\n- GitHub Pages run `32863192183` completed successfully on that exact merge.\n- Pages artifact `9569006078`, digest `sha256:5f00a4e07cd803d2e16b1d59d3cd46063923e96e53bd388469b1e8c0996409f0`, was inspected for the promoted runtime identity and bounded recovery behavior.\n\n## Proven runtime behavior in the shipped artifact\n\nThe deployed package identifies `1.8.1-r2`, retains `1.8.1-r1` as its declared previous whole-shell recovery target, and contains both reviewed edge-case corrections. `COPY RIVALRY ID` uses the immutable saved rivalry ID as the only copy authority in primary and fallback paths; visual wrapping does not change copied characters. Clients that skipped `1.8.1-r1` preserve the highest verified installed older shell instead of deleting their sole rollback option.\n\nThe durable rivalry identifier remains exactly `pair_` plus 64 lowercase hexadecimal characters. Durable-ID shortening, migration, alias authority and replacement rivalry identity were deliberately rejected.\n\n## Preserved production boundaries\n\nNo Firestore Rules, Firebase provider, billing requirement, App Check enforcement, authentication persistence/scopes, canonical local-storage authority, Candidate C authority, public discovery/community/matchmaking/rankings, or Stage 5 behavior changed in this maintenance release. Firebase remains Spark/zero billing, App Check enforcement remains OFF, Firestore remains memory-only, and Candidate C remains the sole destructive remote-to-local Apply authority.\n\nOfficial RJR-1 remains `78/100`; this recovery UX release, review correction, CI, publication and handoff work earn zero readiness points by themselves.\n\n## Owner-device proof boundary\n\nThis production proof establishes publication and shipped-artifact behavior. It does not fabricate the pending owner-device evidence. The successor must independently verify production `1.8.1-r2`, initialize a fresh WEC, then use the owner's existing signed-in Player One / Nik and Player Two / Gop contexts to prove the full existing rivalry ID is visible/copyable and reattach Gop to that exact existing rivalry without creating a replacement. Only after that stable recovery may the separately bounded one-shot unavailable-code regression proof resume.\n''')

          # Markdown hard-break spaces in generated evidence are unnecessary and
          # violate the repository's git-diff whitespace gate. Strip trailing
          # spaces/tabs from every generated text line before deterministic checks.
          for path in [
              'RELEASE_V1.8.1_R2.md', 'V1.8.1_R2_PRODUCTION_PROOF.md',
              'START_NEXT_SESSION_V1.4.17_R2_RIVALRY_RECOVERY_OWNER_PROOF.md',
              'project-documents/session-starts/START_NEXT_SESSION_V1.4.17_R2_RIVALRY_RECOVERY_OWNER_PROOF.md',
              'SUCCESSOR_HANDOFF_POST_PR144_R2_RIVALRY_RECOVERY_OWNER_PROOF_SLE_2026-08-25.md',
              'project-documents/handoffs/SUCCESSOR_HANDOFF_POST_PR144_R2_RIVALRY_RECOVERY_OWNER_PROOF_SLE_2026-08-25.md',
              'project-documents/START_NEXT_SESSION.md',
              'PROJECT_STATE.md', 'NEXT_TASK.md', '00_CURRENT_HANDOFF.md',
              '00_DEVELOPER_START_HERE.md', 'CAREER_MODE_SHOWDOWN_V1.8.1_R2_MAINTENANCE_HANDOFF.md',
              'README.md', 'CHANGELOG.md', 'WORK_ENVIRONMENT_HISTORY.md', 'POST_V1_ROADMAP_EXECUTION.md'
          ]:
              p = Path(path)
              if p.exists():
                  text = p.read_text()
                  p.write_text('\n'.join(line.rstrip(' \t') for line in text.splitlines()) + ('\n' if text.endswith('\n') else ''))
          PY
          rm .github/workflows/tmp-post-pr144-sle-preseal.yml
          rm .github/workflows/tmp-post-pr144-sle-preseal-retry.yml
          git diff --check
          node tests/contracts/sle-handoff-packaging-contracts.cjs
          npm run test:contracts
          npm run work:continuity:validate
      - name: Commit validated preseal package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare post-PR144 r2 successor SLE package"
          git push origin HEAD:agent/post-pr144-r2-production-handoff
