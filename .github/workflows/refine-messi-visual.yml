name: Refine Messi Visual

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/refine-messi-visual.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0
      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Rebuild Messi derivative at desktop-safe dimensions
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import hashlib, io, json

          filename = 'Messi & Suarez.jpg'
          url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + quote(filename, safe='')
          req = Request(url, headers={'User-Agent':'CareerModeShowdownAssetBuilder/1.0 (+https://github.com/nikahanghojjati-oss/fifa17-career-showdown2)'})
          with urlopen(req, timeout=60) as response:
              raw = response.read()
          with Image.open(io.BytesIO(raw)) as opened:
              image = ImageOps.exif_transpose(opened).convert('RGB')
              source_dimensions = image.size
              image.thumbnail((1067,1600), Image.Resampling.LANCZOS)
              output_dimensions = image.size
              out = Path('assets/football/lionel-messi-barcelona-2016.webp')
              image.save(out, 'WEBP', quality=80, method=6)

          output = out.read_bytes()
          if len(output) > 360_000:
              raise SystemExit(f'Messi derivative exceeds 360 KB ceiling: {len(output)}')
          if output_dimensions[0] < 1000:
              raise SystemExit(f'Messi derivative width is too small for desktop hero: {output_dimensions[0]}')

          manifest_path = Path('assets/football/asset-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          target = next(item for item in manifest['assets'] if item['id'] == 'lionel-messi-barcelona-2016')
          target['max_size'] = [1067,1600]
          target['quality'] = 80
          target['source_dimensions'] = list(source_dimensions)
          target['source_sha256'] = hashlib.sha256(raw).hexdigest()
          target['output_dimensions'] = list(output_dimensions)
          target['output_bytes'] = len(output)
          target['output_sha256'] = hashlib.sha256(output).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          print(f'Messi visual: {source_dimensions} -> {output_dimensions}, {len(output)} bytes')
          PY
      - name: Remove one-shot refiner and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refine-messi-visual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/football/lionel-messi-barcelona-2016.webp assets/football/asset-manifest.json .github/workflows/refine-messi-visual.yml
          git commit -m 'Preserve desktop resolution for Messi visual'
          git push origin HEAD:agent/licensed-football-visual-system-r1
