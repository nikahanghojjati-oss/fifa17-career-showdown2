name: r17 MDP accounting once

on:
  push:
    branches:
      - chore/mdp-r17-accounting-93-70
    paths:
      - .github/workflows/r17-mdp-accounting-once.yml

permissions:
  contents: write

jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/mdp-r17-accounting-93-70
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish exact r17 accounting boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const ledgerPath = 'MILESTONE_DELIVERY_PROGRESS.json';
          const readinessPath = 'SHARED_SHOWDOWN_JOURNEY_READINESS.json';
          const testPath = 'tests/contracts/milestone-delivery-progress-contracts.cjs';
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          if (ledger.currentScore !== 91 || ledger.formattedScore !== '91.00/100') throw new Error('r17 accounting must start from authoritative MDP 91.00');
          const final = ledger.capabilities.find(c => c.id === 'final-reconciliation');
          if (!final || final.lifecyclePercent !== 10 || final.status !== 'design_defined') throw new Error('final-reconciliation must still be design-defined before r17 accounting');
          const now = new Date().toISOString();
          ledger.recordedAt = now;
          ledger.basis = {
            mainSha: '23bba67ed7bf9cc38cb7dc9106e3f64a17a6b55f',
            branch: 'main',
            candidateHead: '054b57be3cf398ff4c812f8c6f813e4970c6bded',
            candidateValidation: 'POS20 run #430 exact-head green',
            integrationMergeSha: '23bba67ed7bf9cc38cb7dc9106e3f64a17a6b55f',
            pagesDeployment: 'GitHub Pages run #124 success',
            firestoreRulesDeployment: 'No new Firestore Rules deployment required for r17; Final Reconciliation composes existing read authorities and adds no collection, broad list permission or remote write surface.',
            productionVersion: 'v1.9.1',
            productionRuntimeRevision: '1.9.1-r17',
            note: 'r17 Final Reconciliation is merged and coherently deployed on exact product main 23bba67ed7bf9cc38cb7dc9106e3f64a17a6b55f. PR #248 exact publication head 054b57be3cf398ff4c812f8c6f813e4970c6bded passed POS20 run #430 and clean exact-head Codex review; GitHub Pages run #124 succeeded on r17 main; POS20 run #431 passed on that same main including its exact-head cognitive seal; Release Integration Burn-In run #381 passed both independent stateful journeys. Final Reconciliation requires exact configured-season completion, contiguous History Convergence, canonical accumulated Showdown-points authority, exact manager/save/profile binding and safe Local Reconciliation authority; ties remain draws, no extra season is created, Terminal Close remains separate, and no automatic canonical local-save mutation or new provider list/write surface is introduced. Final Reconciliation has therefore completed all six MDP lifecycle stages. SSJR-1.1 remains separate and 0/100 until genuine production-two-account acceptance is accepted.'
          };
          ledger.currentScore = 93.7;
          ledger.formattedScore = '93.70/100';
          ledger.summary = {
            featureCount: 20,
            fullyLifecycleDelivered: 17,
            preIntegrationComplete: 0,
            designDefinedOnly: 3,
            reusableFoundationsNotInflated: true,
            interpretation: 'Seventeen SSJR capabilities from shared entry through Final Reconciliation are fully engineered, regression-tested and product-integrated in coherent r17 production. Three later capabilities remain design-defined only.'
          };
          final.lifecyclePercent = 100;
          final.weightedContribution = 3;
          final.status = 'integrated';
          final.stages = {
            design: 'complete',
            implementation: 'complete',
            'automated-test': 'complete',
            'defect-resolution': 'complete',
            'regression-retest': 'complete',
            'product-integration': 'complete'
          };
          final.evidenceRefs = [
            'SHARED_SHOWDOWN_JOURNEY_MODEL.json',
            'js/sharedFinalReconciliation.js',
            'js/productionSharedFinalReconciliation.js',
            'tests/contracts/shared-final-reconciliation-contracts.cjs',
            'tests/contracts/shared-final-reconciliation-production-contracts.cjs',
            'tests/browser/shared-final-reconciliation-audit.cjs',
            'RELEASE_V1.9.1_R17.md',
            'PR #248 exact publication head 054b57be3cf398ff4c812f8c6f813e4970c6bded',
            'POS20 run #430 exact-head green',
            'PR #248 merge 23bba67ed7bf9cc38cb7dc9106e3f64a17a6b55f',
            'GitHub Pages run #124 success',
            'POS20 run #431 main green',
            'Release Integration Burn-In run #381 success'
          ];
          final.note = 'r17 Final Reconciliation completed all six MDP lifecycle stages after exact-head review found and corrected stale-authority, save/profile/rivalry binding, ABA recovery and cross-tab storage-clear defects. Exact publication/main POS20, coherent Pages deployment and two-pass release burn-in prove exact terminal 1/3/5/10 convergence, canonical accumulated Showdown-points winner authority, draw preservation, no extra season, read-only local behavior and Terminal Close separation. SSJR production-two-account acceptance remains separate.';
          ledger.scoreCheck = {
            fullyIntegratedWeight: 93,
            remainingDesignWeight: 7,
            remainingDesignContribution: 0.7,
            calculatedScore: 93.7
          };
          ledger.separationFromSSJR = {
            ssjrScore: 0,
            doesNotGrantSSJRCredit: true,
            reason: 'Production-two-account evidence is still required by SSJR-1.1 whole-capability acceptance.'
          };
          fs.writeFileSync(ledgerPath, JSON.stringify(ledger));

          const readiness = JSON.parse(fs.readFileSync(readinessPath, 'utf8'));
          if (readiness.currentScore !== 0) throw new Error('SSJR score must remain zero during MDP accounting');
          readiness.deliveryProgressTracker.currentScore = 93.7;
          readiness.deliveryProgressTracker.formattedScore = '93.70/100';
          readiness.candidateEvidence = readiness.candidateEvidence.filter(item => item.id !== 'ssjr1-final-reconciliation-r17-production');
          readiness.candidateEvidence.push({
            id: 'ssjr1-final-reconciliation-r17-production',
            layers: ['deterministic-behavior','provider-enforcement','isolated-browser-protocol','deployed-runtime'],
            references: [
              'PR #248 exact publication head 054b57be3cf398ff4c812f8c6f813e4970c6bded',
              'POS20 run #430 exact-head green',
              'PR #248 merge 23bba67ed7bf9cc38cb7dc9106e3f64a17a6b55f',
              'GitHub Pages run #124 success',
              'POS20 run #431 main green',
              'Release Integration Burn-In run #381 success',
              'js/sharedFinalReconciliation.js',
              'js/productionSharedFinalReconciliation.js',
              'tests/contracts/shared-final-reconciliation-contracts.cjs',
              'tests/contracts/shared-final-reconciliation-production-contracts.cjs',
              'tests/browser/shared-final-reconciliation-audit.cjs'
            ],
            relatedCapabilityIds: ['final-reconciliation'],
            credit: 0,
            missingLayers: ['production-two-account'],
            finding: 'r17 Final Reconciliation is coherently merged, repaired and deployed. Exact publication/main POS20 plus two-pass release burn-in prove deterministic terminal convergence, exact manager/save/profile authority, canonical accumulated Showdown-points winner/draw projection, stale-authority invalidation, no extra season and zero automatic canonical local-save mutation. It remains zero SSJR credit solely because genuine production-two-account evidence has not yet been accepted.'
          });
          if (!readiness.remainingCapabilityIds.includes('final-reconciliation')) throw new Error('SSJR final-reconciliation must remain uncredited');
          fs.writeFileSync(readinessPath, JSON.stringify(readiness));

          fs.writeFileSync('NEXT_TASK.md', `# NEXT TASK — MDP Terminal Close r18\n\nAuthoritative integrated product main is \`23bba67ed7bf9cc38cb7dc9106e3f64a17a6b55f\` from expected-head squash merge of PR #248. Runtime \`1.9.1-r17\` is coherently deployed by GitHub Pages #124. Exact publication-head POS20 #430, exact-main POS20 #431 and Release Integration Burn-In #381 are green.\n\nMilestone Delivery Progress is \`93.70/100\`. SSJR-1.1 remains exactly \`0/100\`; MDP integration evidence does not grant SSJR credit.\n\n## Immediate capability\n\nImplement \`terminal-close\` (frozen weight 2), which depends on Final Reconciliation. Close a completed shared journey terminally on both devices and prove CLOSED cannot be resurrected by delayed publishes, retries, session re-entry or later reads. Reuse established private-session terminal semantics rather than inventing a parallel lifecycle, but ensure the completed journey itself remains terminal across fresh session attempts.\n\nFinal Reconciliation remains read-only and separate: no extra season, no altered winner scoring and no automatic Candidate C/local Save mutation.\n\nPermanent locks remain: Firebase Spark only, Billing permanently OFF, App Check enforcement OFF, exactly two private managers, no public discovery/community/rankings, popup-only Google Auth, no broad list authority, Candidate C sole destructive local Apply with backup/rollback, and no Cloud Run or Cloud Functions dependency.\n`);

          fs.writeFileSync('R17_MDP_ACCOUNTING_BOUNDARY.md', `# r17 MDP accounting boundary\n\nThis is an accounting/provenance boundary only. It changes no executable product behavior and earns no SSJR credit by itself.\n\nProduct integration authority is exact main \`23bba67ed7bf9cc38cb7dc9106e3f64a17a6b55f\`, created by expected-head squash merge of PR #248 from exact publication head \`054b57be3cf398ff4c812f8c6f813e4970c6bded\`. Runtime \`1.9.1-r17\` is coherently deployed by GitHub Pages run #124. Publication-head POS20 #430 and exact-main POS20 #431 passed; Release Integration Burn-In #381 passed both independent stateful journeys.\n\nThe resulting MDP lifecycle accounting is \`93.70/100\`: Final Reconciliation is fully integrated across all six MDP stages, while Terminal Close, Physical Journey and Stable Journey Release remain design-defined only. SSJR-1.1 remains exactly \`0/100\`; r17 production evidence remains zero-credit until genuine production-two-account acceptance exists.\n\nr17 preserves canonical accumulated Showdown-points winner authority, exact draw behavior, exact 1/3/5/10 terminal completion, no extra season creation, read-only local behavior and Terminal Close separation. The final review cycle corrected stale authority, exact profile/save/rivalry binding, hidden/local-authority invalidation, an ABA loss/recovery race and cross-tab localStorage.clear() invalidation before publication. No new Firestore collection, broad list permission, automatic canonical local-save mutation, paid tier, Cloud Run or Cloud Functions dependency was introduced.\n\nNext product capability after accounting merge: \`terminal-close\`, frozen weight 2. It must bind a verified completed Final Reconciliation to durable terminal journey closure and prove no resurrection under delayed publishes, retries, fresh session re-entry or later reads.\n`);

          let test = fs.readFileSync(testPath, 'utf8');
          const mustReplace = (from, to) => {
            if (!test.includes(from)) throw new Error(`missing expected test fragment: ${from.slice(0,80)}`);
            test = test.replace(from, to);
          };
          mustReplace('assert.equal(result.score, 91, "r16 Local Reconciliation earns product integration only after exact publication-head validation, expected-head merge, coherent Pages deployment, main POS20 validation and two-pass release burn-in.");', 'assert.equal(result.score, 93.7, "r17 Final Reconciliation earns product integration only after exact publication-head validation, expected-head merge, coherent Pages deployment, main POS20 validation and two-pass release burn-in.");');
          mustReplace('assert.equal(result.formattedScore, "91.00/100");', 'assert.equal(result.formattedScore, "93.70/100");');
          mustReplace('assert.equal(result.fullyLifecycleDelivered, 16);', 'assert.equal(result.fullyLifecycleDelivered, 17);');
          mustReplace('assert.equal(result.designDefinedOnly, 4);', 'assert.equal(result.designDefinedOnly, 3);');
          mustReplace('assert.equal(ledger.basis.mainSha, "613e031c648d8d5cdb4e260e74cd93f895f49872");', 'assert.equal(ledger.basis.mainSha, "23bba67ed7bf9cc38cb7dc9106e3f64a17a6b55f");');
          mustReplace('assert.equal(ledger.basis.integrationMergeSha, "613e031c648d8d5cdb4e260e74cd93f895f49872");', 'assert.equal(ledger.basis.integrationMergeSha, "23bba67ed7bf9cc38cb7dc9106e3f64a17a6b55f");');
          mustReplace('assert.equal(ledger.basis.candidateHead, "faf14a43069bc55754c1a8ad84dd9ae3ca4aef31");', 'assert.equal(ledger.basis.candidateHead, "054b57be3cf398ff4c812f8c6f813e4970c6bded");');
          mustReplace('assert.match(ledger.basis.candidateValidation, /POS20 run #397 exact-head green/);', 'assert.match(ledger.basis.candidateValidation, /POS20 run #430 exact-head green/);');
          mustReplace('assert.equal(ledger.basis.productionRuntimeRevision, "1.9.1-r16");', 'assert.equal(ledger.basis.productionRuntimeRevision, "1.9.1-r17");');
          mustReplace('assert.match(ledger.basis.pagesDeployment, /GitHub Pages run #122 success/i);', 'assert.match(ledger.basis.pagesDeployment, /GitHub Pages run #124 success/i);');
          mustReplace('assert.match(ledger.basis.note, /POS20 run #399 passed/i);', 'assert.match(ledger.basis.note, /POS20 run #431 passed/i);');
          mustReplace('assert.match(ledger.basis.note, /Release Integration Burn-In run #379 passed both/i);', 'assert.match(ledger.basis.note, /Release Integration Burn-In run #381 passed both/i);');

          const modelMarker = '  const modelCapabilities = ssjrModel.domains.flatMap(domain => domain.capabilities.map(capability => ({id: capability.id, weight: capability.weight})));';
          if (!test.includes(modelMarker)) throw new Error('missing model capability marker');
          const r17ReadinessBlock = `  const r17Candidate = ssjrReadiness.candidateEvidence.find(item => item.id === "ssjr1-final-reconciliation-r17-production");\n  assert.ok(r17Candidate, "SSJR readiness must preserve truthful zero-credit r17 production evidence.");\n  assert.equal(r17Candidate.credit, 0);\n  assert.deepEqual(r17Candidate.relatedCapabilityIds, ["final-reconciliation"]);\n  for (const layer of ["deterministic-behavior","provider-enforcement","isolated-browser-protocol","deployed-runtime"]) assert.ok(r17Candidate.layers.includes(layer), \`r17 candidate evidence missing \${layer}\`);\n  assert.ok(r17Candidate.missingLayers.includes("production-two-account"));\n  for (const expected of ["PR #248 exact publication head 054b57be","POS20 run #430 exact-head green","PR #248 merge 23bba67e","GitHub Pages run #124 success","POS20 run #431 main green","Release Integration Burn-In run #381 success"]) assert.ok(r17Candidate.references.some(ref => ref.includes(expected)), \`r17 evidence missing \${expected}\`);\n  assert.equal(ssjrReadiness.remainingCapabilityIds.includes("final-reconciliation"), true, "Final Reconciliation remains uncredited in SSJR until production-two-account evidence is accepted.");\n\n`;
          test = test.replace(modelMarker, r17ReadinessBlock + modelMarker);
          mustReplace('"journey-reconnect","journey-conflicts","local-reconciliation"', '"journey-reconnect","journey-conflicts","local-reconciliation","final-reconciliation"');

          const scoreMarker = '  assert.equal(ledger.scoreCheck.fullyIntegratedWeight, 90);';
          if (!test.includes(scoreMarker)) throw new Error('missing score marker');
          const finalIntegrationBlock = `  const finalReconciliationIntegrated = ledger.capabilities.find(capability => capability.id === "final-reconciliation");\n  assert.equal(finalReconciliationIntegrated.weightedContribution, 3);\n  for (const ref of ["js/sharedFinalReconciliation.js","js/productionSharedFinalReconciliation.js","tests/contracts/shared-final-reconciliation-production-contracts.cjs","tests/browser/shared-final-reconciliation-audit.cjs"]) assert.ok(finalReconciliationIntegrated.evidenceRefs.includes(ref), \`Final Reconciliation evidence missing \${ref}\`);\n  for (const expected of ["PR #248 exact publication head 054b57be","POS20 run #430 exact-head green","PR #248 merge 23bba67e","GitHub Pages run #124 success","POS20 run #431 main green","Release Integration Burn-In run #381 success"]) assert.ok(finalReconciliationIntegrated.evidenceRefs.some(ref => ref.includes(expected)), \`Final Reconciliation integration evidence missing \${expected}\`);\n\n`;
          test = test.replace(scoreMarker, finalIntegrationBlock + scoreMarker);
          mustReplace('assert.equal(ledger.scoreCheck.fullyIntegratedWeight, 90);', 'assert.equal(ledger.scoreCheck.fullyIntegratedWeight, 93);');
          mustReplace('assert.equal(ledger.scoreCheck.remainingDesignWeight, 10);', 'assert.equal(ledger.scoreCheck.remainingDesignWeight, 7);');
          mustReplace('assert.equal(ledger.scoreCheck.remainingDesignContribution, 1);', 'assert.equal(ledger.scoreCheck.remainingDesignContribution, 0.7);');
          mustReplace('assert.equal(ledger.scoreCheck.calculatedScore, 91);', 'assert.equal(ledger.scoreCheck.calculatedScore, 93.7);');
          mustReplace('const outOfOrder = clone(ledger); const finalReconciliation = outOfOrder.capabilities.find(capability => capability.id === "final-reconciliation"); finalReconciliation.stages["automated-test"] = "complete";', 'const outOfOrder = clone(ledger); const terminalClose = outOfOrder.capabilities.find(capability => capability.id === "terminal-close"); terminalClose.stages["automated-test"] = "complete";');
          mustReplace('current ${result.formattedScore} r16 integrated ledger', 'current ${result.formattedScore} r17 integrated ledger');
          fs.writeFileSync(testPath, test);
          NODE

          node tests/contracts/milestone-delivery-progress-contracts.cjs
          npm run test:ops
          git diff --check
          rm .github/workflows/r17-mdp-accounting-once.yml
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/r17-mdp-accounting-once.yml' 'MILESTONE_DELIVERY_PROGRESS.json' 'NEXT_TASK.md' 'R17_MDP_ACCOUNTING_BOUNDARY.md' 'SHARED_SHOWDOWN_JOURNEY_READINESS.json' 'tests/contracts/milestone-delivery-progress-contracts.cjs' | sort)"
          test "$actual" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: record r17 Final Reconciliation integration at MDP 93.70'
          git push origin HEAD:chore/mdp-r17-accounting-93-70
          git fetch origin main
          net="$(git diff --name-only origin/main...HEAD | sort)"
          net_expected="$(printf '%s\n' 'MILESTONE_DELIVERY_PROGRESS.json' 'NEXT_TASK.md' 'R17_MDP_ACCOUNTING_BOUNDARY.md' 'SHARED_SHOWDOWN_JOURNEY_READINESS.json' 'tests/contracts/milestone-delivery-progress-contracts.cjs' | sort)"
          test "$net" = "$net_expected"
