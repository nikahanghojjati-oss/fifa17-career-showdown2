name: V111 Integrate James Source

on:
  push:
    branches:
      - agent/v1.1.1-james-real-madrid-source
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Wire alternate James source and promote maintenance identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old_id='james-rodriguez-real-madrid-2019-smart-r5'
          new_id='james-rodriguez-real-madrid-2016-interview-v111'
          old_file=old_id+'.webp'
          new_file=new_id+'.webp'

          def replace(path, old, new, count=None):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'missing expected text in {path}: {old[:90]!r}')
              s=s.replace(old,new, count if count is not None else -1)
              p.write_text(s,encoding='utf-8')

          # Runtime visual identity: new source, same approved clean-anchor/face-safe presentation architecture.
          p=Path('data/footballVisuals.js'); s=p.read_text(encoding='utf-8')
          s=s.replace(old_id,new_id).replace(old_file,new_file)
          s=s.replace('context: "Real Madrid · 2019"','context: "Real Madrid · 2016"')
          s=s.replace('alt: "James Rodríguez wearing Real Madrid training apparel at Real Madrid City in October 2019"','alt: "James Rodríguez during a Real Madrid post-match interview in September 2016"')
          s=s.replace('https://commons.wikimedia.org/wiki/File:James_Rodríguez_in_2019.jpg','https://commons.wikimedia.org/wiki/File:James_Rodríguez_in_September_2016_-_02.jpg')
          p.write_text(s,encoding='utf-8')

          # Any presentation selector / browser requirement that keys on the exact asset identity follows the new asset.
          for path in ['css/footballVisuals.css','tests/browser/football-visual-audit.cjs']:
              p=Path(path); s=p.read_text(encoding='utf-8').replace(old_id,new_id).replace(old_file,new_file); p.write_text(s,encoding='utf-8')

          # Permanent licensed visual gate: make source identity and derivative geometry an explicit release contract.
          p=Path('.github/workflows/validate-football-visuals.yml'); s=p.read_text(encoding='utf-8')
          s=s.replace(old_file,new_file)
          s=s.replace("'james-rodriguez-real-madrid-2016.webp',", "'james-rodriguez-real-madrid-2016.webp',\n            'james-rodriguez-real-madrid-2019-smart-r5.webp',")
          s=s.replace("const james = manifest.assets.find(asset => asset.id === 'james-rodriguez-real-madrid-2019-smart-r5');\n          assert.ok(james, 'r5 James Rodríguez visual is missing.');", "const james = manifest.assets.find(asset => asset.id === 'james-rodriguez-real-madrid-2016-interview-v111');\n          assert.ok(james, 'v1.1.1 alternate Real Madrid James Rodríguez visual is missing.');")
          s=s.replace("assert.ok(decodeURI(james.source_page).includes('James_Rodríguez_in_2019.jpg'), 'James r5 source changed unexpectedly.');\n          assert.deepStrictEqual(james.crop_box_on_source, [20,0,540,705], 'James r5 authored crop box changed unexpectedly.');", "assert.ok(decodeURI(james.source_page).includes('James_Rodríguez_in_September_2016_-_02.jpg'), 'James must use the owner-requested alternate September 2016 Real Madrid source.');\n          assert.notStrictEqual(james.source_file, 'James Rodríguez in 2019.jpg', 'The superseded 2019 James source must not remain active.');\n          assert.deepStrictEqual(james.source_dimensions, [863,1080], 'James alternate source dimensions changed unexpectedly.');\n          assert.deepStrictEqual(james.crop_box_on_source, [40,0,830,1040], 'James v1.1.1 authored crop box changed unexpectedly.');\n          assert.deepStrictEqual(james.output_dimensions, [790,1040], 'James v1.1.1 derivative must retain the reviewed high-resolution portrait geometry.');\n          assert.ok(/Real Madrid/.test(james.context || '') && /2016/.test(james.context || ''), 'James provenance must explicitly remain Real Madrid-era context.');\n          assert.ok(james.output_dimensions[0] >= 700 && james.output_dimensions[1] >= 1000, 'James derivative lost the native resolution required for DPR2 evidence.');")
          s=s.replace("assert.ok(data.includes('marcus-rashford-man-utd-2017-smart-r5.webp'),", "assert.ok(data.includes('james-rodriguez-real-madrid-2016-interview-v111.webp'), 'Runtime data must activate the reviewed alternate Real Madrid James derivative.');\n          assert.ok(!data.includes('james-rodriguez-real-madrid-2019-smart-r5.webp'), 'Runtime data must not retain the superseded 2019 James derivative.');\n          assert.ok(data.includes('marcus-rashford-man-utd-2017-smart-r5.webp'),")
          p.write_text(s,encoding='utf-8')

          # Current third-party notice: replace only James's active section and framing intro, not historical audits.
          p=Path('THIRD_PARTY_NOTICES.md'); s=p.read_text(encoding='utf-8')
          start=s.index('### James Rodríguez — Real Madrid')
          end=s.index('### Marcus Rashford — Manchester United')
          james_notice='''### James Rodríguez — Real Madrid\n\n- Repository file: `assets/football/james-rodriguez-real-madrid-2016-interview-v111.webp`\n- Source file: `James Rodríguez in September 2016 - 02.jpg`\n- Author/source account: Real Madrid\n- Source page: `https://commons.wikimedia.org/wiki/File:James_Rodríguez_in_September_2016_-_02.jpg`\n- License: Creative Commons Attribution 3.0 Unported (CC BY 3.0), `https://creativecommons.org/licenses/by/3.0/`\n- Source dimensions: 863 × 1080.\n- Source context: James Rodríguez during the Real Madrid post-match interview after Borussia Dortmund v Real Madrid, 28 September 2016.\n- Application use: Create Showdown presentation.\n- Local transformation: source-pixel crop `(40, 0, 830, 1040)`, producing a 790 × 1040 derivative that preserves his complete hair/head, face, shoulders and purple Real Madrid training apparel; encoded as WebP at quality 92 with no upscaling.\n- Selection rationale: a January 2017 Real Madrid candidate exposed the club crest more directly but was only 384 × 480 and would have required physical upscaling at target DPR2 sizes. The September 2016 source was selected because it preserves explicit Real Madrid provenance while satisfying the project's native-resolution and face-readability gates.\n- Display policy: the complete authored derivative is displayed with `object-fit: contain`; responsive layout cannot crop the face/head merely to fill a tile. Face-safe diagonal accents remain restricted to the lower image zone.\n\n'''
          s=s[:start]+james_notice+s[end:]
          s=s.replace('The r5 owner-requested rebuild changes only the James Rodríguez, Marcus Rashford and Anthony Martial photographs.', 'The r5 rebuild established the current Rashford/Martial source architecture; v1.1.1 replaces James Rodríguez again at the owner’s request with a different licensed Real Madrid-era source.')
          p.write_text(s,encoding='utf-8')

          # Maintenance build identity. Only current runtime/test/workflow authorities are promoted; historical Markdown is left immutable.
          rev_paths=['index.html','js/app.js','js/optionalModules.js','js/menuExperience.js','js/settings.js','js/backup.js']
          for path in rev_paths:
              p=Path(path); s=p.read_text(encoding='utf-8').replace('1.1.0-r1','1.1.1-r1'); p.write_text(s,encoding='utf-8')
          for path in Path('.github/workflows').glob('validate-*.yml'):
              if path.name=='v111-integrate-james-source.yml': continue
              s=path.read_text(encoding='utf-8').replace('1.1.0-r1','1.1.1-r1')
              s=s.replace('Application version: v1.1.0','Application version: v1.1.1')
              path.write_text(s,encoding='utf-8')
          for path in [*Path('tests').rglob('*.cjs')]:
              s=path.read_text(encoding='utf-8').replace('1.1.0-r1','1.1.1-r1'); path.write_text(s,encoding='utf-8')

          # Exact app-version authorities.
          p=Path('js/app.js'); s=p.read_text(encoding='utf-8').replace('const APP_VERSION = "1.1.0";','const APP_VERSION = "1.1.1";'); p.write_text(s,encoding='utf-8')
          for path in ['js/settings.js','js/backup.js']:
              p=Path(path); s=p.read_text(encoding='utf-8').replace('"1.1.0"','"1.1.1"'); p.write_text(s,encoding='utf-8')
          pkg=json.loads(Path('package.json').read_text()); pkg['version']='1.1.1'; Path('package.json').write_text(json.dumps(pkg,indent=2)+'\n')
          lock=json.loads(Path('package-lock.json').read_text()); lock['version']='1.1.1'; lock['packages']['']['version']='1.1.1'; Path('package-lock.json').write_text(json.dumps(lock,indent=2)+'\n')

          # Current contract files may carry exact app-version assertions independent of cache revision.
          for path in [*Path('tests/contracts').glob('*.cjs'), *Path('.github/workflows').glob('validate-*.yml')]:
              s=path.read_text(encoding='utf-8')
              s=s.replace("APP_VERSION = \\\"1.1.0\\\"", "APP_VERSION = \\\"1.1.1\\\"")
              s=s.replace("APP_VERSION = \"1.1.0\"", "APP_VERSION = \"1.1.1\"")
              s=s.replace("'version': '1.1.0'", "'version': '1.1.1'")
              path.write_text(s,encoding='utf-8')

          # New release record and current task; deeper Candidate B roadmap order remains unchanged.
          Path('RELEASE_V1.1.1.md').write_text('''# Career Mode Showdown — v1.1.1 Release Record\n\nDate: 2026-08-11\nApplication version: `v1.1.1`\nRuntime asset revision: `1.1.1-r1`\nRelease class: owner-requested visual-source maintenance + gate hardening\n\n## Scope\n\nv1.1.1 changes the active James Rodríguez Create Showdown photograph to a genuinely different licensed source from his Real Madrid period. Candidate A backup/export remains intact. Candidate B import analysis remains the next substantive roadmap candidate and is not bundled into this maintenance release.\n\n## James source\n\n- source: `James Rodríguez in September 2016 - 02.jpg`;\n- author/source account: Real Madrid;\n- context: Real Madrid post-match interview after Borussia Dortmund v Real Madrid, 28 September 2016;\n- license: CC BY 3.0;\n- source: 863 × 1080;\n- authored crop: `[40, 0, 830, 1040]`;\n- derivative: 790 × 1040 WebP, no upscaling;\n- runtime: complete derivative under `object-fit: contain`, with the approved face-safe accent treatment.\n\nThe superseded 2019 James runtime derivative is removed and permanently rejected by the licensed-visual contract. Rashford, Martial, Messi, Lahm and the owner-liked Reus loading composition are protected.\n\n## Gate policy\n\nThe final candidate must pass every permanent workflow family twice. Any runtime/source change resets the two-pass count. Gates must not be weakened and performance budgets must not be raised to manufacture a pass. Post-merge Pages must match exact merged runtime bytes and deployed Stability must repeat provenance, visual, Candidate A and complete-journey audits.\n\n## Roadmap\n\nAfter this maintenance release, Candidate B — Import Analysis + Migration Preview — remains the next legal feature candidate. Candidate B stays read-only and Candidate C restore remains blocked behind it.\n''',encoding='utf-8')

          # Sanity checks before commit.
          assert old_id not in Path('data/footballVisuals.js').read_text()
          assert new_id in Path('data/footballVisuals.js').read_text()
          assert '1.1.1-r1' in Path('index.html').read_text()
          assert 'const APP_VERSION = "1.1.1";' in Path('js/app.js').read_text()
          assert Path('assets/football/'+new_file).exists()
          assert not Path('assets/football/'+old_file).exists()
          PY
      - name: Static sanity
        run: |
          node --check js/app.js
          node --check data/footballVisuals.js
          node --check js/footballVisuals.js
          node --check js/backup.js
          git diff --check
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js data css tests .github/workflows THIRD_PARTY_NOTICES.md package.json package-lock.json RELEASE_V1.1.1.md
          git diff --cached --check
          git commit -m 'Integrate v1.1.1 James Real Madrid source'
          git push
