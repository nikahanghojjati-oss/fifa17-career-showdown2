name: R5 Build Final Rashford

on:
  push:
    branches: [agent/r5-smart-player-photo-rebuild]
    paths:
      - 'tools/build_r5_rashford_final.py'
      - '.github/workflows/r5-build-final-rashford.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/r5-smart-player-photo-rebuild
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4
      - name: Build final subject-dominant Rashford derivative
        run: python tools/build_r5_rashford_final.py
      - name: Commit generated Rashford asset and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/football
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace Rashford with subject-dominant r5 crop"
          git push origin HEAD:agent/r5-smart-player-photo-rebuild
