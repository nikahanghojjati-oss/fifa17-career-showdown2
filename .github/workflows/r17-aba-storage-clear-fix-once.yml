name: r17 ABA storage-clear fix once
on:
  push:
    branches:
      - feat/ssjr-final-reconciliation-r17
    paths:
      - '.github/workflows/r17-aba-storage-clear-fix-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ssjr-final-reconciliation-r17
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Guard exact correction boundary
        run: |
          test "$(git rev-parse HEAD^)" = "9651ace46becd49112cba335483f6aeeed02e80f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/r17-aba-storage-clear-fix-once.yml"
      - name: Apply bounded authority-generation and storage-clear fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f"{path}: expected exactly one guarded match, got {s.count(old)}")
              p.write_text(s.replace(old,new,1))

          path='js/productionSharedFinalReconciliation.js'
          replace_once(path,
            '  let installed=false,busy=false,protocol=null,multiApi=null,historyApi=null,localApi=null,view=null,viewContextKey="",refreshPromise=null,refreshContextKey="";\n',
            '  let installed=false,busy=false,protocol=null,multiApi=null,historyApi=null,localApi=null,view=null,viewContextKey="",viewGeneration=-1,refreshPromise=null,refreshContextKey="",refreshGeneration=-1,authorityGeneration=0,observedContextKey="";\n')
          replace_once(path,
            '  function pfrContextMatches(request){const current=pfrRequest();return Boolean(request&&current&&request.key===current.key&&pfrSaveAuthorityReady());}\n',
            '  function pfrContextMatches(request){const current=pfrRequest();return Boolean(request&&current&&request.key===current.key&&pfrSaveAuthorityReady());}\n  function pfrTrackRequest(request){const key=request?.key||"";if(key===observedContextKey)return false;observedContextKey=key;authorityGeneration+=1;return true;}\n  function pfrAuthorityMatches(request,generation){return generation===authorityGeneration&&pfrContextMatches(request);}\n  function pfrClearView({bump=false}={}){if(bump)authorityGeneration+=1;view=null;viewContextKey="";viewGeneration=-1;pfrRender();return null;}\n')
          replace_once(path,
            '  function pfrCurrentView(){const request=pfrRequest();let localState=null;try{localState=localApi?.getState?.()||null;}catch(_error){}return pfrSaveAuthorityReady()&&request&&view&&viewContextKey===request.key&&pfrLocalAuthorityMatches(request,localState)?view:null;}\n',
            '  function pfrCurrentView(){const request=pfrRequest();pfrTrackRequest(request);let localState=null;try{localState=localApi?.getState?.()||null;}catch(_error){}return pfrSaveAuthorityReady()&&request&&view&&viewContextKey===request.key&&viewGeneration===authorityGeneration&&pfrLocalAuthorityMatches(request,localState)?view:null;}\n')
          replace_once(path,
            '  function pfrDiscard(request){if(request&&viewContextKey===request.key){view=null;viewContextKey="";}pfrRender();return null;}\n  async function pfrRefreshNow(request=pfrRequest()){\n    if(!request||!pfrContextMatches(request))return pfrDiscard(request);\n    await pfrEnsureDependencies();if(!pfrContextMatches(request))return pfrDiscard(request);\n    const multiState=await multiApi.refresh();if(!pfrContextMatches(request))return pfrDiscard(request);\n    const historyState=await historyApi.refresh();if(!pfrContextMatches(request))return pfrDiscard(request);\n    const localState=localApi.refresh();if(!pfrContextMatches(request)||!pfrSnapshotsMatch(request,multiState,historyState,localState))return pfrDiscard(request);\n    const next=protocol.reconcile({sharedActive:true,multiSeason:multiState,history:historyState,localReconciliation:localState});\n    if(!pfrContextMatches(request)||!pfrSnapshotsMatch(request,multiState,historyState,localState))return pfrDiscard(request);\n    view=next;viewContextKey=request.key;pfrRender();\n',
            '  function pfrDiscard(request,generation){if(request&&viewContextKey===request.key&&viewGeneration===generation){view=null;viewContextKey="";viewGeneration=-1;}pfrRender();return null;}\n  async function pfrRefreshNow(request=pfrRequest(),generation=authorityGeneration){\n    if(!request||!pfrAuthorityMatches(request,generation))return pfrDiscard(request,generation);\n    await pfrEnsureDependencies();if(!pfrAuthorityMatches(request,generation))return pfrDiscard(request,generation);\n    const multiState=await multiApi.refresh();if(!pfrAuthorityMatches(request,generation))return pfrDiscard(request,generation);\n    const historyState=await historyApi.refresh();if(!pfrAuthorityMatches(request,generation))return pfrDiscard(request,generation);\n    const localState=localApi.refresh();if(!pfrAuthorityMatches(request,generation)||!pfrSnapshotsMatch(request,multiState,historyState,localState))return pfrDiscard(request,generation);\n    const next=protocol.reconcile({sharedActive:true,multiSeason:multiState,history:historyState,localReconciliation:localState});\n    if(!pfrAuthorityMatches(request,generation)||!pfrSnapshotsMatch(request,multiState,historyState,localState))return pfrDiscard(request,generation);\n    view=next;viewContextKey=request.key;viewGeneration=generation;pfrRender();\n')
          replace_once(path,
            '  function pfrRefresh(){\n    const request=pfrRequest();if(!request){view=null;viewContextKey="";pfrRender();return Promise.resolve(null);}\n    if(viewContextKey&&viewContextKey!==request.key){view=null;viewContextKey="";pfrRender();}\n    if(refreshPromise&&refreshContextKey===request.key)return refreshPromise;\n    busy=true;const current=pfrRefreshNow(request).catch(error=>{if(pfrContextMatches(request)){pfrDiscard(request);pfrReport("Unable to reconcile final Shared Showdown",error);}return null;}).finally(()=>{if(refreshPromise===current){refreshPromise=null;refreshContextKey="";busy=false;}});\n    refreshPromise=current;refreshContextKey=request.key;return current;\n  }\n  function pfrWake(event){const request=pfrRequest();if(event?.type==="career-mode-save-library-authority-invalidated"){view=null;viewContextKey="";pfrRender();return;}if(event?.type==="career-mode-shared-local-reconciliation-state-change"){let localState=event.detail||null;if(!localState){try{localState=localApi?.getState?.()||null;}catch(_error){}}if(!pfrLocalAuthorityMatches(request,localState)){view=null;viewContextKey="";pfrRender();return;}}if(root.document?.visibilityState==="hidden")return;if(!request||!pfrSaveAuthorityReady()){view=null;viewContextKey="";pfrRender();return;}if(viewContextKey&&viewContextKey!==request.key){view=null;viewContextKey="";pfrRender();}if(busy&&refreshPromise&&refreshContextKey===request.key)return;void pfrRefresh();}\n',
            '  function pfrRefresh(){\n    const request=pfrRequest();pfrTrackRequest(request);const generation=authorityGeneration;if(!request)return Promise.resolve(pfrClearView());\n    if(viewContextKey&&(viewContextKey!==request.key||viewGeneration!==generation))pfrClearView();\n    if(refreshPromise&&refreshContextKey===request.key&&refreshGeneration===generation)return refreshPromise;\n    busy=true;const current=pfrRefreshNow(request,generation).catch(error=>{if(pfrAuthorityMatches(request,generation)){pfrDiscard(request,generation);pfrReport("Unable to reconcile final Shared Showdown",error);}return null;}).finally(()=>{if(refreshPromise===current){refreshPromise=null;refreshContextKey="";refreshGeneration=-1;busy=false;}});\n    refreshPromise=current;refreshContextKey=request.key;refreshGeneration=generation;return current;\n  }\n  function pfrWake(event){const request=pfrRequest(),contextChanged=pfrTrackRequest(request);if(contextChanged)pfrClearView();if(event?.type==="career-mode-save-library-authority-invalidated")return pfrClearView({bump:true});if(event?.type==="career-mode-shared-local-reconciliation-state-change"){let localState=event.detail||null;if(!localState){try{localState=localApi?.getState?.()||null;}catch(_error){}}if(!pfrLocalAuthorityMatches(request,localState))return pfrClearView({bump:true});}if(root.document?.visibilityState==="hidden")return;if(!request||!pfrSaveAuthorityReady())return pfrClearView({bump:!pfrSaveAuthorityReady()});if(viewContextKey&&(viewContextKey!==request.key||viewGeneration!==authorityGeneration))pfrClearView();if(busy&&refreshPromise&&refreshContextKey===request.key&&refreshGeneration===authorityGeneration)return;void pfrRefresh();}\n')

          replace_once('js/saveLibraryRuntime.js',
            '            if(event&&(event.key===SAVE_LIBRARY_KEY||event.key===SINGLETON_KEY)){\n',
            '            if(event&&(event.key===null||event.key===SAVE_LIBRARY_KEY||event.key===SINGLETON_KEY)){\n')

          contract='tests/contracts/shared-final-reconciliation-production-contracts.cjs'
          replace_once(contract,
            'assert.match(production,/function pfrSaveAuthorityReady\\(\\)/);',
            'assert.match(production,/function pfrSaveAuthorityReady\\(\\)/);assert.match(production,/authorityGeneration/);assert.match(production,/refreshGeneration===generation/);assert.match(production,/viewGeneration===authorityGeneration/);')
          replace_once(contract,
            'assert.match(saveRuntime,/const wasReady=authorityReady/);',
            'assert.match(saveRuntime,/const wasReady=authorityReady/);assert.match(saveRuntime,/event\\.key===null\\|\\|event\\.key===SAVE_LIBRARY_KEY/);')
          replace_once(contract,
            'assert.match(production,/function pfrDiscard\\(request\\)/);',
            'assert.match(production,/function pfrDiscard\\(request,generation\\)/);')

          audit='tests/browser/shared-final-reconciliation-audit.cjs'
          old='  let releaseAuthorityRefresh=null,authorityRefreshCalls=0;race.context.CareerModeProductionSharedMultiSeasonProgression={refresh(){authorityRefreshCalls+=1;if(authorityRefreshCalls===1)return new Promise(resolve=>{releaseAuthorityRefresh=()=>resolve(authority.multi);});return Promise.resolve(authority.multi);},getState(){return authority.multi;}};const authorityInFlight=api.refresh();await flush();assert.equal(typeof releaseAuthorityRefresh,"function");race.setSaveAuthorityReady(false);race.listeners.get("career-mode-save-library-authority-invalidated")?.({type:"career-mode-save-library-authority-invalidated"});assert.equal(api.getState(),null,"Cross-tab Save Library invalidation must immediately hide the published result.");releaseAuthorityRefresh();assert.equal(await authorityInFlight,null,"In-flight refresh must not republish after Save Library authority invalidation.");race.setSaveAuthorityReady(true);const saveAuthorityRecovered=await api.refresh();assert.equal(saveAuthorityRecovered.phase,"FINAL_SEASON_RECONCILED","Reactivated Save Library authority requires fresh exact reconciliation.");\n'
          new='  let releaseAuthorityRefresh=null,authorityRefreshCalls=0;race.context.CareerModeProductionSharedMultiSeasonProgression={refresh(){authorityRefreshCalls+=1;if(authorityRefreshCalls===1)return new Promise(resolve=>{releaseAuthorityRefresh=()=>resolve(authority.multi);});return Promise.resolve(authority.multi);},getState(){return authority.multi;}};const authorityInFlight=api.refresh();await flush();assert.equal(typeof releaseAuthorityRefresh,"function");race.setSaveAuthorityReady(false);race.listeners.get("career-mode-save-library-authority-invalidated")?.({type:"career-mode-save-library-authority-invalidated"});assert.equal(api.getState(),null,"Cross-tab Save Library invalidation must immediately hide the published result.");race.setSaveAuthorityReady(true);const saveAuthorityRecovered=api.refresh();assert.notStrictEqual(saveAuthorityRecovered,authorityInFlight,"Recovered same-key authority must start a fresh generation instead of deduplicating behind pre-loss work.");const recoveredBeforeOldSettles=await saveAuthorityRecovered;assert.equal(recoveredBeforeOldSettles.phase,"FINAL_SEASON_RECONCILED","Recovered authority may publish only from a refresh started after recovery.");releaseAuthorityRefresh();assert.equal(await authorityInFlight,null,"A refresh started before authority loss must remain rejected even after same-key authority recovers.");assert.equal(api.getState().phase,"FINAL_SEASON_RECONCILED","Late pre-loss completion must not clear or replace the newer recovered-generation view.");\n'
          replace_once(audit,old,new)
          replace_once(audit,
            'synchronous local-authority + cross-tab Save Library invalidation including hidden/in-flight cases,',
            'synchronous local-authority + cross-tab Save Library invalidation including hidden/in-flight ABA recovery cases,')
      - name: Validate bounded correction
        run: |
          node tests/contracts/shared-final-reconciliation-contracts.cjs
          node tests/contracts/shared-final-reconciliation-production-contracts.cjs
          node tests/browser/shared-final-reconciliation-audit.cjs
          npm run test:ssjr
          npm run test:ops
          npm run test:contracts
          git diff --check
      - name: Commit product correction and self-clean
        run: |
          rm .github/workflows/r17-aba-storage-clear-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: invalidate stale r17 authority generations'
          git push origin HEAD:feat/ssjr-final-reconciliation-r17
