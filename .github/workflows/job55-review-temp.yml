name: Job 55 temporary Loading review

on:
  push:
    branches:
      - factory/v1-wtt5ye
    paths:
      - .github/workflows/job55-review-temp.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout factory branch
        uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
          fetch-depth: 1

      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod-main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install browser and Python QA dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m pip install --upgrade pillow numpy scikit-image

      - name: Serve factory and production
        run: |
          mkdir -p review-tmp/qa review-tmp/diff
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/job55-factory-http.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory prod-main > /tmp/job55-prod-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/visual-assets/v10_1/loading/index.html >/dev/null
          curl --fail --silent http://127.0.0.1:8766/index.html >/dev/null

      - name: Factory QA every frame and viewport
        run: |
          FRAMES="$(node -e "const f=require('./visual-assets/v10_1/loading/fixtures.json'); process.stdout.write(Object.keys(f.frames).join(','))")"
          echo "Frames: $FRAMES"
          FACTORY_QA_OUT=review-tmp/qa node visual-assets/v10_1/shared/tools/factory-qa.cjs \
            http://127.0.0.1:8765/visual-assets/v10_1/loading/ \
            visual-assets/v10_1/loading \
            "$FRAMES"

      - name: Loading-specific independent audit and reference captures
        run: |
          cat > review-tmp/loading-review-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const views = [
            {w:1366,h:768,dpr:1,label:'1366x768'},
            {w:1920,h:1080,dpr:1,label:'1920x1080'},
            {w:393,h:660,dpr:3,label:'393x660@3x',phone:true},
            {w:360,h:640,dpr:2,label:'360x640',phone:true},
            {w:375,h:553,dpr:2,label:'375x553',phone:true}
          ];

          const exactCredit = 'Marco Reus photo: Tim Reckmann · CC BY 2.0 · Cropped for display';
          function safe(s){ return s.replace(/[^a-z0-9]+/gi,'_'); }
          function rgbParts(s){ const m=s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); return m ? m.slice(1,4).map(Number) : null; }
          function lum(rgb){
            const q=rgb.map(v=>{v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);});
            return 0.2126*q[0]+0.7152*q[1]+0.0722*q[2];
          }
          function ratio(a,b){ const A=lum(a),B=lum(b); return (Math.max(A,B)+0.05)/(Math.min(A,B)+0.05); }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const out={factory:[], production:[]};
            try {
              for (const v of views) {
                const context=await browser.newContext({viewport:{width:v.w,height:v.h},deviceScaleFactor:v.dpr,isMobile:!!v.phone,hasTouch:!!v.phone});
                const page=await context.newPage();
                const errors=[], failed=[];
                page.on('pageerror',e=>errors.push('pageerror: '+e));
                page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text());});
                page.on('requestfailed',r=>failed.push(r.url()));
                await page.goto('http://127.0.0.1:8765/visual-assets/v10_1/loading/index.html?frame=LD1',{waitUntil:'load'});
                await page.waitForTimeout(400);
                const metrics=await page.evaluate((exactCredit)=>{
                  const html=document.documentElement, body=document.body;
                  const credit=document.querySelector('.startupPhotoCredit');
                  const links=[...credit.querySelectorAll('a')];
                  const athlete=document.getElementById('startupAthlete');
                  const inside=(r)=>r.left>=-0.5&&r.top>=-0.5&&r.right<=innerWidth+0.5&&r.bottom<=innerHeight+0.5;
                  const rect=(el)=>{const r=el.getBoundingClientRect(); return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height};};
                  const nav=performance.getEntriesByType('navigation')[0];
                  const resources=performance.getEntriesByType('resource');
                  const bytes=(nav?.encodedBodySize||0)+resources.reduce((n,e)=>n+(e.encodedBodySize||0),0);
                  return {
                    inner:{w:innerWidth,h:innerHeight},
                    scroll:{html:[html.scrollWidth,html.scrollHeight,html.clientWidth,html.clientHeight],body:[body.scrollWidth,body.scrollHeight,body.clientWidth,body.clientHeight]},
                    credit:{text:credit.textContent.trim().replace(/\s+/g,' '),exact:credit.textContent.trim().replace(/\s+/g,' ')===exactCredit,fontSize:parseFloat(getComputedStyle(credit).fontSize),color:getComputedStyle(credit).color,rect:rect(credit),inside:inside(credit.getBoundingClientRect())},
                    links:links.map(a=>({text:a.textContent.trim(),href:a.href,rect:rect(a),inside:inside(a.getBoundingClientRect())})),
                    athlete:{naturalWidth:athlete.naturalWidth,naturalHeight:athlete.naturalHeight,rect:rect(athlete),objectPosition:getComputedStyle(athlete).objectPosition},
                    identity:{rect:rect(document.querySelector('.startupIdentity')),inside:inside(document.querySelector('.startupIdentity').getBoundingClientRect())},
                    status:{rect:rect(document.querySelector('.startupStatus')),inside:inside(document.querySelector('.startupStatus').getBoundingClientRect())},
                    bytes
                  };
                }, exactCredit);

                await page.keyboard.press('Tab');
                const focus1=await page.evaluate(()=>({text:document.activeElement?.textContent?.trim(),outline:getComputedStyle(document.activeElement).outlineStyle,width:getComputedStyle(document.activeElement).outlineWidth}));
                await page.keyboard.press('Tab');
                const focus2=await page.evaluate(()=>({text:document.activeElement?.textContent?.trim(),outline:getComputedStyle(document.activeElement).outlineStyle,width:getComputedStyle(document.activeElement).outlineWidth}));
                metrics.focus=[focus1,focus2];
                metrics.consoleErrors=errors;
                metrics.failedRequests=failed;

                const fg=rgbParts(metrics.credit.color);
                metrics.creditContrastOnBlack=fg ? ratio(fg,[7,8,10]) : null;

                await page.screenshot({path:'review-tmp/factory_LD1_'+safe(v.label)+'.png',fullPage:false});
                out.factory.push({view:v,...metrics});
                await context.close();
              }

              for (const v of views.filter(x=>x.label==='1366x768'||x.label==='1920x1080')) {
                const context=await browser.newContext({viewport:{width:v.w,height:v.h},deviceScaleFactor:1});
                const page=await context.newPage();
                await page.goto('http://127.0.0.1:8766/index.html',{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(650);
                const visible=await page.locator('#loadingScreen').isVisible().catch(()=>false);
                const credit=await page.locator('.startupPhotoCredit').textContent().catch(()=>null);
                await page.screenshot({path:'review-tmp/production_loading_'+safe(v.label)+'.png',fullPage:false});
                out.production.push({view:v,visible,credit:credit&&credit.trim().replace(/\s+/g,' ')});
                await context.close();
              }

              const reduced=await browser.newContext({viewport:{width:393,height:660},deviceScaleFactor:3,isMobile:true,hasTouch:true,reducedMotion:'reduce'});
              const rp=await reduced.newPage();
              await rp.goto('http://127.0.0.1:8765/visual-assets/v10_1/loading/index.html?frame=LD1',{waitUntil:'load'});
              await rp.waitForTimeout(350);
              out.reducedRunningAnimations=await rp.evaluate(()=>document.getAnimations({subtree:true}).filter(a=>a.playState==='running').map(a=>a.animationName||'unnamed'));
              await reduced.close();
            } finally {
              await browser.close();
            }
            fs.writeFileSync('review-tmp/loading_audit.json',JSON.stringify(out,null,2)+'\n');
            console.log(JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node review-tmp/loading-review-audit.cjs

      - name: Summarize factory QA
        run: |
          python3 - <<'PY'
          import json
          p='review-tmp/qa/qa_report.json'
          d=json.load(open(p))
          rs=d['results']
          summary={
            'runs':len(rs),
            'frames':d['frames'],
            'viewports':[v['label'] for v in d['viewports']],
            'raw_report_pass':d['pass'],
            'scroll_failures':sum(1 for r in rs if r['scroll']['html']['horizontal'] or r['scroll']['html']['vertical'] or r['scroll']['body']['horizontal'] or r['scroll']['body']['vertical'] or r['scroll']['stage']['horizontal'] or r['scroll']['stage']['vertical']),
            'reduced_motion_failures':sum(1 for r in rs if not r['hardGates']['H7']['pass']),
            'console_error_runs':sum(1 for r in rs if r.get('consoleErrors')),
            'failed_request_runs':sum(1 for r in rs if r.get('failedRequests')),
            'out_of_view_controls_runs':sum(1 for r in rs if r.get('controlsOutsideViewport')),
            'sub16_input_runs':sum(1 for r in rs if r.get('inputsBelow16px')),
            'raw_h1_failures':sum(1 for r in rs if not r['hardGates']['H1']['pass']),
            'raw_missing_fixture_string_runs':sum(1 for r in rs if r.get('fixtureStrings',{}).get('missing')),
            'raw_no_primary_runs':sum(1 for r in rs if r.get('primary') is None),
          }
          open('review-tmp/qa_summary_derived.json','w').write(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Build compare sheets
        run: |
          python3 visual-assets/v10_1/shared/tools/compare_sheet.py \
            project-documents/factory/mockups/GOAL_HOME.jpg \
            review-tmp/qa/LD1__1366x768.png \
            review-tmp/compare_home_goal_vs_build.png \
            --box daniel-face:650,80,900,355 \
            --box nik-face:1040,25,1305,355 \
            --box daniel-hand:630,360,790,585 \
            --box nik-hand:1160,260,1320,505

          python3 visual-assets/v10_1/shared/tools/compare_sheet.py \
            review-tmp/production_loading_1366x768.png \
            review-tmp/qa/LD1__1366x768.png \
            review-tmp/compare_production_vs_build.png \
            --box reus-face:270,0,455,210 \
            --box reus-left-hand:70,465,190,610 \
            --box reus-right-hand:300,465,455,605

      - name: Run H10 mockup diff against production registration
        run: |
          cat > review-tmp/loading_review_platemap.json <<'JSON'
          {
            "plate_1x_size": [1920, 1080],
            "protected_boxes": {
              "face_reus": [390, 0, 620, 270],
              "hand_left": [90, 650, 260, 850],
              "hand_right": [430, 650, 620, 830]
            }
          }
          JSON
          python3 visual-assets/v10_1/shared/tools/mockup_diff.py \
            --mockup review-tmp/production_loading_1920x1080.png \
            --build review-tmp/qa/LD1__1920x1080.png \
            --plate review-tmp/production_loading_1920x1080.png \
            --platemap review-tmp/loading_review_platemap.json \
            --out review-tmp/diff | tee review-tmp/mockup_diff_stdout.txt

      - name: Compress key review images
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          keep=[
            'review-tmp/qa/LD1__1366x768.png',
            'review-tmp/qa/LD1__1920x1080.png',
            'review-tmp/qa/LD1__393x660_3x.png',
            'review-tmp/qa/LD1__375x553.png',
            'review-tmp/qa/LD5_PARTIAL__393x660_3x.png',
            'review-tmp/production_loading_1366x768.png',
            'review-tmp/production_loading_1920x1080.png',
            'review-tmp/compare_home_goal_vs_build.png',
            'review-tmp/compare_production_vs_build.png',
            'review-tmp/diff/heatmap.jpg',
            'review-tmp/diff/side_by_side.jpg',
          ]
          out=Path('review-tmp/key-images'); out.mkdir(parents=True,exist_ok=True)
          for raw in keep:
            p=Path(raw)
            if not p.exists():
              continue
            im=Image.open(p).convert('RGB')
            target=out/(p.stem+'.webp')
            im.save(target,'WEBP',quality=84,method=6)
          PY

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job55-loading-review-evidence
          path: |
            review-tmp/qa/qa_report.json
            review-tmp/qa/QA_SUMMARY.md
            review-tmp/qa_summary_derived.json
            review-tmp/loading_audit.json
            review-tmp/diff/scores.json
            review-tmp/diff/heatmap.jpg
            review-tmp/diff/side_by_side.jpg
            review-tmp/mockup_diff_stdout.txt
            review-tmp/key-images/
          retention-days: 1
