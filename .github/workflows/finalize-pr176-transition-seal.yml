name: Finalize PR176 Stage5D transition seal

on:
  push:
    branches:
      - rjr/pr176-stage5d-provider-pending-sle-2026-09-01

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Reconcile recursive historical checkpoints and stale Stage5C lock assertion
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const contractPath = 'tests/contracts/sle-handoff-packaging-contracts.cjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          const before = 'assert.match(capsule.criticalLocks.stage5CStandardAuthCandidate, /proven-isolated-not-production-rules-or-runtime/i);';
          const after = 'assert.match(capsule.criticalLocks.stage5CStandardAuthCandidate, /proven-source-promoted-provider-pending-runtime-not-loaded/i);';
          if (!contract.includes(before)) throw new Error('Expected stale Stage 5C lock assertion not found');
          fs.writeFileSync(contractPath, contract.replace(before, after));

          const checkpoint = 'PR #175 Stage 5C standard-auth checkpoint proved the selected standard Firebase `request.auth.uid` path with registered-device mutation metadata, not authentication. Its Java 21 Stage 5C Auth-plus-Firestore emulator gate passed with zero RJR movement, and that candidate slice did not publish production session Rules; PR #176 is the later source-promotion checkpoint.';
          const starterPath = 'START_NEXT_SESSION_V1.4.35_PR176_STAGE5D_PROVIDER_PENDING.md';
          let starter = fs.readFileSync(starterPath, 'utf8');
          if (!starter.includes('PR #175 Stage 5C standard-auth checkpoint')) {
            const needle = 'The Stage 5B non-extractable P-256 custom-token research remains preserved but is not the production critical path because its trusted Cloud Run issuer would require billing. The production critical path remains standard Google Authentication plus direct exact-path Firestore Rules on Firebase Spark.\n';
            if (!starter.includes(needle)) throw new Error('Expected Stage 5B production-path paragraph not found in starter');
            starter = starter.replace(needle, needle + '\n' + checkpoint + '\n');
            fs.writeFileSync(starterPath, starter);
          }

          const handoffPath = 'SUCCESSOR_HANDOFF_PR176_STAGE5D_PROVIDER_PENDING_SLE_2026-09-01.md';
          let handoff = fs.readFileSync(handoffPath, 'utf8');
          const oldStage5B = 'The Stage 5B non-extractable P-256 proof-of-possession model remains preserved dormant research. PR #174 proved its non-extractable key, per-sign-in `device_id` / `device_key_sha256` claim model, simultaneous same-UID device isolation, Chromium behavior and Auth-plus-Firestore emulator boundary. It is not the production critical path because its trusted Cloud Run issuer would require billing.';
          const newStage5B = 'PR #174 Stage 5B non-extractable P-256 device credential proof remains preserved dormant research. It proved its non-extractable key, per-sign-in `device_id` / `device_key_sha256` claim model, simultaneous same-UID device isolation, Chromium browser behavior and Auth-plus-Firestore emulator boundary. It is not the production critical path because its trusted Cloud Run issuer would require billing.';
          if (handoff.includes(oldStage5B)) handoff = handoff.replace(oldStage5B, newStage5B);
          if (!handoff.includes('PR #175 Stage 5C standard-auth checkpoint')) {
            const productionPath = 'The production critical path remains standard Google Authentication plus direct exact-path Firestore Rules on Firebase Spark.';
            if (!handoff.includes(productionPath)) throw new Error('Expected production critical-path paragraph not found in handoff');
            handoff = handoff.replace(productionPath, productionPath + '\n\n' + checkpoint);
          }
          const oldBilling = 'Billing must never be activated. Never link Cloud Billing, enable Blaze, add a payment method, activate Cloud Run, buy review credits or activate another service whose use requires billing even if a free allowance is advertised.';
          const newBilling = 'Billing must never be activated. Cloud Run and Blaze are excluded and forbidden under the permanent zero-billing architecture. Never link Cloud Billing, add a payment method, buy review credits or activate another service whose use requires billing even if a free allowance is advertised.';
          if (handoff.includes(oldBilling)) handoff = handoff.replace(oldBilling, newBilling);
          fs.writeFileSync(handoffPath, handoff);
          NODE
      - name: Prepare complete recursive SLE seal
        run: node scripts/seal-pr176-stage5d-transition.mjs
      - name: Reconcile generated current-context semantics
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const graphPath = 'SESSION_CONTEXT_GRAPH.json';
          const graph = JSON.parse(fs.readFileSync(graphPath,'utf8'));
          graph.retrievalHints = graph.retrievalHints || {};
          graph.retrievalHints.walkDirection = 'Preserve consumed PR #174 Stage 5B credential proof -> PR #175 Stage 5C standard-auth proof -> fixed RJR87 -> PR #176 minimum production session Rules source merge -> authenticated provider publication -> separate runtime host/join. Billing remains forbidden and Cloud Run remains excluded.';
          fs.writeFileSync(graphPath, JSON.stringify(graph,null,2)+'\n');

          const learningPath = 'SESSION_CONTEXT_LEARNING.json';
          const learning = JSON.parse(fs.readFileSync(learningPath,'utf8'));
          learning.latestLesson.lesson = 'PR #175 at fixed RJR87 proved the standard-Firebase-uid Stage 5C boundary with registered device mutation metadata, not authentication; Billing stayed forbidden and Cloud Run excluded. PR #176 then merged that exact boundary into the production Rules source with zero RJR movement, while provider publication of the new repository blob remains separately unproven.';
          fs.writeFileSync(learningPath, JSON.stringify(learning,null,2)+'\n');

          const bootstrapPath = 'SESSION_BOOTSTRAP.json';
          const bootstrap = JSON.parse(fs.readFileSync(bootstrapPath,'utf8'));
          bootstrap.minimalReads = Array.isArray(bootstrap.minimalReads) ? bootstrap.minimalReads : [];
          const abuseProof = 'PRODUCTION_PROVIDER_ABUSE_ACCEPTANCE_PROOF_2026-08-29.md';
          if (!bootstrap.minimalReads.includes(abuseProof)) {
            const providerProof = bootstrap.minimalReads.indexOf('PRODUCTION_FIRESTORE_RULES_PROVIDER_PROOF_2026-08-29.md');
            bootstrap.minimalReads.splice(providerProof >= 0 ? providerProof + 1 : bootstrap.minimalReads.length, 0, abuseProof);
          }
          fs.writeFileSync(bootstrapPath, JSON.stringify(bootstrap,null,2)+'\n');

          const sealPath = 'scripts/seal-pr176-stage5d-transition.mjs';
          let seal = fs.readFileSync(sealPath,'utf8');
          const oldMinimal = "'PRODUCTION_FIRESTORE_RULES_PROVIDER_PROOF_2026-08-29.md','00_OWNER_ZERO_BILLING_REMOTE_JOINING_AUTHORIZATION.md'";
          const newMinimal = "'PRODUCTION_FIRESTORE_RULES_PROVIDER_PROOF_2026-08-29.md','PRODUCTION_PROVIDER_ABUSE_ACCEPTANCE_PROOF_2026-08-29.md','00_OWNER_ZERO_BILLING_REMOTE_JOINING_AUTHORIZATION.md'";
          if (seal.includes(oldMinimal)) seal = seal.replace(oldMinimal,newMinimal);
          if (!seal.includes('PRODUCTION_PROVIDER_ABUSE_ACCEPTANCE_PROOF_2026-08-29.md')) throw new Error('Seal source did not preserve provider abuse proof');
          fs.writeFileSync(sealPath,seal);

          const contractPath = 'tests/contracts/sle-handoff-packaging-contracts.cjs';
          let contract = fs.readFileSync(contractPath,'utf8');
          const oldRules = 'assert.equal(model.latestCheckpoint.rulesBlobSha,"2b7c0b166ae0aae7ab7a3ce84725b21091262484");';
          const newRules = 'assert.equal(model.latestCheckpoint.rulesBlobSha,"363af783d7e5436fdfaa3766d4aa413fc9952a08");\nassert.equal(model.latestCheckpoint.lastProviderProvenRulesBlobSha,"2b7c0b166ae0aae7ab7a3ce84725b21091262484");';
          if (!contract.includes(oldRules)) throw new Error('Expected stale model Rules assertion not found');
          fs.writeFileSync(contractPath, contract.replace(oldRules,newRules));
          NODE
      - name: Remove one-shot finalizer
        run: rm -f .github/workflows/finalize-pr176-transition-seal.yml
      - name: Validate focused SLE and continuity contracts
        run: |
          node tests/contracts/stage5d-production-session-rules-contracts.cjs
          node tests/contracts/sle-handoff-packaging-contracts.cjs
          node tests/contracts/handoff-immediate-next-task-contracts.cjs
          node tests/contracts/next-developer-prompt-contracts.cjs
          node tests/contracts/work-environment-continuity-contracts.cjs
          git diff --check
      - name: Commit final sealed package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Seal PR176 Stage5D provider-pending SLE'
          git push origin HEAD:rjr/pr176-stage5d-provider-pending-sle-2026-09-01
