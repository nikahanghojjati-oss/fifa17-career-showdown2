name: Apply Required Football Visual Architecture

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/apply-required-football-visual-architecture.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Convert football photography from optional route-lazy decoration to required startup-warmed presentation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          optional_path = Path('js/optionalModules.js')
          optional = optional_path.read_text()
          optional = optional.replace(
              'let gameplayRuntimeInitialized = false;\n',
              'let gameplayRuntimeInitialized = false;\nlet requiredFootballVisualPromise = null;\n',
              1
          )
          optional = optional.replace('    await ensureFootballVisualModule();\n', '    await ensureRequiredFootballVisualExperience();\n', 1)
          old = '''async function ensureFootballVisualModule(){
              const stylePromise = loadRuntimeStyle("football-visual-ui", "css/footballVisuals.css");
              await loadRuntimeScript(
                  "football-visual-data",
                  "data/footballVisuals.js",
                  () => Boolean(window.FOOTBALL_VISUALS && window.FOOTBALL_VISUAL_SCREEN_PLAN)
              );
              await loadRuntimeScript(
                  "football-visual-ui",
                  "js/footballVisuals.js",
                  () => typeof window.initializeFootballVisuals === "function"
                      && typeof window.prepareFootballVisualScreen === "function"
              );
              await stylePromise;
              window.initializeFootballVisuals();
              return true;
          }
          '''
          new = '''async function ensureFootballVisualModule(){
              const stylePromise = loadRuntimeStyle("football-visual-ui", "css/footballVisuals.css");
              await loadRuntimeScript(
                  "football-visual-data",
                  "data/footballVisuals.js",
                  () => Boolean(window.FOOTBALL_VISUALS && window.FOOTBALL_VISUAL_SCREEN_PLAN)
              );
              await loadRuntimeScript(
                  "football-visual-ui",
                  "js/footballVisuals.js",
                  () => typeof window.initializeFootballVisuals === "function"
                      && typeof window.prepareFootballVisualScreen === "function"
                      && typeof window.preloadFootballVisualAssets === "function"
              );
              await stylePromise;
              await window.initializeFootballVisuals();
              return true;
          }

          function ensureRequiredFootballVisualExperience(){
              if(requiredFootballVisualPromise){ return requiredFootballVisualPromise; }
              requiredFootballVisualPromise = ensureFootballVisualModule().catch(error => {
                  requiredFootballVisualPromise = null;
                  throw error;
              });
              return requiredFootballVisualPromise;
          }
          '''
          if old not in optional:
              raise SystemExit('Football visual loader block did not match expected source.')
          optional = optional.replace(old, new, 1)
          if optional.count('const visualPromise = ensureFootballVisualModule();') != 2:
              raise SystemExit('Expected two optional statistics/trophy visual promises.')
          optional = optional.replace('const visualPromise = ensureFootballVisualModule();', 'const visualPromise = ensureRequiredFootballVisualExperience();')
          init_marker = '    bindOptionalModuleButton(document.getElementById("settingsButton"), "settings", "settingsBound");\n\n    optionalModulesInitialized = true;'
          init_replacement = '''    bindOptionalModuleButton(document.getElementById("settingsButton"), "settings", "settingsBound");

              ensureRequiredFootballVisualExperience().catch(error => {
                  if(typeof window.reportApplicationError === "function"){
                      window.reportApplicationError("Required football presentation could not be prepared", error);
                  }else{
                      console.error("Required football presentation could not be prepared", error);
                  }
              });

              optionalModulesInitialized = true;'''
          if init_marker not in optional:
              raise SystemExit('Optional module initializer marker missing.')
          optional = optional.replace(init_marker, init_replacement, 1)
          optional = optional.replace(
              'window.ensureFootballVisualModule = ensureFootballVisualModule;\n',
              'window.ensureFootballVisualModule = ensureFootballVisualModule;\nwindow.ensureRequiredFootballVisualExperience = ensureRequiredFootballVisualExperience;\n',
              1
          )
          optional_path.write_text(optional)

          screens_path = Path('js/screens.js')
          screens = screens_path.read_text()
          gameplay_marker = '''const GAMEPLAY_SCREENS = new Set([
              "leagueWheelScreen",
              "clubWheelScreen",
              "dashboard",
              "transferChallenge",
              "seasonEntry",
              "seasonSummary"
          ]);
          '''
          required_block = gameplay_marker + '''
          const REQUIRED_FOOTBALL_VISUAL_SCREENS = new Set([
              "createShowdown",
              "transferChallenge",
              "careerStatistics",
              "trophyRoom"
          ]);
          '''
          if gameplay_marker not in screens:
              raise SystemExit('Gameplay screen set marker missing.')
          screens = screens.replace(gameplay_marker, required_block, 1)

          old_prepare = '''    if(typeof window.prepareFootballVisualScreen === "function"){
              window.prepareFootballVisualScreen(screenName);
          }
          '''
          new_prepare = '''    if(REQUIRED_FOOTBALL_VISUAL_SCREENS.has(screenName)){
              if(typeof window.prepareFootballVisualScreen !== "function"){
                  throw new Error(`Required football presentation is unavailable for ${screenName}.`);
              }
              if(!window.prepareFootballVisualScreen(screenName)){
                  throw new Error(`Required football presentation could not mount for ${screenName}.`);
              }
          }
          '''
          if old_prepare not in screens:
              raise SystemExit('Football visual prepare block missing.')
          screens = screens.replace(old_prepare, new_prepare, 1)

          activate = '''    if(typeof window.activateFootballVisualScreen === "function"){
              try{ window.activateFootballVisualScreen(screenName); }
              catch(error){ console.warn(`[Career Mode Showdown] Optional football visual activation failed for ${screenName}:`, error); }
          }
          '''
          count = screens.count(activate)
          if count != 2:
              raise SystemExit(f'Expected two old route-lazy activation blocks; found {count}.')
          screens = screens.replace(activate, '')

          old_nav = '''        if(target === "createShowdown" && typeof window.ensureFootballVisualModule === "function"){
              await window.ensureFootballVisualModule();
          }
          '''
          new_nav = '''        if(REQUIRED_FOOTBALL_VISUAL_SCREENS.has(target)){
              if(typeof window.ensureRequiredFootballVisualExperience !== "function"){
                  throw new Error("Required football presentation loader is unavailable.");
              }
              await window.ensureRequiredFootballVisualExperience();
          }
          '''
          if old_nav not in screens:
              raise SystemExit('Create Showdown visual warm-up block missing.')
          screens = screens.replace(old_nav, new_nav, 1)

          old_resume = '''        if(!saved){
              currentShowdown = null;
              resetNavigationState();
              showScreen("createShowdown");
              return;
          }
          '''
          new_resume = '''        if(!saved){
              currentShowdown = null;
              resetNavigationState();
              if(typeof window.ensureRequiredFootballVisualExperience !== "function"){
                  throw new Error("Required football presentation loader is unavailable.");
              }
              await window.ensureRequiredFootballVisualExperience();
              showScreen("createShowdown");
              return;
          }
          '''
          if old_resume not in screens:
              raise SystemExit('Resume-without-save block missing.')
          screens = screens.replace(old_resume, new_resume, 1)
          screens_path.write_text(screens)

          menu_path = Path('js/menuExperience.js')
          menu = menu_path.read_text()
          start = menu.find('function scheduleMarcoReusImageLoad(){')
          end = menu.find('\nfunction ensureMarcoReusTreatment(){', start)
          if start < 0 or end < 0:
              raise SystemExit('Reus idle scheduler block not found.')
          menu = menu[:start] + menu[end+1:]
          menu = menu.replace('        image.loading = "lazy";\n        image.fetchPriority = "low";\n        image.dataset.src = MARCO_REUS_IMAGE.thumbnail;\n', '        image.loading = "eager";\n        image.fetchPriority = "high";\n        image.src = MARCO_REUS_IMAGE.thumbnail;\n', 1)
          menu = menu.replace('    scheduleMarcoReusImageLoad();\n', '', 2)
          menu_path.write_text(menu)

          css_path = Path('css/footballVisuals.css')
          css = css_path.read_text().replace(
              '   Lazy screen-level photography with FIFA-17-era geometry.',
              '   Required screen photography with FIFA-17-era geometry.'
          )
          css_path.write_text(css)

          notices_path = Path('THIRD_PARTY_NOTICES.md')
          notices = notices_path.read_text()
          notices = notices.replace(
              'The following images are optional screen-level presentation assets. They are stored locally, loaded only when their relevant screen is opened, and never form part of gameplay logic or the initial application shell.',
              'The following images are required screen-level presentation assets. They are stored locally and proactively warmed after the critical application shell starts so the intended football presentation is ready before its destination screens are used. They do not own gameplay logic or saved data.'
          )
          notices_path.write_text(notices)

          print('Required football presentation architecture prepared.')
          PY

      - name: Remove one-shot migration workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-required-football-visual-architecture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/optionalModules.js js/screens.js js/menuExperience.js css/footballVisuals.css THIRD_PARTY_NOTICES.md .github/workflows/apply-required-football-visual-architecture.yml
          git commit -m 'Make licensed football photography required presentation'
          git push origin HEAD:agent/licensed-football-visual-system-r1
