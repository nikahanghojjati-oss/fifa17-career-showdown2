name: R5 Apply Runtime Revision

on:
  push:
    branches: [agent/r5-smart-player-photo-rebuild]
    paths:
      - 'tools/apply_r5_runtime_revision.py'
      - '.github/workflows/r5-apply-runtime-revision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/r5-smart-player-photo-rebuild
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply r5 identity integration in workspace
        run: python tools/apply_r5_runtime_revision.py
      - name: Upload generated permanent validators
        uses: actions/upload-artifact@v7
        with:
          name: r5-generated-validator-files-${{ github.sha }}
          path: |
            .github/workflows/validate-football-visuals.yml
            .github/workflows/validate-final-polish.yml
            .github/workflows/validate-menu-bootstrap.yml
            .github/workflows/validate-static-app.yml
            .github/workflows/validate-v1-visual-immersion.yml
          if-no-files-found: error
          retention-days: 3
