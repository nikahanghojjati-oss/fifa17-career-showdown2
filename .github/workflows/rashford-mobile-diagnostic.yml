name: Rashford Mobile Rendering Diagnostic

on:
  push:
    branches: [agent/v110-rashford-mobile-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect Rashford mobile render
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-rashford-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const {resolveChromiumRuntime}=require('./tests/support/chromium-runtime.cjs');
          const base='http://127.0.0.1:4173/';
          (async()=>{
            const runtime=await resolveChromiumRuntime();
            const browser=await chromium.launch({executablePath:runtime.executablePath,args:runtime.args,headless:true});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const page=await context.newPage();
              await page.goto(base,{waitUntil:'domcontentloaded'});
              await page.locator('#loadingScreen').waitFor({state:'hidden',timeout:12000});
              await page.waitForFunction(()=>typeof window.ensureFootballVisualsModule==='function',{timeout:12000});
              await page.evaluate(async()=>{
                await window.ensureFootballVisualsModule();
                await window.ensureGameplayModules();
                currentShowdown={
                  id:1700000000000,schemaVersion:2,name:'Diagnostic',status:'Ready',currentRound:1,totalRounds:1,
                  managers:{playerOne:'Alex',playerTwo:'Jordan'},selectedLeague:{id:'premier-league',name:'Premier League'},
                  clubs:{playerOne:'Arsenal',playerTwo:'Chelsea'},score:{playerOne:0,playerTwo:0},transferChallenges:[],rounds:[]
                };
                showScreen('transferChallenge',false);
                if(typeof renderTransferChallenge==='function') renderTransferChallenge();
              });
              await page.waitForFunction(()=>{
                const p=document.querySelector('[data-football-visual-asset="marcus-rashford-man-utd-2017-smart-r5"]');
                const i=p?.querySelector('.footballVisualMedia');
                return p?.classList.contains('imageLoaded')&&i?.complete&&i.naturalWidth>0;
              },null,{timeout:12000});
              const info=await page.evaluate(()=>{
                const p=document.querySelector('[data-football-visual-asset="marcus-rashford-man-utd-2017-smart-r5"]');
                const f=p.querySelector('.footballVisualMediaFrame');
                const i=p.querySelector('.footballVisualMedia');
                const ps=getComputedStyle(p),fs=getComputedStyle(f),is=getComputedStyle(i);
                const ir=i.getBoundingClientRect(),fr=f.getBoundingClientRect(),pr=p.getBoundingClientRect();
                const centerX=fr.left+fr.width*.75, centerY=fr.top+fr.height*.35;
                const hit=document.elementFromPoint(centerX,centerY);
                const parents=[]; let n=i;
                while(n&&n!==document.body){
                  const s=getComputedStyle(n); parents.push({tag:n.tagName,cls:n.className,display:s.display,visibility:s.visibility,opacity:s.opacity,z:s.zIndex,transform:s.transform,contentVisibility:s.contentVisibility});n=n.parentElement;
                }
                return {
                  panelClass:p.className,panelRect:pr.toJSON(),panelDisplay:ps.display,panelVisibility:ps.visibility,panelOpacity:ps.opacity,
                  frameRect:fr.toJSON(),frameDisplay:fs.display,frameVisibility:fs.visibility,frameOpacity:fs.opacity,frameZ:fs.zIndex,frameBg:fs.background,
                  imageRect:ir.toJSON(),imageDisplay:is.display,imageVisibility:is.visibility,imageOpacity:is.opacity,imageZ:is.zIndex,imagePosition:is.position,
                  imageObjectFit:is.objectFit,imageObjectPosition:is.objectPosition,imageTransform:is.transform,imageClip:is.clipPath,imageSrc:i.currentSrc,
                  natural:[i.naturalWidth,i.naturalHeight],complete:i.complete,hit:hit?{tag:hit.tagName,cls:hit.className,id:hit.id}:null,parents
                };
              });
              console.log('RASHFORD_MOBILE_DIAGNOSTIC='+JSON.stringify(info,null,2));
              fs.mkdirSync('test-results',{recursive:true});
              await page.screenshot({path:'test-results/rashford-mobile-before.png',fullPage:true});
              await page.evaluate(()=>{
                const i=document.querySelector('[data-football-visual-asset="marcus-rashford-man-utd-2017-smart-r5"] .footballVisualMedia');
                i.style.position='relative';i.style.zIndex='2';i.style.visibility='visible';i.style.display='block';i.style.opacity='1';i.style.transform='translateZ(0)';
              });
              await page.screenshot({path:'test-results/rashford-mobile-forced-paint.png',fullPage:true});
              await context.close();
            }finally{if(browser.isConnected())await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: rashford-mobile-diagnostic-${{ github.sha }}
          path: test-results/*.png
          if-no-files-found: error
          retention-days: 2
