name: Validate POS5 Operations

on:
  pull_request:
    paths:
      - "PROJECT_OPERATING_SYSTEM_V5.md"
      - "PROJECT_OPERATING_SYSTEM_V5.json"
      - "NEXT_TASK.md"
      - "CURRENT_PRODUCT_TEST_MANIFEST.json"
      - "package.json"
      - "scripts/pos5-*.mjs"
      - "scripts/build-developer-relay-file.mjs"
      - "scripts/build-recovery-beacon.mjs"
      - "tests/contracts/pos5-*.cjs"
      - "tests/contracts/project-operating-system-v5-contracts.cjs"
      - "tests/support/run-operations-audit.cjs"
      - "tests/support/run-current-product-contracts.cjs"
      - "tests/support/run-pos5-product-suite.cjs"
      - ".github/workflows/validate-pos5-operations.yml"
  push:
    branches: [main]
    paths:
      - "PROJECT_OPERATING_SYSTEM_V5.md"
      - "PROJECT_OPERATING_SYSTEM_V5.json"
      - "NEXT_TASK.md"
      - "CURRENT_PRODUCT_TEST_MANIFEST.json"
      - "package.json"
      - "scripts/pos5-*.mjs"
      - "scripts/build-developer-relay-file.mjs"
      - "scripts/build-recovery-beacon.mjs"
      - "tests/contracts/pos5-*.cjs"
      - "tests/contracts/project-operating-system-v5-contracts.cjs"
      - "tests/support/run-operations-audit.cjs"
      - "tests/support/run-current-product-contracts.cjs"
      - "tests/support/run-pos5-product-suite.cjs"
      - ".github/workflows/validate-pos5-operations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos5-operations-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  operations-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate POS5 policy, transition, relay, risk routing and gate purity
        run: npm run test:ops
