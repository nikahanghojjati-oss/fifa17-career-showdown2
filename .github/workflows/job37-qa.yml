name: Job 37 League QA
on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - '.github/workflows/job37-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install pillow numpy scikit-image
      - name: Start local server
        run: |
          python3 -m http.server 8765 >/tmp/job37-http.log 2>&1 &
          sleep 2
      - name: League native QA
        continue-on-error: true
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          node visual-assets/v10_1/league/tools/render-qa.cjs
      - name: Native QA diagnostics
        run: |
          python3 - <<'PY'
          import json
          p='visual-assets/v10_1/league/evidence/qa_report.json'
          r=json.load(open(p))
          shown=set()
          for x in r.get('results',[]):
              fails=x.get('fail',[])
              kinds=[]
              for f in fails:
                  if f=='G5': kinds.append('G5')
                  elif f=='G7': kinds.append('G7')
                  elif f=='G3': kinds.append('G3')
                  elif f=='G4': kinds.append('G4')
                  elif str(f).startswith('G8'): kinds.append('G8')
              for kind in kinds:
                  if kind in shown: continue
                  shown.add(kind)
                  print(x.get('shot',{}).get('file'), kind, fails)
                  if kind=='G5': print(' ', x.get('G5'))
                  if kind=='G7': print(' ', x.get('G7fails'))
                  if kind=='G3': print(' ', x.get('G3'))
                  if kind=='G4': print(' ', x.get('G4'))
                  if kind=='G8': print(' ', x.get('G8'))
          PY
      - name: Factory QA
        continue-on-error: true
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          FACTORY_QA_OUT: visual-assets/v10_1/league/evidence/hands/factory-qa
        run: |
          node visual-assets/v10_1/shared/tools/factory-qa.cjs             http://127.0.0.1:8765/visual-assets/v10_1/league/             visual-assets/v10_1/league L1,L2,L3,L4
          python3 - <<'PY'
          import json
          p='visual-assets/v10_1/league/evidence/hands/factory-qa/qa_report.json'
          r=json.load(open(p))
          print('factory-qa', 'PASS' if r.get('pass') else 'FAIL', json.dumps(r.get('failingRuns',[])))
          for x in r.get('results',[]):
              bad={k:v for k,v in x.get('gates',{}).items() if not v.get('pass')}
              if bad:
                  print(x.get('viewport',{}).get('label'), bad)
                  break
          PY
      - name: Job 37 contact and layout gates
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const OUT='visual-assets/v10_1/league/evidence/hands';
          fs.mkdirSync(OUT,{recursive:true});
          const desktop=[[1366,768],[1920,1080],[1366,640]];
          const phone=[[393,660],[360,640],[375,553]];
          const frames=['L1','L2','L3','L4'];
          const result={desktop:[],phone:[],consoleErrors:[],failedRequests:[],failures:[]};
          const fail=(msg)=>result.failures.push(msg);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for(const [w,h] of desktop){
                for(const frame of frames){
                  const p=await browser.newPage({viewport:{width:w,height:h}});
                  const errors=[]; const failed=[];
                  p.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
                  p.on('requestfailed',r=>failed.push(r.url()));
                  await p.goto('http://127.0.0.1:8765/visual-assets/v10_1/league/index.html?frame='+frame,{waitUntil:'networkidle'});
                  await p.waitForFunction(()=>window.__leagueReady===true);
                  const m=await p.evaluate(()=>{
                    const wheel=document.getElementById('leagueWheel').getBoundingClientRect();
                    const note=document.getElementById('leagueStateNote');
                    const nb=note.classList.contains('hidden')?null:note.getBoundingClientRect();
                    const T=window.LeagueV1.T;
                    const fx=T.ox+532.5*T.k, fy=T.oy+457*T.k;
                    const cx=wheel.left+wheel.width/2, cy=wheel.top+wheel.height/2, r=wheel.width/2;
                    const dy=fy-cy;
                    const edge=cx-Math.sqrt(Math.max(0,r*r-dy*dy));
                    const overlap=fx-edge;
                    const rim=document.querySelector('.wheel-rim-art img');
                    const title=getComputedStyle(document.querySelector('#leagueWheelScreen h2'));
                    return {
                      overlap, wheel:{left:wheel.left,top:wheel.top,right:wheel.right,bottom:wheel.bottom,width:wheel.width},
                      note:nb?{top:nb.top,bottom:nb.bottom}:null,
                      noteClear:nb?nb.top-wheel.bottom:null,
                      contactDataset:document.getElementById('stage-root').dataset.contactOverlap,
                      wheelScale:document.getElementById('stage-root').dataset.wheelScale,
                      onSlot:document.getElementById('stage-root').dataset.onSlot,
                      rimLoaded:!!rim && rim.complete && rim.naturalWidth>0,
                      titleFont:title.fontFamily,
                      titleFilter:title.filter,
                      pageScroll:document.documentElement.scrollHeight-innerHeight
                    };
                  });
                  if(m.overlap<1.9||m.overlap>4.1) fail(frame+' '+w+'x'+h+' contact '+m.overlap);
                  if(!m.rimLoaded) fail(frame+' '+w+'x'+h+' rim asset not loaded');
                  if(!/Kaushan/i.test(m.titleFont)) fail(frame+' '+w+'x'+h+' title fallback not brush display font');
                  if(m.note && m.noteClear < 7) fail(frame+' '+w+'x'+h+' note/rim clearance '+m.noteClear);
                  if(errors.length||failed.length) fail(frame+' '+w+'x'+h+' browser errors '+errors.join('|')+' failed '+failed.join('|'));
                  result.desktop.push({frame,viewport:[w,h],...m});
                  if(frame==='L1') await p.screenshot({path:OUT+'/L1_'+w+'x'+h+'.png'});
                  await p.close();
                }
              }
              for(const [w,h] of phone){
                for(const frame of frames){
                  const p=await browser.newPage({viewport:{width:w,height:h}});
                  await p.goto('http://127.0.0.1:8765/visual-assets/v10_1/league/index.html?frame='+frame,{waitUntil:'networkidle'});
                  await p.waitForFunction(()=>window.__leagueReady===true);
                  const m=await p.evaluate(()=>{
                    const spin=document.getElementById('spinLeague').getBoundingClientRect();
                    const stage=document.getElementById('stage-root');
                    const bezel=document.querySelector('.wheel-bezel').getBoundingClientRect();
                    const note=document.getElementById('leagueStateNote');
                    const nb=note.classList.contains('hidden')?null:note.getBoundingClientRect();
                    const wheel=document.getElementById('leagueWheel').getBoundingClientRect();
                    return {
                      scroll:document.documentElement.scrollHeight-innerHeight,
                      spinBottom:spin.bottom,spinVisible:spin.top>=0&&spin.bottom<=innerHeight,
                      handVisible:stage.dataset.handVisible,
                      fingerDisplay:getComputedStyle(document.querySelector('.finger-ovl')).display,
                      contactDisplay:getComputedStyle(document.querySelector('.finger-contact')).display,
                      contactOverlap:+stage.dataset.contactOverlap,
                      bezel:{left:bezel.left,right:bezel.right},
                      noteClear:nb?nb.top-wheel.bottom:null
                    };
                  });
                  if((w===393||w===360) && m.scroll>1) fail(frame+' '+w+'x'+h+' unexpected scroll '+m.scroll);
                  if(w===375 && !m.spinVisible) fail(frame+' 375x553 primary action not visible');
                  if(m.handVisible!=='true'||m.fingerDisplay==='none'||m.contactDisplay==='none') fail(frame+' '+w+' phone hand/contact missing');
                  if(m.contactOverlap<1.9||m.contactOverlap>4.1) fail(frame+' '+w+' phone contact '+m.contactOverlap);
                  if(m.bezel.left<-1||m.bezel.right>w+1) fail(frame+' '+w+' phone bezel out of bounds '+JSON.stringify(m.bezel));
                  if(m.noteClear!==null&&m.noteClear<7) fail(frame+' '+w+' phone note/rim clearance '+m.noteClear);
                  result.phone.push({frame,viewport:[w,h],...m});
                  await p.close();
                }
              }
              fs.writeFileSync(OUT+'/qa_job37.json',JSON.stringify(result,null,2)+'\n');
              if(result.failures.length) throw new Error(result.failures.join(' || '));
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Preserve contact diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f visual-assets/v10_1/league/evidence/hands/qa_job37.json; then
            git add visual-assets/v10_1/league/evidence/hands/qa_job37.json
            git diff --cached --quiet || git commit -m "Job 37 step 7/7: contact diagnostics"
            git push origin HEAD:factory/v1-wtt5ye
          fi
      - name: Goal compare and 4x fingertip proof
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          out=Path('visual-assets/v10_1/league/evidence/hands')
          goal=Image.open('project-documents/factory/mockups/GOAL_LEAGUE.jpg').convert('RGB')
          build=Image.open(out/'L1_1366x768.png').convert('RGB')
          # same-height comparison
          g=goal.resize((round(goal.width*768/goal.height),768))
          canvas=Image.new('RGB',(g.width+build.width,768),'black')
          canvas.paste(g,(0,0)); canvas.paste(build,(g.width,0))
          canvas.save(out/'COMPARE_GOAL_BUILD.png')
          # 4x logical zoom around Daniel fingertip/wheel contact, goal left and build right.
          gx,gy=532.5,457.0
          bx,by=gx*(1366/1536),gy*(1366/1536)
          gc=goal.crop((470,400,570,510)).resize((400,440),Image.Resampling.NEAREST)
          bc=build.crop((int(bx-62),int(by-57),int(bx+50),int(by+53))).resize((448,440),Image.Resampling.NEAREST)
          z=Image.new('RGB',(gc.width+bc.width,440),'black'); z.paste(gc,(0,0)); z.paste(bc,(gc.width,0))
          z.save(out/'FINGERTIP_4X.png')
          PY
          python3 visual-assets/v10_1/shared/tools/mockup_diff.py             --mockup visual-assets/v10_1/league/assets/REF_GOAL_LEAGUE.jpg             --build visual-assets/v10_1/league/evidence/hands/L1_1920x1080.png             --plate visual-assets/v10_1/league/assets/ENV_LEAGUE_PLATE_V1_1X.webp             --platemap visual-assets/v10_1/league/assets/platemap.json             --out visual-assets/v10_1/league/evidence/hands/mockup-diff
          python3 - <<'PY'
          import json
          p='visual-assets/v10_1/league/evidence/hands/mockup-diff/scores.json'
          r=json.load(open(p))
          if not r.get('gate',{}).get('PASS'):
              raise SystemExit('H10 failed: '+json.dumps(r))
          print('H10 PASS')
          PY
      - name: Commit evidence and remove transient workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/job37-qa.yml
          git add -A .github/workflows/job37-qa.yml visual-assets/v10_1/league/evidence
          git commit -m "Job 37 step 7/7: QA evidence"
          git push origin HEAD:factory/v1-wtt5ye
