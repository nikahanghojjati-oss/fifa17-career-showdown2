name: Temporary v1.1.3 Reduced Motion Diagnostic

on:
  push:
    branches:
      - v1.1.3-candidate-c-visual-fixes
    paths:
      - .github/workflows/temporary-diagnose-v113-motion.yml

permissions:
  contents: read

jobs:
  diagnose-motion-cascade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect reduced-motion cascade on James visual
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-motion-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          const { resolveChromiumRuntime } = require('./tests/support/chromium-runtime.cjs');
          (async () => {
            const runtime = await resolveChromiumRuntime();
            const browser = await chromium.launch({ executablePath: runtime.executablePath, args: runtime.args, headless: true });
            const context = await browser.newContext({ viewport: { width: 940, height: 700 } });
            const page = await context.newPage();
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.locator('#loadingScreen').waitFor({ state: 'hidden', timeout: 12000 });
            await page.waitForFunction(() => typeof window.getFootballVisualDiagnostics === 'function' && window.getFootballVisualDiagnostics().initialized === true, null, { timeout: 12000 });
            await page.evaluate(() => {
              document.querySelectorAll('main .screen').forEach(screen => { screen.classList.add('hidden'); screen.setAttribute('aria-hidden', 'true'); });
              if(!window.prepareFootballVisualScreen('createShowdown')) throw new Error('James visual failed to mount');
              const target = document.getElementById('createShowdown');
              target.classList.remove('hidden');
              target.setAttribute('aria-hidden', 'false');
            });
            await page.waitForFunction(() => {
              const image = document.querySelector('#createShowdown .footballVisualMedia');
              return image && image.complete && image.naturalWidth > 0;
            }, null, { timeout: 12000 });
            const report = await page.evaluate(() => {
              const image = document.querySelector('#createShowdown .footballVisualMedia');
              const styleLinks = [...document.querySelectorAll('link[rel="stylesheet"]')].map((link, index) => ({
                index,
                href: link.getAttribute('href'),
                optional: link.dataset.optionalStyle || null,
                loaded: Boolean(link.sheet)
              }));
              const rules = [];
              for(const sheet of [...document.styleSheets]){
                let cssRules;
                try{ cssRules = [...sheet.cssRules]; }catch{ continue; }
                for(const rule of cssRules){
                  const text = rule.cssText || '';
                  if(text.includes('footballVisualMedia') && (text.includes('transition') || text.includes('prefers-reduced-motion'))){
                    rules.push({ href: sheet.href, text });
                  }
                }
              }
              return {
                mediaMatches: matchMedia('(prefers-reduced-motion: reduce)').matches,
                rootMotion: document.documentElement.dataset.motionReduced || null,
                transition: getComputedStyle(image).transition,
                transitionDuration: getComputedStyle(image).transitionDuration,
                transitionProperty: getComputedStyle(image).transitionProperty,
                styleLinks,
                rules
              };
            });
            console.log(JSON.stringify(report, null, 2));
            if(!report.mediaMatches) throw new Error('Playwright reduced-motion emulation did not match');
            if(!report.styleLinks.some(link => String(link.href).includes('footballVisuals.css') && link.loaded)) throw new Error('base football visual stylesheet not loaded');
            if(!report.styleLinks.some(link => String(link.href).includes('footballVisuals-v113.css') && link.loaded)) throw new Error('v1.1.3 football visual stylesheet not loaded');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
