name: PR260 paired reload authority proof
on:
  push:
    branches: [feat/persistent-nik-daniel-pair]
    paths: [.github/workflows/pr260-paired-reload-authority.yml]
permissions:
  contents: write
jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Patch lazy Save Library activation before active-pair recovery classification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/persistentNikDanielPair.js')
          s=p.read_text()
          marker='  async function pairInitialize(options={})'
          helper='''  async function pairEnsureSaveLibraryAuthority(){const runtime=root.CareerModeSaveLibraryRuntime;if(runtime?.isReady?.())return runtime;if(typeof root.loadRuntimeScript!=="function")throw pairErrorWithCode("PERSISTENT_PAIR_STORAGE_UNAVAILABLE","Local career storage is unavailable.");await root.loadRuntimeScript("save-library-cutover","js/saveLibraryCutover.js",()=>typeof root.ensureSaveLibraryRuntimeAuthority==="function");await root.ensureSaveLibraryRuntimeAuthority();const active=root.CareerModeSaveLibraryRuntime;if(!active?.isReady?.())throw pairErrorWithCode("PERSISTENT_PAIR_STORAGE_UNAVAILABLE","Local career storage could not be activated.");return active;}\n\n'''
          if helper.strip() not in s:
              if marker not in s: raise SystemExit('pairInitialize marker missing')
              s=s.replace(marker,helper+marker,1)
          old='const localRecoveryReady=pairHasExactLocalRecoveryCopy(link.managerRole,link.providerSaveId,link.providerProfileId),active=link.connectionState==="active";'
          new='const active=link.connectionState==="active";if(active)await pairEnsureSaveLibraryAuthority();const localRecoveryReady=active&&pairHasExactLocalRecoveryCopy(link.managerRole,link.providerSaveId,link.providerProfileId);'
          if old not in s: raise SystemExit('recovery classification seam missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/contracts/persistent-nik-daniel-pair-contracts.cjs')
          s=p.read_text()
          anchor="assert.match(pairSource,/pairExactLocalBindingForProviderSlot/);"
          insert="""assert.match(pairSource,/async function pairEnsureSaveLibraryAuthority\\(\\)[\\s\\S]*loadRuntimeScript\\(\"save-library-cutover\",\"js\\/saveLibraryCutover\\.js\"[\\s\\S]*ensureSaveLibraryRuntimeAuthority/,'A remembered active pair must lazily activate established Save Library authority before deciding Continue versus Recovery.');\nconst initializeFunction=pairSource.slice(pairSource.indexOf('async function pairInitialize'),pairSource.indexOf('function pairSelectedRole'));\nassert.match(initializeFunction,/if\\(active\\)await pairEnsureSaveLibraryAuthority\\(\\);[\\s\\S]*pairHasExactLocalRecoveryCopy/,'Active-pair reload classification must activate local authority before checking the provider-linked Save/Profile copy.');\n"""
          if insert.strip() not in s:
              if anchor not in s: raise SystemExit('contract anchor missing')
              s=s.replace(anchor,anchor+'\n'+insert,1)
          p.write_text(s)

          p=Path('tests/browser/persistent-pair-user-facing-routing-audit.cjs')
          s=p.read_text()
          anchor='''    await page.waitForFunction(()=>window.__continueOpened===1,null,{timeout:3000});\n\n    // Fresh-browser active-pair recovery must expose and route a real OPEN RECOVERY control.'''
          insert='''    await page.waitForFunction(()=>window.__continueOpened===1,null,{timeout:3000});\n\n    // A remembered ACTIVE pair on a normal browser reload must activate lazy Save Library authority before classifying local recovery.\n    const reloadAuthority=await page.evaluate(async({saveId,profileId,playerOneProfileId})=>{\n      window.__pairProviderMode="active-recovery";\n      const originalLoader=window.loadRuntimeScript,originalSaveRuntime=window.CareerModeSaveLibraryRuntime,originalEnsure=window.ensureSaveLibraryRuntimeAuthority;\n      delete window.CareerModeSaveLibraryRuntime;\n      delete window.ensureSaveLibraryRuntimeAuthority;\n      let ready=false,activationCount=0;\n      const prepared=()=>({name:"Daniel vs Nik",managers:{playerOne:"Daniel",playerTwo:"Nik"},totalRounds:5,currentRound:1,status:"Created",selectedLeague:null,clubs:{playerOne:null,playerTwo:null},score:{playerOne:0,playerTwo:0},transferChallenges:[],rounds:[],sharedJourney:{contractVersion:1,mode:"shared",setupPending:false},identity:{saveId,managerProfileIds:{playerOne:playerOneProfileId,playerTwo:profileId}}});\n      window.loadRuntimeScript=async(key,path,check)=>{\n        if(key!=="save-library-cutover")return originalLoader(key,path,check);\n        window.CareerModeSaveLibraryRuntime={isReady:()=>ready,getLibrarySnapshot:()=>ready?{activeSaveId:saveId,saves:[{saveId,showdown:prepared()}]}:null,switchActiveSave:async()=>true};\n        window.ensureSaveLibraryRuntimeAuthority=async()=>{activationCount+=1;ready=true;return true;};\n        return true;\n      };\n      try{\n        const next=await window.CareerModePersistentNikDanielPair.initialize({force:true});\n        return{status:next.status,activationCount,recoveryReady:next.status==="paired"};\n      }finally{\n        window.loadRuntimeScript=originalLoader;\n        window.CareerModeSaveLibraryRuntime=originalSaveRuntime;\n        if(originalEnsure===undefined)delete window.ensureSaveLibraryRuntimeAuthority;else window.ensureSaveLibraryRuntimeAuthority=originalEnsure;\n      }\n    },{saveId,profileId,playerOneProfileId});\n    assert.deepEqual(reloadAuthority,{status:"paired",activationCount:1,recoveryReady:true},"A normal paired-browser reload must restore Continue authority rather than falsely requiring recovery.");\n    await page.locator("#persistentNikDanielPairPanel",{hasText:"CAREER READY"}).waitFor({state:"visible",timeout:5000});\n    await page.locator("#persistentNikDanielPairPanel button",{hasText:"CONTINUE CAREER"}).waitFor({state:"visible"});\n    assert.equal(await page.locator("#persistentNikDanielPairPanel",{hasText:"CAREER RECOVERY NEEDED"}).count(),0,"A valid local paired reload must not show false recovery UI.");\n\n    // Fresh-browser active-pair recovery must expose and route a real OPEN RECOVERY control.'''
          if anchor not in s: raise SystemExit('browser reload insertion anchor missing')
          s=s.replace(anchor,insert,1)
          p.write_text(s)
          PY
      - name: Prove contracts and real paired reload routing
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node -c js/persistentNikDanielPair.js
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          node tests/contracts/save-library-runtime-contracts.cjs
          node tests/contracts/static-app-release-contracts.cjs
          npm run serve:test > /tmp/pr260-reload-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          npm run test:persistent-pair-routing
          node tests/browser/shared-showdown-paired-first-entry-audit.cjs
      - name: Publish only proved permanent changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/persistentNikDanielPair.js tests/contracts/persistent-nik-daniel-pair-contracts.cjs tests/browser/persistent-pair-user-facing-routing-audit.cjs
          git diff --cached --check
          git commit -m "fix(pr260): activate local authority before paired reload recovery check"
          git push origin HEAD:feat/persistent-nik-daniel-pair
