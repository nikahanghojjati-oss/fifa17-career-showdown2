name: v1.0.2 Authority Blob Builder

on:
  push:
    branches:
      - agent/v1.0.2-footballer-tile-maintenance
    paths:
      - '.github/workflows/v102-authority-blob-builder.yml'
      - 'tools/build_v102_authority_blobs.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build remote Git blobs for permanent authority updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_v102_authority_blobs.py
