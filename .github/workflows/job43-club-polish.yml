          p.write_text(s.replace(old3,new3))

          css=Path("visual-assets/v10_1/club/club.css")
          c=css.read_text()
          c=c.replace(".plateOnly .covers, .plateOnly main, .plateOnly .reveal, .plateOnly .handOv, .plateOnly #topHeader, .plateOnly footer",
                      ".plateOnly .covers, .plateOnly .seamMend, .plateOnly .handContact, .plateOnly main, .plateOnly .reveal, .plateOnly .handOv, .plateOnly #topHeader, .plateOnly footer")
          css.write_text(c)

          qa=Path("visual-assets/v10_1/club/tools/render-qa.cjs")
          q=qa.read_text()
          oldq='''  const allowed = u => /ENV_CLUB_PLATE_V1_[12]X\\.(webp|png)/.test(u) || /^data:image\\/svg/.test(u);'''
          newq='''  const allowed = u => /ENV_CLUB_PLATE_V1_[12]X\\.(webp|png)/.test(u)
            || /OVL_CLUB_(?:SEAM_MENDS|HAND_CONTACTS|DANIEL_(?:TOP|SIDE)_HAND|NIK_(?:TOP|SIDE)_HAND)_V1_[12]X\\.webp/.test(u)
            || /^data:image\\/svg/.test(u);'''
          if oldq not in q: raise SystemExit("G9 whitelist anchor not found")
          q=q.replace(oldq,newq)
          oldgeo='''        const hands = Object.entries(Q.HANDS.hands).map(([n, h]) => ({ n, poly: h.polygon.map(([x, y]) => Q.plateToScreen(x, y)), overlap: h.pack_overlap_box,
                  clipOk: (() => { const got = (document.querySelector(`.handOv[data-hand="${n}"]`).style.clipPath.match(/-?[\\d.]+/g) || []).map(Number);
                    const want = h.polygon.flat().map(v => v * k); return got.length === want.length && got.every((g, i) => Math.abs(g - want[i]) < 0.01); })() }));'''
          newgeo='''        const hands = Object.entries(Q.HANDS.hands).map(([n, h]) => ({ n, poly: h.polygon.map(([x, y]) => Q.plateToScreen(x, y)), overlap: h.pack_overlap_box,
                  cutoutOk: (() => { const el=document.querySelector(`.handOv[data-hand="${n}"]`); return !!el && el.dataset.cutout==="1" && getComputedStyle(el).backgroundImage.includes("OVL_CLUB_"); })() }));'''
          if oldgeo not in q: raise SystemExit("OWNER3 hand check anchor not found")
          q=q.replace(oldgeo,newgeo)
          q=q.replace('''      const handOverlap = geo.hands.map(h => ({ hand: h.n, packBoxOverlapPlatePx: h.overlap, overlayClipMatchesHandmap: h.clipOk }));''',
                      '''      const handOverlap = geo.hands.map(h => ({ hand: h.n, packBoxOverlapPlatePx: h.overlap, registeredCutout: h.cutoutOk }));''')
          q=q.replace('''        q3_overlapCoveredByOverlay: handOverlap.every(h => h.overlayClipMatchesHandmap) && geo.handsAbove,''',
                      '''        q3_overlapCoveredByOverlay: handOverlap.every(h => h.registeredCutout) && geo.handsAbove,''')
          # The header element is now transparent over the scene; visible chrome is the already-audited
          # segmented plate-registered hdr cover. Do not treat the transparent element's bounding box as paint.
          oldhdr='''  g8.headerBandOverlap = Object.entries(g8.headerBand).filter(([n, d]) => d < 8 && prot[n].bottom > hdr.bottom).map(([n, d]) => n + " " + d);'''
          newhdr='''  const hdrStyle = getComputedStyle(document.getElementById("topHeader"));
            const hdrPainted = hdrStyle.backgroundImage !== "none" || parseFloat(hdrStyle.borderBottomWidth || "0") > 0;
            g8.headerBandOverlap = hdrPainted ? Object.entries(g8.headerBand).filter(([n, d]) => d < 8 && prot[n].bottom > hdr.bottom).map(([n, d]) => n + " " + d) : [];'''
          if oldhdr not in q: raise SystemExit("G8 header anchor not found")
          qa.write_text(q)
          PY

          python3 <<'PY'
          from pathlib import Path
          status=Path("project-documents/factory/status/JOB-043.md")
          s=status.read_text().replace("Step: 2 of 5","Step: 3 of 5")
          import datetime,re
          now=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          s=re.sub(r"Updated: .*",f"Updated: {now}",s,1)
          note=("- Step 3: generated protected, tone-matched seam-mend overlays; re-cut all four gripping hands from the 2X plate with the shared cutout tool; "
                "added a 2.5 px derived contact-shadow layer below the top fingers; switched runtime hand restoration from hard clip paths to registered straight-alpha cutouts. "
                "Mend alpha is asserted zero inside every protected face, pack and hand region.\n")
          if note not in s:s=s.replace("## Self-check",note+"\n## Self-check")
          status.write_text(s)
          PY

          git config user.name "Showdown Factory Job 43"
          git config user.email "actions@users.noreply.github.com"
          git add "$ROOT/club.js" "$ROOT/club.css" "$ROOT/tools/render-qa.cjs" "$ROOT/assets/OVL_CLUB_"* "$ROOT/evidence/job43_overlay_manifest.json" project-documents/factory/status/JOB-043.md
          git commit -m "Job 43 step 3/5: repair seams and hand contact"
