          - **Seams:** six residual intake seams adjacent to protected faces/hands/packs are repaired by a registered transparent tone-matched overlay. Its alpha is zero inside every protected face, pack and hand region. Evidence: `evidence/edges_before/DEFECTS.md` and `evidence/EDGES_BEFORE_AFTER.png`.
          - **Hands/contact:** all four gripping hands are straight-alpha cutouts made from the genuine 2X Club plate by `shared/tools/cutout.py`. Runtime hard polygon clipping is removed. A shadow derived from the top-hand alpha is offset 2.5 logical px and blurred 2.5 px on the pack beneath each curled finger.
          - **QA:** 60/60 Club shots pass G1–G12; plate SHA gate remains PASS. OWNER-3 reveal containment/restoration remains green: every tested hand overlay is full-canvas registered, every reveal has 0 changed pixels inside the eroded hand polygons, and registration error is <0.05 px. Full report: `evidence/job43_qa_report.json`.
          """
          if "## JOB-043 registration, face, hand and seam polish" not in text:
              build.write_text(text.rstrip()+section+"\n")
          status=Path("project-documents/factory/status/JOB-043.md")
          s=status.read_text().replace("State: IN PROGRESS","State: DONE").replace("Step: 4 of 5","Step: 5 of 5")
          now=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          s=re.sub(r"Updated: .*",f"Updated: {now}",s,1)
          note="- Step 5: full Club render-qa re-run is green: 60/60 shots pass G1–G12, plate SHA PASS, and OWNER-3 hand restoration reports zero reveal pixels above the hands with <0.05 px registration error. BUILD_RESULT.md updated.\n"
          if note not in s:s=s.replace("## Self-check",note+"\n## Self-check")
          checks="""- PASS: At 400% the listed face-adjacent, hand-adjacent and pack-adjacent seam boxes have registered tone-matched repairs; before/after evidence is `visual-assets/v10_1/club/evidence/EDGES_BEFORE_AFTER.png`.
          - PASS: All four hand overlays are shared-tool cutouts; the top-finger contact layer is derived from the hand alpha, offset and blurred 2.5 logical px beneath the fingers.
          - PASS: Only JOB-043 Club source/evidence/assets, its status, and this temporary runner were changed; the runner deletes itself in the final commit.
          - PASS: Daniel remains left and Nik right. New raster assets contain only pixels cut from the approved Club plate or transparent/black repair layers; no real logos, trophies, players, or live/private data were added.
          """
          s=re.sub(r"## Self-check\n.*?\n## Blocked question", "## Self-check\n\n"+checks+"\n## Blocked question", s, flags=re.S)
          status.write_text(s)
          PY

          git config user.name "Showdown Factory Job 43"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/job43-club-polish.yml
          git add "$ROOT/BUILD_RESULT.md" "$ROOT/evidence/job43_qa_report.json" project-documents/factory/status/JOB-043.md
          git commit -m "Job 43 done: Club: scene registration, faces, hands and seams"
          git pull --rebase origin factory/v1-wtt5ye
          git push origin HEAD:factory/v1-wtt5ye
