          before=json.loads((root/"evidence/diff/job43_before/scores.json").read_text())["build"]
          after=json.loads((root/"evidence/diff/job43_after/scores.json").read_text())
          b=after["build"]
          build=root/"BUILD_RESULT.md"
          text=build.read_text()
          section=f"""
          
          ## JOB-043 registration, face, hand and seam polish (2026-10-02)
          
