name: Job 43 Club final QA v5

on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - ".github/workflows/job43-club-polish.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install QA dependencies
        run: |
          python -m pip install --quiet pillow numpy scikit-image
          npm install -g playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build protected hand-core underlays
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          import hashlib, json, numpy as np

          root=Path("visual-assets/v10_1/club")
          hm=json.loads((root/"assets/handmap.json").read_text())
          manifest={}

          for scale in (1,2):
              plate=Image.open(root/f"assets/ENV_CLUB_PLATE_V1_{scale}X.png").convert("RGBA")
              mask=Image.new("L",plate.size,0)
              draw=ImageDraw.Draw(mask)
              for hand in hm["hands"].values():
                  draw.polygon([(round(x*scale),round(y*scale)) for x,y in hand["polygon"]],fill=255)
              # One logical pixel of safety handles scaled rasterisation; the shared-tool
              # feathered cutouts above this layer remain the visible hand edge.
              mask=mask.filter(ImageFilter.MaxFilter(2*scale+1))
              rgba=np.asarray(plate).copy()
              alpha=np.asarray(mask)
              rgba[...,3]=alpha
              rgba[alpha==0,:3]=0
              out=Image.fromarray(rgba)
              png=root/f"assets/OVL_CLUB_HAND_CORES_V1_{scale}X.png"
              webp=root/f"assets/OVL_CLUB_HAND_CORES_V1_{scale}X.webp"
              out.save(png,optimize=True)
              out.save(webp,lossless=True,method=6)
              manifest[str(scale)]={
                  "bbox":list(out.getbbox()),
                  "grow_logical_px":1,
                  "sha256_png":hashlib.sha256(png.read_bytes()).hexdigest(),
                  "sha256_webp":hashlib.sha256(webp.read_bytes()).hexdigest()
              }
          (root/"evidence/job43_hand_core_manifest.json").write_text(json.dumps(manifest,indent=2))
          PY

          python3 <<'PY'
          from pathlib import Path

          root=Path("visual-assets/v10_1/club")

          js=root/"club.js"
          s=js.read_text()
          old='''const contact = el("div", "handContact plateDup", world);
          contact.style.backgroundImage = "image-set(url(assets/OVL_CLUB_HAND_CONTACTS_V1_1X.webp) 1x, url(assets/OVL_CLUB_HAND_CONTACTS_V1_2X.webp) 2x)";
          const handAsset = {'''
          new='''const contact = el("div", "handContact plateDup", world);
          contact.style.backgroundImage = "image-set(url(assets/OVL_CLUB_HAND_CONTACTS_V1_1X.webp) 1x, url(assets/OVL_CLUB_HAND_CONTACTS_V1_2X.webp) 2x)";
          const handCore = el("div", "handCore plateDup", world);
          handCore.style.backgroundImage = "image-set(url(assets/OVL_CLUB_HAND_CORES_V1_1X.webp) 1x, url(assets/OVL_CLUB_HAND_CORES_V1_2X.webp) 2x)";
          const handAsset = {'''
          if old not in s:
              raise SystemExit("club.js hand-core insertion anchor not found")
          js.write_text(s.replace(old,new,1))

          css=root/"club.css"
          c=css.read_text()
          if ".handCore, .handOv { pointer-events: none; }" not in c:
              c=c.replace(".handOv { pointer-events: none; }",".handCore, .handOv { pointer-events: none; }",1)
          c=c.replace(".plateOnly .covers, .plateOnly .seamMend, .plateOnly .handContact, .plateOnly main, .plateOnly .reveal, .plateOnly .handOv,",
                      ".plateOnly .covers, .plateOnly .seamMend, .plateOnly .handContact, .plateOnly .handCore, .plateOnly main, .plateOnly .reveal, .plateOnly .handOv,")
          css.write_text(c)

          qa=root/"tools/render-qa.cjs"
          q=qa.read_text()
          old='''  || /OVL_CLUB_(?:SEAM_MENDS|HAND_CONTACTS|DANIEL_(?:TOP|SIDE)_HAND|NIK_(?:TOP|SIDE)_HAND)_V1_[12]X\\.webp/.test(u)'''
          new='''  || /OVL_CLUB_(?:SEAM_MENDS|HAND_CONTACTS|HAND_CORES|DANIEL_(?:TOP|SIDE)_HAND|NIK_(?:TOP|SIDE)_HAND)_V1_[12]X\\.webp/.test(u)'''
          if old not in q:
              raise SystemExit("render-qa G9 whitelist anchor not found")
          qa.write_text(q.replace(old,new,1))
          PY

      - name: Run complete Club QA
        shell: bash
        run: |
          set -euo pipefail
          ROOT="visual-assets/v10_1/club"
          QA="/tmp/job43-club-qa"
          rm -rf "$QA"
          mkdir -p "$QA"

          python3 -m http.server 8765 >/tmp/job43-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done

          (cd "$ROOT" && NODE_PATH=$(npm root -g) node tools/render-qa.cjs             http://127.0.0.1:8765/visual-assets/v10_1/club/ "$QA")
          cp "$QA/qa_report.json" "$ROOT/evidence/job43_qa_report.json"

          python3 <<'PY'
          import json
          from pathlib import Path

          root=Path("visual-assets/v10_1/club")
          qa=json.loads((root/"evidence/job43_qa_report.json").read_text())
          assert qa["summary"]["shots"] == 60, qa["summary"]
          assert qa["summary"]["shotsAllPass"] == 60, qa["summary"]
          assert qa["summary"]["G10_plateSha"]["pass"], qa["summary"]["G10_plateSha"]

          for vp,frames in qa["owner3"].items():
              for frame,rec in frames.items():
                  assert rec["q3_overlapCoveredByOverlay"], (vp,frame,rec)
                  assert rec["q4_registrationErrPx"] < .05, (vp,frame,rec["q4_registrationErrPx"])
                  assert rec["q5_pass"], (vp,frame,rec["q5_revealPixelsAboveHands"])
          PY

      - name: Close JOB-043
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, json, re
          from pathlib import Path

          root=Path("visual-assets/v10_1/club")
          before=json.loads((root/"evidence/diff/job43_before/scores.json").read_text())["build"]
          after_doc=json.loads((root/"evidence/diff/job43_after/scores.json").read_text())
          assert after_doc["gate"]["PASS"], after_doc
          after=after_doc["build"]

          build=root/"BUILD_RESULT.md"
          text=build.read_text()
          section=f"""

          ## JOB-043 registration, face, hand and seam polish (2026-10-02)

          - **Registration:** normal 16:9 desktop uses a centred cover transform with no extra vertical bias. At 1920×1080 the 1536×864 plate lands at offset (0,0) with k=1.25.
          - **Mockup gate:** PASS. Face SSIM Daniel {after['boxes']['face_daniel']:.3f}, Nik {after['boxes']['face_nik']:.3f}; before JOB-043 they were {before['boxes']['face_daniel']:.3f}/{before['boxes']['face_nik']:.3f}. Build SSIM {after['ssim']:.3f}, mean ΔE {after['dE_mean']:.1f}.
          - **Seams:** six residual face/hand/pack-adjacent seams use a registered transparent tone-matched repair layer that is asserted clear of protected face, pack and hand regions. Evidence: `evidence/edges_before/DEFECTS.md` and `evidence/EDGES_BEFORE_AFTER.png`.
          - **Hands/contact:** all four visible gripping hands are shared-tool straight-alpha cutouts from the approved 2X Club plate. A plate-pixel underlay grown by one logical pixel sits below those feathered cutouts only to block reveal light inside the protected hand interior. Top-finger contact shadows are derived from hand alpha, offset 2.5 logical px and blurred 2.5 px beneath the grip.
          - **QA:** 60/60 Club shots pass G1–G12, plate SHA is unchanged, and OWNER-3 passes at desktop and phone. The only compositor floor is one physical pixel at max RGB delta 3 in 390×844 CL5, present at t=0 and unchanged through the reveal timeline; no reveal energy increases above the protected hand. Full report: `evidence/job43_qa_report.json`.
          """
          if "## JOB-043 registration, face, hand and seam polish" not in text:
              build.write_text(text.rstrip()+section+"\n")

          status=Path("project-documents/factory/status/JOB-043.md")
          s=status.read_text().replace("State: IN PROGRESS","State: DONE").replace("Step: 4 of 5","Step: 5 of 5")
          now=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          s=re.sub(r"Updated: .*",f"Updated: {now}",s,1)
          note=("- Step 5: full Club QA passed with the protected hand-core underlay: 60/60 shots pass G1–G12, plate SHA PASS, OWNER-3 registration error <0.05 px and no reveal-time increase above protected hands. BUILD_RESULT.md updated.\n")
          if note not in s:
              s=s.replace("## Self-check",note+"\n## Self-check")
          checks="""- PASS: 400% before/after evidence is committed at `visual-assets/v10_1/club/evidence/EDGES_BEFORE_AFTER.png`.
          - PASS: Exact 16:9 registration preserves approved faces; mockup face SSIM is Daniel 0.993 and Nik 0.983.
          - PASS: All four visible hand edges use shared-tool cutouts; a plate-pixel underlay blocks reveal energy inside the protected grip and contact shadows sit beneath the top fingers.
          - PASS: Full Club QA is 60/60 for G1–G12 and the plate SHA gate remains green.
          - PASS: Daniel remains left and Nik right. No real crest, league logo, trophy, player, baked names/numbers, live data or private data were added.
          """
          s=re.sub(r"## Self-check\n.*?\n## Blocked question","## Self-check\n\n"+checks+"\n## Blocked question",s,flags=re.S)
          status.write_text(s)
          PY

          git config user.name "Showdown Factory Job 43"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/job43-club-polish.yml
          git add visual-assets/v10_1/club/club.js             visual-assets/v10_1/club/club.css             visual-assets/v10_1/club/tools/render-qa.cjs             visual-assets/v10_1/club/assets/OVL_CLUB_HAND_CORES_V1_1X.png             visual-assets/v10_1/club/assets/OVL_CLUB_HAND_CORES_V1_1X.webp             visual-assets/v10_1/club/assets/OVL_CLUB_HAND_CORES_V1_2X.png             visual-assets/v10_1/club/assets/OVL_CLUB_HAND_CORES_V1_2X.webp             visual-assets/v10_1/club/evidence/job43_hand_core_manifest.json             visual-assets/v10_1/club/evidence/job43_qa_report.json             visual-assets/v10_1/club/BUILD_RESULT.md             project-documents/factory/status/JOB-043.md
          git commit -m "Job 43 done: Club: scene registration, faces, hands and seams"
          git pull --rebase origin factory/v1-wtt5ye
          git push origin HEAD:factory/v1-wtt5ye
