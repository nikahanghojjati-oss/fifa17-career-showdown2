      - name: Step 4 - after crops and before-after sheet
        shell: bash
        run: |
          set -euo pipefail
          ROOT="visual-assets/v10_1/club"
          OUT="$ROOT/evidence/edges_after"
          rm -rf "$OUT"
          mkdir -p "$OUT/full" "$OUT/crops"
          python3 -m http.server 8765 >/tmp/job43-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done

          NODE_PATH=$(npm root -g) node <<'NODE'
          const { chromium } = require("playwright");
          const fs=require("fs"), path=require("path");
          const out="visual-assets/v10_1/club/evidence/edges_after";
          const seams=[
            {name:"header_daniel", box:[246,72,468,86]},
            {name:"title_daniel", box:[452,88,470,302]},
            {name:"title_nik", box:[1026,88,1044,302]},
            {name:"rail_daniel", box:[546,302,564,394]},
            {name:"tab_daniel", box:[552,566,610,586]},
            {name:"tab_nik", box:[916,566,984,590]}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const manifest=[];
            for(const [w,h] of [[1366,768],[1920,1080]]){
              const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
              await page.goto("http://127.0.0.1:8765/visual-assets/v10_1/club/index.html?frame=CL1",{waitUntil:"networkidle"});
              await page.waitForFunction(()=>document.documentElement.classList.contains("ready"));
              await page.evaluate(()=>document.fonts&&document.fonts.ready);
              const full=path.join(out,"full",`CL1_${w}x${h}.png`);
              await page.screenshot({path:full,type:"png"});
              const items=await page.evaluate((seams)=>{
                const Q=window.ClubQA,H=Q.HANDS,P=Q.MAP.protected_boxes;
                return [
                  {name:"face_daniel",kind:"face",box:P.face_daniel},
                  {name:"face_nik",kind:"face",box:P.face_nik},
                  ...Object.entries(H.hands).map(([name,v])=>({name,kind:"hand",box:v.box})),
                  ...seams.map(x=>({name:x.name,kind:"seam",box:x.box}))
                ].map(x=>Object.assign({},x,{screen:Q.rectToScreen(x.box)}));
              },seams);
              fs.writeFileSync(path.join(out,`boxes_${w}x${h}.json`),JSON.stringify(items,null,2));
              manifest.push({w,h,full,items});
              await page.close();
            }
            fs.writeFileSync(path.join(out,"manifest.json"),JSON.stringify(manifest,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import json,re,math
          root=Path("visual-assets/v10_1/club/evidence")
          before=root/"edges_before"; after=root/"edges_after"
          for w,h in [(1366,768),(1920,1080)]:
              items=json.loads((after/f"boxes_{w}x{h}.json").read_text())
              im=Image.open(after/"full"/f"CL1_{w}x{h}.png").convert("RGB")
              for i,it in enumerate(items):
                  b=it["screen"]; l=max(0,int(b["left"])-4); t=max(0,int(b["top"])-4)
                  r=min(w,int(b["right"])+5); bt=min(h,int(b["bottom"])+5)
                  crop=im.crop((l,t,r,bt)).resize(((r-l)*4,(bt-t)*4),Image.Resampling.NEAREST)
                  name=re.sub(r"[^A-Za-z0-9_-]+","_",it["name"])
                  crop.save(after/"crops"/f"CL1_{w}x{h}_{i:02d}_{name}_x4.png",optimize=True)
          # Build one readable 400%-crop compare sheet from the 1920 evidence.
          def crops_map(folder):
              d={}
              for p in (folder/"crops").glob("CL1_1920x1080_*_x4.png"):
                  key=re.sub(r"^CL1_1920x1080_\d+_","",p.stem).replace("_x4","")
                  d[key]=p
              return d
          B,A=crops_map(before),crops_map(after)
          order=["face_daniel","face_nik","hand_daniel_top","hand_daniel_side","hand_nik_top","hand_nik_side",
                 "header_daniel","title_daniel","title_nik","rail_daniel","tab_daniel","tab_nik"]
          rows=[]
          maxw=0
          for k in order:
              if k not in B or k not in A: continue
              bi=Image.open(B[k]).convert("RGB"); ai=Image.open(A[k]).convert("RGB")
              # cap extremely tall diagnostics while keeping 400% source pixels via centre crop
              caph=520
              if bi.height>caph:
                  y=(bi.height-caph)//2; bi=bi.crop((0,y,bi.width,y+caph))
              if ai.height>caph:
                  y=(ai.height-caph)//2; ai=ai.crop((0,y,ai.width,y+caph))
              rows.append((k,bi,ai)); maxw=max(maxw,bi.width,ai.width)
          labelw=190; gap=16; header=50
          heights=[max(b.height,a.height)+12 for _,b,a in rows]
          sheet=Image.new("RGB",(labelw+maxw*2+gap*3,sum(heights)+header),(14,15,18))
          d=ImageDraw.Draw(sheet)
          d.text((labelw+gap,14),"BEFORE",fill=(242,196,91)); d.text((labelw+gap*2+maxw,14),"AFTER",fill=(242,196,91))
          y=header
          for (k,b,a),rh in zip(rows,heights):
              d.text((10,y+8),k.replace("_"," "),fill=(233,223,200))
              sheet.paste(b,(labelw+gap,y))
              sheet.paste(a,(labelw+gap*2+maxw,y))
              y+=rh
          sheet.save(root/"EDGES_BEFORE_AFTER.png",optimize=True)
          status=Path("project-documents/factory/status/JOB-043.md")
          s=status.read_text().replace("Step: 3 of 5","Step: 4 of 5")
          import datetime
          now=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          s=re.sub(r"Updated: .*",f"Updated: {now}",s,1)
          note="- Step 4: re-rendered the same 400% face/hand/seam crops into `edges_after/` and committed `evidence/EDGES_BEFORE_AFTER.png` with the 1920×1080 before/after pairs.\n"
          if note not in s:s=s.replace("## Self-check",note+"\n## Self-check")
          status.write_text(s)
          PY

          git config user.name "Showdown Factory Job 43"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT" "$ROOT/evidence/EDGES_BEFORE_AFTER.png" project-documents/factory/status/JOB-043.md
          git commit -m "Job 43 step 4/5: prove edge and hand cleanup"
          git pull --rebase origin factory/v1-wtt5ye
          git push origin HEAD:factory/v1-wtt5ye

      - name: Step 5 - full Club QA, BUILD_RESULT and done
