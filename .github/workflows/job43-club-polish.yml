          s=s.replace(old,new)
          old2='''    // exact original-pixel hand overlays (duplicate plate layer clipped to the traced hands), above the reveal
            Object.entries(HANDS.hands).forEach(([name, h]) => {
              const d = el("div", "handOv plateDup", world); d.dataset.hand = name;
