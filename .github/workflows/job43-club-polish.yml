name: Job 43 Club registration faces hands seams

on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - ".github/workflows/job43-club-polish.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install render dependencies
        run: |
          python -m pip install --quiet pillow numpy scikit-image
          npm install -g playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Step 1 - exact desktop registration and mockup gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="visual-assets/v10_1/club"
          rm -rf "$ROOT/evidence/diff/job43_before" "$ROOT/evidence/diff/job43_after"
          mkdir -p "$ROOT/evidence/diff/job43_before" "$ROOT/evidence/diff/job43_after"

          python3 -m http.server 8765 >/tmp/job43-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done

          render_shot() {
            local out="$1"
            NODE_PATH=$(npm root -g) OUT="$out" node <<'NODE'
          const { chromium } = require("playwright");
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});
            await page.goto("http://127.0.0.1:8765/visual-assets/v10_1/club/index.html?frame=CL1", {waitUntil:"networkidle"});
            await page.waitForFunction(()=>document.documentElement.classList.contains("ready"));
            await page.evaluate(()=>document.fonts && document.fonts.ready);
            await page.screenshot({path:process.env.OUT,type:"png"});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          }

          render_shot "$ROOT/evidence/diff/job43_before/build_1920x1080.png"
          python3 visual-assets/v10_1/shared/tools/mockup_diff.py             --mockup "$ROOT/assets/REF_GOAL_CLUB.jpg"             --build "$ROOT/evidence/diff/job43_before/build_1920x1080.png"             --plate "$ROOT/assets/ENV_CLUB_PLATE_V1_1X.webp"             --platemap "$ROOT/assets/platemap.json"             --out "$ROOT/evidence/diff/job43_before"

          python3 <<'PY'
          from pathlib import Path
          p=Path("visual-assets/v10_1/club/club.js")
          s=p.read_text()
          old='''    if (!isPhone()) {
              const k = Math.max(W / PW, H / PH);
              const offX = (W - PW * k) / 2;
              // Vertical bias (C4b): faces clear the 56 px header by 8 px, buttons stay above the footer;
              // the plate may slide up under the header/footer chrome but never leaves a visible gap.
              const faceY = HEADER_D + 8 - 65 * k;              // highest plate offset that keeps both faces 8 px under the header
              // Short desktop (decision 1, 2026-10-01): the header never covers a face. If the plate-registered
              // layout cannot also keep the buttons above the footer, the faces stay clear and the page scrolls
              // (buttons move up under the packs so the primary stays visible on load).
              const short = H - FOOTER_D - L.buttonsY[1] * k - 2 < faceY;
              let offY = Math.min(faceY, H - FOOTER_D - L.buttonsY[1] * k - 2);
              offY = Math.max(H - PH * k - FOOTER_D, Math.min(HEADER_D, offY));
              if (short) offY = Math.min(HEADER_D, faceY);
              return { k, offX, offY, mode: "desktop", clip: [0, 0, W, H], short };
            }'''
          new='''    if (!isPhone()) {
              // JOB-043: Tier-S / 16:9 desktop is the mockup camera, exactly. Cover-fit the
              // 1536x864 plate, centre it, and do not add a face/header or button/footer bias.
              // Non-16:9 short desktops keep the prior safety composition so a face is never cut.
              const k = Math.max(W / PW, H / PH);
              const offX = (W - PW * k) / 2;
              const centeredY = (H - PH * k) / 2;
              const faceY = HEADER_D + 8 - 65 * k;
              const short = H - FOOTER_D - L.buttonsY[1] * k - 2 < faceY;
              if (!short) return { k, offX, offY: centeredY, mode: "desktop", clip: [0, 0, W, H], short: false };
              const offY = Math.min(HEADER_D, faceY);
              return { k, offX, offY, mode: "desktop", clip: [0, 0, W, H], short: true };
            }'''
          if old not in s:
              raise SystemExit("JOB-043 registration source block not found")
          p.write_text(s.replace(old,new))
          css=Path("visual-assets/v10_1/club/club.css")
          c=css.read_text()
          oldc='''  padding: 0 20px 0 0; background: linear-gradient(to bottom, rgba(6,7,9,.92), rgba(6,7,9,.70)); border-bottom: 1px solid rgba(201,155,69,.45);'''
          newc='''  padding: 0 20px 0 0; background: transparent; border-bottom: 0;'''
          if oldc not in c:
              raise SystemExit("JOB-043 header background source block not found")
          css.write_text(c.replace(oldc,newc))
          PY

          render_shot "$ROOT/evidence/diff/job43_after/build_1920x1080.png"
          python3 visual-assets/v10_1/shared/tools/mockup_diff.py             --mockup "$ROOT/assets/REF_GOAL_CLUB.jpg"             --build "$ROOT/evidence/diff/job43_after/build_1920x1080.png"             --plate "$ROOT/assets/ENV_CLUB_PLATE_V1_1X.webp"             --platemap "$ROOT/assets/platemap.json"             --out "$ROOT/evidence/diff/job43_after"

          python3 <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("visual-assets/v10_1/club/evidence/diff/job43_after/scores.json").read_text())
          b=a["build"]
          assert a["gate"]["PASS"], a
          faces={k:v for k,v in b["boxes"].items() if k.startswith("face_")}
          assert faces and min(faces.values()) >= .90, faces
          status=Path("project-documents/factory/status/JOB-043.md")
          s=status.read_text()
          import datetime
          now=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          s=s.replace("State: NOT STARTED","State: IN PROGRESS")
          s=s.replace("Step: 0 of 5","Step: 1 of 5")
          import re
          s=re.sub(r"Updated: .*",f"Updated: {now}",s,1)
          s=re.sub(r"Chat: .*","Chat: GPT-5.6 Sol, Showdown visual",s,1)
          before=json.loads(Path("visual-assets/v10_1/club/evidence/diff/job43_before/scores.json").read_text())["build"]
          note=(f"- Step 1: restored exact centred cover registration on normal desktop. "
                f"1920×1080 mockup gate PASS; face SSIM Daniel {faces.get('face_daniel'):.3f}, "
                f"Nik {faces.get('face_nik'):.3f} (before {before['boxes'].get('face_daniel'):.3f}/"
                f"{before['boxes'].get('face_nik'):.3f}). Header field is transparent over the registered scene; "
                f"existing plate-registered segmented chrome keeps the manager silhouettes unobscured.\n")
          if note not in s: s=s.replace("## Self-check",note+"\n## Self-check")
          status.write_text(s)
          PY

          git config user.name "Showdown Factory Job 43"
          git config user.email "actions@users.noreply.github.com"
          git add "$ROOT/club.js" "$ROOT/club.css" "$ROOT/evidence/diff/job43_before" "$ROOT/evidence/diff/job43_after" project-documents/factory/status/JOB-043.md
          git commit -m "Job 43 step 1/5: exact scene registration"
          git pull --rebase origin factory/v1-wtt5ye
          git push origin HEAD:factory/v1-wtt5ye

      - name: Step 2 - 400 percent before crops and defect register
        shell: bash
        run: |
          set -euo pipefail
          ROOT="visual-assets/v10_1/club"
          OUT="$ROOT/evidence/edges_before"
          rm -rf "$OUT"
          mkdir -p "$OUT/full" "$OUT/crops"
          python3 -m http.server 8765 >/tmp/job43-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done

          NODE_PATH=$(npm root -g) node <<'NODE'
          const { chromium } = require("playwright");
          const fs=require("fs"), path=require("path");
          const out="visual-assets/v10_1/club/evidence/edges_before";
          const seams=[
            {name:"header_daniel", box:[246,72,468,86], defect:"faint horizontal intake seam at y=78"},
            {name:"title_daniel", box:[452,88,470,302], defect:"vertical title-zone seam beside Daniel at x=458"},
            {name:"title_nik", box:[1026,88,1044,302], defect:"vertical protected-boundary strip beside Nik ending x=1040"},
            {name:"rail_daniel", box:[546,302,564,394], defect:"vertical rail-zone seam beside Daniel pack at x=552"},
            {name:"tab_daniel", box:[552,566,610,586], defect:"panel-tab top corner seam beside Daniel side hand at y=572"},
            {name:"tab_nik", box:[916,566,984,590], defect:"panel-tab top corner seam beside Nik side hand at y=572"}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const manifest=[];
            for(const [w,h] of [[1366,768],[1920,1080]]){
              const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
              await page.goto("http://127.0.0.1:8765/visual-assets/v10_1/club/index.html?frame=CL1",{waitUntil:"networkidle"});
              await page.waitForFunction(()=>document.documentElement.classList.contains("ready"));
              await page.evaluate(()=>document.fonts&&document.fonts.ready);
              const full=path.join(out,"full",`CL1_${w}x${h}.png`);
              await page.screenshot({path:full,type:"png"});
              const items=await page.evaluate((seams)=>{
                const Q=window.ClubQA, H=Q.HANDS, P=Q.MAP.protected_boxes;
                const a=[
                  {name:"face_daniel",kind:"face",box:P.face_daniel},
                  {name:"face_nik",kind:"face",box:P.face_nik},
                  ...Object.entries(H.hands).map(([name,v])=>({name,kind:"hand",box:v.box})),
                  ...seams.map(x=>({name:x.name,kind:"seam",box:x.box,defect:x.defect}))
                ];
                return a.map(x=>Object.assign({},x,{screen:Q.rectToScreen(x.box)}));
              },seams);
              fs.writeFileSync(path.join(out,`boxes_${w}x${h}.json`),JSON.stringify(items,null,2));
              manifest.push({w,h,full,items});
              await page.close();
            }
            fs.writeFileSync(path.join(out,"manifest.json"),JSON.stringify(manifest,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,re
          root=Path("visual-assets/v10_1/club/evidence/edges_before")
          for w,h in [(1366,768),(1920,1080)]:
              items=json.loads((root/f"boxes_{w}x{h}.json").read_text())
              im=Image.open(root/"full"/f"CL1_{w}x{h}.png").convert("RGB")
              for i,it in enumerate(items):
                  b=it["screen"]; l=max(0,int(b["left"])-4); t=max(0,int(b["top"])-4)
                  r=min(w,int(b["right"])+5); bt=min(h,int(b["bottom"])+5)
                  if r<=l or bt<=t: continue
                  crop=im.crop((l,t,r,bt))
                  crop=crop.resize((crop.width*4,crop.height*4),Image.Resampling.NEAREST)
                  name=re.sub(r"[^A-Za-z0-9_-]+","_",it["name"])
                  crop.save(root/"crops"/f"CL1_{w}x{h}_{i:02d}_{name}_x4.png",optimize=True)
          defects=[
            ("S1","header_daniel","[246,72,468,86]","faint horizontal seam at the old nav-zone bottom; BUILD_RESULT measured 3.2 luminance-step units"),
            ("S2","title_daniel","[452,88,470,302]","visible vertical tone seam immediately outside Daniel's protected face; prior measured step 11.6"),
            ("S3","title_nik","[1026,88,1044,302]","visible vertical strip immediately outside Nik's protected face; prior measured step 15.1"),
            ("S4","rail_daniel","[546,302,564,394]","faint vertical rail-zone seam beside Daniel's pack; prior measured step 5.9"),
            ("S5","tab_daniel","[552,566,610,586]","tab-zone top/corner seam beside Daniel's side hand"),
            ("S6","tab_nik","[916,566,984,590]","tab-zone top/corner seam beside Nik's side hand"),
          ]
          md=["# JOB-043 Club edge defects","",
              "Coordinates are 1X plate pixels. Crops are 400% nearest-neighbour diagnostic views after Step 1 registration and before Step 3 mends/cut-outs.","",
              "| ID | Box | Defect |","| --- | --- | --- |"]
          for i,n,b,d in defects: md.append(f"| {i} · {n} | `{b}` | {d} |")
          md += ["","Protected face pixels are not defects and must remain unchanged. Hand crops are included to audit finger/foil contact before the cut-out pass."]
          (root/"DEFECTS.md").write_text("\n".join(md)+"\n")
          status=Path("project-documents/factory/status/JOB-043.md")
          s=status.read_text().replace("Step: 1 of 5","Step: 2 of 5")
          import datetime,re
          now=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          s=re.sub(r"Updated: .*",f"Updated: {now}",s,1)
          note="- Step 2: saved 400% crops for both faces, all four gripping hands and six known residual seam boxes at 1366×768 and 1920×1080; `edges_before/DEFECTS.md` records each defect in 1X plate coordinates.\n"
          if note not in s:s=s.replace("## Self-check",note+"\n## Self-check")
          status.write_text(s)
          PY

          git config user.name "Showdown Factory Job 43"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT" project-documents/factory/status/JOB-043.md
          git commit -m "Job 43 step 2/5: audit Club edges and hands"
          git pull --rebase origin factory/v1-wtt5ye
          git push origin HEAD:factory/v1-wtt5ye

      - name: Step 3 - tone matched seam mends, clean hand cutouts and contact shadows
        shell: bash
        run: |
          set -euo pipefail
          ROOT="visual-assets/v10_1/club"
          SHARED="visual-assets/v10_1/shared/tools/cutout.py"

          for spec in             "hand_daniel_top:OVL_CLUB_DANIEL_TOP_HAND_V1"             "hand_daniel_side:OVL_CLUB_DANIEL_SIDE_HAND_V1"             "hand_nik_top:OVL_CLUB_NIK_TOP_HAND_V1"             "hand_nik_side:OVL_CLUB_NIK_SIDE_HAND_V1"; do
            key="${spec%%:*}"; stem="${spec##*:}"
            python3 "$SHARED"               --plate "$ROOT/assets/ENV_CLUB_PLATE_V1_2X.png" --source-scale 2               --map "$ROOT/assets/handmap.json" --key "hands.$key"               --output "$ROOT/assets/$stem" > "/tmp/${key}.json"
          done

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image,ImageFilter,ImageDraw
          import numpy as np,json,hashlib
          root=Path("visual-assets/v10_1/club")
          pm=json.loads((root/"assets/platemap.json").read_text())
          hm=json.loads((root/"assets/handmap.json").read_text())
          specs=[
            dict(name="header_daniel",box=[246,72,468,86],line=78,o="h",shift=(0,-14)),
            dict(name="title_daniel",box=[452,88,470,302],line=458,o="v",shift=(18,0)),
            dict(name="title_nik",box=[1026,88,1044,302],line=1040,o="v",shift=(-18,0)),
            dict(name="rail_daniel",box=[546,302,564,394],line=552,o="v",shift=(18,0)),
            dict(name="tab_daniel",box=[552,566,610,586],line=572,o="h",shift=(0,16)),
            dict(name="tab_nik",box=[916,566,984,590],line=572,o="h",shift=(0,16)),
          ]
          hand_stems={
            "hand_daniel_top":"OVL_CLUB_DANIEL_TOP_HAND_V1",
            "hand_daniel_side":"OVL_CLUB_DANIEL_SIDE_HAND_V1",
            "hand_nik_top":"OVL_CLUB_NIK_TOP_HAND_V1",
            "hand_nik_side":"OVL_CLUB_NIK_SIDE_HAND_V1",
          }
          def tone_mends(scale):
              src=np.asarray(Image.open(root/f"assets/ENV_CLUB_PLATE_V1_{scale}X.png").convert("RGB"),dtype=np.float32)
              H,W=src.shape[:2]
              protected=Image.new("L",(W,H),0); d=ImageDraw.Draw(protected)
              for b in pm["protected_boxes"].values():
                  d.rectangle(tuple(int(v*scale) for v in b),fill=255)
              for hand in hm["hands"].values():
                  d.polygon([(int(x*scale),int(y*scale)) for x,y in hand["polygon"]],fill=255)
              prot=np.asarray(protected)>0
              out=np.zeros((H,W,4),dtype=np.uint8)
              for sp in specs:
                  x0,y0,x1,y1=[int(v*scale) for v in sp["box"]]
                  dx,dy=[int(v*scale) for v in sp["shift"]]
                  yy,xx=np.mgrid[y0:y1,x0:x1]
                  sx=np.clip(xx+dx,0,W-1); sy=np.clip(yy+dy,0,H-1)
                  sample=src[sy,sx].copy()
                  ring=12*scale
                  rx0=max(0,x0-ring); ry0=max(0,y0-ring); rx1=min(W,x1+ring); ry1=min(H,y1+ring)
                  reg=src[ry0:ry1,rx0:rx1]
                  m=np.ones(reg.shape[:2],bool)
                  m[max(0,y0-ry0):min(ry1-ry0,y1-ry0),max(0,x0-rx0):min(rx1-rx0,x1-rx0)]=False
                  m &= ~prot[ry0:ry1,rx0:rx1]
                  vals=reg[m]
                  sm=sample.reshape(-1,3)
                  if len(vals)>20:
                      mean_t,std_t=vals.mean(0),vals.std(0)+1e-3
                      mean_s,std_s=sm.mean(0),sm.std(0)+1e-3
                      sample=np.clip((sample-mean_s)*(std_t/std_s)+mean_t,0,255)
                  if sp["o"]=="v":
                      dist=np.abs(xx-sp["line"]*scale)/(3.0*scale)
                      edge=np.minimum((yy-y0+1)/(7*scale),(y1-yy)/(7*scale))
                  else:
                      dist=np.abs(yy-sp["line"]*scale)/(3.0*scale)
                      edge=np.minimum((xx-x0+1)/(7*scale),(x1-xx)/(7*scale))
                  a=np.exp(-0.5*dist*dist)*np.clip(edge,0,1)*0.94
                  a[prot[y0:y1,x0:x1]]=0
                  old=out[y0:y1,x0:x1,:3].astype(np.float32)
                  olda=out[y0:y1,x0:x1,3].astype(np.float32)/255
                  # Later mends composite over earlier mends only where stronger.
                  take=a>olda
                  old[take]=sample[take]
                  olda=np.maximum(olda,a)
                  out[y0:y1,x0:x1,:3]=np.rint(old).astype(np.uint8)
                  out[y0:y1,x0:x1,3]=np.rint(olda*255).astype(np.uint8)
              # hard safety: no mend alpha inside protected boxes/hands
              out[prot]=0
              return Image.fromarray(out)
          manifest={"mends":{},"hands":{},"contact":{}}
          for scale in (1,2):
              im=tone_mends(scale)
              png=root/f"assets/OVL_CLUB_SEAM_MENDS_V1_{scale}X.png"
              webp=root/f"assets/OVL_CLUB_SEAM_MENDS_V1_{scale}X.webp"
              im.save(png,optimize=True); im.save(webp,lossless=True,method=6)
              manifest["mends"][str(scale)]={"bbox":list(im.getbbox()),"sha256":hashlib.sha256(png.read_bytes()).hexdigest()}
          # Convert clean hand PNG masters to lossless WebP.
          for hand,stem in hand_stems.items():
              manifest["hands"][hand]={}
              for scale in (1,2):
                  png=root/f"assets/{stem}_{scale}X.png"
                  im=Image.open(png).convert("RGBA")
                  webp=root/f"assets/{stem}_{scale}X.webp"
                  im.save(webp,lossless=True,method=6)
                  manifest["hands"][hand][str(scale)]={"bbox":list(im.getbbox()),"sha256":hashlib.sha256(png.read_bytes()).hexdigest()}
          # Contact shadow derived from top-hand alpha, shifted 2.5 logical px, blurred 2.5 px,
          # restricted to each pack. It therefore follows every curled finger rather than a guessed ellipse.
          for scale in (1,2):
              size=(1536*scale,864*scale)
              a=np.zeros((size[1],size[0]),dtype=np.uint8)
              for hand,stem in [("hand_daniel_top",hand_stems["hand_daniel_top"]),("hand_nik_top",hand_stems["hand_nik_top"])]:
                  alpha=np.asarray(Image.open(root/f"assets/{stem}_{scale}X.png").getchannel("A"))
                  a=np.maximum(a,alpha)
              shifted=np.zeros_like(a)
              dy=max(1,round(2.5*scale))
              shifted[dy:]=a[:-dy]
              blur=np.asarray(Image.fromarray(shifted).filter(ImageFilter.GaussianBlur(2.5*scale)),dtype=np.float32)
              shadow=np.zeros_like(blur)
              for key in ("pack_daniel","pack_nik"):
                  x0,y0,x1,y1=[int(v*scale) for v in pm["protected_boxes"][key]]
                  # top-contact band only; side-hand contact remains the unchanged plate.
                  yy1=min(y1,int(392*scale))
                  shadow[y0:yy1,x0:x1]=blur[y0:yy1,x0:x1]
              # Keep the shadow outside the hand itself and cap to 46% black.
              shadow=shadow*(1-a.astype(np.float32)/255.0)
              sa=np.clip(shadow/255.0*117,0,117).astype(np.uint8)
              rgba=np.zeros((size[1],size[0],4),dtype=np.uint8)
              rgba[...,3]=sa
              cim=Image.fromarray(rgba)
              png=root/f"assets/OVL_CLUB_HAND_CONTACTS_V1_{scale}X.png"
              webp=root/f"assets/OVL_CLUB_HAND_CONTACTS_V1_{scale}X.webp"
              cim.save(png,optimize=True); cim.save(webp,lossless=True,method=6)
              manifest["contact"][str(scale)]={"bbox":list(cim.getbbox()),"offset_px":dy,"blur_px":2.5*scale,"sha256":hashlib.sha256(png.read_bytes()).hexdigest()}
          # Safety checks: mends never alter protected face/pack/hand pixels; each hand cutout overlaps its pack.
          mend=np.asarray(Image.open(root/"assets/OVL_CLUB_SEAM_MENDS_V1_1X.png").getchannel("A"))
          assert not mend[prot if False else np.zeros_like(mend,dtype=bool)].any()
          # rebuild a 1X protected mask for explicit assertion
          pr=Image.new("L",(1536,864),0); dd=ImageDraw.Draw(pr)
          for b in pm["protected_boxes"].values(): dd.rectangle(tuple(b),fill=255)
          for hand in hm["hands"].values(): dd.polygon([tuple(p) for p in hand["polygon"]],fill=255)
          assert not mend[np.asarray(pr)>0].any()
          for hand,stem in hand_stems.items():
              alpha=np.asarray(Image.open(root/f"assets/{stem}_1X.png").getchannel("A"))
              b=hm["hands"][hand]["pack_overlap_box"]
              assert b and alpha[b[1]:b[3],b[0]:b[2]].max()>0, hand
          (root/"evidence/job43_overlay_manifest.json").write_text(json.dumps(manifest,indent=2))
          PY

          python3 <<'PY'
          from pathlib import Path
          p=Path("visual-assets/v10_1/club/club.js")
          s=p.read_text()
          old='''    el("div", "plateBase", world);
            // intake-zone covers (desktop and phone): dark glass shapes that the live UI sits on
            worldSvg("covers", world).id = "covers";'''
          new='''    el("div", "plateBase", world);
            // JOB-043: transparent, tone-matched seam repairs are registered to the same full plate.
            // They never enter protected faces, packs or hand polygons.
            const seamMend = el("div", "seamMend plateDup", world);
