              const stem = handAsset[name];
              d.style.backgroundImage = `image-set(url(assets/${stem}_1X.webp) 1x, url(assets/${stem}_2X.webp) 2x)`;
            });'''
          if old2 not in s: raise SystemExit("hand overlay source block not found")
          s=s.replace(old2,new2)
          old3='''  function layoutHands() {
              const k = T.k;
              $$(".handOv").forEach(d => {
                const poly = HANDS.hands[d.dataset.hand].polygon;
                d.style.clipPath = `polygon(${poly.map(([x, y]) => `${(x * k).toFixed(2)}px ${(y * k).toFixed(2)}px`).join(",")})`;
              });
            }'''
          new3='''  function layoutHands() {
              // JOB-043 cutouts are full-canvas registered rasters. Do not clip them again at runtime:
              // the shared cutout tool owns erosion, feather and fringe decontamination.
              $$(".handOv").forEach(d => { d.style.clipPath = "none"; });
