name: v1.0.2 James Anchor Blob Builder

on:
  push:
    branches:
      - agent/v1.0.2-footballer-tile-maintenance
    paths:
      - '.github/workflows/v102-james-anchor-builder.yml'
      - 'tools/build_v102_james_anchor_blobs.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.0.2-footballer-tile-maintenance
      - name: Build Git blobs for James clean-anchor layout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_v102_james_anchor_blobs.py
