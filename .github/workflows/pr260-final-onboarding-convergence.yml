name: PR260 final onboarding convergence
on:
  push:
    branches:
      - feat/persistent-nik-daniel-pair
    paths:
      - .github/workflows/pr260-final-onboarding-convergence.yml
permissions:
  contents: write
jobs:
  fix-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded onboarding convergence fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pair=Path('js/persistentNikDanielPair.js')
          text=pair.read_text()
          old='function pairAlreadyActiveState(){if(state.connectionState!=="active"||!state.rivalryId)return null;const recoveryRequired=state.status==="recovery-required";return pairSetState({status:recoveryRequired?"recovery-required":"paired",busy:false,message:recoveryRequired?state.message:"Daniel and Nik are already connected."});}\n\n  async function pairStartPairing'
          new='function pairAlreadyActiveState(){if(state.connectionState!=="active"||!state.rivalryId)return null;const recoveryRequired=state.status==="recovery-required";return pairSetState({status:recoveryRequired?"recovery-required":"paired",busy:false,message:recoveryRequired?state.message:"Daniel and Nik are already connected."});}\n  function pairProviderConflictNeedsRefresh(error){return error?.code==="PERSISTENT_PAIR_PENDING_CONFLICT"||error?.code==="PERSISTENT_PAIR_ACTIVE_CONFLICT";}\n\n  async function pairStartPairing'
          if old not in text:
              raise SystemExit('pair conflict helper anchor not found')
          text=text.replace(old,new,1)
          old='}catch(error){if(error?.code==="PERSISTENT_PAIR_PENDING_CONFLICT")return pairInitialize({force:true});return pairSetState({status:error?.code?.includes("SHARED_SHELL")||error?.code==="PERSISTENT_PAIR_SEASON_SELECTION_REQUIRED"?"save-required":"error",busy:false,message:error?.message||"The Showdown could not be started."});}}'
          new='}catch(error){if(pairProviderConflictNeedsRefresh(error))return pairInitialize({force:true});return pairSetState({status:error?.code?.includes("SHARED_SHELL")||error?.code==="PERSISTENT_PAIR_SEASON_SELECTION_REQUIRED"?"save-required":"error",busy:false,message:error?.message||"The Showdown could not be started."});}}'
          if old not in text:
              raise SystemExit('pair start conflict catch not found')
          text=text.replace(old,new,1)
          old='}catch(error){return pairSetState({status:error?.code?.includes("SHARED_SHELL")?"save-required":"error",busy:false,message:pairContextualJoinMessage(error)});}}'
          new='}catch(error){if(pairProviderConflictNeedsRefresh(error))return pairInitialize({force:true});return pairSetState({status:error?.code?.includes("SHARED_SHELL")?"save-required":"error",busy:false,message:pairContextualJoinMessage(error)});}}'
          if old not in text:
              raise SystemExit('pair join conflict catch not found')
          pair.write_text(text.replace(old,new,1))

          reconnect=Path('js/productionSharedJourneyReconnect.js')
          text=reconnect.read_text()
          old='  function pjrMarkerRivalry(){return String(pjrShowdown()?.sharedJourney?.rivalryId||"").trim();}\n'
          new='  function pjrMarkerRivalry(){return String(pjrShowdown()?.sharedJourney?.rivalryId||"").trim();}\n  function pjrPrePairShell(){const journey=pjrShowdown()?.sharedJourney;return Boolean(journey&&journey.mode==="shared"&&journey.setupPending===true&&!pjrMarkerRivalry());}\n'
          if old not in text:
              raise SystemExit('reconnect marker anchor not found')
          text=text.replace(old,new,1)
          old='    if(typeof rivalryApi?.initialize==="function")await rivalryApi.initialize();\n    return pjrCurrentIdentity();\n'
          new='    if(typeof rivalryApi?.initialize==="function")await rivalryApi.initialize();\n    if(pjrPrePairShell()&&!rivalryApi?.getState?.()?.attached)return null;\n    return pjrCurrentIdentity();\n'
          if old not in text:
              raise SystemExit('reconnect identity anchor not found')
          text=text.replace(old,new,1)
          old='    const authority=await pjrResolveIdentity(),previous=pjrPreviousFor(authority),remote=pjrRemoteSnapshot();\n'
          new='    const authority=await pjrResolveIdentity();if(!authority)return pjrPublish(null);const previous=pjrPreviousFor(authority),remote=pjrRemoteSnapshot();\n'
          if old not in text:
              raise SystemExit('reconnect refresh anchor not found')
          reconnect.write_text(text.replace(old,new,1))

          pair_test=Path('tests/contracts/persistent-nik-daniel-pair-contracts.cjs')
          contract=pair_test.read_text()
          old="assert.match(startFunction,/PERSISTENT_PAIR_PENDING_CONFLICT[\\s\\S]*pairInitialize\\(\\{force:true\\}\\)/,'A stale registered browser must re-read the durable pending pair after a provider pending-code conflict instead of rendering an empty waiting state.');\n"
          new="assert.match(pairSource,/function pairProviderConflictNeedsRefresh\\(error\\)[\\s\\S]*PERSISTENT_PAIR_PENDING_CONFLICT[\\s\\S]*PERSISTENT_PAIR_ACTIVE_CONFLICT/,'Pending and active provider conflicts must share one durable-authority refresh rule.');\nassert.match(startFunction,/pairProviderConflictNeedsRefresh\\(error\\)[\\s\\S]*pairInitialize\\(\\{force:true\\}\\)/,'A stale registered creator browser must re-read durable provider authority after pending or active conflicts.');\n"
          if old not in contract:
              raise SystemExit('persistent pair pending assertion not found')
          contract=contract.replace(old,new,1)
          old="assert.match(joinFunction,/durableWitness/);\n"
          new="assert.match(joinFunction,/durableWitness/);\nassert.match(joinFunction,/pairProviderConflictNeedsRefresh\\(error\\)[\\s\\S]*pairInitialize\\(\\{force:true\\}\\)/,'A stale registered joining browser must re-read durable provider authority after an active-pair conflict.');\n"
          if old not in contract:
              raise SystemExit('join assertion anchor not found')
          pair_test.write_text(contract.replace(old,new,1))

          reconnect_test=Path('tests/contracts/shared-journey-reconnect-production-contracts.cjs')
          contract=reconnect_test.read_text()
          anchor="assert.match(production,/if\\(!pjrOnline\\(\\)\\)return pjrOfflineHold\\(\\)/,'offline recovery must stop before provider Shared Setup/progression reads.');\n"
          addition="assert.match(production,/function pjrPrePairShell\\(\\)[\\s\\S]*setupPending===true[\\s\\S]*!pjrMarkerRivalry\\(\\)/,'The prepared pre-pair shell must be recognized as a legitimate non-reconnect state.');\nassert.match(production,/pjrPrePairShell\\(\\)&&!rivalryApi\\?\\.getState\\?\\.\\(\\)\\?\\.attached\\)return null/,'Journey reconnect must defer while Connect Players has not attached a rivalry yet.');\nassert.match(production,/const authority=await pjrResolveIdentity\\(\\);if\\(!authority\\)return pjrPublish\\(null\\)/,'A deferred pre-pair shell must clear recovery state without reporting an application error.');\n"
          if anchor not in contract:
              raise SystemExit('reconnect contract anchor not found')
          reconnect_test.write_text(contract.replace(anchor,anchor+addition,1))
          PY
      - name: Run focused contracts and browser stability
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check js/persistentNikDanielPair.js
          node --check js/productionSharedJourneyReconnect.js
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          node tests/contracts/shared-journey-reconnect-production-contracts.cjs
          node tests/contracts/shared-showdown-production-runtime-contracts.cjs
          node tests/contracts/static-app-release-contracts.cjs
          node tests/contracts/final-polish-presentation.cjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pr260-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node tests/browser/shared-showdown-paired-first-entry-audit.cjs
          CMS_AUDIT_RUN=pr260-final-convergence node tests/browser/stability-audit.cjs
      - name: Publish clean product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/persistentNikDanielPair.js js/productionSharedJourneyReconnect.js tests/contracts/persistent-nik-daniel-pair-contracts.cjs tests/contracts/shared-journey-reconnect-production-contracts.cjs
          git diff --cached --check
          git commit -m "fix(pr260): converge pre-pair and stale active states"
          git push origin HEAD:feat/persistent-nik-daniel-pair
