name: v1.1.0 Candidate A Builder

on:
  push:
    branches: [agent/v1.1.0-candidate-a-maintenance]
    paths:
      - tools/build_v110_candidate_a.py
      - .github/workflows/v110-candidate-a-builder.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v110-candidate-a-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out Candidate A branch
        uses: actions/checkout@v5
        with:
          ref: agent/v1.1.0-candidate-a-maintenance
          fetch-depth: 1

      - name: Normalize temporary builder trailer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build_v110_candidate_a.py')
          text = path.read_text(encoding='utf-8')
          if text.rstrip().endswith("print(\"v1.1.0 Candidate A runtime/test build complete\")\n'''"):
              text = text.rstrip()[:-3].rstrip() + "\n"
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/build_v110_candidate_a.py

      - name: Build Candidate A runtime and tests
        run: python tools/build_v110_candidate_a.py

      - name: Commit generated Candidate A files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/storage.js \
            js/backup.js \
            js/optionalModules.js \
            js/legacy.js \
            js/settings.js \
            css/legacy.css \
            css/footballVisuals.css \
            css/visual-fidelity-r3.css \
            js/app.js \
            index.html \
            package.json \
            package-lock.json \
            tests/contracts/backup-contracts.cjs \
            tests/browser/backup-export-audit.cjs \
            tests/browser/football-visual-audit.cjs
          if git diff --cached --quiet; then
            echo "Candidate A output already current."
            exit 0
          fi
          git commit -m "Build v1.1.0 Candidate A backup and maintenance runtime"
          git push origin HEAD:agent/v1.1.0-candidate-a-maintenance
