name: Temporary v1.1.3 Reus Cache Alignment

on:
  push:
    branches:
      - v1.1.3-candidate-c-visual-fixes
    paths:
      - .github/workflows/temporary-align-reus-v113.yml

permissions:
  contents: write

jobs:
  align-reus-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Align exactly one protected Reus Home cache reference
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/menuExperience.js')
          text = path.read_text()
          old = 'thumbnail: "assets/marco-reus-2015-cc-by.webp?v=1.1.2-r1"'
          new = 'thumbnail: "assets/marco-reus-2015-cc-by.webp?v=1.1.3-r1"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale Reus reference, got {text.count(old)}')
          if new in text:
              raise SystemExit('new Reus cache reference already present unexpectedly')
          path.write_text(text.replace(old, new, 1))
          if path.stat().st_size != len(text.encode()):
              raise SystemExit('same-length cache identity update changed file byte size')
          print('Protected Reus Home cache reference aligned to 1.1.3-r1 with byte size unchanged.')
          PY
      - name: Publish only menuExperience cache identity
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = 'js/menuExperience.js'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/menuExperience.js
          git commit -m "Align protected Reus cache identity for v1.1.3"
          git push
