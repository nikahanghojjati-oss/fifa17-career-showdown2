name: v1.1.0 Guarded Startup Byte Trim

on:
  push:
    branches: [agent/v1.1.0-candidate-a-maintenance]
    paths:
      - .github/workflows/v110-startup-byte-trim.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.0-candidate-a-maintenance
          fetch-depth: 1
      - name: Recover startup headroom without changing behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('js/optionalModules.js')
          text=path.read_text(encoding='utf-8')
          old='''        }else if(name === "legacy"){
            return showScreen("legacy");
        }else if(name === "ruleBook"){'''
          new='''        }else if(name === "legacy"){return showScreen("legacy")
        }else if(name === "ruleBook"){'''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one Legacy route block, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check js/optionalModules.js
      - name: Enforce locked startup ceiling with margin
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/(?:src|href)="((?:js|css|data)\/[^"?#]+)(?:\?v=([^"#]+))?/g)].map(m=>m[1]);
          const bytes=refs.reduce((n,p)=>n+fs.statSync(p).size,0);
          console.log(`V110_FINAL_STARTUP_RAW_BYTES=${bytes}`);
          if(bytes>164995) throw new Error(`Insufficient startup headroom: ${bytes} > 164995`);
          NODE
      - name: Commit behavior-neutral trim
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/optionalModules.js
          git commit -m "Recover v1.1.0 startup budget headroom"
          git push origin HEAD:agent/v1.1.0-candidate-a-maintenance
