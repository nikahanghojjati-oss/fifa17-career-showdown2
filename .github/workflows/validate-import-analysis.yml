name: Validate Candidate B Import Analysis

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-analysis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  import-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Candidate B deterministic import, migration, conflict and no-write contracts
        run: npm run test:import-contracts

  import-browser:
    needs: import-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run authoritative Candidate B browser analysis
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-import-analysis.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN="candidate-b" npm run test:import-browser
      - name: Upload Candidate B Data Management evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-b-import-analysis-${{ github.sha }}
          path: test-results/candidate-b-import-*.png
          if-no-files-found: error
          retention-days: 14
