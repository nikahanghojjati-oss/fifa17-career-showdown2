name: TEMP r4 final contract and prefill repair

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-final-two-fixes.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded assertion and prefill repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          contract = Path('tests/contracts/stage5-activation-authority-contracts.cjs')
          text = contract.read_text()
          old = 'assert.match(stage5eLifecycle?.reason||"",/provider-live session lifecycle/i);'
          new = 'assert.match(stage5eLifecycle?.reason||"",/actual Remote Joining session capability end to end/i);'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Stage5 evidence wording assertion, found {text.count(old)}')
          contract.write_text(text.replace(old, new, 1))

          runtime = Path('js/sparkConnectedRivalry.js')
          text = runtime.read_text()
          old = 'const prefillRivalryId=!pointer&&pairingCandidate?pairingCandidate.rivalryId:null;'
          new = 'const prefillRivalryId=pairingCandidate&&(!pointer||pointer.rivalryId!==pairingCandidate.rivalryId||!crSameBinding(binding,pairingCandidate.binding))?pairingCandidate.rivalryId:null;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Connected Rivalry prefill expression, found {text.count(old)}')
          runtime.write_text(text.replace(old, new, 1))
          PY
      - name: Verify bounded repairs
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node tests/contracts/stage5-activation-authority-contracts.cjs
          npm run serve:test > /tmp/cms-r4-final-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/browser/pairing-four-code-automation-audit.cjs
      - name: Commit bounded repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/contracts/stage5-activation-authority-contracts.cjs js/sparkConnectedRivalry.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix r4 evidence assertion and preserve candidate prefill'
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
