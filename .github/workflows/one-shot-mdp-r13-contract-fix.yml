name: One-shot MDP r13 contract fix

on:
  push:
    branches:
      - chore/mdp-r13-integration-77-50

permissions:
  contents: write

jobs:
  fix-contract:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/mdp-r13-integration-77-50
      - name: Preserve design-only negative probes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/contracts/milestone-delivery-progress-contracts.cjs';
          let text = fs.readFileSync(path, 'utf8');
          const oldOut = 'const outOfOrder = clone(ledger); const multiSeason = outOfOrder.capabilities.find(capability => capability.id === "multi-season"); multiSeason.stages["automated-test"] = "complete";';
          const newOut = 'const outOfOrder = clone(ledger); const journeyReconnect = outOfOrder.capabilities.find(capability => capability.id === "journey-reconnect"); journeyReconnect.stages["automated-test"] = "complete";';
          const oldPartial = 'const inventedPartial = clone(ledger); inventedPartial.capabilities.find(capability => capability.id === "multi-season").lifecyclePercent = 25;';
          const newPartial = 'const inventedPartial = clone(ledger); inventedPartial.capabilities.find(capability => capability.id === "journey-reconnect").lifecyclePercent = 25;';
          if (!text.includes(oldOut) || !text.includes(oldPartial)) throw new Error('Expected r12 negative probes not found.');
          text = text.replace(oldOut, newOut).replace(oldPartial, newPartial);
          fs.writeFileSync(path, text);
          NODE
          rm .github/workflows/one-shot-mdp-r13-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contracts/milestone-delivery-progress-contracts.cjs .github/workflows/one-shot-mdp-r13-contract-fix.yml
          git commit -m "test: keep MDP negative probes on design-only capability"
          git push origin HEAD:chore/mdp-r13-integration-77-50
