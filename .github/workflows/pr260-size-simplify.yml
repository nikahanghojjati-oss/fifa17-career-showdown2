name: PR260 size simplification r2
on:
  push:
    branches: [feat/persistent-nik-daniel-pair]
    paths: [.github/workflows/pr260-size-simplify.yml]
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Simplify obsolete retry loop and verify release budgets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f'{path}: expected one match, found {n}: {old[:90]}')
              p.write_text(s.replace(old,new,1))
          patch('js/persistentNikDanielPair.js','  async function pairPersistPairLinkWithRetry(context,rivalryId,managerRole,attempts=2){let lastError=null;const total=Math.max(1,Number.isInteger(attempts)?attempts:2);for(let attempt=0;attempt<total;attempt+=1){try{return await pairPersistPairLink(context,rivalryId,managerRole);}catch(error){lastError=error;}}throw lastError||pairErrorWithCode("PERSISTENT_PAIR_LINK_SAVE_FAILED","The Showdown connection could not be saved to this account.");}\n','')
          patch('js/persistentNikDanielPair.js','pairPersistPairLinkWithRetry(context,result.rivalryId,role,2)','pairPersistPairLink(context,result.rivalryId,role)')
          patch('js/persistentNikDanielPair.js','pairPersistPairLinkWithRetry(context,state.rivalryId,role,3)','pairPersistPairLink(context,state.rivalryId,role)')
          patch('tests/contracts/persistent-nik-daniel-pair-contracts.cjs',"assert.match(pairSource,/async function pairPersistPairLinkWithRetry\\(/,'One-use pairing must retry the account pair-link write instead of abandoning a consumed capability after one transient failure.');","assert.doesNotMatch(pairSource,/pairPersistPairLinkWithRetry/,'Atomic redemption must not depend on a post-consumption account pair-link retry loop.');")
          PY
          npm ci
          node --check js/persistentNikDanielPair.js
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          git checkout -- firestore.spark.generated.rules 2>/dev/null || true
          node tests/contracts/static-app-release-contracts.cjs
          node tests/contracts/final-polish-presentation.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr260-size-simplify.yml
          git add js/persistentNikDanielPair.js tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          git diff --cached --check
          git commit -m "refactor(pr260): simplify atomic pair recovery path"
          git push origin HEAD:feat/persistent-nik-daniel-pair
