name: PR260 startup size repair
on:
  push:
    branches: [feat/persistent-nik-daniel-pair]
    paths: [.github/workflows/pr260-size-simplify.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Compact canonical manager guard and verify startup budget
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node - <<'NODE'
          const fs=require('node:fs'),z=require('node:zlib');
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/(?:src|href)="((?:js|css|data)\/[^"?#]+)(?:\?v=([^"#]+))?"/g)].map(m=>m[1]);
          for(const p of refs){const b=fs.readFileSync(p);console.log(`${p} ${b.length}/${z.gzipSync(b,{level:9}).length}`)}
          NODE
          python - <<'PY'
          from pathlib import Path
          p=Path('js/showdown.js')
          s=p.read_text()
          old='function assertCanonicalShowdownManagerMapping(showdown){const managers=showdown&&typeof showdown.managers==="object"?showdown.managers:null;if(!managers)return true;const one=typeof managers.playerOne==="string"?managers.playerOne.trim().toLowerCase():"",two=typeof managers.playerTwo==="string"?managers.playerTwo.trim().toLowerCase():"";if(one==="nik"&&two==="daniel"){const error=new Error("This saved Showdown uses the retired Nik as Player One and Daniel as Player Two mapping and cannot be opened safely.");error.code="SHOWDOWN_REVERSED_MANAGER_ROLES_UNSUPPORTED";throw error;}return true;}\nfunction normalizeShowdown(showdown){if(!showdown)return null;assertCanonicalShowdownManagerMapping(showdown);'
          new='function normalizeShowdown(showdown){if(!showdown)return null;const m=showdown.managers;if(m&&String(m.playerOne).trim().toLowerCase()==="nik"&&String(m.playerTwo).trim().toLowerCase()==="daniel"){const e=Error("Retired manager mapping.");e.code="SHOWDOWN_REVERSED_MANAGER_ROLES_UNSUPPORTED";throw e;}'
          if s.count(old)!=1: raise SystemExit(f'expected one canonical guard block, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check js/showdown.js
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          git checkout -- firestore.spark.generated.rules 2>/dev/null || true
          node tests/contracts/static-app-release-contracts.cjs
          node tests/contracts/final-polish-presentation.cjs
          node tests/contracts/stability-contracts.cjs
          node - <<'NODE'
          const fs=require('node:fs'),z=require('node:zlib');
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/(?:src|href)="((?:js|css|data)\/[^"?#]+)(?:\?v=([^"#]+))?"/g)].map(m=>m[1]);
          const raw=refs.reduce((n,p)=>n+fs.statSync(p).size,0),gz=refs.reduce((n,p)=>n+z.gzipSync(fs.readFileSync(p),{level:9}).length,0);
          console.log(`PR260 repaired startup bundle: ${raw}/${gz}`);
          if(raw>165000||gz>37500)process.exit(1);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr260-size-simplify.yml
          git add js/showdown.js
          git diff --cached --check
          git commit -m "refactor(pr260): compact canonical manager guard"
          git push origin HEAD:feat/persistent-nik-daniel-pair
