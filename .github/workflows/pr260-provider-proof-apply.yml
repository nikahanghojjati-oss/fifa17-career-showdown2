name: PR260 provider witness proof apply

on:
  push:
    branches:
      - feat/persistent-nik-daniel-pair
    paths:
      - .github/workflows/pr260-provider-proof-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply and verify provider witness proof patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pr260-provider-proof-hotfix.py
          node --check scripts/inject-persistent-pair-rules.mjs
          node --check tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          git checkout -- firestore.spark.generated.rules 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr260-provider-proof-apply.yml
          git rm .github/workflows/pr260-provider-authority-hardening.yml
          git rm scripts/pr260-provider-proof-hotfix.py
          git add tests/contracts/persistent-nik-daniel-pair-contracts.cjs tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs
          git diff --cached --check
          git commit -m "test(pr260): prove mandatory redemption witness"
          git push origin HEAD:feat/persistent-nik-daniel-pair
