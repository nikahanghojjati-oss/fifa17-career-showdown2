name: Validate Stability Lane

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Fresh first-attempt PR/push runs may replace stale work. A deliberate rerun or
# workflow_dispatch must never cancel an already-running proof for the same lane.
concurrency:
  group: stability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  stability-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked stability dependencies
        run: npm ci

      - name: Run storage, backup, restore, release, and CI contracts
        run: npm run test:contracts

  chromium-stability:
    needs: stability-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked stability dependencies
        run: npm ci

      - name: Run canonical runtime, Save Library, offline lifecycle, and complete integration journey
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN="stability-canonical" npm run test:runtime-boundary
          CMS_AUDIT_RUN="stability-canonical" node tests/browser/save-library-ui-audit.cjs
          CMS_AUDIT_RUN="stability-canonical" node tests/browser/manager-identity-linkage-audit.cjs
          CMS_AUDIT_RUN="stability-canonical" node tests/browser/offline-boundary-audit.cjs
          CMS_CHROMIUM_MULTI_CONTEXT=1 CMS_AUDIT_RUN="stability-canonical" node tests/browser/offline-cache-lifecycle-v2-audit.cjs
          CMS_AUDIT_RUN="stability-canonical" npm run test:browser

      - name: Upload canonical Stability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-stability-${{ github.run_id }}
          path: |
            test-results/stability-audit-*.json
            test-results/save-library-ui-*.json
            test-results/save-library-*.png
            test-results/manager-identity-linkage-*.json
            test-results/manager-identity-linkage-*.png
          if-no-files-found: warn
          retention-days: 14

  deployed-site-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: chromium-stability
    runs-on: ubuntu-latest
    timeout-minutes: 36

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked stability dependencies
        run: npm ci

      - name: Wait for Pages and verify every runtime byte
        env:
          CMS_DEPLOY_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
          CMS_DEPLOY_TIMEOUT_MS: 480000
        run: npm run verify:deployment

      - name: Run runtime error provenance audit against deployed Pages
        env:
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:runtime-boundary

      - name: Run Home visual audit against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:home-visual

      - name: Run visible Save Library audit against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: node tests/browser/save-library-ui-audit.cjs

      - name: Run manager identity linkage audit against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: node tests/browser/manager-identity-linkage-audit.cjs

      - name: Run crop-safe football-photo audit against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:football-visual

      - name: Run Candidate A backup export audit against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:backup-browser

      - name: Run Candidate B import analysis against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:import-browser

      - name: Run Candidate C atomic restore and recovery audit against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:restore-browser

      - name: Run install and offline boundary audit against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: node tests/browser/offline-boundary-audit.cjs

      - name: Run complete journey against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:browser
