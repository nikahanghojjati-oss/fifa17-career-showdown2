name: Validate Stability Lane

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stability-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked stability dependencies
        run: npm ci

      - name: Run storage, release, and CI contracts
        run: npm run test:contracts

  chromium-stability:
    needs: stability-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked stability dependencies
        run: npm ci

      - name: Run two consecutive complete browser, Home and licensed-photo audits
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2; do
            CMS_AUDIT_RUN="ci-${attempt}" npm run test:home-visual
            CMS_AUDIT_RUN="ci-${attempt}" npm run test:football-visual
            CMS_AUDIT_RUN="ci-${attempt}" npm run test:browser
          done

  deployed-site-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: chromium-stability
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked stability dependencies
        run: npm ci

      - name: Wait for Pages and verify every runtime byte
        env:
          CMS_DEPLOY_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
          CMS_DEPLOY_TIMEOUT_MS: 480000
        run: npm run verify:deployment

      - name: Run Home visual audit against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:home-visual

      - name: Run licensed-photo audit against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:football-visual

      - name: Run complete journey against deployed Pages
        env:
          CMS_AUDIT_RUN: deployed-main
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:browser
