name: Run Smart CI Documentation Reconcile

on:
  push:
    branches:
      - agent/v1.1.5-maintenance

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.5-maintenance
          fetch-depth: 0
      - name: Execute reviewed reconciliation payload
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(sed -n "s/^[[:space:]]*echo '\(.*\)' | base64 -d > \/tmp\/reconcile.py$/\1/p" .github/workflows/reconcile-smart-ci-docs.yaml)"
          test -n "$encoded"
          printf '%s' "$encoded" | tr -d '[:space:]' | base64 -d > /tmp/reconcile.py
          sed -i 's/cannot an active proof/cannot cancel an active proof/' /tmp/reconcile.py
          python /tmp/reconcile.py
      - name: Commit documentation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_DEVELOPER_START_HERE.md NEXT_TASK.md README.md PROJECT_STATE.md RELEASE_V1.1.5.md CAREER_MODE_SHOWDOWN_V1.1.5_POST_MERGE.md CHANGELOG.md CAREER_MODE_SHOWDOWN_V1.1.5_MAINTENANCE_HANDOFF.md
          git diff --cached --check
          git commit -m "Reconcile release docs with smart CI orchestration"
          git push origin HEAD:agent/v1.1.5-maintenance
