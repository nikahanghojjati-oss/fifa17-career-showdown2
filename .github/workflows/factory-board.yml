name: Team V board (shared data, Team V featured)

# Rebuilds project-documents/factory/BOARD.md from the shared data: "V-" PR progress blocks (featured),
# Team G's TEAM_G_PROGRESS.json on factory/gameplay-v1 (read-only, shown smaller) and the leads/relay feed.
# Job owners edit their PR description (no push, no CI); this polls every 3 minutes while a job runs on either team,
# every 10 minutes when nothing runs, and re-dispatches itself so the board never goes stale.
# Stop switch: commit an empty project-documents/factory/BOARD_PAUSED file; the chain ends at the next round.
# (Schedules only run on the default branch, which this workflow never touches, so it chains itself instead.)
# Factory branch only; it never runs on main and never writes to Team G's branch.
on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - .github/workflows/factory-board.yml
      - project-documents/factory/tools/shared_board.py
      - project-documents/factory/jobs/**
      - project-documents/factory/status/**
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: factory-board
  cancel-in-progress: false

jobs:
  board:
    # Loop guard: the bot's own commit never re-runs this (GITHUB_TOKEN pushes do not trigger workflows either).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: factory/v1-wtt5ye
          fetch-depth: 1
      - name: Poll, rebuild, commit when something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          F=project-documents/factory
          START=$(date +%s)
          while :; do
            git fetch -q --depth=1 origin factory/v1-wtt5ye
            git reset -q --hard origin/factory/v1-wtt5ye
            [ -f $F/BOARD_PAUSED ] && { echo "paused"; exit 0; }
            FOUND=$(python3 $F/tools/shared_board.py)
            # Commit only when more than the "Updated" line moved.
            if git diff -U0 -- $F/BOARD.md | grep '^[-+][^-+]' | grep -qv '^[-+]Updated '; then
              git add $F/BOARD.md
              git commit -qm "Team V board update [skip ci]"
              git push -q origin HEAD:factory/v1-wtt5ye || echo "push raced; next round retries"
            fi
            WAIT=600; [ "$FOUND" != "0" ] && WAIT=180
            [ $(( $(date +%s) - START + WAIT )) -gt 1500 ] && break
            sleep $WAIT
          done
          gh workflow run factory-board.yml --ref factory/v1-wtt5ye
