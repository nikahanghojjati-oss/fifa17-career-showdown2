name: Validate Licensed Football Visuals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-visuals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensed-visual-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Validate licensed asset manifest and crop-safe presentation architecture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const manifest = JSON.parse(fs.readFileSync('assets/football/asset-manifest.json','utf8'));
          const data = fs.readFileSync('data/footballVisuals.js','utf8');
          const renderer = fs.readFileSync('js/footballVisuals.js','utf8');
          const loader = fs.readFileSync('js/optionalModules.js','utf8');
          const screens = fs.readFileSync('js/screens.js','utf8');
          const notices = fs.readFileSync('THIRD_PARTY_NOTICES.md','utf8');
          const visualCss = fs.readFileSync('css/footballVisuals.css','utf8');
          const html = fs.readFileSync('index.html','utf8');
          const browserAudit = fs.readFileSync('tests/browser/football-visual-audit.cjs','utf8');

          assert.strictEqual(manifest.assets.length, 5, 'The licensed visual set must contain exactly five approved derivatives.');
          const expected = new Set([
            'james-rodriguez-real-madrid-2016-r4.webp',
            'marcus-rashford-man-utd-2016-r4.webp',
            'anthony-martial-man-utd-2015-r4.webp',
            'lionel-messi-barcelona-2016-subject-r4.webp',
            'philipp-lahm-world-cup-2014.webp'
          ]);
          const rejectedR3 = [
            'james-rodriguez-real-madrid-2016.webp',
            'marcus-rashford-man-utd-2016.webp',
            'anthony-martial-man-utd-2017.webp',
            'lionel-messi-barcelona-2016.webp'
          ];
          let total = 0;
          for(const asset of manifest.assets){
            assert.ok(expected.has(asset.output), `Unexpected licensed visual derivative: ${asset.output}`);
            const path = `assets/football/${asset.output}`;
            assert.ok(fs.existsSync(path), `Missing licensed visual derivative: ${path}`);
            const bytes = fs.statSync(path).size;
            assert.strictEqual(bytes, asset.output_bytes, `${asset.output} manifest byte count is stale.`);
            assert.ok(bytes <= 360000, `${asset.output} exceeds the 360 KB per-image ceiling (${bytes}).`);
            assert.ok(asset.output_dimensions[0] <= asset.source_dimensions[0] && asset.output_dimensions[1] <= asset.source_dimensions[1], `${asset.output} must never be upscaled during import.`);
            assert.ok(/^[a-f0-9]{64}$/.test(asset.output_sha256 || ''), `${asset.output} is missing its exact derivative SHA-256 fingerprint.`);
            assert.ok(asset.source_sha256, `${asset.output} is missing its source fingerprint/import record.`);
            assert.ok(asset.source_page.startsWith('https://commons.wikimedia.org/'), `${asset.output} must retain a Commons source page.`);
            assert.ok(/CC BY/.test(asset.license), `${asset.output} must retain an explicit Creative Commons license.`);
            assert.ok(notices.includes(asset.output) && notices.includes(asset.author) && notices.includes(asset.license), `${asset.output} attribution is incomplete in THIRD_PARTY_NOTICES.md.`);
            total += bytes;
          }
          assert.ok(total <= 1100000, `Licensed visual payload exceeds the 1.1 MB presentation ceiling (${total}).`);
          rejectedR3.forEach(file => {
            assert.ok(!manifest.assets.some(asset => asset.output === file), `Rejected r3 derivative remains active in the manifest: ${file}`);
            assert.ok(!fs.existsSync(`assets/football/${file}`), `Rejected r3 derivative remains in the runtime asset directory: ${file}`);
          });

          const james = manifest.assets.find(asset => asset.id === 'james-rodriguez-real-madrid-2016-r4');
          assert.ok(james, 'r4 James Rodríguez visual is missing.');
          assert.strictEqual(james.author, 'Real Madrid', 'James attribution changed unexpectedly.');
          assert.strictEqual(james.license, 'CC BY 3.0', 'James license changed unexpectedly.');
          assert.ok(james.source_page.includes('James_Rodr%C3%ADguez_in_September_2016_-_01.jpg'), 'James r4 source changed unexpectedly.');

          const rashford = manifest.assets.find(asset => asset.id === 'marcus-rashford-man-utd-2016-r4');
          assert.ok(rashford, 'r4 Manchester United Rashford visual is missing.');
          assert.deepStrictEqual(rashford.output_dimensions, [594,661], 'Rashford r4 derivative must retain the subject-dominant portrait geometry.');
          assert.strictEqual(rashford.author, 'Ardfern', 'Rashford attribution changed unexpectedly.');
          assert.strictEqual(rashford.license, 'CC BY-SA 4.0', 'Rashford license changed unexpectedly.');
          assert.ok(rashford.source_page.includes('Marcus_Rashford_September_2016_(cropped).jpg'), 'Rashford r4 subject source changed unexpectedly.');

          const martial = manifest.assets.find(asset => asset.id === 'anthony-martial-man-utd-2015-r4');
          assert.ok(martial, 'r4 Manchester United Martial visual is missing.');
          assert.deepStrictEqual(martial.output_dimensions, [688,560], 'Martial r4 derivative dimensions changed unexpectedly.');
          assert.strictEqual(martial.author, 'Dmitry Golubovich', 'Martial attribution changed unexpectedly.');
          assert.strictEqual(martial.license, 'CC BY-SA 2.5', 'Martial license changed unexpectedly.');
          assert.ok(martial.source_page.endsWith('File:Anthony_Martial_2015.jpg'), 'Martial r4 source changed unexpectedly.');

          const messi = manifest.assets.find(asset => asset.id === 'lionel-messi-barcelona-2016-subject-r4');
          assert.ok(messi, 'r4 Barcelona Messi visual is missing.');
          assert.deepStrictEqual(messi.output_dimensions, [469,779], 'Messi r4 derivative must retain its subject-isolated portrait geometry.');
          assert.strictEqual(messi.author, 'Save the Dream / derivative by SdHb', 'Messi attribution changed unexpectedly.');
          assert.strictEqual(messi.license, 'CC BY 2.0', 'Messi license changed unexpectedly.');
          assert.ok(messi.source_page.endsWith('File:Leo_Messi_2016.PNG'), 'Messi r4 subject-isolated source changed unexpectedly.');

          assert.ok(data.includes('framing: Object.freeze') && data.includes('mode: "subject-safe"'), 'r4 asset data must explicitly own subject-safe framing metadata.');
          assert.ok(data.includes('fit: "contain"'), 'Required player photography must use contained subject-safe framing.');
          assert.ok(!data.includes('fit: "cover"'), 'No required football visual may use blind cover framing in the r4 recovery build.');
          assert.ok(data.includes('layout: "trophy-subject-safe"'), 'Lahm Trophy Room must use the same crop-safe composition policy.');
          assert.ok(data.includes('rejectPortraitCover: true'), 'Portrait-to-wide cover regression guard is missing from visual data.');
          assert.ok(data.includes('createShowdown') && data.includes('transferChallenge') && data.includes('careerStatistics') && data.includes('trophyRoom'), 'Screen placement manifest is incomplete.');
          assert.ok(data.includes('marcus-rashford-man-utd-2016-r4.webp'), 'Runtime data must activate the selected subject-dominant Rashford derivative.');
          assert.ok(data.includes('lionel-messi-barcelona-2016-subject-r4.webp'), 'Runtime data must activate the selected subject-isolated Messi derivative.');

          assert.ok(renderer.includes('footballVisualMediaFrame'), 'Required photography renderer must use dedicated media-frame layers.');
          assert.ok(renderer.includes('getFootballVisualFraming') && renderer.includes('applyFootballVisualFraming'), 'Renderer must apply per-asset crop-safety metadata.');
          assert.ok(renderer.includes('--football-visual-fit') && renderer.includes('--football-visual-position'), 'Renderer must transfer framing policy to CSS.');
          assert.ok(renderer.includes('loading = "eager"'), 'Required screen photography must not remain browser-lazy.');
          assert.ok(renderer.includes('function preloadFootballVisualAssets'), 'Required photography must expose proactive preload ownership.');
          assert.ok(renderer.includes('await preloadFootballVisualAssets()'), 'Required photography initialization must await the visual set.');
          assert.ok(!renderer.includes('activateFootballVisualScreen'), 'Old route-visible lazy activation must not return.');

          assert.ok(visualCss.includes('object-fit:var(--football-visual-fit,contain)'), 'Required football photography must default to subject-safe contain framing.');
          assert.ok(!visualCss.includes('object-fit:cover'), 'The r4 corrective stylesheet must not reintroduce a blind full-bleed cover exception.');
          assert.ok(visualCss.includes('.footballVisualHeroSetup .footballVisualMediaFrame') && visualCss.includes('width:100%'), 'James desktop/tablet portrait frame must use the full visual column instead of a tiny inset.');
          assert.ok(visualCss.includes('marcus-rashford-man-utd-2016-r4') && visualCss.includes('width:50%'), 'Rashford desktop Transfer frame must be shaped for the selected portrait source.');
          assert.ok(visualCss.includes('.footballVisualAnalytics') && visualCss.includes('min-height:340px'), 'Messi Statistics composition must retain a portrait-aware desktop height.');
          assert.ok(visualCss.includes('.footballVisualTrophy .footballVisualMediaFrame') && visualCss.includes('width:58%'), 'Trophy Room must use a bounded crop-safe photo frame.');
          assert.ok(visualCss.includes('@media(max-width:480px)') && visualCss.includes('grid-template-columns:1fr'), 'Small-phone Transfer visuals must stack vertically instead of compressing two subjects into tiny wide slots.');

          assert.ok(browserAudit.includes('MIN_SUBJECT_SAFE_FRAME_COVERAGE'), 'Browser crop-quality gate is missing frame-coverage protection.');
          assert.ok(browserAudit.includes('visibleSourceFraction') && browserAudit.includes('cropFraction'), 'Browser gate must calculate how much of each source remains visible.');
          assert.ok(browserAudit.includes('portrait-to-wide cover crop is forbidden'), 'Browser gate must explicitly reject the previous Rashford/James failure class.');
          assert.ok(browserAudit.includes('Rejected r3 football photograph remains in active manifest'), 'Browser gate must fail if rejected r3 files return.');

          assert.ok(loader.includes('ensureRequiredFootballVisualExperience'), 'Required football presentation loader is missing.');
          assert.ok(loader.includes('Required football presentation could not be prepared'), 'Required visual warm-up failure must be surfaced.');
          assert.ok(loader.includes('css/footballVisuals.css') && loader.includes('data/footballVisuals.js') && loader.includes('js/footballVisuals.js'), 'Required visual runtime files are not owned by the staged loader.');
          assert.ok(screens.includes('REQUIRED_FOOTBALL_VISUAL_SCREENS'), 'Navigation does not identify required visual destinations.');
          assert.ok(screens.includes('Required football presentation could not mount'), 'Navigation must fail visibly if required photography cannot mount.');
          assert.ok(screens.includes('ensureRequiredFootballVisualExperience'), 'Navigation must await the required visual experience for destination screens.');
          assert.ok(!screens.includes('activateFootballVisualScreen'), 'Central navigation still contains old post-visibility activation.');

          assert.ok(!html.includes('assets/football/'), 'Large football photographs must not be hard-wired into the critical HTML parse path.');
          assert.ok(!html.includes('footballVisuals.css') && !html.includes('footballVisuals.js'), 'Required visual runtime should remain staged outside the critical shell budget.');
          assert.ok(notices.includes('required screen-level presentation assets'), 'Third-party notices still describe the imagery as optional.');
          assert.ok(notices.includes('blind portrait-to-wide'), 'Notices must explain the r4 crop-safety transformation policy.');
          assert.ok(notices.includes('complete source remains visible') || notices.includes('complete source is protected'), 'Notices must document full-source preservation for crop-safe photography.');

          console.log(`r4 crop-safe licensed visual contracts passed: ${manifest.assets.length} images / ${total} staged presentation bytes.`);
          NODE

  licensed-visual-browser:
    needs: licensed-visual-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Exercise Home and crop-safe required football visuals at desktop, near-breakpoint and mobile viewports
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-visual-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN=licensed-visual-gate npm run test:runtime-boundary
          CMS_AUDIT_RUN=licensed-visual-gate npm run test:home-visual
          CMS_AUDIT_RUN=licensed-visual-gate npm run test:football-visual
      - name: Upload rendered visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licensed-football-visual-r4-${{ github.sha }}
          path: test-results/*.png
          if-no-files-found: warn
          retention-days: 7
