name: Validate Licensed Football Visuals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-visuals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensed-visual-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Validate licensed asset manifest and lazy architecture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const manifest = JSON.parse(fs.readFileSync('assets/football/asset-manifest.json','utf8'));
          const data = fs.readFileSync('data/footballVisuals.js','utf8');
          const renderer = fs.readFileSync('js/footballVisuals.js','utf8');
          const loader = fs.readFileSync('js/optionalModules.js','utf8');
          const screens = fs.readFileSync('js/screens.js','utf8');
          const notices = fs.readFileSync('THIRD_PARTY_NOTICES.md','utf8');
          const html = fs.readFileSync('index.html','utf8');

          assert.strictEqual(manifest.assets.length, 5, 'The licensed visual set must contain exactly five approved candidate derivatives.');
          const expected = new Set([
            'james-rodriguez-real-madrid-2016.webp',
            'marcus-rashford-september-2016-cropped.webp',
            'anthony-martial-man-utd-2015.webp',
            'lionel-messi-barcelona-2016.webp',
            'philipp-lahm-world-cup-2014.webp'
          ]);
          let total = 0;
          for(const asset of manifest.assets){
            assert.ok(expected.has(asset.output), `Unexpected licensed visual derivative: ${asset.output}`);
            const path = `assets/football/${asset.output}`;
            assert.ok(fs.existsSync(path), `Missing licensed visual derivative: ${path}`);
            const bytes = fs.statSync(path).size;
            assert.strictEqual(bytes, asset.output_bytes, `${asset.output} manifest byte count is stale.`);
            assert.ok(bytes <= 360000, `${asset.output} exceeds the 360 KB per-image ceiling (${bytes}).`);
            assert.ok(asset.output_dimensions[0] <= asset.source_dimensions[0] && asset.output_dimensions[1] <= asset.source_dimensions[1], `${asset.output} must never be upscaled during import.`);
            assert.ok(asset.output_sha256 && asset.source_sha256, `${asset.output} is missing source/derivative fingerprints.`);
            assert.ok(asset.source_page.startsWith('https://commons.wikimedia.org/'), `${asset.output} must retain a Commons source page.`);
            assert.ok(/CC BY/.test(asset.license), `${asset.output} must retain an explicit Creative Commons license.`);
            assert.ok(notices.includes(asset.output) && notices.includes(asset.author) && notices.includes(asset.license), `${asset.output} attribution is incomplete in THIRD_PARTY_NOTICES.md.`);
            total += bytes;
          }
          assert.ok(total <= 1100000, `Licensed visual payload exceeds the 1.1 MB lazy ceiling (${total}).`);
          const messi = manifest.assets.find(asset => asset.id === 'lionel-messi-barcelona-2016');
          assert.ok(messi.output_dimensions[0] >= 1000, 'Messi derivative must preserve enough width for the desktop Statistics hero.');
          const rashford = manifest.assets.find(asset => asset.id === 'marcus-rashford-man-utd-september-2016');
          assert.ok(rashford, 'Recovered Work-selected Rashford asset is missing.');
          assert.deepStrictEqual(rashford.source_dimensions, [594,661], 'Recovered Rashford source dimensions changed unexpectedly.');
          assert.strictEqual(rashford.author, 'Ardfern', 'Recovered Rashford attribution changed unexpectedly.');
          assert.ok(rashford.source_page.includes('Marcus_Rashford_September_2016_(cropped).jpg'), 'Recovered Rashford source file changed unexpectedly.');

          assert.ok(data.includes('createShowdown') && data.includes('transferChallenge') && data.includes('careerStatistics') && data.includes('trophyRoom'), 'Screen placement manifest is incomplete.');
          assert.ok(renderer.includes('loading = "lazy"') && renderer.includes('fetchPriority = "low"'), 'Screen photography must remain low-priority and lazy.');
          assert.ok(renderer.includes('image.dataset.src = `${asset.src}?v=${getFootballVisualRevision()}`'), 'Licensed visual URL must remain inert until the target screen is visible.');
          assert.ok(renderer.includes('function activateFootballVisualScreen'), 'Licensed visual renderer must expose deterministic post-visibility activation.');
          assert.ok(loader.includes('ensureFootballVisualModule'), 'Licensed visual loader is missing.');
          assert.ok(loader.includes('css/footballVisuals.css') && loader.includes('data/footballVisuals.js') && loader.includes('js/footballVisuals.js'), 'Licensed visual runtime files are not owned by the lazy loader.');
          assert.ok(screens.includes('prepareFootballVisualScreen(screenName)'), 'Central navigation must prepare screen photography before entry.');
          assert.ok(screens.includes('activateFootballVisualScreen(screenName)'), 'Central navigation must activate photography only after the target screen is visible.');
          assert.ok(!html.includes('assets/football/'), 'Licensed screen photography must not enter the eager HTML shell.');
          assert.ok(!html.includes('footballVisuals.css') && !html.includes('footballVisuals.js'), 'Licensed visual runtime must remain lazy, not eagerly linked from index.html.');
          console.log(`Licensed visual contracts passed: ${manifest.assets.length} images / ${total} lazy bytes.`);
          NODE

  licensed-visual-browser:
    needs: licensed-visual-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Exercise Home and licensed football visuals at desktop, near-breakpoint and mobile viewports
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-visual-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN=licensed-visual-gate npm run test:home-visual
          CMS_AUDIT_RUN=licensed-visual-gate npm run test:football-visual
      - name: Upload rendered visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licensed-football-visual-${{ github.sha }}
          path: test-results/*.png
          if-no-files-found: warn
          retention-days: 7
