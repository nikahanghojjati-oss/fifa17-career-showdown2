name: Validate Licensed Football Visuals

on:
  push:
    branches: [main]
    paths-ignore:
      - "PROJECT_OPERATING_SYSTEM_V5.md"
      - "PROJECT_OPERATING_SYSTEM_V5.json"
      - "NEXT_TASK.md"
      - "CURRENT_PRODUCT_TEST_MANIFEST.json"
      - "scripts/pos5-*.mjs"
      - "scripts/build-developer-relay-file.mjs"
      - "scripts/build-recovery-beacon.mjs"
      - "tests/contracts/pos5-*.cjs"
      - "tests/contracts/project-operating-system-v5-contracts.cjs"
      - "tests/support/run-operations-audit.cjs"
      - "tests/support/run-current-product-contracts.cjs"
  pull_request:
    paths-ignore:
      - "PROJECT_OPERATING_SYSTEM_V5.md"
      - "PROJECT_OPERATING_SYSTEM_V5.json"
      - "NEXT_TASK.md"
      - "CURRENT_PRODUCT_TEST_MANIFEST.json"
      - "scripts/pos5-*.mjs"
      - "scripts/build-developer-relay-file.mjs"
      - "scripts/build-recovery-beacon.mjs"
      - "tests/contracts/pos5-*.cjs"
      - "tests/contracts/project-operating-system-v5-contracts.cjs"
      - "tests/support/run-operations-audit.cjs"
      - "tests/support/run-current-product-contracts.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-visuals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensed-visual-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate immutable v1.1.3 licensed archive and current release presentation contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/contracts/licensed-football-visuals-contract.cjs

  licensed-visual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Run permanent route-scoped responsive visual audit
        shell: bash
        env:
          CMS_AUDIT_RUN: licensed-visual
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-football-visual-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:football-visual
      - name: Upload licensed visual screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licensed-football-visuals-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/licensed-visual-*.png
          if-no-files-found: warn
          retention-days: 14
