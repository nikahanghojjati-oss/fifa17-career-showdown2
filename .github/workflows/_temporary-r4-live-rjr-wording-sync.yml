name: TEMP r4 live RJR wording sync

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-live-rjr-wording-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
          fetch-depth: 0
      - name: Restore canonical live RJR wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          edits = {
            'PROJECT_STATE.md': (
              'The failed r3 zero-manual-reattach behavior earns zero credit, and source, CI, review, merge, deployment and documentation earn zero RJR credit.\n',
              'The failed r3 zero-manual-reattach behavior earns zero credit, and source, CI, review, merge, deployment and documentation earn zero RJR credit.\n\nRemote Joining readiness: `88/100` under fixed RJR-1.\n'
            ),
            'NEXT_TASK.md': (
              'Authorized release candidate: `v1.9.0 / 1.9.0-r4`. Production-proven baseline remains `v1.9.0 / 1.9.0-r3` until publication/deployment gates close. Fixed RJR-1 is `88/100` from the already supplied provider-live r3 Remote Joining lifecycle only; r4 implementation/release mechanics earn zero readiness credit.\n',
              'Authorized release candidate: `v1.9.0 / 1.9.0-r4`. Production-proven baseline remains `v1.9.0 / 1.9.0-r3` until publication/deployment gates close. Fixed RJR-1 is `88/100` from the already supplied provider-live r3 Remote Joining lifecycle only; r4 implementation/release mechanics earn zero readiness credit.\n\nRemote Joining readiness: `88/100` under fixed RJR-1.\n'
            )
          }
          for file, (old, new) in edits.items():
              p = Path(file)
              text = p.read_text()
              assert old in text, f'live RJR wording anchor missing in {file}'
              assert 'Remote Joining readiness: `88/100` under fixed RJR-1.' not in text.split('---',1)[0], f'canonical live RJR wording already present in {file}'
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit canonical live RJR wording
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md NEXT_TASK.md
          git commit -m "Restore canonical RJR88 live reporting"
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
