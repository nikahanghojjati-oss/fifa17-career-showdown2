name: Normalize Required Visual Routing

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/normalize-required-visual-routing.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Normalize required visual route ownership
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('js/screens.js')
          source = path.read_text()

          required_decl = 'const REQUIRED_FOOTBALL_VISUAL_SCREENS = new Set(["createShowdown","transferChallenge","careerStatistics","trophyRoom"]);\n\n'
          if required_decl not in source:
              raise SystemExit('Required visual route set declaration missing.')
          source = source.replace(required_decl, '', 1)

          safe_start = source.index('const SAFE_BACK_TARGETS = Object.freeze({')
          safe_end = source.index('\n});', safe_start) + len('\n});')
          source = source[:safe_end] + '\n\n' + required_decl.rstrip() + source[safe_end:]

          pattern = re.compile(
              r'\s*if\(REQUIRED_FOOTBALL_VISUAL_SCREENS\.has\(screenName\)\)\{\s*'
              r'if\(typeof window\.prepareFootballVisualScreen !== "function" \|\| !window\.prepareFootballVisualScreen\(screenName\)\)\{\s*'
              r'throw new Error\(`Required football presentation could not mount for \$\{screenName\}\.\`\);\s*}\s*}',
              re.MULTILINE
          )
          replacement = '''
              if(REQUIRED_FOOTBALL_VISUAL_SCREENS.has(screenName)){
                  const runtimeOwnsRequiredVisuals = typeof window.ensureRequiredFootballVisualExperience === "function";
                  if(typeof window.prepareFootballVisualScreen === "function"){
                      if(!window.prepareFootballVisualScreen(screenName)){
                          throw new Error(`Required football presentation could not mount for ${screenName}.`);
                      }
                  }else if(runtimeOwnsRequiredVisuals){
                      throw new Error(`Required football presentation is unavailable for ${screenName}.`);
                  }
              }'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'Could not normalize renderScreenBeforeEnter required visual block; count={count}')

          # Architecture guarantees: production navigation awaits the visual system;
          # direct isolated screens.js tests remain possible without loading every module.
          assert source.index('const SAFE_BACK_TARGETS') < source.index('const REQUIRED_FOOTBALL_VISUAL_SCREENS')
          assert 'await window.ensureRequiredFootballVisualExperience();' in source
          assert 'runtimeOwnsRequiredVisuals' in source
          assert 'Required football presentation could not mount' in source
          path.write_text(source)
          print('Required visual routing normalized.')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-required-visual-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize required visual routing contracts'
          git push origin HEAD:agent/licensed-football-visual-system-r1
