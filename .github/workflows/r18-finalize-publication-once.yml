name: R18 Staged Terminal Proof Diagnostic

on:
  push:
    branches: [feat/ssjr-terminal-close-r18]
    paths: [.github/workflows/r18-finalize-publication-once.yml]

permissions:
  contents: write

jobs:
  validate-staged-terminal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install repository dependencies
        run: npm ci
      - name: Validate focused provider and Rules contracts
        run: |
          node tests/contracts/shared-terminal-close-provider-contracts.cjs
          node tests/contracts/shared-terminal-close-rules-contracts.cjs
      - name: Install pinned Firebase emulator dependencies
        run: npm install --no-save --package-lock=false firebase@12.17.1 @firebase/rules-unit-testing@5.0.1 firebase-admin@14.2.0
      - name: Build generated production Rules
        run: node scripts/build-production-firestore-rules.mjs
      - name: Run staged r18 adversarial emulator including 10-season journey
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-terminal-close-production-diagnostic "node tests/firebase/shared-terminal-close-production-provider-emulator.cjs"
      - name: Restore guarded full publication finalizer after green diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/ssjr-terminal-close-r18
          git reset --hard origin/feat/ssjr-terminal-close-r18
          git show 6ff7ef5a9b271163a96222683d10875a3e6d9a1e:.github/workflows/r18-finalize-publication-once.yml > .github/workflows/r18-finalize-publication-once.yml
          printf '\n# retriggered after staged terminal-proof budget validation\n' >> .github/workflows/r18-finalize-publication-once.yml
          git config user.name "nikahanghojjati-oss"
          git config user.email "nikahang.hojjati@gmail.com"
          git add .github/workflows/r18-finalize-publication-once.yml
          git commit -m "ci: resume r18 publication after terminal proof validation"
          git push origin HEAD:feat/ssjr-terminal-close-r18

# diagnostic rerun after placing Terminal Close before legacy rivalry redeem evaluation
# diagnostic rerun after splitting the atomic session-close authority from the legacy session validator
# diagnostic rerun after terminal-owned writes are routed exclusively away from legacy fallbacks
