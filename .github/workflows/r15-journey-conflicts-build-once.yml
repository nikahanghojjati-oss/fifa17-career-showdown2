name: r15 Journey Conflicts guarded build
on:
  push:
    branches:
      - feat/ssjr-journey-conflicts-r15
    paths:
      - '.github/workflows/r15-journey-conflicts-build-once.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ssjr-journey-conflicts-r15
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire r15 into existing product surfaces
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_exact(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new))

          # Shared Setup: keep provider adapter authoritative; wrap only the existing mutate invocation.
          replace_exact('js/productionSharedShowdownSetup.js',
            '    ["spark-shared-setup","js/sparkSharedShowdownSetup.js",()=>root.CareerModeSparkSharedShowdownSetup]\n  ]);',
            '    ["spark-shared-setup","js/sparkSharedShowdownSetup.js",()=>root.CareerModeSparkSharedShowdownSetup],\n    ["journey-conflicts","js/productionSharedJourneyConflicts.js",()=>root.CareerModeProductionSharedJourneyConflicts]\n  ]);')
          replace_exact('js/productionSharedShowdownSetup.js',
            '    const runtime=deps["production-runtime"],account=deps["connected-account"],pairing=deps["private-pairing"],rivalry=deps["connected-rivalry"],remote=deps["remote-joining"],adapter=deps["spark-shared-setup"];',
            '    const runtime=deps["production-runtime"],account=deps["connected-account"],pairing=deps["private-pairing"],rivalry=deps["connected-rivalry"],remote=deps["remote-joining"],adapter=deps["spark-shared-setup"],conflicts=deps["journey-conflicts"];')
          replace_exact('js/productionSharedShowdownSetup.js',
            '    if(!adapter||typeof adapter.read!=="function"||typeof adapter.mutate!=="function")fail("SHARED_SETUP_PROVIDER_UNAVAILABLE","Shared Setup transaction authority is unavailable.");\n    return Object.freeze({adapter,services,user,rivalryId:rivalryState.rivalryId,sessionId:remoteState.sessionId,accountId:user.uid,deviceId:pairingState.deviceId,managerRole,remoteRole});',
            '    if(!adapter||typeof adapter.read!=="function"||typeof adapter.mutate!=="function")fail("SHARED_SETUP_PROVIDER_UNAVAILABLE","Shared Setup transaction authority is unavailable.");\n    if(!conflicts||typeof conflicts.execute!=="function")fail("JOURNEY_CONFLICT_GUARD_UNAVAILABLE","Shared Journey conflict guard is unavailable.");\n    return Object.freeze({adapter,conflicts,services,user,rivalryId:rivalryState.rivalryId,sessionId:remoteState.sessionId,accountId:user.uid,deviceId:pairingState.deviceId,managerRole,remoteRole});')
          replace_exact('js/productionSharedShowdownSetup.js',
            '      const result=await context.adapter.mutate({...providerOptions(context),type,operationId:randomOperationId(),baseRevision:current.revision||0,...extra});',
            '      const operationId=randomOperationId(),baseRevision=current.revision||0;\n      const providerRequest={...providerOptions(context),type,operationId,baseRevision,...extra};\n      const result=await context.conflicts.execute({surface:"shared-setup",action:type,operationId,baseRevision,authority:{accountId:context.accountId,deviceId:context.deviceId,rivalryId:context.rivalryId,sessionId:context.sessionId,managerRole:context.managerRole},intent:type==="commit-length"?{totalSeasons:extra.totalSeasons}:{}},()=>context.adapter.mutate(providerRequest));')

          # Season Commit: preserve its existing one-reread bounded stale retry, but audit/preflight each provider mutation.
          replace_exact('js/productionSharedSeasonCommit.js',
            '  let installed=false,busy=false,provider=null,setupApi=null,resultsApi=null,view=null,contextKey="",providerChain=Promise.resolve(),refreshPromise=null,headingObserver=null,bootstrapObserver=null;',
            '  let installed=false,busy=false,provider=null,conflictGuard=null,setupApi=null,resultsApi=null,view=null,contextKey="",providerChain=Promise.resolve(),refreshPromise=null,headingObserver=null,bootstrapObserver=null;')
          replace_exact('js/productionSharedSeasonCommit.js',
            '    await psscLoadScript("firebase-runtime","js/productionFirebaseRuntime.js",()=>root.CareerModeProductionFirebaseRuntime);\n    setupApi=root.CareerModeProductionSharedShowdownSetup;resultsApi=root.CareerModeProductionSharedSeasonResults;provider=root.CareerModeSparkSharedSeasonCommit;',
            '    await psscLoadScript("firebase-runtime","js/productionFirebaseRuntime.js",()=>root.CareerModeProductionFirebaseRuntime);\n    await psscLoadScript("ssjr-production-journey-conflicts","js/productionSharedJourneyConflicts.js",()=>root.CareerModeProductionSharedJourneyConflicts);\n    setupApi=root.CareerModeProductionSharedShowdownSetup;resultsApi=root.CareerModeProductionSharedSeasonResults;provider=root.CareerModeSparkSharedSeasonCommit;conflictGuard=root.CareerModeProductionSharedJourneyConflicts;')
          replace_exact('js/productionSharedSeasonCommit.js',
            '    if(!provider||typeof provider.read!=="function"||typeof provider.commitSeason!=="function"||typeof provider.acknowledgeSeason!=="function")psscFail("SEASON_COMMIT_PROVIDER_UNAVAILABLE");',
            '    if(!provider||typeof provider.read!=="function"||typeof provider.commitSeason!=="function"||typeof provider.acknowledgeSeason!=="function")psscFail("SEASON_COMMIT_PROVIDER_UNAVAILABLE");\n    if(!conflictGuard||typeof conflictGuard.execute!=="function")psscFail("JOURNEY_CONFLICT_GUARD_UNAVAILABLE");')
          replace_exact('js/productionSharedSeasonCommit.js',
            '          const result=await provider[method]({...ctx.options,operationId,baseRevision:Number(current.revision||0)});',
            '          const baseRevision=Number(current.revision||0);\n          const providerRequest={...ctx.options,operationId,baseRevision};\n          const result=await conflictGuard.execute({surface:"season-commit",action:kind==="commit"?"commit-season":"acknowledge-season",operationId,baseRevision,authority:{accountId:ctx.options.user.uid,deviceId:ctx.setup.deviceId,rivalryId:ctx.setup.rivalryId,sessionId:ctx.setup.sessionId,managerRole:ctx.setup.managerRole},intent:{seasonNumber:request.seasonNumber}},()=>provider[method](providerRequest));')

          # Bootstrap r15 strictly after r14 recovery.
          replace_exact('js/ssjr.js',
            '    const journeyReconnect=(async()=>{\n      await multiSeason;\n      await prepare([\n        ["ssjr-journey-reconnect-protocol","js/sharedJourneyReconnect.js","CareerModeSharedJourneyReconnect"]\n      ]);\n      return install("ssjr-production-journey-reconnect","js/productionSharedJourneyReconnect.js","CareerModeProductionSharedJourneyReconnect");\n    })();',
            '    const journeyReconnect=(async()=>{\n      await multiSeason;\n      await prepare([\n        ["ssjr-journey-reconnect-protocol","js/sharedJourneyReconnect.js","CareerModeSharedJourneyReconnect"]\n      ]);\n      return install("ssjr-production-journey-reconnect","js/productionSharedJourneyReconnect.js","CareerModeProductionSharedJourneyReconnect");\n    })();\n    const journeyConflicts=(async()=>{\n      await journeyReconnect;\n      await prepare([\n        ["ssjr-journey-conflicts-protocol","js/sharedJourneyConflicts.js","CareerModeSharedJourneyConflicts"]\n      ]);\n      return install("ssjr-production-journey-conflicts","js/productionSharedJourneyConflicts.js","CareerModeProductionSharedJourneyConflicts");\n    })();')
          replace_exact('js/ssjr.js','      journeyReconnect,\n      (async()=>{await seasonResultsRoute;', '      journeyReconnect,\n      journeyConflicts,\n      (async()=>{await seasonResultsRoute;')

          # Candidate shell retains new assets; release identity remains r14 until publication gate.
          replace_exact('service-worker.js',
            '    "js/sharedJourneyReconnect.js",\n    "js/productionSharedJourneyReconnect.js",',
            '    "js/sharedJourneyReconnect.js",\n    "js/productionSharedJourneyReconnect.js",\n    "js/sharedJourneyConflicts.js",\n    "js/productionSharedJourneyConflicts.js",')

          # Package test routes.
          p=Path('package.json'); package=json.loads(p.read_text()); scripts=package['scripts']
          def append_once(name, command):
              value=scripts[name]
              if command not in value: scripts[name]=value+' && '+command
          append_once('test:ssjr','node tests/contracts/shared-journey-conflicts-contracts.cjs')
          append_once('test:ssjr','node tests/contracts/shared-journey-conflicts-production-contracts.cjs')
          append_once('test:browser','CMS_CHROMIUM_MULTI_CONTEXT=1 node tests/browser/shared-journey-conflicts-audit.cjs')
          append_once('test:ssjr:browser','CMS_CHROMIUM_MULTI_CONTEXT=1 node tests/browser/shared-journey-conflicts-audit.cjs')
          scripts['test:ssjr:journey-conflicts']='node tests/contracts/shared-journey-conflicts-contracts.cjs && node tests/contracts/shared-journey-conflicts-production-contracts.cjs && CMS_CHROMIUM_MULTI_CONTEXT=1 node tests/browser/shared-journey-conflicts-audit.cjs'
          p.write_text(json.dumps(package,indent=2)+'\n')

          # POS20 registration: new capability strengthens, never replaces, inherited floor.
          p=Path('POS20_SUPPLEMENTAL_PRODUCT_TESTS.json'); registry=json.loads(p.read_text())
          paths={entry['path'] for entry in registry['tests']}
          core='tests/contracts/shared-journey-conflicts-contracts.cjs'
          prod='tests/contracts/shared-journey-conflicts-production-contracts.cjs'
          if core not in paths:
              registry['tests'].append({'path':core,'patterns':['^js/sharedJourneyConflicts\\.js$','^tests/contracts/shared-journey-conflicts-contracts\\.cjs$','^POS20_SUPPLEMENTAL_PRODUCT_TESTS\\.json$']})
          if prod not in paths:
              registry['tests'].append({'path':prod,'patterns':['^js/sharedJourneyConflicts\\.js$','^js/productionSharedJourneyConflicts\\.js$','^js/productionSharedShowdownSetup\\.js$','^js/productionSharedSeasonCommit\\.js$','^js/sparkSharedShowdownSetup\\.js$','^js/sparkSharedSeasonCommit\\.js$','^js/ssjr\\.js$','^tests/contracts/shared-journey-conflicts-contracts\\.cjs$','^tests/contracts/shared-journey-conflicts-production-contracts\\.cjs$','^tests/browser/shared-journey-conflicts-audit\\.cjs$','^package\\.json$','^POS20_SUPPLEMENTAL_PRODUCT_TESTS\\.json$','^service-worker\\.js$']})
          p.write_text(json.dumps(registry,indent=2)+'\n')

          # The operations control plane owns the exact supplemental set.
          p=Path('tests/operations/pos20-control-plane.test.mjs'); text=p.read_text()
          anchor="  'tests/contracts/shared-journey-reconnect-production-contracts.cjs'"
          if "shared-journey-conflicts-contracts.cjs" not in text:
              if anchor not in text: raise SystemExit('POS20 control plane supplemental anchor not found')
              text=text.replace(anchor,anchor+",\n  'tests/contracts/shared-journey-conflicts-contracts.cjs',\n  'tests/contracts/shared-journey-conflicts-production-contracts.cjs'",1)
          p.write_text(text)
      - name: Validate r15 deterministic and production contracts
        run: |
          node tests/contracts/shared-journey-conflicts-contracts.cjs
          node tests/contracts/shared-journey-conflicts-production-contracts.cjs
          npm run test:ops
      - name: Validate r15 two-context browser audit
        run: |
          node tests/support/static-server.cjs >/tmp/r15-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          CMS_CHROMIUM_MULTI_CONTEXT=1 node tests/browser/shared-journey-conflicts-audit.cjs
      - name: Commit validated r15 integration and remove one-shot workflow
        run: |
          rm .github/workflows/r15-journey-conflicts-build-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate r15 Journey Conflicts guard and proofs'
          git push origin HEAD:feat/ssjr-journey-conflicts-r15
