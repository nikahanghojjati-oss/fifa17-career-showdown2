name: One-shot r14 MDP accounting

on:
  push:
    branches:
      - chore/mdp-r14-integration-82-00
    paths:
      - .github/workflows/mdp-r14-accounting-once.yml

permissions:
  contents: write

jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/mdp-r14-integration-82-00
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Record r14 lifecycle closure
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          PRODUCT_MAIN='97c28b1efea6ee6e901e6076a834ec419cbad5aa'
          CANDIDATE='4ca8651bcdd20b794fa78943c4636666d20a1dd0'

          ledger_path=Path('MILESTONE_DELIVERY_PROGRESS.json')
          ledger=json.loads(ledger_path.read_text())
          if ledger.get('currentScore') != 77.5:
              raise SystemExit(f'expected MDP 77.5 before r14 accounting, got {ledger.get("currentScore")}')
          if ledger.get('separationFromSSJR',{}).get('ssjrScore') != 0:
              raise SystemExit('SSJR must remain zero during MDP accounting')
          jr=next((c for c in ledger['capabilities'] if c['id']=='journey-reconnect'),None)
          if not jr or jr.get('lifecyclePercent') != 10 or jr.get('status') != 'design_defined':
              raise SystemExit('Journey Reconnect was not at the expected design-only accounting state')

          ledger['recordedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ledger['basis']={
            'mainSha':PRODUCT_MAIN,
            'branch':'main',
            'candidateHead':CANDIDATE,
            'candidateValidation':'POS20 run #371 exact-head green',
            'integrationMergeSha':PRODUCT_MAIN,
            'pagesDeployment':'GitHub Pages run #117 success',
            'firestoreRulesDeployment':'No new Firestore Rules deployment required for r14; Journey Reconnect is read-only and reuses existing Spark authority.',
            'productionVersion':'v1.9.1',
            'productionRuntimeRevision':'1.9.1-r14',
            'note':'r14 Shared Journey Reconnect is repaired, merged and coherently deployed on exact product main 97c28b1efea6ee6e901e6076a834ec419cbad5aa. PR #242 exact head 4ca8651bcdd20b794fa78943c4636666d20a1dd0 passed POS20 run #371; GitHub Pages run #117 succeeded on r14 main; POS20 run #372 passed on that same main including its exact-head cognitive seal; Release Integration Burn-In run #374 passed both stateful integration journeys. A real pre-publication service-worker shell omission was found by the inherited reload acceptance proof, corrected by caching both Journey Reconnect runtime assets, and freshly revalidated before merge. No new Firestore write/list surface or Rules publication was required. Journey Reconnect has therefore completed all six MDP lifecycle stages. SSJR remains separate and zero until genuine production-two-account evidence is accepted.'
          }
          ledger['currentScore']=82
          ledger['formattedScore']='82.00/100'
          ledger['summary']={
            'featureCount':20,
            'fullyLifecycleDelivered':14,
            'preIntegrationComplete':0,
            'designDefinedOnly':6,
            'reusableFoundationsNotInflated':True,
            'interpretation':'Fourteen SSJR capabilities from shared entry through Journey Reconnect are fully engineered, regression-tested and product-integrated in coherent r14 production. Six later capabilities remain design-defined only.'
          }
          jr['lifecyclePercent']=100
          jr['weightedContribution']=5
          jr['status']='integrated'
          for stage in jr['stages']:
              jr['stages'][stage]='complete'
          jr['evidenceRefs']=[
            'SHARED_SHOWDOWN_JOURNEY_MODEL.json',
            'js/sharedJourneyReconnect.js',
            'js/productionSharedJourneyReconnect.js',
            'js/productionSharedJourneyEntry.js',
            'service-worker.js',
            'tests/contracts/shared-journey-reconnect-contracts.cjs',
            'tests/contracts/shared-journey-reconnect-production-contracts.cjs',
            'tests/browser/shared-journey-reconnect-audit.cjs',
            'RELEASE_V1.9.1_R14.md',
            'PR #242 exact candidate head 4ca8651bcdd20b794fa78943c4636666d20a1dd0',
            'POS20 run #371 exact-head green',
            'PR #242 merge 97c28b1efea6ee6e901e6076a834ec419cbad5aa',
            'GitHub Pages run #117 success',
            'POS20 run #372 main green',
            'Release Integration Burn-In run #374 success'
          ]
          jr['note']='r14 Shared Journey Reconnect completed all six MDP lifecycle stages after a real service-worker reload integration defect was found and corrected: exact ACTIVE authority requires finite unexpired session state; offline hold, reload/fresh-runtime recovery, expiry/fresh-session reauthorization, idempotent re-entry and terminal non-resurrection are proven; both new runtime assets are retained in the service-worker shell; exact candidate and main POS20, coherent Pages deployment and two-pass release burn-in are green. The recovery remains read-only, preserves canonical local storage, adds no paid/list/write authority, and grants zero SSJR credit without production-two-account evidence.'
          ledger['scoreCheck']={
            'fullyIntegratedWeight':80,
            'remainingDesignWeight':20,
            'remainingDesignContribution':2,
            'calculatedScore':82
          }
          ledger_path.write_text(json.dumps(ledger,separators=(',',':')))

          readiness_path=Path('SHARED_SHOWDOWN_JOURNEY_READINESS.json')
          readiness=json.loads(readiness_path.read_text())
          if readiness.get('currentScore') != 0:
              raise SystemExit('SSJR readiness must remain zero')
          if any(item.get('id')=='ssjr1-journey-reconnect-r14-production' for item in readiness.get('candidateEvidence',[])):
              raise SystemExit('r14 SSJR candidate evidence already exists unexpectedly')
          readiness['candidateEvidence'].append({
            'id':'ssjr1-journey-reconnect-r14-production',
            'layers':['deterministic-behavior','provider-enforcement','isolated-browser-protocol','deployed-runtime'],
            'references':[
              'PR #242 exact candidate head 4ca8651bcdd20b794fa78943c4636666d20a1dd0',
              'POS20 run #371 exact-head green',
              'PR #242 merge 97c28b1efea6ee6e901e6076a834ec419cbad5aa',
              'GitHub Pages run #117 success',
              'POS20 run #372 main green',
              'Release Integration Burn-In run #374 success',
              'js/sharedJourneyReconnect.js',
              'js/productionSharedJourneyReconnect.js',
              'tests/contracts/shared-journey-reconnect-contracts.cjs',
              'tests/contracts/shared-journey-reconnect-production-contracts.cjs',
              'tests/browser/shared-journey-reconnect-audit.cjs'
            ],
            'relatedCapabilityIds':['journey-reconnect'],
            'credit':0,
            'missingLayers':['production-two-account'],
            'finding':'r14 Shared Journey Reconnect is coherently merged, repaired and deployed. Exact candidate and main POS20 plus two-pass release burn-in prove deterministic adverse-network recovery, strict expired-session rejection, fresh-session reauthorization, fresh-runtime reconstruction, terminal non-resurrection, service-worker reload safety and zero canonical local-save mutation. It remains zero SSJR credit solely because genuine production-two-account evidence has not yet been accepted.'
          })
          readiness['deliveryProgressTracker']['currentScore']=82
          readiness['deliveryProgressTracker']['formattedScore']='82.00/100'
          readiness_path.write_text(json.dumps(readiness,separators=(',',':')))

          next_task=Path('NEXT_TASK.md')
          next_task.write_text('''# Current product task under POS20\n\nPrimary objective: advance MDP-1 to 100.00/100 before returning primary focus to SSJR production-two-account acceptance. SSJR-1.1 remains 0/100 until genuine production-two-account evidence is accepted.\n\nCurrent integrated product authority is r14 Journey Reconnect on main `97c28b1efea6ee6e901e6076a834ec419cbad5aa`. After the r14 accounting-only PR lands, MDP-1 is 82.00/100. Accounting or handoff packaging earns no additional MDP or SSJR credit.\n\nImmediate feature is `journey-conflicts`, frozen milestone weight 5. Build from the live accounting main on an isolated r15 branch. Reject stale, replay-altered and unauthorized shared journey changes. Prove two-manager contention, wrong role/account/device, account/device/session/rivalry revocation, expired authorization/receipt handling, altered replay, quota/provider failure, idempotent retry and provider-enforced no-commit outcomes without changing canonical local Save authority. Reuse existing Shared Setup, Season Commit, Remote Joining and Journey Reconnect conflict primitives only where their exact contracts already apply; predecessor primitives do not count as Journey Conflicts lifecycle completion until the r15 end-to-end capability is wired and independently proven.\n\nFor every capability, award lifecycle stages only from exact-head evidence. Candidate work cannot earn product-integration credit. Require exact candidate POS20, expected-head merge, coherent Pages deployment, main POS20 and two-pass release burn-in before the final product-integration stage. Never combine CI evidence across heads.\n\nPermanent locks remain: billing OFF, Firebase Spark only, App Check enforcement OFF, memory-only Firestore, popup-only Google Auth, exactly two private managers, pairing plus exact ACTIVE session before protected shared authority, Candidate C sole destructive Apply with exact rollback, canonical local storage unchanged, no public discovery/community/rankings.\n''')

          contract=Path('tests/contracts/milestone-delivery-progress-contracts.cjs')
          text=contract.read_text()
          replacements={
            'assert.equal(result.score, 77.5, "r13 Multi Season earns product integration only after exact corrected-head validation, expected-head merge, coherent Pages deployment, main POS20 validation and release burn-in.");':'assert.equal(result.score, 82, "r14 Journey Reconnect earns product integration only after exact corrected-head validation, expected-head merge, coherent Pages deployment, main POS20 validation and release burn-in.");',
            'assert.equal(result.formattedScore, "77.50/100");':'assert.equal(result.formattedScore, "82.00/100");',
            'assert.equal(result.fullyLifecycleDelivered, 13);':'assert.equal(result.fullyLifecycleDelivered, 14);',
            'assert.equal(result.designDefinedOnly, 7);':'assert.equal(result.designDefinedOnly, 6);',
            'assert.equal(ledger.basis.mainSha, "cfe6f8017c5326bfb23b547830c22d1c6b3a8bfd");':'assert.equal(ledger.basis.mainSha, "97c28b1efea6ee6e901e6076a834ec419cbad5aa");',
            'assert.equal(ledger.basis.integrationMergeSha, "cfe6f8017c5326bfb23b547830c22d1c6b3a8bfd");':'assert.equal(ledger.basis.integrationMergeSha, "97c28b1efea6ee6e901e6076a834ec419cbad5aa");',
            'assert.equal(ledger.basis.candidateHead, "96dcf910a724fab2fec1dcba77c9b67d0cee0fe1");':'assert.equal(ledger.basis.candidateHead, "4ca8651bcdd20b794fa78943c4636666d20a1dd0");',
            'assert.match(ledger.basis.candidateValidation, /POS20 run #343 exact-head green/);':'assert.match(ledger.basis.candidateValidation, /POS20 run #371 exact-head green/);',
            'assert.equal(ledger.basis.productionRuntimeRevision, "1.9.1-r13");':'assert.equal(ledger.basis.productionRuntimeRevision, "1.9.1-r14");',
            'assert.match(ledger.basis.pagesDeployment, /GitHub Pages run #115 success/i);':'assert.match(ledger.basis.pagesDeployment, /GitHub Pages run #117 success/i);',
            'assert.match(ledger.basis.note, /POS20 run #350 passed/i);':'assert.match(ledger.basis.note, /POS20 run #372 passed/i);',
            'assert.match(ledger.basis.note, /Release Integration Burn-In run #372 passed both/i);':'assert.match(ledger.basis.note, /Release Integration Burn-In run #374 passed both/i);',
            '"career-start","transfer-challenge","results-publication","season-commit","canonical-scoring","history-convergence","multi-season"':'"career-start","transfer-challenge","results-publication","season-commit","canonical-scoring","history-convergence","multi-season","journey-reconnect"',
            'assert.equal(ledger.scoreCheck.fullyIntegratedWeight, 75);':'assert.equal(ledger.scoreCheck.fullyIntegratedWeight, 80);',
            'assert.equal(ledger.scoreCheck.remainingDesignWeight, 25);':'assert.equal(ledger.scoreCheck.remainingDesignWeight, 20);',
            'assert.equal(ledger.scoreCheck.remainingDesignContribution, 2.5);':'assert.equal(ledger.scoreCheck.remainingDesignContribution, 2);',
            'assert.equal(ledger.scoreCheck.calculatedScore, 77.5);':'assert.equal(ledger.scoreCheck.calculatedScore, 82);',
            'const outOfOrder = clone(ledger); const journeyReconnect = outOfOrder.capabilities.find(capability => capability.id === "journey-reconnect"); journeyReconnect.stages["automated-test"] = "complete";':'const outOfOrder = clone(ledger); const journeyConflicts = outOfOrder.capabilities.find(capability => capability.id === "journey-conflicts"); journeyConflicts.stages["automated-test"] = "complete";',
            'const inventedPartial = clone(ledger); inventedPartial.capabilities.find(capability => capability.id === "journey-reconnect").lifecyclePercent = 25;':'const inventedPartial = clone(ledger); inventedPartial.capabilities.find(capability => capability.id === "journey-conflicts").lifecyclePercent = 25;',
            'current ${result.formattedScore} r13 integrated ledger':'current ${result.formattedScore} r14 integrated ledger'
          }
          for old,new in replacements.items():
              if text.count(old)!=1:
                  raise SystemExit(f'accounting contract expected one occurrence, found {text.count(old)}: {old[:80]}')
              text=text.replace(old,new,1)

          r13_anchor='''  assert.equal(ssjrReadiness.remainingCapabilityIds.includes("multi-season"), true, "Multi Season remains uncredited in SSJR until production-two-account evidence is accepted.");\n'''
          r14_block='''\n  const r14Candidate = ssjrReadiness.candidateEvidence.find(item => item.id === "ssjr1-journey-reconnect-r14-production");\n  assert.ok(r14Candidate, "SSJR readiness must preserve truthful zero-credit r14 production evidence.");\n  assert.equal(r14Candidate.credit, 0);\n  assert.deepEqual(r14Candidate.relatedCapabilityIds, ["journey-reconnect"]);\n  for (const layer of ["deterministic-behavior","provider-enforcement","isolated-browser-protocol","deployed-runtime"]) assert.ok(r14Candidate.layers.includes(layer), `r14 candidate evidence missing ${layer}`);\n  assert.ok(r14Candidate.missingLayers.includes("production-two-account"));\n  for (const expected of ["PR #242 exact candidate head 4ca8651","POS20 run #371 exact-head green","PR #242 merge 97c28b1","GitHub Pages run #117 success","POS20 run #372 main green","Release Integration Burn-In run #374 success"]) assert.ok(r14Candidate.references.some(ref => ref.includes(expected)), `r14 evidence missing ${expected}`);\n  assert.equal(ssjrReadiness.remainingCapabilityIds.includes("journey-reconnect"), true, "Journey Reconnect remains uncredited in SSJR until production-two-account evidence is accepted.");\n'''
          if text.count(r13_anchor)!=1:
              raise SystemExit('r13 candidate assertion anchor missing')
          text=text.replace(r13_anchor,r13_anchor+r14_block,1)

          ms_anchor='''  for (const expected of ["PR #240 exact candidate head 96dcf910","POS20 run #343 exact-head green","PR #240 merge cfe6f801","GitHub Pages run #115 success","POS20 run #350 main green","Release Integration Burn-In run #372 success"]) assert.ok(multiSeasonIntegrated.evidenceRefs.some(ref => ref.includes(expected)), `Multi Season integration evidence missing ${expected}`);\n'''
          jr_block='''\n  const journeyReconnectIntegrated = ledger.capabilities.find(capability => capability.id === "journey-reconnect");\n  assert.equal(journeyReconnectIntegrated.weightedContribution, 5);\n  for (const ref of ["js/sharedJourneyReconnect.js","js/productionSharedJourneyReconnect.js","service-worker.js","tests/contracts/shared-journey-reconnect-production-contracts.cjs","tests/browser/shared-journey-reconnect-audit.cjs"]) assert.ok(journeyReconnectIntegrated.evidenceRefs.includes(ref), `Journey Reconnect evidence missing ${ref}`);\n  for (const expected of ["PR #242 exact candidate head 4ca8651","POS20 run #371 exact-head green","PR #242 merge 97c28b1","GitHub Pages run #117 success","POS20 run #372 main green","Release Integration Burn-In run #374 success"]) assert.ok(journeyReconnectIntegrated.evidenceRefs.some(ref => ref.includes(expected)), `Journey Reconnect integration evidence missing ${expected}`);\n'''
          if text.count(ms_anchor)!=1:
              raise SystemExit('Multi Season evidence anchor missing')
          text=text.replace(ms_anchor,ms_anchor+jr_block,1)
          contract.write_text(text)
          PY
      - name: Validate accounting truth
        shell: bash
        run: |
          npm ci
          node tests/contracts/milestone-delivery-progress-contracts.cjs
          npm run test:ops
      - name: Commit accounting and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/mdp-r14-accounting-once.yml
          git add MILESTONE_DELIVERY_PROGRESS.json SHARED_SHOWDOWN_JOURNEY_READINESS.json NEXT_TASK.md tests/contracts/milestone-delivery-progress-contracts.cjs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: record r14 MDP integration at 82.00"
          git push origin HEAD:chore/mdp-r14-integration-82-00
