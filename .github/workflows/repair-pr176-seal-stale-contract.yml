name: Repair PR176 SLE stale starter contract

on:
  push:
    branches:
      - rjr/pr176-stage5d-provider-pending-sle-2026-09-01

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Repair only the stale current-starter assertion
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/contracts/sle-handoff-packaging-contracts.cjs';
          let text = fs.readFileSync(path, 'utf8');
          const before = 'assert.match(nextPrompt,/START_NEXT_SESSION_V1\\.4\\.34_PR175_STAGE5C_STANDARD_AUTH_CANDIDATE/i,"Fresh next-developer prompt must route to the current Stage 5C starter.");';
          const after = 'assert.match(nextPrompt,/START_NEXT_SESSION_V1\\.4\\.35_PR176_STAGE5D_PROVIDER_PENDING/i,"Fresh next-developer prompt must route to the current Stage 5D provider-pending starter.");';
          if (!text.includes(before)) throw new Error('Expected stale Stage 5C starter assertion not found');
          text = text.replace(before, after);
          fs.writeFileSync(path, text);
          fs.rmSync('.github/workflows/repair-pr176-seal-stale-contract.yml');
          NODE
      - name: Commit repair and self-remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: repair PR176 SLE current-starter contract'
          git push origin HEAD:rjr/pr176-stage5d-provider-pending-sle-2026-09-01
