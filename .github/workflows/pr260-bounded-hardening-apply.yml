name: PR260 bounded hardening apply

on:
  push:
    branches:
      - feat/persistent-nik-daniel-pair
    paths:
      - .github/workflows/pr260-bounded-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact bounded PR260 hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text=read(path)
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f"{path}: expected exactly one literal match, found {count}: {old[:100]!r}")
              write(path,text.replace(old,new,1))

          def sub_once(path, pattern, replacement):
              text=read(path)
              updated,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
              if count!=1:
                  raise SystemExit(f"{path}: expected exactly one regex match, found {count}: {pattern}")
              write(path,updated)

          # 1. Make one-use redemption and the durable account pair witness one atomic provider transaction.
          redeem_replacement=r'''  async function redeemPairing(options={}){
            try{
              validateFirestoreInputs(options);
              const accountId=normalizeAccountId(options.user);
              const identity=options.identity;
              if(!validDeviceIdentity(identity))throw errorWithCode("PRIVATE_DEVICE_IDENTITY_UNAVAILABLE","A stable registered device is required.");
              const binding=normalizeLocalBinding(options.binding);
              const capability=normalizeCapability(options.capability);
              const durableWitness=options.durableWitness;
              if(durableWitness!==undefined&&typeof durableWitness!=="function")throw errorWithCode("PAIRING_DURABLE_WITNESS_INVALID","The durable pairing witness is invalid.");
              const sdk=options.firebaseSdk;
              const nowEpochMs=options.nowEpochMs===undefined?Date.now():Number(options.nowEpochMs);
              const now=sdk.Timestamp.fromMillis(nowEpochMs);
              const deviceReference=sdk.doc(options.firestore,"accounts",accountId,"devices",identity.deviceId);
              const rivalryReference=sdk.doc(options.firestore,"rivalries",capability);
              const inviteReference=sdk.doc(options.firestore,"rivalries",capability,"invites",capability);
              const result=await sdk.runTransaction(options.firestore,async transaction=>{
                const deviceSnapshot=await transaction.get(deviceReference);
                assertActiveDeviceSnapshot(deviceSnapshot,identity.deviceId);
                const rivalrySnapshot=await transaction.get(rivalryReference);
                const inviteSnapshot=await transaction.get(inviteReference);
                const {rivalry,invite}=assertPairingDocuments(rivalrySnapshot,inviteSnapshot,capability,accountId,binding,nowEpochMs);
                let durableWitnessResult=null;
                if(durableWitness){
                  durableWitnessResult=await durableWitness({transaction,firestore:options.firestore,firebaseSdk:sdk,accountId,identity,binding,capability,now,nowEpochMs,rivalry,invite});
                  if(!durableWitnessResult||durableWitnessResult.ok!==true)throw errorWithCode("PAIRING_DURABLE_WITNESS_FAILED","The account pairing witness could not be committed with redemption.");
                }
                const nextSlots=rivalry.data.managerSlots.map(slot=>slot.slotId===invite.data.slotId?{slotId:slot.slotId,accountId,profileId:binding.profileId,saveId:binding.saveId,displayLabel:binding.displayLabel,entitlementState:"active",deletionConsent:false}:{...slot});
                const rivalryData={...rivalry.data,connectionState:"active",managerSlots:nextSlots,authorizedAccountIds:[invite.data.createdByAccountId,accountId]};
                const inviteData={...invite.data,state:"redeemed",redeemedByAccountId:accountId,redeemedAt:now,revokedAt:null};
                const rivalryEnvelope=await buildEnvelope({objectType:"rivalry",objectId:capability,revision:rivalry.revision+1,parentRevision:rivalry.revision,priorContentHash:rivalry.contentHash,updatedAt:now,updatedByAccountId:accountId,updatedByDeviceId:identity.deviceId,data:rivalryData,cryptoImpl:options.cryptoImpl||root.crypto});
                const inviteEnvelope=await buildEnvelope({objectType:"invite",objectId:capability,revision:invite.revision+1,parentRevision:invite.revision,priorContentHash:invite.contentHash,updatedAt:now,updatedByAccountId:accountId,updatedByDeviceId:identity.deviceId,data:inviteData,cryptoImpl:options.cryptoImpl||root.crypto});
                transaction.set(rivalryReference,rivalryEnvelope);
                transaction.set(inviteReference,inviteEnvelope);
                return {revision:rivalryEnvelope.revision,slotId:invite.data.slotId,durableWitness:durableWitnessResult};
              });
              return {ok:true,rivalryId:capability,capability,accountId,binding,...result};
            }catch(error){return asResultError(error,"PAIRING_REDEEM_FAILED");}
          }

          async function revokePairing'''
          sub_once('js/sparkPrivatePairing.js',r'  async function redeemPairing\(options=\{\}\)\{.*?\n  \}\n\n  async function revokePairing',redeem_replacement)

          persistent_helpers=r'''
          function pairTimestampMillis(value){if(value&&typeof value.toMillis==="function")return value.toMillis();if(value instanceof Date)return value.getTime();return Number.NaN;}
          function pairCreateDurableRedemptionWitness(context,role,manager,rivalryId){const sdk=context.services.firestoreSdk,normalizedRole=pairNormalizeManagerRole(role),normalizedRivalryId=pairNormalizeRivalryId(rivalryId);return async({transaction,binding,capability,now,nowEpochMs})=>{if(pairNormalizeRivalryId(capability)!==normalizedRivalryId)throw pairErrorWithCode("PERSISTENT_PAIR_RIVALRY_INVALID","The Showdown connection changed during redemption.");if(!binding||binding.managerRole!==normalizedRole||!pairValidSaveId(binding.saveId)||!pairValidProfileId(binding.profileId))throw pairErrorWithCode("PERSISTENT_PAIR_BINDING_INVALID","The local career identity is invalid.");const pairRef=pairLinkReference(context),pairSnapshot=await transaction.get(pairRef);let revision=0,parentRevision=null,priorContentHash=null,linkedAt=now;if(pairSnapshot.exists()){const existing=pairParsePairLink(pairSnapshot.data(),context.accountId);if(existing.managerRole!==normalizedRole||existing.managerId!==manager.id)throw pairErrorWithCode("PERSISTENT_PAIR_IDENTITY_MISMATCH","This account has invalid player data. Forget this device and start again.");if(existing.rivalryId!==normalizedRivalryId){const oldSnapshot=await transaction.get(pairRivalryReference(context,existing.rivalryId));if(!oldSnapshot.exists()||!pairIsEnvelopeValue(oldSnapshot.data(),"rivalry",existing.rivalryId))throw pairErrorWithCode("PERSISTENT_PAIR_ACTIVE_CONFLICT","The current Showdown authority cannot be replaced safely.");const oldState=oldSnapshot.data().data?.connectionState;if(oldState==="active")throw pairErrorWithCode("PERSISTENT_PAIR_ACTIVE_CONFLICT","This account already has an active Showdown.");if(oldState==="pending-pair"){const oldInviteRef=sdk.doc(context.services.firestore,"rivalries",existing.rivalryId,"invites",existing.rivalryId),oldInviteSnapshot=await transaction.get(oldInviteRef),oldInvite=oldInviteSnapshot.exists()?oldInviteSnapshot.data():null,expiresAt=pairTimestampMillis(oldInvite?.data?.expiresAt),stillOpen=pairIsEnvelopeValue(oldInvite,"invite",existing.rivalryId)&&oldInvite.data?.state==="open"&&Number.isFinite(expiresAt)&&expiresAt>nowEpochMs;if(stillOpen)throw pairErrorWithCode("PERSISTENT_PAIR_PENDING_CONFLICT","This account already has a connection code waiting for the other player.");}else if(oldState!=="closed")throw pairErrorWithCode("PERSISTENT_PAIR_ACTIVE_CONFLICT","The current Showdown authority cannot be replaced safely.");}revision=existing.revision+1;parentRevision=existing.revision;priorContentHash=existing.contentHash;linkedAt=existing.linkedAt||now;}const data={rivalryId:normalizedRivalryId,managerRole:normalizedRole,managerId:manager.id,linkedAt,lastConfirmedAt:now},envelope=await pairBuildEnvelope({revision,parentRevision,priorContentHash,updatedAt:now,updatedByAccountId:context.accountId,updatedByDeviceId:context.deviceId,data});transaction.set(pairRef,envelope);return{ok:true,rivalryId:normalizedRivalryId,managerRole:normalizedRole,managerId:manager.id,managerLabel:manager.label,connectionState:"active",providerSaveId:binding.saveId,providerProfileId:binding.profileId,revision:envelope.revision};};}
          '''
          replace_once('js/persistentNikDanielPair.js','\n  async function pairInitialize(options={}){',persistent_helpers+'\n  async function pairInitialize(options={}){')

          join_replacement=r'''  async function pairJoinPairing(capability,options={}){if(state.busy)return state;const active=pairAlreadyActiveState();if(active)return active;pairSetState({status:"joining",busy:true,message:"Joining the Showdown…"});try{const context=await pairResolveContext(),role=pairNormalizeManagerRole(options.managerRole||pairSelectedRole()),manager=pairRequireCurrentIdentity(role),binding=await pairEnsurePreparedBinding(context,role),rivalryId=pairNormalizeRivalryId(capability),durableWitness=pairCreateDurableRedemptionWitness(context,role,manager,rivalryId);const result=await context.pairing.redeemPairing({user:context.user,firestore:context.services.firestore,firebaseSdk:context.services.firestoreSdk,identity:await context.pairing.getOrCreateDeviceIdentity({indexedDBImpl:root.indexedDB,cryptoImpl:root.crypto}),binding,capability:rivalryId,cryptoImpl:root.crypto,durableWitness});if(!result?.ok)throw pairErrorWithCode(result?.code||"PERSISTENT_PAIR_JOIN_FAILED",result?.message||"The code could not be joined.");const link=result.durableWitness;if(!link?.ok||link.rivalryId!==result.rivalryId)throw pairErrorWithCode("PERSISTENT_PAIR_RECOVERY_FAILED","The players could not be connected with durable recovery authority.");try{await pairAttachRecoveryPointer(context,binding,link.rivalryId);}catch(_error){}return pairSetState({status:"paired",initialized:true,busy:false,accountId:context.accountId,deviceId:context.deviceId,managerRole:role,managerId:manager.id,rivalryId:link.rivalryId,connectionState:"active",providerSaveId:link.providerSaveId,providerProfileId:link.providerProfileId,capability:null,message:`${manager.label} is ready. Continue Career when both players are ready.`});}catch(error){return pairSetState({status:error?.code?.includes("SHARED_SHELL")?"save-required":"error",busy:false,message:pairContextualJoinMessage(error)});}}
          function pairContextualJoinMessage'''
          sub_once('js/persistentNikDanielPair.js',r'  async function pairJoinPairing\(capability,options=\{\}\)\{.*?\n  function pairContextualJoinMessage',join_replacement)

          recovery_helper=r'''
          async function pairOpenRecoverySurface(){try{if(typeof root.navigateTo==="function")await root.navigateTo("legacy",{addToHistory:true,allowCanonicalFallback:true});else if(typeof root.showScreen==="function")await root.showScreen("legacy",false);if(typeof root.initializeCareerModeRestoreUI==="function")root.initializeCareerModeRestoreUI();const panel=root.document?.getElementById("careerModeRestorePanel");if(!panel)throw pairErrorWithCode("PERSISTENT_PAIR_RECOVERY_UI_UNAVAILABLE","Verified recovery is unavailable on this screen.");panel.scrollIntoView?.({block:"start"});const picker=panel.querySelector('input[type="file"]');picker?.focus?.();return true;}catch(error){pairSetState({status:"recovery-required",busy:false,message:error?.message||"Verified recovery could not be opened."});return false;}}
          '''
          replace_once('js/persistentNikDanielPair.js','\n  function pairCreateElement(tag,className,text)',recovery_helper+'\n  function pairCreateElement(tag,className,text)')
          replace_once('js/persistentNikDanielPair.js','}else if(state.connectionState==="active"&&state.status==="recovery-required"){actions.append(pairCreateElement("span","","RESTORE THE VERIFIED CAREER COPY ON THIS BROWSER TO CONTINUE"));}', '}else if(state.connectionState==="active"&&state.status==="recovery-required"){const recover=pairCreateElement("button","menuButton","OPEN RECOVERY");recover.type="button";recover.disabled=state.busy;recover.addEventListener("click",()=>void pairOpenRecoverySurface());actions.append(recover,pairCreateElement("span","","RESTORE THE VERIFIED CAREER COPY ON THIS BROWSER TO CONTINUE"));}')
          replace_once('js/persistentNikDanielPair.js','retryPairLink:pairRetryPairLink,continuePair:pairContinueOnlineShowdown,render:pairRender', 'retryPairLink:pairRetryPairLink,continuePair:pairContinueOnlineShowdown,openRecovery:pairOpenRecoverySurface,render:pairRender')

          # 2. Rules must evaluate post-transaction rivalry membership for the atomic witness.
          replace_once('firestore.persistent-pair-production.fragment.rules',"    function cmsPersistentPairRivalryMembership(accountId, rivalryId, role) {\n      let rivalry = get(/databases/$(database)/documents/rivalries/$(rivalryId));","    function cmsPersistentPairRivalryMembership(accountId, rivalryId, role) {\n      let rivalry = getAfter(/databases/$(database)/documents/rivalries/$(rivalryId));")

          # 3. Preserve season count and route connection controls directly to the persistent pair surface.
          replace_once('js/productionSharedJourneyEntry.js','await ensureSaveAuthority();setPending(true);if(round)round.value="1";','await ensureSaveAuthority();setPending(true);')
          entry_route=r'''  async function openPersistentPairControls(){
            closePanel();
            try{
              const pair=await loadScript("persistent-pair","js/persistentNikDanielPair.js",()=>root.CareerModePersistentNikDanielPair);
              if(!pair||typeof pair.initialize!=="function"||typeof pair.render!=="function")throw new Error("Player connection controls are unavailable.");
              if(typeof root.navigateTo==="function")await root.navigateTo("mainMenu",{addToHistory:false,allowCanonicalFallback:true});else if(typeof root.showScreen==="function")await root.showScreen("mainMenu",false);
              await pair.initialize({force:true});pair.render();
              const panel=root.document.getElementById("persistentNikDanielPairPanel");if(!panel)throw new Error("Player connection controls could not be opened.");
              panel.scrollIntoView?.({block:"center"});panel.querySelector("button,input")?.focus?.();
            }catch(error){report("Unable to open player connection setup",error);}
          }
          async function remoteState'''
          sub_once('js/productionSharedJourneyEntry.js',r'  async function openSaveLibrary\(\)\{.*?\n  \}\n  async function remoteState',entry_route)
          replace_once('js/productionSharedJourneyEntry.js','save.addEventListener("click",()=>void openSaveLibrary());','save.addEventListener("click",()=>void openPersistentPairControls());')

          # 4. Old reversed role saves are not relabelled into corrupt canonical history.
          showdown_guard='function assertCanonicalShowdownManagerMapping(showdown){const managers=showdown&&typeof showdown.managers==="object"?showdown.managers:null;if(!managers)return true;const one=typeof managers.playerOne==="string"?managers.playerOne.trim().toLowerCase():"",two=typeof managers.playerTwo==="string"?managers.playerTwo.trim().toLowerCase():"";if(one==="nik"&&two==="daniel"){const error=new Error("This saved Showdown uses the retired Nik as Player One and Daniel as Player Two mapping and cannot be opened safely.");error.code="SHOWDOWN_REVERSED_MANAGER_ROLES_UNSUPPORTED";throw error;}return true;}\n'
          replace_once('js/showdown.js','function normalizeShowdown(showdown){if(!showdown)return null;showdown.schemaVersion=',showdown_guard+'function normalizeShowdown(showdown){if(!showdown)return null;assertCanonicalShowdownManagerMapping(showdown);showdown.schemaVersion=')

          # 5. Contract proof for atomic redemption, recovery route, season preservation and reversed-role fail-closed.
          replace_once('tests/contracts/persistent-nik-daniel-pair-contracts.cjs',"const {spawnSync}=require('node:child_process');","const {spawnSync}=require('node:child_process');\nconst vm=require('node:vm');")
          replace_once('tests/contracts/persistent-nik-daniel-pair-contracts.cjs',"const entrySource=read('js/productionSharedJourneyEntry.js');","const entrySource=read('js/productionSharedJourneyEntry.js');\nconst showdownSource=read('js/showdown.js');\nconst privatePairingSource=read('js/sparkPrivatePairing.js');")
          contract_insert=r'''
          assert.match(privatePairingSource,/durableWitness=options\.durableWitness/,'Private pairing redemption must accept a bounded durable witness inside the same provider transaction.');
          assert.match(privatePairingSource,/await durableWitness\(\{transaction/,'Durable pair authority must execute before the one-use redemption transaction writes commit.');
          assert.match(pairSource,/pairCreateDurableRedemptionWitness/,'Persistent pairing must create the account pair witness inside redemption authority.');
          const joinFunction=pairSource.slice(pairSource.indexOf('async function pairJoinPairing'),pairSource.indexOf('function pairContextualJoinMessage'));
          assert.match(joinFunction,/durableWitness/);
          assert.doesNotMatch(joinFunction,/pairPersistPairLinkWithRetry/,'Successful one-use redemption must not depend on a later pair-link write.');
          assert.match(pairSource,/"OPEN RECOVERY"/);
          assert.match(pairSource,/navigateTo\("legacy"/,'Recovery-required must route to the bounded Atomic Restore & Recovery surface.');
          assert.match(entrySource,/openPersistentPairControls/);
          assert.doesNotMatch(entrySource,/openSaveLibrary/,'Connect Players must not route through normal Settings or Save Library.');
          assert.doesNotMatch(entrySource,/if\(round\)round\.value="1"/,'Shared start must preserve the selected 1\/3\/5\/10 season count.');
          assert.match(rulesFragment,/cmsPersistentPairRivalryMembership[\s\S]*getAfter\(/,'Pair-link membership must observe the same transaction final rivalry state.');
          const showdownSandbox={window:{},document:undefined,console,setTimeout,clearTimeout};
          vm.createContext(showdownSandbox);vm.runInContext(showdownSource,showdownSandbox);
          assert.throws(()=>showdownSandbox.normalizeShowdown({managers:{playerOne:'Nik',playerTwo:'Daniel'}}),error=>error&&error.code==='SHOWDOWN_REVERSED_MANAGER_ROLES_UNSUPPORTED','Reversed historical manager roles must fail closed instead of being silently relabelled.');
          '''
          replace_once('tests/contracts/persistent-nik-daniel-pair-contracts.cjs',"assert.match(rulesFragment,/cmsPersistentPairRivalryMembership/);",contract_insert+"\nassert.match(rulesFragment,/cmsPersistentPairRivalryMembership/);")

          # 6. Provider emulator proof: atomic pair witness succeeds with redemption; stale active pair replacement rolls back all writes.
          replace_once('tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs',"const {Timestamp,collection,deleteDoc,doc,getDoc,getDocs,setDoc}=require('firebase/firestore');","const {Timestamp,collection,deleteDoc,doc,getDoc,getDocs,runTransaction,setDoc}=require('firebase/firestore');")
          atomic_helper=r'''
          async function atomicRedeemWithPairLink(db,{uid,device,target,managerId,char,nowMs}){
            const rivalryRef=doc(db,'rivalries',target),inviteRef=doc(db,'rivalries',target,'invites',target),pairRef=doc(db,'accounts',uid,'pairLinks','current');
            return runTransaction(db,async transaction=>{
              const rivalrySnapshot=await transaction.get(rivalryRef),inviteSnapshot=await transaction.get(inviteRef),pairSnapshot=await transaction.get(pairRef);
              const rivalry=rivalrySnapshot.data(),invite=inviteSnapshot.data(),at=Timestamp.fromMillis(nowMs+5000);
              const nextSlots=rivalry.data.managerSlots.map(slot=>slot.slotId===invite.data.slotId?managerSlot(slot.slotId,uid,char):{...slot});
              const rivalryData={...rivalry.data,connectionState:'active',managerSlots:nextSlots,authorizedAccountIds:[invite.data.createdByAccountId,uid]};
              const inviteData={...invite.data,state:'redeemed',redeemedByAccountId:uid,redeemedAt:at,revokedAt:null};
              const rivalryNext=envelope({objectType:'rivalry',objectId:target,revision:rivalry.revision+1,parentRevision:rivalry.revision,contentHash:hash(char),priorContentHash:rivalry.contentHash,updatedAt:at,accountId:uid,deviceId:device,data:rivalryData});
              const inviteNext=envelope({objectType:'invite',objectId:target,revision:invite.revision+1,parentRevision:invite.revision,contentHash:hash(char),priorContentHash:invite.contentHash,updatedAt:at,accountId:uid,deviceId:device,data:inviteData});
              let revision=0,parentRevision=null,priorContentHash=null,linkedAt=at,role='playerTwo';
              if(pairSnapshot.exists()){const prior=pairSnapshot.data();revision=prior.revision+1;parentRevision=prior.revision;priorContentHash=prior.contentHash;linkedAt=prior.data.linkedAt;role=prior.data.managerRole;}
              const pairNext=pairEnvelope(uid,target,role,managerId,device,linkedAt,at,{revision,parentRevision,contentHash:hash(char),priorContentHash});
              transaction.set(pairRef,pairNext);transaction.set(rivalryRef,rivalryNext);transaction.set(inviteRef,inviteNext);return target;
            });
          }
          '''
          replace_once('tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs','\n(async()=>{',atomic_helper+'\n(async()=>{')
          replace_once('tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs',"const ids={a:deviceId('a'),b:deviceId('b'),c:deviceId('c'),d:deviceId('d')};","const ids={a:deviceId('a'),b:deviceId('b'),c:deviceId('c'),d:deviceId('d'),e:deviceId('e')};")
          replace_once('tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs',"const rivalryOne=`pair_${'1'.repeat(64)}`,rivalryTwo=`pair_${'2'.repeat(64)}`,pendingOld=`pair_${'3'.repeat(64)}`,pendingNew=`pair_${'4'.repeat(64)}`;","const rivalryOne=`pair_${'1'.repeat(64)}`,rivalryTwo=`pair_${'2'.repeat(64)}`,pendingOld=`pair_${'3'.repeat(64)}`,pendingNew=`pair_${'4'.repeat(64)}`,atomicRecovery=`pair_${'5'.repeat(64)}`,staleRedeem=`pair_${'6'.repeat(64)}`;")
          replace_once('tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs',"for(const [uid,key] of [['acct_a','a'],['acct_b','b'],['acct_c','c'],['acct_d','d']]){","for(const [uid,key] of [['acct_a','a'],['acct_b','b'],['acct_c','c'],['acct_d','d'],['acct_e','e']]){")
          replace_once('tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs',"await setDoc(doc(db,'rivalries',pendingNew),rivalryEnvelope(pendingNew,now,managerSlot('playerOne','acct_d','6'),managerSlot('playerTwo','acct_c','7')));","await setDoc(doc(db,'rivalries',pendingNew),rivalryEnvelope(pendingNew,now,managerSlot('playerOne','acct_d','6'),managerSlot('playerTwo','acct_c','7')));\n      await setDoc(doc(db,'rivalries',atomicRecovery),rivalryEnvelope(atomicRecovery,now,managerSlot('playerOne','acct_d','8'),openSlot('playerTwo'),'pending-pair'));\n      await setDoc(doc(db,'rivalries',atomicRecovery,'invites',atomicRecovery),inviteEnvelope(atomicRecovery,now,Timestamp.fromMillis(nowMs+600000)));\n      await setDoc(doc(db,'rivalries',staleRedeem),rivalryEnvelope(staleRedeem,now,managerSlot('playerOne','acct_d','9'),openSlot('playerTwo'),'pending-pair'));\n      await setDoc(doc(db,'rivalries',staleRedeem,'invites',staleRedeem),inviteEnvelope(staleRedeem,now,Timestamp.fromMillis(nowMs+600000)));")
          replace_once('tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs',"const dbD=testEnv.authenticatedContext('acct_d').firestore();","const dbD=testEnv.authenticatedContext('acct_d').firestore();\n    const dbE=testEnv.authenticatedContext('acct_e').firestore();")
          emulator_insert=r'''
            await assertSucceeds(atomicRedeemWithPairLink(dbE,{uid:'acct_e',device:ids.e,target:atomicRecovery,managerId:'nik',char:'e',nowMs}));
            const durablePair=(await getDoc(doc(dbE,'accounts','acct_e','pairLinks','current'))).data();
            assert.equal(durablePair.data.rivalryId,atomicRecovery,'successful redemption must durably commit the account current-pair witness in the same transaction');
            assert.equal((await getDoc(doc(dbE,'rivalries',atomicRecovery))).data().data.connectionState,'active');
            assert.equal((await getDoc(doc(dbE,'rivalries',atomicRecovery,'invites',atomicRecovery))).data().data.state,'redeemed');

            await assertFails(atomicRedeemWithPairLink(dbC,{uid:'acct_c',device:ids.c,target:staleRedeem,managerId:'nik',char:'c',nowMs}));
            assert.equal((await getDoc(doc(dbC,'rivalries',staleRedeem))).data().data.connectionState,'pending-pair','stale-tab double-active rejection must roll back rivalry activation');
            assert.equal((await getDoc(doc(dbC,'rivalries',staleRedeem,'invites',staleRedeem))).data().data.state,'open','stale-tab double-active rejection must leave the one-use invite unconsumed');
          '''
          replace_once('tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs',"    process.stdout.write('PASS persistent pair Rules emulator:",emulator_insert+"\n    process.stdout.write('PASS persistent pair Rules emulator:")
          replace_once('tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs','expired-pending replacement safety are enforced.\\n', 'expired-pending replacement safety, atomic post-redeem recovery witness, and stale-tab double-active rollback are enforced.\\n')

          # 7. Browser regression: chosen season count survives shell preparation and Connect Players opens the real pair controls.
