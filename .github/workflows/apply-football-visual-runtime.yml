name: Apply Football Visual Runtime

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/apply-football-visual-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Patch loader and navigation through stable authorities
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          optional_path = Path('js/optionalModules.js')
          optional = optional_path.read_text()

          marker = '''function ensureMenuFeedbackModule(){
              return loadRuntimeScript(
                  "menu-feedback",
                  "js/menuFeedback.js",
                  () => typeof window.playMenuFeedbackCue === "function"
                      && typeof window.getMenuFeedbackDiagnostics === "function"
              );
          }

          async function ensureAnalyticsEngine(){'''
          replacement = '''function ensureMenuFeedbackModule(){
              return loadRuntimeScript(
                  "menu-feedback",
                  "js/menuFeedback.js",
                  () => typeof window.playMenuFeedbackCue === "function"
                      && typeof window.getMenuFeedbackDiagnostics === "function"
              );
          }

          async function ensureFootballVisualModule(){
              const stylePromise = loadRuntimeStyle("football-visual-ui", "css/footballVisuals.css");
              await loadRuntimeScript(
                  "football-visual-data",
                  "data/footballVisuals.js",
                  () => Boolean(window.FOOTBALL_VISUALS && window.FOOTBALL_VISUAL_SCREEN_PLAN)
              );
              await loadRuntimeScript(
                  "football-visual-ui",
                  "js/footballVisuals.js",
                  () => typeof window.initializeFootballVisuals === "function"
                      && typeof window.prepareFootballVisualScreen === "function"
              );
              await stylePromise;
              window.initializeFootballVisuals();
              return true;
          }

          async function ensureAnalyticsEngine(){'''
          if marker not in optional:
              raise SystemExit('Optional module insertion marker not found.')
          optional = optional.replace(marker, replacement, 1)

          marker = '''    await loadRuntimeScript(
                  "visual-identity",
                  "js/visualIdentity.js",
                  () => typeof window.applyClubIdentity === "function" && typeof window.refreshClubVisualIdentity === "function"
              );
              await loadRuntimeScript(
                  "showdown-ui",'''
          replacement = '''    await loadRuntimeScript(
                  "visual-identity",
                  "js/visualIdentity.js",
                  () => typeof window.applyClubIdentity === "function" && typeof window.refreshClubVisualIdentity === "function"
              );
              await ensureFootballVisualModule();
              await loadRuntimeScript(
                  "showdown-ui",'''
          if marker not in optional:
              raise SystemExit('Gameplay visual insertion marker not found.')
          optional = optional.replace(marker, replacement, 1)

          marker = '''async function ensureStatisticsModule(){
              const stylePromise = loadRuntimeStyle("analytics-ui", "css/analytics.css");
              await ensureStatisticsScript();
              await stylePromise;
          }

          async function ensureTrophyRoomModule(){
              const stylePromise = loadRuntimeStyle("analytics-ui", "css/analytics.css");
              await ensureStatisticsScript();'''
          replacement = '''async function ensureStatisticsModule(){
              const stylePromise = loadRuntimeStyle("analytics-ui", "css/analytics.css");
              const visualPromise = ensureFootballVisualModule();
              await ensureStatisticsScript();
              await Promise.all([stylePromise, visualPromise]);
          }

          async function ensureTrophyRoomModule(){
              const stylePromise = loadRuntimeStyle("analytics-ui", "css/analytics.css");
              const visualPromise = ensureFootballVisualModule();
              await ensureStatisticsScript();'''
          if marker not in optional:
              raise SystemExit('Statistics visual insertion marker not found.')
          optional = optional.replace(marker, replacement, 1)

          marker = '''    await loadRuntimeScript(
                  "trophy-room-ui",
                  "js/trophyRoom.js",
                  () => typeof window.openTrophyRoom === "function"
              );
              await stylePromise;
          }'''
          replacement = '''    await loadRuntimeScript(
                  "trophy-room-ui",
                  "js/trophyRoom.js",
                  () => typeof window.openTrophyRoom === "function"
              );
              await Promise.all([stylePromise, visualPromise]);
          }'''
          if marker not in optional:
              raise SystemExit('Trophy visual insertion marker not found.')
          optional = optional.replace(marker, replacement, 1)

          marker = '''window.ensureDiagnosticsModule = ensureDiagnosticsModule;
          window.ensureMenuFeedbackModule = ensureMenuFeedbackModule;
          window.ensureOptionalModule = ensureOptionalModule;'''
          replacement = '''window.ensureDiagnosticsModule = ensureDiagnosticsModule;
          window.ensureMenuFeedbackModule = ensureMenuFeedbackModule;
          window.ensureFootballVisualModule = ensureFootballVisualModule;
          window.ensureOptionalModule = ensureOptionalModule;'''
          if marker not in optional:
              raise SystemExit('Football visual export marker not found.')
          optional = optional.replace(marker, replacement, 1)
          optional_path.write_text(optional)

          screens_path = Path('js/screens.js')
          screens = screens_path.read_text()

          marker = '''    if(screenName === "legacy" && typeof window.renderLegacy === "function"){
                  window.renderLegacy();
              }

              if(
                  currentShowdown'''
          replacement = '''    if(screenName === "legacy" && typeof window.renderLegacy === "function"){
                  window.renderLegacy();
              }
              if(typeof window.prepareFootballVisualScreen === "function"){
                  window.prepareFootballVisualScreen(screenName);
              }

              if(
                  currentShowdown'''
          if marker not in screens:
              raise SystemExit('Screen prepare visual marker not found.')
          screens = screens.replace(marker, replacement, 1)

          marker = '''    try{
                  if(GAMEPLAY_SCREENS.has(target)){
                      await ensureGameplayRuntime();
                  }

                  if(!isRouteStateValid(target) && allowCanonicalFallback){'''
          replacement = '''    try{
                  if(target === "createShowdown" && typeof window.ensureFootballVisualModule === "function"){
                      await window.ensureFootballVisualModule();
                  }
                  if(GAMEPLAY_SCREENS.has(target)){
                      await ensureGameplayRuntime();
                  }

                  if(!isRouteStateValid(target) && allowCanonicalFallback){'''
          if marker not in screens:
              raise SystemExit('Create Showdown lazy visual marker not found.')
          screens = screens.replace(marker, replacement, 1)
          screens_path.write_text(screens)
          PY

      - name: Remove one-shot patcher and commit runtime integration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-football-visual-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/optionalModules.js js/screens.js .github/workflows/apply-football-visual-runtime.yml
          git commit -m 'Integrate licensed visuals with lazy screen runtime'
          git push origin HEAD:agent/licensed-football-visual-system-r1
