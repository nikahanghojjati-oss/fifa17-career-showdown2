name: Stage 5E PR181 Atomic Coherence Repair

on:
  push:
    branches:
      - rjr/stage5e-runtime-host-join-ux-2026-09-02
    paths:
      - .github/workflows/stage5e-pr-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rjr/stage5e-runtime-host-join-ux-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Repair exact Stage 5E coherence surfaces and gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected repair marker missing in {path}: {old}")
              p.write_text(text.replace(old,new,1))

          replace(
              'js/menuExperience.js',
              'thumbnail: "assets/marco-reus-2015-cc-by.webp?v=1.8.1-r5"',
              'thumbnail: "assets/marco-reus-2015-cc-by.webp?v=1.9.0-r1"'
          )
          replace(
              '.github/workflows/validate-v1-visual-immersion.yml',
              '              || html.includes(`v${appVersion} · Connected Rivalry`),',
              '              || html.includes(`v${appVersion} · Connected Rivalry`)\n              || html.includes(`v${appVersion} · Private Remote Joining`),'
          )
          replace(
              'tests/contracts/cloud-foundation-contracts.cjs',
              'assert.equal(productionEnvironment.activation?.productionSecurityRulesSourceBlobSha,"2b7c0b166ae0aae7ab7a3ce84725b21091262484","Production environment must retain the exact reviewed provider-published Rules blob.");',
              'assert.equal(productionEnvironment.activation?.productionSecurityRulesSourceBlobSha,"363af783d7e5436fdfaa3766d4aa413fc9952a08","Production environment must retain the exact independently provider-live Stage 5D Rules blob.");'
          )
          PY

          npm ci
          npm test

          rm .github/workflows/stage5e-pr-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reconcile Stage 5E release coherence"
          git push origin HEAD:rjr/stage5e-runtime-host-join-ux-2026-09-02
