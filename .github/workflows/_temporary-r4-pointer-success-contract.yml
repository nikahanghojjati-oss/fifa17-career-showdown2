name: TEMP r4 pointer success contract

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-pointer-success-contract.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
          fetch-depth: 0
      - name: Require verified success sequence in pointer contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/contracts/stage4-connected-rivalry-pointer-restore-contracts.cjs')
          text=p.read_text()
          old='  assert.match(source,/if\\(autoAttachResult&&autoAttachResult\\.ok===true\\)\\{\\s*pointer=autoAttachResult\\.pointer;\\s*autoAttached=true;/,"Only a successful verified attach may become a durable Connected Rivalry pointer.");'
          new='  assert.match(source,/if\\(autoAttachResult&&autoAttachResult\\.ok===true\\)\\{\\s*binding=pairingCandidate\\.binding;\\s*pointer=autoAttachResult\\.pointer;\\s*autoAttached=true;/,"Only a successful provider-verified attach may replace the durable binding and Connected Rivalry pointer.");'
          assert old in text, 'old success-only pointer assertion anchor missing'
          p.write_text(text.replace(old,new,1))
          PY
      - name: Commit verified success sequence contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contracts/stage4-connected-rivalry-pointer-restore-contracts.cjs
          git diff --cached --check
          git commit -m "Align pointer success contract with r4 verified sequence"
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
