name: v1.1.0 Final Runtime Fixes

on:
  push:
    branches: [agent/v1.1.0-candidate-a-maintenance]
    paths:
      - .github/workflows/v110-final-runtime-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.0-candidate-a-maintenance
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('css/app.css')
          css = app.read_text()
          old = '.backButton,.compactButton{min-height:42px;'
          new = '.backButton,.compactButton{min-height:44px;'
          if css.count(old) != 1:
              raise SystemExit(f'Expected exactly one global 42px compact/back contract, found {css.count(old)}')
          css = css.replace(old, new, 1)
          app.write_text(css)

          visuals = Path('js/footballVisuals.js')
          js = visuals.read_text()
          anchor = '''function applyFootballVisualFraming(panel, asset, plan){\n'''
          helper = '''function settleFootballVisualPaint(panel, image){\n    const commitLoadedState = () => {\n        if(!image.complete || image.naturalWidth <= 0){ return; }\n        const schedule = typeof window.requestAnimationFrame === "function"\n            ? window.requestAnimationFrame.bind(window)\n            : callback => window.setTimeout(callback, 0);\n        schedule(() => schedule(() => {\n            panel.classList.add("imageLoaded");\n            panel.classList.remove("imageFailed");\n        }));\n    };\n\n    if(typeof image.decode === "function"){\n        image.decode().then(commitLoadedState).catch(commitLoadedState);\n        return;\n    }\n    commitLoadedState();\n}\n\n'''
          if helper not in js:
              if js.count(anchor) != 1:
                  raise SystemExit('Could not locate football visual framing anchor')
              js = js.replace(anchor, helper + anchor, 1)

          old_load = '''    image.addEventListener("load", () => {\n        panel.classList.add("imageLoaded");\n        panel.classList.remove("imageFailed");\n    }, { once: true });'''
          new_load = '''    image.addEventListener("load", () => {\n        settleFootballVisualPaint(panel, image);\n    }, { once: true });'''
          if old_load in js:
              js = js.replace(old_load, new_load, 1)
          elif new_load not in js:
              raise SystemExit('Could not locate football visual load handler')

          old_complete = '''    if(image.complete && image.naturalWidth > 0){\n        panel.classList.add("imageLoaded");\n    }'''
          new_complete = '''    if(image.complete && image.naturalWidth > 0){\n        settleFootballVisualPaint(panel, image);\n    }'''
          if old_complete in js:
              js = js.replace(old_complete, new_complete, 1)
          elif new_complete not in js:
              raise SystemExit('Could not locate football visual complete fast path')
          visuals.write_text(js)

          audit = Path('tests/browser/football-visual-audit.cjs')
          test = audit.read_text()
          needle = '''    await page.waitForFunction(\n        ({ selector, expectedCount }) => {\n            const panels = [...document.querySelectorAll(selector)];\n            return panels.length === expectedCount && panels.every(panel => {\n                const image = panel.querySelector(".footballVisualMedia");\n                return image\n                    && image.complete\n                    && image.naturalWidth > 0\n                    && Number.parseFloat(getComputedStyle(image).opacity) >= .9999;\n            });\n        },\n        { selector, expectedCount },\n        { timeout: 12000 }\n    );\n'''
          replacement = needle + '''    await page.evaluate(() => new Promise(resolve => {\n        requestAnimationFrame(() => requestAnimationFrame(resolve));\n    }));\n'''
          if 'requestAnimationFrame(() => requestAnimationFrame(resolve))' not in test:
              if test.count(needle) != 1:
                  raise SystemExit('Could not locate football visual settlement wait')
              test = test.replace(needle, replacement, 1)
          audit.write_text(test)

          handoff = Path('CAREER_MODE_SHOWDOWN_MASTER_DEVELOPMENT_CONTINUATION_V1.1.0_CANDIDATE_A.md')
          marker = '## Final deployment hardening — 2026-08-11'
          if marker not in handoff.read_text():
              with handoff.open('a') as f:
                  f.write('''\n\n## Final deployment hardening — 2026-08-11\n\nOwner requested deployment plus at least two additional fixes and five independent final-gate comparisons. Before merge, two concrete defects were selected rather than changing scope:\n\n1. **Global touch-target defect:** the shared `.backButton,.compactButton` contract still allowed 42 px controls even though the release accessibility floor is 44 px. The global minimum is now 44 px so this protection applies consistently beyond Data Management.\n2. **Football-photo paint-settlement defect:** visual panels could mark `imageLoaded` from the `load` event before decoded pixels had settled across paint frames. This could produce a technically green but visually blank evidence frame on mobile. `js/footballVisuals.js` now waits for `HTMLImageElement.decode()` when available and commits the loaded state only after two paint frames, with a non-decode fallback. The browser audit also waits through two paint frames before screenshot capture.\n\nThe earlier Stability run on `5ea916f7f26418b9964396c030cfeca2d44f8cda` was **cancelled by concurrency** and is explicitly not counted as release proof. A new frozen final SHA will be validated from scratch.\n''')
          PY
          node --check js/footballVisuals.js
          node --check tests/browser/football-visual-audit.cjs
          grep -F '.backButton,.compactButton{min-height:44px;' css/app.css
          grep -F 'function settleFootballVisualPaint' js/footballVisuals.js
          npm ci
          npm run test:contracts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/app.css js/footballVisuals.js tests/browser/football-visual-audit.cjs CAREER_MODE_SHOWDOWN_MASTER_DEVELOPMENT_CONTINUATION_V1.1.0_CANDIDATE_A.md
          git commit -m 'Fix global touch targets and visual paint settlement'
          git push origin HEAD:agent/v1.1.0-candidate-a-maintenance
