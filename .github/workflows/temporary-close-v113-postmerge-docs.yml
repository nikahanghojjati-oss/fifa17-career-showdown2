          # Guard that runtime/source files remain untouched by the documentation closure.
          print('v1.1.3 post-merge authority docs patched and handoff created.')
          PY

      - name: Verify exact documentation-only change envelope
        run: |
          set -euo pipefail
          expected=$'00_DEVELOPER_START_HERE.md\nCAREER_MODE_SHOWDOWN_V1.1.3_POST_MERGE.md\nNEXT_TASK.md\nPROJECT_STATE.md\nREADME.md'
          actual="$(git diff --name-only -- . ':!.github/workflows/temporary-close-v113-postmerge-docs.yml' | sort)"
          test "$actual" = "$expected"
          grep -F 'Production runtime authority: `29760bbf33c974267bd1ad64d0839f73ad8051fa`' NEXT_TASK.md
          grep -F 'Candidate C — Atomic Restore + Recovery UX — is now the next substantive Data Safety and Recovery build.' 00_DEVELOPER_START_HERE.md
