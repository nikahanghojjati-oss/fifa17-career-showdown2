name: Temporary v1.1.3 Post-Merge Documentation Closure

on:
  push:
    branches:
      - v1.1.3-postmerge-docs
    paths:
      - .github/workflows/temporary-close-v113-postmerge-docs.yml

permissions:
  contents: write

jobs:
  close-v113-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Patch current authority docs exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          def exact_replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} match(es), got {count}: {old[:100]}')
              p.write_text(text.replace(old, new, expected))

          exact_replace('NEXT_TASK.md',
              'Production runtime authority until v1.1.3 merge: `6dfea100829016eee4820b342729b8c823426f95`',
              'Production runtime authority: `29760bbf33c974267bd1ad64d0839f73ad8051fa`')
          exact_replace('NEXT_TASK.md',
              '## Current baseline: v1.1.3 Owner-Priority Maintenance Candidate',
              '## Current baseline: v1.1.3 Owner-Priority Maintenance — COMPLETE / PROTECTED')
          exact_replace('NEXT_TASK.md',
              'The active v1.1.3 maintenance candidate fixes the owner-reported League Wheel post-selection visual reroll and replaces/expands licensed football photography with route-scoped loading. It changes no gameplay, scoring or persistence semantics. It must be merged/deployed/proven before Candidate C starts.',
              'v1.1.3 is merged, deployed, twice-proven in production and protected. It fixes the owner-reported League Wheel post-selection visual reroll and replaces/expands licensed football photography with route-scoped loading while changing no gameplay, scoring or persistence semantics. Candidate C may now start from the current `main` production baseline.')
          marker = 'See `CAREER_MODE_SHOWDOWN_V1.1.2_POST_MERGE.md` for complete evidence and failure history.\n\n## Golden handoff rule'
          proof = 'See `CAREER_MODE_SHOWDOWN_V1.1.2_POST_MERGE.md` for Candidate B evidence and failure history.\n\n### v1.1.3 production closure\n\nv1.1.3 release proof is complete:\n\n- frozen pre-merge candidate `49fa0496453b3235de0cd87350945fbaedc4291a` passed all 13 permanent gate families twice independently;\n- PR #19 merged with expected-head protection into runtime authority `29760bbf33c974267bd1ad64d0839f73ad8051fa`;\n- GitHub Pages initially hit an external Jekyll/GitHub-metadata SSL certificate failure, then the same-SHA retry built and deployed successfully without a repository correction;\n- the exact production runtime passed all 13 permanent gate families twice;\n- both production Stability executions passed exact deployed byte parity, runtime provenance, Home/Reus, licensed football visuals, Candidate A export, Candidate B analysis and the complete public journey;\n- both production Licensed Visual executions produced 44 responsive screenshots with byte-identical image evidence;\n- protected eager budgets remain 164,965 raw / 37,006 gzip under the unchanged 165,000 / 37,500 ceilings.\n\nSee `CAREER_MODE_SHOWDOWN_V1.1.3_POST_MERGE.md` for exact run IDs, diagnostic history, Pages retry evidence and visual-source closure.\n\n## Golden handoff rule'
          exact_replace('NEXT_TASK.md', marker, proof)
          exact_replace('NEXT_TASK.md',
              '4. `CAREER_MODE_SHOWDOWN_V1.1.2_POST_MERGE.md`;\n5. the Candidate B release/diagnostic handoffs when deeper history is needed;',
              '4. `CAREER_MODE_SHOWDOWN_V1.1.3_POST_MERGE.md`;\n5. `CAREER_MODE_SHOWDOWN_V1.1.2_POST_MERGE.md` and Candidate B release/diagnostic handoffs when deeper history is needed;')

          exact_replace('PROJECT_STATE.md',
              'This project is already designed and implemented through the v1.1.3 owner-priority maintenance candidate.',
              'This project is already designed and implemented through the deployed/proven v1.1.3 owner-priority maintenance release.')
          exact_replace('PROJECT_STATE.md',
              '**Current milestone:** v1.1.3 — League Wheel stability + licensed cinematic visual expansion in release validation; Candidate C next',
              '**Current milestone:** v1.1.3 — League Wheel stability + licensed cinematic visual expansion COMPLETE / PROTECTED; Candidate C next')
          exact_replace('PROJECT_STATE.md',
              '**Current activity:** owner-priority v1.1.3 maintenance is being validated for merge/deployment; Candidate C atomic restore begins only after this release is proven',
              '**Current activity:** v1.1.3 is merged, deployed and twice-proven in production; Candidate C Atomic Restore + Recovery UX is now the next legal implementation task')
          exact_replace('PROJECT_STATE.md',
              '**Current candidate identity:** v1.1.3 / `1.1.3-r1`; production runtime authority remains v1.1.2 merge `6dfea100829016eee4820b342729b8c823426f95` until v1.1.3 merges/deploys',
              '**Current production identity:** v1.1.3 / `1.1.3-r1`; immutable v1.1.3 runtime authority is `29760bbf33c974267bd1ad64d0839f73ad8051fa`')
          exact_replace('PROJECT_STATE.md',
              'The release is still in validation. Candidate C remains the next substantive Data Safety and Recovery task after v1.1.3 is merged, deployed and proven.',
              'The release is complete, merged, deployed, twice-proven in production and protected. Candidate C is now the next substantive Data Safety and Recovery task. See `CAREER_MODE_SHOWDOWN_V1.1.3_POST_MERGE.md` for the exact proof and failure history.')

          exact_replace('README.md',
              '**Current phase:** v1.1.3 owner-priority maintenance is in release validation; Candidate C — Atomic Restore + Recovery UX — remains next',
              '**Current phase:** v1.1.3 owner-priority maintenance is complete, deployed and protected; Candidate C — Atomic Restore + Recovery UX — is next')
          exact_replace('README.md',
              'The original release path **v0.95 → v1.0**, the finite v1.0.2 clean-anchor maintenance lane, v1.1.0 Candidate A and v1.1.2 Candidate B are complete and deployed. Candidate B passed the full permanent matrix twice before merge and twice again on the exact production runtime, including public Pages import analysis and the complete deployed journey. Candidate C atomic restore is now the next legal v1.1.x build. The owner-liked loading screen and clean player-anchor architecture remain protected.',
              'The original release path **v0.95 → v1.0**, the finite v1.0.2 clean-anchor maintenance lane, v1.1.0 Candidate A, v1.1.2 Candidate B and v1.1.3 owner-priority maintenance are complete and deployed. v1.1.3 passed all 13 permanent families twice before merge and twice again on the exact production runtime, including public Pages byte parity, Candidate A/B and the complete deployed journey. Candidate C atomic restore is now the next legal v1.1.x build. The owner-liked loading screen and accepted football-photo presentation remain protected.')
          exact_replace('README.md',
              'The licensed visual archive is route-scoped rather than startup-preloaded: Home startup requests zero football-photo assets. Permanent gates protect the 12-image provenance/byte set, no-upscaling/contain policy, responsive clean-anchor geometry, reduced motion, and the unchanged 165,000 raw / 37,500 gzip eager-code budgets. Candidate C remains next after this maintenance release is deployed/proven.',
              'The licensed visual archive is route-scoped rather than startup-preloaded: Home startup requests zero football-photo assets. Permanent gates protect the 12-image provenance/byte set, no-upscaling/contain policy, responsive clean-anchor geometry, reduced motion, and the unchanged 165,000 raw / 37,500 gzip eager-code budgets. The release is merged/deployed/twice-proven; Candidate C is now next. See `CAREER_MODE_SHOWDOWN_V1.1.3_POST_MERGE.md` for final proof.')

          exact_replace('00_DEVELOPER_START_HERE.md',
              'Candidate A backup/export and Candidate B — Import Analysis + Migration Preview — are complete, merged, deployed and protected. The owner-priority v1.1.3 League Wheel/football-visual maintenance candidate is in release validation. Candidate C — Atomic Restore + Recovery UX — remains the next substantive Data Safety and Recovery build after v1.1.3 is deployed/proven.',
              'Candidate A backup/export, Candidate B — Import Analysis + Migration Preview — and the owner-priority v1.1.3 League Wheel/football-visual maintenance release are complete, merged, deployed and protected. Candidate C — Atomic Restore + Recovery UX — is now the next substantive Data Safety and Recovery build.')
          exact_replace('00_DEVELOPER_START_HERE.md',
              'The current candidate identity is v1.1.3 / `1.1.3-r1`; production runtime authority remains v1.1.2 merge `6dfea100829016eee4820b342729b8c823426f95` until the v1.1.3 expected-head merge and Pages deployment complete. v1.2.0 remains reserved for Installable Offline App after Candidate C closes v1.1 Data Safety and Recovery.',
              'The current production identity is v1.1.3 / `1.1.3-r1`; immutable v1.1.3 runtime authority is `29760bbf33c974267bd1ad64d0839f73ad8051fa`. Candidate C is the next legal build. v1.2.0 remains reserved for Installable Offline App after Candidate C closes v1.1 Data Safety and Recovery.')

          if not Path('CAREER_MODE_SHOWDOWN_V1.1.3_POST_MERGE.md').is_file():
              raise SystemExit('post-merge handoff must exist before authority patch')
          print('v1.1.3 authority docs patched.')
          PY

      - name: Verify exact documentation-only change envelope
        run: |
          set -euo pipefail
          expected=$'00_DEVELOPER_START_HERE.md\nNEXT_TASK.md\nPROJECT_STATE.md\nREADME.md'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          grep -F 'Production runtime authority: `29760bbf33c974267bd1ad64d0839f73ad8051fa`' NEXT_TASK.md
          grep -F 'Candidate C — Atomic Restore + Recovery UX — is now the next substantive Data Safety and Recovery build.' 00_DEVELOPER_START_HERE.md
          grep -F 'immutable v1.1.3 runtime authority is `29760bbf33c974267bd1ad64d0839f73ad8051fa`' PROJECT_STATE.md
          grep -F 'CAREER_MODE_SHOWDOWN_V1.1.3_POST_MERGE.md' README.md
          grep -F '94003033921' CAREER_MODE_SHOWDOWN_V1.1.3_POST_MERGE.md
          if git diff --name-only | grep -Eq '^(index\.html|js/|css/|data/|assets/)'; then
            echo 'Runtime file entered documentation closure diff.' >&2
            exit 1
          fi

      - name: Publish authority documentation only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_DEVELOPER_START_HERE.md NEXT_TASK.md PROJECT_STATE.md README.md
          git commit -m "Advance v1.1.3 authority docs to production closure"
          git push
