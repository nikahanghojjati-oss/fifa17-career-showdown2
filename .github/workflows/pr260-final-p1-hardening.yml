name: PR260 final P1 hardening
on:
  push:
    branches:
      - feat/persistent-nik-daniel-pair
    paths:
      - .github/workflows/pr260-final-p1-hardening.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply guarded patch
        run: |
          python scripts/pr260-final-p1-hardening.py
          python scripts/pr260-emulator-observation-fix.py
          python scripts/pr260-creation-witness-complexity-fix.py
          python scripts/pr260-emulator-checkpoints.py
      - name: Run targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check js/sparkPrivatePairing.js
          node --check js/persistentNikDanielPair.js
          node --check service-worker.js
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          git checkout -- firestore.spark.generated.rules 2>/dev/null || true
          node tests/contracts/offline-hotfix-contracts.cjs
          node tests/contracts/v13-offline-lifecycle-contracts.cjs
          node tests/contracts/stability-contracts.cjs
          node tests/contracts/release-shell-coherence-contracts.cjs
          node tests/contracts/shared-showdown-production-runtime-contracts.cjs
          node tests/contracts/static-app-release-contracts.cjs
          node tests/contracts/final-polish-presentation.cjs
      - name: Run generated Rules emulator proof
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase@12.7.0 @firebase/rules-unit-testing@5.0.0 firebase-admin@13.4.0
          node scripts/build-production-firestore-rules-with-persistent-pair.mjs
          echo '--- GENERATED RULES 2288-2370 ---'
          nl -ba firestore.spark.generated.rules | sed -n '2288,2370p'
          npx --yes firebase-tools@14.16.0 emulators:exec --only firestore --project demo-career-mode-showdown-persistent-pair-final "node tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs"
      - name: Commit clean hardening result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr260-final-p1-hardening.yml scripts/pr260-final-p1-hardening.py scripts/pr260-emulator-observation-fix.py scripts/pr260-creation-witness-complexity-fix.py scripts/pr260-emulator-checkpoints.py
          git checkout -- package-lock.json firestore.spark.generated.rules 2>/dev/null || true
          git add service-worker.js js/sparkPrivatePairing.js js/persistentNikDanielPair.js firestore.persistent-pair-production.fragment.rules scripts/inject-persistent-pair-rules.mjs .github/workflows/deploy-firestore-rules-zero-billing.yml tests/contracts/persistent-nik-daniel-pair-contracts.cjs tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs
          git diff --cached --check
          git commit -m "fix(pr260): atomically bind creator pair authority"
          git push origin HEAD:feat/persistent-nik-daniel-pair
