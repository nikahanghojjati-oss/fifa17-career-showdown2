name: Apply Startup Headroom Cleanup

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Remove non-runtime startup banner bytes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          js_files = [
              'js/storage.js', 'js/showdown.js', 'js/scoring.js', 'js/screens.js',
              'js/menuExperience.js', 'js/optionalModules.js', 'js/app.js'
          ]
          for file_name in js_files:
              path = Path(file_name)
              text = path.read_text()
              text, count = re.subn(r'^/\* Career Mode Showdown v1\.0\.1 \*/\n\n', '', text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected startup banner not found in {file_name}')
              path.write_text(text)

          app = Path('js/app.js')
          text = app.read_text()
          historical = '// Historical sealed baseline: STARTUP_SPLASH_MINIMUM_MS = 1900. The owner-requested Reus presentation now deliberately holds for 2700 ms.\n'
          if historical not in text:
              raise SystemExit('Expected stale startup compatibility comment not found in js/app.js')
          app.write_text(text.replace(historical, '', 1))

          css = Path('css/app.css')
          text = css.read_text()
          text, count = re.subn(
              r'^/\* =+\n\s*Career Mode Showdown v1\.0\.1\n\s*Unified High-Performance Visual System\n\s*Original FIFA-17-era-inspired presentation\.\n=+ \*/\n\n',
              '',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit('Expected decorative css/app.css banner not found')
          css.write_text(text)
          PY

      - name: Commit startup byte cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/storage.js js/showdown.js js/scoring.js js/screens.js js/menuExperience.js js/optionalModules.js js/app.js css/app.css
          git commit -m 'Recover startup headroom from non-runtime source banners'
          git push origin HEAD:agent/licensed-football-visual-system-r1
