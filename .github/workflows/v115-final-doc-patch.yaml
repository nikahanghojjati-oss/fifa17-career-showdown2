name: Temporary v1.1.5 Final Doc Patch

on:
  push:
    branches:
      - agent/v1.1.5-maintenance

permissions:
  contents: write

jobs:
  patch-current-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.5-maintenance
          fetch-depth: 0

      - name: Patch bounded current-facing documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          old = "## v1.1.5 — Restore Transaction Safety Maintenance\n\n"
          new = "# v1.1.5 — Restore Transaction Safety Maintenance\n\nDate: **August 12, 2026**\n\nRuntime asset revision: **`1.1.5-r1`**\n\n"
          if text.count(old) != 1:
              raise SystemExit(f'CHANGELOG: expected exactly one v1.1.5 heading, found {text.count(old)}')
          text = text.replace(old, new, 1)
          changelog.write_text(text)

          roadmap = Path('POST_V1_ROADMAP_EXECUTION.md')
          text = roadmap.read_text()
          text = text.replace('Last updated: 2026-08-11', 'Last updated: 2026-08-12', 1)
          start = text.index('## 6. v1.0.x Stability Lane — current exit state')
          end = text.index('## 7. v1.1.0 — Data Safety and Recovery')
          replacement = '''## 6. Stability and v1.1 exit state\n\nThe original v1.0.x Stability Lane is closed. Its deterministic contracts, browser journeys, corrupt-storage/quota/reload/navigation coverage, exact deployed-byte checks and protected Home/Reus/football-visual gates are permanent regression infrastructure, not an open milestone.\n\nThe old r5 James/Rashford/Martial acceptance condition is historical and has been superseded by the accepted v1.1.3 route-scoped visual archive. Do not reopen that visual selection work without new owner evidence.\n\nv1.1 Data Safety and Recovery is also functionally complete through Candidate A export, Candidate B read-only analysis and Candidate C atomic restore/recovery. The only current v1.1 work is the finite v1.1.5 maintenance release closure described in `NEXT_TASK.md` and `RELEASE_V1.1.5.md`.\n\nAfter v1.1.5 is merged, Pages-deployed, twice-proven and documentation-sealed, v1.2.0 Installable Offline App becomes the next substantive roadmap milestone.\n\n'''
          text = text[:start] + replacement + text[end:]
          marker = '## 7. v1.1.0 — Data Safety and Recovery\n\n'
          historical = ('## 7. v1.1.0 — Data Safety and Recovery\n\n'
                        '> Historical execution contract: this section records how the v1.1 recovery milestone was designed and should be read as implementation history/architecture guidance. Candidate A/B/C are now complete; it is not the current task list.\n\n')
          if text.count(marker) != 1:
              raise SystemExit(f'ROADMAP: expected one section 7 marker, found {text.count(marker)}')
          text = text.replace(marker, historical, 1)
          roadmap.write_text(text)

          out = changelog.read_text()
          assert out.startswith('# v1.1.5 — Restore Transaction Safety Maintenance\n')
          assert 'Runtime asset revision: **`1.1.5-r1`**' in out
          out = roadmap.read_text()
          assert 'Last updated: 2026-08-12' in out
          assert 'old r5 James/Rashford/Martial acceptance condition is historical' in out
          assert 'Current remaining nontechnical exit condition:' not in out
          assert 'Candidate A/B/C are now complete; it is not the current task list.' in out
          PY

      - name: Commit bounded documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md POST_V1_ROADMAP_EXECUTION.md
          git diff --cached --check
          git commit -m "Remove stale current-facing roadmap and changelog state"
          git push origin HEAD:agent/v1.1.5-maintenance
