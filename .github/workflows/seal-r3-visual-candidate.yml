name: Seal R3 Visual Candidate

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/seal-r3-visual-candidate.yml

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Advance non-workflow runtime authority files to r3
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, count))

          for path in ['index.html', 'js/app.js', 'js/menuExperience.js', 'js/optionalModules.js']:
              p = Path(path)
              text = p.read_text()
              if '1.0.1-r2' not in text:
                  raise SystemExit(f'No current r2 runtime reference found in {path}')
              p.write_text(text.replace('1.0.1-r2', '1.0.1-r3'))

          replace('README.md', '**Runtime asset revision:** `1.0.1-r2`', '**Runtime asset revision:** `1.0.1-r3`', 1)

          project = Path('PROJECT_STATE.md')
          project_text = project.read_text()
          if project_text.count('1.0.1-r2') != 2:
              raise SystemExit(f'Unexpected PROJECT_STATE r2 count: {project_text.count("1.0.1-r2")}')
          project_text = project_text.replace('1.0.1-r2', '1.0.1-r3')
          project_text = project_text.replace(
              '**Current activity:** v1.0.1 stability hardening and finite soak exit',
              '**Current activity:** owner-directed finite visual immersion correction inside the v1.0.x Stability Lane'
          )
          project.write_text(project_text)

          next_task = Path('NEXT_TASK.md')
          next_text = next_task.read_text()
          if next_text.count('1.0.1-r2') != 2:
              raise SystemExit(f'Unexpected NEXT_TASK r2 count: {next_text.count("1.0.1-r2")}')
          next_task.write_text(next_text.replace('1.0.1-r2', '1.0.1-r3'))

          changelog = Path('CHANGELOG.md')
          change_text = changelog.read_text()
          marker = 'Runtime asset revision: **`1.0.1-r2`**'
          if marker not in change_text:
              raise SystemExit('CHANGELOG runtime marker missing.')
          change_text = change_text.replace(marker, 'Runtime asset revision: **`1.0.1-r3`**', 1)
          insertion = '''\n## Owner-directed visual immersion correction — r3\n\n- Preserves the deployed r2 Reus desktop/windowed correction and the owner-accepted mobile Reus treatment.\n- Adds five local, explicitly licensed FIFA-era football photographs through a lazy screen-level visual system; no football photograph is added to the eager HTML shell.\n- Adds a 940 × 700 DPR1 near-breakpoint Reus regression case plus 1366 × 768 DPR1 and 390 × 844 DPR2 licensed-photo browser coverage.\n- Keeps the compressed startup ceiling at 37,500 bytes and combined first-party startup ceiling at 260,000 bytes.\n- Applies a measured raw-code ceiling amendment from 165,000 to 166,000 bytes: accepted r2 measured 164,700 raw bytes; the pre-seal visual candidate measured 165,918 raw bytes, a 1,218-byte integration increase while all five photographs remain lazy.\n- Exact historical Work-selected photo filenames remain pending the owner's ChatGPT export; current Commons derivatives are documented, reversible candidates and do not change gameplay/storage/navigation architecture.\n'''
          anchor = 'Runtime asset revision: **`1.0.1-r3`**\n'
          if insertion.strip() not in change_text:
              change_text = change_text.replace(anchor, anchor + insertion, 1)
          changelog.write_text(change_text)

          stability = Path('tests/contracts/stability-contracts.cjs')
          stability_text = stability.read_text()
          if '`${appVersion}-r2`' not in stability_text:
              raise SystemExit('Parameterized r2 stability revision marker missing.')
          stability_text = stability_text.replace('`${appVersion}-r2`', '`${appVersion}-r3`', 1)
          stability_text = stability_text.replace('r2 cache identity', 'r3 cache identity')
          stability_text = stability_text.replace('r2 runtime identity', 'r3 runtime identity')
          stability.write_text(stability_text)

          release_record = Path('RELEASE_V1.0.1.md').read_text()
          if '1.0.1-r1' not in release_record:
              raise SystemExit('Immutable v1.0.1 r1 release evidence was lost.')
          PY

      - name: Remove one-shot sealer and commit non-workflow r3 identity
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/seal-r3-visual-candidate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/menuExperience.js js/optionalModules.js README.md PROJECT_STATE.md NEXT_TASK.md CHANGELOG.md tests/contracts/stability-contracts.cjs .github/workflows/seal-r3-visual-candidate.yml
          git commit -m 'Seal non-workflow runtime identity as v1.0.1-r3'
          git push origin HEAD:agent/licensed-football-visual-system-r1
