name: Import Licensed Football Visuals

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/import-licensed-football-visuals.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download, normalize, optimize and fingerprint licensed sources
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import hashlib
          import io
          import json

          OUTPUT = Path('assets/football')
          OUTPUT.mkdir(parents=True, exist_ok=True)

          assets = [
              {
                  'id': 'james-rodriguez-real-madrid-2016',
                  'source_file': 'James Rodríguez in September 2016 - 02.jpg',
                  'output': 'james-rodriguez-real-madrid-2016.webp',
                  'max_size': (863, 1080),
                  'quality': 91,
                  'author': 'Real Madrid',
                  'license': 'CC BY 3.0',
                  'license_url': 'https://creativecommons.org/licenses/by/3.0/',
                  'source_page': 'https://commons.wikimedia.org/wiki/File:James_Rodr%C3%ADguez_in_September_2016_-_02.jpg',
                  'context': 'James Rodríguez after Borussia Dortmund vs Real Madrid, 28 September 2016.'
              },
              {
                  'id': 'marcus-rashford-man-utd-2016',
                  'source_file': 'Marcus Rashford.jpg',
                  'output': 'marcus-rashford-man-utd-2016.webp',
                  'max_size': (742, 888),
                  'quality': 92,
                  'author': 'Egghead06',
                  'license': 'CC BY-SA 4.0',
                  'license_url': 'https://creativecommons.org/licenses/by-sa/4.0/',
                  'source_page': 'https://commons.wikimedia.org/wiki/File:Marcus_Rashford.jpg',
                  'context': 'Marcus Rashford warming up for Manchester United vs West Ham United, 10 May 2016.'
              },
              {
                  'id': 'anthony-martial-man-utd-2015',
                  'source_file': 'Anthony Martial 2015.jpg',
                  'output': 'anthony-martial-man-utd-2015.webp',
                  'max_size': (688, 560),
                  'quality': 93,
                  'author': 'Dmitry Golubovich',
                  'license': 'CC BY-SA 2.5',
                  'license_url': 'https://creativecommons.org/licenses/by-sa/2.5/',
                  'source_page': 'https://commons.wikimedia.org/wiki/File:Anthony_Martial_2015.jpg',
                  'context': 'Anthony Martial of Manchester United vs CSKA Moscow, 21 October 2015.'
              },
              {
                  'id': 'lionel-messi-barcelona-2016',
                  'source_file': 'Messi & Suarez.jpg',
                  'output': 'lionel-messi-barcelona-2016.webp',
                  'max_size': (900, 1350),
                  'quality': 84,
                  'author': 'cchana',
                  'license': 'CC BY-SA 2.0',
                  'license_url': 'https://creativecommons.org/licenses/by-sa/2.0/',
                  'source_page': 'https://commons.wikimedia.org/wiki/File:Messi_%26_Suarez.jpg',
                  'context': 'Lionel Messi and Luis Suárez for FC Barcelona, 6 August 2016.'
              },
              {
                  'id': 'philipp-lahm-world-cup-2014',
                  'source_file': 'Philipp Lahm lifts the 2014 FIFA World Cup.jpg',
                  'output': 'philipp-lahm-world-cup-2014.webp',
                  'max_size': (1600, 829),
                  'quality': 88,
                  'author': 'Agência Brasil',
                  'license': 'CC BY 3.0 BR',
                  'license_url': 'https://creativecommons.org/licenses/by/3.0/br/deed.en',
                  'source_page': 'https://commons.wikimedia.org/wiki/File:Philipp_Lahm_lifts_the_2014_FIFA_World_Cup.jpg',
                  'context': 'Germany captain Philipp Lahm lifts the 2014 FIFA World Cup, 13 July 2014.'
              }
          ]

          manifest = {
              'generated_by': 'import-licensed-football-visuals.yml',
              'transformation': 'EXIF orientation normalized, resized down only with Lanczos, converted to WebP; no generative alteration.',
              'assets': []
          }

          for item in assets:
              encoded = quote(item['source_file'], safe='')
              url = f'https://commons.wikimedia.org/wiki/Special:Redirect/file/{encoded}'
              request = Request(url, headers={
                  'User-Agent': 'CareerModeShowdownAssetBuilder/1.0 (+https://github.com/nikahanghojjati-oss/fifa17-career-showdown2)'
              })
              with urlopen(request, timeout=60) as response:
                  raw = response.read()

              source_sha = hashlib.sha256(raw).hexdigest()
              with Image.open(io.BytesIO(raw)) as opened:
                  image = ImageOps.exif_transpose(opened).convert('RGB')
                  source_dimensions = image.size
                  image.thumbnail(item['max_size'], Image.Resampling.LANCZOS)
                  output_path = OUTPUT / item['output']
                  image.save(output_path, 'WEBP', quality=item['quality'], method=6)
                  output_dimensions = image.size

              output_bytes = output_path.read_bytes()
              if len(output_bytes) > 360_000:
                  raise SystemExit(f"{output_path} exceeds 360 KB visual asset ceiling: {len(output_bytes)}")
              if output_dimensions[0] > source_dimensions[0] or output_dimensions[1] > source_dimensions[1]:
                  raise SystemExit(f"{output_path} was unexpectedly upscaled")

              manifest['assets'].append({
                  **item,
                  'special_redirect_url': url,
                  'source_dimensions': list(source_dimensions),
                  'source_sha256': source_sha,
                  'output_dimensions': list(output_dimensions),
                  'output_bytes': len(output_bytes),
                  'output_sha256': hashlib.sha256(output_bytes).hexdigest()
              })
              print(f"{item['id']}: {source_dimensions} -> {output_dimensions}, {len(output_bytes)} bytes")

          manifest_path = OUTPUT / 'asset-manifest.json'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Verify decoded outputs and byte budget
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          manifest = json.loads(Path('assets/football/asset-manifest.json').read_text())
          total = 0
          for item in manifest['assets']:
              path = Path('assets/football') / item['output']
              with Image.open(path) as image:
                  image.verify()
              total += path.stat().st_size
          if total > 1_100_000:
              raise SystemExit(f'Football visual payload exceeds 1.1 MB lazy budget: {total}')
          print(f'Licensed football visual payload: {total} bytes across {len(manifest["assets"])} lazy images')
          PY

      - name: Remove one-shot importer and commit binary derivatives
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-licensed-football-visuals.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/football .github/workflows/import-licensed-football-visuals.yml
          git commit -m 'Import optimized licensed football photography'
          git push origin HEAD:agent/licensed-football-visual-system-r1
