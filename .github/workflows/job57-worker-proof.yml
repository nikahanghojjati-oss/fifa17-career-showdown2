name: Job 57 Trophy Room QA
on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - '.github/workflows/job57-worker-proof.yml'

permissions:
  contents: write

concurrency:
  group: job57-trophy-room-qa
  cancel-in-progress: false

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --disable-pip-version-check pillow numpy scikit-image

      - name: Start static server
        run: |
          python3 -m http.server 8765 >/tmp/job57-http.log 2>&1 &
          sleep 2

      - name: Run factory QA and require every desktop gate
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          FACTORY_QA_OUT: visual-assets/v10_1/trophy-room/evidence/factory-qa
        run: |
          set +e
          node visual-assets/v10_1/shared/tools/factory-qa.cjs \
            http://127.0.0.1:8765/visual-assets/v10_1/trophy-room/ \
            visual-assets/v10_1/trophy-room \
            TR1,TR2,TR3,TR4,TR5,TR6,TR7
          qa_rc=$?
          set -e
          echo "factory-qa full-matrix exit=$qa_rc (desktop subset is authoritative for JOB-057)"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('visual-assets/v10_1/trophy-room/evidence/factory-qa/qa_report.json')
          r=json.loads(p.read_text())
          desktop=[x for x in r['results'] if x['viewport']['w'] >= 1024]
          required=['H1','H5','H6','H7','CONTROL_BOUNDS','CONSOLE','REQUESTS','FIXTURE_STRINGS']
          bad=[]
          for row in desktop:
              for key in required:
                  if key in row['gates'] and not row['gates'][key]['pass']:
                      bad.append((row['frame'],row['viewport']['label'],key,row['gates'][key].get('details')))
          if len(desktop) != 28:
              raise SystemExit(f'expected 28 desktop runs, got {len(desktop)}')
          if bad:
              raise SystemExit('desktop factory QA failed: '+repr(bad[:8]))
          print('PASS: 28/28 desktop frame×viewport runs pass required factory gates')
          PY

      - name: Desktop contract, keyboard, rights and first-paint audit
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const FRAMES=['TR1','TR2','TR3','TR4','TR5','TR6','TR7'];
          const VIEWS=[[1366,768],[1440,900],[1920,1080],[1366,640]];
          const base='http://127.0.0.1:8765/visual-assets/v10_1/trophy-room/index.html';
          const out='visual-assets/v10_1/trophy-room/evidence';
          fs.mkdirSync(out+'/screens',{recursive:true});
          const fail=(m)=>{throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report={views:[],keyboard:[],firstPaint:null,rights:null,stateContracts:[]};
            try {
              for (const frame of FRAMES) {
                for (const [w,h] of VIEWS) {
                  const context=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1});
                  const page=await context.newPage();
                  const errors=[], failed=[], responses=new Map();
                  page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
                  page.on('pageerror',e=>errors.push(String(e)));
                  page.on('requestfailed',r=>failed.push(r.url()+' '+(r.failure()?.errorText||'')));
                  page.on('response',async r=>{
                    if(frame==='TR1'&&w===1920&&h===1080){
                      const len=Number((await r.allHeaders()).['content-length']||0);
                      if(len>0) responses.set(r.url(),len);
                    }
                  });
                  await page.goto(base+'?frame='+frame,{waitUntil:'networkidle'});
                  await page.waitForFunction(()=>window.__trophyRoomReady===true);
                  const m=await page.evaluate(()=>{
                    const box=e=>{const r=e.getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
                    const html=document.documentElement,body=document.body,stage=document.getElementById('stage-root');
                    const d=document.querySelector('[data-manager="daniel"]'), n=document.querySelector('[data-manager="nik"]');
                    const controls=[...document.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')].map(e=>({id:e.id,label:(e.textContent||'').trim(),box:box(e)}));
                    const imgs=[...document.images].map(i=>i.currentSrc||i.src);
                    return {
                      d:box(d),n:box(n),
                      scroll:{html:[html.scrollWidth,html.clientWidth,html.scrollHeight,html.clientHeight],body:[body.scrollWidth,body.clientWidth,body.scrollHeight,body.clientHeight],stage:[stage.scrollWidth,stage.clientWidth,stage.scrollHeight,stage.clientHeight]},
                      controls,imgs,
                      category:document.getElementById('trophyRoomContent').dataset.category,
                      state:document.getElementById('trophyRoomContent').dataset.state,
                      cards:document.querySelectorAll('.trophyCard').length,
                      unwon:document.querySelectorAll('.trophyCard.is-unwon').length,
                      notice:[...document.querySelectorAll('.statePanel,.stateNotice,.notWonYet')].map(x=>x.textContent.replace(/\s+/g,' ').trim()),
                      ranks:[...document.querySelectorAll('.careerRank')].map(x=>x.textContent.replace(/\s+/g,' ').trim()),
                      protectedUI:[...document.querySelectorAll('.careerRank,.trophyTitleBlock,.heroCeremony,.trophyShelf,.trophyBack')].map(e=>({c:e.className,b:box(e)}))
                    };
                  });
                  const cx=r=>(r.left+r.right)/2;
                  if(!(cx(m.d)<cx(m.n))) fail(frame+' '+w+'x'+h+' manager order');
                  for(const [sw,cw,sh,ch] of Object.values(m.scroll)) if(sw>cw+1||sh>ch+1) fail(frame+' '+w+'x'+h+' scroll');
                  for(const c of m.controls) if(c.box.left<-.5||c.box.top<-.5||c.box.right>w+.5||c.box.bottom>h+.5) fail(frame+' '+w+'x'+h+' control out of bounds '+c.label);
                  if(errors.length||failed.length) fail(frame+' '+w+'x'+h+' browser errors '+JSON.stringify({errors,failed}));
                  if(m.imgs.some(u=>/\.(png|jpe?g)(?:$|\?)/i.test(u))) fail('runtime raster master leaked: '+m.imgs.join(','));
                  if(frame==='TR2' && (m.cards!==4 || m.unwon!==4 || !m.notice.some(x=>x.includes('Not won yet')))) fail('TR2 empty contract');
                  if(frame==='TR3' && (!m.notice.some(x=>x.includes('Some Showdowns could not be read')) || !m.notice.some(x=>x.includes('2 of 3 Showdowns readable')))) fail('TR3 partial contract');
                  if(frame==='TR4' && m.category!=='LEAGUE TITLES') fail('TR4 category');
                  if((frame==='TR5'||frame==='TR6') && m.cards!==0) fail(frame+' must not invent trophy values');
                  if(frame==='TR7' && !(m.ranks[0]?.includes('#2') && m.ranks[1]?.includes('#1'))) fail('TR7 rank contract');
                  report.views.push({frame,viewport:[w,h],...m});
                  if(frame==='TR1'&&w===1920&&h===1080){
                    await page.screenshot({path:out+'/screens/TR1_1920x1080.png'});
                    const total=[...responses.values()].reduce((a,b)=>a+b,0);
                    report.firstPaint={bytes:total,kib:Math.round(total/1024*10)/10,resources:[...responses.entries()]};
                    if(total>900*1024) fail('first paint '+total+' bytes exceeds 900 KiB');
                    report.rights={images:m.imgs};
                    if(m.imgs.some(u=>!/(ENV_TR_PLATE|TITLE_TR_V1|TRO_SHOWDOWN_CHAMPION_V1|TRO_LEAGUE_TITLE_V1|TRO_DOMESTIC_CUP_V1|TRO_CONTINENTAL_V1)/.test(u))) fail('unexpected image asset '+m.imgs.join(','));
                  }
                  if(w===1366&&h===768){
                    const tabbable=m.controls.length;
                    const seen=[];
                    await page.locator('body').click({position:{x:1,y:1}});
                    for(let i=0;i<tabbable+3;i++){
                      await page.keyboard.press('Tab');
                      const x=await page.evaluate(()=>{
                        const e=document.activeElement;if(!e||e===document.body)return null;
                        const s=getComputedStyle(e),r=e.getBoundingClientRect();
                        return {id:e.id||null,label:(e.textContent||'').trim(),outlineStyle:s.outlineStyle,outlineWidth:parseFloat(s.outlineWidth)||0,rect:[r.left,r.top,r.right,r.bottom]};
                      });
                      if(x&&!seen.some(y=>y.label===x.label&&y.id===x.id)) seen.push(x);
                    }
                    const expected=[...m.controls].map(x=>x.label);
                    for(const label of expected){
                      const hit=seen.find(x=>x.label===label);
                      if(!hit) fail(frame+' keyboard cannot reach '+label);
                      if(hit.outlineStyle==='none'||hit.outlineWidth<2) fail(frame+' no visible focus ring '+label);
                    }
                    report.keyboard.push({frame,expected,seen});
                  }
                  await context.close();
                }
              }
              fs.writeFileSync(out+'/desktop-audit.json',JSON.stringify(report,null,2)+'\n');
              console.log('PASS desktop audit; first paint',report.firstPaint.kib,'KiB');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Mockup fidelity gate
        run: |
          python3 visual-assets/v10_1/shared/tools/mockup_diff.py \
            --mockup project-documents/factory/mockups/MOCKUP_TROPHY_ROOM.png \
            --build visual-assets/v10_1/trophy-room/evidence/screens/TR1_1920x1080.png \
            --plate visual-assets/v10_1/trophy-room/assets/ENV_TR_PLATE_V1_1X.webp \
            --platemap visual-assets/v10_1/trophy-room/assets/platemap.json \
            --out visual-assets/v10_1/trophy-room/evidence/diff
          python3 - <<'PY'
          import json
          p='visual-assets/v10_1/trophy-room/evidence/diff/scores.json'
          r=json.load(open(p))
          print(json.dumps(r,indent=2))
          if not r['gate']['PASS']:
              raise SystemExit('mockup-diff gate failed')
          PY

      - name: Keep compact QA evidence
        run: |
          find visual-assets/v10_1/trophy-room/evidence/factory-qa -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -delete || true
          cat visual-assets/v10_1/trophy-room/evidence/factory-qa/summary.md
          cat visual-assets/v10_1/trophy-room/evidence/diff/scores.json

      - name: Commit QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-assets/v10_1/trophy-room/evidence
          git diff --cached --quiet && exit 0
          git commit -m "Job 57 step 8/9: desktop QA evidence"
          for i in 1 2 3 4; do
            git pull --rebase origin factory/v1-wtt5ye &&
            git push origin HEAD:factory/v1-wtt5ye && exit 0
            sleep $((i*4))
          done
          exit 1
