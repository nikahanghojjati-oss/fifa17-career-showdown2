name: One-time Pairing R3 Core Seal

on:
  push:
    branches:
      - fix/pairing-copy-four-code-contract-2026-09-02

permissions:
  contents: write

jobs:
  core-seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/pairing-copy-four-code-contract-2026-09-02
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply exact r3 payload and close registration race
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/automation-pairing-r3-hardening-v2.yml').read_text()
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY\n",start)
          payload=textwrap.dedent(workflow[start:end])
          exec(compile(payload,'pairing-r3-hardening-payload','exec'),{})

          p=Path('js/sparkPrivatePairing.js')
          source=p.read_text()
          old='''  async function registerCurrentDevice(){\n    setState({status:"registering",busy:true,message:"Registering this browser privately…"});\n    try{\n'''
          new='''  async function registerCurrentDevice(){\n    const preservePairingStateAtStart=["creating-pair","joining-pair","pair-open","paired"].includes(pairingState.status);\n    if(!preservePairingStateAtStart)setState({status:"registering",busy:true,message:"Registering this browser privately…"});\n    try{\n'''
          assert old in source, 'registerCurrentDevice start marker missing'
          source=source.replace(old,new,1)
          old='''      const preservePairingState=["creating-pair","joining-pair","pair-open","paired"].includes(pairingState.status);\n      if(preservePairingState)return setState({initialized:true,connected:true,registered:true,accountId:context.accountState.accountId,deviceId:context.identity.deviceId});\n'''
          new='''      const preservePairingState=preservePairingStateAtStart||["creating-pair","joining-pair","pair-open","paired"].includes(pairingState.status);\n      if(preservePairingState)return setState({initialized:true,connected:true,registered:true,accountId:context.accountState.accountId,deviceId:context.identity.deviceId});\n'''
          assert old in source, 'preservePairingState marker missing'
          p.write_text(source.replace(old,new,1))

          test=Path('tests/browser/pairing-four-code-automation-audit.cjs')
          audit=test.read_text()
          old='''  await page.setContent('<div id="settingsOverlay"><div id="settingsContent"></div></div>');\n'''
          new='''  await page.setContent('<div id="settingsOverlay" class="settingsOverlay"><div class="settingsDialog"><header class="settingsHeader"><div class="settingsHeading"><span class="settingsEyebrow">SAVE LIBRARY</span><h2>SETTINGS</h2></div></header><div id="settingsContent" class="settingsContent"></div><footer class="settingsFooter"></footer></div></div>');\n  await page.addStyleTag({url:new URL("css/app.css",baseUrl).href});\n  await page.addStyleTag({url:new URL("css/settings.css",baseUrl).href});\n'''
          assert old in audit, 'settings harness marker missing'
          audit=audit.replace(old,new,1)
          old='''    await copyButton.click();\n    const copied=await page.evaluate(()=>navigator.clipboard.readText());\n'''
          new='''    await copyButton.scrollIntoViewIfNeeded();\n    await copyButton.click({timeout:5000});\n    const copied=await page.evaluate(()=>navigator.clipboard.readText());\n'''
          assert old in audit, 'copy click marker missing'
          audit=audit.replace(old,new,1)
          old='''(async()=>{\n  const runtime=await resolveChromiumRuntime();\n  const browser=await chromium.launch({executablePath:runtime.executablePath,headless:true,args:runtime.args});\n  try{\n    const iterations=3;\n    for(let iteration=0;iteration<iterations;iteration+=1){\n      await provePlayerOne(browser,iteration);\n      await provePlayerTwo(browser,iteration);\n    }\n    process.stdout.write(`PASS pairing automation Chromium ultra-audit: ${iterations} fresh Player One and ${iterations} fresh Player Two browser contexts, exact copy, late-registration state preservation, P1 prefill/postjoin auto-attach, one-paste retained P2 input, and exact Connected Rivalry equality\\n`);\n  }finally{await browser.close();}\n})().catch(error=>{console.error("PAIRING FOUR-CODE AUTOMATION BROWSER AUDIT FAILED");console.error(error.stack||error);process.exit(1);});\n'''
          new='''(async()=>{\n  const runtime=await resolveChromiumRuntime();\n  const iterations=3;\n  for(let iteration=0;iteration<iterations;iteration+=1){\n    for(const scenario of [provePlayerOne,provePlayerTwo]){\n      const browser=await chromium.launch({executablePath:runtime.executablePath,headless:true,args:runtime.args});\n      try{await scenario(browser,iteration);}\n      finally{await browser.close().catch(()=>{});}\n    }\n  }\n  process.stdout.write(`PASS pairing automation Chromium ultra-audit: ${iterations} fresh Player One and ${iterations} fresh Player Two isolated browser processes, exact copy, late-registration state preservation, P1 prefill/postjoin auto-attach, one-paste retained P2 input, and exact Connected Rivalry equality\\n`);\n})().catch(error=>{console.error("PAIRING FOUR-CODE AUTOMATION BROWSER AUDIT FAILED");console.error(error.stack||error);process.exit(1);});\n'''
          assert old in audit, 'browser runner marker missing'
          test.write_text(audit.replace(old,new,1))
          PY
          cat > RELEASE_V1.9.0_R3.md <<'EOF'
          # Career Mode Showdown v1.9.0-r3 — Pairing Copy + Four-Code One-Paste Hardening

          Status: RELEASE CANDIDATE

          Application version: `v1.9.0`

          Runtime asset revision: `1.9.0-r3`

          Previous known-good runtime: `1.9.0-r2`

          ## Purpose

          This bounded runtime hardening makes private pairing smoother and directly observable before Stage 5E production acceptance. Player One gets `COPY PAIRING CODE` directly beneath the full generated capability. Player Two pastes exactly once. Successful redemption retains that same value read-only in the join field, disables Join against replay, and hands the same ID to Connected Rivalry automatically. Player One generated code, Player One Connected Rivalry, Player Two one-paste input, and Player Two Connected Rivalry must be byte-for-byte identical.

          Late device-registration completion is non-destructive while pairing is creating, joining, open, or paired. A registration promise that started before pairing opened cannot clobber the live pairing state when it completes.

          Browser proof uses the production Save Library settings geometry and styles and isolates repeated two-account scenarios into fresh Chromium processes so the audit tests the actual hit target instead of an artificial unstyled overlay.

          ## Safety boundary

          No Firebase authority, polling, collection listing, persistent capability store, gameplay mutation, canonical localStorage mutation or billing service is added. Firebase remains Spark; billing remains forbidden; Firestore remains memory-only; App Check enforcement remains OFF; Candidate C remains sole destructive remote-to-local gameplay Apply authority; public discovery remains prohibited.

          ## RJR accounting

          Fixed RJR-1 remains `87/100` through source, automation proof, review, merge and deployment. RJR can rise only from newly verified owner production capability evidence.
          EOF
      - name: Install locked dependencies
        run: npm ci
      - name: Deterministic and syntax proof
        run: |
          node --check js/sparkPrivatePairing.js
          node --check tests/browser/pairing-four-code-automation-audit.cjs
          node tests/contracts/stage3-private-pairing-contracts.cjs
          node tests/contracts/stage4-connected-rivalry-pointer-restore-contracts.cjs
          node tests/contracts/pairing-four-code-automation-contracts.cjs
      - name: Browser proof
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-r3-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/browser/stage3-private-pairing-audit.cjs
          node tests/browser/pairing-four-code-automation-audit.cjs
          node tests/browser/stage5e-remote-joining-audit.cjs
      - name: Full repository contracts
        run: npm run test:contracts
      - name: Remove one-time workflows
        run: rm .github/workflows/automation-pairing-r3-hardening-v2.yml .github/workflows/automation-pairing-r3-fast-seal.yml .github/workflows/automation-pairing-r3-core-seal.yml
      - name: Commit validated r3 hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden pairing copy and one-paste automation"
          git push origin HEAD:fix/pairing-copy-four-code-contract-2026-09-02
