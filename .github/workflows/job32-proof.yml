name: Job 57 temporary Trophy Room QA
on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - '.github/workflows/job32-proof.yml'
permissions:
  contents: write
jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install pillow numpy scikit-image
      - name: Start local server
        run: |
          python3 -m http.server 8765 >/tmp/job57-http.log 2>&1 &
          sleep 2
      - name: Factory QA all Trophy Room frames
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          FACTORY_QA_OUT: visual-assets/v10_1/trophy-room/evidence/factory-qa
        run: |
          node visual-assets/v10_1/shared/tools/factory-qa.cjs \
            http://127.0.0.1:8765/visual-assets/v10_1/trophy-room/ \
            visual-assets/v10_1/trophy-room TR1,TR2,TR3,TR4,TR5,TR6,TR7 || true
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('visual-assets/v10_1/trophy-room/evidence/factory-qa/qa_report.json')
          r=json.load(open(p))
          desktop={'1366x768','1440x900','1920x1080','1366x640'}
          rows=[]
          for x in r.get('results',[]):
              label=x.get('viewport',{}).get('label')
              if label in desktop:
                  fails=[k for k,v in x.get('gates',{}).items() if not v.get('pass')]
                  rows.append({'frame':x.get('frame'),'viewport':label,'failures':fails})
          out={'pass':bool(rows) and all(not x['failures'] for x in rows),'runs':rows}
          pathlib.Path('visual-assets/v10_1/trophy-room/evidence/desktop_gate.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Desktop contract, keyboard and page weight
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});
            const errors=[]; const failed=[];
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            page.on('requestfailed',r=>failed.push(r.url()));
            await page.goto('http://127.0.0.1:8765/visual-assets/v10_1/trophy-room/index.html?frame=TR1',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__trophyRoomReady===true);
            const metrics=await page.evaluate(()=>{
              const rect=e=>{const r=e.getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
              const d=rect(document.querySelector('[data-manager="daniel"]'));
              const n=rect(document.querySelector('[data-manager="nik"]'));
              const cards=[...document.querySelectorAll('.trophyCard')].map(e=>e.dataset.trophy);
              const tabs=[...document.querySelectorAll('.trophyTab')].map(e=>e.textContent.trim());
              const visible=document.body.innerText;
              const resources=performance.getEntriesByType('resource').map(e=>({name:e.name,encoded:e.encodedBodySize||0,transfer:e.transferSize||0}));
              return {
                h1:(d.left+d.right)/2 < (n.left+n.right)/2,daniel:d,nik:n,cards,tabs,
                noScroll:document.documentElement.scrollWidth<=innerWidth+1&&document.documentElement.scrollHeight<=innerHeight+1&&document.body.scrollWidth<=innerWidth+1&&document.body.scrollHeight<=innerHeight+1,
                forbiddenVisible:['SPECIAL','SUPERCOPA','CONTINEENTAL','PREMIER LEAGUE','FA CUP','COPA DEL REY'].filter(s=>visible.includes(s)),
                resources,bytes:resources.reduce((s,e)=>s+(e.encoded||e.transfer||0),0),
                primary:rect(document.getElementById('trophyRoomBack'))
              };
            });
            metrics.consoleErrors=errors; metrics.failedRequests=failed;
            metrics.exactTabs=JSON.stringify(metrics.tabs)===JSON.stringify(['ALL','SHOWDOWN','LEAGUE TITLES','DOMESTIC CUPS','CHAMPIONS LEAGUE']);
            metrics.exactCards=JSON.stringify(metrics.cards)===JSON.stringify(['showdown','leagueTitles','domesticCups','championsLeague']);
            metrics.pageWeightPass=metrics.bytes<=900*1024;
            const focus=[];
            for(let i=0;i<12;i++){
              await page.keyboard.press('Tab');
              const f=await page.evaluate(()=>{const e=document.activeElement,s=getComputedStyle(e);return {id:e.id||null,cls:e.className||'',text:(e.textContent||'').trim(),outline:s.outlineStyle,outlineWidth:parseFloat(s.outlineWidth)||0};});
              if(f.text||f.id) focus.push(f);
              if(f.id==='trophyRoomBack') break;
            }
            metrics.focus=focus;
            metrics.keyboardPass=focus.filter(x=>/trophyTab/.test(x.cls)||x.id==='trophyRoomBack').length>=6 && focus.filter(x=>/trophyTab/.test(x.cls)||x.id==='trophyRoomBack').every(x=>x.outline!=='none'&&x.outlineWidth>=2);
            metrics.pass=metrics.h1&&metrics.noScroll&&metrics.exactTabs&&metrics.exactCards&&metrics.forbiddenVisible.length===0&&metrics.consoleErrors.length===0&&metrics.failedRequests.length===0&&metrics.pageWeightPass&&metrics.keyboardPass;
            fs.writeFileSync('visual-assets/v10_1/trophy-room/evidence/desktop_metrics.json',JSON.stringify(metrics,null,2)+'\n');
            await page.screenshot({path:'visual-assets/v10_1/trophy-room/evidence/FINAL_TR1_1920.png'});
            await browser.close();
            console.log(JSON.stringify(metrics,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Mockup diff
        run: |
          python3 visual-assets/v10_1/shared/tools/mockup_diff.py \
            --mockup project-documents/factory/mockups/MOCKUP_TROPHY_ROOM.png \
            --build visual-assets/v10_1/trophy-room/evidence/FINAL_TR1_1920.png \
            --plate visual-assets/v10_1/trophy-room/assets/ENV_TR_PLATE_V1_1X.webp \
            --platemap visual-assets/v10_1/trophy-room/assets/platemap.json \
            --out visual-assets/v10_1/trophy-room/evidence/diff/
      - name: Commit QA evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-assets/v10_1/trophy-room/evidence
          git diff --cached --quiet && exit 0
          git commit -m "Job 57 step 8/9: desktop QA evidence"
          for i in 1 2 3 4 5; do
            git pull --rebase origin factory/v1-wtt5ye && git push origin HEAD:factory/v1-wtt5ye && exit 0
            sleep $((i * 4))
          done
          exit 1
      - name: Require desktop gates
        if: always()
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open('visual-assets/v10_1/trophy-room/evidence/desktop_gate.json'))
          b=json.load(open('visual-assets/v10_1/trophy-room/evidence/desktop_metrics.json'))
          c=json.load(open('visual-assets/v10_1/trophy-room/evidence/diff/scores.json'))
          print('factory desktop',a['pass'],'contract',b['pass'],'mockup diff',c['gate']['PASS'])
          if not (a['pass'] and b['pass'] and c['gate']['PASS']): raise SystemExit(1)
          PY
