name: Job 32 visual review preview
on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - '.github/workflows/job32-proof.yml'
permissions:
  contents: write
jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
          fetch-depth: 0
      - run: python3 -m pip install pillow
      - name: Build compact review image
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          goal=Image.open('project-documents/factory/mockups/GOAL_HOME.jpg').convert('RGB')
          build=Image.open('visual-assets/v10_1/home/evidence/FINAL_HM2_1366.png').convert('RGB')
          W=620
          def fit(im):
              h=round(im.height*W/im.width)
              return im.resize((W,h),Image.Resampling.LANCZOS)
          g,b=fit(goal),fit(build)
          h=max(g.height,b.height)
          out=Image.new('RGB',(W*2+24,h+38),(12,12,12))
          out.paste(g,(0,38)); out.paste(b,(W+24,38))
          d=ImageDraw.Draw(out)
          d.text((8,12),'GOAL_HOME',fill=(240,240,240))
          d.text((W+32,12),'JOB 32 FINAL · HM2 · 1366x768',fill=(240,240,240))
          p=Path('visual-assets/v10_1/home/evidence/FINAL_VISUAL_REVIEW.jpg')
          out.save(p,'JPEG',quality=62,optimize=True,progressive=True)
          print(p, p.stat().st_size)
          PY
      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-assets/v10_1/home/evidence/FINAL_VISUAL_REVIEW.jpg
          git commit -m "Job 32 step 6/6: visual review preview"
          git push origin HEAD:factory/v1-wtt5ye
