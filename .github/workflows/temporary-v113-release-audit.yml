name: Temporary v1.1.3 Release Validator Audit

on:
  push:
    branches: [v1.1.3-candidate-c-visual-fixes]
    paths:
      - .github/workflows/temporary-v113-release-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-current-validator-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Report stale v1.1.2 runtime identity pins in executable validation surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '=== plain stale 1.1.2 references in permanent executable validation surfaces ==='
          grep -RInF '1.1.2' .github/workflows tests scripts package.json package-lock.json \
            --exclude='temporary-v113-release-audit.yml' \
            --exclude='temporary-finalize-v113-identity.yml' \
            --exclude='temporary-build-v113-visuals.yml' \
            --exclude='temporary-integrate-v113-runtime.yml' \
            --exclude='temporary-v113-visual-preview.yml' \
            --exclude='temporary-apply-v113-current-authority.yml' || true
          echo '=== escaped-regex stale 1\.1\.2 references ==='
          grep -RInF '1\.1\.2' .github/workflows tests scripts \
            --exclude='temporary-v113-release-audit.yml' \
            --exclude='temporary-finalize-v113-identity.yml' \
            --exclude='temporary-build-v113-visuals.yml' \
            --exclude='temporary-integrate-v113-runtime.yml' \
            --exclude='temporary-v113-visual-preview.yml' \
            --exclude='temporary-apply-v113-current-authority.yml' || true
          echo '=== protected startup thresholds ==='
          grep -RInE '165000|165,000|37500|37,500' .github/workflows tests scripts || true
          echo '=== current identity ==='
          grep -nE 'app-asset-revision|v1\.1\.3|1\.1\.3-r1' index.html package.json js/app.js js/optionalModules.js js/footballVisuals.js | head -80
