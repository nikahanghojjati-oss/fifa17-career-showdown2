name: One-shot Stage 5F RJR91 transition

on:
  push:
    branches:
      - evidence/stage5f-rjr91-to-stage5g-2026-09-04
    paths:
      - .github/workflows/one-shot-stage5f-rjr91-transition.yml

permissions:
  contents: write

jobs:
  transition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: evidence/stage5f-rjr91-to-stage5g-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply evidence-backed RJR91 transition
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readiness_path = Path('REMOTE_JOINING_READINESS.json')
          data = json.loads(readiness_path.read_text())
          domains = {d['id']: d for d in data['domains']}
          assert data['modelVersion'] == 'RJR-1'
          assert data['denominator'] == 100
          assert data['currentScore'] == 89
          assert domains['deterministic-sync-recovery']['earned'] == 20
          assert domains['identity-auth-trust']['earned'] == 18
          assert domains['production-cloud-security']['earned'] == 20
          assert domains['devices-pairing-connected-rivalry-remote-join']['earned'] == 22
          assert domains['real-device-hardening-release']['earned'] == 9

          identity = domains['identity-auth-trust']
          identity['earned'] = 20
          identity['evidence'].extend([
            '2026-09-04 owner production evidence on v1.9.0 / 1.9.0-r5 proves a sacrificial registered device becomes revoked, the normal application adapter rejects it with PRIVATE_SESSION_DEVICE_REVOKED, and production Firestore Rules deny the protected revoked-device mutation with permission-denied; the denied mutation does not commit, the short-lived session remains unchanged, cleanup is terminal, canonical local storage is unchanged, and billing remains unnecessary.',
            '2026-09-04 owner production evidence on v1.9.0 / 1.9.0-r5 proves a legitimately authenticated Google/Firebase identity that is neither rivalry manager receives permission-denied for both the exact private rivalry document and exact authoritative-state document. The probe requires no existing private account, performs no account bootstrap, requests zero Firestore writes, leaves canonical local storage unchanged and requires no billing.'
          ])

          devices = domains['devices-pairing-connected-rivalry-remote-join']
          old = 'Authenticated third-account/revoked-device production negatives and Remote Joining-specific two-physical-network hardening remain uncredited. The provider-live actual Remote Joining lifecycle now has one bounded production capability credit. Token-lifecycle safety is credited separately in production-cloud-security and does not add duplicate Connected Rivalry credit.'
          new = 'Authenticated third-account and revoked-device production authorization negatives are production-proven and credited in identity-auth-trust without duplicate device-domain credit. Remote Joining-specific two-physical-device/two-network reconnect and adverse-network hardening remains uncredited. The provider-live actual Remote Joining lifecycle has one bounded production capability credit. Token-lifecycle safety is credited separately in production-cloud-security and does not add duplicate Connected Rivalry credit.'
          assert old in devices['evidence']
          devices['evidence'][devices['evidence'].index(old)] = new

          data['evidenceHistory'].extend([
            {
              'recordedAt': '2026-09-04T02:35:26.160Z',
              'eventId': 'production-stage5f-revoked-device-provider-mutation-denial',
              'score': 90,
              'delta': 1,
              'domainId': 'identity-auth-trust',
              'reason': 'Owner-supplied production evidence on v1.9.0 / 1.9.0-r5 proves the previously uncredited revoked-device production authorization boundary: a sacrificial registered device is revoked; the normal adapter rejects it with PRIVATE_SESSION_DEVICE_REVOKED; a protected production Firestore mutation carrying the revoked device metadata is denied with permission-denied; the denied mutation does not commit; session state remains unchanged; cleanup is terminal; canonical localStorage is unchanged; and billing/Blaze remain unnecessary. Exactly +1 credits this distinct revocation/authorization capability. The acceptance harness, repeated run, PRs, CI, deployment, documentation and WEC earn zero duplicate credit.'
            },
            {
              'recordedAt': '2026-09-04T03:18:39.250Z',
              'eventId': 'production-stage5f-authenticated-third-account-exact-read-denial',
              'score': 91,
              'delta': 1,
              'domainId': 'identity-auth-trust',
              'reason': 'Owner-supplied production evidence on v1.9.0 / 1.9.0-r5 proves the previously uncredited authenticated non-participant authorization boundary: a legitimately authenticated Google/Firebase identity that is neither manager receives permission-denied for both the exact private rivalry read and exact authoritative-state read. The probe performs zero writes, requires no pre-existing private account, attempts no bootstrap, leaves canonical localStorage unchanged and needs no billing. Exactly +1 credits this distinct authenticated third-account denial capability. Sign-in mechanics, the chooser repair, PRs, CI, deployment, documentation and WEC earn zero duplicate credit.'
            }
          ])
          data['currentScore'] = 91
          assert sum(d['earned'] for d in data['domains']) == 91
          readiness_path.write_text(json.dumps(data, indent=2) + '\n')

          next_task = '''# CURRENT OVERRIDE — STAGE 5F PRODUCTION NEGATIVES ACCEPTED / RJR91 / STAGE 5G NETWORK HARDENING — 2026-09-04 UTC

Production remains `v1.9.0 / 1.9.0-r5`. PR #189 shipped the isolated Stage 5F authenticated-negative acceptance harness and PR #190 shipped the acceptance-only explicit Google account chooser. PR #190 merged to live main `7c140a1593bfc84fcf3b42e6eec3eb50c9a262e4`; its GitHub Pages build and deploy succeeded. Neither implementation nor publication earns RJR credit.

Owner production acceptance is now PASS for both previously uncredited Stage 5F negative boundaries. Sanitized authority is `PRODUCTION_STAGE5F_AUTHENTICATED_NEGATIVES_ACCEPTANCE_2026-09-04.md`. The revoked-device proof shows application rejection plus provider `permission-denied` for a protected mutation, no denied commit, unchanged session state, terminal cleanup and unchanged local storage. The authenticated third-account proof shows an unrelated legitimate Firebase identity receives `permission-denied` for both exact protected reads, with zero writes, no account bootstrap and unchanged local storage.

Fixed RJR-1 is now **91/100**. The transition from 89 is exactly +2 in `identity-auth-trust`: +1 revoked-device protected-mutation denial and +1 authenticated non-participant exact-read denial. That domain is now 20/20. `devices-pairing-connected-rivalry-remote-join` remains 22/30 and `real-device-hardening-release` remains 9/10; the Stage 5F evidence is not double-counted there.

The Installable Offline App, v1.3.0 Recovery & Device Resilience, Local Profiles / Save Library and all canonical local-first/Candidate C guarantees remain protected.

## IMMEDIATE NEXT TASK AFTER FULL STUDY

1. Independently verify current live main, the Stage 5F sanitized production evidence, fixed RJR `91/100`, zero-billing locks and active WEC.
2. Execute the smallest **Remote Joining-specific** two-device/two-network reconnect/adverse-network hardening slice. First reuse the real Stage 5 private-session runtime and existing deterministic provider-failure infrastructure; do not repeat generic Connected Rivalry adverse-network proof merely for confidence.
3. Minimum automated proof must exercise actual private Remote Joining session behavior through disconnect/reconnect or provider loss while preserving exact two-manager entitlement, lifecycle monotonicity/terminal no-resurrection, privacy/no listing, canonical local Save immutability and bounded failure/recovery semantics.
4. Prefer deterministic contracts, browser automation and Auth/Firestore emulator proof before consuming owner effort. Build a production acceptance path only for the aspects that cannot be proven automatically, especially genuine two-physical-device/two-network behavior.
5. Do not award RJR for source, CI, PR, merge, deployment, documentation, WEC or repeated Stage 5F evidence. Recalculate only after genuinely new Remote Joining-specific hardening evidence exists.
6. After the two-network/reconnect boundary is genuinely closed, execute final stable Remote Joining release acceptance as the remaining explicit lane.

Publication discipline: require every current permanent workflow family green on the same exact reviewed PR head; a newer commit invalidates stale exact-head evidence. Use expected-head merge protection and independently verify post-merge main/deployment.

## Permanent locks

Billing must never be activated. Firebase remains Spark. Never link Cloud Billing, enable Blaze, add a payment method, activate Cloud Run or Cloud Functions, purchase credits or use another billing-required service.

App Check enforcement remains OFF. Firestore browser persistence remains memory-only. Google Auth remains popup-only `browserSessionPersistence` with no extra scopes. The canonical localStorage keys remain exactly `careerModeShowdown.saveLibrary`, `careerModeShowdown.legacyShowdowns`, and `careerModeShowdown.preferences`. Candidate A remains non-mutating export. Candidate B remains read-only analysis. Candidate C remains the sole destructive remote-to-local gameplay Apply authority with transaction-owned strict exact raw-snapshot rollback. Exactly two private managers remain mandatory. No public discovery, listing, lobby, matchmaking, community, rankings or global leaderboards are authorized. Trusted-runtime IAM remains unactivated/unbroadened. Never retain a full private pairing/session capability in durable evidence.

Historical task overrides remain in prior versioned handoffs and repository history; this current override replaces stale inline routing.

<!-- Historical compatibility provenance only; NOT current execution authority. CURRENT OVERRIDE — PR #171 MERGED — RJR87 — STAGE 5A. STAGE 5A IS AUTHORIZED NEXT at that historical checkpoint; runtime implementation has not started. -->
'''
          Path('NEXT_TASK.md').write_text(next_task)

          project_state = '''# CURRENT OVERRIDE — STAGE 5F PRODUCTION NEGATIVES ACCEPTED / RJR91 / STAGE 5G ACTIVE

Current independently verified production implementation checkpoint before this evidence transition is main `7c140a1593bfc84fcf3b42e6eec3eb50c9a262e4`, after merged PR #190. Application/runtime remain `v1.9.0 / 1.9.0-r5`. The PR #190 GitHub Pages build and deploy succeeded. Runtime gameplay identity did not change.

Owner production evidence on 2026-09-04 closes both Stage 5F authenticated negative boundaries. Sanitized record: `PRODUCTION_STAGE5F_AUTHENTICATED_NEGATIVES_ACCEPTANCE_2026-09-04.md`.

Fixed RJR-1 is **91/100** with domain vector:

- deterministic sync and recovery safety: 20/20
- identity, authentication, authorization and trust: **20/20**
- production cloud and security activation: 20/20
- devices, pairing, Connected Rivalry and actual Remote Joining: 22/30
- real-device hardening and stable release: 9/10

The +2 from 89 is exactly two new production authorization capabilities: revoked-device protected-mutation provider denial (+1) and authenticated unrelated-account exact private-read denial (+1). No process, implementation, CI, deployment or repeated-proof credit is included.

## Current lane

Stage 5G: Remote Joining-specific two-device/two-network reconnect and adverse-network hardening. Automate deterministic/runtime/browser/emulator evidence first. Owner interaction is required only when genuine physical-device/network evidence cannot be simulated or otherwise proven.

After that lane is genuinely evidence-complete, the explicit remaining milestone is final stable Remote Joining release acceptance.

## Protected baselines and permanent locks

The Installable Offline App remains the local-first startup/recovery baseline. v1.3.0 Recovery & Device Resilience and Local Profiles / Save Library remain protected. Canonical local storage remains exactly `careerModeShowdown.saveLibrary`, `careerModeShowdown.legacyShowdowns`, `careerModeShowdown.preferences`.

Billing is permanently forbidden and Firebase remains Spark. App Check enforcement remains OFF. Firestore browser persistence remains memory-only. Google Auth remains popup-only `browserSessionPersistence` with no extra scopes. Cloud Run and Cloud Functions remain forbidden because they require billing under this architecture. Trusted-runtime IAM remains unactivated/unbroadened.

Candidate A is non-mutating; Candidate B is read-only; Candidate C remains the sole destructive remote-to-local gameplay Apply authority with strict exact raw snapshot and transaction-owned rollback. Exactly two private managers remain mandatory. No public discovery/listing/lobby/matchmaking/community/rankings/global leaderboards. Never durably retain full private pairing/session capabilities. The protected historical rivalry must not be used for destructive testing.

Historical project-state overrides remain available through versioned prior handoffs and repository history; this current override intentionally replaces stale inline state.
'''
          Path('PROJECT_STATE.md').write_text(project_state)

          wec_path = Path('WORK_ENVIRONMENT_STATUS.json')
          wec = json.loads(wec_path.read_text())
          assert wec['environmentId'] == 'we-2026-09-03-stage5f-authenticated-negatives'
          assert wec['lifecycle'] == 'active'
          wec['recordedAt'] = '2026-09-04T03:20:00.000Z'
          wec['repository']['workingBranch'] = 'evidence/stage5f-rjr91-to-stage5g-2026-09-04'
          wec['repository']['handoffBranch'] = 'handoff/pending-stage5g-network-hardening'
          wec['signals']['majorPhasesCompleted'] = 1
          wec['signals']['largeEvidenceEvents'] = 2
          wec['assessment']['decision'] = 'CONTINUE'
          wec['assessment']['reason'] = 'Stage 5F is production-proven and fixed RJR-1 is 91/100. The same active environment can continue without inheriting any predecessor transition decision; the smallest genuinely uncredited capability lane is now Remote Joining-specific two-device/two-network reconnect and adverse-network hardening.'
          wec['continuity']['currentTask'] = 'Build and prove the smallest Remote Joining-specific two-device/two-network reconnect and adverse-network hardening slice, automating deterministic/runtime/browser/emulator evidence before requesting any owner physical-network proof.'
          wec['continuity']['lastSafeCheckpoint'] = 'Production v1.9.0 / 1.9.0-r5 Stage 5F owner acceptance is PASS for both revoked-device provider mutation denial and authenticated third-account exact-read denial; sanitized evidence is recorded and fixed RJR-1 recalculates to 91/100.'
          wec['continuity']['nextSafeAction'] = 'Inspect the real Stage 5 private-session runtime and existing provider-failure/reconnect test infrastructure, then implement only the smallest Remote Joining-specific deterministic hardening proof that preserves two-manager entitlement, lifecycle monotonicity, terminal no-resurrection, privacy and canonical local Save immutability.'
          wec['continuity']['unfinishedWork'] = [
            'Remote Joining-specific two-device/two-network reconnect/adverse-network hardening remains uncredited.',
            'Final stable Remote Joining release acceptance remains uncredited.'
          ]
          wec['continuity']['evidenceNotes'] = [
            'Live main before the evidence transition is 7c140a1593bfc84fcf3b42e6eec3eb50c9a262e4 after merged PR #190; production remains v1.9.0 / 1.9.0-r5.',
            '2026-09-04 sanitized production Stage 5F revoked-device evidence proves application rejection plus provider permission-denied, no denied commit, unchanged session state, terminal cleanup, unchanged local storage and zero billing.',
            '2026-09-04 sanitized production Stage 5F authenticated third-account evidence proves both exact protected reads return permission-denied, with zero writes, no account bootstrap, unchanged local storage and zero billing.',
            'Fixed RJR-1 is 91/100: identity-auth-trust advances from 18/20 to 20/20; devices/pairing/Remote Joining remains 22/30 and hardening/release remains 9/10 to prevent double-counting.',
            'The predecessor HANDOFF_AT_CHECKPOINT decision remains historical and is not inherited; this active WEC continues under its own CONTINUE assessment.'
          ]
          wec_path.write_text(json.dumps(wec, indent=2) + '\n')
          PY
      - name: Commit transition outputs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add REMOTE_JOINING_READINESS.json NEXT_TASK.md PROJECT_STATE.md WORK_ENVIRONMENT_STATUS.json
          git diff --cached --check
          git commit -m "Record Stage 5F RJR91 and route Stage 5G"
          git push origin HEAD:evidence/stage5f-rjr91-to-stage5g-2026-09-04
