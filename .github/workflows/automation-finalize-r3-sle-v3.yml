name: One-time Finalize R3 SLE V3

on:
  push:
    branches:
      - handoff/stage5e-r3-owner-lifecycle-2026-09-02

permissions:
  contents: write

jobs:
  finalize-sle-v3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: handoff/stage5e-r3-owner-lifecycle-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Reuse validated V2 SLE transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          wf=Path('.github/workflows/automation-finalize-r3-sle-v2.yml').read_text()
          marker="          python - <<'PY'\n"
          start=wf.index(marker)+len(marker)
          end=wf.index("\n          PY\n",start)
          exec(compile(textwrap.dedent(wf[start:end]),'r3-sle-v2-transform','exec'),{})
          PY
      - run: npm ci
      - name: Validate mandatory SLE package
        run: |
          node tests/contracts/sle-handoff-packaging-contracts.cjs
          node tests/contracts/next-developer-prompt-contracts.cjs
      - name: Commit whitespace-safe finalized SLE package
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows
          python - <<'PY'
          from pathlib import Path
          paths=[
            'START_NEXT_SESSION_V1.4.36_PR183_R3_OWNER_LIFECYCLE.md',
            'SUCCESSOR_HANDOFF_PR183_R3_OWNER_LIFECYCLE_SLE_2026-09-02.md',
            'project-documents/session-starts/START_NEXT_SESSION_V1.4.36_PR183_R3_OWNER_LIFECYCLE.md',
            'project-documents/handoffs/SUCCESSOR_HANDOFF_PR183_R3_OWNER_LIFECYCLE_SLE_2026-09-02.md',
            'NEXT_TASK.md','SESSION_CONTEXT_GRAPH.json','SESSION_CONTEXT_MODEL.json','SESSION_CONTEXT_LEARNING.json',
            'tests/contracts/sle-handoff-packaging-contracts.cjs'
          ]
          for name in paths:
              p=Path(name)
              p.write_text(p.read_text().rstrip()+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize r3 owner lifecycle SLE package"
          git push origin HEAD:handoff/stage5e-r3-owner-lifecycle-2026-09-02
