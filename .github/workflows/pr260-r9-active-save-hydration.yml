name: PR260 R9 active-save hydration proof
on:
  push:
    branches: [feat/persistent-nik-daniel-pair]
    paths: [.github/workflows/pr260-r9-active-save-hydration.yml]
permissions:
  contents: write
jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Hydrate exact provider-linked save before shared career entry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/persistentNikDanielPair.js')
          s=p.read_text()
          old='let library=runtime.getLibrarySnapshot();if(library?.activeSaveId!==saveId){if(typeof runtime.switchActiveSave!=="function")return null;await runtime.switchActiveSave(saveId);library=runtime.getLibrarySnapshot();if(library?.activeSaveId!==saveId)return null;}const binding='
          new='if(typeof runtime.switchActiveSave!=="function")return null;await runtime.switchActiveSave(saveId);const library=runtime.getLibrarySnapshot();if(library?.activeSaveId!==saveId)return null;const binding='
          if old not in s: raise SystemExit('exact local binding hydration seam missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/contracts/persistent-nik-daniel-pair-contracts.cjs')
          s=p.read_text()
          anchor="assert.match(pairSource,/runtime\\.switchActiveSave\\(saveId\\)/,'Continue Career must activate the exact locally cached Save linked by provider membership instead of using whichever Save is currently active.');"
          insert="""\nconst exactBindingFunction=pairSource.slice(pairSource.indexOf('async function pairExactLocalBindingForProviderSlot'),pairSource.indexOf('function pairPreparedBindingForRole'));\nassert.match(exactBindingFunction,/if\\(typeof runtime\\.switchActiveSave!==\"function\"\\)return null;await runtime\\.switchActiveSave\\(saveId\\);const library=runtime\\.getLibrarySnapshot\\(\\)/,'Provider-linked Continue must hydrate the canonical Save through runtime authority even when that Save is already active.');\nassert.doesNotMatch(exactBindingFunction,/activeSaveId!==saveId[\\s\\S]*switchActiveSave/,'Hydration must not be skipped merely because the provider-linked Save is already the active Save Library selection.');\n"""
          if anchor not in s: raise SystemExit('contract hydration anchor missing')
          if insert.strip() not in s: s=s.replace(anchor,anchor+insert,1)
          p.write_text(s)

          p=Path('tests/browser/persistent-pair-user-facing-routing-audit.cjs')
          s=p.read_text()
          old='identity:{managerProfileIds:{playerOne:playerOneProfileId,playerTwo:profileId}}'
          new='identity:{saveId,managerProfileIds:{playerOne:playerOneProfileId,playerTwo:profileId}}'
          if old not in s: raise SystemExit('prepared Showdown identity seam missing')
          s=s.replace(old,new,1)

          old='switchActiveSave:async()=>true\n      };'
          new='switchActiveSave:async requested=>{if(requested!==saveId)throw new Error("Unexpected Save hydration target.");currentShowdown=preparedShowdown();return currentShowdown;}\n      };'
          if old not in s: raise SystemExit('base routing runtime switch seam missing')
          s=s.replace(old,new,1)

          old='const originalLoader=window.loadRuntimeScript,originalSaveRuntime=window.CareerModeSaveLibraryRuntime,originalEnsure=window.ensureSaveLibraryRuntimeAuthority;'
          new='const originalLoader=window.loadRuntimeScript,originalSaveRuntime=window.CareerModeSaveLibraryRuntime,originalEnsure=window.ensureSaveLibraryRuntimeAuthority,originalCurrentShowdown=currentShowdown;'
          if old not in s: raise SystemExit('cold reload originals seam missing')
          s=s.replace(old,new,1)
          old='let ready=false,activationCount=0;'
          new='let ready=false,activationCount=0,switchCount=0;'
          if old not in s: raise SystemExit('cold reload counters seam missing')
          s=s.replace(old,new,1)
          old='window.CareerModeSaveLibraryRuntime={isReady:()=>ready,getLibrarySnapshot:()=>ready?{activeSaveId:saveId,saves:[{saveId,showdown:prepared()}]}:null,switchActiveSave:async()=>true};'
          new='window.CareerModeSaveLibraryRuntime={isReady:()=>ready,getLibrarySnapshot:()=>ready?{activeSaveId:saveId,saves:[{saveId,showdown:prepared()}]}:null,switchActiveSave:async requested=>{if(requested!==saveId)throw new Error("Unexpected cold-reload hydration target.");switchCount+=1;currentShowdown=prepared();return currentShowdown;}};'
          if old not in s: raise SystemExit('cold reload runtime seam missing')
          s=s.replace(old,new,1)
          old='''        const next=await window.CareerModePersistentNikDanielPair.initialize({force:true});\n        return{status:next.status,activationCount,recoveryReady:next.status==="paired"};'''
          new='''        const next=await window.CareerModePersistentNikDanielPair.initialize({force:true});\n        currentShowdown=null;\n        const continueBefore=window.__continueOpened;\n        const continued=await window.CareerModePersistentNikDanielPair.continuePair();\n        const hydrated=currentShowdown;\n        return{status:next.status,continuedStatus:continued.status,activationCount,switchCount,hydratedSaveId:hydrated?.identity?.saveId||null,hydratedMode:hydrated?.sharedJourney?.mode||null,hydratedSeasons:hydrated?.totalRounds||null,continueOpened:window.__continueOpened-continueBefore,recoveryReady:next.status==="paired"};'''
          if old not in s: raise SystemExit('cold reload return seam missing')
          s=s.replace(old,new,1)
          old='''      }finally{\n        window.loadRuntimeScript=originalLoader;'''
          new='''      }finally{\n        currentShowdown=originalCurrentShowdown;\n        window.loadRuntimeScript=originalLoader;'''
          if old not in s: raise SystemExit('cold reload cleanup seam missing')
          s=s.replace(old,new,1)
          old='assert.deepEqual(reloadAuthority,{status:"paired",activationCount:1,recoveryReady:true},"A normal paired-browser reload must restore Continue authority rather than falsely requiring recovery.");'
          new='assert.deepEqual(reloadAuthority,{status:"paired",continuedStatus:"paired",activationCount:1,switchCount:1,hydratedSaveId:saveId,hydratedMode:"shared",hydratedSeasons:5,continueOpened:1,recoveryReady:true},"A normal paired-browser reload must activate storage, hydrate the already-active canonical Save, and open Continue Career without false recovery.");'
          if old not in s: raise SystemExit('cold reload assertion seam missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Prove focused R9 regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node -c js/persistentNikDanielPair.js
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          node tests/contracts/save-library-runtime-contracts.cjs
          node tests/contracts/static-app-release-contracts.cjs
          npm run serve:test > /tmp/pr260-r9-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          npm run test:persistent-pair-routing
          node tests/browser/shared-showdown-paired-first-entry-audit.cjs
      - name: Publish only proved permanent R9 changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/persistentNikDanielPair.js tests/contracts/persistent-nik-daniel-pair-contracts.cjs tests/browser/persistent-pair-user-facing-routing-audit.cjs
          git diff --cached --check
          git commit -m "fix(pr260): hydrate active save before career entry"
          git push origin HEAD:feat/persistent-nik-daniel-pair
