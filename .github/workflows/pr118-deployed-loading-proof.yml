name: PR118 Deployed Loading Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deployed-loading-proof:
    if: github.event.pull_request.number == 118
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked stability dependencies
        run: npm ci
      - name: Prove installed loading audit against live Pages
        env:
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
          CMS_AUDIT_RUN: deployed-pr118-loading-proof
          CMS_CHROMIUM_MULTI_CONTEXT: "1"
        run: npm run test:loading-visual
