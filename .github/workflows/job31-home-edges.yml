name: Job 31 Home final QA
on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - ".github/workflows/job31-home-edges.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install -g playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Home render QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/job31-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          mkdir -p /tmp/homeqa
          NODE_PATH=$(npm root -g) node visual-assets/v10_1/home/tools/render-qa.cjs \
            http://127.0.0.1:8765/visual-assets/v10_1/home/ /tmp/homeqa
          node <<'NODE'
          const fs=require("fs");
          const q=JSON.parse(fs.readFileSync("/tmp/homeqa/qa_report.json","utf8"));
          console.log("FINAL_SUMMARY",JSON.stringify(q.summary));
          console.log("PLATE_SHA",JSON.stringify(q.plateSha));
          console.log("SEAM_SUMMARY",JSON.stringify(q.seamSummary));
          if(!q.summary || q.summary.failingShots!==0) process.exit(2);
          for(const [name,v] of Object.entries(q.plateSha||{})){
            if(!v.inIntakeReport || !v.inPlatemap) throw new Error("plate hash not registered: "+name);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: job31-final-qa
          path: /tmp/homeqa
          if-no-files-found: error
          compression-level: 6
