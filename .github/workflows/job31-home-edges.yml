name: Job 31 Home narrow-mend validation
on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - ".github/workflows/job31-home-edges.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          python -m pip install --quiet pillow
          npm install -g playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render 400 percent edge validation crops
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/job31validate/full /tmp/job31validate/crops /tmp/homeqa
          python3 -m http.server 8765 >/tmp/job31-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done

          NODE_PATH=$(npm root -g) node <<'NODE'
          const { chromium } = require("playwright");
          const fs=require("fs"), path=require("path");
          const base="http://127.0.0.1:8765/visual-assets/v10_1/home/index.html";
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [w,h] of [[1366,768],[1920,1080]]){
              let boxes=null;
              for(const state of ["final","mends_off"]){
                const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
                const q=new URLSearchParams({frame:"HM1"}); if(state==="mends_off")q.set("mends","0");
                await page.goto(base+"?"+q,{waitUntil:"networkidle"});
                await page.waitForFunction(()=>window.HomePlate&&window.HomePlate.MAP&&window.HomePlate.cam);
                await page.screenshot({path:path.join("/tmp/job31validate/full",`HM1_${w}x${h}_${state}.png`)});
                if(state==="final"){
                  boxes=await page.evaluate(()=>{
                    const H=window.HomePlate,M=H.MAP,vp={w:innerWidth,h:innerHeight};
                    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
                    const box=(r,name,type)=>{const s=H.rectToScreen(r);return {name,type,left:clamp(s.left,0,vp.w),top:clamp(s.top,0,vp.h),right:clamp(s.right,0,vp.w),bottom:clamp(s.bottom,0,vp.h)}};
                    const a=[
                      box(M.protected_boxes.face_daniel,"face_daniel","protected"),
                      box(M.protected_boxes.face_nik,"face_nik","protected"),
                      box(M.protected_boxes.hand_daniel,"hand_daniel","protected")
                    ];
                    for(const el of [...document.querySelectorAll(".mend")]){
                      const r=el.getBoundingClientRect();
                      a.push({name:`zone${el.dataset.zone}_${el.dataset.edge}`,type:"mend",left:clamp(r.left-5,0,vp.w),top:clamp(r.top-5,0,vp.h),right:clamp(r.right+5,0,vp.w),bottom:clamp(r.bottom+5,0,vp.h)});
                    }
                    return a;
                  });
                  fs.writeFileSync(`/tmp/job31validate/boxes_${w}x${h}.json`,JSON.stringify(boxes,null,2));
                }
                await page.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,re
          root=Path("/tmp/job31validate")
          for wh in ["1366x768","1920x1080"]:
              w,h=map(int,wh.split("x"))
              boxes=json.loads((root/f"boxes_{wh}.json").read_text())
              for state in ["final","mends_off"]:
                  im=Image.open(root/"full"/f"HM1_{wh}_{state}.png").convert("RGB")
                  for i,b in enumerate(boxes):
                      l=max(0,int(b["left"]));t=max(0,int(b["top"]));r=min(w,int(b["right"]));bt=min(h,int(b["bottom"]))
                      if r-l<2 or bt-t<2: continue
                      c=im.crop((l,t,r,bt)).resize(((r-l)*4,(bt-t)*4),Image.Resampling.NEAREST)
                      n=re.sub(r"[^A-Za-z0-9_-]+","_",b["name"])
                      c.save(root/"crops"/f"HM1_{wh}_{state}_{i:02d}_{n}_x4.jpg",quality=96,subsampling=0,optimize=True)
          PY

          NODE_PATH=$(npm root -g) node visual-assets/v10_1/home/tools/render-qa.cjs \
            http://127.0.0.1:8765/visual-assets/v10_1/home/ /tmp/homeqa
          node <<'NODE'
          const fs=require("fs");
          const q=JSON.parse(fs.readFileSync("/tmp/homeqa/qa_report.json","utf8"));
          console.log("FINAL_SUMMARY",JSON.stringify(q.summary));
          console.log("SEAM_SUMMARY",JSON.stringify(q.seamSummary));
          if(q.summary.failingShots!==0) process.exit(2);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: job31-narrow-mend-validation
          path: |
            /tmp/job31validate
            /tmp/homeqa/qa_report.json
          if-no-files-found: error
          compression-level: 6
