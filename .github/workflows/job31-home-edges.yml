name: Job 31 Home after-candidate render
on:
  push:
    branches: [factory/v1-wtt5ye]
    paths:
      - ".github/workflows/job31-home-edges.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/v1-wtt5ye
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          python -m pip install --quiet pillow
          npm install -g playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render repaired HM1-HM3 and 400 percent crops
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/edges_after"
          mkdir -p "$OUT/full" "$OUT/crops"
          python3 -m http.server 8765 >/tmp/job31-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done

          NODE_PATH=$(npm root -g) node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs"), path=require("path");
          const out="/tmp/edges_after";
          const base="http://127.0.0.1:8765/visual-assets/v10_1/home/index.html";
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [w,h] of [[1366,768],[1920,1080]]){
              let boxes=null;
              for(const mendOn of [true,false]){
                for(const frame of ["HM1","HM2","HM3"]){
                  const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
                  const q=new URLSearchParams({frame}); if(!mendOn)q.set("mends","0");
                  await page.goto(base+"?"+q,{waitUntil:"networkidle"});
                  await page.waitForFunction(()=>window.HomePlate&&window.HomePlate.MAP&&window.HomePlate.cam);
                  const tag=mendOn?"mends_on":"mends_off";
                  await page.screenshot({path:path.join(out,"full",`${frame}_${w}x${h}_${tag}.png`)});
                  if(frame==="HM1"&&mendOn){
                    boxes=await page.evaluate(()=>{
                      const H=window.HomePlate,M=H.MAP, vp={w:innerWidth,h:innerHeight};
                      const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
                      const box=(r,name,type)=>{const s=H.rectToScreen(r);return {name,type,left:clamp(s.left,0,vp.w),top:clamp(s.top,0,vp.h),right:clamp(s.right,0,vp.w),bottom:clamp(s.bottom,0,vp.h)}};
                      const a=[box(M.protected_boxes.face_daniel,"face_daniel","protected"),box(M.protected_boxes.face_nik,"face_nik","protected"),box(M.protected_boxes.hand_daniel,"hand_daniel","protected")];
                      // Source-repair defect regions from Step 2, expressed in plate pixels.
                      for(const [name,r] of [
                        ["D1_left_column",[20,100,610,700]],
                        ["D2_zone4_5_right",[510,385,548,685]],
                        ["D3_zone4_5_join",[20,515,548,558]],
                        ["D4_top_right",[1290,0,1672,112]],
                        ["D5_top_right_edges",[1290,64,1672,112]],
                        ["D6_zone0_bottom",[0,68,980,96]],
                        ["D7_zone3_top",[30,105,620,135]]
                      ]) a.push(box(r,name,"defect"));
                      return a;
                    });
                  }
                  await page.close();
                }
              }
              fs.writeFileSync(path.join(out,`boxes_${w}x${h}.json`),JSON.stringify(boxes,null,2));
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,re
          root=Path("/tmp/edges_after")
          for wh in ["1366x768","1920x1080"]:
              w,h=map(int,wh.split("x"))
              boxes=json.loads((root/f"boxes_{wh}.json").read_text())
              for frame in ["HM1","HM2","HM3"]:
                  for tag in ["mends_on","mends_off"]:
                      im=Image.open(root/"full"/f"{frame}_{wh}_{tag}.png").convert("RGB")
                      for i,b in enumerate(boxes):
                          l=max(0,int(b["left"])); t=max(0,int(b["top"])); r=min(w,int(b["right"])); bt=min(h,int(b["bottom"]))
                          if r-l<2 or bt-t<2: continue
                          c=im.crop((l,t,r,bt)).resize(((r-l)*4,(bt-t)*4),Image.Resampling.NEAREST)
                          name=re.sub(r"[^A-Za-z0-9_-]+","_",b["name"])
                          c.save(root/"crops"/f"{frame}_{wh}_{tag}_{i:02d}_{name}_x4.jpg",quality=96,subsampling=0,optimize=True)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: job31-step4-candidate
          path: /tmp/edges_after
          if-no-files-found: error
          compression-level: 6
