name: v1.1.0 Recover Startup Headroom

on:
  push:
    branches: [agent/v1.1.0-candidate-a-maintenance]
    paths:
      - .github/workflows/v110-recover-startup-headroom.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.0-candidate-a-maintenance
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Recover startup bytes without behavior changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          storage = Path('js/storage.js')
          s = storage.read_text()
          s = s.replace(
              '''function hasStoredActiveShowdownData(){\n    return readStorageValue(STORAGE_KEY) !== null;\n}\n''',
              '''function hasStoredActiveShowdownData(){return readStorageValue(STORAGE_KEY)!==null;}\n''',
              1
          )
          s = s.replace('''        }catch(error){\n            /* JSON fallback preserves compatibility with older browsers/data. */\n        }\n''', '''        }catch(error){}\n''', 1)
          storage.write_text(s)

          showdown = Path('js/showdown.js')
          d = showdown.read_text()
          d = d.replace('''    /*\n       The gameplay database is lazy in v0.16. A persisted league is not invalid\n       merely because the league data package has not been requested yet.\n    */\n''', '', 1)
          d = d.replace(
              '''    const hasUsableActiveSave = hasSavedShowdown();\n    const hasStoredActiveData = hasUsableActiveSave\n        || (typeof hasStoredActiveShowdownData === "function" && hasStoredActiveShowdownData());\n''',
              '''    const hasUsableActiveSave=hasSavedShowdown(),hasStoredActiveData=hasUsableActiveSave||hasStoredActiveShowdownData();\n''',
              1
          )
          d = d.replace(
              '''        existing = hasUsableActiveSave ? loadSavedShowdown() : null;\n        const existingName = existing && existing.name ? ` "${existing.name}"` : " data currently stored in this browser";\n''',
              '''        existing=hasUsableActiveSave?loadSavedShowdown():null;\n        const existingName=existing?.name?` "${existing.name}"`:" data currently stored in this browser";\n''',
              1
          )
          showdown.write_text(d)

          handoff = Path('CAREER_MODE_SHOWDOWN_MASTER_DEVELOPMENT_CONTINUATION_V1.1.0_CANDIDATE_A.md')
          marker = '## Startup headroom recovery after corrupt-slot fix'
          if marker not in handoff.read_text():
              with handoff.open('a') as f:
                  f.write('''\n\n## Startup headroom recovery after corrupt-slot fix\n\n- Clean candidate `f4546cb764db7055b6c602a85349fb048a57eb4f` correctly failed Static App and Final Polish because the new corrupt-slot replacement protection raised raw startup to `165,287` bytes against the locked `165,000` ceiling.\n- This candidate is **not counted** in the five-pass release proof.\n- The performance budget was not raised and recovery protection was not removed. Headroom was recovered by compacting the new eager expressions and removing non-executable compatibility comments from eager storage/showdown source.\n- The five-pass release count resets to **0/5** on the next clean SHA.\n''')
          PY
          node --check js/storage.js
          node --check js/showdown.js
          npm ci
          npm run test:contracts
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/(?:src|href)="((?:js|css|data)\/[^"?#]+)(?:\?v=[^"#]+)?"/g)].map(m=>m[1]);
          const bytes=refs.reduce((n,p)=>n+fs.statSync(p).size,0);
          console.log(`startup raw bytes: ${bytes}`);
          if(bytes>165000) process.exit(1);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/storage.js js/showdown.js CAREER_MODE_SHOWDOWN_MASTER_DEVELOPMENT_CONTINUATION_V1.1.0_CANDIDATE_A.md
          git commit -m 'Recover startup headroom after corrupt-slot protection'
          git push origin HEAD:agent/v1.1.0-candidate-a-maintenance

# Retry after making the hardening contract formatting-independent.
