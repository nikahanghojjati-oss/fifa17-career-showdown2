name: Temporary v1.1.3 Authority Alignment

on:
  push:
    branches:
      - v1.1.3-candidate-c-visual-fixes
    paths:
      - .github/workflows/temporary-align-v113-authority.yml

permissions:
  contents: write

jobs:
  align-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Resolve Static App / Stability label contradiction exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('PROJECT_STATE.md'),
                  '**Application version:** v1.1.3 — Maintenance Candidate',
                  '**Application version:** v1.1.3 — Owner-Priority Maintenance Candidate',
                  'PROJECT_STATE authority label'
              ),
              (
                  Path('README.md'),
                  '**Application version:** v1.1.3 — Maintenance Candidate',
                  '**Application version:** v1.1.3 — Owner-Priority Maintenance Candidate',
                  'README authority label'
              ),
              (
                  Path('tests/contracts/stability-contracts.cjs'),
                  '`**Application version:** v${appVersion} — Maintenance Candidate`',
                  '`**Application version:** v${appVersion} — Owner-Priority Maintenance Candidate`',
                  'Stability PROJECT_STATE authority assertion'
              ),
          ]
          for path, old, new, label in replacements:
              text = path.read_text()
              count = text.count(old)
              expected = 2 if path.name == 'stability-contracts.cjs' else 1
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} exact match(es), got {count}')
              path.write_text(text.replace(old, new))

          static = Path('.github/workflows/validate-static-app.yml').read_text()
          required = '**Application version:** v1.1.3 — Owner-Priority Maintenance Candidate'
          if static.count(required) != 2:
              raise SystemExit(f'Static App must retain two canonical owner-priority assertions, got {static.count(required)}')
          print('Static App and Stability now target one canonical owner-priority maintenance label.')
          PY
      - name: Verify exact diff and deterministic contracts
        run: |
          set -euo pipefail
          expected=$'PROJECT_STATE.md\nREADME.md\ntests/contracts/stability-contracts.cjs'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          npm ci
          npm run test:contracts
      - name: Publish only authority-label alignment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md README.md tests/contracts/stability-contracts.cjs
          git commit -m "Align v1.1.3 canonical maintenance authority label"
          git push
