name: R19 Align POS20 Registry Once

on:
  push:
    branches:
      - feat/mdp-physical-journey-r19-acceptance
    paths:
      - .github/workflows/r19-align-pos20-registry-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mdp-physical-journey-r19-acceptance
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Align POS20 supplemental registry self-test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='tests/operations/pos20-control-plane.test.mjs';
          let text=fs.readFileSync(file,'utf8');
          const anchor="const terminalCloseProductionContract='tests/contracts/shared-terminal-close-production-contracts.cjs';";
          const insertion="\nconst physicalJourneyAcceptanceContract='tests/contracts/ssjr-physical-journey-acceptance-contracts.cjs';\nconst physicalJourneyPublicationContract='tests/contracts/ssjr-physical-journey-publication-contracts.cjs';";
          if(!text.includes(anchor))throw new Error('terminal close contract anchor changed');
          if(!text.includes('const physicalJourneyAcceptanceContract='))text=text.replace(anchor,anchor+insertion);
          const from='terminalCloseContract,terminalCloseProviderContract,terminalCloseRulesContract,terminalCloseProductionContract];';
          const to='terminalCloseContract,terminalCloseProviderContract,terminalCloseRulesContract,terminalCloseProductionContract,physicalJourneyAcceptanceContract,physicalJourneyPublicationContract];';
          if(!text.includes(from))throw new Error('expected supplemental contract array seam changed');
          text=text.replace(from,to);
          fs.writeFileSync(file,text);
          NODE
          npm ci
          npm run test:ops
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/operations/pos20-control-plane.test.mjs
          git commit -m 'test(mdp): align POS20 r19 supplemental registry'
          git push origin HEAD:feat/mdp-physical-journey-r19-acceptance
