name: R4 Subject Dominant Visual Import

on:
  push:
    branches:
      - agent/r4-visual-recovery-and-error-provenance
    paths:
      - .github/workflows/r4-candidate-contact-sheet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-selected-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v5
        with:
          ref: agent/r4-visual-recovery-and-error-provenance
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download and convert selected licensed sources
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps
          import io, time

          assets = [
              {
                  'file': 'Marcus Rashford September 2016 (cropped).jpg',
                  'output': 'assets/football/marcus-rashford-man-utd-2016-r4.webp',
                  'max': (594, 661),
                  'quality': 94,
              },
              {
                  'file': 'Leo Messi 2016.PNG',
                  'output': 'assets/football/lionel-messi-barcelona-2016-subject-r4.webp',
                  'max': (469, 779),
                  'quality': 94,
              },
          ]

          headers = {'User-Agent': 'CareerModeShowdown/1.0.1-r4 selected-visual-import'}
          for index, asset in enumerate(assets):
              if index:
                  time.sleep(4)
              url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + quote(asset['file'], safe='')
              last_error = None
              for attempt in range(5):
                  try:
                      request = Request(url, headers=headers)
                      with urlopen(request, timeout=45) as response:
                          payload = response.read()
                      image = Image.open(io.BytesIO(payload))
                      image = ImageOps.exif_transpose(image).convert('RGB')
                      image.thumbnail(asset['max'], Image.Resampling.LANCZOS)
                      destination = Path(asset['output'])
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      image.save(destination, 'WEBP', quality=asset['quality'], method=6)
                      print(f"Imported {asset['file']} -> {destination} {image.width}x{image.height}")
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt == 4:
                          raise
                      time.sleep(8 * (attempt + 1))
              else:
                  raise last_error
          PY
      - name: Commit selected binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/football/marcus-rashford-man-utd-2016-r4.webp assets/football/lionel-messi-barcelona-2016-subject-r4.webp
          if git diff --cached --quiet; then
            echo "Selected assets already match branch."
            exit 0
          fi
          git commit -m "Import subject-dominant r4 Rashford and Messi assets"
          git push origin HEAD:agent/r4-visual-recovery-and-error-provenance
