name: R4 Asset Fingerprint Check

on:
  push:
    branches:
      - agent/r4-visual-recovery-and-error-provenance
    paths:
      - .github/workflows/r4-candidate-contact-sheet.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint-selected-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v5
        with:
          ref: agent/r4-visual-recovery-and-error-provenance
      - name: Record exact selected asset fingerprints
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            assets/football/marcus-rashford-man-utd-2016-r4.webp \
            assets/football/lionel-messi-barcelona-2016-subject-r4.webp
          wc -c \
            assets/football/marcus-rashford-man-utd-2016-r4.webp \
            assets/football/lionel-messi-barcelona-2016-subject-r4.webp
