name: V111 Build James Source Refresh

on:
  push:
    branches:
      - agent/v1.1.1-james-real-madrid-source-refresh
    paths:
      - tools/build_r5_player_visuals.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v111-build-james-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-james:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/v1.1.1-james-real-madrid-source-refresh
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 requests==2.32.4
      - name: Build only the new James Real Madrid derivative
        run: python tools/build_r5_player_visuals.py --only james
      - name: Verify generated James asset and manifest mutation
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/football/james-rodriguez-real-madrid-2016-smart-v111.webp
          test ! -f assets/football/james-rodriguez-real-madrid-2019-smart-r5.webp
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('assets/football/asset-manifest.json','utf8'));
          const j=m.assets.find(a=>a.id==='james-rodriguez-real-madrid-2016-smart-v111');
          if(!j) throw new Error('new James manifest entry missing');
          if(j.source_file!=='James Rodríguez in September 2016 - 02.jpg') throw new Error('unexpected James source');
          if(JSON.stringify(j.source_dimensions)!==JSON.stringify([863,1080])) throw new Error(`unexpected source dimensions ${j.source_dimensions}`);
          if(JSON.stringify(j.crop_box_on_source)!==JSON.stringify([0,0,863,1080])) throw new Error('James must preserve the complete licensed source frame');
          if(j.author!=='Real Madrid'||j.license!=='CC BY 3.0') throw new Error('James source provenance changed');
          if(j.output_bytes>360000) throw new Error('James derivative exceeds per-image budget');
          console.log(JSON.stringify(j,null,2));
          NODE
      - name: Commit generated asset and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A assets/football
          if git diff --cached --quiet; then
            echo 'No generated asset changes to commit.'
            exit 0
          fi
          git commit -m 'Build new James Real Madrid source derivative'
          git push origin HEAD:agent/v1.1.1-james-real-madrid-source-refresh
