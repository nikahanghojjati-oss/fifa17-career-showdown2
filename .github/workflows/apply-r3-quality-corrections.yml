name: Apply R3 Quality Corrections

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Restore hard budgets and correct visual QA infrastructure
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          eager_scripts = [
              'js/storage.js',
              'js/showdown.js',
              'js/scoring.js',
              'js/screens.js',
              'js/menuExperience.js',
              'js/optionalModules.js',
              'js/app.js'
          ]

          for file_name in eager_scripts:
              path = Path(file_name)
              text = path.read_text()
              compacted, count = re.subn(
                  r'^/\*\s*=+\n[\s\S]*?=+\s*\*/\n\n',
                  '/* Career Mode Showdown v1.0.1 */\n\n',
                  text,
                  count=1
              )
              if count != 1:
                  raise SystemExit(f'Expected decorative startup banner not found in {file_name}')
              path.write_text(compacted)

          replacements = {
              '.github/workflows/validate-static-app.yml': [
                  (
                      'const maximumInitialAssetBytes = 166000; // r3 measured amendment; gzip 37.5 KB and combined 260 KB remain unchanged.',
                      'const maximumInitialAssetBytes = 165000;'
                  )
              ],
              '.github/workflows/validate-final-polish.yml': [
                  ('assert.ok(rawBytes <= 166000, `Initial raw bytes exceeded 166000 (${rawBytes}).`);',
                   'assert.ok(rawBytes <= 165000, `Initial raw bytes exceeded 165000 (${rawBytes}).`);')
              ],
              'tests/browser/football-visual-audit.cjs': [
                  ('await page.locator("#dashboard .backButton").click();',
                   'await page.getByRole("button", { name: "BACK TO MAIN MENU", exact: true }).click();')
              ],
              'THIRD_PARTY_NOTICES.md': [
                  ('- Local transformation: resized from 1616 × 2424 to 900 × 1350 and encoded as WebP. This local derivative remains available under CC BY-SA 2.0.',
                   '- Local transformation: resized from 1616 × 2424 to 1067 × 1600 and encoded as WebP. This local derivative remains available under CC BY-SA 2.0.')
              ],
              'CHANGELOG.md': [
                  ('- Applies a measured raw-code ceiling amendment from 165,000 to 166,000 bytes: accepted r2 measured 164,700 raw bytes; the pre-seal visual candidate measured 165,918 raw bytes, a 1,218-byte integration increase while all five photographs remain lazy.',
                   '- Retains the existing 165,000-byte raw startup ceiling, 37,500-byte compressed ceiling and 260,000-byte combined first-party startup ceiling; r3 integration recovers headroom by removing non-runtime decorative banner bytes while all five photographs remain lazy.')
              ]
          }

          for file_name, edits in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {file_name}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          workflow_path = Path('.github/workflows/validate-football-visuals.yml')
          workflow = workflow_path.read_text()
          marker = '''          CMS_AUDIT_RUN=licensed-visual-gate npm run test:football-visual\n          CMS_AUDIT_RUN=licensed-visual-gate npm run test:home-visual\n'''
          artifact_step = '''          CMS_AUDIT_RUN=licensed-visual-gate npm run test:football-visual\n          CMS_AUDIT_RUN=licensed-visual-gate npm run test:home-visual\n      - name: Upload visual audit captures\n        if: always()\n        uses: actions/upload-artifact@v7\n        with:\n          name: football-visual-captures-${{ github.run_attempt }}\n          path: test-results/*.png\n          if-no-files-found: warn\n          retention-days: 7\n'''
          if marker not in workflow:
              raise SystemExit('Football visual browser workflow marker not found.')
          workflow_path.write_text(workflow.replace(marker, artifact_step, 1))

          # Prove the correction actually restores the pre-existing hard budget before committing.
          import gzip
          import re as regex
          html = Path('index.html').read_text()
          refs = [m.group(1) for m in regex.finditer(r'(?:src|href)="((?:js|css|data)/[^"?#]+)(?:\?v=[^"#]+)?"', html)]
          raw = sum(Path(ref).stat().st_size for ref in refs)
          compressed = sum(len(gzip.compress(Path(ref).read_bytes(), compresslevel=9)) for ref in refs)
          print(f'Initial shell after quality correction: {raw} raw / {compressed} gzip bytes')
          if raw > 165000:
              raise SystemExit(f'Raw startup budget still exceeds 165000: {raw}')
          if compressed > 37500:
              raise SystemExit(f'Compressed startup budget exceeds 37500: {compressed}')
          PY

          echo '=== Remaining 166000 references ==='
          grep -RIn --exclude-dir=.git '166000' . || true

      - name: Commit quality correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/storage.js js/showdown.js js/scoring.js js/screens.js js/menuExperience.js js/optionalModules.js js/app.js \
            .github/workflows/validate-static-app.yml .github/workflows/validate-final-polish.yml \
            .github/workflows/validate-football-visuals.yml tests/browser/football-visual-audit.cjs \
            THIRD_PARTY_NOTICES.md CHANGELOG.md
          git commit -m 'Restore hard startup budget and visual QA evidence'
          git push origin HEAD:agent/licensed-football-visual-system-r1
