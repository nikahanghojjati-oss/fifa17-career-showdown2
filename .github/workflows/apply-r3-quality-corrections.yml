name: Apply R3 Quality Corrections

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Recover startup headroom without functional cuts
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import gzip
          import re

          eager_scripts = [
              'js/storage.js', 'js/showdown.js', 'js/scoring.js', 'js/screens.js',
              'js/menuExperience.js', 'js/optionalModules.js', 'js/app.js'
          ]
          for file_name in eager_scripts:
              path = Path(file_name)
              compacted, count = re.subn(
                  r'^/\*\s*=+\n[\s\S]*?=+\s*\*/\n\n',
                  '/* Career Mode Showdown v1.0.1 */\n\n',
                  path.read_text(),
                  count=1
              )
              if count != 1:
                  raise SystemExit(f'Expected decorative startup banner not found in {file_name}')
              path.write_text(compacted)

          replacements = {
              'THIRD_PARTY_NOTICES.md': (
                  '- Local transformation: resized from 1616 × 2424 to 900 × 1350 and encoded as WebP. This local derivative remains available under CC BY-SA 2.0.',
                  '- Local transformation: resized from 1616 × 2424 to 1067 × 1600 and encoded as WebP. This local derivative remains available under CC BY-SA 2.0.'
              ),
              'CHANGELOG.md': (
                  '- Applies a measured raw-code ceiling amendment from 165,000 to 166,000 bytes: accepted r2 measured 164,700 raw bytes; the pre-seal visual candidate measured 165,918 raw bytes, a 1,218-byte integration increase while all five photographs remain lazy.',
                  '- Retains the existing 165,000-byte raw startup ceiling, 37,500-byte compressed ceiling and 260,000-byte combined first-party startup ceiling; r3 integration recovers headroom by removing non-runtime decorative banner bytes while all five photographs remain lazy.'
              )
          }
          for file_name, (old, new) in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {file_name}: {old}')
              path.write_text(text.replace(old, new, 1))

          audit = Path('tests/browser/football-visual-audit.cjs').read_text()
          if '#transferChallenge [data-smart-back]' not in audit or '#dashboard [data-smart-back]' not in audit:
              raise SystemExit('Football visual audit has ambiguous Back selectors.')

          html = Path('index.html').read_text()
          refs = [m.group(1) for m in re.finditer(r'(?:src|href)="((?:js|css|data)/[^"?#]+)(?:\?v=[^"#]+)?"', html)]
          raw = sum(Path(ref).stat().st_size for ref in refs)
          compressed = sum(len(gzip.compress(Path(ref).read_bytes(), compresslevel=9)) for ref in refs)
          print(f'Initial shell after quality correction: {raw} raw / {compressed} gzip bytes')
          if raw > 165000:
              raise SystemExit(f'Raw startup budget still exceeds 165000: {raw}')
          if compressed > 37500:
              raise SystemExit(f'Compressed startup budget exceeds 37500: {compressed}')
          PY

      - name: Commit source and attribution corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/storage.js js/showdown.js js/scoring.js js/screens.js js/menuExperience.js js/optionalModules.js js/app.js \
            THIRD_PARTY_NOTICES.md CHANGELOG.md
          git commit -m 'Recover r3 startup headroom without relaxing budgets'
          git push origin HEAD:agent/licensed-football-visual-system-r1
