name: v1.0.2 Stale Reference Scan

on:
  push:
    branches:
      - agent/v1.0.2-footballer-tile-maintenance
    paths:
      - '.github/workflows/v102-stale-scan.yml'
      - 'tools/v102_stale_scan.py'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan active source and CI for stale v1.0.1/r5 references
        run: python tools/v102_stale_scan.py
