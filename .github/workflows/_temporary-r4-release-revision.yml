name: TEMP r4 runtime revision

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-release-revision.yml

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
          fetch-depth: 0
      - name: Bump only whole-shell runtime revision
        run: |
          sed -i 's/1\.9\.0-r3/1.9.0-r4/g' index.html manifest.webmanifest js/app.js js/menuExperience.js
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text()
          old='const RUNTIME_REVISION = "1.9.0-r3";\nconst PREVIOUS_RUNTIME_REVISION = "1.9.0-r2";'
          new='const RUNTIME_REVISION = "1.9.0-r4";\nconst PREVIOUS_RUNTIME_REVISION = "1.9.0-r3";'
          if old not in s:
              raise SystemExit('service worker revision anchor drifted')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit runtime revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest js/app.js js/menuExperience.js service-worker.js
          git commit -m "Bump runtime revision to 1.9.0-r4"
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
