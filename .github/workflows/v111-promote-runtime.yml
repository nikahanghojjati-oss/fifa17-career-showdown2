name: V111 Promote Runtime

on:
  push:
    branches:
      - agent/v1.1.1-james-real-madrid-source-refresh
    paths:
      - tools/promote_v111_runtime.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.1-james-real-madrid-source-refresh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Promote current runtime/test/package identity only
        run: python tools/promote_v111_runtime.py
      - name: Sanity check promoted identity
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          node --check js/footballVisuals.js
          node --check js/optionalModules.js
          node --check js/backup.js
          node --check js/settings.js
          node - <<'NODE'
          const fs=require('fs');
          const p=require('./package.json');
          const l=require('./package-lock.json');
          const h=fs.readFileSync('index.html','utf8');
          if(p.version!=='1.1.1'||l.version!=='1.1.1'||l.packages[''].version!=='1.1.1') throw new Error('package identity drift');
          if(!h.includes('app-asset-revision" content="1.1.1-r1"')||!h.includes('v1.1.1 · Stable')) throw new Error('shell identity drift');
          if(h.includes('1.1.0-r1')) throw new Error('stale shell cache identity');
          NODE
      - name: Commit promoted runtime identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js package.json package-lock.json tests/contracts/backup-contracts.cjs tests/support/run-release-burnin-pass.sh
          git commit -m 'Promote runtime identity to v1.1.1'
          git push origin HEAD:agent/v1.1.1-james-real-madrid-source-refresh
