name: R5 Final Player Preview

on:
  push:
    branches: [agent/r5-smart-player-photo-rebuild]
    paths:
      - 'tests/browser/r5-final-player-preview.cjs'
      - '.github/workflows/r5-final-player-preview.yml'
      - 'assets/football/**'
      - 'data/footballVisuals.js'
      - 'css/footballVisuals.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start application server
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-r5-final-preview.log 2>&1 &
          echo $! > /tmp/cms-r5-final-preview.pid
      - name: Render desktop
        run: CMS_PREVIEW_CASE=desktop node tests/browser/r5-final-player-preview.cjs
      - name: Render windowed Chromebook
        run: CMS_PREVIEW_CASE=windowed node tests/browser/r5-final-player-preview.cjs
      - name: Render mobile DPR2
        run: CMS_PREVIEW_CASE=mobile node tests/browser/r5-final-player-preview.cjs
      - name: Stop application server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cms-r5-final-preview.pid ]; then kill "$(cat /tmp/cms-r5-final-preview.pid)" 2>/dev/null || true; fi
      - name: Upload final player preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r5-final-player-preview-${{ github.sha }}
          path: |
            test-results/r5-final-*.png
            test-results/r5-final-player-metrics-*.json
          if-no-files-found: error
          retention-days: 7
