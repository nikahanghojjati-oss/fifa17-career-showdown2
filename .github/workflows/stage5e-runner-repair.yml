name: Repair Stage 5E One-Shot Runner

on:
  push:
    branches:
      - rjr/stage5e-runtime-host-join-ux-2026-09-02
    paths:
      - ops/stage5e-runner-repair-request.json

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rjr/stage5e-runtime-host-join-ux-2026-09-02
      - name: Repair runner and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/stage5e-worktree-apply.yml')
          text=p.read_text()
          old='\n          npm test\n'
          new='\n          npm run check\n'
          if old not in text:
              raise SystemExit('Expected npm test command not found')
          p.write_text(text.replace(old,new,1))
          Path('.github/workflows/stage5e-runner-repair.yml').unlink()
          Path('ops/stage5e-runner-repair-request.json').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: fix Stage 5E atomic contract command"
          git push origin HEAD:rjr/stage5e-runtime-host-join-ux-2026-09-02
