name: TEMP r4 Stage5E runtime RJR sync

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-stage5e-runtime-rjr-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
          fetch-depth: 0
      - name: Synchronize Stage 5E runtime contract to evidence-backed RJR88
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/contracts/stage5e-production-remote-joining-runtime-contracts.cjs')
          text=p.read_text()
          replacements=[
            ('assert.equal(readiness.currentScore,87,"Stage 5E source/runtime wiring alone earns no RJR credit.");',
             'assert.equal(readiness.currentScore,88,"Stage 5E source/runtime wiring itself earns no RJR credit; current 88 must come from separate provider-live capability evidence.");\nconst stage5eLifecycleEvidence=readiness.evidenceHistory?.find(entry=>entry.eventId==="production-stage5e-r3-provider-live-remote-joining-lifecycle");\nassert.equal(stage5eLifecycleEvidence?.score,88);\nassert.equal(stage5eLifecycleEvidence?.delta,1);\nassert.equal(stage5eLifecycleEvidence?.domainId,"devices-pairing-connected-rivalry-remote-join");\nassert.match(stage5eLifecycleEvidence?.reason||"",/provider-live session lifecycle/i);\nassert.match(stage5eLifecycleEvidence?.reason||"",/zero-manual-reattach[\\s\\S]+zero credit/i);'),
            ('assert.deepEqual(readiness.domains.map(d=>[d.id,d.earned]),[["deterministic-sync-recovery",20],["identity-auth-trust",18],["production-cloud-security",20],["devices-pairing-connected-rivalry-remote-join",20],["real-device-hardening-release",9]]);',
             'assert.deepEqual(readiness.domains.map(d=>[d.id,d.earned]),[["deterministic-sync-recovery",20],["identity-auth-trust",18],["production-cloud-security",20],["devices-pairing-connected-rivalry-remote-join",21],["real-device-hardening-release",9]]);'),
            ('console.log("PASS Stage 5E production Remote Joining runtime contracts: lazy action authority, non-orphaning host/join/revoke/read/close lifecycle, memory-only capability, RJR fixed at 87 pending provider-live runtime proof.");',
             'console.log("PASS Stage 5E production Remote Joining runtime contracts: lazy action authority, non-orphaning host/join/revoke/read/close lifecycle, memory-only capability, current RJR88 sourced only from the separately proven provider-live r3 lifecycle; source/runtime wiring earns zero duplicate credit.");')
          ]
          for old,new in replacements:
              assert old in text, f'missing Stage5E runtime RJR anchor: {old[:100]}'
              text=text.replace(old,new,1)
          p.write_text(text)
          PY
      - name: Commit synchronized Stage 5E runtime authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contracts/stage5e-production-remote-joining-runtime-contracts.cjs
          git diff --cached --check
          git commit -m "Sync Stage 5E runtime contract to RJR88 evidence"
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
