# Claude deep audit (Nik 2026-10-27, decision card): a manual, whole-area review of the live game on main, paid from
# Nik's Claude Console credit (repo secret ANTHROPIC_API_KEY). Unlike Claude Review, it reads the whole code base for
# one area, not a PR diff. It never changes code: it opens one GitHub issue with its findings, and the Team G lead
# verifies each one before anything is fixed. Run it from Actions > Claude Deep Audit > Run workflow.
name: Claude Deep Audit

on:
  workflow_dispatch:
    inputs:
      area:
        description: What to audit
        type: choice
        required: true
        options:
          - season-flow
          - reads-budget
          - rules-vs-app
          - career-save
          - latest-release
      model:
        description: Model
        type: choice
        default: claude-opus-5-5
        options:
          - claude-opus-5-5
          - claude-sonnet-5-5

permissions:
  contents: read

concurrency:
  group: claude-deep-audit-${{ inputs.area }}
  cancel-in-progress: false

jobs:
  audit:
    name: Claude deep audit (${{ inputs.area }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Choose the brief
        id: brief
        shell: bash
        env:
          AREA: ${{ inputs.area }}
        run: |
          set -euo pipefail
          case "$AREA" in
            season-flow) focus="One full season played by two devices, from the shared setup through the transfer challenge, results, the season commit that both players acknowledge, scoring and history, for 1, 3, 5 and 10 season Showdowns. Look for stuck screens, races between the two devices, lost taps, reloads or going offline mid-step, and wrong results.";;
            reads-budget) focus="Firestore reads and writes per season for both devices: every getDoc, getDocs, onSnapshot, transaction and write, how often each runs (timers, listeners, retries, hidden tabs), and the Rules get()/exists() lookups each write costs. Estimate billed reads per season and name every avoidable read. The free Spark limit is 50,000 reads and 20,000 writes a day, and the target is 20 to 30 seasons a day.";;
            rules-vs-app) focus="Firestore Rules against the app: build the deployed (composed) Rules exactly as the deploy job does: node scripts/build-production-firestore-rules.mjs, then node scripts/build-production-firestore-rules-with-persistent-pair.mjs, and read the result in firestore.spark.generated.rules (the first stage alone lacks the persistent pair Rules). Then check that every write the legitimate app makes is allowed in every normal-play state (reload, old tab, expired session, re-join), and that nothing lets one player break the other's game through stale state.";;
            career-save) focus="The career save that lives in Firebase since r80, across 10 seasons and many Showdowns: career history, stats, trophies, Legacy, Golden Showdown, the hiding of test and ended-early games, and recovery after an interrupted save. Look for data loss, double counting, wrong totals and anything that breaks after many seasons.";;
            latest-release) focus="The latest release on main: read the newest RELEASE_V*.md, check what it claims against the code, then review the code it changed (git log and the merged PRs it lists).";;
          esac
          echo "focus=$focus" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Claude deep audit
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            AREA: ${{ inputs.area }}
            The main branch (the live game) is checked out in the working directory.

            The game: Career Mode Showdown, a private two-player FIFA 17 career tracker (Daniel and Nik, one phone or
            laptop each), a static site on GitHub Pages with Firebase Auth and Firestore on the free Spark plan. The
            goal is 10 smooth seasons. Start with NEXT_TASK.md, POS20_CURRENT_STATE.json and the newest RELEASE_V*.md.

            Audit this area deeply, reading whatever code it needs: ${{ steps.brief.outputs.focus }}

            Report only real defects that normal play can hit: wrong results, broken game flow, lost or corrupted career
            data, sync races between the two devices, extra Firestore reads or writes, and screens that flash an old
            design or leave a player stuck. Out of scope: attacks that need a modified app or the browser console,
            style, naming and refactors. House rules a change must keep: equal scores are a DRAW (no tiebreak
            anywhere); Showdowns are 1, 3, 5 or 10 seasons; nothing may dim or cover the screen; the loading screen
            stays until the next screen is ready.

            When done, open exactly one GitHub issue with gh issue create, titled
            "Claude deep audit: ${{ inputs.area }} (${{ github.sha }})". In the body give, most severe first and at most
            12: severity P0 to P3, the file and line, what goes wrong for the players, how to reproduce it, and the
            smallest fix. Then a short list of what you checked and found sound. If nothing real is found, say so.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 120
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(node scripts/build-production-firestore-rules.mjs:*),Bash(node scripts/build-production-firestore-rules-with-persistent-pair.mjs:*),Bash(gh issue create:*)"
