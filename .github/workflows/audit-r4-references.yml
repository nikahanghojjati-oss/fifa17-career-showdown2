name: Audit R4 References

on:
  push:
    branches:
      - agent/r4-visual-recovery-and-error-provenance

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'Run final r4 stale-reference audit')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
      - name: Reject active r3 runtime references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Remaining r3 references ==='
          grep -RIn --exclude-dir=.git --exclude='package-lock.json' '1\.0\.1-r3' . || true
          echo '=== Active runtime/workflow r3 references (must be empty) ==='
          active="$(grep -RIn --exclude-dir=.git --exclude='package-lock.json' '1\.0\.1-r3' index.html js data css .github/workflows README.md CHANGELOG.md 2>/dev/null || true)"
          if [ -n "$active" ]; then
            echo "$active"
            exit 1
          fi
          echo 'No active r3 references remain. Historical incident documentation may retain r3.'
