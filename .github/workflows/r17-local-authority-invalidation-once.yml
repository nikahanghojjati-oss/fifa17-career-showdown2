name: r17 local authority invalidation once

on:
  push:
    branches:
      - feat/ssjr-final-reconciliation-r17
    paths:
      - .github/workflows/r17-local-authority-invalidation-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: feat/ssjr-final-reconciliation-r17
      - name: Guard exact staging parent
        run: |
          test "$(git rev-parse HEAD^)" = "7bf25525c0fe9ff5186275f92dda2e926c9e99d6"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/r17-local-authority-invalidation-once.yml"
      - name: Apply exact local authority invalidation correction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exact snippet once, found {count}")
              p.write_text(text.replace(old,new,1))

          replace_once("js/productionSharedFinalReconciliation.js",
              '  const PANEL_ID="sharedFinalReconciliationPanel";\n',
              '  const PANEL_ID="sharedFinalReconciliationPanel";\n  const SAFE_LOCAL_PHASES=new Set(["REMOTE_OBSERVED","PREVIEW_READY","APPLIED"]);\n')
          replace_once("js/productionSharedFinalReconciliation.js",
              '  function pfrSnapshotsMatch(request,multiState,historyState,localState){const role=String(localState?.binding?.managerRole||"");const activeProfileId=role==="playerOne"?request?.playerOneProfileId:role==="playerTwo"?request?.playerTwoProfileId:"";return Boolean(request&&multiState&&historyState&&localState&&String(multiState.rivalryId||"")===request.rivalryId&&String(historyState.rivalryId||"")===request.rivalryId&&String(localState.binding?.saveId||"")===request.saveId&&activeProfileId&&String(localState.binding?.profileId||"")===activeProfileId);}\n',
              '  function pfrLocalAuthorityMatches(request,localState){const role=String(localState?.binding?.managerRole||"");const activeProfileId=role==="playerOne"?request?.playerOneProfileId:role==="playerTwo"?request?.playerTwoProfileId:"";return Boolean(request&&localState&&SAFE_LOCAL_PHASES.has(localState.phase)&&localState.canonicalStorageMutation===false&&localState.providerWriteRequired===false&&localState.automaticLocalApply===false&&localState.candidateCOnly===true&&String(localState.binding?.saveId||"")===request.saveId&&activeProfileId&&String(localState.binding?.profileId||"")===activeProfileId);}\n  function pfrSnapshotsMatch(request,multiState,historyState,localState){return Boolean(request&&multiState&&historyState&&String(multiState.rivalryId||"")===request.rivalryId&&String(historyState.rivalryId||"")===request.rivalryId&&pfrLocalAuthorityMatches(request,localState));}\n')
          replace_once("js/productionSharedFinalReconciliation.js",
              '  function pfrCurrentView(){const request=pfrRequest();return request&&view&&viewContextKey===request.key?view:null;}\n',
              '  function pfrCurrentView(){const request=pfrRequest();let localState=null;try{localState=localApi?.getState?.()||null;}catch(_error){}return request&&view&&viewContextKey===request.key&&pfrLocalAuthorityMatches(request,localState)?view:null;}\n')
          replace_once("js/productionSharedFinalReconciliation.js",
              '  function pfrWake(){if(root.document?.visibilityState==="hidden")return;const request=pfrRequest();if(!request){view=null;viewContextKey="";pfrRender();return;}if(viewContextKey&&viewContextKey!==request.key){view=null;viewContextKey="";pfrRender();}if(busy&&refreshPromise&&refreshContextKey===request.key)return;void pfrRefresh();}\n',
              '  function pfrWake(event){if(root.document?.visibilityState==="hidden")return;const request=pfrRequest();if(!request){view=null;viewContextKey="";pfrRender();return;}if(event?.type==="career-mode-shared-local-reconciliation-state-change"){let localState=event.detail||null;if(!localState){try{localState=localApi?.getState?.()||null;}catch(_error){}}if(!pfrLocalAuthorityMatches(request,localState)){pfrDiscard(request);return;}}if(viewContextKey&&viewContextKey!==request.key){view=null;viewContextKey="";pfrRender();}if(busy&&refreshPromise&&refreshContextKey===request.key)return;void pfrRefresh();}\n')

          replace_once("tests/browser/shared-final-reconciliation-audit.cjs",
              '  const originalIdentity={...race.context.currentShowdown.identity,managerProfileIds:{...race.context.currentShowdown.identity.managerProfileIds}};\n',
              '  race.local.phase="OFFLINE_FALLBACK";assert.equal(api.getState(),null,"Latest Local Reconciliation authority loss must immediately hide an already-published final result without waiting for network refresh.");\n  race.local.phase="REMOTE_OBSERVED";const authorityRecovered=await api.refresh();assert.equal(authorityRecovered.phase,"FINAL_SEASON_RECONCILED");\n  race.local.phase="BLOCKED";race.listeners.get("career-mode-shared-local-reconciliation-state-change")?.({type:"career-mode-shared-local-reconciliation-state-change",detail:race.local});race.local.phase="REMOTE_OBSERVED";assert.equal(api.getState(),null,"A blocked Local Reconciliation event must synchronously discard the stored final view before any asynchronous dependency refresh can stall.");\n  const eventRecovered=await api.refresh();assert.equal(eventRecovered.phase,"FINAL_SEASON_RECONCILED","Fresh safe local authority may republish only after exact reconciliation runs again.");\n  const originalIdentity={...race.context.currentShowdown.identity,managerProfileIds:{...race.context.currentShowdown.identity.managerProfileIds}};\n')
          replace_once("tests/browser/shared-final-reconciliation-audit.cjs",
              'PASS r17 Final Reconciliation two-context audit: canonical Save Library identity, exact manager binding, published-view invalidation, stale cross-rivalry refresh suppression, correct winner, no extra season and zero direct storage writes',
              'PASS r17 Final Reconciliation two-context audit: canonical Save Library identity, exact manager binding, synchronous local-authority invalidation, published-view invalidation, stale cross-rivalry refresh suppression, correct winner, no extra season and zero direct storage writes')

          replace_once("tests/contracts/shared-final-reconciliation-production-contracts.cjs",
              'assert.match(production,/localState\\.binding\\?\\.profileId/);',
              'assert.match(production,/localState\\.binding\\?\\.profileId/);assert.match(production,/SAFE_LOCAL_PHASES/);assert.match(production,/function pfrLocalAuthorityMatches\\(request,localState\\)/);assert.match(production,/localApi\\?\\.getState\\?\\.\\(\\)/);assert.match(production,/event\\?\\.type==="career-mode-shared-local-reconciliation-state-change"/);')
          replace_once("tests/contracts/shared-final-reconciliation-production-contracts.cjs",
              'stale-view/context-safe, read-only',
              'stale-view/context-safe, live-local-authority-safe, read-only')
          PY
      - name: Validate focused correction
        run: |
          node tests/contracts/shared-final-reconciliation-contracts.cjs
          node tests/contracts/shared-final-reconciliation-production-contracts.cjs
          node tests/browser/shared-final-reconciliation-audit.cjs
          npm run test:ssjr
          npm run test:ops
          git diff --check
      - name: Commit correction and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/productionSharedFinalReconciliation.js tests/browser/shared-final-reconciliation-audit.cjs tests/contracts/shared-final-reconciliation-production-contracts.cjs
          git commit -m "fix: invalidate final result on local authority loss"
          git rm .github/workflows/r17-local-authority-invalidation-once.yml
          git commit -m "chore: remove r17 local authority one-shot"
          git push origin HEAD:feat/ssjr-final-reconciliation-r17
