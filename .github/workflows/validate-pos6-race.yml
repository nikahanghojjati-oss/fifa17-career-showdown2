name: Validate POS6 RACE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos6-race-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  route:
    name: RACE-6 route
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      profile: ${{ steps.route.outputs.profile }}
      run_deterministic: ${{ steps.route.outputs.run_deterministic }}
      run_operations: ${{ steps.route.outputs.run_operations }}
      browser: ${{ steps.route.outputs.browser }}
      run_remote_emulator: ${{ steps.route.outputs.run_remote_emulator }}
      run_storage_browser: ${{ steps.route.outputs.run_storage_browser }}
      run_visual_browser: ${{ steps.route.outputs.run_visual_browser }}
      run_static_spark: ${{ steps.route.outputs.run_static_spark }}
    steps:
      - name: Check out exact candidate with history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve exact changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          changed=/tmp/pos6-changed-files.txt
          : > "$changed"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$changed"
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && ! "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$changed"
          fi
          sort -u -o "$changed" "$changed"
          printf 'RACE-6 changed files:\n'
          cat "$changed" || true
      - name: Compute fail-safe RACE-6 profile
        id: route
        run: node scripts/pos6-risk-router.mjs --files-file /tmp/pos6-changed-files.txt --github-output "$GITHUB_OUTPUT" --json

  operations:
    name: POS6 operations
    needs: route
    if: needs.route.outputs.run_operations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run test:ops

  deterministic:
    name: Current deterministic product census
    needs: route
    if: needs.route.outputs.run_deterministic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:contracts

  static-spark:
    name: Static syntax and Spark boundary
    needs: route
    if: needs.route.outputs.run_static_spark == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Validate JavaScript syntax
        shell: bash
        run: find js data tests scripts -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: node tests/contracts/static-app-release-contracts.cjs
      - name: Prove current Spark account and Rules boundary
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts firebase@12.17.1 @firebase/rules-unit-testing@5.0.1 firebase-tools@15.27.0
          npx --no-install firebase emulators:exec --project demo-career-mode-showdown-phase1f --only firestore "node tests/firebase/spark-account-bootstrap-emulator.cjs"

  remote-proof:
    name: Remote security/provider proof
    needs: route
    if: needs.route.outputs.run_remote_emulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Install pinned Firebase emulator dependencies
        run: npm install --no-save --package-lock=false firebase@12.17.1 @firebase/rules-unit-testing@5.0.1 firebase-admin@14.2.0
      - name: Run unique remote browser proofs
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-pos6-remote-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/browser/stage3-private-pairing-audit.cjs
          node tests/browser/pairing-four-code-automation-audit.cjs
          node tests/browser/stage5b-device-credential-audit.cjs
          node tests/browser/shared-showdown-paired-first-entry-audit.cjs
          CMS_AUDIT_RUN="pos6-race-remote" node tests/browser/stage4-remote-local-reconciliation-audit.cjs
      - name: Run remote-only deterministic specialist guards not owned by the product census
        run: |
          node tests/contracts/stage4-mutation-rate-limit-contracts.cjs
          node tests/contracts/stage5a-private-session-contracts.cjs
          node tests/contracts/stage5b-device-credential-contracts.cjs
      - name: Run Stage 3 and Stage 4 Firestore Rules proofs
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-stage3 "node tests/firebase/stage3-private-pairing-emulator.cjs"
          npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-stage4 "node tests/firebase/stage4-connected-rivalry-emulator.cjs && node tests/firebase/stage4-idempotency-replay-emulator.cjs && node tests/firebase/stage4-abuse-hardening-emulator.cjs && node tests/firebase/stage4-mutation-rate-limit-emulator.cjs"
      - name: Run Stage 5 Auth/Rules proofs
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-stage5a "node tests/firebase/stage5a-private-session-emulator.cjs"
          npx --yes firebase-tools@15.28.1 emulators:exec --only auth,firestore --project demo-career-mode-showdown-stage5b "node tests/firebase/stage5b-device-credential-emulator.cjs"
          npx --yes firebase-tools@15.28.1 emulators:exec --only auth,firestore --project demo-career-mode-showdown-stage5c "node tests/firebase/stage5c-zero-billing-standard-auth-session-emulator.cjs"
      - name: Run Shared Setup candidate and generated-production Rules proofs
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-shared-setup "node tests/firebase/shared-showdown-setup-provider-emulator.cjs && node tests/firebase/shared-showdown-setup-provider-session-emulator.cjs"
          node scripts/build-production-firestore-rules.mjs
          npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-shared-setup-production "node tests/firebase/shared-showdown-setup-production-provider-emulator.cjs"

  storage-proof:
    name: Storage/import/restore browser proof
    needs: route
    if: needs.route.outputs.run_storage_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Candidate A/B/C and multi-save browser proofs
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-pos6-storage-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN="pos6-race-storage" npm run test:backup-browser
          CMS_AUDIT_RUN="pos6-race-storage" npm run test:import-browser
          CMS_AUDIT_RUN="pos6-race-storage" npm run test:restore-browser
          CMS_AUDIT_RUN="pos6-race-storage" npm run test:multi-save-browser

  visual-proof:
    name: Visual/presentation browser proof
    needs: route
    if: needs.route.outputs.run_visual_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run responsive visual and Shared Setup presentation proofs
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-pos6-visual-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN="pos6-race-visual" npm run test:home-visual
          CMS_CHROMIUM_MULTI_CONTEXT=1 CMS_AUDIT_RUN="pos6-race-visual" npm run test:loading-visual
          CMS_AUDIT_RUN="pos6-race-visual" npm run test:football-visual
          CMS_CHROMIUM_MULTI_CONTEXT=1 CMS_AUDIT_RUN="pos6-race-visual" node tests/browser/shared-showdown-polished-presentation-audit.cjs

  full-browser:
    name: ACCURATE canonical Chromium journey
    needs: route
    if: needs.route.outputs.browser == 'FULL'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run canonical runtime, persistence, offline and complete journey
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-pos6-full-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN="pos6-race-full" npm run test:runtime-boundary
          CMS_AUDIT_RUN="pos6-race-full" node tests/browser/save-library-ui-audit.cjs
          CMS_AUDIT_RUN="pos6-race-full" node tests/browser/manager-identity-linkage-audit.cjs
          CMS_AUDIT_RUN="pos6-race-full" node tests/browser/identity-safe-career-analytics-audit.cjs
          CMS_AUDIT_RUN="pos6-race-full" node tests/browser/offline-boundary-audit.cjs
          CMS_CHROMIUM_MULTI_CONTEXT=1 CMS_AUDIT_RUN="pos6-race-full" node tests/browser/offline-cache-lifecycle-v2-audit.cjs
          CMS_AUDIT_RUN="pos6-race-full" npm run test:browser

  accurate-summary:
    name: POS6 Accurate Summary
    if: always()
    needs: [route, operations, deterministic, static-spark, remote-proof, storage-proof, visual-proof, full-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected lane to succeed
        shell: bash
        env:
          ROUTE: ${{ needs.route.result }}
          OPERATIONS: ${{ needs.operations.result }}
          DETERMINISTIC: ${{ needs.deterministic.result }}
          STATIC_SPARK: ${{ needs.static-spark.result }}
          REMOTE: ${{ needs.remote-proof.result }}
          STORAGE: ${{ needs.storage-proof.result }}
          VISUAL: ${{ needs.visual-proof.result }}
          FULL_BROWSER: ${{ needs.full-browser.result }}
        run: |
          set -euo pipefail
          for pair in "route=$ROUTE" "operations=$OPERATIONS" "deterministic=$DETERMINISTIC" "static-spark=$STATIC_SPARK" "remote=$REMOTE" "storage=$STORAGE" "visual=$VISUAL" "full-browser=$FULL_BROWSER"; do
            name=${pair%%=*}
            result=${pair#*=}
            printf '%s: %s\n' "$name" "$result"
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
          echo "PASS POS6 RACE selected-lane seal"
