name: v1.1.0 Silent Active Save Validity Probe Fix

on:
  push:
    branches: [agent/v1.1.0-candidate-a-maintenance]
    paths:
      - .github/workflows/v110-silent-validity-probe-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.0-candidate-a-maintenance
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Silence expected corrupt-save validity probes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          storage=Path('js/storage.js')
          s=storage.read_text()
          old='''    }catch(error){\n        activeSavePresenceKnown = true;\n        activeSavePresent = false;\n        reportStorageError("Unable to use the stored active showdown", error);\n    }\n'''
          new='''    }catch{\n        activeSavePresenceKnown = true;\n        activeSavePresent = false;\n    }\n'''
          if s.count(old)!=1:
              raise SystemExit(f'Expected one noisy active-save validity catch, found {s.count(old)}')
          storage.write_text(s.replace(old,new,1))

          hardening=Path('tests/contracts/final-release-hardening.cjs')
          h=hardening.read_text()
          extra='''\nconst hasSavedSection = storage.match(/function hasSavedShowdown\\(\\)\\{[\\s\\S]*?function invalidateLegacyCache/)?.[0] || "";\nassert.ok(hasSavedSection, "hasSavedShowdown validity probe is missing.");\nassert.ok(!hasSavedSection.includes("reportStorageError"), "Expected corrupt active-save validity probes must not emit runtime console errors.");\nconsole.log("Corrupt active-save validity probing is silent while replacement protection remains active.");\n'''
          if 'Expected corrupt active-save validity probes must not emit runtime console errors.' not in h:
              h += extra
          hardening.write_text(h)

          handoff=Path('CAREER_MODE_SHOWDOWN_MASTER_DEVELOPMENT_CONTINUATION_V1.1.0_CANDIDATE_A.md')
          marker='## Five-pass burn-in attempt 3 — rejected proof'
          if marker not in handoff.read_text():
              with handoff.open('a') as f:
                  f.write('''\n\n## Five-pass burn-in attempt 3 — rejected proof\n\n- Clean candidate SHA: `dc2596a702602012b16dbf0440ddf24c3c79a05f`.\n- Burn-in workflow run: `31522639199`; five independent runners all failed consistently after the corrupt-save replacement dialog was successfully exercised. This attempt is **not counted**.\n- Pass 1 again proved contracts, runtime provenance, Home/Reus visuals, licensed football visuals, and Candidate A backup/export before the complete journey reached the corrupt active-save replacement fixture.\n- Root cause: `hasSavedShowdown()` treated malformed JSON correctly as unusable, but its validity probe also called `reportStorageError(...)`. Because New Showdown now intentionally probes validity before presenting the replacement confirmation, the supported recovery path generated an unexpected console error.\n- Product correction: malformed active JSON still produces `hasSavedShowdown() === false`, still remains preserved in the raw slot, and still requires explicit confirmation before replacement, but the validity probe itself is now silent. This prevents an expected recovery condition from masquerading as an application runtime error.\n- A permanent contract forbids `reportStorageError` inside the `hasSavedShowdown()` validity probe.\n- Release count resets to **0/5** on the next clean SHA.\n''')
          PY
          node --check js/storage.js
          node --check tests/contracts/final-release-hardening.cjs
          npm ci
          npm run test:contracts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/storage.js tests/contracts/final-release-hardening.cjs CAREER_MODE_SHOWDOWN_MASTER_DEVELOPMENT_CONTINUATION_V1.1.0_CANDIDATE_A.md
          git commit -m 'Silence expected corrupt-save validity probes'
          git push origin HEAD:agent/v1.1.0-candidate-a-maintenance
