name: TEMP r4 Stage5E evidence shell and maintenance synchronization

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-stage5e-evidence-wording.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Synchronize exact r4 contracts and maintenance record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/contracts/stage5e-production-remote-joining-runtime-contracts.cjs')
          text=p.read_text()
          reps=[
            ('assert.match(stage5eLifecycleEvidence?.reason||"",/provider-live session lifecycle/i);','assert.match(stage5eLifecycleEvidence?.reason||"",/actual Remote Joining session capability end to end/i);'),
            ('assert.match(stage5eLifecycleEvidence?.reason||"",/zero-manual-reattach[\\s\\S]+zero credit/i);','assert.match(stage5eLifecycleEvidence?.reason||"",/zero credit[\\s\\S]+zero-manual-reattach/i);')
          ]
          for old,new in reps:
            if text.count(old)!=1: raise SystemExit(f'expected exactly one Stage5E assertion: {old}; found {text.count(old)}')
            text=text.replace(old,new,1)
          p.write_text(text)

          p=Path('tests/contracts/release-shell-coherence-contracts.cjs')
          text=p.read_text()
          reps=[
            ('release=read("RELEASE_V1.9.0_R3.md")','release=read("RELEASE_V1.9.0_R4.md")'),
            ('assert.equal(runtime,"1.9.0-r3");','assert.equal(runtime,"1.9.0-r4");'),
            ('assert.equal(previous,"1.9.0-r2");','assert.equal(previous,"1.9.0-r3");'),
            ('assert.match(release,/Private Remote Joining|host\\/join/i);','assert.match(release,/Remote Joining|pairing-code/i);')
          ]
          for old,new in reps:
            if text.count(old)!=1: raise SystemExit(f'expected exactly one shell assertion: {old}; found {text.count(old)}')
            text=text.replace(old,new,1)
          p.write_text(text)

          p=Path('RELEASE_V1.9.0_R4.md')
          text=p.read_text()
          marker='# Career Mode Showdown v1.9.0-r4\n\n'
          if text.count(marker)!=1: raise SystemExit('unexpected r4 release heading')
          if 'Status: RELEASE CANDIDATE' not in text:
            text=text.replace(marker,marker+'Status: RELEASE CANDIDATE / NOT PRODUCTION-PROVEN\n\n',1)
          p.write_text(text)
          PY
          echo '' | base64 -d > CAREER_MODE_SHOWDOWN_V1.9.0_R4_MAINTENANCE_HANDOFF.md
      - name: Verify intended clean-tree complete contract suite
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temporary-r4-stage5e-evidence-wording.yml
          npm ci
          npm run test:contracts
      - name: Commit exact synchronization
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/_temporary-r4-stage5e-evidence-wording.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/contracts/stage5e-production-remote-joining-runtime-contracts.cjs tests/contracts/release-shell-coherence-contracts.cjs RELEASE_V1.9.0_R4.md CAREER_MODE_SHOWDOWN_V1.9.0_R4_MAINTENANCE_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Complete r4 release authority synchronization'
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
