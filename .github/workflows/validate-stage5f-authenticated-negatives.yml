name: Validate Stage 5F Authenticated Negatives

# Historical workflow name retained for check-name compatibility. Under POS-2 this is a
# current specialist authentication/authorization security lane, not an RJR milestone gate.
on:
  pull_request:
    paths:
      - "production-authorization-acceptance.html"
      - "js/productionAuthorizationAcceptance.js"
      - "js/stage5fAcceptanceAccountChooser.js"
      - "js/stage5fProductionAuthenticatedNegatives.js"
      - "tests/contracts/stage5f-account-chooser-contracts.cjs"
      - "tests/contracts/stage5f-authenticated-negatives-contracts.cjs"
      - "tests/contracts/production-authorization-acceptance-contracts.cjs"
      - "tests/contracts/production-provider-abuse-acceptance-contracts.cjs"
      - ".github/workflows/validate-stage5f-authenticated-negatives.yml"
  push:
    branches: [main]
    paths:
      - "production-authorization-acceptance.html"
      - "js/productionAuthorizationAcceptance.js"
      - "js/stage5fAcceptanceAccountChooser.js"
      - "js/stage5fProductionAuthenticatedNegatives.js"
      - "tests/contracts/stage5f-account-chooser-contracts.cjs"
      - "tests/contracts/stage5f-authenticated-negatives-contracts.cjs"
      - "tests/contracts/production-authorization-acceptance-contracts.cjs"
      - "tests/contracts/production-provider-abuse-acceptance-contracts.cjs"
      - ".github/workflows/validate-stage5f-authenticated-negatives.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage5f-authenticated-negatives-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  stage5f-authenticated-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify explicit Google account chooser contract
        run: node tests/contracts/stage5f-account-chooser-contracts.cjs
      - name: Verify zero-billing authenticated-negative contracts
        run: node tests/contracts/stage5f-authenticated-negatives-contracts.cjs
