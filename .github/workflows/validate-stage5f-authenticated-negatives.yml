name: Validate Stage 5F Authenticated Negatives

on:
  pull_request:
    paths:
      - "production-authorization-acceptance.html"
      - "js/productionAuthorizationAcceptance.js"
      - "js/stage5fAcceptanceAccountChooser.js"
      - "js/stage5fProductionAuthenticatedNegatives.js"
      - "scripts/validate-remote-joining-physical-acceptance.mjs"
      - "tests/contracts/stage5f-account-chooser-contracts.cjs"
      - "tests/contracts/stage5f-authenticated-negatives-contracts.cjs"
      - "tests/contracts/production-authorization-acceptance-contracts.cjs"
      - "tests/contracts/production-provider-abuse-acceptance-contracts.cjs"
      - "tests/contracts/handoff-immediate-next-task-contracts.cjs"
      - "tests/contracts/sle-handoff-packaging-contracts.cjs"
      - "tests/contracts/remote-joining-physical-acceptance-validator-contracts.cjs"
      - "tests/contracts/remote-joining-physical-acceptance-real-recorder-null-contracts.cjs"
      - "package.json"
      - "WORK_ENVIRONMENT_STATUS.json"
      - ".github/workflows/validate-stage5f-authenticated-negatives.yml"
  push:
    branches:
      - "hardening/stage5f-authenticated-negatives-2026-09-03"
      - "fix/stage5f-third-account-account-chooser-2026-09-03"
    paths:
      - "production-authorization-acceptance.html"
      - "js/productionAuthorizationAcceptance.js"
      - "js/stage5fAcceptanceAccountChooser.js"
      - "js/stage5fProductionAuthenticatedNegatives.js"
      - "scripts/validate-remote-joining-physical-acceptance.mjs"
      - "tests/contracts/stage5f-account-chooser-contracts.cjs"
      - "tests/contracts/stage5f-authenticated-negatives-contracts.cjs"
      - "tests/contracts/production-authorization-acceptance-contracts.cjs"
      - "tests/contracts/production-provider-abuse-acceptance-contracts.cjs"
      - "tests/contracts/handoff-immediate-next-task-contracts.cjs"
      - "tests/contracts/sle-handoff-packaging-contracts.cjs"
      - "tests/contracts/remote-joining-physical-acceptance-validator-contracts.cjs"
      - "tests/contracts/remote-joining-physical-acceptance-real-recorder-null-contracts.cjs"
      - "package.json"
      - "WORK_ENVIRONMENT_STATUS.json"
      - ".github/workflows/validate-stage5f-authenticated-negatives.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage5f-authenticated-negatives-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  stage5f-authenticated-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Stage 5F explicit Google account chooser contract
        run: node tests/contracts/stage5f-account-chooser-contracts.cjs
      - name: Verify Stage 5F zero-billing authenticated-negative contracts
        run: node tests/contracts/stage5f-authenticated-negatives-contracts.cjs
      - name: Verify repository contract suite remains green
        run: npm run test:contracts
