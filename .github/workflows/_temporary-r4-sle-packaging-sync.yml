name: TEMP r4 SLE packaging sync

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-sle-packaging-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
          fetch-depth: 0
      - name: Synchronize live SLE pointers without rewriting history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('tests/contracts/sle-handoff-packaging-contracts.cjs')
          text = path.read_text()
          replacements = [
            (
              'assert.equal(readiness.currentScore, 87);',
              'assert.ok(readiness.currentScore >= 87 && readiness.currentScore <= readiness.denominator, "Live fixed RJR must not regress below the provider-abuse RJR87 checkpoint or exceed its denominator.");\nconst stage5eLifecycle = readiness.evidenceHistory?.find(entry => entry.eventId === "production-stage5e-r3-provider-live-remote-joining-lifecycle");\nassert.equal(stage5eLifecycle?.score, 88, "Live RJR must preserve the evidence-only Stage 5E r3 lifecycle transition to 88.");\nassert.equal(stage5eLifecycle?.delta, 1, "Stage 5E r3 lifecycle remains one bounded capability credit.");'
            ),
            (
              'assert.equal(sourceRevision, "1.9.0-r3", "Stage 5E pairing one-paste hardening candidate runtime must be explicit.");',
              'assert.equal(sourceRevision, "1.9.0-r4", "Stage 5E stale-pointer precedence candidate runtime must be explicit.");'
            ),
            (
              'assert.equal(capsule.currentPublicationCheckpoint.rjrAfterEvidence, readiness.currentScore);',
              'assert.equal(capsule.currentPublicationCheckpoint.rjrAfterEvidence, 87, "Historical PR #176 publication checkpoint must remain RJR87.");\nassert.ok(capsule.currentPublicationCheckpoint.rjrAfterEvidence <= readiness.currentScore, "Historical publication RJR cannot exceed the live fixed ledger.");'
            )
          ]
          for old, new in replacements:
              assert old in text, f'missing SLE packaging anchor: {old}'
              text = text.replace(old, new, 1)
          path.write_text(text)

          graph_path = Path('SESSION_CONTEXT_GRAPH.json')
          graph = json.loads(graph_path.read_text())
          node = next(n for n in graph['nodes'] if n.get('id') == 'rjr1-ledger')
          assert node.get('recordedScore') == 87, 'expected stale RJR graph pointer at 87'
          node['recordedScore'] = 88
          graph['recordedAt'] = '2026-09-03T03:16:00.000Z'
          graph_path.write_text(json.dumps(graph, indent=2) + '\n')
          PY
      - name: Commit synchronized SLE packaging automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contracts/sle-handoff-packaging-contracts.cjs SESSION_CONTEXT_GRAPH.json
          git commit -m "Sync r4 SLE packaging authority"
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
