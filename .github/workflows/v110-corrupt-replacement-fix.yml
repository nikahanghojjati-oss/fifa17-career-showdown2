name: v1.1.0 Corrupt Replacement Recovery Fix

on:
  push:
    branches: [agent/v1.1.0-candidate-a-maintenance]
    paths:
      - .github/workflows/v110-corrupt-replacement-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.0-candidate-a-maintenance
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded corrupt-save replacement fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          storage = Path('js/storage.js')
          s = storage.read_text()
          anchor = '''function hasSavedShowdown(){\n'''
          helper = '''function hasStoredActiveShowdownData(){\n    return readStorageValue(STORAGE_KEY) !== null;\n}\n\n'''
          if helper not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('Could not locate hasSavedShowdown anchor')
              s = s.replace(anchor, helper + anchor, 1)
          storage.write_text(s)

          showdown = Path('js/showdown.js')
          d = showdown.read_text()
          old = '''function createShowdown(){\n    let existing = null;\n\n    if(hasSavedShowdown()){\n        existing = loadSavedShowdown();\n        const existingName = existing && existing.name ? existing.name : "your current showdown";\n        const proceed = window.confirm(\n            `Start a new showdown and replace the active save "${existingName}"? Completed showdowns already stored in Legacy will not be deleted.`\n        );\n\n        if(!proceed){\n            return;\n        }\n    }\n'''
          new = '''function createShowdown(){\n    let existing = null;\n    const hasUsableActiveSave = hasSavedShowdown();\n    const hasStoredActiveData = hasUsableActiveSave\n        || (typeof hasStoredActiveShowdownData === "function" && hasStoredActiveShowdownData());\n\n    if(hasStoredActiveData){\n        existing = hasUsableActiveSave ? loadSavedShowdown() : null;\n        const existingName = existing && existing.name ? ` "${existing.name}"` : " data currently stored in this browser";\n        const proceed = window.confirm(\n            `Start a new showdown and replace the active save${existingName}? Completed showdowns already stored in Legacy will not be deleted.`\n        );\n\n        if(!proceed){\n            return;\n        }\n    }\n'''
          if old in d:
              d = d.replace(old, new, 1)
          elif new not in d:
              raise SystemExit('Could not locate createShowdown replacement guard')
          showdown.write_text(d)

          audit = Path('tests/browser/stability-audit.cjs')
          a = audit.read_text()
          old_dialogs = '''        const dismissed = new Promise(resolve => {\n            page.once("dialog", async dialog => {\n                assert.match(dialog.message(), /replace the active save/i);\n                await dialog.dismiss();\n                resolve();\n            });\n        });\n        await page.locator("#startShowdown").click();\n        await dismissed;\n        await page.waitForFunction(() => !document.getElementById("startShowdown").disabled);\n        assert.deepEqual(await activeScreens(page), ["createShowdown"]);\n        assert.equal(await page.evaluate(key => localStorage.getItem(key), activeStorageKey), "{corrupt active");\n\n        const accepted = new Promise(resolve => {\n            page.once("dialog", async dialog => {\n                await dialog.accept();\n                resolve();\n            });\n        });\n        await page.locator("#startShowdown").click();\n        await accepted;\n'''
          new_dialogs = '''        const dismissedPromise = page.waitForEvent("dialog", { timeout: 5000 });\n        await page.locator("#startShowdown").click();\n        const dismissedDialog = await dismissedPromise;\n        assert.match(dismissedDialog.message(), /replace the active save/i);\n        await dismissedDialog.dismiss();\n        await page.waitForFunction(() => !document.getElementById("startShowdown").disabled);\n        assert.deepEqual(await activeScreens(page), ["createShowdown"]);\n        assert.equal(await page.evaluate(key => localStorage.getItem(key), activeStorageKey), "{corrupt active");\n\n        const acceptedPromise = page.waitForEvent("dialog", { timeout: 5000 });\n        await page.locator("#startShowdown").click();\n        const acceptedDialog = await acceptedPromise;\n        assert.match(acceptedDialog.message(), /replace the active save/i);\n        await acceptedDialog.accept();\n'''
          if old_dialogs in a:
              a = a.replace(old_dialogs, new_dialogs, 1)
          elif new_dialogs not in a:
              raise SystemExit('Could not locate corrupt storage dialog audit block')
          audit.write_text(a)

          hardening = Path('tests/contracts/final-release-hardening.cjs')
          h = hardening.read_text()
          if 'const storage = fs.readFileSync("js/storage.js", "utf8");' not in h:
              h = h.replace(
                  'const footballAudit = fs.readFileSync("tests/browser/football-visual-audit.cjs", "utf8");\n',
                  'const footballAudit = fs.readFileSync("tests/browser/football-visual-audit.cjs", "utf8");\nconst storage = fs.readFileSync("js/storage.js", "utf8");\nconst showdown = fs.readFileSync("js/showdown.js", "utf8");\nconst stabilityAudit = fs.readFileSync("tests/browser/stability-audit.cjs", "utf8");\n'
              )
              h += '''\nassert.ok(storage.includes("function hasStoredActiveShowdownData()"), "Raw active-slot occupancy must remain separately detectable from valid Continue state.");\nassert.ok(showdown.includes("const hasStoredActiveData = hasUsableActiveSave"), "New Showdown must distinguish valid active saves from occupied corrupt raw data.");\nassert.ok(showdown.includes("replace the active save${existingName}"), "Destructive active-slot replacement must remain confirmation-gated.");\nassert.ok(stabilityAudit.includes('page.waitForEvent("dialog", { timeout: 5000 })'), "Corrupt-save replacement regression must fail fast instead of hanging CI.");\nconsole.log("Corrupt active-slot replacement protection is permanently gated.");\n'''
          hardening.write_text(h)

          handoff = Path('CAREER_MODE_SHOWDOWN_MASTER_DEVELOPMENT_CONTINUATION_V1.1.0_CANDIDATE_A.md')
          text = handoff.read_text()
          marker = '## Five-pass burn-in attempt 1 — rejected proof'
          if marker not in text:
              with handoff.open('a') as f:
                  f.write('''\n\n## Five-pass burn-in attempt 1 — rejected proof\n\n- Candidate SHA: `22ed7a4cbd752a44fcddf2fc399d7cc5185278a8`.\n- Burn-in workflow run: `31518433196`. Five independent jobs were launched, but the attempt is **not counted** toward release proof.\n- Pass 1 log showed static/contracts, runtime provenance, Home/Reus visual, licensed football visual, and Candidate A backup/export all passing before the complete-journey audit stopped after `Corrupt Legacy fallback accessibility scan`.\n- The jobs then hit the 32-minute workflow timeout; this was deterministic across the five runners.\n- Root cause: `hasSavedShowdown()` correctly changed to reject corrupt JSON for Continue Career, but `createShowdown()` also used that valid-save predicate as its destructive replacement predicate. Corrupt raw active-save bytes therefore no longer triggered the existing replacement confirmation. The browser fixture waited for that confirmation indefinitely.\n- Product correction: valid parsed data continues to control **Continue Career**, while a separate raw-slot occupancy check now controls whether **New Showdown** must confirm before overwriting the active storage slot. This preserves recoverable corrupt bytes until the user explicitly approves replacement.\n- Gate correction: corrupt-save dialog expectations now use a 5-second Playwright dialog timeout so a future regression fails fast instead of burning an entire runner timeout.\n- Release policy: the five-pass count resets to **0/5** after this fix. Only a new SHA with five successful independent passes may be merged.\n''')
          PY
          node --check js/storage.js
          node --check js/showdown.js
          node --check tests/browser/stability-audit.cjs
          node --check tests/contracts/final-release-hardening.cjs
          npm ci
          npm run test:contracts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/storage.js js/showdown.js tests/browser/stability-audit.cjs tests/contracts/final-release-hardening.cjs CAREER_MODE_SHOWDOWN_MASTER_DEVELOPMENT_CONTINUATION_V1.1.0_CANDIDATE_A.md
          git commit -m 'Protect corrupt active data from unconfirmed replacement'
          git push origin HEAD:agent/v1.1.0-candidate-a-maintenance
