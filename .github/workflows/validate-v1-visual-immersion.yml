name: Validate V1 Visual Immersion

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  visual-immersion-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install locked visual dependencies
        run: npm ci

      - name: Validate startup, Home, and standalone composition
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');

          const html = fs.readFileSync('index.html', 'utf8');
          const css = fs.readFileSync('css/app.css', 'utf8');
          const visualCss = fs.readFileSync('css/visual-fidelity-r3.css', 'utf8');
          const offlineCss = fs.readFileSync('css/offline.css', 'utf8');
          const app = fs.readFileSync('js/app.js', 'utf8');
          const menu = fs.readFileSync('js/menuExperience.js', 'utf8');
          const notices = fs.readFileSync('THIRD_PARTY_NOTICES.md', 'utf8');
          const portraitPath = 'assets/marco-reus-2015-cc-by.webp';
          const portrait = fs.readFileSync(portraitPath);
          const appVersion = (app.match(/const APP_VERSION = "([^"]+)"/) || [])[1];
          const revision = (html.match(/app-asset-revision"\s+content="([^"]+)/) || [])[1];

          assert.ok(appVersion, 'APP_VERSION is missing.');
          assert.match(revision, new RegExp(`^${appVersion.replace(/\./g, '\\.')}\\-r[1-9]\\d*$`), 'The visual release cache identity must be a numbered revision for APP_VERSION.');
          assert.ok(
            html.includes(`v${appVersion} · Product Deepening`)
              || html.includes(`v${appVersion} · Private Connected Account Foundation`)
              || html.includes(`v${appVersion} · Registered Devices & Private Pairing`)
              || html.includes(`v${appVersion} · Connected Rivalry`)
              || html.includes(`v${appVersion} · Private Remote Joining`),
            'The user-facing release identity is missing or not approved for this release family.'
          );
          assert.ok(app.includes(`const APP_VERSION = "${appVersion}"`), 'The application version declaration is inconsistent.');
          assert.ok(html.includes('id="loadingScreen" role="status" aria-live="polite" aria-busy="true"'), 'Startup status semantics are missing.');
          assert.ok(html.includes(`src="${portraitPath}?v=${revision}"`), 'Startup portrait is missing or stale.');
          assert.ok(menu.includes(`thumbnail: "${portraitPath}?v=${revision}"`), 'Home must reuse the same portrait cache entry.');
          assert.strictEqual(portrait.subarray(0, 4).toString('ascii'), 'RIFF', 'Portrait is not a valid RIFF WebP container.');
          assert.strictEqual(portrait.subarray(8, 12).toString('ascii'), 'WEBP', 'Portrait is not WebP.');
          assert.ok(portrait.length <= 95000, `Portrait exceeds 95 KB (${portrait.length}).`);

          assert.ok(notices.includes('Marco Reus (16204330530) (cropped).jpg'), 'Portrait source file is not recorded.');
          assert.ok(notices.includes('Tim Reckmann') && notices.includes('CC BY 2.0'), 'Portrait author/license attribution is incomplete.');
          assert.ok(notices.includes('900 × 1520') && notices.includes('WebP'), 'The local image transformation is not disclosed.');

          assert.ok(css.includes('--safe-width:1510px'), 'Chromebook Home canvas width regressed.');
          assert.ok(css.includes('grid-template-rows:repeat(2,minmax(132px,1fr)) minmax(118px,auto)'), 'Desktop tile proportions regressed.');
          assert.ok(css.includes('.menuTileNew') && css.includes('var(--f17-metal-light)'), 'Metallic Home treatment is incomplete.');
          assert.ok(css.includes('@media(min-width:901px) and (max-height:800px)'), 'Low-height Chromebook treatment is missing.');
          assert.ok(css.includes('@media(max-width:900px)') && css.includes('@media(max-width:700px)') && css.includes('@media(max-width:480px)'), 'Tablet/mobile layout tiers are incomplete.');
          assert.ok(css.includes('.startupAthleteFrame') && css.includes('.startupIdentity') && css.includes('.startupStatus'), 'Startup composition is incomplete.');
          assert.ok(css.includes('html[data-motion-reduced="true"] *') && css.includes('@media(prefers-reduced-motion:reduce)'), 'Startup and Home motion need both preference guards.');

          assert.ok(app.includes(`css/visual-fidelity-r3.css?v=${revision}`), 'The bounded Reus visual fidelity layer is not aligned with the current runtime revision.');
          assert.ok(visualCss.includes('.menuTilePrimary:disabled') && visualCss.includes('opacity:1') && visualCss.includes('filter:none'), 'Disabled Home state must not dim the Reus hero tile.');
          assert.ok(visualCss.includes('#startupAthlete') && visualCss.includes('object-fit:contain'), 'Base startup Reus portrait must retain contained desktop composition.');
          assert.ok(visualCss.includes('.startupAthleteFrame') && visualCss.includes('inset:0 auto 0 0'), 'Desktop startup portrait frame must remain inside the viewport.');
          assert.ok(visualCss.includes('.menuCoverAthlete.imageLoaded img') && visualCss.includes('opacity:1!important'), 'Loaded Home Reus portrait must render at guaranteed full opacity.');
          assert.ok(visualCss.includes('clip-path:none'), 'Desktop Reus must use a clean rectangular photo anchor without the rejected head/neck clipping edge.');
          assert.ok(visualCss.includes('.menuCoverNumber') && visualCss.includes('display:none'), 'Desktop Reus clean-anchor mode must suppress the competing jersey-number overlay.');
          assert.ok(visualCss.includes('.menuCoverAthlete::after') && visualCss.includes('height:34%') && visualCss.includes('rgba(66,185,218,.28)'), 'Home Reus must keep the bounded owner-requested lower-body accent rail.');
          assert.ok(visualCss.includes('mix-blend-mode:normal') && visualCss.includes('image-rendering:auto'), 'Home Reus must preserve natural photographic compositing/resampling.');
          assert.ok(visualCss.includes('@media(max-width:700px)') && visualCss.includes('filter:saturate(1.035) contrast(1.065) brightness(1.005)'), 'Owner-accepted mobile Home Reus treatment must remain explicit.');
          assert.ok(!visualCss.includes('rgba(229,237,239,.92)'), 'The old 92% white Reus wash must not return.');

          assert.ok(offlineCss.includes('--startup-mobile-top-band:clamp(46px,12vw,54px)'), 'Standalone loading top band must stay width-owned and bounded.');
          assert.ok(offlineCss.includes('height:calc(100% - var(--startup-mobile-top-band))'), 'Standalone loading art must have its own stable image box.');
          assert.ok(offlineCss.includes('object-fit:cover') && offlineCss.includes('object-position:54% 50%'), 'Standalone mobile Reus must retain the subject-safe crop.');
          assert.ok(!/\b100(?:d|s|l)?vh\b/i.test(offlineCss), 'Loading art must not stretch from raw viewport-height units.');

          const normalDuration = Number((app.match(/STARTUP_SPLASH_MINIMUM_MS\s*=\s*(\d+)/) || [])[1]);
          const reducedDuration = Number((app.match(/STARTUP_SPLASH_REDUCED_MS\s*=\s*(\d+)/) || [])[1]);
          const exitDuration = Number((app.match(/STARTUP_SPLASH_EXIT_MS\s*=\s*(\d+)/) || [])[1]);
          assert.ok(normalDuration >= 2600 && normalDuration <= 3000, 'Normal startup presentation must preserve the deliberate 2.7 second immersion hold while remaining finite.');
          assert.ok(reducedDuration >= 0 && reducedDuration <= 300, 'Reduced-motion startup must remain brief.');
          assert.ok(exitDuration >= 0 && exitDuration <= 300, 'Startup exit must remain bounded.');
          assert.ok(app.includes('app.inert = true') && app.includes('app.inert = false'), 'The covered application is not interaction-isolated.');
          assert.ok(app.includes('loadingScreen.setAttribute("aria-hidden", "true")'), 'Startup must leave the accessibility tree before fading.');
          assert.ok(!/new\s+Audio\s*\(|autoplay/i.test(app), 'Startup must remain silent and cosmetic.');

          const localShell = [...html.matchAll(/(?:src|href)="((?:js|css)\/[^"?#]+)(?:\?v=([^"#]+))?"/g)];
          assert.strictEqual(localShell.filter(match => match[1].startsWith('css/')).length, 1, 'Visual immersion added an eager stylesheet.');
          assert.strictEqual(localShell.filter(match => match[1].startsWith('js/')).length, 7, 'Visual immersion added an eager script.');
          assert.deepStrictEqual(localShell.filter(match => match[2] !== revision), [], 'Visual candidate contains mixed shell revisions.');

          console.log(`V1 startup/Home contracts passed for ${revision}: ${portrait.length} portrait bytes, bounded standalone composition, 2.7 s normal hold, preserved Home treatment, and responsive tiers.`);
          NODE

          npm run serve:test > /tmp/cms-loading-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_CHROMIUM_MULTI_CONTEXT=1 CMS_AUDIT_RUN="visual-immersion" npm run test:loading-visual

      - name: Upload loading visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loading-visual-${{ github.run_id }}
          path: test-results/loading-*.png
          if-no-files-found: error
          retention-days: 14