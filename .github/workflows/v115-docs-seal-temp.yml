## 2. What v1.1.5 fixed

Major bug 1 — confirmed intent race.

The previous Apply flow could confirm one restore plan but consume later file/choice mutations while asynchronous fresh verification was in progress. v1.1.5 freezes the exact confirmed File, deep-copied choices and reviewed raw precondition before the first await, locks the restore decision surface, generation-binds async review and commits only the confirmed values.

