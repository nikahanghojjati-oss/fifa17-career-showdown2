          def replace_between(path, start_marker, end_marker, replacement):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f"Markers not found in {path}: {start_marker!r} / {end_marker!r}")
              p.write_text(text[:start] + replacement.rstrip() + "\n\n" + text[end:], encoding="utf-8")

