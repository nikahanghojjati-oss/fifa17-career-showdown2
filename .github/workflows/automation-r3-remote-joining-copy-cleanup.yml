name: One-time R3 Remote Joining Copy Cleanup

on:
  push:
    branches:
      - fix/pairing-copy-four-code-contract-2026-09-02

permissions:
  contents: write

jobs:
  cleanup-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pairing-copy-four-code-contract-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Correct stale Stage 5E copy and add permanent regression guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          account=Path('js/sparkConnectedAccount.js')
          text=account.read_text()
          old='Private account is ready. Private pairing and Connected Rivalry are available below when their requirements are met. Remote Joining sessions remain locked.'
          new='Private account is ready. Private pairing and Connected Rivalry are available below when their requirements are met. Private Remote Joining is available from Showdown Home after its account, registered-device, and Connected Rivalry requirements are satisfied.'
          assert text.count(old)==1, 'connected-account stale ready message missing or duplicated'
          text=text.replace(old,new,1)
          old='["REMOTE JOINING","Locked · Stage 5 sessions not enabled"]'
          new='["REMOTE JOINING","Available from Showdown Home · private requirements apply"]'
          assert text.count(old)==1, 'connected-account stale info row missing or duplicated'
          account.write_text(text.replace(old,new,1))

          rivalry=Path('js/sparkConnectedRivalry.js')
          text=rivalry.read_text()
          old='Refresh and preview are read-only. Local gameplay changes only after exact confirmation, a verified backup and Candidate C Apply. Remote Joining sessions remain locked.'
          new='Refresh and preview are read-only. Local gameplay changes only after exact confirmation, a verified backup and Candidate C Apply. Private Remote Joining is available from Showdown Home after this rivalry and registered-device requirements are satisfied.'
          assert text.count(old)==1, 'connected-rivalry stale heading copy missing or duplicated'
          text=text.replace(old,new,1)
          old='["REMOTE JOINING","Stage 5 · still locked"]'
          new='["REMOTE JOINING","Available from Showdown Home · exact private session"]'
          assert text.count(old)==1, 'connected-rivalry stale info row missing or duplicated'
          rivalry.write_text(text.replace(old,new,1))

          test=Path('tests/contracts/stage5e-remote-joining-copy-contracts.cjs')
          test.write_text('''const A = require("node:assert/strict");\nconst fs = require("node:fs");\nconst read = path => fs.readFileSync(path,"utf8");\n\nconst account = read("js/sparkConnectedAccount.js");\nconst rivalry = read("js/sparkConnectedRivalry.js");\nconst remoteJoining = read("js/sparkRemoteJoining.js");\n\nfor(const stale of [\n  "Remote Joining sessions remain locked.",\n  "Locked · Stage 5 sessions not enabled",\n  "Stage 5 · still locked"\n]){\n  A.ok(!account.includes(stale), `Connected Account reintroduced stale Remote Joining copy: ${stale}`);\n  A.ok(!rivalry.includes(stale), `Connected Rivalry reintroduced stale Remote Joining copy: ${stale}`);\n}\n\nA.match(account,/Private Remote Joining is available from Showdown Home after its account, registered-device, and Connected Rivalry requirements are satisfied\./);\nA.ok(account.includes('["REMOTE JOINING","Available from Showdown Home · private requirements apply"]'));\nA.match(rivalry,/Private Remote Joining is available from Showdown Home after this rivalry and registered-device requirements are satisfied\./);\nA.ok(rivalry.includes('["REMOTE JOINING","Available from Showdown Home · exact private session"]'));\n\n// Copy repair must not broaden authority. Connected Rivalry still does not own session\n// mutations; Stage 5E retains that separate, exact-capability runtime boundary.\nA.ok(account.includes('firestorePersistence:"memory-only"'));\nA.ok(account.includes('billingRequired:false'));\nA.ok(rivalry.includes('publicDiscovery:false'));\nA.ok(rivalry.includes('automaticLocalApply:false'));\nA.ok(rivalry.includes('localApplyAuthority:"candidate-c-explicit-confirmed-only"'));\nA.ok(rivalry.includes('remoteJoiningSessions:false'));\nA.ok(rivalry.includes('billingRequired:false'));\nA.ok(remoteJoining.includes('billingRequired:false'));\nA.ok(remoteJoining.includes('publicDiscovery:false'));\n\nprocess.stdout.write("PASS Stage 5E Remote Joining copy truth: live Home availability is visible without broadening Connected Rivalry, billing, discovery or Candidate C authority\\n");\n''')

          suite=Path('tests/support/run-contract-suite.cjs')
          text=suite.read_text()
          marker='  "tests/contracts/stage5e-production-remote-joining-runtime-contracts.cjs",\n'
          assert marker in text, 'Stage 5E runtime suite marker missing'
          entry='  "tests/contracts/stage5e-remote-joining-copy-contracts.cjs",\n'
          if entry not in text:
              suite.write_text(text.replace(marker,marker+entry,1))
          PY
      - run: npm ci
      - name: Targeted copy and runtime proof
        run: |
          node --check js/sparkConnectedAccount.js
          node --check js/sparkConnectedRivalry.js
          node tests/contracts/stage5e-production-remote-joining-runtime-contracts.cjs
          node tests/contracts/stage5e-remote-joining-copy-contracts.cjs
          node tests/contracts/stage4-connected-rivalry-pointer-restore-contracts.cjs
      - name: Full repository contract gate
        run: npm run test:contracts
      - name: Commit validated copy repair
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Correct Stage 5E Remote Joining availability copy"
          git push origin HEAD:fix/pairing-copy-four-code-contract-2026-09-02
