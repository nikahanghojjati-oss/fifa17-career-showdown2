name: v1.1.2 Final Documentation Alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v112-final-doc-alignment
  cancel-in-progress: false

jobs:
  align:
    if: ${{ !contains(github.event.head_commit.message, '[v112-doc-aligned]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Align current-state bootstrap documents
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected current-state text not found: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              '00_DEVELOPER_START_HERE.md',
              'Candidate A backup/export is complete, deployed and protected. Candidate B — Import Analysis + Migration Preview — is the current substantive Data Safety and Recovery build. Candidate C restore remains blocked.\n\nCandidate B is preview-only: local backup file size, JSON, format, checksum, schemas, historical migrations and ID conflicts are analyzed in memory with zero canonical localStorage writes/removals. The existing Legacy/Data Management surface remains the UI owner and the feature stays lazy so startup budgets remain protected.\n\nThe owner-mandated `00_HANDOFF_GOLDEN_RULE.md` is permanent operating policy: every meaningful action/failure/decision/gate/merge/deployment state must be recorded continuously in the active public handoff.\n\nAfter Candidate B is merged/deployed/proven, Candidate C — Atomic Restore + Recovery UX — becomes the next legal v1.1.x step. v1.2.0 remains reserved for Installable Offline App.',
              'Candidate A backup/export and Candidate B — Import Analysis + Migration Preview — are complete, merged, deployed and protected. Candidate C — Atomic Restore + Recovery UX — is now the next legal substantive Data Safety and Recovery build.\n\nCandidate B remains a preview-only protected dependency: local backup size, JSON, format, checksum, schemas, historical migrations and ID conflicts are analyzed in memory with zero canonical localStorage writes/removals. Candidate C is the first stage allowed to commit imported canonical state and must revalidate Candidate B analysis before apply.\n\nThe owner-mandated `00_HANDOFF_GOLDEN_RULE.md` is permanent operating policy: every meaningful action/failure/decision/gate/merge/deployment state must be recorded continuously in the active public handoff.\n\nThe v1.1.2 runtime authority is `6dfea100829016eee4820b342729b8c823426f95`. v1.2.0 remains reserved for Installable Offline App after Candidate C closes v1.1 Data Safety and Recovery.'
          )
          replace_once('00_DEVELOPER_START_HERE.md', '2. Read this file completely.\n3. Read `NEXT_TASK.md` completely.\n4. Read the Current milestone', '3. Read this file completely.\n4. Read `NEXT_TASK.md` completely.\n5. Read the Current milestone')
          replace_once('00_DEVELOPER_START_HERE.md', '5. Inspect the live source files named by the active task before changing anything.\n6. Use deeper handoff/chronology files only when history or source authority is ambiguous.\n7. Do not ask the owner to repeat decisions already recorded here unless new evidence is genuinely required.\n8. For runtime work, create a focused branch from current `main`.\n9. Keep the owner informed during long development work.\n10. Record every meaningful decision, failure, correction, merge, deployment, and owner-acceptance state in the current handoff.', '6. Inspect the live source files named by the active task before changing anything.\n7. Use deeper handoff/chronology files only when history or source authority is ambiguous.\n8. Do not ask the owner to repeat decisions already recorded here unless new evidence is genuinely required.\n9. For runtime work, create a focused branch from current `main`.\n10. Keep the owner informed during long development work.\n11. Record every meaningful decision, failure, correction, merge, deployment, and owner-acceptance state in the current handoff.')

          replace_once('PROJECT_STATE.md', '**Current milestone:** v1.1.2 — Candidate B Import Analysis + Migration Preview', '**Current milestone:** v1.1.2 — Candidate B complete; Candidate C Atomic Restore + Recovery UX next')
          replace_once('PROJECT_STATE.md', '**Current activity:** analyze local backup files read-only with checksum/schema/migration/conflict preview and zero canonical storage writes', '**Current activity:** Candidate B is merged/deployed/proven; next runtime work is Candidate C atomic restore with exact raw snapshots, explicit choices, storage-authority writes and verified rollback')
          replace_once('PROJECT_STATE.md', '**Previous production runtime:** v1.1.0 / `1.1.0-r1`, fully sealed before this maintenance branch', '**Current runtime authority:** v1.1.2 / `1.1.2-r1` at merge `6dfea100829016eee4820b342729b8c823426f95`')
          replace_once('PROJECT_STATE.md', '**Next roadmap candidate after Candidate B production proof:** Candidate C — Atomic Restore + Recovery UX', '**Next roadmap candidate:** Candidate C — Atomic Restore + Recovery UX')
          replace_once('PROJECT_STATE.md', 'Candidate C remains the first stage allowed to write imported state and stays blocked behind Candidate B release evidence.', 'Candidate B release evidence is complete. Candidate C is now the first legal stage allowed to write imported state and must preserve Candidate B as the read-only analysis boundary.')

          replace_once('README.md', '**Current phase:** Candidate B — read-only Import Analysis + Migration Preview; Candidate A remains protected and Candidate C restore remains blocked', '**Current phase:** Candidate B is complete/deployed/protected; Candidate C — Atomic Restore + Recovery UX — is next')
          replace_once('README.md', '**Next roadmap candidate after Candidate B production proof:** Candidate C — Atomic Restore + Recovery UX', '**Next roadmap candidate:** Candidate C — Atomic Restore + Recovery UX')
          replace_once(
              'README.md',
              'The original release path **v0.95 → v1.0** and the finite v1.0.2 clean-anchor maintenance lane are complete. v1.1.0 Candidate A is also merged, deployed and technically proven. The current clean-stability seal exists to reproduce that production state against every permanent feature/workstream/release gate before further roadmap work. The owner-liked loading screen and clean player-anchor architecture remain protected; owner real-device art-direction acceptance remains separate from automated proof.',
              'The original release path **v0.95 → v1.0**, the finite v1.0.2 clean-anchor maintenance lane, v1.1.0 Candidate A and v1.1.2 Candidate B are complete and deployed. Candidate B passed the full permanent matrix twice before merge and twice again on the exact production runtime, including public Pages import analysis and the complete deployed journey. Candidate C atomic restore is now the next legal v1.1.x build. The owner-liked loading screen and clean player-anchor architecture remain protected.'
          )
          replace_once('README.md', 'The feature performs zero canonical localStorage writes/removals and exposes no restore/apply action. Candidate C remains the only future stage allowed to commit imported data.', 'The feature performs zero canonical localStorage writes/removals and exposes no restore/apply action. Candidate C is now the next stage and remains the first legal stage allowed to commit imported data.')
          replace_once('README.md', 'See `RELEASE_V1.1.2.md` and `CAREER_MODE_SHOWDOWN_V1.1.2_CANDIDATE_B_HANDOFF.md`.', 'See `RELEASE_V1.1.2.md` and `CAREER_MODE_SHOWDOWN_V1.1.2_POST_MERGE.md` for final production evidence.')
          PY
      - name: Prove docs retain current release identity and next-task direction
        shell: bash
        run: |
          set -euo pipefail
          grep -q '1.1.2-r1' 00_DEVELOPER_START_HERE.md
          grep -q '1.1.2-r1' PROJECT_STATE.md
          grep -q '1.1.2-r1' README.md
          grep -q 'Candidate C' 00_DEVELOPER_START_HERE.md
          grep -q 'Candidate C' PROJECT_STATE.md
          grep -q 'Candidate C' README.md
          git diff --check
      - name: Commit documentation-only alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_DEVELOPER_START_HERE.md PROJECT_STATE.md README.md
          git commit -m 'Align v1.1.2 completion and Candidate C next [v112-doc-aligned]'
          git push origin HEAD:main
