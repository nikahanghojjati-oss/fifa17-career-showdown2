name: Candidate B File UI Cleanup

on:
  push:
    branches: [agent/v1.1.2-candidate-b-import-analysis]

permissions:
  contents: write

concurrency:
  group: candidate-b-file-ui-cleanup
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-b-file-ui-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.2-candidate-b-import-analysis
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply cleanup
        run: python tools/apply_candidate_b_file_input_cleanup.py
      - name: Run Candidate B deterministic contracts
        run: npm run test:import-contracts
      - name: Run Candidate A and Candidate B Data Management browser evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-candidate-b-ui.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN=file-ui npm run test:backup-browser
          CMS_AUDIT_RUN=file-ui npm run test:import-browser
      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_candidate_b_file_input_cleanup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/legacy.css tests/browser/import-analysis-audit.cjs tools/apply_candidate_b_file_input_cleanup.py
          git diff --cached --check
          git commit -m 'Polish Candidate B visible file selection [candidate-b-file-ui-cleanup]'
          git push origin HEAD:agent/v1.1.2-candidate-b-import-analysis
      - name: Upload Data Management screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-b-file-ui-${{ github.run_id }}
          path: |
            test-results/backup-data-management-*.png
            test-results/candidate-b-import-*.png
          if-no-files-found: error
          retention-days: 14
