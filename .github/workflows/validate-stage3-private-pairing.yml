name: Validate Stage 3 Private Pairing

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3-private-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned Firebase emulator test dependencies
        run: npm install --no-save --package-lock=false firebase@12.17.1 @firebase/rules-unit-testing@5.0.1 firebase-admin@14.2.0

      - name: Run deterministic Stage 3 client contracts
        run: node tests/contracts/stage3-private-pairing-contracts.cjs

      - name: Prove desktop and mobile IndexedDB identity behavior
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-stage3-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/browser/stage3-private-pairing-audit.cjs
          node tests/browser/stage5b-device-credential-audit.cjs

      - name: Prove explicit Stage 4 remote-to-local reconciliation in browser
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-stage4-reconciliation-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN="stage4-canonical" node tests/browser/stage4-remote-local-reconciliation-audit.cjs

      - name: Upload Stage 4 reconciliation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-remote-local-reconciliation
          path: |
            test-results/stage4-remote-local-preview-*.png
            test-results/stage4-remote-local-committed-*.png
          if-no-files-found: error

      - name: Run Stage 3 Firestore Rules emulator proof
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-stage3 "node tests/firebase/stage3-private-pairing-emulator.cjs"

      - name: Run deterministic Stage 4 Connected Rivalry contracts
        run: |
          node tests/contracts/stage4-connected-rivalry-contracts.cjs
          node tests/contracts/stage4-adverse-network-contracts.cjs
          node tests/contracts/stage4-abuse-hardening-contracts.cjs
          node tests/contracts/stage4-mutation-rate-limit-contracts.cjs
          node tests/contracts/stage4-remote-local-reconciliation-contracts.cjs

      - name: Run Stage 4 Connected Rivalry Firestore Rules emulator proof
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-stage4 "node tests/firebase/stage4-connected-rivalry-emulator.cjs && node tests/firebase/stage4-idempotency-replay-emulator.cjs && node tests/firebase/stage4-abuse-hardening-emulator.cjs && node tests/firebase/stage4-mutation-rate-limit-emulator.cjs"

      - name: Run deterministic Stage 5 candidate contracts
        run: node tests/contracts/stage5a-private-session-contracts.cjs && node tests/contracts/stage5b-device-credential-contracts.cjs && node tests/contracts/stage5c-zero-billing-standard-auth-session-contracts.cjs

      - name: Run Stage 5A, Stage 5B, and Stage 5C Firebase emulator proofs
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-stage5a "node tests/firebase/stage5a-private-session-emulator.cjs" && npx --yes firebase-tools@15.28.1 emulators:exec --only auth,firestore --project demo-career-mode-showdown-stage5b "node tests/firebase/stage5b-device-credential-emulator.cjs" && npx --yes firebase-tools@15.28.1 emulators:exec --only auth,firestore --project demo-career-mode-showdown-stage5c "node tests/firebase/stage5c-zero-billing-standard-auth-session-emulator.cjs"
