name: One-time Pairing R3 Core Seal V3

on:
  push:
    branches:
      - fix/pairing-copy-four-code-contract-2026-09-02

permissions:
  contents: write

jobs:
  core-seal-v3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pairing-copy-four-code-contract-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply exact r3 runtime and hardened audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          wf=Path('.github/workflows/automation-pairing-r3-hardening-v2.yml').read_text()
          marker="          python - <<'PY'\n"
          start=wf.index(marker)+len(marker)
          end=wf.index("\n          PY\n",start)
          exec(compile(textwrap.dedent(wf[start:end]),'r3-payload','exec'),{})

          p=Path('js/sparkPrivatePairing.js'); s=p.read_text()
          old='''  async function registerCurrentDevice(){\n    setState({status:"registering",busy:true,message:"Registering this browser privately…"});\n    try{\n'''
          new='''  async function registerCurrentDevice(){\n    const preservePairingStateAtStart=["creating-pair","joining-pair","pair-open","paired"].includes(pairingState.status);\n    if(!preservePairingStateAtStart)setState({status:"registering",busy:true,message:"Registering this browser privately…"});\n    try{\n'''
          assert old in s; s=s.replace(old,new,1)
          old='''      const preservePairingState=["creating-pair","joining-pair","pair-open","paired"].includes(pairingState.status);\n      if(preservePairingState)return setState({initialized:true,connected:true,registered:true,accountId:context.accountState.accountId,deviceId:context.identity.deviceId});\n'''
          new='''      const preservePairingState=preservePairingStateAtStart||["creating-pair","joining-pair","pair-open","paired"].includes(pairingState.status);\n      if(preservePairingState)return setState({initialized:true,connected:true,registered:true,accountId:context.accountState.accountId,deviceId:context.identity.deviceId});\n'''
          assert old in s; p.write_text(s.replace(old,new,1))

          q=Path('tests/browser/pairing-four-code-automation-audit.cjs'); t=q.read_text()
          old='''  await page.setContent('<div id="settingsOverlay"><div id="settingsContent"></div></div>');\n'''
          new='''  await page.setContent('<div id="settingsOverlay" class="settingsOverlay"><div class="settingsDialog"><header class="settingsHeader"><div class="settingsHeading"><span class="settingsEyebrow">SAVE LIBRARY</span><h2>SETTINGS</h2></div></header><div id="settingsContent" class="settingsContent"></div><footer class="settingsFooter"></footer></div></div>');\n  await page.addStyleTag({url:new URL("css/app.css",baseUrl).href});\n  await page.addStyleTag({url:new URL("css/settings.css",baseUrl).href});\n'''
          assert old in t; t=t.replace(old,new,1)
          old='''    await copyButton.click();\n    const copied=await page.evaluate(()=>navigator.clipboard.readText());\n'''
          new='''    await copyButton.scrollIntoViewIfNeeded();\n    await copyButton.click({timeout:5000});\n    const copied=await page.evaluate(()=>navigator.clipboard.readText());\n'''
          assert old in t; t=t.replace(old,new,1)
          tail='''\n(async()=>{\n  const runtime=await resolveChromiumRuntime();\n  const iterations=3;\n  for(let iteration=0;iteration<iterations;iteration+=1){\n    for(const scenario of [provePlayerOne,provePlayerTwo]){\n      const browser=await chromium.launch({executablePath:runtime.executablePath,headless:true,args:runtime.args});\n      try{await scenario(browser,iteration);}\n      finally{await browser.close().catch(()=>{});}\n    }\n  }\n  process.stdout.write(`PASS pairing automation Chromium ultra-audit: ${iterations} fresh Player One and ${iterations} fresh Player Two isolated Chromium processes, exact copy, late-registration state preservation, P1 prefill/postjoin auto-attach, one-paste retained P2 input, and exact Connected Rivalry equality\\n`);\n})().catch(error=>{console.error("PAIRING FOUR-CODE AUTOMATION BROWSER AUDIT FAILED");console.error(error.stack||error);process.exit(1);});\n'''
          cut=t.index('\n(async()=>{')
          q.write_text(t[:cut]+tail)

          state=Path('PROJECT_STATE.md')
          current=state.read_text()
          override='''## CURRENT OVERRIDE — V1.9.0-R3 PAIRING ONE-PASTE HARDENING — 2026-09-02 UTC\n\nRELEASE CANDIDATE — NOT YET PRODUCTION-PROVEN. Current bounded candidate is `v1.9.0 / 1.9.0-r3`; production-proven baseline remains `v1.9.0 / 1.9.0-r2` until exact-head CI/review/merge/Pages/deployed-byte gates complete. Fixed RJR-1 remains `87/100`; source, CI, review, merge and deployment earn zero RJR credit.\n\nThe r3 lane hardens the first owner Remote Joining setup path before repeating production acceptance. Player One receives a direct `COPY PAIRING CODE`; Player Two pastes exactly once; the joined capability remains read-only after success; all four pairing/Connected-Rivalry code surfaces must be byte-for-byte equal; Player One and Player Two auto-link into Connected Rivalry without normal-flow Verify/Reattach. A late registered-device completion can refresh registration metadata but cannot overwrite an in-flight/open/paired pairing state.\n\nPermanent zero-billing and authority locks are unchanged: Firebase Spark only, billing permanently forbidden, Firestore memory-only, App Check enforcement OFF, no public discovery/listing/lobby/matchmaking, exactly three canonical localStorage keys, no Remote Joining mutation of canonical saves, and Candidate C remains sole destructive remote-to-local gameplay Apply authority.\n\n## IMMEDIATE NEXT TASK AFTER FULL STUDY\n\nFinish r3 on one unchanged exact head: all permanent contracts/workflows, final-head review, zero unresolved valid threads, clean mergeability, expected-head merge, post-merge/Pages success and exact deployed `v1.9.0 / 1.9.0-r3` byte/runtime verification. Only then reopen the owner production test gate: Player One creates/copies once, Player Two pastes once and joins, both automatically hold the same Connected Rivalry, then complete private Remote Joining Host → Join → Read/Refresh → Close with the live session capability never pasted into chat. Recalculate RJR only from genuine newly verified production capability evidence.\n\n---\n\n'''
          if not current.startswith('## CURRENT OVERRIDE — V1.9.0-R3 PAIRING ONE-PASTE HARDENING'):
              state.write_text(override+current)

          next_path=Path('NEXT_TASK.md')
          current=next_path.read_text()
          next_override='''# CURRENT OVERRIDE — V1.9.0-R3 PAIRING ONE-PASTE HARDENING — 2026-09-02 UTC\n\nAuthorized release candidate: `v1.9.0 / 1.9.0-r3`. Production-proven baseline remains `v1.9.0 / 1.9.0-r2` until publication/deployment gates close. Fixed RJR-1 remains `87/100`.\n\nThe owner test is intentionally paused until r3 is production-live. The normal flow must require only one Player One Copy and one Player Two paste; exact pairing identity must auto-propagate to both Connected Rivalry contexts; no normal-flow Verify/Reattach is allowed; late device-registration completion must not clobber live pairing state.\n\n## IMMEDIATE NEXT TASK AFTER FULL STUDY\n\n1. Complete all r3 deterministic/browser/full-contract gates on one exact branch head.\n2. Correct any stale Remote Joining `locked` wording that contradicts the live Stage 5E runtime without changing authority.\n3. Publish a bounded PR, require all permanent CI and final-head review, resolve every valid thread, and merge only the reviewed exact head.\n4. Verify post-merge workflows, Pages exact merge SHA and deployed `v1.9.0 / 1.9.0-r3` bytes.\n5. Only after production proof ask the owner to perform the one-copy/one-paste pairing plus Host → Join → Read/Refresh → Close acceptance. Never request a full `session_...` capability in chat.\n6. Recalculate RJR only from genuine owner production capability evidence.\n\nBilling remains permanently forbidden. Firebase stays Spark, Firestore memory-only and App Check enforcement OFF. No public discovery/listing/matchmaking, canonical-save mutation or Candidate C bypass is authorized.\n\n---\n\n'''
          if not current.startswith('# CURRENT OVERRIDE — V1.9.0-R3 PAIRING ONE-PASTE HARDENING'):
              next_path.write_text(next_override+current)
          PY
          cat > RELEASE_V1.9.0_R3.md <<'EOF'
          # Career Mode Showdown v1.9.0-r3 — Pairing Copy + Four-Code One-Paste Hardening

          Status: RELEASE CANDIDATE

          Application version: `v1.9.0`
          Runtime asset revision: `1.9.0-r3`
          Previous known-good runtime: `1.9.0-r2`

          Player One gets one direct Copy action. Player Two pastes exactly once. The same private pairing capability is retained across pairing and Connected Rivalry. Late device-registration completion cannot overwrite an in-flight/open/paired state. Browser proof uses production Save Library geometry/styles and fresh Chromium processes per manager scenario.

          Permanent locks remain unchanged: Spark only; billing forbidden; memory-only Firestore; App Check enforcement OFF; no public discovery; no canonical local-save mutation; Candidate C remains sole destructive remote-to-local gameplay Apply authority.

          Fixed RJR-1 remains 87/100 until newly verified owner production capability evidence.
          EOF
      - run: npm ci
      - name: Deterministic proof
        run: |
          node --check js/sparkPrivatePairing.js
          node --check tests/browser/pairing-four-code-automation-audit.cjs
          node tests/contracts/stage3-private-pairing-contracts.cjs
          node tests/contracts/stage4-connected-rivalry-pointer-restore-contracts.cjs
          node tests/contracts/pairing-four-code-automation-contracts.cjs
      - name: Browser proof
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-r3-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/browser/stage3-private-pairing-audit.cjs
          node tests/browser/pairing-four-code-automation-audit.cjs
          node tests/browser/stage5e-remote-joining-audit.cjs
      - name: Full contracts
        run: npm run test:contracts
      - name: Commit validated runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/automation-pairing-r3-hardening-v2.yml .github/workflows/automation-pairing-r3-fast-seal.yml .github/workflows/automation-pairing-r3-core-seal.yml .github/workflows/automation-pairing-r3-core-seal-v2.yml .github/workflows/automation-pairing-r3-core-seal-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden pairing copy and one-paste automation"
          git push origin HEAD:fix/pairing-copy-four-code-contract-2026-09-02
