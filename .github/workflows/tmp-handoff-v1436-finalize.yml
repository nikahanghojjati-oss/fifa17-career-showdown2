name: Temporary r4 handoff v1.4.36 finalizer

on:
  push:
    branches:
      - handoff-v1.4.36-r4-production-seal

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse validated authority patch and finalize current r4 continuity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/tmp-handoff-v1436-seal.yml').read_text().splitlines()
          out=[]
          active=False
          for line in lines:
              if "node - <<'NODE'" in line:
                  active=True
                  continue
              if active and line.strip() == 'NODE':
                  break
              if active:
                  out.append(line[10:] if line.startswith('          ') else line)
          if not out:
              raise SystemExit('could not extract authority patch')
          Path('/tmp/reconcile.cjs').write_text('\n'.join(out)+'\n')
          PY
          node /tmp/reconcile.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const p='scripts/tmp-handoff-v1436-seal.mjs';
          let s=fs.readFileSync(p,'utf8');
          const from='SLE = Smart Lean Efficient. This is the deep-reference handoff behind ${STARTER}. Treat it as orientation only;';
          const to='SLE = Smart Lean Efficient. This is the deep-reference handoff behind ${STARTER}. Publication remains conditioned on required tests and required gates passing. Treat it as orientation only;';
          if(!s.includes(from)) throw new Error('deep handoff publication-condition anchor not found');
          s=s.replace(from,to);

          const changelogAnchor="let ch=read('CHANGELOG.md')";
          const provenance="for(const p of ['CAREER_MODE_SHOWDOWN_V1.9.0_R4_MAINTENANCE_HANDOFF.md','RELEASE_V1.9.0_R4.md']){let rs=read(p);const proof='Production proof: PR #184 merge '+MAIN+'; Deploy GitHub Pages run '+PAGES_RUN+'; Stability/deployed-site-smoke run '+STABILITY_RUN+'.';if(!rs.includes(proof))rs=rs.trimEnd()+'\\n\\n'+proof+'\\n';write(p,rs);}\n";
          if(!s.includes(changelogAnchor)) throw new Error('release provenance insertion anchor not found');
          s=s.replace(changelogAnchor,provenance+changelogAnchor);

          const immediateContract=String.raw`const assert=require("node:assert/strict");
          const fs=require("node:fs");
          const read=p=>fs.readFileSync(p,"utf8");
          const json=p=>JSON.parse(read(p));
          const golden=read("00_HANDOFF_GOLDEN_RULE.md");
          const start=read("00_DEVELOPER_START_HERE.md");
          const current=read("00_CURRENT_HANDOFF.md");
          const next=read("NEXT_TASK.md");
          const state=read("PROJECT_STATE.md");
          const prompt=read("NEXT_CHAT_HANDOFF_PROMPT.md");
          const bootstrap=json("SESSION_BOOTSTRAP.json");
          const readiness=json("REMOTE_JOINING_READINESS.json");
          const pkg=json("package.json");
          const zeroBilling=read("00_OWNER_ZERO_BILLING_REMOTE_JOINING_AUTHORIZATION.md");
          const standing=read("00_OWNER_STANDING_MERGE_DEPLOY_AUTHORIZATION.md");
          const providerAbuse=read("PRODUCTION_PROVIDER_ABUSE_ACCEPTANCE_PROOF_2026-08-29.md");
          const stage5a=read("STAGE5A_PRIVATE_SESSION_CANDIDATE_EMULATOR_PROOF_2026-08-31.md");
          const stage5b=read("STAGE5B_DEVICE_CREDENTIAL_FOUNDATION_PROOF_2026-08-31.md");
          const stage5c=read("STAGE5C_ZERO_BILLING_STANDARD_AUTH_SESSION_ADAPTER_PROOF_2026-09-01.md");
          const stage5d=read("STAGE5D_PRODUCTION_RULES_PROVIDER_LIVE_PROOF_2026-09-02.md");
          assert.match(golden,/Mandatory immediate-next-task handoff rule/i);
          assert.match(golden,/IMMEDIATE NEXT TASK AFTER FULL STUDY/i);
          assert.match(golden,/specific enough[\s\S]+start work without asking the owner what to do next/i);
          assert.match(golden,/recursive and permanent/i);
          for(const pair of [["developer",start],["current",current],["next",next]]) assert.match(pair[1],/IMMEDIATE NEXT TASK AFTER FULL STUDY/i,pair[0]+" must expose immediate next task");
          assert.equal(pkg.version,"1.9.0");
          assert.equal(readiness.modelVersion,"RJR-1");
          assert.equal(readiness.denominator,100);
          assert.equal(readiness.currentScore,88);
          const life=readiness.evidenceHistory?.find(e=>e.eventId==="production-stage5e-r3-provider-live-remote-joining-lifecycle");
          assert.equal(life?.score,88); assert.equal(life?.delta,1);
          assert.equal(bootstrap.remoteJoiningReadiness?.score,88);
          assert.equal(bootstrap.runtime?.productionRuntimeRevision,"1.9.0-r4");
          assert.equal(bootstrap.runtime?.immediateRecoveryRuntime,"1.9.0-r3");
          assert.equal(bootstrap.runtime?.candidateRuntimeRevision,undefined);
          assert.equal(bootstrap.latestRuntimeMerge?.pullRequest,184);
          assert.equal(bootstrap.latestRuntimeMerge?.runtimeRevision,"1.9.0-r4");
          assert.equal(bootstrap.latestRuntimeMerge?.mergeSha,"2bfb7656940be23b635cb7092127a0ab0f62c7a4");
          assert.equal(bootstrap.latestRuntimeMerge?.postMergeRunsSuccessful,15);
          assert.equal(bootstrap.latestRuntimeMerge?.pagesRunId,33713396948);
          assert.equal(bootstrap.latestRuntimeMerge?.stabilityRunId,33713396979);
          assert.equal(bootstrap.latestRuntimeMerge?.rollbackRunId,33190961085);
          assert.equal(bootstrap.latestRuntimeMerge?.productionProofRecorded,true);
          assert.equal(bootstrap.lastProductionProvenRuntime?.pullRequest,184);
          assert.equal(bootstrap.lastProductionProvenRuntime?.runtimeRevision,"1.9.0-r4");
          assert.equal(bootstrap.starter?.version,"1.4.36");
          assert.match(bootstrap.starter?.canonical||"",/START_NEXT_SESSION_V1\.4\.36_PR184_R4_PRODUCTION_PROVEN/);
          assert.equal(bootstrap.immediateNextTask?.name,"production-r4-one-paste-zero-manual-reattach-acceptance");
          assert.equal(bootstrap.immediateNextTask?.mustStartAsRealProductWork,true);
          assert.equal(bootstrap.immediateNextTask?.mustNotInsertGenericPrerequisiteLane,true);
          assert.match(bootstrap.immediateNextTask?.summary||"",/fresh WEC[\s\S]+PR #184[\s\S]+RJR88[\s\S]+one-paste[\s\S]+zero manual Verify\/Reattach[\s\S]+Billing[\s\S]+Cloud Run/i);
          assert.equal(bootstrap.transition?.contextTransitionRequired,true);
          assert.equal(bootstrap.transition?.handoffCompleteness,100);
          assert.equal(bootstrap.transition?.continuationDecision,"HANDOFF_AT_CHECKPOINT");
          assert.equal(bootstrap.currentWec?.environmentId,"we-2026-09-02-stage5e-r4-stale-pointer-precedence");
          assert.equal(bootstrap.currentWec?.finalDecision,"HANDOFF_AT_CHECKPOINT");
          assert.equal(bootstrap.currentWec?.decisionInheritedFromPredecessor,false);
          assert.equal(bootstrap.currentWec?.handoffCompleteness,100);
          for(const text of [next,current,state]){
            assert.match(text,/PR #184/i);
            assert.match(text,/1\.9\.0-r4/i);
            assert.match(text,/RJR88|88\/100/i);
            assert.match(text,/zero manual[\s\S]+Verify\/Reattach/i);
            assert.match(text,/Billing[\s\S]+(?:must never|forbidden)/i);
          }
          assert.match(prompt,/fresh WEC/i); assert.match(prompt,/one-paste/i); assert.match(prompt,/zero manual Verify\/Reattach/i); assert.match(prompt,/Billing must never be activated/i);
          assert.match(zeroBilling,/billing must never be activated/i); assert.match(zeroBilling,/Cloud Run is therefore excluded/i);
          assert.match(standing,/mandatory tests[\s\S]+gates pass/i);
          assert.match(providerAbuse,/authenticatedAccountStable[\s\S]+authenticationControlsLockedDuringQuery[\s\S]+firestoreWritesRequested[\s\S]+localStorageUnchanged/i);
          assert.match(stage5a,/Stage 5A/i); assert.match(stage5b,/P-256|device credential/i); assert.match(stage5c,/standard Google|standard-Firebase|standard Firebase/i); assert.match(stage5d,/provider-live|provider authoritative|production Rules/i);
          const historical=bootstrap.currentPublicationCheckpoint;
          assert.ok(historical,"historical pre-r4 publication checkpoint must be retained");
          assert.ok((historical.rjrAfterEvidence||0)<=readiness.currentScore);
          assert.equal(historical.productionRollbackProven,true);
          assert.equal(historical.productionRestorationProven,true);
          assert.equal(historical.productionProviderRulesPublicationProven,true);
          assert.equal(historical.productionProviderRulesSource,"firestore.spark.rules");
          assert.equal(historical.providerAbuseProductionAcceptanceProven,true);
          assert.equal(historical.stage5AProviderDeviceCredentialEmulatorProven,true);
          assert.equal(historical.stage5BNonExtractableKeyBrowserProven,true);
          assert.equal(historical.stage5BPerSignInCustomTokenClaimsEmulatorProven,true);
          assert.equal(historical.stage5BProductionCriticalPath,false);
          assert.equal(historical.stage5CStandardFirebaseUidAuthority,true);
          assert.equal(historical.stage5CCustomDeviceClaimsRequired,false);
          assert.equal(historical.billingActivationForbidden,true);
          assert.equal(historical.productionSessionRulesChanged,true);
          assert.match(next,/Do not repeat consumed/i);
          assert.match(next,/third-account\/revoked-device|third-account and revoked-device/i);
          assert.match(next,/two-device\/two-network|two-device.*two-network|two-physical-network/i);
          assert.match(next,/final stable Remote Joining release acceptance/i);
          process.stdout.write("PASS immediate-next-task contract: PR184 r4 production-proven, fixed RJR88, closed predecessor WEC, fresh zero-manual-reattach owner acceptance next.\n");`;
          const validationAnchor='// Validate the current handoff package before committing.';
          if(!s.includes(validationAnchor)) throw new Error('validation anchor not found');
          s=s.replace(validationAnchor,"write('tests/contracts/handoff-immediate-next-task-contracts.cjs',"+JSON.stringify(immediateContract)+");\n\n"+validationAnchor);

          const rmFrom="execFileSync('git',['rm','scripts/tmp-handoff-v1436-seal.mjs','.github/workflows/tmp-handoff-v1436-seal.yml'],{stdio:'inherit'});";
          const rmTo="execFileSync('git',['rm','scripts/tmp-handoff-v1436-seal.mjs','.github/workflows/tmp-handoff-v1436-seal.yml','.github/workflows/tmp-handoff-v1436-finalize.yml'],{stdio:'inherit'});";
          if(!s.includes(rmFrom)) throw new Error('temporary cleanup anchor not found');
          s=s.replace(rmFrom,rmTo);
          fs.writeFileSync(p,s);
          NODE
      - name: Generate validate self-clean and commit package
        run: node scripts/tmp-handoff-v1436-seal.mjs
