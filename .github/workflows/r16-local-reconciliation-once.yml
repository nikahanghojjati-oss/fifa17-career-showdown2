name: r16 Local Reconciliation one-shot
on:
  push:
    branches:
      - feat/ssjr-local-reconciliation-r16
    paths:
      - '.github/workflows/r16-local-reconciliation-once.yml'
permissions:
  contents: write
jobs:
  build-r16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ssjr-local-reconciliation-r16
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build bounded r16 capability
        run: python scripts/r16-local-reconciliation-build.py
      - name: Validate r16 and inherited Candidate C authority
        run: |
          npm run test:ssjr:local-reconciliation
          node tests/contracts/stage4-remote-local-reconciliation-contracts.cjs
          npm run test:ops
          git diff --check
      - name: Commit clean r16 candidate and remove one-shot tooling
        run: |
          rm .github/workflows/r16-local-reconciliation-once.yml scripts/r16-local-reconciliation-build.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate Shared Local Reconciliation r16 candidate'
          git push origin HEAD:feat/ssjr-local-reconciliation-r16
