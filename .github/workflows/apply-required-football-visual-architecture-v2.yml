name: Apply Required Football Visual Architecture V2

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/apply-required-football-visual-architecture-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Apply required presentation semantics
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          # optionalModules.js: keep the visual module outside the critical shell,
          # but warm it immediately and make every destination await it.
          p = Path('js/optionalModules.js')
          s = p.read_text()
          if 'let requiredFootballVisualPromise = null;' not in s:
              s = s.replace('let gameplayRuntimeInitialized = false;\n', 'let gameplayRuntimeInitialized = false;\nlet requiredFootballVisualPromise = null;\n', 1)

          # Replace the loader function by function boundaries rather than indentation-sensitive text.
          start = s.index('async function ensureFootballVisualModule(){')
          end = s.index('\nasync function ensureAnalyticsEngine(){', start)
          replacement = '''async function ensureFootballVisualModule(){
              const stylePromise = loadRuntimeStyle("football-visual-ui", "css/footballVisuals.css");
              await loadRuntimeScript(
                  "football-visual-data",
                  "data/footballVisuals.js",
                  () => Boolean(window.FOOTBALL_VISUALS && window.FOOTBALL_VISUAL_SCREEN_PLAN)
              );
              await loadRuntimeScript(
                  "football-visual-ui",
                  "js/footballVisuals.js",
                  () => typeof window.initializeFootballVisuals === "function"
                      && typeof window.prepareFootballVisualScreen === "function"
                      && typeof window.preloadFootballVisualAssets === "function"
              );
              await stylePromise;
              await window.initializeFootballVisuals();
              return true;
          }

          function ensureRequiredFootballVisualExperience(){
              if(requiredFootballVisualPromise){ return requiredFootballVisualPromise; }
              requiredFootballVisualPromise = ensureFootballVisualModule().catch(error => {
                  requiredFootballVisualPromise = null;
                  throw error;
              });
              return requiredFootballVisualPromise;
          }
          '''
          s = s[:start] + replacement + s[end:]
          s = s.replace('const visualPromise = ensureFootballVisualModule();', 'const visualPromise = ensureRequiredFootballVisualExperience();')
          s = s.replace('    await ensureFootballVisualModule();\n', '    await ensureRequiredFootballVisualExperience();\n')

          init_anchor = '    optionalModulesInitialized = true;\n}'
          warm_block = '''    ensureRequiredFootballVisualExperience().catch(error => {
              if(typeof window.reportApplicationError === "function"){
                  window.reportApplicationError("Required football presentation could not be prepared", error);
              }else{
                  console.error("Required football presentation could not be prepared", error);
              }
          });

              optionalModulesInitialized = true;
          }'''
          if 'Required football presentation could not be prepared' not in s:
              if init_anchor not in s:
                  raise SystemExit('initializeOptionalModules anchor missing')
              s = s.replace(init_anchor, warm_block, 1)

          export_anchor = 'window.ensureFootballVisualModule = ensureFootballVisualModule;\n'
          if 'window.ensureRequiredFootballVisualExperience' not in s:
              s = s.replace(export_anchor, export_anchor + 'window.ensureRequiredFootballVisualExperience = ensureRequiredFootballVisualExperience;\n', 1)
          p.write_text(s)

          # screens.js: required destinations fail loudly if their presentation is unavailable.
          p = Path('js/screens.js')
          s = p.read_text()
          if 'const REQUIRED_FOOTBALL_VISUAL_SCREENS' not in s:
              marker = 'const SAFE_BACK_TARGETS = Object.freeze({'
              pos = s.index(marker)
              s = s[:pos] + '''const REQUIRED_FOOTBALL_VISUAL_SCREENS = new Set([
              "createShowdown",
              "transferChallenge",
              "careerStatistics",
              "trophyRoom"
          ]);

          ''' + s[pos:]

          s = re.sub(
              r'    if\(typeof window\.prepareFootballVisualScreen === "function"\)\{\n\s*window\.prepareFootballVisualScreen\(screenName\);\n\s*\}',
              '''    if(REQUIRED_FOOTBALL_VISUAL_SCREENS.has(screenName)){
              if(typeof window.prepareFootballVisualScreen !== "function"){
                  throw new Error(`Required football presentation is unavailable for ${screenName}.`);
              }
              if(!window.prepareFootballVisualScreen(screenName)){
                  throw new Error(`Required football presentation could not mount for ${screenName}.`);
              }
          }''',
              s,
              count=1
          )

          # Remove old route-visible activation. Panel src is now immediate and assets are preloaded.
          s = re.sub(
              r'\n\s*if\(typeof window\.activateFootballVisualScreen === "function"\)\{\n\s*try\{ window\.activateFootballVisualScreen\(screenName\); \}\n\s*catch\(error\)\{ console\.warn\(`\[Career Mode Showdown\] Optional football visual activation failed for \$\{screenName\}:`, error\); \}\n\s*\}',
              '',
              s
          )

          old_nav = '''        if(target === "createShowdown" && typeof window.ensureFootballVisualModule === "function"){
              await window.ensureFootballVisualModule();
          }
          '''
          if old_nav in s:
              s = s.replace(old_nav, '''        if(REQUIRED_FOOTBALL_VISUAL_SCREENS.has(target)){
              if(typeof window.ensureRequiredFootballVisualExperience !== "function"){
                  throw new Error("Required football presentation loader is unavailable.");
              }
              await window.ensureRequiredFootballVisualExperience();
          }
          ''', 1)
          else:
              raise SystemExit('navigateTo visual-loader block missing')

          old_resume = '''        if(!saved){
              currentShowdown = null;
              resetNavigationState();
              showScreen("createShowdown");
              return;
          }
          '''
          if old_resume in s:
              s = s.replace(old_resume, '''        if(!saved){
              currentShowdown = null;
              resetNavigationState();
              if(typeof window.ensureRequiredFootballVisualExperience !== "function"){
                  throw new Error("Required football presentation loader is unavailable.");
              }
              await window.ensureRequiredFootballVisualExperience();
              showScreen("createShowdown");
              return;
          }
          ''', 1)
          p.write_text(s)

          # Home Reus: startup already fetches this same local asset at high priority.
          # The Home instance should reuse that cache immediately instead of waiting for idle time.
          p = Path('js/menuExperience.js')
          s = p.read_text()
          start = s.find('function scheduleMarcoReusImageLoad(){')
          end = s.find('\nfunction ensureMarcoReusTreatment(){', start)
          if start >= 0 and end > start:
              s = s[:start] + s[end+1:]
          s = s.replace(
              '        image.loading = "lazy";\n        image.fetchPriority = "low";\n        image.dataset.src = MARCO_REUS_IMAGE.thumbnail;\n',
              '        image.loading = "eager";\n        image.fetchPriority = "high";\n        image.src = MARCO_REUS_IMAGE.thumbnail;\n',
              1
          )
          s = s.replace('    scheduleMarcoReusImageLoad();\n', '')
          p.write_text(s)

          # Wording/documentation follows owner direction.
          p = Path('css/footballVisuals.css')
          p.write_text(p.read_text().replace('Lazy screen-level photography with FIFA-17-era geometry.', 'Required screen photography with FIFA-17-era geometry.'))

          p = Path('THIRD_PARTY_NOTICES.md')
          s = p.read_text().replace(
              'The following images are optional screen-level presentation assets. They are stored locally, loaded only when their relevant screen is opened, and never form part of gameplay logic or the initial application shell.',
              'The following images are required screen-level presentation assets. They are stored locally and proactively warmed after the critical application shell starts so the intended football presentation is ready before its destination screens are used. They do not own gameplay logic or saved data.'
          )
          p.write_text(s)

          # Sanity checks before commit.
          screens = Path('js/screens.js').read_text()
          optional = Path('js/optionalModules.js').read_text()
          menu = Path('js/menuExperience.js').read_text()
          assert 'activateFootballVisualScreen' not in screens
          assert 'ensureRequiredFootballVisualExperience' in screens
          assert 'ensureRequiredFootballVisualExperience' in optional
          assert 'scheduleMarcoReusImageLoad' not in menu
          assert 'image.loading = "eager"' in menu
          print('Required football visual architecture applied.')
          PY

      - name: Remove failed migration helpers and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-required-football-visual-architecture.yml
          rm -f .github/workflows/apply-required-football-visual-architecture-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make football photography required presentation'
          git push origin HEAD:agent/licensed-football-visual-system-r1
