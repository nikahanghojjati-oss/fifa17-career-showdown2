name: PR260 phone-width pair routing proof
on:
  push:
    branches:
      - feat/persistent-nik-daniel-pair
    paths:
      - .github/workflows/pr260-mobile-pair-routing-proof.yml
permissions:
  contents: read
jobs:
  prove-phone-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Re-run real persistent-pair DOM at iPhone-sized viewport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser/persistent-pair-user-facing-routing-audit.cjs')
          t=p.read_text()
          old='const context=await browser.newContext({viewport:{width:1280,height:800}});'
          new='const context=await browser.newContext({viewport:{width:390,height:844}});'
          if old not in t: raise SystemExit('routing viewport anchor not found')
          p.write_text(t.replace(old,new,1))
          PY
          node --check tests/browser/persistent-pair-user-facing-routing-audit.cjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pr260-phone-route-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node tests/browser/persistent-pair-user-facing-routing-audit.cjs
