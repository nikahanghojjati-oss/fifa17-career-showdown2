name: Repair Firebase ADC Provider Readback

on:
  push:
    branches:
      - infra/permanent-zero-billing-firebase-control-plane-2026-09-01
    paths:
      - .github/workflows/repair-firebase-adc-readback.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out infrastructure branch
        uses: actions/checkout@v7
        with:
          ref: infra/permanent-zero-billing-firebase-control-plane-2026-09-01

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Remove token-minting IAM requirement and use ADC key for provider readback
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const workflowPath = '.github/workflows/deploy-firestore-rules-zero-billing.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          workflow = workflow.replace(/\n          token_format: access_token\n          access_token_scopes: https:\/\/www\.googleapis\.com\/auth\/cloud-platform\n/, '\n');
          workflow = workflow.replace(/\n      - name: Refuse missing permanent credential[\s\S]*?\n      - name: Deploy only Firestore Security Rules\n/, `\n      - name: Refuse missing permanent ADC credential file\n        shell: bash\n        run: |\n          set -euo pipefail\n          test -n "\${GOOGLE_APPLICATION_CREDENTIALS:-}"\n          test -f "\${GOOGLE_APPLICATION_CREDENTIALS}"\n\n      - name: Deploy only Firestore Security Rules\n`);
          workflow = workflow.replace(/\n      - name: Independently read provider Rules back and prove exact source identity\n        env:\n          ACCESS_TOKEN: \$\{\{ steps\.google-auth\.outputs\.access_token \}\}\n        run: \|\n/, '\n      - name: Independently read provider Rules back and prove exact source identity\n        run: |\n');
          workflow = workflow.replace(
            "          const project = process.env.FIREBASE_PROJECT_ID;\n          const token = process.env.ACCESS_TOKEN;\n          const local = fs.readFileSync(process.env.FIREBASE_RULES_FILE, 'utf8');",
            `          const project = process.env.FIREBASE_PROJECT_ID;\n          const credentialsPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;\n          if (!credentialsPath || !fs.existsSync(credentialsPath)) {\n            throw new Error('GOOGLE_APPLICATION_CREDENTIALS is missing after google-github-actions/auth.');\n          }\n          const credentials = JSON.parse(fs.readFileSync(credentialsPath, 'utf8'));\n          if (!credentials.client_email || !credentials.private_key) {\n            throw new Error('ADC service-account credential is missing client_email or private_key.');\n          }\n          const local = fs.readFileSync(process.env.FIREBASE_RULES_FILE, 'utf8');`
          );
          const gitBlobAnchor = `          function gitBlobSha(content) {\n            const bytes = Buffer.from(content, 'utf8');\n            return crypto.createHash('sha1')\n              .update(Buffer.from(\`blob \${bytes.length}\\0\`, 'utf8'))\n              .update(bytes)\n              .digest('hex');\n          }\n`;
          const oauthFunctions = `\n          function base64urlJson(value) {\n            return Buffer.from(JSON.stringify(value), 'utf8').toString('base64url');\n          }\n\n          async function mintAccessToken() {\n            const now = Math.floor(Date.now() / 1000);\n            const unsigned = [\n              base64urlJson({ alg: 'RS256', typ: 'JWT' }),\n              base64urlJson({\n                iss: credentials.client_email,\n                scope: 'https://www.googleapis.com/auth/cloud-platform',\n                aud: 'https://oauth2.googleapis.com/token',\n                iat: now,\n                exp: now + 3600\n              })\n            ].join('.');\n            const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned, 'utf8'), credentials.private_key).toString('base64url');\n            const assertion = \`\${unsigned}.\${signature}\`;\n            const response = await fetch('https://oauth2.googleapis.com/token', {\n              method: 'POST',\n              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },\n              body: new URLSearchParams({\n                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',\n                assertion\n              })\n            });\n            const body = await response.text();\n            if (!response.ok) {\n              throw new Error(\`Google OAuth token exchange failed with HTTP \${response.status}.\`);\n            }\n            const parsed = JSON.parse(body);\n            if (!parsed.access_token) {\n              throw new Error('Google OAuth token exchange returned no access_token.');\n            }\n            return parsed.access_token;\n          }\n`;
          if (!workflow.includes('async function mintAccessToken()')) {
            if (!workflow.includes(gitBlobAnchor)) throw new Error('gitBlobSha anchor missing in deployment workflow.');
            workflow = workflow.replace(gitBlobAnchor, gitBlobAnchor + oauthFunctions);
          }
          workflow = workflow.replace(
            `          async function googleGet(url) {\n            const response = await fetch(url, {\n              headers: { Authorization: \`Bearer \${token}\` }\n            });`,
            `          async function googleGet(url, token) {\n            const response = await fetch(url, {\n              headers: { Authorization: \`Bearer \${token}\` }\n            });`
          );
          workflow = workflow.replace(
            `          (async () => {\n            const release = await googleGet(\n              \`https://firebaserules.googleapis.com/v1/projects/\${project}/releases/cloud.firestore\`\n            );`,
            `          (async () => {\n            const token = await mintAccessToken();\n            const release = await googleGet(\n              \`https://firebaserules.googleapis.com/v1/projects/\${project}/releases/cloud.firestore\`, token\n            );`
          );
          workflow = workflow.replace(
            `            const ruleset = await googleGet(\n              \`https://firebaserules.googleapis.com/v1/\${release.rulesetName}\`\n            );`,
            `            const ruleset = await googleGet(\n              \`https://firebaserules.googleapis.com/v1/\${release.rulesetName}\`, token\n            );`
          );
          fs.writeFileSync(workflowPath, workflow);

          const contractPath = 'tests/contracts/firebase-permanent-control-plane-contracts.cjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          contract = contract.replace('  "token_format: access_token",\n', '  "GOOGLE_APPLICATION_CREDENTIALS",\n  "https://oauth2.googleapis.com/token",\n  "urn:ietf:params:oauth:grant-type:jwt-bearer",\n  "RSA-SHA256",\n');
          const securityAnchor = `assert(!workflow.includes("FIREBASE_TOKEN"), "Permanent Firebase workflow must not fall back to legacy FIREBASE_TOKEN authentication.");`;
          const extraSecurity = `\nassert(!workflow.includes("token_format: access_token"), "Permanent Firebase workflow must not require google-github-actions access-token generation or Token Creator IAM.");\nassert(!workflow.includes("roles/iam.serviceAccountTokenCreator"), "Permanent Firebase workflow must not require Service Account Token Creator IAM.");\nassert(!workflow.includes("steps.google-auth.outputs.access_token"), "Permanent Firebase workflow must not depend on an auth-action access-token output.");`;
          if (!contract.includes('Permanent Firebase workflow must not require google-github-actions access-token generation')) {
            if (!contract.includes(securityAnchor)) throw new Error('Permanent control-plane security anchor missing.');
            contract = contract.replace(securityAnchor, securityAnchor + extraSecurity);
          }
          fs.writeFileSync(contractPath, contract);
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Validate permanent Firebase control-plane contract
        run: node tests/contracts/firebase-permanent-control-plane-contracts.cjs

      - name: Validate complete repository contract suite
        run: node tests/contracts/static-app-release-contracts.cjs && node tests/support/run-contract-suite.cjs

      - name: Validate diff hygiene
        run: git diff --check

      - name: Self-remove helper and commit validated ADC design
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-firebase-adc-readback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Firebase ADC without token-minting IAM role"
          git push origin HEAD:infra/permanent-zero-billing-firebase-control-plane-2026-09-01
