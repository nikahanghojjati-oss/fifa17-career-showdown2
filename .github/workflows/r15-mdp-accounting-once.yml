name: r15 MDP accounting one-shot
on:
  push:
    branches:
      - chore/mdp-r15-accounting-86-50
    paths:
      - '.github/workflows/r15-mdp-accounting-once.yml'
permissions:
  contents: write
jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/mdp-r15-accounting-86-50
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record r15 six-stage integration authority
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          MAIN='4d202126ce1606a4e3f74c09b31201cf4ec51c6e'
          CANDIDATE='f63f6efc777257964aff27abbc148af61e34d77d'
          def load(path): return json.loads(Path(path).read_text())
          def save(path,obj): Path(path).write_text(json.dumps(obj,separators=(',',':')))

          ledger=load('MILESTONE_DELIVERY_PROGRESS.json')
          if ledger.get('currentScore') != 82: raise SystemExit('expected authoritative r14 MDP 82.00')
          cap=next(x for x in ledger['capabilities'] if x['id']=='journey-conflicts')
          if cap.get('status')!='design_defined' or cap.get('lifecyclePercent')!=10: raise SystemExit('journey-conflicts is not at frozen design-only baseline')
          ledger['recordedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          ledger['basis']={
            'mainSha':MAIN,
            'branch':'main',
            'candidateHead':CANDIDATE,
            'candidateValidation':'POS20 run #387 exact-head green',
            'integrationMergeSha':MAIN,
            'pagesDeployment':'GitHub Pages run #119 success',
            'firestoreRulesDeployment':'No new Firestore Rules deployment required for r15; Journey Conflicts wraps existing transaction authority without adding a collection, list permission or write surface.',
            'productionVersion':'v1.9.1',
            'productionRuntimeRevision':'1.9.1-r15',
            'note':'r15 Journey Conflicts is merged and coherently deployed on exact product main '+MAIN+'. PR #244 exact head '+CANDIDATE+' passed POS20 run #387; GitHub Pages run #119 succeeded on r15 main; POS20 run #388 passed on that same main including its exact-head cognitive seal; Release Integration Burn-In run #376 passed both stateful integration journeys. The conflict layer preserves the existing provider transaction/CAS authority while proving exact replay, one bounded stale retry, altered-replay pre-provider denial, receipt expiry, revocation/quota classification and canonical local Save non-mutation. No new Firestore Rules deployment was required. Journey Conflicts has therefore completed all six MDP lifecycle stages. SSJR remains separate and zero until genuine production-two-account evidence is accepted.'
          }
          ledger['currentScore']=86.5
          ledger['formattedScore']='86.50/100'
          ledger['summary']={
            'featureCount':20,'fullyLifecycleDelivered':15,'preIntegrationComplete':0,'designDefinedOnly':5,
            'reusableFoundationsNotInflated':True,
            'interpretation':'Fifteen SSJR capabilities from shared entry through Journey Conflicts are fully engineered, regression-tested and product-integrated in coherent r15 production. Five later capabilities remain design-defined only.'
          }
          cap['lifecyclePercent']=100
          cap['weightedContribution']=5
          cap['status']='integrated'
          for k in cap['stages']: cap['stages'][k]='complete'
          cap['evidenceRefs']=[
            'SHARED_SHOWDOWN_JOURNEY_MODEL.json','js/sharedJourneyConflicts.js','js/productionSharedJourneyConflicts.js',
            'js/productionSharedShowdownSetup.js','js/productionSharedSeasonCommit.js','service-worker.js',
            'tests/contracts/shared-journey-conflicts-contracts.cjs','tests/contracts/shared-journey-conflicts-production-contracts.cjs',
            'tests/contracts/shared-showdown-production-runtime-contracts.cjs','tests/browser/shared-journey-conflicts-audit.cjs',
            'tests/browser/production-shared-setup-overlay-audit.cjs','RELEASE_V1.9.1_R15.md',
            'PR #244 exact candidate head '+CANDIDATE,'POS20 run #387 exact-head green','PR #244 merge '+MAIN,
            'GitHub Pages run #119 success','POS20 run #388 main green','Release Integration Burn-In run #376 success'
          ]
          cap['note']='r15 Journey Conflicts completed all six MDP lifecycle stages after transitive contract and controlled-browser compatibility defects were found and corrected: exact replay, one bounded stale retry, altered replay denial, receipt expiry, revocation/quota classification, provider-code preservation, service-worker retention, exact candidate and publication-head POS20, expected-head merge, coherent Pages deployment, exact-main POS20 and two-pass release burn-in are proven. Firebase transaction authority remains sole remote mutation authority, canonical local storage is unchanged, and SSJR production-two-account acceptance remains separate.'
          ledger['scoreCheck']['fullyIntegratedWeight']=85
          ledger['scoreCheck']['remainingDesignWeight']=15
          ledger['scoreCheck']['remainingDesignContribution']=1.5
          ledger['scoreCheck']['calculatedScore']=86.5
          save('MILESTONE_DELIVERY_PROGRESS.json',ledger)

          readiness=load('SHARED_SHOWDOWN_JOURNEY_READINESS.json')
          if readiness.get('currentScore')!=0: raise SystemExit('SSJR must remain zero')
          if any(x.get('id')=='ssjr1-journey-conflicts-r15-production' for x in readiness.get('candidateEvidence',[])):
              raise SystemExit('r15 candidate evidence already exists')
          readiness['candidateEvidence'].append({
            'id':'ssjr1-journey-conflicts-r15-production',
            'layers':['deterministic-behavior','provider-enforcement','isolated-browser-protocol','deployed-runtime'],
            'references':['PR #244 exact candidate head '+CANDIDATE,'POS20 run #387 exact-head green','PR #244 merge '+MAIN,'GitHub Pages run #119 success','POS20 run #388 main green','Release Integration Burn-In run #376 success','js/sharedJourneyConflicts.js','js/productionSharedJourneyConflicts.js','tests/contracts/shared-journey-conflicts-contracts.cjs','tests/contracts/shared-journey-conflicts-production-contracts.cjs','tests/browser/shared-journey-conflicts-audit.cjs'],
            'relatedCapabilityIds':['journey-conflicts'],'credit':0,'missingLayers':['production-two-account'],
            'finding':'r15 Journey Conflicts is coherently merged and deployed. Exact candidate/publication/main POS20 plus two-pass release burn-in prove deterministic contention/replay handling, provider-authority preservation, isolated-browser conflict behavior, reload-shell retention and zero canonical local-save mutation. It remains zero SSJR credit solely because genuine production-two-account evidence has not yet been accepted.'
          })
          readiness['deliveryProgressTracker']['currentScore']=86.5
          readiness['deliveryProgressTracker']['formattedScore']='86.50/100'
          save('SHARED_SHOWDOWN_JOURNEY_READINESS.json',readiness)

          Path('NEXT_TASK.md').write_text('''# Current product task under POS20

Primary objective: advance MDP-1 to 100.00/100 before returning primary focus to SSJR production-two-account acceptance. SSJR-1.1 remains 0/100 until genuine production-two-account evidence is accepted.

Current integrated product authority is r15 Journey Conflicts on main `4d202126ce1606a4e3f74c09b31201cf4ec51c6e`. After this accounting-only PR lands, MDP-1 is 86.50/100. Accounting or handoff packaging earns no additional MDP or SSJR credit.

Immediate feature is `local-reconciliation`, frozen milestone weight 5. Preserve exact local Save authority while reconciling the authoritative Shared Journey state. Reuse the already-proven Candidate B read-only preview and Candidate C backup-first Apply/rollback primitives, but do not count predecessor reuse as lifecycle completion until the Shared Journey-specific r16 integration is built and independently proven. The r16 acceptance must prove a non-mutating preview, explicit user-confirmed backup-before-Apply, exact rollback, unrelated-save immutability, stable local Save/profile/season identities, remote-authority freshness checks and offline fallback. Candidate C remains the sole destructive local Apply authority; no shared/provider path may mutate canonical local storage automatically.

For every capability, award lifecycle stages only from exact-head evidence. Candidate work cannot earn product-integration credit. Require exact candidate POS20, coherent release publication, final publication-head POS20, expected-head merge, coherent Pages deployment, main POS20 and two-pass release burn-in before the product-integration stage. Never combine CI evidence across heads.

Permanent locks remain: billing OFF, Firebase Spark only, App Check enforcement OFF, memory-only Firestore, popup-only Google Auth, exactly two private managers, pairing plus exact ACTIVE session before protected shared authority, Candidate C sole destructive Apply with exact rollback, canonical local storage unchanged unless the user explicitly executes Candidate C Apply, no public discovery/community/rankings.
''')

          p=Path('tests/contracts/milestone-delivery-progress-contracts.cjs')
          s=p.read_text()
          replacements={
            'assert.equal(result.score, 82, "r14 Journey Reconnect earns product integration only after exact corrected-head validation, expected-head merge, coherent Pages deployment, main POS20 validation and release burn-in.");':'assert.equal(result.score, 86.5, "r15 Journey Conflicts earns product integration only after exact publication-head validation, expected-head merge, coherent Pages deployment, main POS20 validation and release burn-in.");',
            'assert.equal(result.formattedScore, "82.00/100");':'assert.equal(result.formattedScore, "86.50/100");',
            'assert.equal(result.fullyLifecycleDelivered, 14);':'assert.equal(result.fullyLifecycleDelivered, 15);',
            'assert.equal(result.designDefinedOnly, 6);':'assert.equal(result.designDefinedOnly, 5);',
            'assert.equal(ledger.basis.mainSha, "97c28b1efea6ee6e901e6076a834ec419cbad5aa");':'assert.equal(ledger.basis.mainSha, "'+MAIN+'");',
            'assert.equal(ledger.basis.integrationMergeSha, "97c28b1efea6ee6e901e6076a834ec419cbad5aa");':'assert.equal(ledger.basis.integrationMergeSha, "'+MAIN+'");',
            'assert.equal(ledger.basis.candidateHead, "4ca8651bcdd20b794fa78943c4636666d20a1dd0");':'assert.equal(ledger.basis.candidateHead, "'+CANDIDATE+'");',
            'assert.match(ledger.basis.candidateValidation, /POS20 run #371 exact-head green/);':'assert.match(ledger.basis.candidateValidation, /POS20 run #387 exact-head green/);',
            'assert.equal(ledger.basis.productionRuntimeRevision, "1.9.1-r14");':'assert.equal(ledger.basis.productionRuntimeRevision, "1.9.1-r15");',
            'assert.match(ledger.basis.pagesDeployment, /GitHub Pages run #117 success/i);':'assert.match(ledger.basis.pagesDeployment, /GitHub Pages run #119 success/i);',
            'assert.match(ledger.basis.note, /POS20 run #372 passed/i);':'assert.match(ledger.basis.note, /POS20 run #388 passed/i);',
            'assert.match(ledger.basis.note, /Release Integration Burn-In run #374 passed both/i);':'assert.match(ledger.basis.note, /Release Integration Burn-In run #376 passed both/i);',
            '"multi-season","journey-reconnect"':'"multi-season","journey-reconnect","journey-conflicts"',
            'assert.equal(ledger.scoreCheck.fullyIntegratedWeight, 80);':'assert.equal(ledger.scoreCheck.fullyIntegratedWeight, 85);',
            'assert.equal(ledger.scoreCheck.remainingDesignWeight, 20);':'assert.equal(ledger.scoreCheck.remainingDesignWeight, 15);',
            'assert.equal(ledger.scoreCheck.remainingDesignContribution, 2);':'assert.equal(ledger.scoreCheck.remainingDesignContribution, 1.5);',
            'assert.equal(ledger.scoreCheck.calculatedScore, 82);':'assert.equal(ledger.scoreCheck.calculatedScore, 86.5);',
            'current ${result.formattedScore} r14 integrated ledger':'current ${result.formattedScore} r15 integrated ledger'
          }
          for old,new in replacements.items():
              if s.count(old)!=1: raise SystemExit('MDP contract anchor mismatch: '+old[:80])
              s=s.replace(old,new,1)
          r14_end='  assert.equal(ssjrReadiness.remainingCapabilityIds.includes("journey-reconnect"), true, "Journey Reconnect remains uncredited in SSJR until production-two-account evidence is accepted.");\n'
          r15_block='''\n  const r15Candidate = ssjrReadiness.candidateEvidence.find(item => item.id === "ssjr1-journey-conflicts-r15-production");\n  assert.ok(r15Candidate, "SSJR readiness must preserve truthful zero-credit r15 production evidence.");\n  assert.equal(r15Candidate.credit, 0);\n  assert.deepEqual(r15Candidate.relatedCapabilityIds, ["journey-conflicts"]);\n  for (const layer of ["deterministic-behavior","provider-enforcement","isolated-browser-protocol","deployed-runtime"]) assert.ok(r15Candidate.layers.includes(layer), `r15 candidate evidence missing ${layer}`);\n  assert.ok(r15Candidate.missingLayers.includes("production-two-account"));\n  for (const expected of ["PR #244 exact candidate head f63f6efc","POS20 run #387 exact-head green","PR #244 merge 4d202126","GitHub Pages run #119 success","POS20 run #388 main green","Release Integration Burn-In run #376 success"]) assert.ok(r15Candidate.references.some(ref => ref.includes(expected)), `r15 evidence missing ${expected}`);\n  assert.equal(ssjrReadiness.remainingCapabilityIds.includes("journey-conflicts"), true, "Journey Conflicts remains uncredited in SSJR until production-two-account evidence is accepted.");\n'''
          if s.count(r14_end)!=1: raise SystemExit('r14 readiness insertion anchor mismatch')
          s=s.replace(r14_end,r14_end+r15_block,1)
          recon_end='  for (const expected of ["PR #242 exact candidate head 4ca8651","POS20 run #371 exact-head green","PR #242 merge 97c28b1","GitHub Pages run #117 success","POS20 run #372 main green","Release Integration Burn-In run #374 success"]) assert.ok(journeyReconnectIntegrated.evidenceRefs.some(ref => ref.includes(expected)), `Journey Reconnect integration evidence missing ${expected}`);\n'
          jc_block='''\n\n  const journeyConflictsIntegrated = ledger.capabilities.find(capability => capability.id === "journey-conflicts");\n  assert.equal(journeyConflictsIntegrated.weightedContribution, 5);\n  for (const ref of ["js/sharedJourneyConflicts.js","js/productionSharedJourneyConflicts.js","service-worker.js","tests/contracts/shared-journey-conflicts-production-contracts.cjs","tests/browser/shared-journey-conflicts-audit.cjs"]) assert.ok(journeyConflictsIntegrated.evidenceRefs.includes(ref), `Journey Conflicts evidence missing ${ref}`);\n  for (const expected of ["PR #244 exact candidate head f63f6efc","POS20 run #387 exact-head green","PR #244 merge 4d202126","GitHub Pages run #119 success","POS20 run #388 main green","Release Integration Burn-In run #376 success"]) assert.ok(journeyConflictsIntegrated.evidenceRefs.some(ref => ref.includes(expected)), `Journey Conflicts integration evidence missing ${expected}`);\n'''
          if s.count(recon_end)!=1: raise SystemExit('journey reconnect integration insertion anchor mismatch')
          s=s.replace(recon_end,recon_end+jc_block,1)
          p.write_text(s)
      - name: Validate accounting authority
        run: |
          node tests/contracts/milestone-delivery-progress-contracts.cjs
          npm run test:ops
          git diff --check
      - name: Commit accounting authority and remove one-shot
        run: |
          rm .github/workflows/r15-mdp-accounting-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: record r15 MDP 86.50 authority'
          git push origin HEAD:chore/mdp-r15-accounting-86-50
