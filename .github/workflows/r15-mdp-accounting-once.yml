name: r15 MDP accounting one-shot
on:
  push:
    branches:
      - chore/mdp-r15-accounting-86-50
    paths:
      - '.github/workflows/r15-mdp-accounting-once.yml'
permissions:
  contents: write
jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/mdp-r15-accounting-86-50
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact r15 accounting update
        run: python scripts/r15-mdp-accounting-once.py
      - name: Retarget anti-inflation negative fixture to next design-only capability
        shell: python
        run: |
          from pathlib import Path
          p=Path('tests/contracts/milestone-delivery-progress-contracts.cjs')
          s=p.read_text()
          old='const outOfOrder = clone(ledger); const journeyConflicts = outOfOrder.capabilities.find(capability => capability.id === "journey-conflicts"); journeyConflicts.stages["automated-test"] = "complete";'
          new='const outOfOrder = clone(ledger); const localReconciliation = outOfOrder.capabilities.find(capability => capability.id === "local-reconciliation"); localReconciliation.stages["automated-test"] = "complete";'
          if s.count(old)!=1:
              raise SystemExit('out-of-order negative fixture anchor mismatch')
          p.write_text(s.replace(old,new,1))
      - name: Validate accounting authority
        run: |
          node tests/contracts/milestone-delivery-progress-contracts.cjs
          npm run test:ops
          git diff --check
      - name: Commit accounting authority and remove one-shot tooling
        run: |
          rm .github/workflows/r15-mdp-accounting-once.yml scripts/r15-mdp-accounting-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: record r15 MDP 86.50 authority'
          git push origin HEAD:chore/mdp-r15-accounting-86-50
