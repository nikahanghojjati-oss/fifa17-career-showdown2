name: R5 Rashford Crop Grid

on:
  push:
    branches: [agent/r5-smart-player-photo-rebuild]
    paths:
      - 'tools/r5_rashford_crop_grid.py'
      - '.github/workflows/r5-rashford-crop-grid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4
      - run: python tools/r5_rashford_crop_grid.py
      - name: Upload grids
        uses: actions/upload-artifact@v7
        with:
          name: r5-rashford-crop-grids-${{ github.sha }}
          path: |
            test-results/r5-rashford-grid-*.jpg
            test-results/r5-rashford-grid-report.txt
          retention-days: 3
