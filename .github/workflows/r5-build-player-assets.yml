name: R5 Build Player Assets

on:
  push:
    branches: [agent/r5-smart-player-photo-rebuild]
    paths:
      - 'tools/build_r5_player_visuals.py'
      - '.github/workflows/r5-build-player-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v5
        with:
          ref: agent/r5-smart-player-photo-rebuild
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4
      - name: Build licensed smart-crop derivatives
        run: python tools/build_r5_player_visuals.py
      - name: Commit generated derivatives and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/football/asset-manifest.json assets/football/*.webp
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi
          git commit -m "Generate r5 smart-crop player derivatives"
          git push origin HEAD:agent/r5-smart-player-photo-rebuild
