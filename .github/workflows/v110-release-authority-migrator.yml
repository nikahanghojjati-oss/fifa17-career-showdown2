name: v1.1.0 Release Authority Migrator

on:
  push:
    branches: [agent/v1.1.0-candidate-a-maintenance]
    paths:
      - tools/promote_v110_release_authority.py
      - .github/workflows/v110-release-authority-migrator.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v110-release-authority-migrator
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out Candidate A branch
        uses: actions/checkout@v5
        with:
          ref: agent/v1.1.0-candidate-a-maintenance
          fetch-depth: 1

      - name: Promote release authority
        run: python tools/promote_v110_release_authority.py

      - name: Validate syntax before export
        shell: bash
        run: |
          set -euo pipefail
          find js data tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check

      - name: Create exact Git blobs for connector commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add index.html tests/contracts/stability-contracts.cjs tests/browser/home-visual-audit.cjs .github/workflows/*.yml RELEASE_V1.1.0.md PROJECT_STATE.md NEXT_TASK.md README.md 00_DEVELOPER_START_HERE.md CHANGELOG.md POST_V1_ROADMAP_EXECUTION.md
          git diff --cached --name-only > /tmp/v110-files.txt
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          files = pathlib.Path('/tmp/v110-files.txt').read_text().splitlines()
          print(f'V110_BLOB_COUNT={len(files)}')
          for filename in files:
              data = pathlib.Path(filename).read_bytes()
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json'
                  },
                  method='POST'
              )
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)
              print(f'V110_BLOB {filename} {result["sha"]}')
          PY
