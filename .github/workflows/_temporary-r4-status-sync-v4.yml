name: TEMP r4 status sync v4

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-status-sync-v4.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
          fetch-depth: 0
      - name: Prepend current r4 status
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/prefix && cat PROJECT_STATE.md >> /tmp/prefix && mv /tmp/prefix PROJECT_STATE.md
          printf '%s' '' | base64 -d > /tmp/prefix && cat NEXT_TASK.md >> /tmp/prefix && mv /tmp/prefix NEXT_TASK.md
          printf '%s' '' | base64 -d > /tmp/prefix && cat README.md >> /tmp/prefix && mv /tmp/prefix README.md
          printf '%s' '' | base64 -d > /tmp/prefix && cat CHANGELOG.md >> /tmp/prefix && mv /tmp/prefix CHANGELOG.md
          git diff --check
      - name: Commit status records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md NEXT_TASK.md README.md CHANGELOG.md
          git commit -m "Sync v1.9.0-r4 release status"
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
