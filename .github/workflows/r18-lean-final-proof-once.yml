name: R18 Lean Final Proof Once

on:
  push:
    branches: [feat/ssjr-terminal-close-r18]
    paths: [.github/workflows/r18-lean-final-proof-once.yml]

permissions:
  contents: write

jobs:
  validate-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Patch lean terminal proof and exact contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          function replaceExact(source,oldValue,newValue,label){
            if(!source.includes(oldValue)) throw new Error(`${label} seam missing`);
            return source.replace(oldValue,newValue);
          }
          {
            const p='firestore.terminal-close-production.fragment.rules';
            let s=fs.readFileSync(p,'utf8');
            s=replaceExact(s,"        && (intent.totalSeasons == 1 || intent.totalSeasons == 3 || intent.totalSeasons == 5 || intent.totalSeasons == 10)","        && intent.totalSeasons in [1,3,5,10]",'terminal intent season set');
            s=replaceExact(s,"        && (progress.totalSeasons == 1 || progress.totalSeasons == 3 || progress.totalSeasons == 5 || progress.totalSeasons == 10)","        && progress.totalSeasons in [1,3,5,10]",'terminal progress season set');
            s=replaceExact(s,"      return before.data.keys().hasOnly(['connectionState','connectionStateBeforeDeletion','managerSlots','authorizedAccountIds','createdByAccountId','createdAt'])\n        && after.data.keys().hasOnly(['connectionState','connectionStateBeforeDeletion','managerSlots','authorizedAccountIds','createdByAccountId','createdAt','terminalProgress'])\n        && ssjrTerminalProgressShape(progress)","      return ssjrTerminalProgressShape(progress)",'initial progress shape');
            s=replaceExact(s,"      return before.data.keys().hasOnly(['connectionState','connectionStateBeforeDeletion','managerSlots','authorizedAccountIds','createdByAccountId','createdAt','terminalProgress'])\n        && after.data.keys().hasOnly(['connectionState','connectionStateBeforeDeletion','managerSlots','authorizedAccountIds','createdByAccountId','createdAt','terminalProgress'])\n        && ssjrTerminalProgressShape(prior)","      return ssjrTerminalProgressShape(prior)",'advance progress shape');
            s=replaceExact(s,"        && validCasEnvelope(before, after, 'rivalry', rivalryId)\n        && ssjrTerminalBaseRivalryPreserved(before, after)\n        && ssjrTerminalProgressActorValid(before, after)","        && ssjrTerminalFinalEnvelopeCas(before, after, 'rivalry', rivalryId)\n        && after.data.diff(before.data).affectedKeys().hasOnly(['terminalProgress'])\n        && ssjrTerminalProgressActorValid(before, after)",'progress lean envelope');
            fs.writeFileSync(p,s);
          }
          {
            const p='scripts/build-production-firestore-rules.mjs';
            let s=fs.readFileSync(p,'utf8');
            const old="  'ssjrTerminalSessionTransitionBound(rivalryId, intent, after.updatedByDeviceId, progress.closedSessionRevision)',";
            const replacement="  'function ssjrTerminalFinalEnvelopeCas(before, after, objectType, objectId)',\n  \"after.data.diff(before.data).affectedKeys().hasOnly(['terminalProgress'])\",\n  \"after.data.diff(before.data).affectedKeys().hasOnly(['connectionState','terminalProgress','terminalClose'])\",\n  \"progress.diff(priorProgress).affectedKeys().hasOnly(['closedSessionRevision'])\",";
            s=replaceExact(s,old,replacement,'lean final-proof generator');
            fs.writeFileSync(p,s);
          }
          {
            const p='tests/contracts/shared-terminal-close-rules-contracts.cjs';
            let s=fs.readFileSync(p,'utf8');
            s=replaceExact(s,"assert.match(fragment,/intent\\.managerTotals == progress\\.managerTotals/);","assert.match(fragment,/intent\\.managerTotals == priorProgress\\.managerTotals/);",'lean final-proof contract totals');
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Install repository dependencies
        run: npm ci
      - name: Validate focused r18 contracts
        run: |
          node tests/contracts/shared-terminal-close-provider-contracts.cjs
          node tests/contracts/shared-terminal-close-rules-contracts.cjs
      - name: Install pinned Firebase emulator dependencies
        run: npm install --no-save --package-lock=false firebase@12.17.1 @firebase/rules-unit-testing@5.0.1 firebase-admin@14.2.0
      - name: Build generated production Rules
        run: node scripts/build-production-firestore-rules.mjs
      - name: Run strengthened r18 emulator matrix
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-career-mode-showdown-terminal-close-lean-final "node tests/firebase/shared-terminal-close-production-provider-emulator.cjs"
      - name: Persist lean proof only after green emulator
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/ssjr-terminal-close-r18
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/ssjr-terminal-close-r18)"
          git rm .github/workflows/r18-lean-final-proof-once.yml
          printf '\n# exact-head diagnostic retrigger after lean map-diff terminal proof\n' >> .github/workflows/r18-finalize-publication-once.yml
          git config user.name "nikahanghojjati-oss"
          git config user.email "nikahang.hojjati@gmail.com"
          git add firestore.terminal-close-production.fragment.rules scripts/build-production-firestore-rules.mjs tests/contracts/shared-terminal-close-rules-contracts.cjs .github/workflows/r18-finalize-publication-once.yml
          git commit -m "fix(r18): persist lean terminal proof"
          git push origin HEAD:feat/ssjr-terminal-close-r18
