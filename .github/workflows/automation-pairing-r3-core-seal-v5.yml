name: One-time Pairing R3 Core Seal V5

on:
  push:
    branches:
      - fix/pairing-copy-four-code-contract-2026-09-02

permissions:
  contents: write

jobs:
  core-seal-v5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pairing-copy-four-code-contract-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply validated r3 payload and SLE candidate contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          wf=Path('.github/workflows/automation-pairing-r3-core-seal-v4.yml').read_text()
          marker="          python - <<'PY'\n"
          start=wf.index(marker)+len(marker)
          end=wf.index("\n          PY\n",start)
          exec(compile(textwrap.dedent(wf[start:end]),'r3-v4-payload','exec'),{})

          p=Path('tests/contracts/sle-handoff-packaging-contracts.cjs')
          s=p.read_text()
          old='''assert.equal(sourceRevision, "1.9.0-r2", "Stage 5E source hotfix candidate runtime must be explicit.");'''
          new='''assert.equal(sourceRevision, "1.9.0-r3", "Stage 5E pairing one-paste hardening candidate runtime must be explicit.");'''
          assert old in s, 'expected r2 SLE source-candidate assertion missing'
          p.write_text(s.replace(old,new,1))
          PY
          cat > RELEASE_V1.9.0_R3.md <<'EOF'
          # Career Mode Showdown v1.9.0-r3 — Pairing Copy + Four-Code One-Paste Hardening

          Status: RELEASE CANDIDATE

          Application version: `v1.9.0`
          Runtime asset revision: `1.9.0-r3`
          Previous known-good runtime: `1.9.0-r2`

          Player One gets one direct Copy action. Player Two pastes exactly once. The same private pairing capability is retained across pairing and Connected Rivalry. Late device-registration completion cannot overwrite an in-flight/open/paired state. Browser proof uses production Save Library geometry/styles and fresh Chromium processes per manager scenario.

          This hardening prepares the production Private Remote Joining Host/Join lifecycle without changing session authority or earning RJR credit before owner-device evidence.

          Permanent locks remain unchanged: Spark only; billing forbidden; memory-only Firestore; App Check enforcement remains OFF; no public discovery; no canonical local-save mutation; Candidate C remains sole destructive remote-to-local gameplay Apply authority.

          Fixed RJR-1 remains 87/100 until newly verified owner production capability evidence.
          EOF
      - run: npm ci
      - name: Deterministic proof
        run: |
          node --check js/sparkPrivatePairing.js
          node --check tests/browser/pairing-four-code-automation-audit.cjs
          node --check tests/contracts/sle-handoff-packaging-contracts.cjs
          node tests/contracts/stage3-private-pairing-contracts.cjs
          node tests/contracts/stage4-connected-rivalry-pointer-restore-contracts.cjs
          node tests/contracts/pairing-four-code-automation-contracts.cjs
          node tests/contracts/sle-handoff-packaging-contracts.cjs
      - name: Browser proof
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-r3-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node tests/browser/stage3-private-pairing-audit.cjs
          node tests/browser/pairing-four-code-automation-audit.cjs
          node tests/browser/stage5e-remote-joining-audit.cjs
      - name: Full contracts
        run: npm run test:contracts
      - name: Commit validated runtime
        shell: bash
        run: |
          set -euo pipefail
          # The Actions GITHUB_TOKEN has contents permission but no workflow scope.
          # Keep every workflow file byte-identical in this bot push; the connector
          # will update the permanent validation workflow and remove these one-time
          # automation files separately after this validated runtime commit lands.
          git restore .github/workflows
          python - <<'PY'
          from pathlib import Path
          path=Path('STAGE5E_PRODUCTION_REMOTE_JOINING_ACCEPTANCE_RUNBOOK_2026-09-02.md')
          path.write_text(path.read_text().rstrip()+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden pairing copy and one-paste automation"
          git push origin HEAD:fix/pairing-copy-four-code-contract-2026-09-02
