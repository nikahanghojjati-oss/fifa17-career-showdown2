name: v1.0.2 Near Transfer Stability Blob Builder

on:
  push:
    branches:
      - agent/v1.0.2-footballer-tile-maintenance
    paths:
      - '.github/workflows/v102-near-transfer-stability-builder.yml'
      - 'tools/build_v102_near_transfer_stability_blobs.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.0.2-footballer-tile-maintenance
      - name: Build Git blobs for near-breakpoint Transfer and Stability fixes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_v102_near_transfer_stability_blobs.py
