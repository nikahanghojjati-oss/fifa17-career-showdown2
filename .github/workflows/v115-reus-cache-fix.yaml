name: Temporary v1.1.5 Home Reus Cache Fix

on:
  push:
    branches:
      - agent/v1.1.5-maintenance

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.5-maintenance
          fetch-depth: 0
      - name: Align Home Reus cache identity exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('js/menuExperience.js')
          text=p.read_text()
          old='thumbnail: "assets/marco-reus-2015-cc-by.webp?v=1.1.4-r1"'
          new='thumbnail: "assets/marco-reus-2015-cc-by.webp?v=1.1.5-r1"'
          count=text.count(old)
          if count!=1: raise SystemExit(f'expected one stale Home Reus cache literal, found {count}')
          text=text.replace(old,new,1)
          if 'marco-reus-2015-cc-by.webp?v=1.1.4-r1' in text: raise SystemExit('stale Home Reus revision remains')
          p.write_text(text)
          PY
      - name: Commit exact runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/menuExperience.js
          git diff --cached --check
          git commit -m "Align Home Reus cache with v1.1.5"
          git push origin HEAD:agent/v1.1.5-maintenance
