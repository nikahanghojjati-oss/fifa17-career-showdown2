name: Validate Final Polish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  final-polish-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate centralized transition lifecycle and focus
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          class FakeClassList {
            constructor(hidden = false){ this.values = new Set(hidden ? ['hidden'] : []); }
            contains(value){ return this.values.has(value); }
            add(value){ this.values.add(value); }
            remove(value){ this.values.delete(value); }
            toggle(value, force){
              if(force === true){ this.values.add(value); return true; }
              if(force === false){ this.values.delete(value); return false; }
              if(this.values.has(value)){ this.values.delete(value); return false; }
              this.values.add(value); return true;
            }
          }

          class FakeElement {
            constructor(id, hidden = false){
              this.id = id;
              this.classList = new FakeClassList(hidden);
              this.attributes = new Map();
              this.listeners = new Map();
              this.heading = {
                id: '', dataset: {}, focused: false,
                setAttribute(name, value){ this[name] = String(value); },
                focus(){ this.focused = true; }
              };
            }
            setAttribute(name, value){ this.attributes.set(name, String(value)); }
            getAttribute(name){ return this.attributes.get(name) || null; }
            removeAttribute(name){ this.attributes.delete(name); }
            querySelector(selector){ return selector === 'h2' ? this.heading : null; }
            addEventListener(type, handler){ this.listeners.set(type, handler); }
            removeEventListener(type, handler){ if(this.listeners.get(type) === handler){ this.listeners.delete(type); } }
            finishAnimation(){ const handler = this.listeners.get('animationend'); if(handler){ handler({ target: this }); } }
          }

          const elements = {
            mainMenu: new FakeElement('mainMenu'),
            createShowdown: new FakeElement('createShowdown', true),
            statistics: new FakeElement('statistics', true)
          };
          const main = { scrollTop: 91 };
          const frames = [];
          let feedbackCalls = 0;
          let reducedMotion = false;
          let timerId = 0;
          const context = {
            console,
            currentShowdown: null,
            document: {
              getElementById(id){ return elements[id] || null; },
              querySelector(selector){ return selector === 'main' ? main : null; }
            },
            setTimeout(){ return ++timerId; },
            clearTimeout(){},
            requestAnimationFrame(callback){ frames.push(callback); return frames.length; },
            isReducedMotionPreferred(){ return reducedMotion; },
            consumeMenuFeedbackCue(){ feedbackCalls += 1; }
          };
          context.window = context;
          vm.createContext(context);
          const source = fs.readFileSync('js/screens.js', 'utf8');
          vm.runInContext(`${source}\n;globalThis.__routes = { showScreen, getNavigationDiagnostics };`, context, { filename: 'js/screens.js' });
          const api = context.__routes;

          assert.strictEqual(api.showScreen('createShowdown', true, { direction: 'forward' }), true);
          assert.strictEqual(elements.mainMenu.classList.contains('hidden'), true, 'Previous screen must hide immediately.');
          assert.strictEqual(elements.mainMenu.getAttribute('aria-hidden'), 'true', 'Previous screen must leave the accessibility tree.');
          assert.strictEqual(elements.createShowdown.getAttribute('aria-hidden'), 'false', 'Destination must enter the accessibility tree.');
          assert.strictEqual(elements.createShowdown.getAttribute('data-route-state'), 'entering');
          assert.strictEqual(elements.createShowdown.getAttribute('data-route-direction'), 'forward');
          assert.strictEqual(feedbackCalls, 1, 'A successful route commit must consume feedback exactly once.');
          frames.splice(0).forEach(callback => callback());
          assert.strictEqual(elements.createShowdown.heading.focused, true, 'Destination heading must receive focus.');
          assert.strictEqual(main.scrollTop, 0, 'New destinations must open at the top.');
          elements.createShowdown.finishAnimation();
          assert.strictEqual(api.getNavigationDiagnostics().transitionActive, false, 'Completed transition state must be released.');

          reducedMotion = false;
          assert.strictEqual(api.showScreen('mainMenu', false, { direction: 'back' }), true);
          assert.strictEqual(elements.mainMenu.getAttribute('data-route-direction'), 'back');
          assert.strictEqual(api.showScreen('createShowdown', false), true);
          assert.strictEqual(elements.mainMenu.getAttribute('data-route-state'), null, 'A newer route must cancel stale transition state.');
          assert.strictEqual(elements.createShowdown.getAttribute('data-route-state'), 'entering');

          reducedMotion = true;
          assert.strictEqual(api.showScreen('mainMenu', false, { direction: 'back' }), true);
          assert.strictEqual(elements.mainMenu.getAttribute('data-route-state'), null, 'Reduced motion must skip theatrical route state.');
          const feedbackBeforeInvalid = feedbackCalls;
          assert.strictEqual(api.showScreen('statistics'), false, 'State-invalid destinations must remain blocked.');
          assert.strictEqual(feedbackCalls, feedbackBeforeInvalid, 'Blocked navigation must not consume confirmation feedback.');

          const showSource = api.showScreen.toString();
          assert.ok(showSource.indexOf('flushScreenBeforeLeave') < showSource.indexOf('beginRouteTransition'), 'Pending writes must flush before presentation begins.');
          assert.ok(showSource.indexOf('renderScreenBeforeEnter') < showSource.indexOf('beginRouteTransition'), 'Destination rendering must validate before presentation begins.');
          console.log('Central transition, stale-callback cleanup, reduced motion, focus, and save-before-presentation contracts passed.');
          NODE

      - name: Validate original feedback synthesis and preference migration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          const values = new Map([
            ['careerModeShowdown.preferences', JSON.stringify({ schemaVersion: 1, reducedMotion: true })]
          ]);
          const storageContext = {
            console, Date, JSON, structuredClone, setTimeout, clearTimeout,
            localStorage: {
              getItem(key){ return values.has(key) ? values.get(key) : null; },
              setItem(key, value){ values.set(key, String(value)); },
              removeItem(key){ values.delete(key); }
            },
            document: { documentElement: { dataset: {} }, visibilityState: 'visible', addEventListener(){} },
            CustomEvent: function(type, init){ this.type = type; this.detail = init && init.detail; },
            matchMedia(){ return { matches: false, addEventListener(){}, addListener(){} }; },
            addEventListener(){}, dispatchEvent(){ return true; }
          };
          storageContext.window = storageContext;
          vm.createContext(storageContext);
          const storageSource = fs.readFileSync('js/storage.js', 'utf8');
          vm.runInContext(`${storageSource}\n;globalThis.__preferences = { loadApplicationPreferences, isMenuFeedbackEnabled, setApplicationMenuFeedbackPreference };`, storageContext, { filename: 'js/storage.js' });
          const preferences = JSON.parse(JSON.stringify(storageContext.__preferences.loadApplicationPreferences()));
          assert.deepStrictEqual(preferences, { schemaVersion: 2, reducedMotion: true, menuFeedback: true }, 'v1 preferences must migrate safely with feedback enabled.');
          assert.strictEqual(storageContext.__preferences.setApplicationMenuFeedbackPreference(false), true);
          assert.strictEqual(storageContext.__preferences.isMenuFeedbackEnabled(), false);

          let clock = 1000;
          let oscillatorCount = 0;
          let feedbackEnabled = true;
          let mediaPlaying = false;
          const parameter = { setValueAtTime(){}, exponentialRampToValueAtTime(){} };
          class FakeAudioContext {
            constructor(){ this.state = 'running'; this.currentTime = 1; this.destination = {}; }
            createGain(){ return { gain: { ...parameter }, connect(){ return this; }, disconnect(){} }; }
            createOscillator(){
              oscillatorCount += 1;
              return { type: '', frequency: { ...parameter }, connect(){ return this; }, start(){}, stop(){}, disconnect(){}, addEventListener(){} };
            }
            resume(){ this.state = 'running'; return Promise.resolve(); }
            suspend(){ this.state = 'suspended'; return Promise.resolve(); }
          }
          const audioContext = {
            console,
            Date,
            performance: { now(){ return clock; } },
            document: { visibilityState: 'visible', addEventListener(){} },
            AudioContext: FakeAudioContext,
            isMenuFeedbackEnabled(){ return feedbackEnabled; },
            isMenuMediaPlaying(){ return mediaPlaying; }
          };
          audioContext.window = audioContext;
          vm.createContext(audioContext);
          const audioSource = fs.readFileSync('js/menuFeedback.js', 'utf8');
          vm.runInContext(`${audioSource}\n;globalThis.__feedback = { playMenuFeedbackCue, getMenuFeedbackDiagnostics };`, audioContext, { filename: 'js/menuFeedback.js' });
          const feedback = audioContext.__feedback;

          assert.strictEqual(feedback.playMenuFeedbackCue(), true);
          assert.strictEqual(oscillatorCount, 2, 'Original cue must use its restrained two-voice synthesis.');
          assert.strictEqual(feedback.playMenuFeedbackCue(), false, 'Rapid repeat feedback must be throttled.');
          assert.strictEqual(oscillatorCount, 2);
          clock += 111;
          assert.strictEqual(feedback.playMenuFeedbackCue(), true);
          assert.strictEqual(oscillatorCount, 4);
          clock += 111; mediaPlaying = true;
          assert.strictEqual(feedback.playMenuFeedbackCue(), false, 'Home media playback must suppress the cue.');
          mediaPlaying = false; feedbackEnabled = false;
          assert.strictEqual(feedback.playMenuFeedbackCue(), false, 'The persisted mute preference must suppress the cue.');
          assert.strictEqual(feedback.getMenuFeedbackDiagnostics().synthesis, 'original-web-audio');

          assert.ok(!/new\s+Audio\s*\(/.test(audioSource), 'Recorded Audio assets must not be introduced.');
          assert.ok(!/(?:https?:|\.mp3|\.wav|\.ogg)/i.test(audioSource), 'Feedback synthesis must not fetch or embed a recorded asset.');
          const html = fs.readFileSync('index.html', 'utf8');
          const optional = fs.readFileSync('js/optionalModules.js', 'utf8');
          const menuExperience = fs.readFileSync('js/menuExperience.js', 'utf8');
          assert.ok(!html.includes('js/menuFeedback.js'), 'Feedback synthesis must remain outside the initial shell.');
          assert.ok(optional.includes('"js/menuFeedback.js"'), 'Feedback synthesis must use the established lazy loader.');
          assert.ok(menuExperience.includes('window.addEventListener("click", recordMenuFeedbackInteraction, true)'), 'Feedback intent must run before centralized Back stops document propagation.');
          console.log('Preference migration, user mute, media suppression, cooldown, and original Web Audio synthesis passed.');
          NODE

      - name: Validate accessibility and lightweight presentation budgets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const assert = require('assert');

          const html = fs.readFileSync('index.html', 'utf8');
          const css = fs.readFileSync('css/app.css', 'utf8');
          const screens = fs.readFileSync('js/screens.js', 'utf8');
          const settings = fs.readFileSync('js/settings.js', 'utf8');
          const transferSelector = fs.readFileSync('js/transferSelector.js', 'utf8');
          const feedbackBytes = fs.statSync('js/menuFeedback.js').size;

          const buttons = [...html.matchAll(/<button\b[^>]*>/gi)].map(match => match[0]);
          assert.deepStrictEqual(buttons.filter(button => !/\btype="button"/i.test(button)), [], 'Every shell button must declare button type.');
          for(const id of ['showdownName', 'managerOne', 'managerTwo', 'roundAmount']){
            assert.ok(html.includes(`for="${id}"`), `${id} needs an associated setup label.`);
          }
          const transferFields = [...html.matchAll(/<(?:input|select)\b[^>]*data-transfer-field[^>]*>/gi)].map(match => match[0]);
          assert.ok(transferFields.length >= 30, 'Transfer field shell is incomplete.');
          assert.deepStrictEqual(transferFields.filter(field => !/\baria-label=/i.test(field)), [], 'Every compact Transfer field needs a contextual accessible name.');
          assert.ok(transferSelector.includes('selectorContextLabel'), 'Enhanced Transfer comboboxes must preserve contextual labels.');
          assert.ok(html.includes('id="selectedLeague" role="status" aria-live="polite"'), 'League result must be announced.');
          assert.ok(screens.includes('setAttribute("aria-hidden"'), 'Route commits must synchronize the accessibility tree.');
          assert.ok(screens.includes('heading.setAttribute("tabindex", "-1")'), 'Route headings must be programmatically focusable.');
          assert.ok(screens.includes('heading.focus({ preventScroll: true })'), 'Route focus must avoid viewport jumps.');
          assert.ok(settings.includes('setAttribute("role", "switch")'), 'Feedback preference needs native switch semantics.');
          assert.ok(css.includes('.backButton:focus-visible') && css.includes('.menuMusicControl:focus-visible'), 'Primary non-tile controls need explicit focus visibility.');
          const clubRevealIndex = (css.match(/\.clubRevealIndex\{[^}]+\}/) || [])[0] || '';
          assert.ok(clubRevealIndex.includes('color:rgba(255,255,255,.66)'), 'Club reveal sequence indices must retain readable contrast.');
          assert.ok(css.includes('.transferOverviewStatus{color:#596873;}'), 'Showdown Home transfer status must retain readable contrast.');
          assert.ok(css.includes('.overallScoreBox span{color:#52616b'), 'Season Summary overall-score caption must retain readable contrast.');

          const forward = (css.match(/@keyframes routeForwardIn\{([^}]*(?:\}[^@]*)?)/) || [])[0] || '';
          const back = (css.match(/@keyframes routeBackIn\{([^}]*(?:\}[^@]*)?)/) || [])[0] || '';
          assert.ok(forward.includes('translate3d') && back.includes('translate3d'), 'Route movement must stay compositor-friendly.');
          assert.ok(!/(?:top|left|width|height|margin|padding):/.test(forward + back), 'Route keyframes must not animate layout properties.');
          assert.ok(!/opacity:/.test(forward + back), 'Content-bearing route surfaces must preserve full opacity throughout entrance motion.');
          assert.ok(css.includes('.screen[data-route-state="entering"]{will-change:transform;'), 'Route presentation must promote only the transform layer.');
          assert.ok(css.includes('html[data-motion-reduced="true"] .screen[data-route-state="entering"]'), 'User reduced motion must explicitly disable route theatrics.');
          assert.ok(css.includes('@media(prefers-reduced-motion:reduce)'), 'Device reduced motion guard is missing.');

          const revision = (html.match(/app-asset-revision"\s+content="([^"]+)/) || [])[1];
          assert.strictEqual(revision, '1.0.1-r3', 'The v1.0.1 stability patch must use its fresh cache revision.');
          const refs = [...html.matchAll(/(?:src|href)="((?:js|css|data)\/[^"?#]+)(?:\?v=([^"#]+))?/g)]
            .map(match => ({ path: match[1], revision: match[2] || '' }));
          assert.strictEqual(refs.filter(ref => ref.path.startsWith('js/')).length, 7, 'Initial shell must remain seven scripts.');
          assert.deepStrictEqual(refs.filter(ref => ref.path.startsWith('css/')).map(ref => ref.path), ['css/app.css']);
          assert.deepStrictEqual(refs.filter(ref => ref.revision !== revision), [], 'Final polish shell contains mixed revisions.');
          const rawBytes = refs.reduce((total, ref) => total + fs.statSync(ref.path).size, 0);
          const compressedBytes = refs.reduce((total, ref) => total + zlib.gzipSync(fs.readFileSync(ref.path), { level: 9 }).length, 0);
          assert.ok(rawBytes <= 166000, `Initial raw bytes exceeded 166000 (${rawBytes}).`);
          assert.ok(compressedBytes <= 37500, `Initial compressed bytes exceeded 37500 (${compressedBytes}).`);
          assert.ok(feedbackBytes <= 5500, `Lazy feedback module is too large (${feedbackBytes}).`);
          console.log(`Accessibility and presentation budgets passed: ${rawBytes} raw / ${compressedBytes} compressed initial bytes; ${feedbackBytes} lazy feedback bytes.`);
          NODE
