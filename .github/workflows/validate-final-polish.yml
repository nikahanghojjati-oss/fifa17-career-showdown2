name: Validate Final Polish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  final-polish-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate centralized transition lifecycle and focus
        shell: bash
        run: |
          set -euo pipefail
          node tests/contracts/final-polish-transition.cjs

      - name: Validate original feedback synthesis and preference migration
        shell: bash
        run: |
          set -euo pipefail
          node tests/contracts/final-polish-feedback.cjs

      - name: Validate accessibility and lightweight presentation budgets
        shell: bash
        run: |
          set -euo pipefail
          node tests/contracts/final-polish-presentation.cjs
