name: R18 Terminal Close Builder

on:
  push:
    branches:
      - feat/ssjr-terminal-close-r18
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-close-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Deterministic Terminal Close protocol
        run: node tests/contracts/shared-terminal-close-contracts.cjs
      - name: Atomic Terminal Close provider
        run: node tests/contracts/shared-terminal-close-provider-contracts.cjs
      - name: Existing Final Reconciliation regression
        run: npm run test:ssjr:final-reconciliation
      - name: Static safety regression
        run: npm run test:contracts
