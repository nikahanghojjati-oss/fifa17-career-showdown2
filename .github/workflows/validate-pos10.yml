name: Validate POS10 IMPACT

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos10-impact-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  route:
    name: POS10 exact selector
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      profile: ${{ steps.route.outputs.profile }}
      tests_csv: ${{ steps.route.outputs.tests_csv }}
      proofs_csv: ${{ steps.route.outputs.proofs_csv }}
      proof_groups_json: ${{ steps.route.outputs.proof_groups_json }}
      run_operations: ${{ steps.route.outputs.run_operations }}
      full_seal: ${{ steps.route.outputs.full_seal }}
      test_count: ${{ steps.route.outputs.test_count }}
      proof_count: ${{ steps.route.outputs.proof_count }}
      selected_proof_cost: ${{ steps.route.outputs.selected_proof_cost }}
      full_proof_cost: ${{ steps.route.outputs.full_proof_cost }}
      proof_cost_saved_percent: ${{ steps.route.outputs.proof_cost_saved_percent }}
    steps:
      - name: Check out exact candidate with history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve exact changed artifacts
        shell: bash
        run: |
          set -euo pipefail
          changed=/tmp/pos10-changed-files.txt
          : > "$changed"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$changed"
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && ! "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$changed"
          fi
          sort -u -o "$changed" "$changed"
          printf 'POS10 changed artifacts:\n'
          cat "$changed" || true
      - name: Compute exact POS10 selection
        id: route
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            node scripts/pos10-impact-router.mjs --files-file /tmp/pos10-changed-files.txt --force-full --github-output "$GITHUB_OUTPUT" --json
          else
            node scripts/pos10-impact-router.mjs --files-file /tmp/pos10-changed-files.txt --github-output "$GITHUB_OUTPUT" --json
          fi

  operations:
    name: POS10 operations authority
    needs: route
    if: needs.route.outputs.run_operations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run test:ops

  deterministic:
    name: POS10 selected deterministic census
    needs: route
    if: needs.route.outputs.tests_csv != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run exact selected current-product contracts
        env:
          POS10_SELECTED_TESTS: ${{ needs.route.outputs.tests_csv }}
        run: node tests/support/run-selected-product-contracts.cjs --tests "$POS10_SELECTED_TESTS"

  proofs:
    name: POS10 proof ${{ matrix.group }}
    needs: route
    if: needs.route.outputs.proof_groups_json != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.route.outputs.proof_groups_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run exact selected heavy proofs for this group
        env:
          POS10_SELECTED_PROOFS: ${{ needs.route.outputs.proofs_csv }}
          POS10_PROOF_GROUP: ${{ matrix.group }}
        run: node scripts/pos10-proof-runner.mjs --proofs "$POS10_SELECTED_PROOFS" --group "$POS10_PROOF_GROUP"

  exact-head-summary:
    name: POS10 exact-head seal
    needs: [route, operations, deterministic, proofs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every selected lane to pass
        shell: bash
        run: |
          set -euo pipefail
          printf 'profile=%s tests=%s proofs=%s proof_cost=%s/%s saved=%s%% full_seal=%s\n' \
            "${{ needs.route.outputs.profile }}" \
            "${{ needs.route.outputs.test_count }}" \
            "${{ needs.route.outputs.proof_count }}" \
            "${{ needs.route.outputs.selected_proof_cost }}" \
            "${{ needs.route.outputs.full_proof_cost }}" \
            "${{ needs.route.outputs.proof_cost_saved_percent }}" \
            "${{ needs.route.outputs.full_seal }}"
          [[ '${{ needs.route.result }}' == success ]] || exit 1
          check_lane() {
            if [[ "$2" == true ]]; then
              [[ "$3" == success ]] || { echo "Required POS10 lane did not pass: $1 ($3)" >&2; exit 1; }
            else
              [[ "$3" == skipped || "$3" == success ]] || exit 1
            fi
          }
          check_lane operations '${{ needs.route.outputs.run_operations }}' '${{ needs.operations.result }}'
          check_lane deterministic '${{ needs.route.outputs.tests_csv != '' }}' '${{ needs.deterministic.result }}'
          check_lane proofs '${{ needs.route.outputs.proof_groups_json != '[]' }}' '${{ needs.proofs.result }}'
          echo 'PASS POS10 exact-head seal: every selected deterministic and heavy proof lane passed on one head.'
