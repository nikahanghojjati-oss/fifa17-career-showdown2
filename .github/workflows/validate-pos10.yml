name: Validate POS20

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos20-cognitive-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  route:
    name: POS20 exact selector
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      profile: ${{ steps.route.outputs.profile }}
      tests_csv: ${{ steps.route.outputs.tests_csv }}
      proofs_csv: ${{ steps.route.outputs.proofs_csv }}
      proof_groups_json: ${{ steps.route.outputs.proof_groups_json }}
      run_operations: ${{ steps.route.outputs.run_operations }}
      full_seal: ${{ steps.route.outputs.full_seal }}
      test_count: ${{ steps.route.outputs.test_count }}
      proof_count: ${{ steps.route.outputs.proof_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve exact changed artifacts
        shell: bash
        run: |
          set -euo pipefail
          changed=/tmp/pos20-changed-files.txt
          : > "$changed"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$changed"
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && ! "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$changed"
          fi
          sort -u -o "$changed" "$changed"
          cat "$changed" || true
      - name: Compute POS20 cognitive route
        id: route
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            node scripts/pos20-impact-router.mjs --files-file /tmp/pos20-changed-files.txt --force-full --github-output "$GITHUB_OUTPUT" --json
          else
            node scripts/pos20-impact-router.mjs --files-file /tmp/pos20-changed-files.txt --github-output "$GITHUB_OUTPUT" --json
          fi

  benchmark:
    name: POS20 cognitive benchmark
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run work:benchmark

  operations:
    name: POS20 operations authority
    needs: route
    if: needs.route.outputs.run_operations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run test:ops

  deterministic:
    name: POS20 selected deterministic census
    needs: route
    if: needs.route.outputs.tests_csv != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run selected product contracts
        env:
          POS20_SELECTED_TESTS: ${{ needs.route.outputs.tests_csv }}
        run: node tests/support/run-selected-product-contracts.cjs --tests "$POS20_SELECTED_TESTS"

  proofs:
    name: POS20 proof ${{ matrix.group }}
    needs: route
    if: needs.route.outputs.proof_groups_json != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.route.outputs.proof_groups_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run selected inherited heavy proofs
        env:
          POS20_SELECTED_PROOFS: ${{ needs.route.outputs.proofs_csv }}
          POS20_PROOF_GROUP: ${{ matrix.group }}
        run: node scripts/pos10-proof-runner.mjs --proofs "$POS20_SELECTED_PROOFS" --group "$POS20_PROOF_GROUP"

  exact-head-summary:
    name: POS20 exact-head cognitive seal
    needs: [route, benchmark, operations, deterministic, proofs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require benchmark and every selected lane on this head
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ needs.route.result }}' == success ]] || exit 1
          [[ '${{ needs.benchmark.result }}' == success ]] || exit 1
          check_lane() {
            if [[ "$2" == true ]]; then
              [[ "$3" == success ]] || { echo "Required POS20 lane did not pass: $1 ($3)" >&2; exit 1; }
            else
              [[ "$3" == skipped || "$3" == success ]] || exit 1
            fi
          }
          check_lane operations '${{ needs.route.outputs.run_operations }}' '${{ needs.operations.result }}'
          check_lane deterministic '${{ needs.route.outputs.tests_csv != '' }}' '${{ needs.deterministic.result }}'
          check_lane proofs '${{ needs.route.outputs.proof_groups_json != '[]' }}' '${{ needs.proofs.result }}'
          echo 'PASS POS20 exact-head cognitive seal: benchmark and all selected inherited proof lanes passed on one head.'
