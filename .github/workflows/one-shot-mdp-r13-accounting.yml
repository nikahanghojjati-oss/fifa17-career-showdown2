name: One-shot MDP r13 accounting

on:
  push:
    branches:
      - chore/mdp-r13-integration-77-50

permissions:
  contents: write

jobs:
  publish-accounting:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/mdp-r13-integration-77-50
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Record r13 Multi Season lifecycle integration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ledgerPath = 'MILESTONE_DELIVERY_PROGRESS.json';
          const readinessPath = 'SHARED_SHOWDOWN_JOURNEY_READINESS.json';
          const contractPath = 'tests/contracts/milestone-delivery-progress-contracts.cjs';
          const mainSha = 'cfe6f8017c5326bfb23b547830c22d1c6b3a8bfd';
          const candidateHead = '96dcf910a724fab2fec1dcba77c9b67d0cee0fe1';
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          ledger.recordedAt = new Date().toISOString();
          ledger.basis = {
            mainSha,
            branch: 'main',
            candidateHead,
            candidateValidation: 'POS20 run #343 exact-head green',
            integrationMergeSha: mainSha,
            pagesDeployment: 'GitHub Pages run #115 success',
            firestoreRulesDeployment: 'No new Firestore Rules deployment required for r13; Multi Season progression is read-only and reuses existing Spark authority.',
            productionVersion: 'v1.9.1',
            productionRuntimeRevision: '1.9.1-r13',
            note: 'r13 Shared Multi Season progression is merged and coherently deployed on exact product main cfe6f8017c5326bfb23b547830c22d1c6b3a8bfd. PR #240 exact head 96dcf910a724fab2fec1dcba77c9b67d0cee0fe1 passed POS20 run #343; GitHub Pages run #115 succeeded on r13 main; POS20 run #350 passed on that same main including its exact-head cognitive seal; Release Integration Burn-In run #372 passed both stateful integration journeys. No new Firestore write/list surface or Rules publication was required. Multi Season has therefore completed all six MDP lifecycle stages. SSJR remains separate and zero until genuine production-two-account evidence is accepted.'
          };
          ledger.currentScore = 77.5;
          ledger.formattedScore = '77.50/100';
          ledger.summary = {
            featureCount: 20,
            fullyLifecycleDelivered: 13,
            preIntegrationComplete: 0,
            designDefinedOnly: 7,
            reusableFoundationsNotInflated: true,
            interpretation: 'Thirteen SSJR capabilities from shared entry through Multi Season are fully engineered, regression-tested and product-integrated in coherent r13 production. Seven later capabilities remain design-defined only.'
          };
          const multi = ledger.capabilities.find(item => item.id === 'multi-season');
          if (!multi || multi.milestoneWeight !== 8) throw new Error('Expected frozen multi-season weight 8.');
          multi.lifecyclePercent = 100;
          multi.weightedContribution = 8;
          multi.status = 'integrated';
          for (const key of Object.keys(multi.stages)) multi.stages[key] = 'complete';
          multi.evidenceRefs = [
            'SHARED_SHOWDOWN_JOURNEY_MODEL.json',
            'js/sharedMultiSeasonProgression.js',
            'js/sparkSharedMultiSeasonProgression.js',
            'js/productionSharedMultiSeasonProgression.js',
            'tests/contracts/shared-multi-season-progression-contracts.cjs',
            'tests/contracts/shared-multi-season-progression-provider-contracts.cjs',
            'tests/contracts/shared-multi-season-progression-production-contracts.cjs',
            'tests/browser/shared-multi-season-progression-audit.cjs',
            'RELEASE_V1.9.1_R13.md',
            'PR #240 exact candidate head 96dcf910a724fab2fec1dcba77c9b67d0cee0fe1',
            'POS20 run #343 exact-head green',
            'PR #240 merge cfe6f8017c5326bfb23b547830c22d1c6b3a8bfd',
            'GitHub Pages run #115 success',
            'POS20 run #350 main green',
            'Release Integration Burn-In run #372 success'
          ];
          multi.note = 'r13 Shared Multi Season progression completed all six MDP lifecycle stages: deterministic exact-once 1/3/5/10 progression, provider-authoritative contiguous History Convergence, fixed-club/league preservation, fresh-runtime replay, exact candidate validation, expected-head merge, coherent Pages deployment, main POS20 validation and two-pass release burn-in are proven. The capability remains read-only, preserves canonical local storage, adds no paid/list/write authority, and grants zero SSJR credit without production-two-account evidence.';
          ledger.scoreCheck = {
            fullyIntegratedWeight: 75,
            remainingDesignWeight: 25,
            remainingDesignContribution: 2.5,
            calculatedScore: 77.5
          };
          if (!ledger.separationFromSSJR || ledger.separationFromSSJR.ssjrScore !== 0) throw new Error('SSJR separation drift.');
          fs.writeFileSync(ledgerPath, JSON.stringify(ledger) + '\n');

          const readiness = JSON.parse(fs.readFileSync(readinessPath, 'utf8'));
          if (readiness.currentScore !== 0) throw new Error('SSJR must remain zero.');
          readiness.candidateEvidence = readiness.candidateEvidence.filter(item => item.id !== 'ssjr1-multi-season-r13-production');
          readiness.candidateEvidence.push({
            id: 'ssjr1-multi-season-r13-production',
            layers: ['deterministic-behavior','provider-enforcement','isolated-browser-protocol','deployed-runtime'],
            references: [
              'PR #240 exact candidate head 96dcf910a724fab2fec1dcba77c9b67d0cee0fe1',
              'POS20 run #343 exact-head green',
              'PR #240 merge cfe6f8017c5326bfb23b547830c22d1c6b3a8bfd',
              'GitHub Pages run #115 success',
              'POS20 run #350 main green',
              'Release Integration Burn-In run #372 success',
              'js/sharedMultiSeasonProgression.js',
              'js/sparkSharedMultiSeasonProgression.js',
              'js/productionSharedMultiSeasonProgression.js',
              'tests/contracts/shared-multi-season-progression-production-contracts.cjs',
              'tests/browser/shared-multi-season-progression-audit.cjs'
            ],
            relatedCapabilityIds: ['multi-season'],
            credit: 0,
            missingLayers: ['production-two-account'],
            finding: 'r13 Shared Multi Season progression is coherently merged and deployed. Exact candidate and main POS20 plus two-pass release burn-in prove deterministic exact-once 1/3/5/10 progression, provider authority, fixed league/clubs, fresh-runtime replay and zero canonical local-save mutation. It remains zero SSJR credit solely because genuine production-two-account evidence has not yet been accepted.'
          });
          readiness.deliveryProgressTracker.currentScore = 77.5;
          readiness.deliveryProgressTracker.formattedScore = '77.50/100';
          fs.writeFileSync(readinessPath, JSON.stringify(readiness) + '\n');

          let contract = fs.readFileSync(contractPath, 'utf8');
          function replaceOnce(oldText, newText) {
            if (!contract.includes(oldText)) throw new Error(`Missing expected contract text: ${oldText.slice(0, 80)}`);
            contract = contract.replace(oldText, newText);
          }
          replaceOnce('assert.equal(result.score, 70.3, "r12 History Convergence earns product integration only after exact corrected-head validation, expected-head merge, coherent Pages deployment, main POS20 validation and release burn-in.");', 'assert.equal(result.score, 77.5, "r13 Multi Season earns product integration only after exact corrected-head validation, expected-head merge, coherent Pages deployment, main POS20 validation and release burn-in.");');
          replaceOnce('assert.equal(result.formattedScore, "70.30/100");', 'assert.equal(result.formattedScore, "77.50/100");');
          replaceOnce('assert.equal(result.fullyLifecycleDelivered, 12);', 'assert.equal(result.fullyLifecycleDelivered, 13);');
          replaceOnce('assert.equal(result.designDefinedOnly, 8);', 'assert.equal(result.designDefinedOnly, 7);');
          replaceOnce('assert.equal(ledger.basis.mainSha, "637804a9d0e18a88c7a7bb3c79b93d5af2f92062");', `assert.equal(ledger.basis.mainSha, "${mainSha}");`);
          replaceOnce('assert.equal(ledger.basis.integrationMergeSha, "637804a9d0e18a88c7a7bb3c79b93d5af2f92062");', `assert.equal(ledger.basis.integrationMergeSha, "${mainSha}");`);
          replaceOnce('assert.equal(ledger.basis.candidateHead, "f6801366afe5444640f8a1f80270da1b64449e82");', `assert.equal(ledger.basis.candidateHead, "${candidateHead}");`);
          replaceOnce('assert.match(ledger.basis.candidateValidation, /POS20 run #279 exact-head green/);', 'assert.match(ledger.basis.candidateValidation, /POS20 run #343 exact-head green/);');
          replaceOnce('assert.equal(ledger.basis.productionRuntimeRevision, "1.9.1-r12");', 'assert.equal(ledger.basis.productionRuntimeRevision, "1.9.1-r13");');
          replaceOnce('assert.match(ledger.basis.pagesDeployment, /GitHub Pages run #113 success/i);', 'assert.match(ledger.basis.pagesDeployment, /GitHub Pages run #115 success/i);');
          replaceOnce('assert.match(ledger.basis.note, /POS20 run #284 passed/i);', 'assert.match(ledger.basis.note, /POS20 run #350 passed/i);');
          replaceOnce('assert.match(ledger.basis.note, /Release Integration Burn-In run #370 passed both/i);', 'assert.match(ledger.basis.note, /Release Integration Burn-In run #372 passed both/i);');
          const r12Anchor = '  assert.equal(ssjrReadiness.remainingCapabilityIds.includes("history-convergence"), true, "History Convergence remains uncredited in SSJR until production-two-account evidence is accepted.");\n';
          if (!contract.includes(r12Anchor)) throw new Error('Missing r12 candidate anchor.');
          contract = contract.replace(r12Anchor, r12Anchor + `\n  const r13Candidate = ssjrReadiness.candidateEvidence.find(item => item.id === "ssjr1-multi-season-r13-production");\n  assert.ok(r13Candidate, "SSJR readiness must preserve truthful zero-credit r13 production evidence.");\n  assert.equal(r13Candidate.credit, 0);\n  assert.deepEqual(r13Candidate.relatedCapabilityIds, ["multi-season"]);\n  for (const layer of ["deterministic-behavior","provider-enforcement","isolated-browser-protocol","deployed-runtime"]) assert.ok(r13Candidate.layers.includes(layer), \`r13 candidate evidence missing \${layer}\`);\n  assert.ok(r13Candidate.missingLayers.includes("production-two-account"));\n  for (const expected of ["PR #240 exact candidate head 96dcf910","POS20 run #343 exact-head green","PR #240 merge cfe6f801","GitHub Pages run #115 success","POS20 run #350 main green","Release Integration Burn-In run #372 success"]) assert.ok(r13Candidate.references.some(ref => ref.includes(expected)), \`r13 evidence missing \${expected}\`);\n  assert.equal(ssjrReadiness.remainingCapabilityIds.includes("multi-season"), true, "Multi Season remains uncredited in SSJR until production-two-account evidence is accepted.");\n`);
          replaceOnce('"career-start","transfer-challenge","results-publication","season-commit","canonical-scoring","history-convergence"\n  ]);', '"career-start","transfer-challenge","results-publication","season-commit","canonical-scoring","history-convergence","multi-season"\n  ]);');
          const historyEvidenceAnchor = '  for (const expected of ["PR #235 exact candidate head f6801366","POS20 run #279 exact-head green","PR #235 merge 637804a9","GitHub Pages run #113 success","POS20 run #284 main green","Release Integration Burn-In run #370 success"]) assert.ok(historyConvergence.evidenceRefs.some(ref => ref.includes(expected)), `History Convergence integration evidence missing ${expected}`);\n';
          if (!contract.includes(historyEvidenceAnchor)) throw new Error('Missing history evidence anchor.');
          contract = contract.replace(historyEvidenceAnchor, historyEvidenceAnchor + `\n  const multiSeasonIntegrated = ledger.capabilities.find(capability => capability.id === "multi-season");\n  assert.equal(multiSeasonIntegrated.weightedContribution, 8);\n  for (const ref of ["js/sharedMultiSeasonProgression.js","js/sparkSharedMultiSeasonProgression.js","js/productionSharedMultiSeasonProgression.js","tests/contracts/shared-multi-season-progression-production-contracts.cjs","tests/browser/shared-multi-season-progression-audit.cjs"]) assert.ok(multiSeasonIntegrated.evidenceRefs.includes(ref), \`Multi Season evidence missing \${ref}\`);\n  for (const expected of ["PR #240 exact candidate head 96dcf910","POS20 run #343 exact-head green","PR #240 merge cfe6f801","GitHub Pages run #115 success","POS20 run #350 main green","Release Integration Burn-In run #372 success"]) assert.ok(multiSeasonIntegrated.evidenceRefs.some(ref => ref.includes(expected)), \`Multi Season integration evidence missing \${expected}\`);\n`);
          replaceOnce('assert.equal(ledger.scoreCheck.fullyIntegratedWeight, 67);', 'assert.equal(ledger.scoreCheck.fullyIntegratedWeight, 75);');
          replaceOnce('assert.equal(ledger.scoreCheck.remainingDesignWeight, 33);', 'assert.equal(ledger.scoreCheck.remainingDesignWeight, 25);');
          replaceOnce('assert.equal(ledger.scoreCheck.remainingDesignContribution, 3.3);', 'assert.equal(ledger.scoreCheck.remainingDesignContribution, 2.5);');
          replaceOnce('assert.equal(ledger.scoreCheck.calculatedScore, 70.3);', 'assert.equal(ledger.scoreCheck.calculatedScore, 77.5);');
          replaceOnce('current ${result.formattedScore} r12 integrated ledger', 'current ${result.formattedScore} r13 integrated ledger');
          fs.writeFileSync(contractPath, contract);

          fs.writeFileSync('NEXT_TASK.md', `# Current product task under POS20\n\nPrimary objective: advance MDP-1 to 100.00/100 before returning primary focus to SSJR production-two-account acceptance. SSJR-1.1 remains 0/100 until genuine production-two-account evidence is accepted.\n\nCurrent integrated product authority is r13 Multi Season on main cfe6f8017c5326bfb23b547830c22d1c6b3a8bfd. After the r13 accounting-only PR lands, MDP-1 is 77.50/100. Accounting or handoff packaging earns no additional MDP or SSJR credit.\n\nImmediate feature is journey-reconnect, frozen milestone weight 5. Continue the isolated branch feat/ssjr-journey-reconnect-r14 from live main authority. Reuse existing Remote Joining, rivalry-scoped Shared Setup, History Convergence and Multi Season recovery primitives, but do not count those predecessor primitives as Journey Reconnect implementation credit until they are wired end-to-end. Expired/revoked/closed sessions must never authorize recovery; a fresh exact ACTIVE session for the same rivalry may reauthorize the already durable shared journey without reset, redraw, regression or canonical local Save mutation. Prove offline hold, reload/fresh-runtime recovery, expiry requiring a fresh session, idempotent re-entry, terminal non-resurrection and deterministic final state.\n\nFor every capability, award lifecycle stages only from exact-head evidence. Candidate work cannot earn product-integration credit. Require exact candidate POS20, expected-head merge, coherent Pages deployment, main POS20 and two-pass release burn-in before the final product-integration stage. Never combine CI evidence across heads.\n\nPermanent locks remain: billing OFF, Firebase Spark only, App Check enforcement OFF, memory-only Firestore, popup-only Google Auth, exactly two private managers, pairing plus exact ACTIVE session before league/club or recovered shared authority, Candidate C sole destructive Apply with exact rollback, canonical local storage unchanged, no public discovery/community/rankings.\n`);
          NODE
          rm .github/workflows/one-shot-mdp-r13-accounting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONE_DELIVERY_PROGRESS.json SHARED_SHOWDOWN_JOURNEY_READINESS.json tests/contracts/milestone-delivery-progress-contracts.cjs NEXT_TASK.md .github/workflows/one-shot-mdp-r13-accounting.yml
          git commit -m "MDP: record r13 Multi Season integration at 77.50"
          git push origin HEAD:chore/mdp-r13-integration-77-50
