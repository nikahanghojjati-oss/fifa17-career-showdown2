name: Temporary v1.1.5 Handoff Freeze

on:
  push:
    branches:
      - agent/v1.1.5-maintenance

permissions:
  contents: write

jobs:
  update-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.5-maintenance
          fetch-depth: 0
      - name: Update rolling handoff current state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('CAREER_MODE_SHOWDOWN_V1.1.5_MAINTENANCE_HANDOFF.md')
          text=p.read_text()
          old='''## Current release state

Runtime bug fixes and future-cloud contract groundwork are implemented on draft PR #25. Version identity deliberately remains v1.1.4 while the functional maintenance head is being attacked by permanent gates. Do not bump to v1.1.5 merely to make documentation look complete.

The next legal action is to make the functional head fully green, including the two new real-browser maintenance scenarios, then perform the coherent v1.1.5 / `1.1.5-r1` identity freeze and full two-pass release protocol. No v1.2 implementation begins until v1.1.5 is deployed and twice-proven.'''
          new='''## Release-freeze continuation

The earlier functional phase intentionally kept release identity at v1.1.4 until behavior was proven. That phase is now closed: functional head `dbcdffaae927163e5a9c8b44466ff2084e814de5` passed all 14 permanent workflow families, including Candidate C twice-browser recovery, Stability two-cycle Chromium and Burn-In 5/5.

After that proof, release identity was migrated as one exact guarded transaction. The first temporary identity-helper run failed safely before commit because it expected nine shell revision references; source inspection proved the legitimate topology is ten (revision meta, eager stylesheet, Reus portrait and seven eager scripts). The corrected helper then committed `Freeze v1.1.5 runtime identity` at `882be077a1bc0caa4ddee17630a624f7bc934e47`, aligning package, lockfile, `APP_VERSION`, visual-fidelity query, shell revision, Reus cache reference, seven eager scripts and visible footer to v1.1.5 / `1.1.5-r1`. The temporary identity helper was removed immediately afterward.

Current-facing authority was then rebuilt/reconciled: `00_DEVELOPER_START_HERE.md` and `NEXT_TASK.md` were rewritten for the maintenance release; README, PROJECT_STATE, POST_V1_ROADMAP_EXECUTION and CHANGELOG received guarded current-state updates; historical release evidence remains historical. The temporary documentation helper was removed after its successful commit.

Current release-candidate truth:

- application candidate: v1.1.5;
- runtime/cache revision: `1.1.5-r1`;
- draft PR: #25;
- current public production until merge: immutable v1.1.4 runtime `1a498441a6ccf557aa8b8bc7ced2b3d9cd22cdf7`;
- two major fixes: immutable confirmed restore intent and transaction-owned rollback with strict raw preconditions/anti-clobber ownership checks;
- cloud identity/revision/conflict/tombstone/privacy/security work: future contract only, no runtime backend;
- next substantive milestone after proof: v1.2.0 Installable Offline App.

The only legal current work is to freeze one exact helper-free PR #25 SHA, pass all 14 permanent families twice independently on that SHA, merge with expected-head protection, prove exact Pages bytes plus Candidate A/B/C and the full public journey twice, then create the v1.1.5 post-merge documentation seal. No v1.2 implementation begins until that production proof is complete.'''
          count=text.count(old)
          if count!=1: raise SystemExit(f'expected one stale current-state block, found {count}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Commit handoff freeze state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CAREER_MODE_SHOWDOWN_V1.1.5_MAINTENANCE_HANDOFF.md
          git diff --cached --check
          git commit -m "Record v1.1.5 release freeze in handoff"
          git push origin HEAD:agent/v1.1.5-maintenance
