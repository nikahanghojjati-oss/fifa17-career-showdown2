name: One-time Pairing R3 Hardening

on:
  push:
    branches:
      - fix/pairing-copy-four-code-contract-2026-09-02

permissions:
  contents: write

jobs:
  harden-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/pairing-copy-four-code-contract-2026-09-02
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Apply r3 copy/one-paste automation hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('js/sparkPrivatePairing.js')
          s=p.read_text()
          old='''      const createButton=createElement("button","menuButton settingsConnectedAccountButton","CREATE PAIRING CODE");createButton.type="button";createButton.disabled=pairingState.busy||!bindings.length;\n      const codeInput=createElement("input","settingsConnectedAccountInput");codeInput.type="text";codeInput.placeholder="Paste private pairing code";codeInput.autocomplete="off";codeInput.spellcheck=false;codeInput.setAttribute("aria-label","Private pairing code");\n      const joinButton=createElement("button","menuButton settingsConnectedAccountButton","JOIN PRIVATE PAIRING");joinButton.type="button";joinButton.disabled=pairingState.busy||!bindings.length;\n'''
          new='''      const createButton=createElement("button","menuButton settingsConnectedAccountButton","CREATE PAIRING CODE");createButton.type="button";createButton.disabled=pairingState.busy||!bindings.length;\n      const codeInput=createElement("input","settingsConnectedAccountInput");codeInput.type="text";codeInput.placeholder="Paste private pairing code";codeInput.autocomplete="off";codeInput.spellcheck=false;codeInput.setAttribute("aria-label","Private pairing code");\n      if(pairingState.status==="paired"&&pairingState.capability){codeInput.value=pairingState.capability;codeInput.readOnly=true;codeInput.setAttribute("aria-readonly","true");}\n      const joinButton=createElement("button","menuButton settingsConnectedAccountButton","JOIN PRIVATE PAIRING");joinButton.type="button";joinButton.disabled=pairingState.busy||!bindings.length||pairingState.status==="paired";\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''        try{const context=await resolveConnectedContext();const result=await redeemPairing({user:context.user,firestore:context.services.firestore,firebaseSdk:context.services.firestoreSdk,identity:context.identity,binding,capability:codeInput.value,cryptoImpl:root.crypto});if(!result.ok)throw errorWithCode(result.code,result.message);codeInput.value="";setState({status:"paired",busy:false,capability:result.capability,expiresAtEpochMs:null,message:"Private managers are paired. Connected Rivalry below will use this exact rivalry ID automatically; no second copy, paste, or manual Attach is required in the normal flow."});}\n'''
          new='''        try{const context=await resolveConnectedContext();const result=await redeemPairing({user:context.user,firestore:context.services.firestore,firebaseSdk:context.services.firestoreSdk,identity:context.identity,binding,capability:codeInput.value,cryptoImpl:root.crypto});if(!result.ok)throw errorWithCode(result.code,result.message);setState({status:"paired",busy:false,capability:result.capability,expiresAtEpochMs:null,message:"Private managers are paired. The one code pasted above is retained as the exact Connected Rivalry ID, and Connected Rivalry below uses that same value automatically; no second copy, paste, or manual Attach is required in the normal flow."});}\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''      form.append(select,createButton,codeInput,joinButton);panel.appendChild(form);\n      if(pairingState.capability){const capabilityBox=createElement("div","settingsDataNote");capabilityBox.append(createElement("strong","",pairingState.status==="paired"?"CONNECTED RIVALRY ID: ":"PRIVATE PAIRING CODE: "),createElement("code","",pairingState.capability));panel.appendChild(capabilityBox);}\n'''
          new='''      form.append(select,createButton,codeInput,joinButton);panel.appendChild(form);\n      if(pairingState.capability){\n        const capabilityBox=createElement("div","settingsDataNote");\n        const capabilityText=createElement("code","",pairingState.capability);\n        capabilityBox.append(createElement("strong","",pairingState.status==="paired"?"CONNECTED RIVALRY ID · ONE PASTE CONFIRMED: ":"PRIVATE PAIRING CODE · COPY ONCE: "),capabilityText);\n        panel.appendChild(capabilityBox);\n        if(pairingState.status==="pair-open"){\n          const copyButton=createElement("button","menuButton settingsConnectedAccountButton","COPY PAIRING CODE");\n          copyButton.type="button";\n          copyButton.setAttribute("aria-label","Copy generated private pairing code");\n          copyButton.addEventListener("click",async()=>{\n            const capability=pairingState.capability;\n            if(!capability)return;\n            let copied=false;\n            if(root.navigator&&root.navigator.clipboard&&typeof root.navigator.clipboard.writeText==="function"){\n              try{await root.navigator.clipboard.writeText(capability);copied=true;}catch(_error){copied=false;}\n            }\n            if(!copied){\n              const fallbackCopy=createElement("textarea","settingsConnectedAccountInput");\n              fallbackCopy.value=capability;\n              fallbackCopy.readOnly=true;\n              fallbackCopy.setAttribute("aria-hidden","true");\n              fallbackCopy.style.position="fixed";\n              fallbackCopy.style.opacity="0";\n              fallbackCopy.style.pointerEvents="none";\n              root.document.body.appendChild(fallbackCopy);\n              fallbackCopy.focus();\n              fallbackCopy.setSelectionRange(0,capability.length);\n              try{copied=Boolean(root.document.execCommand&&root.document.execCommand("copy"));}catch(_error){copied=false;}\n              fallbackCopy.remove();\n            }\n            if(copied){setState({message:"Pairing code copied. Paste it exactly once into Player Two's Join Private Pairing field; Player One and Player Two Connected Rivalry will use the same ID automatically."});return;}\n            if(root.getSelection&&root.document.createRange){\n              const selection=root.getSelection();\n              const range=root.document.createRange();\n              range.selectNodeContents(capabilityText);\n              selection.removeAllRanges();\n              selection.addRange(range);\n            }\n            const status=panel.querySelector('[role="status"]');\n            if(status)status.textContent="Automatic clipboard copy was unavailable. The full pairing code is selected; use your browser Copy command. The code itself was not changed.";\n          });\n          panel.appendChild(copyButton);\n        }\n      }\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))

          for rel in ['index.html','js/app.js','js/menuExperience.js','js/sparkRemoteJoining.js','manifest.webmanifest','service-worker.js']:
              q=Path(rel); t=q.read_text(); assert '1.9.0-r2' in t, rel; q.write_text(t.replace('1.9.0-r2','1.9.0-r3'))
          q=Path('service-worker.js'); t=q.read_text(); old='const PREVIOUS_RUNTIME_REVISION = "1.8.1-r5";'; assert old in t; q.write_text(t.replace(old,'const PREVIOUS_RUNTIME_REVISION = "1.9.0-r2";',1))

          q=Path('tests/contracts/release-shell-coherence-contracts.cjs'); t=q.read_text();
          t=t.replace('RELEASE_V1.9.0_R2.md','RELEASE_V1.9.0_R3.md').replace('assert.equal(runtime,"1.9.0-r2");','assert.equal(runtime,"1.9.0-r3");').replace('assert.equal(previous,"1.8.1-r5");','assert.equal(previous,"1.9.0-r2");')
          q.write_text(t)

          q=Path('tests/support/run-contract-suite.cjs'); t=q.read_text(); marker='  "tests/contracts/stage3-private-pairing-contracts.cjs",\n'; assert marker in t; q.write_text(t.replace(marker,marker+'  "tests/contracts/pairing-four-code-automation-contracts.cjs",\n',1))

          q=Path('package.json'); t=q.read_text(); old='node tests/browser/stage3-private-pairing-audit.cjs && node tests/browser/stage4-remote-local-reconciliation-audit.cjs'; assert old in t; q.write_text(t.replace(old,'node tests/browser/stage3-private-pairing-audit.cjs && node tests/browser/pairing-four-code-automation-audit.cjs && node tests/browser/stage4-remote-local-reconciliation-audit.cjs',1))

          q=Path('.github/workflows/validate-stage3-private-pairing.yml'); t=q.read_text();
          old='''      - name: Run deterministic Stage 3 client contracts\n        run: node tests/contracts/stage3-private-pairing-contracts.cjs\n'''
          new='''      - name: Run deterministic Stage 3 client contracts\n        run: |\n          node tests/contracts/stage3-private-pairing-contracts.cjs\n          node tests/contracts/pairing-four-code-automation-contracts.cjs\n'''
          assert old in t; t=t.replace(old,new,1)
          old='''          node tests/browser/stage3-private-pairing-audit.cjs\n          node tests/browser/stage5b-device-credential-audit.cjs\n'''
          new='''          node tests/browser/stage3-private-pairing-audit.cjs\n          node tests/browser/pairing-four-code-automation-audit.cjs\n          node tests/browser/stage5b-device-credential-audit.cjs\n'''
          assert old in t; q.write_text(t.replace(old,new,1))

          runbook=Path('STAGE5E_PRODUCTION_REMOTE_JOINING_ACCEPTANCE_RUNBOOK_2026-09-02.md')
          t=runbook.read_text()
          section='''\n## v1.9.0-r3 four-code / one-paste acceptance gate\n\nBefore owner production testing, the automation must prove that the exact same full private capability is visible in four places without transformation: (1) Player One generated pairing code, (2) Player One Connected Rivalry prefill/attachment, (3) Player Two Join Private Pairing field after exactly one paste, and (4) Player Two Connected Rivalry attachment. Player One uses the new `COPY PAIRING CODE` button directly under the generated full code. Player Two pastes that value exactly once. After successful join the Player Two input retains the exact value as read-only evidence and the Join button is disabled.\n\nAfter Player Two joins, Player One must not press `VERIFY / REATTACH` during normal acceptance. Player One returns to Save Library or opens Private Remote Joining, allowing normal Connected Rivalry initialization to verify the provider-active rivalry and persist the existing pointer automatically. If manual Verify/Reattach is required, stop and record the automation as failed instead of masking it.\n\nThe full `pair_...` capability remains private. Never paste it into chat or retain it in screenshots; fully redact/crop it.\n'''
          if '## v1.9.0-r3 four-code / one-paste acceptance gate' not in t: runbook.write_text(t.rstrip()+section+'\n')
          PY

          cat > RELEASE_V1.9.0_R3.md <<'EOF'
          # Career Mode Showdown v1.9.0-r3 — Pairing Copy + Four-Code One-Paste Hardening

          Status: RELEASE CANDIDATE

          Application version: `v1.9.0`

          Runtime asset revision: `1.9.0-r3`

          Previous known-good runtime: `1.9.0-r2`

          ## Purpose

          This bounded runtime hardening makes the private-pairing-to-Connected-Rivalry automation directly observable and smoother before the real Stage 5E production Remote Joining acceptance. Player One receives an explicit `COPY PAIRING CODE` action directly beneath the full generated private capability. The copy action copies the exact full value without shortening or transforming it and has a safe browser fallback.

          Player Two still pastes only once into Join Private Pairing. After successful redemption, that exact value remains visible in the join field as read-only evidence, the Join action is disabled against accidental replay, and Connected Rivalry uses the same exact ID automatically. The intended four representations — Player One generated code, Player One Connected Rivalry, Player Two one-paste join input, and Player Two Connected Rivalry — must be byte-for-byte identical.

          After Player Two joins, Player One does not manually reattach. The next normal Save Library or Private Remote Joining initialization verifies the provider-active rivalry through the existing Connected Rivalry authority and persists the normal IndexedDB pointer automatically. Manual Verify/Reattach remains recovery-only and counts as an acceptance failure if required in the normal flow.

          ## Ultra-regression proof

          A deterministic two-account contract repeats the complete capability equality and active-authority path 25 times. A dedicated Chromium audit repeats fresh Player One creator and Player Two joiner contexts three times each, including exact clipboard copy, Player One prefill, Player One post-join automatic initialization, exactly one Player Two paste event, retained read-only join evidence, disabled replay action, and exact Player Two Connected Rivalry attachment. Existing Stage 3 pairing, Stage 4 Connected Rivalry, Stage 5E Remote Joining, stability, release, emulator and full repository gates remain mandatory.

          ## Safety boundary

          This change adds no Firebase authority, polling, collection listing, new persistent capability store, gameplay mutation, canonical localStorage mutation or billing service. Firebase remains Spark. Billing remains forbidden. Firestore persistence remains memory-only. App Check enforcement remains OFF. Candidate C remains the sole destructive remote-to-local gameplay Apply authority. No public discovery, lobby, matchmaking, community or rankings surface is introduced.

          ## RJR accounting

          Fixed RJR-1 remains `87/100` through source, automated proof, review, merge and deployment. RJR can rise only after the owner completes the newly unblocked real production two-account Remote Joining lifecycle and the evidence is reconciled.
          EOF

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax and deterministic ultra-proof
        run: |
          node --check js/sparkPrivatePairing.js
          node --check tests/browser/pairing-four-code-automation-audit.cjs
          node tests/contracts/stage3-private-pairing-contracts.cjs
          node tests/contracts/stage4-connected-rivalry-pointer-restore-contracts.cjs
          node tests/contracts/pairing-four-code-automation-contracts.cjs

      - name: Repeated Chromium four-code automation proof
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-r3-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/browser/stage3-private-pairing-audit.cjs
          node tests/browser/pairing-four-code-automation-audit.cjs
          node tests/browser/stage5e-remote-joining-audit.cjs

      - name: Full repository contract gate
        run: npm run test:contracts

      - name: Remove one-time automation workflow
        run: rm .github/workflows/automation-pairing-r3-hardening.yml

      - name: Commit validated r3 hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden pairing copy and four-code one-paste automation"
          git push origin HEAD:fix/pairing-copy-four-code-contract-2026-09-02
