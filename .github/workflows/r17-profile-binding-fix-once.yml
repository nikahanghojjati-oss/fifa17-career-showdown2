name: r17 profile binding fix once

on:
  push:
    branches:
      - feat/ssjr-final-reconciliation-r17
    paths:
      - .github/workflows/r17-profile-binding-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: feat/ssjr-final-reconciliation-r17
      - name: Guard exact staging parent
        run: |
          test "$(git rev-parse HEAD^)" = "c53371f8c8382ff840c4212a5569c4bb0e5422ae"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/r17-profile-binding-fix-once.yml"
      - name: Apply profile-aware context correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def sub_once(path, pattern, repl, flags=0):
              p=Path(path)
              text=p.read_text()
              out,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n != 1:
                  raise SystemExit(f"{path}: expected regex once, got {n}")
              p.write_text(out)
          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected literal once, got {n}")
              p.write_text(text.replace(old,new,1))
          save_repl="    function runtimeActiveContext(value){\n        const refs=runtimeManagerProfileRefs(value);\n        return {\n            saveId:value&&value.identity&&typeof value.identity.saveId===\"string\"?value.identity.saveId:null,\n            rivalryId:value&&value.sharedJourney&&value.sharedJourney.mode===\"shared\"&&typeof value.sharedJourney.rivalryId===\"string\"?value.sharedJourney.rivalryId:null,\n            playerOneProfileId:refs.playerOne,\n            playerTwoProfileId:refs.playerTwo\n        };\n    }\n    function runtimeSetCurrentShowdownReference"
          sub_once("js/saveLibraryRuntime.js",r'    function runtimeActiveContext\(value\)\{\n.*?\n    \}\n    function runtimeSetCurrentShowdownReference',save_repl,re.S)
          replace_once("js/saveLibraryRuntime.js",'        if(previous.saveId===current.saveId&&previous.rivalryId===current.rivalryId)return;\n','        if(previous.saveId===current.saveId&&previous.rivalryId===current.rivalryId&&previous.playerOneProfileId===current.playerOneProfileId&&previous.playerTwoProfileId===current.playerTwoProfileId)return;\n')
          request_line='  function pfrRequest(){const s=pfrShowdown();if(!s||s.sharedJourney?.mode!=="shared")return null;const rivalryId=String(s.sharedJourney?.rivalryId||"").trim(),saveId=String(s.identity?.saveId||"").trim(),playerOneProfileId=String(s.identity?.managerProfileIds?.playerOne||"").trim(),playerTwoProfileId=String(s.identity?.managerProfileIds?.playerTwo||"").trim();if(!rivalryId||!/^save_[0-9a-f]{24}$/.test(saveId)||!/^profile_[0-9a-f]{24}$/.test(playerOneProfileId)||!/^profile_[0-9a-f]{24}$/.test(playerTwoProfileId))return null;return Object.freeze({rivalryId,saveId,playerOneProfileId,playerTwoProfileId,key:`${saveId}|${rivalryId}|${playerOneProfileId}|${playerTwoProfileId}|final-reconciliation`});}'
          sub_once("js/productionSharedFinalReconciliation.js",r'^  function pfrRequest\(\)\{.*$',request_line,re.M)
          snapshot_line='  function pfrSnapshotsMatch(request,multiState,historyState,localState){const role=String(localState?.binding?.managerRole||"");const activeProfileId=role==="playerOne"?request?.playerOneProfileId:role==="playerTwo"?request?.playerTwoProfileId:"";return Boolean(request&&multiState&&historyState&&localState&&String(multiState.rivalryId||"")===request.rivalryId&&String(historyState.rivalryId||"")===request.rivalryId&&String(localState.binding?.saveId||"")===request.saveId&&activeProfileId&&String(localState.binding?.profileId||"")===activeProfileId);}'
          sub_once("js/productionSharedFinalReconciliation.js",r'^  function pfrSnapshotsMatch\(request,multiState,historyState,localState\)\{.*$',snapshot_line,re.M)
          old_showdown='function showdownFor(role,rid=rivalryId,managerSlots=slots,names={playerOne:"Daniel",playerTwo:"Nik"}){const slot=managerSlots[role==="playerOne"?0:1];return {id:Date.now(),identity:{saveId:slot.saveId},managers:names,sharedJourney:{mode:"shared",rivalryId:rid}};}\n'
          new_showdown='function showdownFor(role,rid=rivalryId,managerSlots=slots,names={playerOne:"Daniel",playerTwo:"Nik"}){const slot=managerSlots[role==="playerOne"?0:1];return {id:Date.now(),identity:{saveId:slot.saveId,managerProfileIds:{playerOne:managerSlots[0].profileId,playerTwo:managerSlots[1].profileId}},managers:names,sharedJourney:{mode:"shared",rivalryId:rid}};}\n'
          replace_once("tests/browser/shared-final-reconciliation-audit.cjs",old_showdown,new_showdown)
          old_recovered='  const recovered=await api.refresh();assert.equal(recovered.phase,"FINAL_SEASON_RECONCILED","Returning to exact A canonical identity must recover on a fresh refresh.");assert.equal(recovered.winner,"playerOne");assert.deepEqual(race.writes,[]);\n'
          new_recovered='  const recovered=await api.refresh();assert.equal(recovered.phase,"FINAL_SEASON_RECONCILED","Returning to exact A canonical identity must recover on a fresh refresh.");assert.equal(recovered.winner,"playerOne");\n  const originalIdentity={...race.context.currentShowdown.identity,managerProfileIds:{...race.context.currentShowdown.identity.managerProfileIds}};\n  const reboundProfile=`profile_${"9".repeat(24)}`;\n  race.context.currentShowdown.identity={...originalIdentity,managerProfileIds:{...originalIdentity.managerProfileIds,playerOne:reboundProfile}};\n  assert.equal(api.getState(),null,"Changing only the active manager profile must immediately make the old published view inaccessible with unchanged save+rivalry IDs.");\n  race.listeners.get("career-mode-active-save-changed")?.();await flush();\n  assert.equal(api.getState(),null,"The synchronous active-save notification must keep a profile-rebound view invalidated.");\n  assert.equal(await api.refresh(),null,"A Local Reconciliation binding for the previous profile must not reconcile after active profile rebinding.");\n  race.context.currentShowdown.identity=originalIdentity;\n  const reboundRecovered=await api.refresh();assert.equal(reboundRecovered.phase,"FINAL_SEASON_RECONCILED","Restoring the exact active manager profile must permit a fresh exact reconciliation.");assert.deepEqual(race.writes,[]);\n'
          replace_once("tests/browser/shared-final-reconciliation-audit.cjs",old_recovered,new_recovered)
          replace_once("tests/contracts/shared-final-reconciliation-production-contracts.cjs",'assert.match(production,/s\\.identity\\?\\.saveId/);assert.doesNotMatch(production,/s\\.id\\|\\|s\\.saveId/);','assert.match(production,/s\\.identity\\?\\.saveId/);assert.match(production,/managerProfileIds\\?\\.playerOne/);assert.match(production,/managerProfileIds\\?\\.playerTwo/);assert.match(production,/localState\\.binding\\?\\.profileId/);assert.doesNotMatch(production,/s\\.id\\|\\|s\\.saveId/);')
          replace_once("tests/contracts/shared-final-reconciliation-production-contracts.cjs",'assert.match(saveRuntime,/previous\\.saveId===current\\.saveId&&previous\\.rivalryId===current\\.rivalryId/);','assert.match(saveRuntime,/previous\\.saveId===current\\.saveId&&previous\\.rivalryId===current\\.rivalryId&&previous\\.playerOneProfileId===current\\.playerOneProfileId&&previous\\.playerTwoProfileId===current\\.playerTwoProfileId/);')
          PY
      - name: Validate focused correction
        run: |
          node tests/contracts/shared-final-reconciliation-contracts.cjs
          node tests/contracts/shared-final-reconciliation-production-contracts.cjs
          node tests/browser/shared-final-reconciliation-audit.cjs
          npm run test:ssjr
          npm run test:ops
          git diff --check
      - name: Commit correction and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/saveLibraryRuntime.js js/productionSharedFinalReconciliation.js tests/browser/shared-final-reconciliation-audit.cjs tests/contracts/shared-final-reconciliation-production-contracts.cjs
          git commit -m "fix: bind final reconciliation to active manager profile"
          git rm .github/workflows/r17-profile-binding-fix-once.yml
          git commit -m "chore: remove r17 profile binding one-shot"
          git push origin HEAD:feat/ssjr-final-reconciliation-r17
