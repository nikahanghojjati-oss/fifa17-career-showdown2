name: r16 MDP Accounting One Shot

on:
  push:
    branches:
      - chore/mdp-r16-accounting-91-00
    paths:
      - .github/workflows/r16-mdp-accounting-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/mdp-r16-accounting-91-00
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply accounting update
        run: python3 scripts/r16-mdp-accounting-one-shot.py
      - name: Validate accounting authority
        run: |
          node tests/contracts/milestone-delivery-progress-contracts.cjs
          node scripts/assess-milestone-delivery-progress.mjs MILESTONE_DELIVERY_PROGRESS_MODEL.json MILESTONE_DELIVERY_PROGRESS.json SHARED_SHOWDOWN_JOURNEY_MODEL.json
          npm run test:ops
      - name: Require accounting-only diff
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "MILESTONE_DELIVERY_PROGRESS.json NEXT_TASK.md R16_MDP_ACCOUNTING_BOUNDARY.md SHARED_SHOWDOWN_JOURNEY_READINESS.json tests/contracts/milestone-delivery-progress-contracts.cjs "
      - name: Commit validated accounting and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MILESTONE_DELIVERY_PROGRESS.json NEXT_TASK.md R16_MDP_ACCOUNTING_BOUNDARY.md SHARED_SHOWDOWN_JOURNEY_READINESS.json tests/contracts/milestone-delivery-progress-contracts.cjs
          git commit -m "chore: record Local Reconciliation integration at MDP 91.00"
          git rm .github/workflows/r16-mdp-accounting-one-shot.yml scripts/r16-mdp-accounting-one-shot.py
          git commit -m "chore: remove r16 accounting publisher"
          git push origin HEAD:chore/mdp-r16-accounting-91-00
