name: r15 POS20 registry anchor correction
on:
  push:
    branches:
      - feat/ssjr-journey-conflicts-r15
    paths:
      - '.github/workflows/r15-pos20-registry-anchor-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ssjr-journey-conflicts-r15
      - name: Add r15 supplemental contract constants
        shell: python
        run: |
          from pathlib import Path
          p=Path('tests/operations/pos20-control-plane.test.mjs')
          text=p.read_text()
          old="const journeyReconnectProductionContract='tests/contracts/shared-journey-reconnect-production-contracts.cjs';\nconst supplementalRegistry="
          new="const journeyReconnectProductionContract='tests/contracts/shared-journey-reconnect-production-contracts.cjs';\nconst journeyConflictsContract='tests/contracts/shared-journey-conflicts-contracts.cjs';\nconst journeyConflictsProductionContract='tests/contracts/shared-journey-conflicts-production-contracts.cjs';\nconst supplementalRegistry="
          if old not in text: raise SystemExit('r15 constant anchor missing')
          text=text.replace(old,new,1)
          old_array='multiSeasonProductionContract,journeyReconnectContract,journeyReconnectProductionContract];'
          new_array='multiSeasonProductionContract,journeyReconnectContract,journeyReconnectProductionContract,journeyConflictsContract,journeyConflictsProductionContract];'
          if old_array not in text: raise SystemExit('r15 expected array anchor missing')
          text=text.replace(old_array,new_array,1)
          p.write_text(text)
      - name: Commit correction and remove one-shot
        run: |
          rm .github/workflows/r15-pos20-registry-anchor-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: register r15 conflict contracts in POS20 authority'
          git push origin HEAD:feat/ssjr-journey-conflicts-r15
