name: r17 third review guarded fix

on:
  push:
    branches:
      - feat/ssjr-final-reconciliation-r17
    paths:
      - '.github/workflows/r17-third-review-fix.yml'

permissions:
  contents: write

jobs:
  fix-r17-save-switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ssjr-final-reconciliation-r17
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require exact superseded third-review head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Apply exact save-switch invalidation correction
        shell: python
        run: |
          from pathlib import Path

          save = Path('js/saveLibraryRuntime.js')
          s = save.read_text()
          old = '    function runtimeGetCurrentShowdownReference(){return typeof currentShowdown!=="undefined"?currentShowdown:null;}\n    function runtimeSetCurrentShowdownReference(value){if(typeof currentShowdown!=="undefined")currentShowdown=value;}\n'
          new = '''    function runtimeGetCurrentShowdownReference(){return typeof currentShowdown!=="undefined"?currentShowdown:null;}\n    function runtimeActiveContext(value){\n        return {\n            saveId:value&&value.identity&&typeof value.identity.saveId==="string"?value.identity.saveId:null,\n            rivalryId:value&&value.sharedJourney&&value.sharedJourney.mode==="shared"&&typeof value.sharedJourney.rivalryId==="string"?value.sharedJourney.rivalryId:null\n        };\n    }\n    function runtimeSetCurrentShowdownReference(value){\n        if(typeof currentShowdown==="undefined")return;\n        const previous=runtimeActiveContext(currentShowdown);\n        currentShowdown=value;\n        const current=runtimeActiveContext(value);\n        if(previous.saveId===current.saveId&&previous.rivalryId===current.rivalryId)return;\n        try{\n            if(typeof root.dispatchEvent==="function"&&typeof root.CustomEvent==="function")root.dispatchEvent(new root.CustomEvent("career-mode-active-save-changed",{detail:{previous,current}}));\n        }catch(error){console.warn("[Career Mode Showdown] Active Save Library change notification failed.",error);}\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit('saveLibraryRuntime central setter did not match exactly once')
          save.write_text(s.replace(old,new,1))

          prod = Path('js/productionSharedFinalReconciliation.js')
          p = prod.read_text()
          old_event='"career-mode-connected-account-state-change","career-mode-showdown-state-change"'
          new_event='"career-mode-connected-account-state-change","career-mode-showdown-state-change","career-mode-active-save-changed"'
          if p.count(old_event) != 1:
              raise SystemExit('Final Reconciliation event list did not match exactly once')
          prod.write_text(p.replace(old_event,new_event,1))

          contract=Path('tests/contracts/shared-final-reconciliation-production-contracts.cjs')
          c=contract.read_text()
          old_read='const protocol=read("js/sharedFinalReconciliation.js"),production=read("js/productionSharedFinalReconciliation.js"),ssjr=read("js/ssjr.js"),shell=read("service-worker.js"),pkg=JSON.parse(read("package.json"));'
          new_read='const protocol=read("js/sharedFinalReconciliation.js"),production=read("js/productionSharedFinalReconciliation.js"),saveRuntime=read("js/saveLibraryRuntime.js"),ssjr=read("js/ssjr.js"),shell=read("service-worker.js"),pkg=JSON.parse(read("package.json"));'
          if c.count(old_read)!=1:
              raise SystemExit('production contract read list did not match once')
          c=c.replace(old_read,new_read,1)
          anchor='assert.match(production,/career-mode-showdown-state-change/);'
          replacement='assert.match(production,/career-mode-showdown-state-change/);assert.match(production,/career-mode-active-save-changed/);assert.match(saveRuntime,/function runtimeSetCurrentShowdownReference\\(value\\)/);assert.match(saveRuntime,/new root\\.CustomEvent\\("career-mode-active-save-changed"/);assert.match(saveRuntime,/previous\\.saveId===current\\.saveId&&previous\\.rivalryId===current\\.rivalryId/);'
          if c.count(anchor)!=1:
              raise SystemExit('production contract event anchor did not match once')
          contract.write_text(c.replace(anchor,replacement,1))

          audit=Path('tests/browser/shared-final-reconciliation-audit.cjs')
          a=audit.read_text()
          anchor='leftContext.context.CareerModeProductionSharedFinalReconciliation.install();rightContext.context.CareerModeProductionSharedFinalReconciliation.install();'
          replacement=anchor+'\n  assert.equal(typeof leftContext.listeners.get("career-mode-active-save-changed"),"function","Final Reconciliation must subscribe to the synchronous Save Library active-context event.");'
          if a.count(anchor)!=1:
              raise SystemExit('browser audit install anchor did not match once')
          audit.write_text(a.replace(anchor,replacement,1))
      - name: Validate focused and aggregate r17 correction
        run: |
          npm run test:ssjr:final-reconciliation
          npm run test:ssjr
          npm run test:ops
          node tests/contracts/static-app-release-contracts.cjs
          node tests/contracts/release-shell-coherence-contracts.cjs
          node tests/contracts/offline-hotfix-contracts.cjs
          git diff --check
      - name: Commit exact product correction and self-clean
        run: |
          rm .github/workflows/r17-third-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: invalidate r17 on active Save Library switch'
          git push origin HEAD:feat/ssjr-final-reconciliation-r17
