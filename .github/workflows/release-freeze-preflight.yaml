name: Temporary v1.1.4 Release Freeze Preflight

on:
  push:
    branches: [agent/v1.1.4-release-freeze]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit stale active release literals and run release contracts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ACTIVE 1.1.3-r1 REFERENCES ==='
          grep -RIn --exclude='RELEASE_V1.1.3.md' --exclude='CAREER_MODE_SHOWDOWN_V1.1.3_*' --exclude='*.png' --exclude='*.webp' '1\.1\.3-r1' js .github/workflows tests package.json package-lock.json 00_DEVELOPER_START_HERE.md README.md PROJECT_STATE.md NEXT_TASK.md CHANGELOG.md || true
          echo '=== ACTIVE 1.1.2 FALLBACK REFERENCES ==='
          grep -RIn '"1\.1\.2"\|v1\.1\.2' js .github/workflows tests package.json package-lock.json || true
          echo '=== CONTRACT SUITE ==='
          npm run test:contracts
          echo '=== LEGACY WORKFLOW BLOCK SUITE ==='
          npm run test:legacy-workflows
