name: TEMP Stage 5E r4 pointer patch v3

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-pointer-patch-v3.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
          fetch-depth: 0
      - name: Apply exact bounded repair and evidence recalculation
        shell: bash
        run: |
          python -c "import base64,zlib;open('/tmp/r4patch.py','wb').write(zlib.decompress(base64.b64decode(''))"
          python /tmp/r4patch.py
      - name: Validate deterministic repair
        run: |
          node --check js/sparkConnectedRivalry.js
          node --check tests/browser/pairing-four-code-automation-audit.cjs
          node tests/contracts/pairing-four-code-automation-contracts.cjs
          node -e 'const r=require("./REMOTE_JOINING_READINESS.json"); const d=r.domains.find(x=>x.id==="devices-pairing-connected-rivalry-remote-join"); if(r.currentScore!==88||!d||d.earned!==21) process.exit(1); console.log("PASS RJR-1 88/100")'
          git diff --check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/sparkConnectedRivalry.js tests/browser/pairing-four-code-automation-audit.cjs tests/contracts/pairing-four-code-automation-contracts.cjs REMOTE_JOINING_READINESS.json RJR_RECALCULATION_STAGE5E_R3_LIFECYCLE_2026-09-02.md
          git commit -m "Fix stale Connected Rivalry pointer precedence"
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
