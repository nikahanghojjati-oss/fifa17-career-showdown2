name: PR117 Deployed App Check Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/browser/home-visual-audit.cjs"
      - "tests/browser/production-app-check-runtime-audit.cjs"
      - ".github/workflows/validate-stability-lane.yml"
      - ".github/workflows/pr117-deployed-proof.yml"

permissions:
  contents: read

jobs:
  deployed-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked stability dependencies
        run: npm ci

      - name: Prove production App Check token path
        env:
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: node tests/browser/production-app-check-runtime-audit.cjs

      - name: Re-run Home visual audit against deployed Pages
        env:
          CMS_AUDIT_RUN: pr117-deployed-proof
          CMS_BASE_URL: https://nikahanghojjati-oss.github.io/fifa17-career-showdown2/
        run: npm run test:home-visual
