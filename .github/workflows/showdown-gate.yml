        run: |
          set -euo pipefail
          if [[ "$GATE_EVENT" == "pull_request" ]]; then base="$GATE_BASE_SHA"; else base="$GATE_BEFORE_SHA"; fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then git fetch --no-tags --depth=1 origin "$base"; fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: 'TEST: Compute Showdown Gate route'
        id: route
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/showdown-gate.mjs route --lane L7-${{ matrix.leg }} --out "$RUNNER_TEMP/route.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.route.outputs.l7_run == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Firebase emulator and npx caches
        if: steps.route.outputs.l7_run == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm/_npx
          key: showdown-gate-L6-emulators-ubuntu-24.04-firebase-tools-15.27.0-15.28.1-v1
      - name: Restore Playwright and Chromium browser caches
        if: steps.route.outputs.l7_run == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/ms-playwright
            /tmp/cms-chromium-runtime
          key: showdown-gate-browsers-ubuntu-24.04-playwright-1.62.1-chromium-149.0.0-v1
      - name: Install locked dependencies
        if: steps.route.outputs.l7_run == 'true'
        run: npm ci
      # firebase@12.17.0: 12.17.1 breaks emulator sign-in in the browser journeys (CE2PG), so L6 and L7 pin 12.17.0.
      - name: Install pinned Firebase emulator test dependencies
        if: steps.route.outputs.l7_run == 'true'
        run: npm install --no-save --package-lock=false firebase@12.17.0 @firebase/rules-unit-testing@5.0.1 firebase-admin@14.2.0
      - name: 'TEST: Ironman leg (fault journey or 3-season CE2PG, seeded, one rerun)'
        id: ironman
        if: steps.route.outputs.l7_run == 'true'
        env:
          CMS_CHROMIUM_MULTI_CONTEXT: '1'
          IRONMAN_SEED: ${{ steps.route.outputs.seed }}
          # The heavy set (epilogue points) runs when the route says so; fail-closed in scripts/showdown-gate.mjs l7Decision.
          IRONMAN_EPILOGUE: ${{ steps.route.outputs.l7_heavy }}
        run: node scripts/ironman-leg.mjs --leg ${{ matrix.leg }} --seed "$IRONMAN_SEED" --seasons 3 --epilogue "$IRONMAN_EPILOGUE" --out "test-results/ironman-${{ matrix.leg }}.json"
      - name: Upload Ironman reports
        if: always() && steps.route.outputs.l7_run == 'true'
