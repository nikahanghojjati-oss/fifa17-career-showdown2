          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/showdown-gate.mjs route --lane L2 --out "$RUNNER_TEMP/route.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.route.outputs.has_full == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        if: steps.route.outputs.has_full == 'true'
        run: npm ci
      - name: 'TEST: Proof group FULL'
