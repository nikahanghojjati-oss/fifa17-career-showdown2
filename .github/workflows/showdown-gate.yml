      - name: Upload lane record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: showdown-gate-lane-L3
          path: ${{ runner.temp }}/lane/lane.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

