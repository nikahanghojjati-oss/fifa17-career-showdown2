          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/showdown-gate.mjs route --lane L3 --out "$RUNNER_TEMP/route.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Firebase emulator and npx caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm/_npx
          key: showdown-gate-L3-emulators-ubuntu-24.04-firebase-tools-15.27.0-15.28.1-v1
      - name: Install locked dependencies
        run: npm ci
      - name: 'TEST: Proof group STORAGE'
        id: proof_storage
        if: steps.route.outputs.has_storage == 'true'
        env:
          POS20_SELECTED_PROOFS: ${{ steps.route.outputs.proofs_csv }}
          POS20_PROOF_GROUP: STORAGE
        run: node scripts/pos10-proof-runner.mjs --proofs "$POS20_SELECTED_PROOFS" --group "$POS20_PROOF_GROUP"
      - name: Stop the STORAGE proof static server before the next server group
        if: steps.route.outputs.has_storage == 'true'
        shell: bash
        run: |
          pkill -f 'node tests/support/static-server.cjs' || true
          for attempt in 1 2 3 4 5; do pgrep -f 'node tests/support/static-server.cjs' >/dev/null || break; sleep 1; done
      - name: 'TEST: Proof group VISUAL'
        id: proof_visual
        if: steps.route.outputs.has_visual == 'true'
        env:
          POS20_SELECTED_PROOFS: ${{ steps.route.outputs.proofs_csv }}
          POS20_PROOF_GROUP: VISUAL
        run: node scripts/pos10-proof-runner.mjs --proofs "$POS20_SELECTED_PROOFS" --group "$POS20_PROOF_GROUP"
      - name: Install pinned Firebase emulator test dependencies
        run: npm install --no-save --package-lock=false firebase@12.17.1 @firebase/rules-unit-testing@5.0.1 firebase-admin@14.2.0
      - name: 'TEST: Build the composed production Rules'
        id: gf_rules
        run: |
          node scripts/build-production-firestore-rules.mjs
          node scripts/build-production-firestore-rules-with-persistent-pair.mjs
          node scripts/assert-firestore-zero-billing-boundary.mjs
      - name: 'TEST: Shared Setup provider matrix'
        id: gf_setup
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-setup "node tests/firebase/shared-showdown-setup-production-provider-emulator.cjs"
      - name: 'TEST: Transfer fresh-session recovery'
        id: gf_transfer
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-transfer "node tests/firebase/shared-transfer-challenge-fresh-session-emulator.cjs"
      - name: 'TEST: Gameplay lifecycle (1 and 3 seasons)'
        id: gf_lifecycle
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-lifecycle "CMS_SHOWDOWN_LENGTH=1 node tests/firebase/shared-gameplay-provider-lifecycle-emulator.cjs && CMS_SHOWDOWN_LENGTH=3 node tests/firebase/shared-gameplay-provider-lifecycle-emulator.cjs"
      - name: 'TEST: Terminal Close matrix'
        id: gf_terminal
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-terminal "node tests/firebase/shared-terminal-close-production-provider-emulator.cjs"
      - name: 'TEST: Persistent Nik and Daniel pair matrix'
        id: gf_pair
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-pair "node tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs"
      - name: 'TEST: Two-manager journey (3 and 10 seasons, session expires and is re-joined mid-game)'
        id: gf_journey
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-journey "CMS_SHOWDOWN_LENGTH=3 node tests/firebase/two-manager-journey-emulator.cjs && CMS_SHOWDOWN_LENGTH=10 node tests/firebase/two-manager-journey-emulator.cjs"
      - name: 'TEST: Career index matrix'
        id: gf_career_index
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-career-index "node tests/firebase/career-index-emulator.cjs && CMS_CAREER_INDEX_ENFORCED=1 node tests/firebase/career-index-emulator.cjs"
      - name: 'TEST: Completed-only read matrix'
        id: gf_completed_read
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-completed-read "node tests/firebase/completed-showdown-read-emulator.cjs"
      - name: 'TEST: Closed-Showdown adapter journey'
        id: gf_closed_adapter
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-closed-adapter "node tests/firebase/closed-showdown-adapter-emulator.cjs"
      - name: 'TEST: Completed transfer history matrix'
