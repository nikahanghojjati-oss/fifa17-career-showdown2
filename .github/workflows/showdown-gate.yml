# Showdown Gate: the PR check set since 2026-10-10 (Nik chose the switch after a READY exit report). It
# replaces Validate POS20 and Validate Gameplay Fast, which stay archived (manual dispatch only) for rollback.
# Six lanes run in parallel; each lane computes its own route with the unchanged POS20 router (no shared
# selector job), and the seal requires every lane green on the exact head with every routed id executed.
# GATE_COVERAGE.json maps every command of the 16 old gates to a step here, and
# tests/contracts/showdown-gate-coverage-contracts.cjs enforces it. Every job is read-only and every checkout
# sets persist-credentials: false; helper preemption runs only in the trusted default-branch Physio workflow
# (gate-watchdog.yml).
name: Showdown Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: showdown-gate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}-{1}', github.ref_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  l1-core:
    name: L1 core
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact diff base
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GATE_EVENT" == "pull_request" ]]; then base="$GATE_BASE_SHA"; else base="$GATE_BEFORE_SHA"; fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then git fetch --no-tags --depth=1 origin "$base"; fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: 'TEST: Compute Showdown Gate route'
        id: route
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/showdown-gate.mjs route --lane L1 --out "$RUNNER_TEMP/route.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Firebase emulator and npx caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm/_npx
          key: showdown-gate-L1-emulators-ubuntu-24.04-firebase-tools-15.27.0-15.28.1-v1
      - name: Install locked dependencies
        run: npm ci
      - name: 'TEST: POS20 cognitive benchmark'
        id: benchmark
        run: npm run work:benchmark
      - name: 'TEST: Operations audit'
        id: operations
        run: npm run test:ops
      - name: 'TEST: Product contracts (every registered contract)'
        id: contracts
        run: npm run test:contracts
      - name: 'TEST: Proof group INLINE'
        id: proof_inline
        if: steps.route.outputs.has_inline == 'true'
        env:
          POS20_SELECTED_PROOFS: ${{ steps.route.outputs.proofs_csv }}
          POS20_PROOF_GROUP: INLINE
        run: node scripts/pos10-proof-runner.mjs --proofs "$POS20_SELECTED_PROOFS" --group "$POS20_PROOF_GROUP"
      - name: 'TEST: Proof group STATIC'
        id: proof_static
        if: steps.route.outputs.has_static == 'true'
        env:
          POS20_SELECTED_PROOFS: ${{ steps.route.outputs.proofs_csv }}
          POS20_PROOF_GROUP: STATIC
        run: node scripts/pos10-proof-runner.mjs --proofs "$POS20_SELECTED_PROOFS" --group "$POS20_PROOF_GROUP"
      - name: 'TEST: Build the composed production Rules and assert zero billing'
        id: rules
        run: |
          node scripts/build-production-firestore-rules.mjs
          node scripts/build-production-firestore-rules-with-persistent-pair.mjs
          node scripts/assert-firestore-zero-billing-boundary.mjs
      - name: Record lane result
        if: always()
        shell: bash
        env:
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          GATE_JOB_STATUS: ${{ job.status }}
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node scripts/showdown-gate.mjs finalize --lane L1 --route "$RUNNER_TEMP/route.json" --out "$RUNNER_TEMP/lane/lane.json"
      - name: Upload lane record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: showdown-gate-lane-L1
          path: ${{ runner.temp }}/lane/lane.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

