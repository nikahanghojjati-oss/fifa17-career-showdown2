  seal:
    name: seal
    needs: [l1-core, l2-browser-full, l3a, l3b, l4-remote, l5-rules-regression, l6-browser-journey, l7-ironman, l8-pos1m]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
