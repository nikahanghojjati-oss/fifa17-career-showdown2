      - name: Restore Firebase emulator and npx caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.route.outputs.l5_run == 'true'
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm/_npx
          key: showdown-gate-L5-emulators-ubuntu-24.04-firebase-tools-15.27.0-15.28.1-v1
      - name: Install locked dependencies
        if: steps.route.outputs.l5_run == 'true'
        run: npm ci
      - name: Install pinned Firebase emulator test dependencies
        if: steps.route.outputs.l5_run == 'true'
        run: npm install --no-save --package-lock=false firebase@12.17.1 @firebase/rules-unit-testing@5.0.1 firebase-admin@14.2.0
      - name: 'TEST: Composed production Rules regression matrix'
        id: regression
        if: steps.route.outputs.l5_run == 'true'
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-composed "node tests/firebase/composed-production-rules-regression.cjs"
      - name: Record lane result
        if: always()
        shell: bash
        env:
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          GATE_JOB_STATUS: ${{ job.status }}
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node scripts/showdown-gate.mjs finalize --lane L5 --route "$RUNNER_TEMP/route.json" --out "$RUNNER_TEMP/lane/lane.json"
      - name: Upload lane record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: showdown-gate-lane-L5
          path: ${{ runner.temp }}/lane/lane.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  l6-browser-journey:
    name: L6 browser journey
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact diff base
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GATE_EVENT" == "pull_request" ]]; then base="$GATE_BASE_SHA"; else base="$GATE_BEFORE_SHA"; fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then git fetch --no-tags --depth=1 origin "$base"; fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: 'TEST: Compute Showdown Gate route'
        id: route
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/showdown-gate.mjs route --lane L6 --out "$RUNNER_TEMP/route.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Firebase emulator and npx caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm/_npx
          key: showdown-gate-L6-emulators-ubuntu-24.04-firebase-tools-15.27.0-15.28.1-v1
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Firebase emulator test dependencies
        run: npm install --no-save --package-lock=false firebase@12.17.0 @firebase/rules-unit-testing@5.0.1 firebase-admin@14.2.0
      - name: 'TEST: Build the composed production Rules'
        id: rules
        run: |
          node scripts/build-production-firestore-rules.mjs
          node scripts/build-production-firestore-rules-with-persistent-pair.mjs
          node scripts/assert-firestore-zero-billing-boundary.mjs
      - name: 'TEST: Two-manager browser journey'
        id: journey
        env:
          CMS_CHROMIUM_MULTI_CONTEXT: '1'
          CMS_BROWSER_JOURNEY_ARTIFACTS: ${{ runner.temp }}/browser-journey
        run: npx --yes firebase-tools@15.28.1 emulators:exec --config tests/browser/support/firebase.browser-journey.json --only auth,firestore --project demo-cms-browser-journey "CMS_SHOWDOWN_LENGTH=3 node tests/browser/two-manager-browser-journey.cjs"
      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-journey-screens
          path: ${{ runner.temp }}/browser-journey
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Record lane result
        if: always()
        shell: bash
        env:
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          GATE_JOB_STATUS: ${{ job.status }}
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node scripts/showdown-gate.mjs finalize --lane L6 --route "$RUNNER_TEMP/route.json" --out "$RUNNER_TEMP/lane/lane.json"
      - name: Upload lane record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: showdown-gate-lane-L6
          path: ${{ runner.temp }}/lane/lane.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  seal:
    name: seal
    needs: [l1-core, l2-browser-full, l3-storage-visual-gameplay, l4-remote, l5-rules-regression, l6-browser-journey]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact diff base
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GATE_EVENT" == "pull_request" ]]; then base="$GATE_BASE_SHA"; else base="$GATE_BEFORE_SHA"; fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then git fetch --no-tags --depth=1 origin "$base"; fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: 'SEAL: Recompute the route independently of every lane'
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        continue-on-error: true
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/showdown-gate.mjs route --out "$RUNNER_TEMP/route.json"
      - name: Download lane records
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: showdown-gate-lane-*
          path: ${{ runner.temp }}/lanes
      - name: 'SEAL: Require every lane green on this exact head with every routed id run'
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_DRAFT: ${{ github.event.pull_request.draft == true }}
          GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          GATE_NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/showdown-gate.mjs seal --route "$RUNNER_TEMP/route.json" --lanes-dir "$RUNNER_TEMP/lanes" --out "$RUNNER_TEMP/gate-summary/gate-summary.json"
      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: showdown-gate-summary
          path: ${{ runner.temp }}/gate-summary/gate-summary.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
