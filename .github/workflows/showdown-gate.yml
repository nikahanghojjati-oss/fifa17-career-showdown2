  # L7 Ironman (Phoenix W10): the fault-injection journey, one job per fault (each with its own emulators), plus one 3-season
  # CE2PG. Routed by scripts/showdown-gate.mjs (l7Decision): on a PR into a release branch it runs only when game or journey
  # files change; a skip is recomputed and verified by the seal. Seeded from the head; a failure reruns once with the same seed
  # (scripts/ironman-leg.mjs): a second failure is red, a pass on the rerun is FLAKY (listed by the seal, filed and fixed).
  l7-ironman:
    name: L7 Ironman ${{ matrix.leg }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        leg: [none, network, lock, evict, reload, tabkill, twotabs, quota, coldoffline, swap, skew, double, listener, lostreply, ce2pg]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact diff base
        shell: bash
        env:
          GATE_EVENT: ${{ github.event_name }}
