          GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          GATE_JOB_STATUS: ${{ job.status }}
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
        run: node scripts/showdown-gate.mjs finalize --lane L7-${{ matrix.leg }} --route "$RUNNER_TEMP/route.json" --ironman "test-results/ironman-${{ matrix.leg }}.json" --out "$RUNNER_TEMP/lane/lane.json"
      - name: Upload lane record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: showdown-gate-lane-L7-${{ matrix.leg }}
          path: ${{ runner.temp }}/lane/lane.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

