        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-completed-transfer "node tests/firebase/completed-transfer-history-emulator.cjs"
      - name: 'TEST: Season commit concurrent acknowledge'
        id: gf_season_ack
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-cms-gameplay-fast-season-ack "node tests/firebase/shared-season-commit-concurrent-acknowledge-emulator.cjs"
      - name: Record lane result
        if: always()
        shell: bash
        env:
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
