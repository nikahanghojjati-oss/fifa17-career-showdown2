          GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/showdown-gate.mjs route --lane L5 --out "$RUNNER_TEMP/route.json" --github-output "$GITHUB_OUTPUT"
      - name: Fetch production main for the reviewed Rules delta
        if: steps.route.outputs.l5_run == 'true'
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.route.outputs.l5_run == 'true'
        with:
          distribution: temurin
