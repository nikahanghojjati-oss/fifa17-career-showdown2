name: R18 Menu Integrity Repair Once

on:
  push:
    branches: [feat/ssjr-terminal-close-r18]
    paths: [.github/workflows/r18-menu-repair-once.yml]

permissions:
  contents: write

jobs:
  repair-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Restore exact pre-edit menu and apply only r18 cache identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e624d19e04c0ca56f33fa7f0d25fdcc42eb99eda HEAD
          git show c8a9eea09629ee31f1fb9ff18cae42e3126c9b76:js/menuExperience.js > js/menuExperience.js
          sed -i 's/assets\/marco-reus-2015-cc-by.webp?v=1.9.1-r17/assets\/marco-reus-2015-cc-by.webp?v=1.9.1-r18/' js/menuExperience.js
          sed -i 's/rulesList(nationalities)/rulesList(nationalityIds)/' scripts/build-production-firestore-rules.mjs
          git rm .github/workflows/r18-menu-repair-once.yml
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Prove restored menu semantics
        run: |
          node tests/contracts/final-polish-feedback.cjs
          node tests/contracts/static-app-release-contracts.cjs
      - name: Prove r18 focused suite still green
        shell: bash
        run: |
          node tests/contracts/shared-terminal-close-contracts.cjs
          node tests/contracts/shared-terminal-close-provider-contracts.cjs
          node tests/contracts/shared-terminal-close-rules-contracts.cjs
          node tests/contracts/shared-terminal-close-production-contracts.cjs
          node tests/browser/shared-terminal-close-audit.cjs
      - name: Commit narrow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nikahanghojjati-oss"
          git config user.email "nikahang.hojjati@gmail.com"
          git add -A
          git commit -m "fix: preserve menu feedback ordering in r18 shell"
          git push origin HEAD:feat/ssjr-terminal-close-r18
