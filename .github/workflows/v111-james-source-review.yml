name: V111 James Source Review

on:
  push:
    branches:
      - agent/v1.1.1-james-real-madrid-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Download Real Madrid-era Commons candidates
        run: |
          mkdir -p source-review
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/4/48/James_Rodr%C3%ADguez_in_September_2016_-_01.jpg' -o source-review/james-sep-2016-01.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/f/f3/James_Rodr%C3%ADguez_in_September_2016_-_02.jpg' -o source-review/james-sep-2016-02.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/4/4a/James_Rodr%C3%ADguez_in_January_2017.jpg' -o source-review/james-jan-2017.jpg
      - name: Build source and crop review sheets
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          from pathlib import Path
          root=Path('source-review')
          items=[
            ('Sep 2016 01', root/'james-sep-2016-01.jpg'),
            ('Sep 2016 02', root/'james-sep-2016-02.jpg'),
            ('Jan 2017', root/'james-jan-2017.jpg'),
            ('Current 2019 derivative', Path('assets/football/james-rodriguez-real-madrid-2019-smart-r5.webp')),
          ]
          font=ImageFont.load_default()
          cards=[]
          for label,path in items:
              im=Image.open(path).convert('RGB')
              card=Image.new('RGB',(440,590),'white')
              fitted=ImageOps.contain(im,(420,520))
              card.paste(fitted,((440-fitted.width)//2,10))
              d=ImageDraw.Draw(card)
              d.text((10,540),f'{label} | {im.width}x{im.height}',fill='black',font=font)
              cards.append(card)
          sheet=Image.new('RGB',(880,1180),(230,230,230))
          for i,card in enumerate(cards): sheet.paste(card,((i%2)*440,(i//2)*590))
          sheet.save(root/'james-source-contact-sheet.jpg',quality=92)

          # Candidate authored crops intentionally preserve full head and enough torso/context.
          crop_specs={
            'sep-2016-01-crop-a':('james-sep-2016-01.jpg',(70,0,790,1010)),
            'sep-2016-01-crop-b':('james-sep-2016-01.jpg',(120,0,760,990)),
            'sep-2016-02-crop-a':('james-sep-2016-02.jpg',(40,0,830,1040)),
            'jan-2017-full':('james-jan-2017.jpg',(0,0,384,480)),
          }
          cards=[]
          for label,(fname,box) in crop_specs.items():
              src=Image.open(root/fname).convert('RGB')
              crop=src.crop(box)
              card=Image.new('RGB',(440,590),'white')
              fitted=ImageOps.contain(crop,(420,520))
              card.paste(fitted,((440-fitted.width)//2,10))
              d=ImageDraw.Draw(card)
              d.text((10,540),f'{label} | crop {box} | {crop.width}x{crop.height}',fill='black',font=font)
              cards.append(card)
          sheet=Image.new('RGB',(880,1180),(230,230,230))
          for i,card in enumerate(cards): sheet.paste(card,((i%2)*440,(i//2)*590))
          sheet.save(root/'james-crop-contact-sheet.jpg',quality=92)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v111-james-source-review-${{ github.sha }}
          path: source-review/
          if-no-files-found: error
