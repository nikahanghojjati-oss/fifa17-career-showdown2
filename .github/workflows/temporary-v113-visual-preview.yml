name: Temporary v1.1.3 Visual Preview

on:
  push:
    branches:
      - v1.1.3-candidate-c-visual-fixes
    paths:
      - tests/browser/v113-visual-preview.cjs
      - css/footballVisuals-v113.css
      - data/footballVisuals.js
      - js/footballVisuals.js
      - js/screens.js
      - js/optionalModules.js
      - assets/football/**
      - .github/workflows/temporary-v113-visual-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-v113-visual-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out build branch
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Run 11-screen cinematic visual preview audit
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-v113-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/browser/v113-visual-preview.cjs
      - name: Upload v1.1.3 visual screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v113-cinematic-visual-preview-${{ github.sha }}
          path: test-results/v113-*.png
          if-no-files-found: warn
          retention-days: 7
