name: PR260 product path fix
on:
  push:
    branches:
      - feat/persistent-nik-daniel-pair
    paths:
      - .github/workflows/pr260-product-path-fix.yml
permissions:
  contents: write
jobs:
  fix-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply guarded product-path patch
        run: python scripts/pr260-final-product-path-fix.py
      - name: Run targeted product and release proofs
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check js/persistentNikDanielPair.js
          node --check js/showdown.js
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          node tests/contracts/shared-showdown-production-runtime-contracts.cjs
          node tests/contracts/static-app-release-contracts.cjs
          node tests/contracts/final-polish-presentation.cjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pr260-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node tests/browser/shared-showdown-paired-first-entry-audit.cjs
      - name: Reprove persistent-pair provider Rules
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false firebase@12.7.0 @firebase/rules-unit-testing@5.0.0 firebase-admin@13.4.0
          node scripts/build-production-firestore-rules-with-persistent-pair.mjs
          npx --yes firebase-tools@14.16.0 emulators:exec --only firestore --project demo-career-mode-showdown-persistent-pair-final-paths "node tests/firebase/persistent-nik-daniel-pair-provider-emulator.cjs"
      - name: Publish clean product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/pr260-final-product-path-fix.py
          git checkout -- package-lock.json firestore.spark.generated.rules 2>/dev/null || true
          git add js/persistentNikDanielPair.js js/showdown.js tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          git diff --cached --check
          git commit -m "fix(pr260): close final pairing product paths"
          git push origin HEAD:feat/persistent-nik-daniel-pair
