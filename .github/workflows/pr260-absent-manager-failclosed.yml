name: PR260 absent manager failclosed
on:
  push:
    branches:
      - feat/persistent-nik-daniel-pair
    paths:
      - .github/workflows/pr260-absent-manager-failclosed.yml
permissions:
  contents: write
jobs:
  fix-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply exact fail-closed manager guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('js/showdown.js')
          text=source.read_text()
          old='const m=showdown.managers;if(m&&(m.playerOne!=="Daniel"||m.playerTwo!=="Nik"))'
          new='const m=showdown.managers;if(!m||m.playerOne!=="Daniel"||m.playerTwo!=="Nik")'
          if old not in text:
              raise SystemExit('expected canonical manager guard not found')
          source.write_text(text.replace(old,new,1))
          test=Path('tests/contracts/persistent-nik-daniel-pair-contracts.cjs')
          contract=test.read_text()
          anchor="assert.throws(()=>showdownSandbox.normalizeShowdown({managers:{playerOne:'Alex',playerTwo:'Sam'}}),error=>error&&error.code==='SHOWDOWN_MANAGER_MAPPING_UNSUPPORTED','Every noncanonical historical manager mapping must fail closed instead of being attributed to Daniel and Nik.');\n"
          addition="assert.throws(()=>showdownSandbox.normalizeShowdown({}),error=>error&&error.code==='SHOWDOWN_MANAGER_MAPPING_UNSUPPORTED','A historical save without a manager map must fail closed instead of inheriting Daniel/Nik labels over unknown role-bound history.');\nassert.throws(()=>showdownSandbox.normalizeShowdown({managers:null}),error=>error&&error.code==='SHOWDOWN_MANAGER_MAPPING_UNSUPPORTED','A null historical manager map must fail closed.');\n"
          if anchor not in contract:
              raise SystemExit('expected manager-map assertion anchor not found')
          if addition not in contract:
              contract=contract.replace(anchor,anchor+addition,1)
          test.write_text(contract)
          PY
      - name: Run focused product and release proofs
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check js/showdown.js
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          node tests/contracts/save-library-runtime-contracts.cjs
          node tests/contracts/save-library-product-contracts.cjs
          node tests/contracts/static-app-release-contracts.cjs
          node tests/contracts/final-polish-presentation.cjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pr260-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node tests/browser/shared-showdown-paired-first-entry-audit.cjs
      - name: Publish clean product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/showdown.js tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          git diff --cached --check
          git commit -m "fix(pr260): reject absent historical manager maps"
          git push origin HEAD:feat/persistent-nik-daniel-pair
