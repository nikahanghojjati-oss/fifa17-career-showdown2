name: R5 Rashford Source Review

on:
  push:
    branches: [agent/r5-smart-player-photo-rebuild]
    paths:
      - 'tools/r5_image_candidate_review.py'
      - '.github/workflows/r5-rashford-source-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4
      - name: Build 2017 Rashford source sheets
        run: python tools/r5_image_candidate_review.py
      - name: Upload Rashford review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r5-rashford-2017-review-${{ github.sha }}
          path: |
            test-results/r5-rashford-2017-*-source-contact-sheet.jpg
            test-results/r5-player-source-report.txt
            test-results/r5-player-source-failures.txt
          if-no-files-found: error
          retention-days: 3
