name: Post Merge Documentation Seal

on:
  push:
    branches:
      - agent/v1.1.5-maintenance

permissions:
  contents: write

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.1.5-maintenance
          fetch-depth: 0
      - name: Patch bounded current-facing documentation
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/seal.py
          python /tmp/seal.py
      - name: Commit documentation seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POST_V1_ROADMAP_EXECUTION.md CHANGELOG.md CAREER_MODE_SHOWDOWN_V1.1.5_MAINTENANCE_HANDOFF.md
          git diff --cached --check
          git commit -m "Seal v1.1.5 roadmap changelog and handoff after production proof"
          git push origin HEAD:agent/v1.1.5-maintenance
