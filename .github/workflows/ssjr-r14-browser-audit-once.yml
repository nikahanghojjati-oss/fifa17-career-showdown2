name: SSJR r14 browser audit once

on:
  push:
    branches:
      - feat/ssjr-journey-reconnect-r14
    paths:
      - .github/workflows/ssjr-r14-browser-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ssjr-journey-reconnect-r14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install deterministic test dependencies
        run: npm ci
      - name: Run bounded r14 contracts and two-context browser audit
        run: |
          node tests/contracts/shared-journey-reconnect-contracts.cjs
          node tests/contracts/shared-journey-reconnect-production-contracts.cjs
          node tests/support/static-server.cjs >/tmp/r14-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CMS_CHROMIUM_MULTI_CONTEXT=1 node tests/browser/shared-journey-reconnect-audit.cjs
      - name: Delete successful one-shot audit workflow
        run: |
          rm .github/workflows/ssjr-r14-browser-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ssjr-r14-browser-audit-once.yml
          git diff --cached --check
          git commit -m "chore: close successful r14 browser audit publisher"
          git push origin HEAD:feat/ssjr-journey-reconnect-r14
