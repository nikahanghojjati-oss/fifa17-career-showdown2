name: Temporary v1.1.3 Current Authority Alignment

on:
  push:
    branches: [v1.1.3-candidate-c-visual-fixes]
    paths:
      - tools/stage_v113_escaped_revision_regexes.py
      - .github/workflows/temporary-apply-v113-current-authority.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-v113-current-authority
  cancel-in-progress: false

jobs:
  stage-workflow-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.1.3-candidate-c-visual-fixes
          fetch-depth: 1
      - name: Correct exact escaped release revision regexes
        run: python tools/stage_v113_escaped_revision_regexes.py
      - name: Guard protected budgets and current identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const maximumInitialAssetBytes = 165000;' .github/workflows/validate-static-app.yml
          grep -F 'const maximumCompressedInitialAssetBytes = 37500;' .github/workflows/validate-static-app.yml
          grep -F 'assert.ok(rawBytes <= 165000' .github/workflows/validate-final-polish.yml
          grep -F 'assert.ok(compressedBytes <= 37500' .github/workflows/validate-final-polish.yml
          grep -F '1\.1\.3-r\d+' .github/workflows/validate-menu-bootstrap.yml
          grep -F '1\.1\.3-r\d+' .github/workflows/validate-statistics-workstream.yml
      - name: Stage exact two-workflow correction and expose Git object IDs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-statistics-workstream.yml \
                  .github/workflows/validate-menu-bootstrap.yml
          git commit -m 'Correct remaining v1.1.3 escaped revision regexes'
          echo "STAGED_COMMIT=$(git rev-parse HEAD)"
          echo "STAGED_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:v1.1.3-candidate-c-visual-fixes || echo 'EXPECTED_WORKFLOW_PERMISSION_REFUSAL'
