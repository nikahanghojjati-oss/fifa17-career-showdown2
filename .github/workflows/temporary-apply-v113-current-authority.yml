name: Temporary v1.1.3 Current Authority Alignment

on:
  push:
    branches: [v1.1.3-candidate-c-visual-fixes]
    paths:
      - tools/stage_remaining_v113_workflow_identity.py
      - .github/workflows/temporary-apply-v113-current-authority.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-v113-current-authority
  cancel-in-progress: false

jobs:
  stage-workflow-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.1.3-candidate-c-visual-fixes
          fetch-depth: 1
      - name: Apply exact six-workflow identity alignment
        run: python tools/stage_remaining_v113_workflow_identity.py
      - name: Guard protected budgets and historical records
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const maximumInitialAssetBytes = 165000;' .github/workflows/validate-static-app.yml
          grep -F 'const maximumCompressedInitialAssetBytes = 37500;' .github/workflows/validate-static-app.yml
          grep -F 'assert.ok(rawBytes <= 165000' .github/workflows/validate-final-polish.yml
          grep -F 'assert.ok(compressedBytes <= 37500' .github/workflows/validate-final-polish.yml
          grep -F 'Runtime asset revision: `1.1.2-r1`' RELEASE_V1.1.2.md
          grep -F 'Runtime asset revision: `1.1.1-r1`' RELEASE_V1.1.1.md
          grep -F 'Runtime asset revision: `1.1.0-r1`' RELEASE_V1.1.0.md
      - name: Stage exact patched workflow tree and expose Git object IDs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-v1-visual-immersion.yml \
                  .github/workflows/validate-final-polish.yml \
                  .github/workflows/validate-statistics-workstream.yml \
                  .github/workflows/validate-menu-bootstrap.yml \
                  .github/workflows/validate-v110-release-burnin.yml \
                  .github/workflows/validate-static-app.yml
          if git diff --cached --quiet; then
            echo 'No remaining workflow delta.'
            echo "STAGED_COMMIT=$(git rev-parse HEAD)"
            echo "STAGED_TREE=$(git rev-parse HEAD^{tree})"
            exit 0
          fi
          git commit -m 'Stage remaining v1.1.3 workflow identity alignment'
          echo "STAGED_COMMIT=$(git rev-parse HEAD)"
          echo "STAGED_TREE=$(git rev-parse HEAD^{tree})"
          # Expected to be refused because this Actions token intentionally does
          # not carry workflow-file write permission. The user-authorized GitHub
          # connector publishes the already-built tree after its IDs are exposed.
          git push origin HEAD:v1.1.3-candidate-c-visual-fixes || echo 'EXPECTED_WORKFLOW_PERMISSION_REFUSAL'
