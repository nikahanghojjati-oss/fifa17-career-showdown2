name: PR260 user-facing routing proof
on:
  push:
    branches:
      - feat/persistent-nik-daniel-pair
    paths:
      - .github/workflows/pr260-user-facing-routing-proof.yml
permissions:
  contents: read
jobs:
  prove-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/persistent-nik-daniel-pair
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Contract and syntax proof
        run: |
          node --check js/persistentNikDanielPair.js
          node --check js/productionSharedJourneyEntry.js
          node --check js/productionSharedJourneyReconnect.js
          node --check tests/browser/persistent-pair-user-facing-routing-audit.cjs
          node tests/contracts/persistent-nik-daniel-pair-contracts.cjs
          node tests/contracts/shared-journey-reconnect-production-contracts.cjs
          node tests/contracts/static-app-release-contracts.cjs
          node tests/contracts/final-polish-presentation.cjs
      - name: Real DOM and routing proof
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pr260-route-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node tests/browser/persistent-pair-user-facing-routing-audit.cjs
          node tests/browser/shared-showdown-paired-first-entry-audit.cjs
          CMS_AUDIT_RUN=pr260-final-user-routing node tests/browser/stability-audit.cjs
