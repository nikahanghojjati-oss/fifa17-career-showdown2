name: Stage 5E Stability Identity Repair

on:
  push:
    branches:
      - rjr/stage5e-runtime-host-join-ux-2026-09-02
    paths:
      - .github/workflows/stage5e-stability-identity-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rjr/stage5e-runtime-host-join-ux-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Patch only current release identity assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser/stability-audit.cjs')
          text=p.read_text()
          old_footer='Career Mode Showdown v1.8.1 · Connected Rivalry'
          new_footer='Career Mode Showdown v1.9.0 · Private Remote Joining'
          old_checkpoint='v1.8.1 · Connected Rivalry · Save Library'
          new_checkpoint='v1.9.0 · Private Remote Joining · Save Library'
          if text.count(old_footer) != 1 or text.count(old_checkpoint) != 1:
              raise SystemExit('Expected exact legacy release identity markers were not unique.')
          text=text.replace(old_footer,new_footer).replace(old_checkpoint,new_checkpoint)
          p.write_text(text)
          PY
          git diff --check
          git diff --numstat -- tests/browser/stability-audit.cjs
          npm ci
          npm run test:contracts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/stability-audit.cjs
          git commit -m "fix(stage5e): align full stability audit release identity"
          git push origin HEAD:rjr/stage5e-runtime-host-join-ux-2026-09-02
