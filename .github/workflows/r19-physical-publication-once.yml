name: R19 Physical Journey Publication Once

on:
  push:
    branches:
      - feat/mdp-physical-journey-r19-acceptance
    paths:
      - .github/workflows/r19-physical-publication-once.yml

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mdp-physical-journey-r19-acceptance
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Require unchanged accounting main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3c5fb2589414f8f497d1f7cb174200ef84290431"
      - name: Build coherent r19 acceptance candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const replace=(file,from,to,label)=>{
            let text=fs.readFileSync(file,'utf8');
            assert.ok(text.includes(from),`missing ${label||from} in ${file}`);
            text=text.split(from).join(to);
            fs.writeFileSync(file,text);
          };

          replace('index.html','1.9.1-r18','1.9.1-r19','r18 HTML runtime');
          replace('js/app.js','1.9.1-r18','1.9.1-r19','r18 app runtime');
          replace('manifest.webmanifest','1.9.1-r18','1.9.1-r19','r18 manifest runtime');
          replace('js/menuExperience.js','assets/marco-reus-2015-cc-by.webp?v=1.9.1-r18','assets/marco-reus-2015-cc-by.webp?v=1.9.1-r19','Marco Reus cache query');

          let worker=fs.readFileSync('service-worker.js','utf8');
          assert.ok(worker.includes('const RUNTIME_REVISION = "1.9.1-r18";'));
          assert.ok(worker.includes('const PREVIOUS_RUNTIME_REVISION = "1.9.1-r17";'));
          worker=worker.replace('const RUNTIME_REVISION = "1.9.1-r18";','const RUNTIME_REVISION = "1.9.1-r19";').replace('const PREVIOUS_RUNTIME_REVISION = "1.9.1-r17";','const PREVIOUS_RUNTIME_REVISION = "1.9.1-r18";');
          const shellNeedle='    "js/ssjrAcceptancePolishedBridge.js",';
          assert.ok(worker.includes(shellNeedle));
          assert.equal(worker.includes('"js/ssjrPhysicalJourneyAcceptance.js"'),false);
          worker=worker.replace(shellNeedle,`${shellNeedle}\n    "js/ssjrPhysicalJourneyAcceptance.js",`);
          fs.writeFileSync('service-worker.js',worker);

          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.scripts['test:ssjr:physical-journey']='node tests/contracts/ssjr-physical-journey-acceptance-contracts.cjs && node tests/contracts/ssjr-physical-journey-publication-contracts.cjs';
          pkg.scripts['test:ssjr:physical-journey:browser']='node tests/browser/ssjr-physical-journey-acceptance-audit.cjs';
          pkg.scripts['validate:ssjr-physical-journey']='node scripts/validate-ssjr-physical-journey-evidence.mjs';
          for(const [key,test] of [
            ['test:ssjr','node tests/contracts/ssjr-physical-journey-acceptance-contracts.cjs && node tests/contracts/ssjr-physical-journey-publication-contracts.cjs'],
            ['test:ssjr:browser','node tests/browser/ssjr-physical-journey-acceptance-audit.cjs']
          ]){
            assert.equal(typeof pkg.scripts[key],'string');
            if(!pkg.scripts[key].includes('ssjr-physical-journey'))pkg.scripts[key]+=` && ${test}`;
          }
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');

          const supplemental=JSON.parse(fs.readFileSync('POS20_SUPPLEMENTAL_PRODUCT_TESTS.json','utf8'));
          const patterns=[
            '^js/ssjrPhysicalJourneyAcceptance\\.js$',
            '^js/ssjr\\.js$',
            '^scripts/validate-ssjr-physical-journey-evidence\\.mjs$',
            '^tests/contracts/ssjr-physical-journey-acceptance-contracts\\.cjs$',
            '^tests/contracts/ssjr-physical-journey-publication-contracts\\.cjs$',
            '^tests/browser/ssjr-physical-journey-acceptance-audit\\.cjs$',
            '^service-worker\\.js$',
            '^index\\.html$',
            '^manifest\\.webmanifest$',
            '^js/app\\.js$',
            '^js/menuExperience\\.js$',
            '^package\\.json$',
            '^PHYSICAL_JOURNEY_ACCEPTANCE\\.md$',
            '^RELEASE_V1\\.9\\.1_R19\\.md$',
            '^POS20_SUPPLEMENTAL_PRODUCT_TESTS\\.json$'
          ];
          for(const testPath of ['tests/contracts/ssjr-physical-journey-acceptance-contracts.cjs','tests/contracts/ssjr-physical-journey-publication-contracts.cjs']){
            const existing=supplemental.tests.find(item=>item.path===testPath);
            if(existing)existing.patterns=patterns;else supplemental.tests.push({path:testPath,patterns});
          }
          fs.writeFileSync('POS20_SUPPLEMENTAL_PRODUCT_TESTS.json',JSON.stringify(supplemental,null,2)+'\n');

          fs.writeFileSync('PHYSICAL_JOURNEY_ACCEPTANCE.md',`# Physical Journey Production Acceptance — r19\n\nThis checklist is for the irreducible two-account, two-physical-device, two-network MDP Physical Journey proof. Do not use it until runtime \`1.9.1-r19\` is the exact deployed production runtime.\n\n## Acceptance URL\n\nOpen the production site on both devices with \`?ssjr-acceptance=1&ssjr-physical=1\`.\n\n- Device A: label \`Chromebook host\`; network label \`Home Wi-Fi\`.\n- Device B: label \`iPhone peer\`; network label \`Cellular\`. Keep the iPhone off Wi-Fi for the run.\n- Use two legitimate private manager accounts. Never paste raw account, device, rivalry, Save, profile or session IDs into evidence.\n\n## One-season journey\n\n1. Pair the two managers and establish one exact ACTIVE private session. Complete the shared league draw, permanent distinct club assignment, one-season length and both-manager setup confirmation.\n2. Both managers acknowledge Career Start, complete the Transfer Challenge, publish/review their own season results, finish the reconciled season commit, and wait for canonical scoring plus Shared History convergence.\n3. During the live journey, take each device genuinely offline once and then reconnect it. Wait until the Physical Journey panel shows OFFLINE RECOVERY complete. The recorder performs the replaceable conflict-guard proof automatically; do not manufacture a conflict manually.\n4. Reload each device once before terminal closure and wait for RELOAD to become complete. Continue the same rivalry; do not redraw or reset.\n5. Reach Local Reconciliation in safe read-only preview. **Do not apply Candidate C** during this standard Physical Journey run. Candidate C remains the sole explicit destructive local Apply path and is tested separately with backup/rollback safeguards.\n6. Reach Final Reconciliation, then complete Terminal Close. The panel must show CLOSED.\n7. Reload both devices once more after CLOSED. The panel must show CLOSED AFTER RELOAD; no replacement session or extra season may resurrect the Showdown.\n8. On each device, press DOWNLOAD JSON (or COPY EVIDENCE if download is unavailable) and provide the two sanitized exports together.\n\n## Acceptance oracle\n\nRun \`npm run validate:ssjr-physical-journey -- <player-one.json> <player-two.json>\`. A valid pair requires opposite manager and host/peer roles, distinct account/device fingerprints, distinct device/network evidence, one shared rivalry and correlated private session, ordered full-journey milestones, real offline recovery, reload recovery, safe Local Reconciliation, Final Reconciliation, terminal CLOSED after reload, and unchanged canonical local storage.\n\nThe recorder is acceptance-only, persists only sanitized evidence in sessionStorage, makes no recorder-owned network request, exports no raw private authority, and never applies Candidate C.\n`);

          fs.writeFileSync('RELEASE_V1.9.1_R19.md',`# Career Mode Showdown v1.9.1 — Runtime r19\n\nStatus: RELEASE CANDIDATE\n\nApplication version: \`v1.9.1\`\n\nRuntime asset revision: \`1.9.1-r19\`\n\nPrevious known-good runtime: \`1.9.1-r18\`\n\nRuntime \`1.9.1-r19\` adds acceptance-only instrumentation for the MDP Physical Journey milestone while preserving the existing Private Remote Joining product boundary. It does not itself earn Physical Journey credit. MDP remains \`95.50/100\` until genuine production two-account, two-physical-device, two-network evidence is accepted and the capability completes its full integration/accounting lifecycle. SSJR-1.1 remains exactly \`0/100\`.\n\nThe r19 recorder is loaded only when both \`ssjr-acceptance=1\` and \`ssjr-physical=1\` are present. It records privacy-safe SHA-256 fingerprints and ordered journey milestones across Shared Setup, Career Start, Transfer Challenge, results, commit, canonical scoring, history, offline/reconnect recovery, a non-writing conflict-guard self-test, read-only Local Reconciliation, Final Reconciliation, Terminal Close and CLOSED-after-reload proof. The paired validator requires opposite managers, distinct devices and networks, same rivalry/session correlation and unchanged canonical local storage.\n\nThere is no Firestore Rules change and no new provider write/list authority in r19. Firebase remains Spark-only with Billing permanently OFF; App Check enforcement remains OFF; no Cloud Run or Cloud Functions dependency is introduced. Exactly two private managers remain the complete supported topology. Candidate C remains the sole destructive local Apply path and the standard Physical Journey acceptance run does not invoke it.\n\nThe new acceptance asset is part of the r19 offline shell so a real offline/reload proof can keep the observer available without weakening provider authority. Normal production mode does not load or expose the Physical Journey recorder.\n`);
          NODE

          git add PHYSICAL_JOURNEY_ACCEPTANCE.md POS20_SUPPLEMENTAL_PRODUCT_TESTS.json RELEASE_V1.9.1_R19.md index.html js/app.js js/menuExperience.js manifest.webmanifest package.json service-worker.js

      - run: npm ci
      - name: Focused Physical Journey contracts
        run: npm run test:ssjr:physical-journey
      - name: Full deterministic product census
        run: npm run test:contracts
      - name: Operations authority regression
        run: npm run test:ops
      - name: Physical Journey browser lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node tests/support/static-server.cjs > /tmp/cms-r19-publication-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          CMS_BASE_URL=http://127.0.0.1:4173/ npm run test:ssjr:physical-journey:browser
      - name: Verify bounded r19 pre-cleanup diff
        shell: bash
        run: |
          set -euo pipefail
          expected=$'.github/workflows/r19-physical-journey-dev.yml\n.github/workflows/r19-physical-publication-once.yml\nPHYSICAL_JOURNEY_ACCEPTANCE.md\nPOS20_SUPPLEMENTAL_PRODUCT_TESTS.json\nRELEASE_V1.9.1_R19.md\nindex.html\njs/app.js\njs/menuExperience.js\njs/ssjr.js\njs/ssjrPhysicalJourneyAcceptance.js\nmanifest.webmanifest\npackage.json\nscripts/validate-ssjr-physical-journey-evidence.mjs\nservice-worker.js\ntests/browser/ssjr-physical-journey-acceptance-audit.cjs\ntests/contracts/ssjr-physical-journey-acceptance-contracts.cjs\ntests/contracts/ssjr-physical-journey-publication-contracts.cjs\ntests/contracts/static-app-release-contracts.cjs'
          actual="$(git diff --cached --name-only 3c5fb2589414f8f497d1f7cb174200ef84290431 | sort)"
          test "$actual" = "$expected"
      - name: Publish tested r19 non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(mdp): publish r19 Physical Journey acceptance instrumentation'
          git push origin HEAD:feat/mdp-physical-journey-r19-acceptance
