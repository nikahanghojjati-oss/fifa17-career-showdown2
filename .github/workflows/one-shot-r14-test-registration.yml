name: One-shot r14 Journey Reconnect test registration

on:
  push:
    branches:
      - feat/ssjr-journey-reconnect-r14

permissions:
  contents: write

jobs:
  register:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ssjr-journey-reconnect-r14
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Register deterministic Journey Reconnect proof
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const supplementalPath='POS20_SUPPLEMENTAL_PRODUCT_TESTS.json';
          const supplemental=JSON.parse(fs.readFileSync(supplementalPath,'utf8'));
          supplemental.tests=supplemental.tests.filter(item=>item.path!=='tests/contracts/shared-journey-reconnect-contracts.cjs');
          supplemental.tests.push({
            path:'tests/contracts/shared-journey-reconnect-contracts.cjs',
            patterns:[
              '^js/sharedJourneyReconnect\\.js$',
              '^js/sharedMultiSeasonProgression\\.js$',
              '^tests/contracts/shared-journey-reconnect-contracts\\.cjs$',
              '^POS20_SUPPLEMENTAL_PRODUCT_TESTS\\.json$'
            ]
          });
          fs.writeFileSync(supplementalPath,JSON.stringify(supplemental,null,2)+'\n');
          const packagePath='package.json';
          const pkg=JSON.parse(fs.readFileSync(packagePath,'utf8'));
          pkg.scripts=pkg.scripts||{};
          pkg.scripts['test:ssjr:journey-reconnect']='node tests/contracts/shared-journey-reconnect-contracts.cjs';
          fs.writeFileSync(packagePath,JSON.stringify(pkg,null,2)+'\n');
          NODE
          node tests/contracts/shared-journey-reconnect-contracts.cjs
          rm .github/workflows/one-shot-r14-test-registration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POS20_SUPPLEMENTAL_PRODUCT_TESTS.json package.json .github/workflows/one-shot-r14-test-registration.yml
          git commit -m "test: register Journey Reconnect in POS20"
          git push origin HEAD:feat/ssjr-journey-reconnect-r14
