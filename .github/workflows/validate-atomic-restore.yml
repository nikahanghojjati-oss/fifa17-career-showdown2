name: Validate Candidate C Atomic Restore

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atomic-restore-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  restore-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Candidate C atomic transaction, planning and failure contracts
        run: npm run test:restore-contracts

  restore-browser:
    needs: restore-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run authoritative Candidate C restore and recovery browser audit
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-candidate-c-restore.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CMS_AUDIT_RUN="candidate-c" npm run test:restore-browser
      - name: Upload Candidate C restore and recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-c-atomic-restore-${{ github.sha }}
          path: test-results/candidate-c-restore-*.png
          if-no-files-found: error
          retention-days: 14
