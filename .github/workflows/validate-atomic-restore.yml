name: Validate Candidate C Atomic Restore

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atomic-restore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Candidate C atomic storage transaction failure contracts
        run: npm run test:restore-contracts
