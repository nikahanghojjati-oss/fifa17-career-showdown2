name: Upgrade Martial Visual Quality

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/upgrade-martial-visual-quality.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Build higher-resolution Manchester United Martial derivative
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import hashlib, io, json

          source_file = 'Anthony Martial 27 September 2017.jpg'
          source_page = 'https://commons.wikimedia.org/wiki/File:Anthony_Martial_27_September_2017.jpg'
          source_url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + quote(source_file, safe='')
          request = Request(source_url, headers={
              'User-Agent':'CareerModeShowdownAssetBuilder/1.0 (+https://github.com/nikahanghojjati-oss/fifa17-career-showdown2)'
          })
          with urlopen(request, timeout=60) as response:
              raw = response.read()

          with Image.open(io.BytesIO(raw)) as opened:
              image = ImageOps.exif_transpose(opened).convert('RGB')
              if image.size != (1500, 1000):
                  raise SystemExit(f'Unexpected Martial source dimensions: {image.size}')
              image = image.resize((1200, 800), Image.Resampling.LANCZOS)
              output_path = Path('assets/football/anthony-martial-man-utd-2017.webp')
              selected_quality = None
              for quality in (90,88,86,84,82,80):
                  image.save(output_path, 'WEBP', quality=quality, method=6)
                  if output_path.stat().st_size <= 280_000:
                      selected_quality = quality
                      break
              if selected_quality is None:
                  raise SystemExit(f'Martial derivative exceeds 280 KB even at quality 80 ({output_path.stat().st_size})')

          output = output_path.read_bytes()
          old_path = Path('assets/football/anthony-martial-man-utd-2015.webp')
          if old_path.exists():
              old_path.unlink()

          manifest_path = Path('assets/football/asset-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          target = next(item for item in manifest['assets'] if item['id'] == 'anthony-martial-man-utd-2015')
          target.update({
              'id':'anthony-martial-man-utd-2017',
              'source_file':source_file,
              'output':output_path.name,
              'max_size':[1200,800],
              'quality':selected_quality,
              'author':'Dmitry Golubovich',
              'license':'CC BY-SA 3.0',
              'license_url':'https://creativecommons.org/licenses/by-sa/3.0/',
              'source_page':source_page,
              'context':'Anthony Martial playing for Manchester United against CSKA Moscow, 27 September 2017.',
              'special_redirect_url':source_url,
              'source_dimensions':[1500,1000],
              'source_sha256':hashlib.sha256(raw).hexdigest(),
              'output_dimensions':[1200,800],
              'output_bytes':len(output),
              'output_sha256':hashlib.sha256(output).hexdigest()
          })
          total = sum(item['output_bytes'] for item in manifest['assets'])
          if total > 1_100_000:
              raise SystemExit(f'Required football presentation exceeds 1.1 MB aggregate ceiling ({total})')
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          data_path = Path('data/footballVisuals.js')
          data = data_path.read_text()
          data = data.replace('id: "anthony-martial-man-utd-2015"', 'id: "anthony-martial-man-utd-2017"')
          data = data.replace('src: "assets/football/anthony-martial-man-utd-2015.webp"', 'src: "assets/football/anthony-martial-man-utd-2017.webp"')
          data = data.replace('context: "Manchester United · 2015"', 'context: "Manchester United · 2017"')
          data = data.replace('alt: "Anthony Martial playing for Manchester United in 2015"', 'alt: "Anthony Martial playing for Manchester United against CSKA Moscow in 2017"')
          data = data.replace('license: "CC BY-SA 2.5"', 'license: "CC BY-SA 3.0"', 1)
          data = data.replace('source: "https://commons.wikimedia.org/wiki/File:Anthony_Martial_2015.jpg"', f'source: "{source_page}"')
          data = data.replace('licenseUrl: "https://creativecommons.org/licenses/by-sa/2.5/"', 'licenseUrl: "https://creativecommons.org/licenses/by-sa/3.0/"', 1)
          data = data.replace('position: "50% 32%"', 'position: "50% 28%"', 1)
          data_path.write_text(data)

          notices_path = Path('THIRD_PARTY_NOTICES.md')
          notices = notices_path.read_text()
          start = notices.index('### Anthony Martial — Manchester United')
          end = notices.index('\n### Lionel Messi — FC Barcelona', start)
          replacement = f'''### Anthony Martial — Manchester United

          - Repository file: `assets/football/anthony-martial-man-utd-2017.webp`
          - Source file: `Anthony Martial 27 September 2017.jpg`
          - Author: Dmitry Golubovich
          - Source page: `{source_page}`
          - License: Creative Commons Attribution-ShareAlike 3.0 Unported (CC BY-SA 3.0), `https://creativecommons.org/licenses/by-sa/3.0/`
          - Source context: Anthony Martial playing for Manchester United against CSKA Moscow on 27 September 2017.
          - Application use: Transfer Challenge presentation.
          - Local transformation: resized from 1500 × 1000 to 1200 × 800 with Lanczos and encoded as WebP at quality {selected_quality}; selected to eliminate high-DPR mobile upscaling while retaining a clearly Manchester United-specific Martial image. This local derivative remains available under CC BY-SA 3.0.
          '''
          notices = notices[:start] + replacement + notices[end:]
          notices_path.write_text(notices)

          browser_path = Path('tests/browser/football-visual-audit.cjs')
          browser = browser_path.read_text().replace('anthony-martial-man-utd-2015.webp', 'anthony-martial-man-utd-2017.webp')
          browser_path.write_text(browser)

          print(f'Martial quality upgrade: 1500x1000 -> 1200x800 q{selected_quality}, {len(output)} bytes; aggregate {total}')
          PY

      - name: Remove one-shot workflow and commit quality upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/upgrade-martial-visual-quality.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upgrade Manchester United Martial visual quality'
          git push origin HEAD:agent/licensed-football-visual-system-r1
