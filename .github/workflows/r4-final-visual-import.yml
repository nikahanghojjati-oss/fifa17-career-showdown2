name: R4 Final Lahm Derivative Import

on:
  push:
    paths:
      - ".github/workflows/r4-final-visual-import.yml"

permissions:
  contents: write

jobs:
  import-lahm-derivative:
    if: github.ref == 'refs/heads/agent/r4-visual-recovery-and-error-provenance'
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/r4-visual-recovery-and-error-provenance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create selected crop-safe Lahm derivative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          source = Path('assets/football/philipp-lahm-world-cup-2014.webp')
          destination = Path('assets/football/philipp-lahm-world-cup-2014-focus-r4.webp')
          image = Image.open(source).convert('RGB')
          if image.size != (1600, 829):
              raise RuntimeError(f'Unexpected source dimensions: {image.size}')

          # Hand-reviewed crop E from the local licensed source. It keeps Lahm's
          # head/torso, raised arms and the complete World Cup trophy while
          # removing distant crowd space that made the original unreadable.
          crop_box = (624, 41, 1248, 763)
          derivative = image.crop(crop_box)
          derivative.save(destination, 'WEBP', quality=94, method=6)

          print('crop_box', crop_box)
          print('dimensions', derivative.size)
          print('sha256', hashlib.sha256(destination.read_bytes()).hexdigest())
          print('bytes', destination.stat().st_size)
          PY

      - name: Commit selected derivative
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/football/philipp-lahm-world-cup-2014-focus-r4.webp
          if git diff --cached --quiet; then
            echo "Selected Lahm derivative already matches."
            exit 0
          fi
          git commit -m "Import subject-focused Lahm trophy derivative"
          git push origin HEAD:agent/r4-visual-recovery-and-error-provenance
