name: R4 Lahm Crop Review

on:
  push:
    paths:
      - ".github/workflows/r4-final-visual-import.yml"

permissions:
  contents: read

jobs:
  build-lahm-crop-review:
    if: github.ref == 'refs/heads/agent/r4-visual-recovery-and-error-provenance'
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/r4-visual-recovery-and-error-provenance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build crop candidates from licensed local Lahm source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          source_path = Path('assets/football/philipp-lahm-world-cup-2014.webp')
          image = Image.open(source_path).convert('RGB')
          w, h = image.size
          print('source', w, h)

          boxes = [
              ('A', (0.35, 0.00, 0.76, 1.00)),
              ('B', (0.40, 0.00, 0.73, 1.00)),
              ('C', (0.43, 0.00, 0.72, 0.96)),
              ('D', (0.46, 0.00, 0.74, 0.90)),
              ('E', (0.39, 0.05, 0.78, 0.92)),
              ('F', (0.44, 0.04, 0.76, 0.88)),
          ]

          out = Path('lahm-crop-review')
          out.mkdir(exist_ok=True)
          thumbs = []
          for label, norm in boxes:
              box = (
                  round(norm[0] * w), round(norm[1] * h),
                  round(norm[2] * w), round(norm[3] * h)
              )
              crop = image.crop(box)
              crop_path = out / f'lahm-{label}.jpg'
              crop.save(crop_path, 'JPEG', quality=94)
              thumbs.append((label, box, crop))
              print(label, box, crop.size)

          cell_w, cell_h = 420, 540
          sheet = Image.new('RGB', (cell_w * 3, cell_h * 2), '#eef2f4')
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default()
          for index, (label, box, crop) in enumerate(thumbs):
              col, row = index % 3, index // 3
              x0, y0 = col * cell_w, row * cell_h
              preview = ImageOps.contain(crop, (cell_w - 24, cell_h - 62), Image.Resampling.LANCZOS)
              px = x0 + (cell_w - preview.width) // 2
              py = y0 + 34 + (cell_h - 62 - preview.height) // 2
              sheet.paste(preview, (px, py))
              draw.text((x0 + 12, y0 + 10), f'{label}  box={box}  size={crop.size[0]}x{crop.size[1]}', fill='#101820', font=font)

          sheet.save(out / 'lahm-crop-contact-sheet.jpg', 'JPEG', quality=92)
          PY

      - name: Upload Lahm crop review
        uses: actions/upload-artifact@v4
        with:
          name: r4-lahm-crop-review-${{ github.sha }}
          path: lahm-crop-review/
          retention-days: 7
