name: Restore Work Rashford Selection

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/restore-work-rashford-selection.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Replace provisional Rashford candidate with recovered Work selection
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import hashlib, io, json

          source_file = 'Marcus Rashford September 2016 (cropped).jpg'
          source_page = 'https://commons.wikimedia.org/wiki/File:Marcus_Rashford_September_2016_(cropped).jpg'
          source_url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + quote(source_file, safe='')
          request = Request(source_url, headers={
              'User-Agent':'CareerModeShowdownAssetBuilder/1.0 (+https://github.com/nikahanghojjati-oss/fifa17-career-showdown2)'
          })
          with urlopen(request, timeout=60) as response:
              raw = response.read()

          with Image.open(io.BytesIO(raw)) as opened:
              image = ImageOps.exif_transpose(opened).convert('RGB')
              source_dimensions = image.size
              if source_dimensions != (594, 661):
                  raise SystemExit(f'Unexpected recovered Rashford dimensions: {source_dimensions}')
              output_path = Path('assets/football/marcus-rashford-september-2016-cropped.webp')
              image.save(output_path, 'WEBP', quality=94, method=6)
              output_dimensions = image.size

          output = output_path.read_bytes()
          if len(output) > 240_000:
              raise SystemExit(f'Recovered Rashford derivative exceeds 240 KB ceiling: {len(output)}')

          old_path = Path('assets/football/marcus-rashford-man-utd-2016.webp')
          if old_path.exists(): old_path.unlink()

          manifest_path = Path('assets/football/asset-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          target = next(item for item in manifest['assets'] if item['id'] == 'marcus-rashford-man-utd-2016')
          target.update({
              'id':'marcus-rashford-man-utd-september-2016',
              'source_file':source_file,
              'output':output_path.name,
              'max_size':[594,661],
              'quality':94,
              'author':'Ardfern',
              'license':'CC BY-SA 4.0',
              'license_url':'https://creativecommons.org/licenses/by-sa/4.0/',
              'source_page':source_page,
              'context':'Marcus Rashford for Manchester United vs Zorya Luhansk at Old Trafford, 29 September 2016.',
              'special_redirect_url':source_url,
              'source_dimensions':list(source_dimensions),
              'source_sha256':hashlib.sha256(raw).hexdigest(),
              'output_dimensions':list(output_dimensions),
              'output_bytes':len(output),
              'output_sha256':hashlib.sha256(output).hexdigest()
          })
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          data_path = Path('data/footballVisuals.js')
          data = data_path.read_text()
          data = data.replace('id: "marcus-rashford-man-utd-2016"', 'id: "marcus-rashford-man-utd-september-2016"')
          data = data.replace('src: "assets/football/marcus-rashford-man-utd-2016.webp"', 'src: "assets/football/marcus-rashford-september-2016-cropped.webp"')
          data = data.replace('alt: "Marcus Rashford warming up for Manchester United in 2016"', 'alt: "Marcus Rashford playing for Manchester United at Old Trafford in September 2016"')
          data = data.replace('author: "Egghead06"', 'author: "Ardfern"')
          data = data.replace('source: "https://commons.wikimedia.org/wiki/File:Marcus_Rashford.jpg"', f'source: "{source_page}"')
          data = data.replace('position: "50% 18%"\n    }),\n    martial', 'position: "50% 24%"\n    }),\n    martial', 1)
          data_path.write_text(data)

          notices_path = Path('THIRD_PARTY_NOTICES.md')
          notices = notices_path.read_text()
          notices = notices.replace('`assets/football/marcus-rashford-man-utd-2016.webp`', '`assets/football/marcus-rashford-september-2016-cropped.webp`')
          notices = notices.replace('`Marcus Rashford.jpg`', '`Marcus Rashford September 2016 (cropped).jpg`')
          notices = notices.replace('Author: Egghead06', 'Author: Ardfern')
          notices = notices.replace('`https://commons.wikimedia.org/wiki/File:Marcus_Rashford.jpg`', f'`{source_page}`')
          notices = notices.replace('Source context: warming up for Manchester United vs West Ham United on 10 May 2016.', 'Source context: Manchester United vs Zorya Luhansk at Old Trafford on 29 September 2016.')
          notices = notices.replace('Local transformation: retained at 742 × 888 and encoded as WebP. This local derivative remains available under CC BY-SA 4.0.', 'Local transformation: the recovered 594 × 661 cropped source is retained at native dimensions and encoded as WebP. This local derivative remains available under CC BY-SA 4.0.')
          notices_path.write_text(notices)

          visual_workflow = Path('.github/workflows/validate-football-visuals.yml')
          # Do not edit another workflow here; GitHub Actions security blocks that. Connector will update the workflow separately.

          browser_path = Path('tests/browser/football-visual-audit.cjs')
          browser = browser_path.read_text().replace('marcus-rashford-man-utd-2016.webp', 'marcus-rashford-september-2016-cropped.webp')
          browser_path.write_text(browser)

          print(f'Recovered Rashford Work selection: {source_dimensions} -> {output_dimensions}, {len(output)} bytes')
          PY

      - name: Remove one-shot restorer and commit recovered selection
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-work-rashford-selection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/football data/footballVisuals.js THIRD_PARTY_NOTICES.md tests/browser/football-visual-audit.cjs .github/workflows/restore-work-rashford-selection.yml
          git commit -m 'Restore Work-selected September 2016 Rashford visual'
          git push origin HEAD:agent/licensed-football-visual-system-r1
