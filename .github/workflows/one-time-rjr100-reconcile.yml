name: One-time RJR100 Reconciliation

on:
  push:
    branches:
      - "rjr/final-rjr100-acceptance-2026-09-05"
    paths:
      - ".github/workflows/one-time-rjr100-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out final reconciliation branch
        uses: actions/checkout@v5
        with:
          ref: rjr/final-rjr100-acceptance-2026-09-05
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Reconcile fixed RJR-1 from accepted evidence
        run: node scripts/reconcile-rjr100-final.mjs
      - name: Prove fixed-ledger and reporting authority contracts
        run: |
          node tests/contracts/remote-joining-readiness-contracts.cjs
          node tests/contracts/rjr-reporting-authority-contracts.cjs
      - name: Commit only the reconciled ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REMOTE_JOINING_READINESS.json
          if git diff --cached --quiet; then
            echo "No ledger change required."
            exit 0
          fi
          git commit -m "Reconcile fixed RJR-1 to 100/100 [skip ci]"
          git push origin HEAD:rjr/final-rjr100-acceptance-2026-09-05
