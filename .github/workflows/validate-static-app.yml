name: Validate Static App

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js data -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate navigation and scoring state matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          function loadFunctions(filePath, exportExpression, initial = {}) {
            const context = { console, ...initial };
            context.window = context;
            vm.createContext(context);
            const source = fs.readFileSync(filePath, 'utf8');
            vm.runInContext(`${source}\n;globalThis.__testExports = ${exportExpression};`, context, { filename: filePath });
            return { context, api: context.__testExports };
          }

          const scoring = loadFunctions(
            'js/scoring.js',
            '{ calculatePlayerSeasonScore, determineSeasonWinner }'
          ).api;

          const perfect = scoring.calculatePlayerSeasonScore({
            leaguePosition: 1,
            leaguePoints: 100,
            leagueGoals: 100,
            championsLeague: true,
            domesticCup: true,
            topScorer: true,
            topAssist: true
          });
          assert.strictEqual(perfect.total, 11, 'Perfect season must remain capped at 11.');
          assert.strictEqual(perfect.performanceBonus, 1, '100 points + 100 goals must share one point.');
          assert.strictEqual(perfect.individualAwardsBonus, 1, 'Top Scorer + Top Assist must share one point.');

          assert.strictEqual(
            scoring.determineSeasonWinner(
              { scoring: { total: 5 }, leaguePosition: 1, leaguePoints: 100 },
              { scoring: { total: 5 }, leaguePosition: 20, leaguePoints: 1 }
            ),
            'draw',
            'Equal non-zero season scores must remain a draw.'
          );
          assert.strictEqual(
            scoring.determineSeasonWinner(
              { scoring: { total: 0 }, leaguePosition: 2, leaguePoints: 90 },
              { scoring: { total: 0 }, leaguePosition: 1, leaguePoints: 10 }
            ),
            'playerTwo',
            '0-0 must use league position first.'
          );
          assert.strictEqual(
            scoring.determineSeasonWinner(
              { scoring: { total: 0 }, leaguePosition: 3, leaguePoints: 84 },
              { scoring: { total: 0 }, leaguePosition: 3, leaguePoints: 80 }
            ),
            'playerOne',
            '0-0 with equal position must use league points.'
          );

          const navigation = loadFunctions(
            'js/screens.js',
            '{ resolveCanonicalShowdownRoute, isRouteStateValid, isLeagueConfirmationPending, getLegalBackTargets }',
            { currentShowdown: null }
          );
          const { context, api } = navigation;
          const baseShowdown = () => ({
            id: 1,
            status: 'Created',
            currentRound: 1,
            totalRounds: 1,
            selectedLeague: null,
            clubs: { playerOne: null, playerTwo: null },
            transferChallenges: [],
            rounds: []
          });

          context.currentShowdown = null;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'mainMenu', 'No save must canonicalize to Home.');
          assert.strictEqual(api.isRouteStateValid('careerStatistics'), true, 'Career Statistics must be legal without an active showdown.');
          assert.strictEqual(api.isRouteStateValid('statistics'), false, 'Current Rivalry Statistics must require a showdown.');

          const noLeague = baseShowdown();
          context.currentShowdown = noLeague;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'leagueWheelScreen', 'Created save must go to League Wheel.');

          const leagueSelected = baseShowdown();
          leagueSelected.selectedLeague = { id: 'premier-league', name: 'Premier League' };
          leagueSelected.status = 'League Selected';
          context.currentShowdown = leagueSelected;
          assert.strictEqual(api.isLeagueConfirmationPending(), true, 'A spun league must remain confirmation-pending.');
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'leagueWheelScreen', 'Selected league must stay on League Wheel until Continue is pressed.');
          assert.strictEqual(api.isRouteStateValid('leagueWheelScreen'), true, 'League Wheel must remain legal before explicit Continue.');
          assert.strictEqual(api.isRouteStateValid('clubWheelScreen'), false, 'Unconfirmed league must not enter Club Assignment.');

          const leagueConfirmed = baseShowdown();
          leagueConfirmed.selectedLeague = { id: 'premier-league', name: 'Premier League' };
          leagueConfirmed.status = 'League Confirmed';
          context.currentShowdown = leagueConfirmed;
          assert.strictEqual(api.isLeagueConfirmationPending(), false, 'Explicit Continue must clear league confirmation pending state.');
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'clubWheelScreen', 'Confirmed league without clubs must go to Club Assignment.');
          assert.strictEqual(api.isRouteStateValid('clubWheelScreen'), true, 'Club Assignment becomes legal only after league confirmation.');

          const confirmationPending = baseShowdown();
          confirmationPending.selectedLeague = { id: 'premier-league', name: 'Premier League' };
          confirmationPending.clubs = { playerOne: 'Arsenal', playerTwo: 'Chelsea' };
          confirmationPending.status = 'Clubs Assigned';
          context.currentShowdown = confirmationPending;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'clubWheelScreen', 'Saved clubs awaiting confirmation must resume Club Assignment.');
          assert.strictEqual(api.isRouteStateValid('clubWheelScreen'), true, 'Confirmation-pending Club Assignment must remain legal.');
          assert.strictEqual(api.isRouteStateValid('leagueWheelScreen'), false, 'Saved clubs must permanently invalidate League Wheel.');
          assert.strictEqual(api.isRouteStateValid('dashboard'), false, 'Unconfirmed rivalry must not skip to Showdown Home.');
          assert.strictEqual(api.isRouteStateValid('transferChallenge'), false, 'Unconfirmed rivalry must not enter Transfer Challenge.');

          const ready = baseShowdown();
          ready.selectedLeague = { id: 'premier-league', name: 'Premier League' };
          ready.clubs = { playerOne: 'Arsenal', playerTwo: 'Chelsea' };
          ready.status = 'Ready';
          context.currentShowdown = ready;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'dashboard', 'Confirmed showdown must resolve to Showdown Home.');
          assert.strictEqual(api.isRouteStateValid('leagueWheelScreen'), false, 'Locked clubs must invalidate League Wheel.');
          assert.strictEqual(api.isRouteStateValid('clubWheelScreen'), false, 'Confirmed clubs must invalidate Club Assignment.');
          assert.strictEqual(api.isRouteStateValid('statistics'), true, 'Current Rivalry Statistics must be legal with a showdown.');
          assert.strictEqual(api.isRouteStateValid('careerStatistics'), true, 'Career Statistics must remain legal with a showdown.');

          const transfer = structuredClone(ready);
          transfer.status = 'Transfer Window Active';
          transfer.transferChallenges = [{ seasonNumber: 1, status: 'active' }];
          context.currentShowdown = transfer;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'transferChallenge', 'Active transfer window must resume Transfer Challenge.');

          const recording = structuredClone(ready);
          recording.status = 'Transfer Challenge Recording';
          recording.transferChallenges = [{ seasonNumber: 1, status: 'recording' }];
          context.currentShowdown = recording;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'transferChallenge', 'Recording transfer state must resume Transfer Challenge.');

          const transferComplete = structuredClone(ready);
          transferComplete.transferChallenges = [{ seasonNumber: 1, status: 'completed' }];
          context.currentShowdown = transferComplete;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'dashboard', 'Completed transfers must not revive Transfer Challenge.');
          assert.strictEqual(api.isRouteStateValid('transferChallenge'), false, 'Completed transfer route must be invalid.');
          assert.strictEqual(api.isRouteStateValid('seasonEntry'), true, 'Completed transfers must allow Season Results entry.');

          const completed = structuredClone(ready);
          completed.status = 'Completed';
          completed.rounds = [{ roundNumber: 1 }];
          context.currentShowdown = completed;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'dashboard', 'Completed showdown must resume Showdown Home.');
          assert.strictEqual(api.isRouteStateValid('leagueWheelScreen'), false, 'Completed showdown cannot return to League Wheel.');
          assert.strictEqual(api.isRouteStateValid('clubWheelScreen'), false, 'Completed showdown cannot return to Club Assignment.');
          assert.strictEqual(api.isRouteStateValid('transferChallenge'), false, 'Completed showdown cannot return to Transfer Challenge.');
          assert.strictEqual(api.isRouteStateValid('seasonEntry'), false, 'Completed showdown cannot return to Season Results entry.');
          assert.strictEqual(api.isRouteStateValid('seasonSummary'), true, 'Completed showdown may still view final Season Summary.');

          assert.deepStrictEqual(Array.from(api.getLegalBackTargets('seasonSummary')), ['dashboard', 'mainMenu']);
          assert.deepStrictEqual(Array.from(api.getLegalBackTargets('createShowdown')), ['dashboard', 'mainMenu']);
          assert.deepStrictEqual(Array.from(api.getLegalBackTargets('legacy')), ['dashboard', 'mainMenu']);
          assert.deepStrictEqual(Array.from(api.getLegalBackTargets('statistics')), ['dashboard', 'mainMenu']);
          assert.deepStrictEqual(Array.from(api.getLegalBackTargets('careerStatistics')), ['mainMenu']);
          assert.deepStrictEqual(
            Array.from(api.getLegalBackTargets('trophyRoom')),
            ['dashboard', 'careerStatistics', 'mainMenu'],
            'Trophy Room must support completed-showdown and Career Statistics parents.'
          );

          console.log('Navigation state matrix, explicit league/club confirmation, analytics routes, and locked scoring regression cases passed.');
          NODE

      - name: Validate club identity and reveal contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          function loadClassicScript(filePath, exportExpression) {
            const context = { console };
            context.window = context;
            vm.createContext(context);
            const source = fs.readFileSync(filePath, 'utf8');
            vm.runInContext(`${source}\n;globalThis.__testExports = ${exportExpression};`, context, { filename: filePath });
            return context.__testExports;
          }

          const clubData = loadClassicScript('data/clubs.js', '{ clubsByLeague }');
          const identity = loadClassicScript('js/visualIdentity.js', '{ getClubIdentity, CLUB_IDENTITY_PALETTES }');
          const clubs = Object.values(clubData.clubsByLeague).flat();
          assert.strictEqual(clubs.length, 98, 'Locked five-league Showdown pool must contain 98 clubs.');
          assert.strictEqual(new Set(clubs).size, clubs.length, 'Club database must not contain duplicate club names.');

          const missingPalettes = clubs.filter(name => !identity.CLUB_IDENTITY_PALETTES[name]);
          assert.deepStrictEqual(missingPalettes, [], `Missing original identity palettes: ${missingPalettes.join(', ')}`);
          const crests = clubs.map(name => {
            const current = identity.getClubIdentity(name);
            assert.ok(current.primary && current.secondary && current.accent, `${name} identity is incomplete.`);
            assert.ok(current.crest.startsWith('url("data:image/svg+xml,'), `${name} crest must be an inline original SVG.`);
            return current.crest;
          });
          assert.strictEqual(new Set(crests).size, clubs.length, 'Each Showdown club must render a distinct crest.');
          clubs.forEach(name => assert.strictEqual(identity.getClubIdentity(name).crest, identity.getClubIdentity(name).crest));

          const identitySource = fs.readFileSync('js/visualIdentity.js', 'utf8');
          assert.ok(!/<image\b/i.test(identitySource), 'Custom crests must not embed external badge images.');
          assert.ok(!/assets\/logos\//i.test(identitySource), 'Official badge assets must not return.');

          const clubAssignment = fs.readFileSync('js/clubAssignment.js', 'utf8');
          const timing = clubAssignment.match(/managerOne:\s*(\d+)[\s\S]*?managerTwo:\s*(\d+)[\s\S]*?versus:\s*(\d+)[\s\S]*?confirmation:\s*(\d+)/);
          assert.ok(timing, 'Club reveal timing contract is missing.');
          const values = timing.slice(1).map(Number);
          assert.ok(values[0] < values[1] && values[1] < values[2] && values[2] < values[3], 'Club reveal stages must stay sequential.');
          assert.ok(values[3] <= 4500, 'Club reveal must remain finite.');
          assert.ok(clubAssignment.includes('isReducedClubMotionPreferred'), 'Reduced-motion Club Reveal fast path is missing.');
          assert.ok(clubAssignment.includes('currentShowdown.status = "Clubs Assigned"'), 'Pair must persist before reveal.');
          assert.ok(clubAssignment.includes('currentShowdown.status = "Ready"'), 'Explicit confirmation must advance to Ready.');
          assert.ok(!clubAssignment.includes('createElement("style")'), 'Club Assignment must not inject CSS from JS.');

          console.log(`Validated ${clubs.length} deterministic original crests and two-pack reveal contracts.`);
          NODE

      - name: Validate release shell and startup budget
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');
          const assert = require('assert');

          const expectedVersion = '0.95.0';
          const maximumInitialAssetBytes = 155000;
          const maximumCompressedInitialAssetBytes = 35000;
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('js/app.js', 'utf8');
          const appCss = fs.readFileSync('css/app.css', 'utf8');
          const optional = fs.readFileSync('js/optionalModules.js', 'utf8');
          const screens = fs.readFileSync('js/screens.js', 'utf8');
          const showdownUI = fs.readFileSync('js/showdownUI.js', 'utf8');

          const revisionMatch = html.match(/<meta\s+name="app-asset-revision"\s+content="([^"]+)"/i);
          assert.ok(revisionMatch && revisionMatch[1].trim(), 'Shell must define app-asset-revision.');
          const revision = revisionMatch[1].trim();

          const refs = [...html.matchAll(/(?:src|href)="((?:js|css|data)\/[^"?#]+)(?:\?v=([^"#]+))?"/g)]
            .map(match => ({ path: match[1], revision: match[2] || '' }));
          assert.ok(refs.length, 'No local startup assets found.');
          const stale = refs.filter(ref => ref.revision !== revision);
          assert.deepStrictEqual(stale, [], `Mixed cache revisions: ${stale.map(ref => ref.path).join(', ')}`);
          assert.ok(app.includes(`const APP_VERSION = "${expectedVersion}"`), 'APP_VERSION changed unexpectedly.');
          assert.ok(optional.includes('const OPTIONAL_ASSET_REVISION = getApplicationAssetRevision()'), 'Lazy assets must derive revision from shell.');

          for (const file of fs.readdirSync('css').filter(file => file.endsWith('.css'))) {
            const css = fs.readFileSync(path.join('css', file), 'utf8');
            assert.strictEqual((css.match(/{/g) || []).length, (css.match(/}/g) || []).length, `${file} has unbalanced CSS braces.`);
          }

          assert.ok(html.includes('family=Barlow+Condensed:wght@600;700;800&display=swap'), 'Fallback-safe Barlow display font request is missing.');
          assert.ok(appCss.includes('--f17-display:"Barlow Condensed"'), 'Display font stack changed unexpectedly.');
          assert.strictEqual((html.match(/class="clubPackDoor"/g) || []).length, 2, 'Club Assignment must keep two sealed pack doors.');
          assert.ok(appCss.includes('--club-crest-image'), 'Original procedural crest presentation is missing.');
          assert.ok(appCss.includes('@media(prefers-reduced-motion:reduce)'), 'Reduced-motion CSS contract is missing.');
          assert.ok(appCss.includes('grid-template-rows:repeat(2,minmax(108px,auto)) auto;grid-auto-rows:auto'), 'Home rows must remain content-sized.');
          assert.ok(!appCss.includes('grid-auto-rows:108px'), 'Fixed Home auto rows reintroduced overlap risk.');
          assert.ok(appCss.includes('.menuMusicTile{grid-column:1/-1;grid-row:3;'), 'Media rail must stay below Home navigation.');
          assert.ok(appCss.includes('@media(min-width:901px) and (max-height:800px)'), 'Chromebook low-height breakpoint is missing.');
          assert.ok(appCss.includes('@media(max-width:700px)'), 'Mobile breakpoint is missing.');

          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicates = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
          assert.deepStrictEqual(duplicates, [], `Duplicate HTML ids: ${duplicates.join(', ')}`);
          const required = [
            'mainMenu', 'createShowdown', 'leagueWheelScreen', 'clubWheelScreen', 'dashboard',
            'transferChallenge', 'seasonEntry', 'seasonSummary', 'legacy', 'newShowdown',
            'continueCareer', 'legacyButton', 'careerStatisticsButton', 'ruleBookButton', 'settingsButton',
            'startShowdown', 'spinLeague', 'openClubPack', 'continueClubAssignment',
            'clubRivalryConfirmation', 'seasonPrimaryAction', 'completeTransferChallenge', 'completeSeason'
          ];
          assert.deepStrictEqual(required.filter(id => !ids.includes(id)), [], 'Critical shell id missing.');

          const styleRefs = refs.filter(ref => ref.path.startsWith('css/'));
          const scriptRefs = refs.filter(ref => ref.path.startsWith('js/'));
          assert.deepStrictEqual(styleRefs.map(ref => ref.path), ['css/app.css'], 'Startup must load exactly css/app.css.');
          assert.strictEqual(scriptRefs.length, 7, 'Startup must remain exactly seven local JS files.');

          const eagerForbidden = new Set([
            'js/showdownUI.js', 'js/visualIdentity.js', 'js/leagueWheel.js', 'js/clubAssignment.js',
            'js/transferChallenge.js', 'js/seasonEngine.js', 'js/analytics.js', 'js/statistics.js',
            'js/trophyRoom.js', 'js/settings.js', 'data/leagues.js', 'data/clubs.js'
          ]);
          assert.deepStrictEqual(refs.filter(ref => eagerForbidden.has(ref.path)), [], 'Lazy files returned to startup path.');

          const bytes = refs.reduce((total, ref) => {
            assert.ok(fs.existsSync(ref.path), `Referenced startup asset is missing: ${ref.path}`);
            return total + fs.statSync(ref.path).size;
          }, 0);
          assert.ok(bytes <= maximumInitialAssetBytes, `Startup budget exceeded: ${bytes} > ${maximumInitialAssetBytes}.`);
          const compressedBytes = refs.reduce(
            (total, ref) => total + zlib.gzipSync(fs.readFileSync(ref.path), { level: 9 }).length,
            0
          );
          assert.ok(
            compressedBytes <= maximumCompressedInitialAssetBytes,
            `Compressed startup budget exceeded: ${compressedBytes} > ${maximumCompressedInitialAssetBytes}.`
          );

          assert.ok(!/\bdata-back=/.test(html), 'Legacy data-back navigation returned.');
          assert.ok(/\bdata-smart-back\b/.test(html), 'Smart Back controls are missing.');
          assert.ok(screens.includes('const SAFE_BACK_TARGETS'), 'Central Back route policy is missing.');
          assert.ok(screens.includes('smartBackDelegationBound') && screens.includes('stopImmediatePropagation'), 'Central Back interception is missing.');
          assert.ok(screens.includes('status === "Clubs Assigned"') && screens.includes('isClubConfirmationPending'), 'Club confirmation route checkpoint is missing.');
          assert.ok(screens.includes('isLeagueConfirmationPending') && screens.includes('"League Confirmed"'), 'Explicit league confirmation route checkpoint is missing.');

          const routeLeaks = fs.readdirSync('js')
            .filter(file => file.endsWith('.js') && file !== 'screens.js')
            .filter(file => /\bscreenHistory\b/.test(fs.readFileSync(path.join('js', file), 'utf8')));
          assert.deepStrictEqual(routeLeaks, [], `Route history leaked outside screens.js: ${routeLeaks.join(', ')}`);

          assert.ok(showdownUI.includes('VIEW FINAL SEASON SUMMARY'), 'Completed-showdown recovery action is missing.');
          assert.ok(showdownUI.includes('Active save retained · Legacy sync pending'), 'Legacy sync failure state is not surfaced accurately.');

          const dead = ['data/rules.js', 'js/router.js', 'js/scoreboard.js', 'js/ui.js', 'js/wheels.js'];
          assert.deepStrictEqual(dead.filter(file => fs.existsSync(file)), [], 'Dead prototype architecture returned.');

          console.log(`Validated v${expectedVersion} / ${revision}: ${scriptRefs.length} initial scripts, one local stylesheet, ${bytes} raw / ${compressedBytes} compressed initial bytes, ${ids.length} unique ids, analytics lazy-loading, Chromebook guards, and centralized Back authority.`);
          NODE
