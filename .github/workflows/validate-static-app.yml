name: Validate Static App

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js data -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate navigation and scoring state matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          function loadFunctions(filePath, exportExpression, initial = {}) {
            const context = { console, ...initial };
            context.window = context;
            vm.createContext(context);
            const source = fs.readFileSync(filePath, 'utf8');
            vm.runInContext(`${source}\n;globalThis.__testExports = ${exportExpression};`, context, { filename: filePath });
            return { context, api: context.__testExports };
          }

          const scoring = loadFunctions(
            'js/scoring.js',
            '{ calculatePlayerSeasonScore, determineSeasonWinner }'
          ).api;

          const perfect = scoring.calculatePlayerSeasonScore({
            leaguePosition: 1,
            leaguePoints: 100,
            leagueGoals: 100,
            championsLeague: true,
            domesticCup: true,
            topScorer: true,
            topAssist: true
          });

          assert.strictEqual(perfect.total, 11, 'Perfect season must remain capped at 11.');
          assert.strictEqual(perfect.performanceBonus, 1, '100 points + 100 goals must share one point.');
          assert.strictEqual(perfect.individualAwardsBonus, 1, 'Top Scorer + Top Assist must share one point.');

          assert.strictEqual(
            scoring.determineSeasonWinner(
              { scoring: { total: 5 }, leaguePosition: 1, leaguePoints: 100 },
              { scoring: { total: 5 }, leaguePosition: 20, leaguePoints: 1 }
            ),
            'draw',
            'Equal non-zero season scores must remain a draw.'
          );
          assert.strictEqual(
            scoring.determineSeasonWinner(
              { scoring: { total: 0 }, leaguePosition: 2, leaguePoints: 90 },
              { scoring: { total: 0 }, leaguePosition: 1, leaguePoints: 10 }
            ),
            'playerTwo',
            '0-0 must use league position first.'
          );
          assert.strictEqual(
            scoring.determineSeasonWinner(
              { scoring: { total: 0 }, leaguePosition: 3, leaguePoints: 84 },
              { scoring: { total: 0 }, leaguePosition: 3, leaguePoints: 80 }
            ),
            'playerOne',
            '0-0 with equal position must use league points.'
          );

          const navigation = loadFunctions(
            'js/screens.js',
            '{ resolveCanonicalShowdownRoute, isRouteStateValid, getLegalBackTargets }',
            { currentShowdown: null }
          );

          const { context, api } = navigation;
          const baseShowdown = () => ({
            id: 1,
            status: 'Created',
            currentRound: 1,
            totalRounds: 1,
            selectedLeague: null,
            clubs: { playerOne: null, playerTwo: null },
            transferChallenges: [],
            rounds: []
          });

          context.currentShowdown = null;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'mainMenu', 'No save must canonicalize to Home.');

          const noLeague = baseShowdown();
          context.currentShowdown = noLeague;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'leagueWheelScreen', 'Created save must go to League Wheel.');

          const noClubs = baseShowdown();
          noClubs.selectedLeague = { id: 'premier-league', name: 'Premier League' };
          noClubs.status = 'League Selected';
          context.currentShowdown = noClubs;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'clubWheelScreen', 'Selected league without clubs must go to Club Assignment.');

          const ready = baseShowdown();
          ready.selectedLeague = { id: 'premier-league', name: 'Premier League' };
          ready.clubs = { playerOne: 'Arsenal', playerTwo: 'Chelsea' };
          ready.status = 'Ready';
          context.currentShowdown = ready;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'dashboard', 'Ready showdown must resolve to Showdown Home.');
          assert.strictEqual(api.isRouteStateValid('leagueWheelScreen'), false, 'Locked clubs must invalidate League Wheel.');
          assert.strictEqual(api.isRouteStateValid('clubWheelScreen'), false, 'Locked clubs must invalidate Club Assignment.');

          const transfer = structuredClone(ready);
          transfer.status = 'Transfer Window Active';
          transfer.transferChallenges = [{ seasonNumber: 1, status: 'active' }];
          context.currentShowdown = transfer;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'transferChallenge', 'Active transfer window must resume Transfer Challenge.');

          const recording = structuredClone(ready);
          recording.status = 'Transfer Challenge Recording';
          recording.transferChallenges = [{ seasonNumber: 1, status: 'recording' }];
          context.currentShowdown = recording;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'transferChallenge', 'Recording transfer state must resume Transfer Challenge.');

          const transferComplete = structuredClone(ready);
          transferComplete.transferChallenges = [{ seasonNumber: 1, status: 'completed' }];
          context.currentShowdown = transferComplete;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'dashboard', 'Completed transfers must not revive Transfer Challenge.');
          assert.strictEqual(api.isRouteStateValid('transferChallenge'), false, 'Completed transfer route must be invalid.');
          assert.strictEqual(api.isRouteStateValid('seasonEntry'), true, 'Completed transfers must allow Season Results entry.');

          const completed = structuredClone(ready);
          completed.status = 'Completed';
          completed.rounds = [{ roundNumber: 1 }];
          context.currentShowdown = completed;
          assert.strictEqual(api.resolveCanonicalShowdownRoute(), 'dashboard', 'Completed showdown must always resume Showdown Home.');
          assert.strictEqual(api.isRouteStateValid('leagueWheelScreen'), false, 'Completed showdown cannot return to League Wheel.');
          assert.strictEqual(api.isRouteStateValid('clubWheelScreen'), false, 'Completed showdown cannot return to Club Assignment.');
          assert.strictEqual(api.isRouteStateValid('transferChallenge'), false, 'Completed showdown cannot return to Transfer Challenge.');
          assert.strictEqual(api.isRouteStateValid('seasonEntry'), false, 'Completed showdown cannot return to Season Results entry.');
          assert.strictEqual(api.isRouteStateValid('seasonSummary'), true, 'Completed showdown may still view final Season Summary.');

          assert.deepStrictEqual(
            Array.from(api.getLegalBackTargets('seasonSummary')),
            ['dashboard', 'mainMenu'],
            'Season Summary Back must have deterministic safe parents.'
          );
          assert.deepStrictEqual(
            Array.from(api.getLegalBackTargets('createShowdown')),
            ['dashboard', 'mainMenu'],
            'New Showdown opened from completed hub must be able to return to Showdown Home.'
          );
          assert.deepStrictEqual(
            Array.from(api.getLegalBackTargets('legacy')),
            ['dashboard', 'mainMenu'],
            'Legacy opened from completed hub must be able to return to Showdown Home.'
          );
          assert.deepStrictEqual(
            Array.from(api.getLegalBackTargets('trophyRoom')),
            ['dashboard', 'mainMenu'],
            'Trophy Room opened from completed hub must be able to return to Showdown Home.'
          );

          console.log('Navigation state matrix and locked scoring regression cases passed.');
          NODE

      - name: Validate release shell and startup budget
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const expectedVersion = '0.16.0';
          const maximumInitialAssetBytes = 145000;
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('js/app.js', 'utf8');
          const appCss = fs.readFileSync('css/app.css', 'utf8');
          const optionalModules = fs.readFileSync('js/optionalModules.js', 'utf8');
          const screens = fs.readFileSync('js/screens.js', 'utf8');
          const showdownUI = fs.readFileSync('js/showdownUI.js', 'utf8');

          const revisionMatch = html.match(/<meta\s+name="app-asset-revision"\s+content="([^"]+)"/i);
          if (!revisionMatch || !revisionMatch[1].trim()) {
            throw new Error('index.html must define one app-asset-revision meta value.');
          }
          const expectedRevision = revisionMatch[1].trim();

          const refs = [...html.matchAll(/(?:src|href)="((?:js|css|data)\/[^"?#]+)(?:\?v=([^"#]+))?"/g)]
            .map(match => ({ path: match[1], revision: match[2] || '' }));

          if (!refs.length) {
            throw new Error('No local JS/CSS/data asset references were found in index.html.');
          }

          const stale = refs.filter(ref => ref.revision !== expectedRevision);
          if (stale.length) {
            throw new Error(`Mixed cache revisions: ${stale.map(ref => `${ref.path}=${ref.revision || 'none'}`).join(', ')}`);
          }

          if (!app.includes(`const APP_VERSION = "${expectedVersion}"`)) {
            throw new Error(`js/app.js does not declare APP_VERSION ${expectedVersion}.`);
          }

          if (!optionalModules.includes('meta[name="app-asset-revision"]')) {
            throw new Error('js/optionalModules.js must derive its lazy-asset revision from the application shell.');
          }
          if (!optionalModules.includes('const OPTIONAL_ASSET_REVISION = getApplicationAssetRevision()')) {
            throw new Error('js/optionalModules.js is not using the shell-owned asset revision.');
          }

          const openCssBraces = (appCss.match(/{/g) || []).length;
          const closeCssBraces = (appCss.match(/}/g) || []).length;
          if (openCssBraces !== closeCssBraces) {
            throw new Error(`css/app.css has unbalanced braces (${openCssBraces} open vs ${closeCssBraces} close).`);
          }

          if (!appCss.includes('grid-template-rows:repeat(2,minmax(108px,auto)) auto;grid-auto-rows:auto')) {
            throw new Error('Desktop Home grid must keep content-sized rows so media expansion cannot overlap navigation.');
          }
          if (appCss.includes('grid-auto-rows:108px')) {
            throw new Error('Fixed 108px auto rows reintroduced the Chromebook Home overlap risk.');
          }
          if (!appCss.includes('.menuMusicTile{grid-column:1/-1;grid-row:3;')) {
            throw new Error('Desktop media rail must remain below the two-row Career navigation block.');
          }
          if (!appCss.includes('.menuMediaSelector{grid-area:mediaSelect;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))')) {
            throw new Error('Desktop media selector must retain its compact four-column layout.');
          }
          if (!appCss.includes('@media(min-width:901px) and (max-height:800px)')) {
            throw new Error('Low-height Chromebook/laptop density breakpoint is missing.');
          }
          if (!appCss.includes('@media(max-width:700px)')) {
            throw new Error('Mobile single-column breakpoint is missing.');
          }

          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicateIds = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
          if (duplicateIds.length) {
            throw new Error(`Duplicate HTML ids: ${duplicateIds.join(', ')}`);
          }

          const requiredIds = [
            'mainMenu', 'createShowdown', 'leagueWheelScreen', 'clubWheelScreen',
            'dashboard', 'transferChallenge', 'seasonEntry', 'seasonSummary', 'legacy',
            'newShowdown', 'continueCareer', 'legacyButton', 'trophyRoomButton',
            'ruleBookButton', 'startShowdown', 'spinLeague', 'openClubPack',
            'continueClubAssignment', 'seasonPrimaryAction', 'completeTransferChallenge',
            'completeSeason'
          ];

          const missingIds = requiredIds.filter(id => !ids.includes(id));
          if (missingIds.length) {
            throw new Error(`Missing critical HTML ids: ${missingIds.join(', ')}`);
          }

          const styleRefs = refs.filter(ref => ref.path.startsWith('css/'));
          if (styleRefs.length !== 1 || styleRefs[0].path !== 'css/app.css') {
            throw new Error(`Initial shell must load exactly css/app.css; found: ${styleRefs.map(ref => ref.path).join(', ')}`);
          }

          const initialScripts = refs.filter(ref => ref.path.startsWith('js/'));
          if (initialScripts.length > 7) {
            throw new Error(`Initial JavaScript budget exceeded: ${initialScripts.length} scripts (maximum 7).`);
          }

          const eagerGameplayFiles = new Set([
            'js/showdownUI.js',
            'js/visualIdentity.js',
            'js/leagueWheel.js',
            'js/clubAssignment.js',
            'js/transferChallenge.js',
            'js/seasonEngine.js',
            'data/leagues.js',
            'data/clubs.js'
          ]);
          const eagerGameplay = refs.filter(ref => eagerGameplayFiles.has(ref.path));
          if (eagerGameplay.length) {
            throw new Error(`Gameplay files returned to startup path: ${eagerGameplay.map(ref => ref.path).join(', ')}`);
          }

          const initialAssetBytes = refs.reduce((total, ref) => {
            if (!fs.existsSync(ref.path)) {
              throw new Error(`Referenced startup asset is missing: ${ref.path}`);
            }
            return total + fs.statSync(ref.path).size;
          }, 0);
          if (initialAssetBytes > maximumInitialAssetBytes) {
            throw new Error(`Initial local asset budget exceeded: ${initialAssetBytes} bytes > ${maximumInitialAssetBytes}.`);
          }

          if (/\bdata-back=/.test(html)) {
            throw new Error('Legacy hard-coded data-back navigation returned to index.html.');
          }
          if (!/\bdata-smart-back\b/.test(html)) {
            throw new Error('Smart Back controls are missing from index.html.');
          }
          if (!screens.includes('const SAFE_BACK_TARGETS')) {
            throw new Error('Smart route policy is missing from js/screens.js.');
          }
          if (!screens.includes('smartBackDelegationBound') || !screens.includes('stopImmediatePropagation')) {
            throw new Error('Centralized Back interception is missing from js/screens.js.');
          }

          const routeHistoryLeaks = fs.readdirSync('js')
            .filter(file => file.endsWith('.js') && file !== 'screens.js')
            .filter(file => /\bscreenHistory\b/.test(fs.readFileSync(path.join('js', file), 'utf8')));
          if (routeHistoryLeaks.length) {
            throw new Error(`Route history is being manipulated outside screens.js: ${routeHistoryLeaks.join(', ')}`);
          }

          if (!showdownUI.includes('VIEW FINAL SEASON SUMMARY')) {
            throw new Error('Completed showdown recovery action is missing from js/showdownUI.js.');
          }
          if (!showdownUI.includes('Active save retained · Legacy sync pending')) {
            throw new Error('Completed-showdown Legacy failure state is not surfaced accurately.');
          }

          const deadPrototypeFiles = [
            'data/rules.js',
            'js/router.js',
            'js/scoreboard.js',
            'js/ui.js',
            'js/wheels.js'
          ];
          const returnedDeadFiles = deadPrototypeFiles.filter(filePath => fs.existsSync(filePath));
          if (returnedDeadFiles.length) {
            throw new Error(`Dead prototype files must be removed: ${returnedDeadFiles.join(', ')}`);
          }

          console.log(
            `Validated v${expectedVersion} / ${expectedRevision}: ${initialScripts.length} initial scripts, ` +
            `${styleRefs.length} initial stylesheet, ${initialAssetBytes} initial local bytes, ` +
            `${ids.length} unique HTML ids, centralized Back authority, Chromebook layout guards active.`
          );
          NODE
