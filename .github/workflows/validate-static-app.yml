name: Validate Static App

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js data tests scripts -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Validate dynamic static release architecture
        shell: bash
        run: |
          set -euo pipefail
          node tests/contracts/static-app-release-contracts.cjs

      - name: Validate complete repository contracts including Candidate C
        shell: bash
        run: |
          set -euo pipefail
          npm run test:contracts

      - name: Validate permanent workflow block topology
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const workflowDir = path.join(root, '.github/workflows');
          const files = fs.readdirSync(workflowDir)
            .filter(name => name.endsWith('.yml') && name !== 'validate-stability-lane.yml')
            .sort();
          const literalBlocks = files.reduce((total, name) => {
            const source = fs.readFileSync(path.join(workflowDir, name), 'utf8');
            return total + (source.match(/^\s*run:\s*\|\s*$/gm) || []).length;
          }, 0);
          assert.equal(literalBlocks, 27, `Permanent executable workflow topology drifted: expected 27 literal blocks, found ${literalBlocks}.`);
          assert.ok(files.includes('validate-atomic-restore.yml'), 'Candidate C permanent workflow is missing.');
          assert.ok(files.includes('validate-v110-release-burnin.yml'), 'Five-pass release Burn-In workflow is missing.');
          process.stdout.write(`PASS  Permanent workflow topology: ${files.length} workflows / ${literalBlocks} executable blocks.\n`);
          NODE
