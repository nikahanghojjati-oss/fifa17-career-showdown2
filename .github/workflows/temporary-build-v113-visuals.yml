name: Temporary v1.1.3 Licensed Visual Builder

on:
  push:
    branches:
      - v1.1.3-candidate-c-visual-fixes
    paths:
      - tools/build_r5_player_visuals.py
      - .github/workflows/temporary-build-v113-visuals.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-v113-visual-builder
  cancel-in-progress: false

jobs:
  build-licensed-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out build branch
        uses: actions/checkout@v5
        with:
          ref: v1.1.3-candidate-c-visual-fixes
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Build licensed Commons derivatives
        run: python tools/build_r5_player_visuals.py
      - name: Validate generated manifest shape and image ceilings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('assets/football/asset-manifest.json').read_text(encoding='utf-8'))
          assert len(manifest['assets']) == 12, len(manifest['assets'])
          ids = {asset['id'] for asset in manifest['assets']}
          expected = {
              'james-rodriguez-world-cup-2014-v113',
              'marcus-rashford-chelsea-2017-v113',
              'anthony-martial-cska-2017-v113',
              'cristiano-ronaldo-euro-2016-v113',
              'paul-pogba-man-utd-2016-v113',
              'zlatan-ibrahimovic-man-utd-2016-v113',
              'antoine-griezmann-atletico-2016-v113',
              'neymar-brazil-olympic-gold-2016-v113',
              'mario-balotelli-euro-2012-celebration-v113',
              'radamel-falcao-europa-league-2012-v113',
              'lionel-messi-barcelona-2016-subject-r4',
              'philipp-lahm-world-cup-2014-focus-r4',
          }
          assert ids == expected, (ids ^ expected)
          total = 0
          for asset in manifest['assets']:
              path = Path('assets/football') / asset['output']
              assert path.exists(), path
              size = path.stat().st_size
              assert size == asset['output_bytes'], (path, size, asset['output_bytes'])
              assert size <= 360_000, (path, size)
              total += size
          assert total <= 3_000_000, total
          print(f'Generated {len(ids)} licensed visuals / {total} bytes total archive payload')
          PY
      - name: Commit generated derivatives back to build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/football/asset-manifest.json assets/football/*.webp
          if git diff --cached --quiet; then
            echo 'Generated assets already match branch state.'
            exit 0
          fi
          git commit -m 'Generate v1.1.3 licensed football assets [skip ci]'
          git push origin HEAD:v1.1.3-candidate-c-visual-fixes
