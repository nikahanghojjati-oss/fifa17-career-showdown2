# Billed-reads budget: release gate (owner decision 2026-10-26). A season of the two-manager journey, including realistic waiting at the
# slow, mid and fast pace, must fit the Firebase Spark free limit (50,000 reads/day) in BILLED reads (documents + Security Rules lookups).
# See the header of tests/browser/ce2pg-journey.cjs for the formula. Emulator only; never touches production Firebase.
# Where it runs: NOT as a pull_request workflow (tests/operations/pos10-authority.test.mjs keeps Showdown Gate the only one, and the Gate's
# lanes, seal and coverage contract admit only routed TEST ids). It runs on pushes to the release branches (gameplay/r<N>) when game code,
# Rules or the journey change, so the check appears on the release PR's head commit next to Showdown Gate, and on manual dispatch. To make it
# block the merge into main, add "Billed-reads budget" to main's required checks.
name: Billed-reads budget

on:
  push:
    branches: ['gameplay/r[0-9]*']
    paths:
      - 'js/**'
      - 'data/**'
      - 'index.html'
      - 'firestore*.rules'
      - 'scripts/build-production-firestore-rules*.mjs'
      - 'tests/browser/ce2pg-journey.cjs'
      - 'tests/browser/support/**'
      - 'package.json'
      - '.github/workflows/billed-reads-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billed-reads-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billed-reads-budget:
    name: Billed-reads budget
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Firebase emulator and npx caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm/_npx
          key: showdown-gate-L6-emulators-ubuntu-24.04-firebase-tools-15.27.0-15.28.1-v1
      - name: Restore Playwright and Chromium browser caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/ms-playwright
            /tmp/cms-chromium-runtime
          key: showdown-gate-browsers-ubuntu-24.04-playwright-1.62.1-chromium-149.0.0-v1
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Firebase emulator test dependencies
        run: npm install --no-save --package-lock=false firebase@12.17.0 @firebase/rules-unit-testing@5.0.1 firebase-admin@14.2.0
      - name: Build the composed production Rules
        run: |
          node scripts/build-production-firestore-rules.mjs
          node scripts/build-production-firestore-rules-with-persistent-pair.mjs
      - name: Billed-reads budget (3 seasons, slow, mid and fast pace)
        env:
          CMS_CHROMIUM_MULTI_CONTEXT: '1'
        run: npm run test:budget
      - name: Upload billed-reads report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: billed-reads-budget
          path: |
            test-results/ce2pg-single-3-1-budget.json
            test-results/ce2pg-single-3-1-budget.attribution.txt
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
