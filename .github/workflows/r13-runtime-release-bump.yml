name: R13 runtime release bump

on:
  push:
    branches:
      - feat/persistent-nik-daniel-pair
    paths:
      - .github/workflows/r13-runtime-release-bump.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Promote whole shell to r22
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("index.html", "manifest.webmanifest", "js/app.js", "js/menuExperience.js"):
              path = Path(name)
              text = path.read_text()
              if "1.9.1-r21" not in text:
                  raise SystemExit(f"Expected r21 identity in {name}")
              path.write_text(text.replace("1.9.1-r21", "1.9.1-r22"))
          worker = Path("service-worker.js")
          text = worker.read_text()
          current = 'const RUNTIME_REVISION = "1.9.1-r21";'
          previous = 'const PREVIOUS_RUNTIME_REVISION = "1.9.1-r20";'
          if current not in text or previous not in text:
              raise SystemExit("Unexpected service-worker release topology")
          text = text.replace(current, 'const RUNTIME_REVISION = "1.9.1-r22";', 1)
          text = text.replace(previous, 'const PREVIOUS_RUNTIME_REVISION = "1.9.1-r21";', 1)
          worker.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js js/app.js js/menuExperience.js
          git diff --cached --check
          git commit -m "Promote R13 shell to runtime r22"
          git push origin HEAD:feat/persistent-nik-daniel-pair
