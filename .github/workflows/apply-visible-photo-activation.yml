name: Apply Visible Photo Activation

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/apply-visible-photo-activation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Add post-visibility photo activation to central screen authority
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('js/screens.js')
          source = path.read_text()

          current_branch = '''    if(current === screenName){
                  activeScreenName = screenName;
                  target.setAttribute("aria-hidden", "false");
                  prepareScreenAccessibility(screenName, target);
                  return true;
              }'''
          current_replacement = '''    if(current === screenName){
                  activeScreenName = screenName;
                  target.setAttribute("aria-hidden", "false");
                  if(typeof window.activateFootballVisualScreen === "function"){
                      try{ window.activateFootballVisualScreen(screenName); }
                      catch(error){ console.warn(`[Career Mode Showdown] Optional football visual activation failed for ${screenName}:`, error); }
                  }
                  prepareScreenAccessibility(screenName, target);
                  return true;
              }'''
          if current_branch not in source:
              raise SystemExit('Current-screen activation marker not found.')
          source = source.replace(current_branch, current_replacement, 1)

          visible_branch = '''    target.classList.remove("hidden");
              target.setAttribute("aria-hidden", "false");
              activeScreenName = screenName;
              navigationRevision += 1;'''
          visible_replacement = '''    target.classList.remove("hidden");
              target.setAttribute("aria-hidden", "false");
              activeScreenName = screenName;
              if(typeof window.activateFootballVisualScreen === "function"){
                  try{ window.activateFootballVisualScreen(screenName); }
                  catch(error){ console.warn(`[Career Mode Showdown] Optional football visual activation failed for ${screenName}:`, error); }
              }
              navigationRevision += 1;'''
          if visible_branch not in source:
              raise SystemExit('Route visibility activation marker not found.')
          path.write_text(source.replace(visible_branch, visible_replacement, 1))
          PY

      - name: Remove one-shot patcher and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-visible-photo-activation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/screens.js .github/workflows/apply-visible-photo-activation.yml
          git commit -m 'Activate licensed photos only after screen becomes visible'
          git push origin HEAD:agent/licensed-football-visual-system-r1
