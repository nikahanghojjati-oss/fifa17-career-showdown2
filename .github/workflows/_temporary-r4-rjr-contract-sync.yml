name: TEMP r4 RJR contract sync

on:
  push:
    branches:
      - stage5e/r4-stale-pointer-precedence-2026-09-02
    paths:
      - .github/workflows/_temporary-r4-rjr-contract-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5e/r4-stale-pointer-precedence-2026-09-02
          fetch-depth: 0
      - name: Sync current RJR automation authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('tests/contracts/handoff-immediate-next-task-contracts.cjs')
          text = contract.read_text()
          old = 'assert.equal(readiness.currentScore,87,"The fixed RJR authority must preserve the exact production provider-abuse RJR87 checkpoint.");\nassert.equal(bootstrap.remoteJoiningReadiness?.score,readiness.currentScore,"The SLE bootstrap must agree exactly with the live RJR ledger.");'
          new = 'assert.ok(readiness.currentScore>=87&&readiness.currentScore<=100,"The fixed RJR authority must not regress below the production provider-abuse RJR87 checkpoint or exceed its denominator.");\nconst stage5eLifecycleEvidence=readiness.evidenceHistory?.find(entry=>entry.eventId==="production-stage5e-r3-provider-live-remote-joining-lifecycle");\nassert.equal(stage5eLifecycleEvidence?.score,88,"The fixed RJR authority must preserve the evidence-only Stage 5E r3 provider-live lifecycle recalculation to RJR88.");\nassert.equal(stage5eLifecycleEvidence?.delta,1,"The Stage 5E r3 lifecycle must remain one bounded capability credit.");\nassert.equal(bootstrap.remoteJoiningReadiness?.score,readiness.currentScore,"The SLE bootstrap must agree exactly with the live RJR ledger.");'
          assert old in text, 'current RJR87 hardcode anchor missing'
          text = text.replace(old, new, 1)
          old_checkpoint = 'assert.equal(bootstrap.currentPublicationCheckpoint?.rjrAfterEvidence,readiness.currentScore,"SESSION_BOOTSTRAP publication checkpoint must preserve exact conservative RJR accounting.");'
          new_checkpoint = 'assert.equal(bootstrap.currentPublicationCheckpoint?.rjrAfterEvidence,87,"SESSION_BOOTSTRAP must preserve the historical PR #176 RJR87 checkpoint.");\nassert.ok(bootstrap.currentPublicationCheckpoint?.rjrAfterEvidence<=readiness.currentScore,"Historical publication RJR must never exceed the live readiness ledger.");'
          assert old_checkpoint in text, 'historical checkpoint assertion anchor missing'
          contract.write_text(text.replace(old_checkpoint, new_checkpoint, 1))

          bootstrap = Path('SESSION_BOOTSTRAP.json')
          data = bootstrap.read_text()
          old_score = '"remoteJoiningReadiness": {\n    "authority": "REMOTE_JOINING_READINESS.json",\n    "model": "RJR-1",\n    "score": 87,'
          new_score = '"remoteJoiningReadiness": {\n    "authority": "REMOTE_JOINING_READINESS.json",\n    "model": "RJR-1",\n    "score": 88,'
          assert old_score in data, 'SESSION_BOOTSTRAP current score anchor missing'
          bootstrap.write_text(data.replace(old_score, new_score, 1))
          PY
      - name: Commit synchronized RJR automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contracts/handoff-immediate-next-task-contracts.cjs SESSION_BOOTSTRAP.json
          git commit -m "Sync RJR88 handoff automation contract"
          git push origin HEAD:stage5e/r4-stale-pointer-precedence-2026-09-02
