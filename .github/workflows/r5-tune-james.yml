name: R5 Tune James Presentation

on:
  push:
    branches: [agent/r5-smart-player-photo-rebuild]
    paths:
      - 'tools/tune_r5_james_overlay.py'
      - '.github/workflows/r5-tune-james.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/r5-smart-player-photo-rebuild
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/tune_r5_james_overlay.py
      - name: Commit tuned CSS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/footballVisuals.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reduce inherited wash over rebuilt James photo"
          git push origin HEAD:agent/r5-smart-player-photo-rebuild
