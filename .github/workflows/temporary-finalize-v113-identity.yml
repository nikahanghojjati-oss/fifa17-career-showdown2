name: Temporary v1.1.3 Release Identity Finalizer

on:
  push:
    branches: [v1.1.3-candidate-c-visual-fixes]
    paths:
      - tools/finalize_v113_release_identity.py
      - .github/workflows/temporary-finalize-v113-identity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-v113-identity
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.1.3-candidate-c-visual-fixes
      - name: Apply release identity
        run: python tools/finalize_v113_release_identity.py
      - name: Validate identity coherence
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"version": "1.1.3"' package.json
          test "$(grep -Fc '"version": "1.1.3"' package-lock.json)" -eq 2
          grep -F 'content="1.1.3-r1"' index.html
          grep -F 'v1.1.3 · Stable' index.html
          grep -F 'const APP_VERSION = "1.1.3"' js/app.js
          grep -F '1.1.3-r1' js/optionalModules.js
          grep -F '1.1.3-r1' js/footballVisuals.js
      - name: Commit release identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json index.html js/app.js js/optionalModules.js js/footballVisuals.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Set v1.1.3 release identity [skip ci]'
          git push origin HEAD:v1.1.3-candidate-c-visual-fixes
