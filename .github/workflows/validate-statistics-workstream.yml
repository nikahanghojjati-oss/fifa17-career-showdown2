name: Validate Statistics Workstream

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  statistics-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate career and rivalry analytics fixtures
        shell: bash
        run: |
          set -euo pipefail
          node tests/contracts/statistics-fixtures.cjs

      - name: Validate Main Menu Statistics architecture
        shell: bash
        run: |
          set -euo pipefail
          node tests/contracts/statistics-architecture.cjs
