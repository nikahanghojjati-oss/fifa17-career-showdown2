name: Temporary v1.1.3 Eager Path Compaction

on:
  push:
    branches:
      - v1.1.3-candidate-c-visual-fixes
    paths:
      - .github/workflows/temporary-compact-v113-eager.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-eager-path:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Apply exact behavior-equivalent compaction and enforce protected budgets
        run: python tools/temporary_compact_v113_eager.py
      - name: Publish only guarded eager-path changes
        run: |
          set -euo pipefail
          git diff --exit-code -- tools/temporary_compact_v113_eager.py .github/workflows/temporary-compact-v113-eager.yml
          changed="$(git diff --name-only)"
          test "$changed" = $'js/optionalModules.js\njs/screens.js'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/optionalModules.js js/screens.js
          git commit -m "Compact v1.1.3 eager visual routing under protected budget"
          git push
