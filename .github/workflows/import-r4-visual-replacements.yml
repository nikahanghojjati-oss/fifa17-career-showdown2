name: Import R4 Visual Replacements

on:
  push:
    branches:
      - agent/r4-visual-recovery-and-error-provenance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Run r4 visual import'))
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v5
        with:
          ref: agent/r4-visual-recovery-and-error-provenance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Import replacement Creative Commons sources
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import hashlib, json, io, time

          root = Path('.')
          out_dir = root / 'assets' / 'football'
          out_dir.mkdir(parents=True, exist_ok=True)

          assets = [
              {
                  'id': 'james-rodriguez-real-madrid-2016-r4',
                  'source_file': 'James Rodríguez in September 2016 - 01.jpg',
                  'output': 'james-rodriguez-real-madrid-2016-r4.webp',
                  'download': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/James%20Rodr%C3%ADguez%20in%20September%202016%20-%2001.jpg',
                  'source_page': 'https://commons.wikimedia.org/wiki/File:James_Rodr%C3%ADguez_in_September_2016_-_01.jpg',
                  'author': 'Real Madrid',
                  'license': 'CC BY 3.0',
                  'license_url': 'https://creativecommons.org/licenses/by/3.0/',
                  'context': 'James Rodríguez after Borussia Dortmund v Real Madrid, 28 September 2016.',
                  'max_size': (863, 1080),
                  'quality': 92
              },
              {
                  'id': 'marcus-rashford-man-utd-feyenoord-2016',
                  'source_file': 'Manchester United v Feyenoord, November 2016 (23).JPG',
                  'output': 'marcus-rashford-man-utd-feyenoord-2016.webp',
                  'download': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Manchester%20United%20v%20Feyenoord%2C%20November%202016%20%2823%29.JPG',
                  'source_page': 'https://commons.wikimedia.org/wiki/File:Manchester_United_v_Feyenoord,_November_2016_(23).JPG',
                  'author': 'Ardfern',
                  'license': 'CC BY-SA 4.0',
                  'license_url': 'https://creativecommons.org/licenses/by-sa/4.0/',
                  'context': 'Marcus Rashford for Manchester United v Feyenoord at Old Trafford, 24 November 2016.',
                  'max_size': (1600, 1200),
                  'quality': 86
              },
              {
                  'id': 'anthony-martial-man-utd-2015-r4',
                  'source_file': 'Anthony Martial 2015.jpg',
                  'output': 'anthony-martial-man-utd-2015-r4.webp',
                  'download': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Anthony%20Martial%202015.jpg',
                  'source_page': 'https://commons.wikimedia.org/wiki/File:Anthony_Martial_2015.jpg',
                  'author': 'Dmitry Golubovich',
                  'license': 'CC BY-SA 2.5',
                  'license_url': 'https://creativecommons.org/licenses/by-sa/2.5/',
                  'context': 'Anthony Martial of Manchester United v CSKA Moscow, 21 October 2015.',
                  'max_size': (688, 560),
                  'quality': 94
              },
              {
                  'id': 'lionel-messi-barcelona-2016-r4',
                  'source_file': 'Save the Dream at the Match of champions (31067838784).jpg',
                  'output': 'lionel-messi-barcelona-2016-r4.webp',
                  'download': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Save%20the%20Dream%20at%20the%20Match%20of%20champions%20%2831067838784%29.jpg',
                  'source_page': 'https://commons.wikimedia.org/wiki/File:Save_the_Dream_at_the_Match_of_champions_(31067838784).jpg',
                  'author': 'Save the Dream',
                  'license': 'CC BY 2.0',
                  'license_url': 'https://creativecommons.org/licenses/by/2.0/',
                  'context': 'Lionel Messi for FC Barcelona at Al-Ahli v Barcelona, 16 December 2016.',
                  'max_size': (960, 676),
                  'quality': 94
              }
          ]

          headers = {'User-Agent': 'CareerModeShowdown/1.0 visual-import (+https://github.com/nikahanghojjati-oss/fifa17-career-showdown2)'}

          def download_with_backoff(item):
              last_error = None
              for attempt in range(1, 7):
                  try:
                      req = Request(item['download'], headers=headers)
                      with urlopen(req, timeout=90) as response:
                          data = response.read()
                      if len(data) < 10000:
                          raise RuntimeError(f"Source unexpectedly small: {item['source_file']} ({len(data)} bytes)")
                      return data
                  except (HTTPError, URLError, TimeoutError, RuntimeError) as error:
                      last_error = error
                      if attempt == 6:
                          break
                      wait = attempt * 7
                      print(f"Attempt {attempt} failed for {item['source_file']}: {error}; sleeping {wait}s")
                      time.sleep(wait)
              raise last_error

          generated = []
          for index, item in enumerate(assets):
              if index:
                  time.sleep(6)
              print(f"Downloading {item['source_file']}...")
              source_bytes = download_with_backoff(item)
              source_sha = hashlib.sha256(source_bytes).hexdigest()
              with Image.open(io.BytesIO(source_bytes)) as opened:
                  image = ImageOps.exif_transpose(opened).convert('RGB')
                  source_dimensions = image.size
                  max_w, max_h = item['max_size']
                  scale = min(1.0, max_w / image.width, max_h / image.height)
                  if scale < 1.0:
                      image = image.resize((round(image.width * scale), round(image.height * scale)), Image.Resampling.LANCZOS)
                  output_path = out_dir / item['output']
                  image.save(output_path, 'WEBP', quality=item['quality'], method=6)
                  output_dimensions = image.size

              output_bytes = output_path.read_bytes()
              if len(output_bytes) > 360000:
                  raise RuntimeError(f"Derivative exceeds 360 KB: {item['output']} ({len(output_bytes)} bytes)")
              generated.append({
                  'id': item['id'],
                  'source_file': item['source_file'],
                  'output': item['output'],
                  'max_size': list(item['max_size']),
                  'quality': item['quality'],
                  'author': item['author'],
                  'license': item['license'],
                  'license_url': item['license_url'],
                  'source_page': item['source_page'],
                  'context': item['context'],
                  'special_redirect_url': item['download'],
                  'source_dimensions': list(source_dimensions),
                  'source_sha256': source_sha,
                  'output_dimensions': list(output_dimensions),
                  'output_bytes': len(output_bytes),
                  'output_sha256': hashlib.sha256(output_bytes).hexdigest()
              })
              print(item['output'], generated[-1]['output_dimensions'], generated[-1]['output_bytes'])

          existing_manifest = json.loads((out_dir / 'asset-manifest.json').read_text())
          lahm = next(asset for asset in existing_manifest['assets'] if asset['id'] == 'philipp-lahm-world-cup-2014')
          final_assets = generated + [lahm]
          aggregate = sum(asset['output_bytes'] for asset in final_assets)
          if aggregate > 1100000:
              raise RuntimeError(f"Required visual payload exceeds 1.1 MB: {aggregate}")

          manifest = {
              'generated_by': 'import-r4-visual-replacements.yml',
              'transformation': 'EXIF orientation normalized, resized down only with Lanczos, converted to WebP; no generative alteration.',
              'assets': final_assets
          }
          (out_dir / 'asset-manifest.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          for filename in [
              'james-rodriguez-real-madrid-2016.webp',
              'marcus-rashford-man-utd-2016.webp',
              'anthony-martial-man-utd-2017.webp',
              'lionel-messi-barcelona-2016.webp'
          ]:
              candidate = out_dir / filename
              if candidate.exists():
                  candidate.unlink()

          print('Aggregate required photo bytes:', aggregate)
          PY

      - name: Commit imported derivatives and manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/football; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/football
          git commit -m 'Import clean r4 football visual sources'
          git pull --rebase origin agent/r4-visual-recovery-and-error-provenance
          git push origin HEAD:agent/r4-visual-recovery-and-error-provenance
