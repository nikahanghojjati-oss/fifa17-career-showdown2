name: Temporary PR144 Release Contract Sync

on:
  push:
    branches:
      - agent/v182-rivalry-id-recovery-ux

permissions:
  contents: write

jobs:
  sync-release-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v182-rivalry-id-recovery-ux
          fetch-depth: 0
      - name: Synchronize r2 release authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('tests/contracts/production-app-check-runtime-contracts.cjs')
          s=p.read_text()
          old='const currentRelease=read(`RELEASE_V${pkg.version}.md`);'
          new='const candidateRevision=(index.match(/app-asset-revision"\\s+content="([^"]+)/)||[])[1];\nconst candidateGeneration=Number((candidateRevision&&candidateRevision.match(/-r(\\d+)$/)||[])[1]);\nconst currentRelease=read(candidateGeneration===1?`RELEASE_V${pkg.version}.md`:`RELEASE_V${pkg.version}_R${candidateGeneration}.md`);'
          if s.count(old)!=1: raise SystemExit('currentRelease marker mismatch')
          p.write_text(s.replace(old,new))

          w=Path('WORK_ENVIRONMENT_STATUS.json')
          data=json.loads(w.read_text())
          for key in ('knownHazards','evidenceNotes'):
            vals=data['continuity'].get(key,[])
            for i,value in enumerate(vals):
              vals[i]=value.replace('App Check enforcement OFF','App Check enforcement remains OFF')
          w.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          state=Path('PROJECT_STATE.md')
          st=state.read_text()
          st=st.replace('Status: RELEASE CANDIDATE / `v1.8.1 / 1.8.1-r2` /','Status: RELEASE CANDIDATE / NOT PRODUCTION-PROVEN / `v1.8.1 / 1.8.1-r2` /',1)
          state.write_text(st)

          nxt=Path('NEXT_TASK.md')
          nt=nxt.read_text()
          marker='Status: PR #144 CANDIDATE / `v1.8.1 / 1.8.1-r2` / previous whole shell `1.8.1-r1` / OFFICIAL RJR-1 78/100 / STAGE 5 LOCKED.\n'
          if marker not in nt: raise SystemExit('NEXT_TASK candidate marker missing')
          nt=nt.replace(marker,marker+'\nAuthorized release candidate: `v1.8.1 / 1.8.1-r2`; immediate production/recovery runtime remains `1.8.1-r1` until deployment proof.\n',1)
          nxt.write_text(nt)

          Path('CAREER_MODE_SHOWDOWN_V1.8.1_R2_MAINTENANCE_HANDOFF.md').write_text('''# Career Mode Showdown v1.8.1-r2 Maintenance Handoff\n\nStatus: RELEASE CANDIDATE / NOT PRODUCTION-PROVEN\n\nApplication version: `v1.8.1`\nRuntime asset revision: `1.8.1-r2`\nPrevious known-good runtime: `1.8.1-r1`\nRemote Joining readiness: `78/100` under RJR-1.\n\nThis maintenance candidate fixes Connected Rivalry recovery on mobile: the exact saved `pair_` plus 64-hex rivalry ID is visible in full, wraps without changing its value, remains selectable, and COPY RIVALRY ID copies the complete immutable saved ID rather than editable attachment text. Durable-ID shortening is abandoned; recognition fingerprints are display-only.\n\nThe r2 Service Worker also preserves rollback coverage for clients that skipped r1 by retaining the highest verified installed older shell when the declared r1 shell is absent. No mixed-generation network fallback is permitted for retained versioned assets.\n\nSafety locks remain unchanged: Firebase Spark / zero billing; App Check enforcement remains OFF; Firestore memory-only; popup-only browserSessionPersistence; unchanged Firestore Rules; exactly two private managers; no public discovery; Stage 5 locked. The Installable Offline App remains available. Candidate C remains the sole destructive remote-to-local Apply path, using transaction-owned mutation, backup first, strict exact raw snapshot guards, stale/anti-clobber rejection, ownership-scoped rollback and exact recovery verification.\n''')
          PY
          rm .github/workflows/tmp-pr144-release-contract-sync.yml
          node --check tests/contracts/production-app-check-runtime-contracts.cjs
          npm run test:contracts
          git diff --check
      - name: Commit synchronized authority
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete r2 release authority coherence"
          git push origin HEAD:agent/v182-rivalry-id-recovery-ux
