name: R14 recorder exact authority fixture probe

on:
  push:
    branches:
      - feat/ssjr-journey-reconnect-r14
    paths:
      - .github/workflows/r14-fix-acceptance-reload-readiness-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ssjr-journey-reconnect-r14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Modernize ACTIVE fixture only in workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/ssjr-production-acceptance-recorder-audit.cjs')
          text = path.read_text()
          old = 'getState(){return Object.freeze({sessionState:"active",sessionId:raw.initialSession,pendingAction:null,role:"host"});}'
          new = 'getState(){return Object.freeze({sessionState:"active",sessionId:raw.initialSession,rivalryId:raw.rivalry,accountId:raw.account,deviceId:raw.device,pendingAction:null,role:"host",expiresAtEpochMs:Date.now()+3600000});}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy ACTIVE fixture, found {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          node --check tests/browser/ssjr-production-acceptance-recorder-audit.cjs
      - name: Run exact inherited recorder audit
        shell: bash
        run: |
          npm ci
          npm run serve:test >/tmp/cms-r14-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              CMS_CHROMIUM_MULTI_CONTEXT=1 node tests/browser/ssjr-production-acceptance-recorder-audit.cjs
              exit $?
            fi
            sleep 0.25
          done
          cat /tmp/cms-r14-server.log
          exit 1
