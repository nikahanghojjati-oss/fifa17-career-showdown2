name: R14 standalone reload diagnostic

on:
  push:
    branches:
      - feat/ssjr-journey-reconnect-r14
    paths:
      - .github/workflows/r14-fix-acceptance-reload-readiness-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ssjr-journey-reconnect-r14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Start repository test server
        shell: bash
        run: |
          npm run serve:test >/tmp/cms-r14-server.log 2>&1 &
          echo $! > /tmp/cms-r14-server.pid
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/cms-r14-server.log
          exit 1
      - name: Diagnose recorder reload bootstrap
        run: node scripts/r14-recorder-reload-diagnostic.mjs
