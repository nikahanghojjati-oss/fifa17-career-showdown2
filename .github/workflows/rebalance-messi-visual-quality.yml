name: Rebalance Messi Visual Quality

on:
  push:
    branches:
      - agent/licensed-football-visual-system-r1
    paths:
      - .github/workflows/rebalance-messi-visual-quality.yml

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v5
        with:
          ref: agent/licensed-football-visual-system-r1
          fetch-depth: 0

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Build 1440px no-upscale Messi derivative
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import hashlib, io, json

          source_file = 'Messi & Suarez.jpg'
          source_url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + quote(source_file, safe='')
          request = Request(source_url, headers={
              'User-Agent':'CareerModeShowdownAssetBuilder/1.0 (+https://github.com/nikahanghojjati-oss/fifa17-career-showdown2)'
          })
          with urlopen(request, timeout=60) as response:
              raw = response.read()

          with Image.open(io.BytesIO(raw)) as opened:
              image = ImageOps.exif_transpose(opened).convert('RGB')
              if image.size != (1616, 2424):
                  raise SystemExit(f'Unexpected Messi source dimensions: {image.size}')
              image = image.resize((1440, 2160), Image.Resampling.LANCZOS)
              output_path = Path('assets/football/lionel-messi-barcelona-2016.webp')
              selected_quality = None
              for quality in (82,80,78,76,74,72,70):
                  image.save(output_path, 'WEBP', quality=quality, method=6)
                  if output_path.stat().st_size <= 360_000:
                      selected_quality = quality
                      break
              if selected_quality is None:
                  raise SystemExit(f'1440px Messi derivative exceeds 360 KB even at quality 70 ({output_path.stat().st_size})')

          output = output_path.read_bytes()
          manifest_path = Path('assets/football/asset-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          target = next(item for item in manifest['assets'] if item['id'] == 'lionel-messi-barcelona-2016')
          target.update({
              'max_size':[1440,2160],
              'quality':selected_quality,
              'source_dimensions':[1616,2424],
              'source_sha256':hashlib.sha256(raw).hexdigest(),
              'output_dimensions':[1440,2160],
              'output_bytes':len(output),
              'output_sha256':hashlib.sha256(output).hexdigest()
          })
          total = sum(item['output_bytes'] for item in manifest['assets'])
          if total > 1_100_000:
              raise SystemExit(f'Required football presentation exceeds 1.1 MB aggregate ceiling ({total})')
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          notices_path = Path('THIRD_PARTY_NOTICES.md')
          notices = notices_path.read_text()
          for old in (
              'Local transformation: retained at the native 1616 × 2424 source dimensions and encoded as WebP at quality 70 to avoid desktop Statistics hero upscaling.',
              'Local transformation: resized from 1616 × 2424 to 1067 × 1600, then encoded as WebP.'
          ):
              notices = notices.replace(old, f'Local transformation: resized from 1616 × 2424 to 1440 × 2160 with Lanczos and encoded as WebP at quality {selected_quality}; this remains above the measured desktop Statistics hero physical width to prevent runtime upscaling.')
          notices_path.write_text(notices)
          print(f'Messi presentation derivative: 1440x2160 q{selected_quality}, {len(output)} bytes; aggregate {total}')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rebalance-messi-visual-quality.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Balance Messi Statistics resolution and presentation weight'
          git push origin HEAD:agent/licensed-football-visual-system-r1
