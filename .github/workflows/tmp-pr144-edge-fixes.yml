name: Temporary PR144 Edge Fixes

on:
  push:
    branches:
      - agent/v182-rivalry-id-recovery-ux

permissions:
  contents: write

jobs:
  fix-edge-cases:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v182-rivalry-id-recovery-ux
          fetch-depth: 0
      - name: Apply and verify edge-case corrections
        run: |
          set -euo pipefail
          python scripts/tmp-pr144-edge-fixes.py
          rm scripts/tmp-pr144-edge-fixes.py .github/workflows/tmp-pr144-edge-fixes.yml
          git diff --check
          node --check js/sparkConnectedRivalry.js
          node --check service-worker.js
          node tests/contracts/stage4-connected-rivalry-contracts.cjs
          node tests/contracts/offline-hotfix-contracts.cjs
      - name: Commit edge-case corrections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR144 copy and rollback edge cases"
          git push origin HEAD:agent/v182-rivalry-id-recovery-ux
