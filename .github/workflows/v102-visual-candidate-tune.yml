name: v1.0.2 Visual Candidate Tune

on:
  push:
    branches:
      - agent/v1.0.2-footballer-tile-maintenance
    paths:
      - '.github/workflows/v102-visual-candidate-tune.yml'
      - 'tools/tune_v102_visual_candidate.py'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v1.0.2-footballer-tile-maintenance
          fetch-depth: 0
      - name: Apply evidence-driven candidate tuning
        run: python tools/tune_v102_visual_candidate.py
      - name: Verify syntax and package coherence
        run: |
          node --check js/app.js
          node --check tests/browser/football-visual-audit.cjs
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='1.0.2'||l.version!=='1.0.2'||l.packages[''].version!=='1.0.2') process.exit(1)"
      - name: Commit tuned candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/footballVisuals.css package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 0
          fi
          git commit -m "Tune James clean-anchor composition and release package version"
          git push origin HEAD:agent/v1.0.2-footballer-tile-maintenance
