name: One-time Pairing R3 Hardening V2

on:
  push:
    branches:
      - fix/pairing-copy-four-code-contract-2026-09-02

permissions:
  contents: write

jobs:
  harden-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/pairing-copy-four-code-contract-2026-09-02
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply r3 copy/one-paste automation hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('js/sparkPrivatePairing.js'); s=p.read_text()
          old='''      const createButton=createElement("button","menuButton settingsConnectedAccountButton","CREATE PAIRING CODE");createButton.type="button";createButton.disabled=pairingState.busy||!bindings.length;\n      const codeInput=createElement("input","settingsConnectedAccountInput");codeInput.type="text";codeInput.placeholder="Paste private pairing code";codeInput.autocomplete="off";codeInput.spellcheck=false;codeInput.setAttribute("aria-label","Private pairing code");\n      const joinButton=createElement("button","menuButton settingsConnectedAccountButton","JOIN PRIVATE PAIRING");joinButton.type="button";joinButton.disabled=pairingState.busy||!bindings.length;\n'''
          new='''      const createButton=createElement("button","menuButton settingsConnectedAccountButton","CREATE PAIRING CODE");createButton.type="button";createButton.disabled=pairingState.busy||!bindings.length;\n      const codeInput=createElement("input","settingsConnectedAccountInput");codeInput.type="text";codeInput.placeholder="Paste private pairing code";codeInput.autocomplete="off";codeInput.spellcheck=false;codeInput.setAttribute("aria-label","Private pairing code");\n      if(pairingState.status==="paired"&&pairingState.capability){codeInput.value=pairingState.capability;codeInput.readOnly=true;codeInput.setAttribute("aria-readonly","true");}\n      const joinButton=createElement("button","menuButton settingsConnectedAccountButton","JOIN PRIVATE PAIRING");joinButton.type="button";joinButton.disabled=pairingState.busy||!bindings.length||pairingState.status==="paired";\n'''
          assert old in s; s=s.replace(old,new,1)
          old='''        try{const context=await resolveConnectedContext();const result=await redeemPairing({user:context.user,firestore:context.services.firestore,firebaseSdk:context.services.firestoreSdk,identity:context.identity,binding,capability:codeInput.value,cryptoImpl:root.crypto});if(!result.ok)throw errorWithCode(result.code,result.message);codeInput.value="";setState({status:"paired",busy:false,capability:result.capability,expiresAtEpochMs:null,message:"Private managers are paired. Connected Rivalry below will use this exact rivalry ID automatically; no second copy, paste, or manual Attach is required in the normal flow."});}\n'''
          new='''        try{const context=await resolveConnectedContext();const result=await redeemPairing({user:context.user,firestore:context.services.firestore,firebaseSdk:context.services.firestoreSdk,identity:context.identity,binding,capability:codeInput.value,cryptoImpl:root.crypto});if(!result.ok)throw errorWithCode(result.code,result.message);setState({status:"paired",busy:false,capability:result.capability,expiresAtEpochMs:null,message:"Private managers are paired. The one code pasted above is retained as the exact Connected Rivalry ID, and Connected Rivalry below uses that same value automatically; no second copy, paste, or manual Attach is required in the normal flow."});}\n'''
          assert old in s; s=s.replace(old,new,1)
          old='''      form.append(select,createButton,codeInput,joinButton);panel.appendChild(form);\n      if(pairingState.capability){const capabilityBox=createElement("div","settingsDataNote");capabilityBox.append(createElement("strong","",pairingState.status==="paired"?"CONNECTED RIVALRY ID: ":"PRIVATE PAIRING CODE: "),createElement("code","",pairingState.capability));panel.appendChild(capabilityBox);}\n'''
          new='''      form.append(select,createButton,codeInput,joinButton);panel.appendChild(form);\n      if(pairingState.capability){\n        const capabilityBox=createElement("div","settingsDataNote");\n        const capabilityText=createElement("code","",pairingState.capability);\n        capabilityBox.append(createElement("strong","",pairingState.status==="paired"?"CONNECTED RIVALRY ID · ONE PASTE CONFIRMED: ":"PRIVATE PAIRING CODE · COPY ONCE: "),capabilityText);\n        panel.appendChild(capabilityBox);\n        if(pairingState.status==="pair-open"){\n          const copyButton=createElement("button","menuButton settingsConnectedAccountButton","COPY PAIRING CODE");\n          copyButton.type="button";\n          copyButton.addEventListener("click",async()=>{\n            const capability=pairingState.capability;\n            if(!capability)return;\n            let copied=false;\n            if(root.navigator&&root.navigator.clipboard&&typeof root.navigator.clipboard.writeText==="function"){try{await root.navigator.clipboard.writeText(capability);copied=true;}catch(_error){copied=false;}}\n            if(!copied){\n              const fallbackCopy=createElement("textarea","settingsConnectedAccountInput");fallbackCopy.value=capability;fallbackCopy.readOnly=true;fallbackCopy.setAttribute("aria-hidden","true");fallbackCopy.style.position="fixed";fallbackCopy.style.opacity="0";fallbackCopy.style.pointerEvents="none";root.document.body.appendChild(fallbackCopy);fallbackCopy.focus();fallbackCopy.setSelectionRange(0,capability.length);try{copied=Boolean(root.document.execCommand&&root.document.execCommand("copy"));}catch(_error){copied=false;}fallbackCopy.remove();\n            }\n            if(copied){setState({message:"Pairing code copied. Paste it exactly once into Player Two's Join Private Pairing field; Player One and Player Two Connected Rivalry will use the same ID automatically."});return;}\n            if(root.getSelection&&root.document.createRange){const selection=root.getSelection();const range=root.document.createRange();range.selectNodeContents(capabilityText);selection.removeAllRanges();selection.addRange(range);}\n            const status=panel.querySelector('[role="status"]');if(status)status.textContent="Automatic clipboard copy was unavailable. The full pairing code is selected; use your browser Copy command. The code itself was not changed.";\n          });\n          panel.appendChild(copyButton);\n        }\n      }\n'''
          assert old in s; s=s.replace(old,new,1)
          old='''      const result=await registerDevice({user:context.user,firestore:context.services.firestore,firebaseSdk:context.services.firestoreSdk,identity:context.identity,cryptoImpl:root.crypto});\n      if(!result.ok)throw errorWithCode(result.code,result.message);\n      return setState({status:"ready",initialized:true,busy:false,connected:true,registered:true,accountId:context.accountState.accountId,deviceId:context.identity.deviceId,message:"This browser is privately registered. Pairing only links the two manager identities; gameplay synchronization is still locked."});\n'''
          new='''      const result=await registerDevice({user:context.user,firestore:context.services.firestore,firebaseSdk:context.services.firestoreSdk,identity:context.identity,cryptoImpl:root.crypto});\n      if(!result.ok)throw errorWithCode(result.code,result.message);\n      const preservePairingState=["creating-pair","joining-pair","pair-open","paired"].includes(pairingState.status);\n      if(preservePairingState)return setState({initialized:true,connected:true,registered:true,accountId:context.accountState.accountId,deviceId:context.identity.deviceId});\n      return setState({status:"ready",initialized:true,busy:false,connected:true,registered:true,accountId:context.accountState.accountId,deviceId:context.identity.deviceId,message:"This browser is privately registered. Pairing only links the two manager identities; gameplay synchronization is still locked."});\n'''
          assert old in s; p.write_text(s.replace(old,new,1))
          for rel in ['index.html','js/app.js','js/menuExperience.js','js/sparkRemoteJoining.js','manifest.webmanifest','service-worker.js']:
              q=Path(rel); t=q.read_text(); assert '1.9.0-r2' in t, rel; q.write_text(t.replace('1.9.0-r2','1.9.0-r3'))
          q=Path('service-worker.js'); t=q.read_text(); old='const PREVIOUS_RUNTIME_REVISION = "1.8.1-r5";'; assert old in t; q.write_text(t.replace(old,'const PREVIOUS_RUNTIME_REVISION = "1.9.0-r2";',1))
          q=Path('tests/contracts/release-shell-coherence-contracts.cjs'); t=q.read_text(); q.write_text(t.replace('RELEASE_V1.9.0_R2.md','RELEASE_V1.9.0_R3.md').replace('assert.equal(runtime,"1.9.0-r2");','assert.equal(runtime,"1.9.0-r3");').replace('assert.equal(previous,"1.8.1-r5");','assert.equal(previous,"1.9.0-r2");'))
          q=Path('tests/support/run-contract-suite.cjs'); t=q.read_text(); marker='  "tests/contracts/stage3-private-pairing-contracts.cjs",\n'; assert marker in t; q.write_text(t.replace(marker,marker+'  "tests/contracts/pairing-four-code-automation-contracts.cjs",\n',1))
          q=Path('package.json'); t=q.read_text(); old='node tests/browser/stage3-private-pairing-audit.cjs && node tests/browser/stage4-remote-local-reconciliation-audit.cjs'; assert old in t; q.write_text(t.replace(old,'node tests/browser/stage3-private-pairing-audit.cjs && node tests/browser/pairing-four-code-automation-audit.cjs && node tests/browser/stage4-remote-local-reconciliation-audit.cjs',1))
          q=Path('.github/workflows/validate-stage3-private-pairing.yml'); t=q.read_text();
          old='''      - name: Run deterministic Stage 3 client contracts\n        run: node tests/contracts/stage3-private-pairing-contracts.cjs\n'''; new='''      - name: Run deterministic Stage 3 client contracts\n        run: |\n          node tests/contracts/stage3-private-pairing-contracts.cjs\n          node tests/contracts/pairing-four-code-automation-contracts.cjs\n'''; assert old in t; t=t.replace(old,new,1)
          old='''          node tests/browser/stage3-private-pairing-audit.cjs\n          node tests/browser/stage5b-device-credential-audit.cjs\n'''; new='''          node tests/browser/stage3-private-pairing-audit.cjs\n          node tests/browser/pairing-four-code-automation-audit.cjs\n          node tests/browser/stage5b-device-credential-audit.cjs\n'''; assert old in t; q.write_text(t.replace(old,new,1))
          runbook=Path('STAGE5E_PRODUCTION_REMOTE_JOINING_ACCEPTANCE_RUNBOOK_2026-09-02.md'); t=runbook.read_text(); section='''\n## v1.9.0-r3 four-code / one-paste acceptance gate\n\nBefore owner production testing, the exact same full private capability must be present without transformation as: (1) Player One generated pairing code, (2) Player One Connected Rivalry prefill/attachment, (3) Player Two Join Private Pairing input after exactly one paste, and (4) Player Two Connected Rivalry attachment. Player One uses `COPY PAIRING CODE` directly below the generated full code. After successful Player Two join, the join input retains that exact value read-only and Join is disabled.\n\nAfter Player Two joins, Player One must not press `VERIFY / REATTACH` in normal acceptance. Return to Save Library or open Private Remote Joining; normal Connected Rivalry initialization must verify and persist the provider-active rivalry automatically. If manual Verify/Reattach is needed, stop and count the automation as failed. Fully redact every live `pair_...` value in screenshots/chat.\n''';
          if '## v1.9.0-r3 four-code / one-paste acceptance gate' not in t: runbook.write_text(t.rstrip()+section+'\n')
          PY
          cat > RELEASE_V1.9.0_R3.md <<'EOF'
          # Career Mode Showdown v1.9.0-r3 — Pairing Copy + Four-Code One-Paste Hardening

          Status: RELEASE CANDIDATE

          Application version: `v1.9.0`

          Runtime asset revision: `1.9.0-r3`

          Previous known-good runtime: `1.9.0-r2`

          ## Purpose

          This bounded runtime hardening makes private pairing smoother and directly observable before Stage 5E production acceptance. Player One gets `COPY PAIRING CODE` directly beneath the full generated capability. Player Two pastes exactly once. Successful redemption retains that same value read-only in the join field, disables Join against replay, and hands the same ID to Connected Rivalry automatically. Player One generated code, Player One Connected Rivalry, Player Two one-paste input, and Player Two Connected Rivalry must be byte-for-byte identical.

          After Player Two joins, Player One does not manually reattach. The next normal Save Library or Private Remote Joining initialization verifies the provider-active rivalry through existing Connected Rivalry authority and persists the existing IndexedDB pointer. Manual Verify/Reattach remains recovery-only and counts as an acceptance failure if needed in the normal flow.

          Late device-registration completion is explicitly non-destructive while pairing is creating, joining, open, or already paired: it may refresh registered-device metadata but cannot clobber the live pairing status, manager binding, capability, expiry or user guidance.

          ## Ultra-regression proof

          A deterministic two-account contract repeats four-code equality and active authority 25 times. A dedicated Chromium audit repeats three fresh Player One and three fresh Player Two browser contexts, including exact clipboard copy, Player One prefill/post-join auto-attach, one Player Two paste event, retained read-only input, disabled replay and exact Connected Rivalry equality. Existing Stage 3, Stage 4, Stage 5E, stability, emulator and release gates remain mandatory.

          ## Safety boundary

          No Firebase authority, polling, collection listing, persistent capability store, gameplay mutation, canonical localStorage mutation or billing service is added. Firebase remains Spark; billing remains forbidden; Firestore remains memory-only; App Check enforcement remains OFF; Candidate C remains sole destructive remote-to-local gameplay Apply authority; public discovery remains prohibited.

          ## RJR accounting

          Fixed RJR-1 remains `87/100` through source, automation proof, review, merge and deployment. RJR can rise only from newly verified owner production capability evidence.
          EOF
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax and deterministic ultra-proof
        run: |
          node --check js/sparkPrivatePairing.js
          node --check tests/browser/pairing-four-code-automation-audit.cjs
          node tests/contracts/stage3-private-pairing-contracts.cjs
          node tests/contracts/stage4-connected-rivalry-pointer-restore-contracts.cjs
          node tests/contracts/pairing-four-code-automation-contracts.cjs
      - name: Repeated Chromium four-code automation proof
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:test > /tmp/cms-r3-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/browser/stage3-private-pairing-audit.cjs
          node tests/browser/pairing-four-code-automation-audit.cjs
          node tests/browser/stage5e-remote-joining-audit.cjs
      - name: Full repository contract gate
        run: npm run test:contracts
      - name: Remove one-time automation workflow
        run: rm .github/workflows/automation-pairing-r3-hardening-v2.yml
      - name: Commit validated r3 hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden pairing copy and four-code one-paste automation"
          git push origin HEAD:fix/pairing-copy-four-code-contract-2026-09-02
