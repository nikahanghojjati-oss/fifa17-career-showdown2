name: Validate Release Integration Burn-In

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new main commit may replace stale burn-in work. Deliberate reruns/manual
# dispatches queue instead of cancelling an active proof.
concurrency:
  group: release-burnin-${{ github.ref_name }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event_name != 'workflow_dispatch' }}

jobs:
  burn-in:
    name: integration-burnin-pass-${{ matrix.pass }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repeat only the complete stateful integration journey
        env:
          CMS_BURNIN_PASS: ${{ matrix.pass }}
        run: bash tests/support/run-release-burnin-pass.sh
      - name: Upload pass evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-integration-burnin-${{ matrix.pass }}-${{ github.sha }}
          path: test-results/stability-audit-*.json
          if-no-files-found: error
          retention-days: 14
