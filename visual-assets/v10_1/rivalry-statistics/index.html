<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rivalry Statistics · Career Mode Showdown</title>
<link rel="stylesheet" href="../shared/showdown-tokens.css">
<link rel="stylesheet" href="../shared/showdown-type.css">
<link rel="stylesheet" href="../shared/showdown-ui.css">
<link rel="stylesheet" href="../shared/stage.css">
<link rel="stylesheet" href="../shared/motion.css">
<link rel="stylesheet" href="rivalry-statistics.css">
</head>
<body>
<section id="statistics" class="screen analyticsScreen" aria-labelledby="statisticsScreenTitle">
  <div id="stage-root" class="rv-stage" data-primary="#rvBack" data-sd-enter="scene">
    <span class="managerMarker managerMarkerDaniel" data-manager="daniel" aria-hidden="true"></span>
    <span class="managerMarker managerMarkerNik" data-manager="nik" aria-hidden="true"></span>
    <div class="rv-phoneArt" aria-hidden="true">
      <picture class="rv-phoneBg">
        <source media="(max-width: 900px)" srcset="assets/ENV_RV_PHONE_V1.webp" type="image/webp">
        <img alt="" decoding="async">
      </picture>
      <picture class="rv-phoneHero rv-phoneHero--daniel" data-sd-enter="character-left">
        <source media="(max-width: 900px)" srcset="assets/OVL_RV_DANIEL_PHONE_V1.webp" type="image/webp">
        <img alt="" decoding="async">
      </picture>
      <picture class="rv-phoneHero rv-phoneHero--nik" data-sd-enter="character-right">
        <source media="(max-width: 900px)" srcset="assets/OVL_RV_NIK_PHONE_V1.webp" type="image/webp">
        <img alt="" decoding="async">
      </picture>
      <span class="rv-phoneContact rv-phoneContact--daniel"></span>
      <span class="rv-phoneContact rv-phoneContact--nik"></span>
    </div>
    <div class="topbarReserve" aria-hidden="true"></div>
    <main id="rivalryStatisticsContent" class="analyticsContent rv-shell" data-tab="totals">
      <header class="rv-titleBlock" id="rvTitleBlock">
        <p class="sd-eyebrow">CAREER MODE SHOWDOWN 17</p>
        <h1 id="statisticsScreenTitle" class="sd-title sd-title--wordmark rv-wordmark" data-sd-enter="title">
          <span class="sd-visually-hidden">RIVALRY STATISTICS</span>
          <picture><source media="(max-width: 900px)" srcset="assets/TITLE_RV_V1_PHONE.webp" type="image/webp"><source srcset="assets/TITLE_RV_V1.webp" type="image/webp"><img src="assets/TITLE_RV_V1.webp" alt="" aria-hidden="true" width="1380" height="204"></picture>
        </h1>
        <p class="sd-tagline">TWO MANAGERS • ONE LEGACY</p>
      </header>
      <div id="rvPreviewChip" class="sd-preview-tag rv-preview">Preview data</div>
      <div id="rvInterim" class="rv-interim"></div>
      <div class="rv-tabs sd-tabs" role="tablist" aria-label="Rivalry views">
        <button type="button" role="tab" id="rvTabTotals" data-rv-tab="totals" aria-selected="true" aria-controls="rvPanelTotals">TOTALS</button>
        <button type="button" role="tab" id="rvTabHead" data-rv-tab="head" aria-selected="false" aria-controls="rvPanelHead" tabindex="-1">HEAD-TO-HEAD</button>
        <button type="button" role="tab" id="rvTabSeasons" data-rv-tab="seasons" aria-selected="false" aria-controls="rvPanelSeasons" tabindex="-1">SEASONS</button>
        <button type="button" role="tab" id="rvTabTrophies" data-rv-tab="trophies" aria-selected="false" aria-controls="rvPanelTrophies" tabindex="-1">TROPHIES</button>
      </div>
      <section class="rv-comparison sd-panel sd-panel--hero" id="rvPanelTotals" aria-label="Rivalry totals" data-sd-enter="panel">
        <div class="rv-manager rv-manager--left">
          <div class="rv-crest" id="rvCrestDaniel" aria-hidden="true"></div>
          <div><strong>DANIEL</strong><span id="rvClubDaniel">Club</span></div>
        </div>
        <div class="rv-manager rv-manager--right">
          <div><strong>NIK</strong><span id="rvClubNik">Club</span></div>
          <div class="rv-crest" id="rvCrestNik" aria-hidden="true"></div>
        </div>
        <div id="rvProgress" class="rv-progress" aria-live="polite"></div><div id="rvCoverage" class="rv-coverage" hidden></div><div id="rvReadState" class="rv-readState" hidden></div><div id="rvRows" class="rv-rows"></div>
      </section>
      <section class="rv-bottom rv-bottom--head sd-panel" id="rvPanelHead" aria-labelledby="rvHeadTitle" data-sd-enter="panel">
        <h2 id="rvHeadTitle" class="sd-panel__header">HEAD-TO-HEAD</h2>
        <div id="rvHeadBody"></div>
        <p class="rv-headCaption sd-tagline">EVERY SEASON WRITES A NEW CHAPTER.</p>
      </section>
      <section class="rv-bottom rv-bottom--seasons sd-panel" id="rvPanelSeasons" aria-labelledby="rvSeasonTitle" data-sd-enter="panel">
        <h2 id="rvSeasonTitle" class="sd-panel__header">SEASON-BY-SEASON</h2>
        <div id="rvSeasonBody"></div>
      </section>
      <section class="rv-bottom rv-bottom--trophies sd-panel" id="rvPanelTrophies" aria-labelledby="rvTrophyTitle" data-sd-enter="panel">
        <h2 id="rvTrophyTitle" class="sd-panel__header">TROPHY CABINET</h2>
        <div id="rvTrophyBody"></div>
      </section>
      <div id="rvState" class="rv-state" role="status" aria-live="polite"></div>
      <div class="analyticsActions rv-actions">
        <button id="rvBack" class="backButton sd-btn sd-btn--primary" type="button" data-sd-enter="button">BACK TO SHOWDOWN HOME</button>
      </div>
    </main>
    <div class="nav-reserve" aria-hidden="true"></div>
    <div class="sd-stage__layer sd-stage__layer--cutout" aria-hidden="true">
      <div class="sd-stage__registered">
        <div class="sd-stage__contact-shadow rv-contact rv-contact--daniel"></div>
        <div class="sd-stage__contact-shadow rv-contact rv-contact--nik"></div>
        <div class="sd-stage__cutout rv-cutout rv-cutout--daniel" data-sd-enter="character-left" data-src-1x="assets/OVL_RV_DANIEL_POINT_V1_1X.webp" data-src-2x="assets/OVL_RV_DANIEL_POINT_V1_2X.webp"></div>
        <div class="sd-stage__cutout rv-cutout rv-cutout--nik" data-sd-enter="character-right" data-src-1x="assets/OVL_RV_NIK_ARMS_V1_1X.webp" data-src-2x="assets/OVL_RV_NIK_ARMS_V1_2X.webp"></div>
      </div>
    </div>
    <div class="sd-stage__layer sd-stage__layer--light" aria-hidden="true">
      <div class="sd-stage__registered">
        <div class="sd-stage__rim rv-rim rv-rim--daniel" data-sd-enter="character-left" data-src-1x="assets/OVL_RV_DANIEL_POINT_V1_RIM_1X.webp" data-src-2x="assets/OVL_RV_DANIEL_POINT_V1_RIM_2X.webp"></div>
        <div class="sd-stage__rim rv-rim rv-rim--nik" data-sd-enter="character-right" data-src-1x="assets/OVL_RV_NIK_ARMS_V1_RIM_1X.webp" data-src-2x="assets/OVL_RV_NIK_ARMS_V1_RIM_2X.webp"></div>
      </div>
    </div>
  </div>
</section>
<script src="../../../js/visualIdentity.js"></script>
<script src="../shared/stage.js"></script>
<script src="../shared/motion.js"></script>
<script src="rivalry-statistics.js"></script>
<script>
/* Phone tabs (<=900px): show one rivalry panel at a time. Desktop ignores data-tab and shows every panel. */
(function(){var shell=document.getElementById("rivalryStatisticsContent"),tabs=[].slice.call(document.querySelectorAll("[data-rv-tab]"));
function pick(k,focus){shell.setAttribute("data-tab",k);tabs.forEach(function(t){var on=t.getAttribute("data-rv-tab")===k;t.setAttribute("aria-selected",on?"true":"false");t.tabIndex=on?0:-1;if(on&&focus)t.focus()})}
tabs.forEach(function(t,i){t.addEventListener("click",function(){pick(t.getAttribute("data-rv-tab"))});t.addEventListener("keydown",function(e){var d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(d){e.preventDefault();pick(tabs[(i+d+tabs.length)%tabs.length].getAttribute("data-rv-tab"),true)}})})})();
</script>
</body>
</html>
