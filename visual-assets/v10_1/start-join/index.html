<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start / Join · Career Mode Showdown</title>
<link rel="stylesheet" href="../shared/showdown-tokens.css">
<link rel="stylesheet" href="../shared/showdown-type.css">
<link rel="stylesheet" href="../shared/showdown-ui.css">
<link rel="stylesheet" href="../shared/stage.css">
<link rel="stylesheet" href="../shared/motion.css">
<link rel="stylesheet" href="start-join.css">
</head>
<body>
<div id="stage-root" class="sd-stage" data-screen="start-join" data-plate-width="1672" data-plate-height="941">
  <div class="sd-stage__layer sd-stage__layer--plate" aria-hidden="true">
    <div class="sd-stage__registered"><div class="sd-stage__plate"></div></div>
  </div>
  <div class="sd-stage__layer sd-stage__layer--atmosphere" aria-hidden="true"></div>

  <div class="sd-stage__layer sd-stage__layer--ui">
    <header class="sj-header">
      <span id="previewTag"></span>
      <p id="screenEyebrow" class="sj-eyebrow sd-label"></p>
      <h1 id="screenTitle" class="sj-title sd-title">
        <span class="sd-visually-hidden">CONNECT PLAYERS</span>
        <!-- TODO-WORDMARK: replace this display-font fallback with ticket 124 TITLE_CONNECT_PLAYERS at Claude intake. -->
        <span class="sj-title-fallback" aria-hidden="true">CONNECT PLAYERS</span>
      </h1>
      <p id="screenTagline" class="sj-tagline sd-tagline">Daniel and Nik must both be connected before the career begins.</p>
    </header>

    <main id="startJoinScreen" class="sj-main">
      <section class="sj-main-panel sd-panel" aria-label="Connect players">
        <button id="startJoinBack" class="sj-back backButton sd-btn sd-btn--secondary" type="button"></button>

        <div class="sj-role-grid">
          <section class="sj-role-panel sj-role-panel--daniel sd-panel" aria-labelledby="danielRoleHeading">
            <div class="sj-role-head">
              <span class="sj-role-glyph sj-role-glyph--host" aria-hidden="true"></span>
              <div>
                <p class="sj-role-kicker">DANIEL · PLAYER ONE</p>
                <h2 id="danielRoleHeading" class="sj-role-heading"></h2>
              </div>
            </div>
            <p id="danielRoleCopy" class="sj-role-copy"></p>
            <div id="danielSeasonLine" class="sj-season-line" hidden>
              <span>NUMBER OF SEASONS</span>
              <strong id="danielSeasonValue"></strong>
            </div>
            <div id="danielMainActions" class="sj-card-actions"></div>
          </section>

          <section class="sj-role-panel sj-role-panel--nik sd-panel" aria-labelledby="nikRoleHeading">
            <div class="sj-role-head">
              <span class="sj-role-glyph sj-role-glyph--join" aria-hidden="true"></span>
              <div>
                <p class="sj-role-kicker">NIK · PLAYER TWO</p>
                <h2 id="nikRoleHeading" class="sj-role-heading"></h2>
              </div>
            </div>
            <p id="nikRoleCopy" class="sj-role-copy"></p>
            <div id="joinCodeMainWrap" class="sj-join-field">
              <label for="joinCodeMain">CODE</label>
              <input id="joinCodeMain" type="text" autocomplete="off" spellcheck="false">
            </div>
            <div id="nikMainActions" class="sj-card-actions"></div>
          </section>
        </div>

        <section class="sj-current-panel sd-panel" aria-labelledby="currentHeading">
          <div class="sj-current-head">
            <div>
              <p class="sj-role-kicker">CURRENT CONNECTION</p>
              <h2 id="currentHeading" class="sj-role-heading"></h2>
            </div>
            <span id="currentStateBadge" class="sj-state-badge"></span>
          </div>
          <p id="currentStatusCopy" class="sj-current-copy" role="status" aria-live="polite"></p>
          <div id="currentCodeRow" class="sj-code-row" hidden>
            <output id="currentPairingCode" class="sj-code-field"></output>
          </div>
          <div id="currentMainActions" class="sj-current-actions"></div>
        </section>

        <div class="sj-lock-slot">
          <span class="sj-lock-icon" aria-hidden="true"></span>
          <p id="privacyLine"></p>
        </div>
      </section>

      <div class="sj-step1-scaffold" hidden>
        <section aria-labelledby="stateHeading">
          <h2 id="stateHeading"></h2>
          <p id="stateMessage" role="status" aria-live="polite"></p>
          <p id="stateError" role="alert"></p>
        </section>
        <section aria-label="Daniel fixture controls"><div id="danielActions"></div></section>
        <section aria-label="Nik fixture controls">
          <label for="joinCodeInput">CODE</label>
          <input id="joinCodeInput" type="text" autocomplete="off">
          <div id="nikActions"></div>
        </section>
        <section aria-label="Current fixture session">
          <h2 id="sessionHeading">CURRENT SESSION</h2>
          <output id="pairingCode"></output>
          <p id="sessionStatus"></p>
          <div id="sessionActions"></div>
        </section>
        <section aria-label="Fixture frame values"><dl id="frameValues"></dl></section>
      </div>
    </main>
    <div class="nav-reserve" aria-hidden="true"></div>
  </div>

  <div class="sd-stage__layer sd-stage__layer--cutout" aria-hidden="true">
    <div class="sd-stage__registered">
      <span class="managerPlateMarker" data-manager="daniel" role="presentation"></span>
      <span class="managerPlateMarker" data-manager="nik" role="presentation"></span>

      <span class="sj-hand-contact" role="presentation"></span>
      <picture class="sj-hand-cutout">
        <source srcset="assets/OVL_SJ_DANIEL_HAND_V1_1X.webp 1x, assets/OVL_SJ_DANIEL_HAND_V1_2X.webp 2x" type="image/webp">
        <img src="assets/OVL_SJ_DANIEL_HAND_V1_1X.webp" alt="">
      </picture>
      <span class="sj-hand-rim" role="presentation"></span>
    </div>
  </div>
  <div class="sd-stage__layer sd-stage__layer--light" aria-hidden="true">
    <div class="sd-stage__registered"></div>
  </div>
</div>
<script src="../shared/stage.js" defer></script>
<script src="../shared/motion.js" defer></script>
<script src="start-join.js" defer></script>
</body>
</html>
