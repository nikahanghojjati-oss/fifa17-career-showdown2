<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee club shirts</title>
<link rel="stylesheet" href="marquee.css">
<style>body{margin:0;padding:16px;background:#0b0a08;color:#efe6d2;font:600 13px/1.2 "MQ Body",sans-serif}
h1{font:400 34px/1.1 "MQ Brush",cursive;color:#f2c45b;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{background:#0d0c0a url(../../../css/r78-marble-tile.webp) 0 0/256px repeat;border:1px solid rgba(242,196,91,.6);padding:6px;text-align:center}
.c div{position:relative;height:200px}.c .mqShirt{position:absolute;inset:0;width:100%;height:100%}
.c p{margin:6px 0 0;font:700 13px/1.2 "MQ Cond",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#f2c45b}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}</style></head>
<body><h1>All Marquee shirts</h1><div class="chips" id="chips"></div><div class="g" id="g"></div>
<script src="marquee.js"></script>
<script>
const g=document.getElementById("g");
for(const club of Object.keys(MarqueePlate.KITS)){
  const c=document.createElement("div");c.className="c";
  c.innerHTML=`<div class="mqSide" data-step="6">${MarqueePlate.shirtSvg({club,number:10,name:"Player"})}</div><p>${club||"No club (Oscar)"}</p>`;
  g.appendChild(c);
}
const ch=document.getElementById("chips");
[["black-blue-gold","Cristiano Ronaldo"],["blue-gold","P. Dybala"],["gold","K. De Bruyne"],["silver","H. Kane"],["bronze","S. Milinković-Savić"]]
 .forEach(([tier,name],i)=>{ch.insertAdjacentHTML("beforeend",MarqueePlate.chip({tier,name},{size:i%2?"phone":"desktop"}));});
</script></body></html>
