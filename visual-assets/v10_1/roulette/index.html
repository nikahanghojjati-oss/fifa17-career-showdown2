<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster Russian Roulette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&family=Rye&display=swap">
<style>
/* HO-040 Roster Russian Roulette · real 3D stage (three.js r128) with the Showdown HUD over it. Same tokens as the Special Player screen. */
:root {
  --ink: #050506; --gold: #f1c35a; --gold-hi: #fff3c4; --gold-deep: #9c6e22; --ivory: #f6eedb; --muted: #c9bc9c;
  --num: "Barlow Condensed", "Arial Narrow", sans-serif;
  --disp: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --west: "Rye", "Big Shoulders Display", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--ivory); font-family: var(--num); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; inset: 0; pointer-events: none; }
/* top bar (desktop): CM17 + tabs + chips + gear */
.bar { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 18px; padding: 0 18px; background: linear-gradient(180deg, rgba(14,11,7,.96), rgba(8,6,4,.92)); border-bottom: 1px solid rgba(241,195,90,.55); pointer-events: auto; }
.bar .cm { font: 900 20px/1 var(--disp); letter-spacing: .08em; color: var(--gold); }
.bar nav { display: flex; gap: 20px; margin-left: 10px; }
.bar nav a { font: 700 14px/1 var(--num); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 12px 0 11px; border-bottom: 2px solid transparent; }
.bar nav a.on { color: var(--gold-hi); border-color: var(--gold); }
.chips { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chip { font: 700 12px/1 var(--num); letter-spacing: .18em; text-transform: uppercase; color: var(--gold-hi); border: 1px solid rgba(241,195,90,.7); border-radius: 999px; padding: 6px 11px 5px; background: rgba(0,0,0,.35); }
.gear { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(241,195,90,.7); display: grid; place-items: center; color: var(--gold); font-size: 15px; background: rgba(0,0,0,.35); }
/* title lockup */
.top { position: absolute; left: 0; right: 0; top: 46px; text-align: center; }
.kicker { font: 700 13px/1 var(--num); letter-spacing: .34em; text-transform: uppercase; color: var(--gold-hi); text-shadow: 0 1px 2px #000, 0 0 10px rgba(0,0,0,.7); }
.title { position: relative; display: inline-block; margin: 4px 0 0; font: 400 clamp(30px, 3.6vw, 48px)/1 var(--west); letter-spacing: .02em; text-transform: uppercase; }
.title span { display: block; background: linear-gradient(180deg, #fffdf2 0%, #fff0b8 30%, #f2c35a 48%, #a8731f 52%, #e6b04c 70%, #fff3c6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title::before { content: attr(data-t); position: absolute; inset: 0; color: transparent; -webkit-text-stroke: 2px #2a1c05; filter: drop-shadow(0 2px 0 #120c02) drop-shadow(0 8px 14px rgba(0,0,0,.55)); z-index: -1; }
.title::after { content: attr(data-t); position: absolute; inset: 0; color: transparent; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.95) 48%, transparent 56%) no-repeat; background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; animation: shine 5s ease-in-out infinite; }
@keyframes shine { 0%, 55% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
@media (prefers-reduced-motion: reduce) { .title::after { animation: none; } }
/* centre column: result line + button */
.mid { position: absolute; left: 50%; top: 612px; transform: translateX(-50%); width: 440px; text-align: center; pointer-events: auto; }
.result { height: 34px; display: grid; place-items: center; font: 800 20px/1 var(--disp); letter-spacing: .1em; text-transform: uppercase; color: #fff8e6; text-shadow: 0 2px 4px #000, 0 0 16px rgba(0,0,0,.8); white-space: nowrap; overflow: hidden; }
.result.bang { color: #ffd77a; }
.result.safe { color: #d8f5c8; }
.cta { margin-top: 10px; width: 360px; height: 52px; font: 800 19px/1 var(--disp); letter-spacing: .1em; text-transform: uppercase; color: #140e04; background: linear-gradient(180deg, #fff6d2, var(--gold) 55%, #c4943e); border: 0; box-shadow: 0 0 0 1px #000, inset 0 -2px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.5); cursor: pointer; white-space: nowrap; transition: filter .3s; }
.cta[disabled] { filter: grayscale(.85) brightness(.55); cursor: default; }
.cta:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
/* bottom panel: 01 DANIEL + state / 02 NIK + state */
.bottom { position: absolute; left: 40px; right: 40px; bottom: 24px; height: 72px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: center; background: linear-gradient(180deg, #17140e, #070605); border: 1px solid rgba(241,195,90,.9); padding: 0 16px; box-shadow: inset 0 1px 0 rgba(255,243,196,.25), 0 10px 30px rgba(0,0,0,.45); pointer-events: auto; }
.slot { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; min-width: 0; }
.slot.nik { grid-template-columns: 1fr auto; text-align: right; }
.slot em { grid-row: 1 / 3; font: 800 26px/1 var(--disp); font-style: normal; color: #1a1205; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); padding: 5px 8px 4px; }
.slot.nik em { grid-column: 2; }
.slot b { font: 600 12px/1.1 var(--num); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.slot span { font: 800 22px/1.1 var(--disp); letter-spacing: .03em; text-transform: uppercase; color: #fff8e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.slot span.wait { font: 700 15px/1.4 var(--num); color: var(--gold); letter-spacing: .26em; }
.slot span.lost { color: #ff8d7a; }
.slot span.safe { color: #cdf0b8; }
/* preview tools (?tools=1) */
.tools { position: absolute; left: 50%; transform: translateX(-50%); bottom: 104px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; pointer-events: auto; max-width: 900px; }
.tools button, .tools select { font: 700 13px/1 var(--num); letter-spacing: .16em; text-transform: uppercase; color: var(--ivory); background: rgba(8,7,6,.82); border: 1px solid rgba(241,195,90,.55); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.tools select { appearance: none; -webkit-appearance: none; }
body.game .tools { display: none; }
.phonebar, .pchips { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); background: rgba(8,7,6,.94); border: 1px solid var(--gold); padding: 10px 16px; font: 700 14px/1 var(--num); letter-spacing: .14em; text-transform: uppercase; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-height: 760px) and (min-width: 900px) { .mid { top: auto; bottom: 120px; } }
/* phone (upright, <= 900 px): chips top-left, gear top-right, title, scene, result, button, bottom tabs */
@media (max-width: 899px) {
  .bar, .bottom { display: none; }
  .pchips { display: flex; position: absolute; left: 8px; top: calc(env(safe-area-inset-top, 0px) + 8px); gap: 6px; }
  .pchips .chip { font-size: 11px; padding: 6px 9px 5px; }
  .pgear { position: absolute; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 6px); }
  .top { top: calc(env(safe-area-inset-top, 0px) + 46px); }
  .kicker { font-size: 11px; letter-spacing: .26em; }
  .title { font-size: clamp(22px, 7.2vw, 30px); }
  .mid { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 77px); width: min(353px, calc(100vw - 40px)); }
  .result { height: 24px; font-size: 16px; }
  .cta { width: 100%; height: 44px; font-size: 17px; margin-top: 6px; }
  .phonebar { display: grid; position: absolute; left: 0; right: 0; bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 65px); grid-template-columns: repeat(5, 1fr); align-items: start; padding-top: 10px; background: linear-gradient(180deg, rgba(14,11,7,.97), rgba(6,5,3,.98)); border-top: 1px solid rgba(241,195,90,.55); pointer-events: auto; }
  .phonebar a { text-align: center; font: 700 10px/1 var(--num); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-decoration: none; display: grid; gap: 5px; justify-items: center; }
  .phonebar a i { width: 22px; height: 22px; border: 1.5px solid currentColor; border-radius: 6px; display: block; font-style: normal; }
  .phonebar a.on { color: var(--gold-hi); }
  .tools { bottom: 140px; }
}
@media (max-width: 899px) and (max-height: 600px) { .top { top: calc(env(safe-area-inset-top, 0px) + 40px); } .title { font-size: 22px; } .mid { bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); } .result { height: 22px; font-size: 15px; } .cta { height: 40px; } .phonebar { height: calc(env(safe-area-inset-bottom, 0px) + 58px); } }
@media (max-width: 899px) and (orientation: landscape) { .top { top: 8px; } .mid { bottom: 12px; } .phonebar { display: none; } }
</style>
</head>

<div id="stage" aria-hidden="true"></div>
<div class="hud">
  <div class="bar"><span class="cm">CM17</span><nav><a href="#">Home</a><a href="#" class="on">Career</a><a href="#">Standings</a><a href="#">Stats</a><a href="#">Rules</a></nav>
    <div class="chips"><span class="chip" id="chipWho">Daniel</span><span class="chip">Season 1 / 1</span><span class="gear">⚙</span></div></div>

<script>/* preview only: show any error on screen instead of a black page */
(function(){ function show(m){ try{ var d=document.getElementById('errbox'); if(!d){ d=document.createElement('div'); d.id='errbox'; d.style.cssText='position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#300;color:#fff;font:13px/1.4 monospace;padding:10px;border:1px solid #f66;white-space:pre-wrap'; (document.body||document.documentElement).appendChild(d); } d.textContent+=m+'\n'; }catch(e){} }
 window.addEventListener('error',function(e){ show('Error: '+(e.message||e.type)+(e.filename?' @'+e.filename.split('/').pop()+':'+e.lineno:'')+(e.target&&e.target.src?' '+e.target.src:'')); },true);
 window.addEventListener('unhandledrejection',function(e){ show('Error: '+(e.reason&&e.reason.message||e.reason)); });
 setTimeout(function(){ if(!window.THREE) show('3D library did not load (three.js). Check the connection and reload.'); },8000); })();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const T=THREE, $=(id)=>document.getElementById(id), qs=new URLSearchParams(location.search);
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp01=(x)=>x<0?0:x>1?1:x, lerp=(a,b,k)=>a+(b-a)*k, S=(at,dur,tt)=>clamp01((tt-at)/dur);
const ease={ out:(k)=>1-Math.pow(1-k,3), inOut:(k)=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2, in:(k)=>k*k*k, back:(k)=>{ const c=1.70158; return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2); } };
/* seeded random so a replay with ?seed= is repeatable */
let seed=(+qs.get("seed")||Math.floor(Math.random()*1e9))>>>0; const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
const LAYOUT={ danielClub: qs.get("d")||"Manchester United", nikClub: qs.get("n")||"Real Madrid" };

/* ================= renderer ================= */
const stage=$("stage");
const renderer=new T.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.outputEncoding=T.sRGBEncoding; renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap; renderer.physicallyCorrectLights=false;
stage.appendChild(renderer.domElement);
const scene=new T.Scene(); scene.background=new T.Color(0x07050a); scene.fog=new T.FogExp2(0x0a0705,.075);
const camera=new T.PerspectiveCamera(38,1,.05,60);
const L=(hex)=>new T.Color(hex).convertSRGBToLinear();
const portrait=()=>innerWidth<=899&&innerHeight>innerWidth;

/* ================= canvas textures (wood, felt, brass, soft sprites) ================= */
function cv(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return [c,c.getContext("2d")]; }
function grain(ctx,w,h,a){ const img=ctx.getImageData(0,0,w,h), d=img.data; for(let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*a; d[i]+=n; d[i+1]+=n; d[i+2]+=n; } ctx.putImageData(img,0,0); }
function woodTex(w,h,base,dark,planks,rep){ const [c,ctx]=cv(w,h); ctx.fillStyle=base; ctx.fillRect(0,0,w,h);
  const ph=h/planks; for(let p=0;p<planks;p++){ const y0=p*ph, off=Math.random()*w; ctx.fillStyle=`rgba(0,0,0,${.04+Math.random()*.1})`; ctx.fillRect(0,y0,w,ph);
    for(let i=0;i<60;i++){ const y=y0+Math.random()*ph; ctx.strokeStyle=`rgba(${Math.random()<.5?"0,0,0":"255,220,170"},${.05+Math.random()*.12})`; ctx.lineWidth=.6+Math.random()*2.2; ctx.beginPath(); for(let x=0;x<=w;x+=24){ ctx.lineTo(x,y+Math.sin((x+off)*.011)*5+Math.sin((x+off)*.031)*2.4); } ctx.stroke(); }
    ctx.fillStyle=dark; ctx.fillRect(0,y0,w,2); ctx.fillStyle="rgba(255,230,190,.12)"; ctx.fillRect(0,y0+2,w,1); }
  grain(ctx,w,h,26); const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rep[0],rep[1]); t.encoding=T.sRGBEncoding; t.anisotropy=8; return t; }
function feltTex(){ const [c,ctx]=cv(1024,1024); const g=ctx.createRadialGradient(512,512,80,512,512,600); g.addColorStop(0,"#2d6b3b"); g.addColorStop(1,"#17402a"); ctx.fillStyle=g; ctx.fillRect(0,0,1024,1024); grain(ctx,1024,1024,40);
  const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=8; return t; }
function panelTex(){ const w=1024,h=1024,[c,ctx]=cv(w,h); ctx.fillStyle="#2a1a10"; ctx.fillRect(0,0,w,h);
  for(let i=0;i<400;i++){ ctx.strokeStyle=`rgba(${Math.random()<.5?"0,0,0":"150,95,50"},${.08+Math.random()*.12})`; ctx.lineWidth=1+Math.random()*3; const y=Math.random()*h; ctx.beginPath(); ctx.moveTo(0,y); ctx.bezierCurveTo(w*.3,y+Math.random()*30-15,w*.6,y+Math.random()*30-15,w,y); ctx.stroke(); }
  /* raised panels with a carved gold bead */
  const cols=3, rows=2; for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){ const x=40+i*(w/cols), y=60+j*(h/rows), pw=w/cols-80, ph=h/rows-120; ctx.fillStyle="rgba(0,0,0,.28)"; ctx.fillRect(x,y,pw,ph); ctx.fillStyle="rgba(255,200,120,.08)"; ctx.fillRect(x+10,y+10,pw-20,ph-20);
    ctx.strokeStyle="#d9a84a"; ctx.lineWidth=5; ctx.strokeRect(x+22,y+22,pw-44,ph-44); ctx.strokeStyle="rgba(0,0,0,.6)"; ctx.lineWidth=2; ctx.strokeRect(x+28,y+28,pw-56,ph-56);
    ctx.fillStyle="#c89a3c"; [[x+pw/2,y+22],[x+pw/2,y+ph-22],[x+22,y+ph/2],[x+pw-22,y+ph/2]].forEach(([cx,cy])=>{ ctx.beginPath(); ctx.moveTo(cx,cy-16); ctx.lineTo(cx+10,cy); ctx.lineTo(cx,cy+16); ctx.lineTo(cx-10,cy); ctx.closePath(); ctx.fill(); }); }
  grain(ctx,w,h,20); const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.encoding=T.sRGBEncoding; t.anisotropy=8; return t; }
function softTex(stops){ const [c,ctx]=cv(128,128); const g=ctx.createRadialGradient(64,64,0,64,64,64); stops.forEach(([k,col])=>g.addColorStop(k,col)); ctx.fillStyle=g; ctx.fillRect(0,0,128,128); const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; return t; }
function flashTex(){ const [c,ctx]=cv(256,256); ctx.translate(128,128); const g=ctx.createRadialGradient(0,0,0,0,0,128); g.addColorStop(0,"rgba(255,255,255,1)"); g.addColorStop(.18,"rgba(255,240,180,.95)"); g.addColorStop(.42,"rgba(255,160,60,.55)"); g.addColorStop(1,"rgba(255,90,20,0)"); ctx.fillStyle=g; ctx.fillRect(-128,-128,256,256);
  ctx.globalCompositeOperation="lighter"; for(let i=0;i<9;i++){ const a=i/9*Math.PI*2+Math.random()*.4, l=60+Math.random()*68; ctx.strokeStyle="rgba(255,230,160,.9)"; ctx.lineWidth=2+Math.random()*4; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*l,Math.sin(a)*l); ctx.stroke(); }
  const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; return t; }
const smokeT=softTex([[0,"rgba(255,255,255,.55)"],[.4,"rgba(255,255,255,.25)"],[1,"rgba(255,255,255,0)"]]);
const glowT=softTex([[0,"rgba(255,235,190,1)"],[.3,"rgba(255,190,90,.6)"],[1,"rgba(255,120,30,0)"]]);
const dustT=softTex([[0,"rgba(255,240,200,1)"],[.5,"rgba(255,240,200,.3)"],[1,"rgba(255,240,200,0)"]]);

/* ================= materials ================= */
const floorTex=woodTex(1024,1024,"#5a3418","#1a0d05",10,[4,4]);
const tableWoodTex=woodTex(512,512,"#4a2a12","#1c0e05",3,[2,1]);
const gripTex=woodTex(256,256,"#6b3a1b","#2a1406",2,[1,1]);
const clothTex=(()=>{ const [c,ctx]=cv(256,256); ctx.fillStyle='#808080'; ctx.fillRect(0,0,256,256); for(let i=0;i<256;i+=3){ ctx.fillStyle=i%6?'rgba(255,255,255,.25)':'rgba(0,0,0,.25)'; ctx.fillRect(i,0,1,256); ctx.fillRect(0,i,256,1); } grain(ctx,256,256,60); const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(6,6); return t; })();
const M={
  floor:new T.MeshStandardMaterial({map:floorTex, roughness:.55, metalness:.05, color:0xb08868}),
  wall:new T.MeshStandardMaterial({map:panelTex(), roughness:.8, metalness:.05, color:0x8a6a50}),
  darkWood:new T.MeshStandardMaterial({map:tableWoodTex, roughness:.5, metalness:.08, color:0x8f6a4a}),
  felt:new T.MeshStandardMaterial({map:feltTex(), roughness:.98, metalness:0, color:0x8fb58f}),
  brass:new T.MeshStandardMaterial({color:L("#b8893a"), roughness:.3, metalness:1}),
  brassDark:new T.MeshStandardMaterial({color:L("#6f4e1c"), roughness:.4, metalness:1}),
  steel:new T.MeshStandardMaterial({color:L("#aab0b8"), roughness:.28, metalness:1}),
  blued:new T.MeshStandardMaterial({color:L("#3a4150"), roughness:.42, metalness:.95}),
  gunmetal:new T.MeshStandardMaterial({color:L("#55595f"), roughness:.36, metalness:1}),
  bore:new T.MeshStandardMaterial({color:0x030303, roughness:.9, metalness:.3}),
  grip:new T.MeshStandardMaterial({map:gripTex, roughness:.45, metalness:.05, color:0x9a6a40}),
  coat:new T.MeshStandardMaterial({color:L("#1d1611"), roughness:.95, metalness:0, bumpMap:clothTex, bumpScale:.0025}),
  coatLight:new T.MeshStandardMaterial({color:L("#3b2c20"), roughness:.9, bumpMap:clothTex, bumpScale:.002}),
  hat:new T.MeshStandardMaterial({color:L("#241a12"), roughness:.9}),
  skin:new T.MeshStandardMaterial({color:L("#3b2418"), roughness:1}),
  glove:new T.MeshStandardMaterial({color:L("#3d2316"), roughness:.7}),
  shirt:new T.MeshStandardMaterial({color:L("#d9c7a0"), roughness:.9}),
  scarf:new T.MeshStandardMaterial({color:L("#4a1612"), roughness:.95}),
  porcelain:new T.MeshStandardMaterial({color:L("#f1e9dc"), roughness:.35, metalness:0}),
  coffee:new T.MeshStandardMaterial({color:L("#2b1708"), roughness:.15}),
  glass:new T.MeshPhysicalMaterial({color:0x6a4a2a, roughness:.03, metalness:0, transparent:true, opacity:.14, clearcoat:.6, side:T.DoubleSide, depthWrite:false}),
  card:new T.MeshStandardMaterial({color:L("#eee4c8"), roughness:.8}),
  black:new T.MeshStandardMaterial({color:0x050505, roughness:1}),

    const tgt=boardTargetWorld(who,p.target);
    if(tt<B.raise){ const k=ease.inOut(S(0,.7,tt)); handTarget.lerpVectors(rest,load,k); aimPoint.lerpVectors(gunRest.look,new T.Vector3(2.4,1.9,-.9),k); }
    else { const k=ease.inOut(S(B.raise,.9,tt)); handTarget.lerpVectors(load,aimPos,k); aimPoint.lerpVectors(new T.Vector3(2.4,1.9,-.9),tgt,k); }
    /* crane out, round in, snap shut, spin, settle */
    craneK=tt<B.out?0:tt<B.load?ease.out(S(B.out,.35,tt)):tt<B.shut?1-ease.in(S(B.shut-.18,.18,tt)):0;
    if(p.firstTurn){ const r=cyl.userData.round; const k=S(B.load,.5,tt); r.visible=tt>=B.load&&craneK>0||tt>B.shut; const ch=cyl.userData.chambers[bulletAt]; r.position.set(Math.cos(ch.a)*.0145,Math.sin(ch.a)*.0145,lerp(.07,0,ease.out(k))); } else { const r=cyl.userData.round; const ch=cyl.userData.chambers[bulletAt]; r.visible=true; r.position.set(Math.cos(ch.a)*.0145,Math.sin(ch.a)*.0145,0); }
    at(tt,B.shut,"shut",()=>SFX.play("snap"));
    if(tt>=B.spin&&tt<B.spinEnd){ const k=S(B.spin,B.spinEnd-B.spin,tt); const total=Math.PI*2*5+((cylTarget()-Math.PI*2*5)%(Math.PI*2)); const prev=cyl.rotation.z; cyl.rotation.z=lerp(0,total,ease.out(k)); const idx=Math.floor(Math.abs(cyl.rotation.z)/(Math.PI*2/7)); if(idx!==lastClickIdx){ lastClickIdx=idx; SFX.play("click",Math.min(1,.4+(1-k))); } }
    else if(tt>=B.spinEnd){ cyl.rotation.z=cylTarget(); }
    at(tt,B.spin,"spin",()=>{ lastClickIdx=0; SFX.play("spinStart"); });
    hammerK=tt<B.cock?0:tt<B.fire?ease.out(S(B.cock,.25,tt)):Math.max(0,1-S(B.fire,.05,tt)*1);
    at(tt,B.cock,"cock",()=>SFX.play("cock")); at(tt,B.aim,"heart",()=>SFX.play("heart"));
    if(tt>=B.fire&&!fired.fire){ fired.fire=1; if(p.fire){ fireShot(p,tgt); } else { SFX.play("dry"); puff(muzzleW,new T.Vector3(0,.3,0),3,.08,.2,.9); result.className="result safe"; result.textContent=`Click. ${NAME[who]} is safe.`; live.textContent=result.textContent; shake=REDUCED?0:.004; } }
    if(p.fire&&tt>=B.fire){ const k=S(B.fire,.12,tt); const impact=tt>=B.fire+.12; if(!impact){ placeTracer(p.mz,tgt,Math.max(0,k-.25),k); } else { tracer.visible=false; if(!p.hitDone){ p.hitDone=true; hitBoard(p,tgt); } } }
    if(tt>=B.fire+(p.fire?1.4:.8)&&!fired.line){ fired.line=1; if(p.fire){ result.className="result bang"; result.textContent=`Bang! ${p.target.name} is released.`; live.textContent=result.textContent; } }
    if(tt>=B.end){ endTurn(); }
  }
  /* the left hand reaches over to the cylinder and gives it the spin, then goes back to the table */
  { const cw=new T.Vector3(); cyl.getWorldPosition(cw); dealer.worldToLocal(cw); const tt2=p?tt:0; let k=0, sw=0; if(p&&tt2>B.shut-.3&&tt2<B.spin+1.0){ k=ease.inOut(S(B.shut-.3,.35,tt2))*(1-ease.inOut(S(B.spin+.5,.4,tt2))); sw=ease.out(S(B.spin-.05,.2,tt2)); } const over=cw.clone().add(new T.Vector3(-.03,.07-sw*.11,.02)); leftArm.hand.position.lerpVectors(leftArm.home,over,k); const sh=leftArm.sh.position; const dir=leftArm.hand.position.clone().sub(sh); const len=dir.length(); leftArm.fore.position.copy(dir.clone().multiplyScalar(.5)); leftArm.fore.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir.normalize()); leftArm.fore.scale.set(1,Math.max(.6,len/.34),1); }
  /* drive the arm, the gun, the moving parts */
  solveArm(handTarget,bendDir); aimHand(aimPoint);
  recoilV+=(-recoil*260-recoilV*18)*dt; recoil+=recoilV*dt; arm.rig.rotation.x=.52-recoil; arm.rig.position.y=recoil*.05; arm.rig.position.z=-recoil*.06;
  hammer.rotation.x=-hammerK*.6; crane.rotation.y=craneK*1.0; crane.position.x=-.012-craneK*.004;
}
function fireShot(p,tgt){ const mz=new T.Vector3(); muzzle.getWorldPosition(mz); p.mz=mz.clone(); const dir=tgt.clone().sub(mz).normalize();
  flashSprite.position.copy(mz).add(dir.clone().multiplyScalar(.05)); flashSprite.material.opacity=1; flashSprite.scale.set(.32,.32,1); flashSprite.material.rotation=rnd()*6;
  flashSide.position.copy(mz).add(dir.clone().multiplyScalar(.02)); flashSide.material.opacity=.9; flashSide.scale.set(.6,.6,1);
  flashLight.position.copy(mz).add(dir.clone().multiplyScalar(.3)); flashLight.intensity=REDUCED?3:6;
  puff(mz,dir,14,.12,2.2,1.6); puff(mz,new T.Vector3(0,1,0),6,.1,.4,2.2);
  recoilV=REDUCED?4:9; shake=REDUCED?0:.03; SFX.play("bang"); }
function hitBoard(p,tgt){ const b=boards[p.who]; const n=new T.Vector3(0,0,1).applyQuaternion(b.quaternion); burst(tgt,n); b.userData.joltV.set((rnd()-.5)*.4,-.9,2.4*(p.who==="D"?1:1)); const bub=p.target; const i=b.userData.bubbles.indexOf(bub); b.userData.hit={x:bub.x,y:bub.y,i}; drawBoard(p.who,b.userData.club); SFX.play("splinter"); puff(tgt,n,5,.09,.6,1.4); }
function at(tt,t,k,fn){ if(tt>=t&&!fired[k]){ fired[k]=1; fn(); } }

/* ================= camera ================= */
function stepCamera(t,dt){ const p=playing; const tt=p?t-p.t0:0; const drift=new T.Vector3(Math.sin(t*.23)*.05,Math.sin(t*.31)*.025,Math.cos(t*.19)*.04);
  let pos=camRest.clone().add(drift), look=lookRest.clone();
  if(p){ const gw=new T.Vector3(); gun.getWorldPosition(gw); const who=p.who, sx=who==="D"?-1:1; const bw=boards[who].position.clone();
    const closePos=PH?new T.Vector3(gw.x+.16,gw.y+.3,.6):new T.Vector3(gw.x+.38,gw.y+.32,.62), closeLook=gw.clone().add(new T.Vector3(0,.0,.03)); const closeFov=PH?17:11;
    const aimPos=PH?new T.Vector3(sx*.1,1.3,2.4):new T.Vector3(sx*.25,1.32,2.2), aimLook=new T.Vector3(sx*.35,1.02,-.1);
    const tensePos=PH?new T.Vector3(sx*.12,1.26,2.0):new T.Vector3(sx*.3,1.26,1.75), tenseLook=new T.Vector3(sx*.4,1.0,-.05);
    const hitPos=PH?new T.Vector3(sx*.3,1.15,2.2):new T.Vector3(sx*.55,1.15,1.9), hitLook=bw.clone();
    let fov=fovRest;
    if(tt<B.raise){ const k=ease.inOut(S(0,.9,tt)); pos.lerpVectors(pos,closePos,k); look.lerpVectors(look,closeLook,k); fov=lerp(fovRest,closeFov,k); }
    else if(tt<B.aim){ const k=ease.inOut(S(B.raise,.8,tt)); pos.lerpVectors(closePos,aimPos,k); look.lerpVectors(closeLook,aimLook,k); fov=lerp(closeFov,fovRest,k); }
    else if(tt<B.fire){ const k=ease.in(S(B.aim,B.fire-B.aim,tt)); pos.lerpVectors(aimPos,tensePos,k); look.lerpVectors(aimLook,tenseLook,k); }
    else { const k1=ease.out(S(B.fire,.35,tt)), k2=ease.inOut(S(B.fire+1.3,B.end-B.fire-1.3,tt)); const pp=tensePos.clone().lerp(p.fire?hitPos:tensePos,k1), ll=tenseLook.clone().lerp(p.fire?hitLook:tenseLook,k1); pos.lerpVectors(pp,camRest.clone().add(drift),k2); look.lerpVectors(ll,lookRest,k2); }
    fovNow=lerp(fovNow,fov,Math.min(1,dt*9)); } else fovNow=lerp(fovNow,fovRest,Math.min(1,dt*3));
  if(Math.abs(camera.fov-fovNow)>.01){ camera.fov=fovNow; camera.updateProjectionMatrix(); }
  camPos.lerp(pos,Math.min(1,dt*(p?9:2))); camLook.lerp(look,Math.min(1,dt*(p?9:2)));
  camera.position.copy(camPos).add(camTmp.set((rnd()-.5)*shake,(rnd()-.5)*shake,0)); camera.lookAt(camLook); }

/* ================= tick ================= */
let frames=0, fpsT=0, fps=0; const bubbleTmp=new T.Vector3();
function tick(draw){ const t=now(); let dt=Math.min(.05,t-last||.016); last=t; if(manual!==null) dt=1/30;
  stepTurn(dt); stepCamera(t,dt);
  /* lantern: living flame */
  const fl=.85+Math.sin(t*17)*.08+Math.sin(t*29.3)*.05+Math.sin(t*3.1)*.04; table.userData.lantern.intensity=1.5*fl; table.userData.flame.scale.set(.15*fl,.28*(fl+.1),1); table.userData.flame.material.rotation=Math.sin(t*9)*.2; table.userData.halo.material.opacity=.3*fl;
  flashLight.intensity*=Math.pow(.0005,dt); flashSprite.material.opacity*=Math.pow(.0001,dt); flashSprite.scale.multiplyScalar(1+dt*6); flashSide.material.opacity*=Math.pow(.001,dt);
  shake*=Math.pow(.01,dt);
  smokes.forEach(p=>{ if(p.life<=0){ p.s.visible=false; return; } p.life-=dt; const k=1-p.life/p.max; p.s.position.addScaledVector(p.v,dt); p.v.multiplyScalar(Math.pow(.25,dt)); p.v.y+=dt*.12; p.s.material.opacity=.42*Math.sin(Math.min(1,k*1.2)*Math.PI)*(1-k*.3); const sz=p.size*(.4+k*1.6); p.s.scale.set(sz,sz,1); p.s.material.rotation+=p.rot*dt; });
  splinters.forEach(p=>{ if(p.life<=0){ p.m.visible=false; return; } p.life-=dt; p.m.position.addScaledVector(p.v,dt); p.v.y-=dt*5.5; p.v.multiplyScalar(Math.pow(.5,dt)); p.m.rotation.x+=p.w.x*dt; p.m.rotation.y+=p.w.y*dt; if(p.m.position.y<.76&&Math.abs(p.m.position.x)<.75&&Math.abs(p.m.position.z)<.75){ p.m.position.y=.76; p.v.y*=-.25; p.v.x*=.6; p.v.z*=.6; p.w.multiplyScalar(.3); } if(p.m.position.y<0) p.life=0; });
  ["D","N"].forEach(k=>{ const b=boards[k].userData; b.joltV.addScaledVector(b.jolt,-dt*90); b.joltV.multiplyScalar(Math.pow(.002,dt)); b.jolt.addScaledVector(b.joltV,dt); b.inner.rotation.set(b.jolt.z*.25,b.jolt.x*.4,b.jolt.x*.2); b.inner.position.set(b.jolt.x*.03,b.jolt.y*.02,-Math.abs(b.jolt.z)*.03); });
  { const a=dust.pos; for(let i=0;i<a.length/3;i++){ a[i*3]=dust.base[i*3]+Math.sin(t*.3+i)*.05; a[i*3+1]=dust.base[i*3+1]+Math.sin(t*.21+i*1.7)*.05; a[i*3+2]=dust.base[i*3+2]+Math.cos(t*.25+i*.6)*.05; } dust.p.geometry.attributes.position.needsUpdate=true; }
  ["D","N"].forEach(k=>{ const pl=people[k].userData.plane; if(pl.visible){ pl.quaternion.copy(camera.quaternion); pl.rotation.x=0; pl.rotation.z=0; } });
  if(draw){ renderer.render(scene,camera); frames++; if(manual===null){ const pt=performance.now(); if(pt-fpsT>1000){ fps=frames*1000/(pt-fpsT); frames=0; fpsT=pt; } } } }
function frame(){ if(manual===null) tick(true); requestAnimationFrame(frame); }

/* ================= sound (Web Audio, synthesized; off until turned on) ================= */
const SFX=(()=>{ let ctx=null, master=null, verb=null, on=false, noiseBuf=null;
  function init(){ if(ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; ctx=new AC(); master=ctx.createGain(); master.gain.value=.8; const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=5; master.connect(comp); comp.connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate); const d=noiseBuf.getChannelData(0); let b=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; b=.97*b+.03*w; d[i]=w*.6+b*3; }
    verb=ctx.createConvolver(); const Ln=ctx.sampleRate*1.6, ir=ctx.createBuffer(2,Ln,ctx.sampleRate); for(let c=0;c<2;c++){ const x=ir.getChannelData(c); for(let i=0;i<Ln;i++) x[i]=(Math.random()*2-1)*Math.pow(1-i/Ln,2.6); } verb.buffer=ir; const vg=ctx.createGain(); vg.gain.value=.3; verb.connect(vg); vg.connect(master); }
  const nowT=()=>ctx.currentTime;
  function out(node,wet){ node.connect(master); if(wet) node.connect(verb); }
  function env(g,t,a,peak,d){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
  function noise(t,dur,type,f0,f1,q,peak,a,wet){ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type=type; f.Q.value=q; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=ctx.createGain(); env(g,t,a,peak,Math.max(.03,dur-a)); s.connect(f); f.connect(g); out(g,wet); s.start(t,Math.random()*2); s.stop(t+dur+.1); }
  function tone(t,type,f0,f1,dur,peak,a,wet){ const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=ctx.createGain(); env(g,t,a,peak,dur); o.connect(g); out(g,wet); o.start(t); o.stop(t+a+dur+.05); }
  const fx={
    spinStart:()=>{ const t=nowT(); noise(t,.5,"bandpass",1200,3000,2,.12,.02,true); },
    click:(v)=>{ const t=nowT(); noise(t,.04,"highpass",3000,6000,1,.35*v,.001,true); tone(t,"square",2400,1800,.03,.08*v,.001,false); },
    snap:()=>{ const t=nowT(); noise(t,.08,"bandpass",900,2500,1,.6,.002,true); tone(t,"triangle",420,180,.12,.25,.002,true); },
    cock:()=>{ const t=nowT(); noise(t,.05,"highpass",2500,5000,1,.4,.001,true); noise(t+.07,.06,"bandpass",1500,3000,1.5,.5,.002,true); tone(t+.07,"square",900,500,.06,.1,.002,true); },
    heart:()=>{ const t=nowT(); for(let i=0;i<3;i++){ const tt=t+i*.5; tone(tt,"sine",62,38,.22,.5,.01,false); tone(tt+.16,"sine",56,34,.2,.35,.01,false); } },
    dry:()=>{ const t=nowT(); noise(t,.05,"bandpass",2000,4000,1.2,.7,.001,true); tone(t,"square",1500,700,.05,.14,.001,true); },
    bang:()=>{ const t=nowT(); tone(t,"sine",120,30,.9,1.0,.002,false); noise(t,.6,"lowpass",6000,120,.5,1.0,.001,true); noise(t,1.8,"highpass",2500,7000,.4,.25,.002,true); noise(t+.03,1.1,"bandpass",500,250,.8,.5,.01,true); },
    splinter:()=>{ const t=nowT(); for(let i=0;i<6;i++) noise(t+i*.02,.09,"highpass",3500,7000,.9,.3-i*.03,.001,true); tone(t,"triangle",900,400,.25,.2,.002,true); }
  };
  return { get on(){ return on; }, enable(v){ on=v; if(v){ init(); if(ctx&&ctx.state==="suspended") ctx.resume(); } }, play(name,...a){ if(!on||!ctx) return; try{ fx[name](...a); }catch(e){} } }; })();

/* ================= asset contract: each picture drops in without a code change ================= */
const PLATEMAP={}; let hasRoom=false, hasDealer=false;
function fitPlane(plane,img){ plane.material.map=new T.Texture(img); plane.material.map.encoding=T.sRGBEncoding; plane.material.map.needsUpdate=true; plane.material.needsUpdate=true; plane.userData.ar=img.width/img.height; plane.visible=true; }
async function loadAssets(){ const pm=await fetch("platemap.json").then(r=>r.ok?r.json():null).catch(()=>null); Object.assign(PLATEMAP,pm||{});
  const [room,dlr,dan,nik,flash,sq]=await Promise.all([loadImg("assets/RR_ROOM.jpg"),loadImg("assets/RR_DEALER.png"),loadImg("assets/RR_DANIEL.png").then(i=>i||loadImg("assets/RR_DANIEL_ANCHOR.webp")),loadImg("assets/RR_NIK.png").then(i=>i||loadImg("assets/RR_NIK_ANCHOR.webp")),loadImg("assets/RR_FLASH.png"),fetch("assets/squads.json").then(r=>r.json()).catch(()=>null)]);
  SQUADS=sq;
  if(room){ hasRoom=true; const bw=room.width/room.height; const pl=new T.Mesh(new T.PlaneGeometry(1,1),new T.MeshBasicMaterial({map:new T.Texture(room), toneMapped:false})); pl.material.map.encoding=T.sRGBEncoding; pl.material.map.needsUpdate=true; const H=(PLATEMAP.room&&PLATEMAP.room.height)||4.6; pl.scale.set(H*bw,H,1); pl.position.set(0,H/2-.1,(PLATEMAP.room&&PLATEMAP.room.z)||-3.9); scene.add(pl); room.name="roomPlate"; scene.getObjectByName("backWall").visible=false; scene.fog=null; }
  if(dlr){ hasDealer=true; const pl=new T.Mesh(new T.PlaneGeometry(1,1),new T.MeshBasicMaterial({map:new T.Texture(dlr), transparent:true, alphaTest:.02, toneMapped:false})); pl.material.map.encoding=T.sRGBEncoding; pl.material.map.needsUpdate=true; const d=PLATEMAP.dealer||{height:1.9,x:0,y:.95,z:-.95}; pl.scale.set(d.height*dlr.width/dlr.height,d.height,1); pl.position.set(d.x,d.y,d.z); scene.add(pl); dealer.children.forEach(c=>{ if(c!==arm.shoulder) c.visible=false; }); }
  if(dan) fitPlane(people.D.userData.plane,dan); if(nik) fitPlane(people.N.userData.plane,nik);
  if(flash){ flashSprite.material.map=new T.Texture(flash); flashSprite.material.map.encoding=T.sRGBEncoding; flashSprite.material.map.needsUpdate=true; }
  setBoards(LAYOUT.danielClub,LAYOUT.nikClub); }
/* PMREM environment from the room itself, so the steel reflects the lamps and the wood */
function buildEnv(){ const pm=new T.PMREMGenerator(renderer); pm.compileEquirectangularShader(); const sc=new T.Scene(); sc.background=new T.Color(0x0b0705);
  const lampM=new T.MeshBasicMaterial({color:0xffd9a0}); for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; const s=new T.Mesh(new T.SphereGeometry(.4,12,8),lampM); s.position.set(Math.cos(a)*5,2.2+(i%2)*.6,Math.sin(a)*5); sc.add(s); }
  const fl=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshBasicMaterial({color:0x3a2412})); fl.rotation.x=-Math.PI/2; fl.position.y=-.5; sc.add(fl);
  const warm=new T.Mesh(new T.SphereGeometry(.6,12,8),new T.MeshBasicMaterial({color:0xffb060})); warm.position.set(-.5,.2,.2); sc.add(warm);
  const env=pm.fromScene(sc,.04).texture; scene.environment=env; pm.dispose(); }

/* ================= controls, hooks ================= */
cta.addEventListener("click",()=>startTurn());
$("sound").addEventListener("click",()=>{ const v=!SFX.on; SFX.enable(v); $("sound").textContent="Sound: "+(v?"on":"off"); $("sound").setAttribute("aria-pressed",String(v)); });
$("forceFire").addEventListener("click",()=>startTurn(true)); $("forceSafe").addEventListener("click",()=>startTurn(false));
$("reset").addEventListener("click",()=>{ turn=0; loaded=false; playing=null; done={D:null,N:null}; setBoards(LAYOUT.danielClub,LAYOUT.nikClub); slot(slotD,"At the table","wait"); slot(slotN,"Waits","wait"); cta.disabled=false; cta.textContent="Spin the cylinder"; result.className="result"; result.textContent="The dealer loads one round."; });
if(qs.get("tools")!=="1") document.body.classList.add("game");
window.__rr={ setBoards(d,n){ LAYOUT.danielClub=d; LAYOUT.nikClub=n; setBoards(d,n); }, play(o){ startTurn(o&&typeof o.fire==="boolean"?o.fire:undefined); return playing; },
  clock(){ manual=performance.now()/1000; last=manual; }, advance(sec){ if(manual===null) this.clock(); const n=Math.round(sec*30); for(let i=0;i<n;i++){ manual+=1/30; tick(i===n-1); } }, get state(){ let aimDot=null; if(playing){ const mw=new T.Vector3(), md=new T.Vector3(); muzzle.getWorldPosition(mw); gun.getWorldDirection(md); const tg=boardTargetWorld(playing.who,playing.target).sub(mw).normalize(); aimDot=md.dot(tg); } const ri=renderer.info; return {aimDot, calls:ri.render.calls, tris:ri.render.triangles, turn, playing:!!playing, fire:playing?playing.fire:null, target:playing?playing.target.name:null, done, fps, hasRoom, hasDealer, bulletAt, chamber}; } };

const fontsReady=Promise.race([Promise.all(['700 30px "Barlow Condensed"','800 30px "Barlow Condensed"','600 30px "Barlow Condensed"','900 30px "Big Shoulders Display"','400 40px "Rye"'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,3000))]);
Promise.all([fontsReady,loadAssets()]).then(()=>{ layout(); buildEnv(); { const opts=SQUADS?SQUADS.clubs.map(c=>`<option value="${c.club}">${c.club}</option>`).join(""):""; ["pickD","pickN"].forEach((id,i)=>{ const el=$(id); el.innerHTML=opts; el.value=i?LAYOUT.nikClub:LAYOUT.danielClub; el.addEventListener("change",()=>{ LAYOUT[i?"nikClub":"danielClub"]=el.value; setBoards(LAYOUT.danielClub,LAYOUT.nikClub); }); }); }
  camPos.copy(camRest); camLook.copy(lookRest); handTarget.set(.36,.86,-.52); aimPoint.copy(gunRest.look); last=now(); window.__rrReady=true; requestAnimationFrame(frame); });
})();
