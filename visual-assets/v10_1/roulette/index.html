/* HO-040 Russian Roster Roulette · real 3D stage (three.js r128) with the Showdown HUD over it. Same tokens as the Special Player screen. */
:root {
  --ink: #050506; --gold: #f1c35a; --gold-hi: #fff3c4; --gold-deep: #9c6e22; --ivory: #f6eedb; --muted: #c9bc9c;
  --num: "Barlow Condensed", "Arial Narrow", sans-serif;
  --disp: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --west: "Rye", "Big Shoulders Display", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--ivory); font-family: var(--num); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; inset: 0; pointer-events: none; }
/* top bar (desktop): CM17 + tabs + chips + gear */
.bar { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 18px; padding: 0 18px; background: linear-gradient(180deg, rgba(14,11,7,.96), rgba(8,6,4,.92)); border-bottom: 1px solid rgba(241,195,90,.55); pointer-events: auto; }
.bar .cm { font: 900 20px/1 var(--disp); letter-spacing: .08em; color: var(--gold); }
.bar nav { display: flex; gap: 20px; margin-left: 10px; }
.bar nav a { font: 700 14px/1 var(--num); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 12px 0 11px; border-bottom: 2px solid transparent; }
.bar nav a.on { color: var(--gold-hi); border-color: var(--gold); }
.chips { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chip { font: 700 12px/1 var(--num); letter-spacing: .18em; text-transform: uppercase; color: var(--gold-hi); border: 1px solid rgba(241,195,90,.7); border-radius: 999px; padding: 6px 11px 5px; background: rgba(0,0,0,.35); }
.gear { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(241,195,90,.7); display: grid; place-items: center; color: var(--gold); font-size: 15px; background: rgba(0,0,0,.35); }
/* title lockup */
.top { position: absolute; left: 0; right: 0; top: 46px; text-align: center; transition: opacity .45s ease; }
/* r87 scene polish: during a turn the camera goes in close (drum, shooter's view, the bullet), so the title lockup steps aside and never stands over a board name or the drum; it is back for the wide shot. Nothing else fades. */
body.turning .top { opacity: 0; }
/* r90 LOOK L38: until the first frame of the scene is drawn the page shows one quiet line and nothing else (no title or words over a black
   page); the title and the words come in with the room */
body:not(.ready) .top, body:not(.ready) .mid { opacity: 0; visibility: hidden; }
.boot { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font: 700 15px/1 var(--disp); letter-spacing: .28em; text-transform: uppercase; color: rgba(230,196,120,.78); pointer-events: none; transition: opacity .4s ease, visibility .4s; }
body.ready .boot { opacity: 0; visibility: hidden; }
.kicker { display: flex; justify-content: center; align-items: center; gap: 12px; }
.kicker::before, .kicker::after { content: ""; width: clamp(28px, 7vw, 90px); height: 1px; background: linear-gradient(90deg, transparent, var(--gold-hi)); box-shadow: 0 0 6px rgba(255,220,140,.8); }
.kicker::after { transform: scaleX(-1); }
.badge { position: relative; font: 900 13px/1 var(--disp); letter-spacing: .16em; text-transform: uppercase; color: #1a1105; padding: 5px 14px 4px 16px; background: linear-gradient(180deg, #fffbe6 0%, #f6d47c 45%, #c8922f 55%, #f3cf73 100%); clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%); box-shadow: inset 0 1px 0 #fff; text-shadow: 0 1px 0 rgba(255,255,255,.55); }
.title { position: relative; display: inline-block; margin: 4px 0 0; font: 400 clamp(30px, 3.6vw, 48px)/1 var(--west); letter-spacing: .02em; text-transform: uppercase; }
.title span { display: block; background: linear-gradient(180deg, #fffdf2 0%, #fff0b8 30%, #f2c35a 48%, #a8731f 52%, #e6b04c 70%, #fff3c6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title::before { content: attr(data-t); position: absolute; inset: 0; color: transparent; -webkit-text-stroke: 2px #2a1c05; filter: drop-shadow(0 2px 0 #120c02) drop-shadow(0 8px 14px rgba(0,0,0,.55)); z-index: -1; }
.title::after { content: attr(data-t); position: absolute; inset: 0; color: transparent; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.95) 48%, transparent 56%) no-repeat; background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; animation: shine 5s ease-in-out infinite; }
@keyframes shine { 0%, 55% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
@media (prefers-reduced-motion: reduce) { .title::after { animation: none; } .boot, .top { transition: none; } }   /* r90 L38: under Reduce Motion the loading line and the title switch at ready with no fade */
/* centre column: result line + button */
/* r90 LOOK L08: the words live in the bottom strip, above the panel, never over the revolver */
.mid { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); transform: translateX(-50%); width: 440px; text-align: center; pointer-events: auto; }
.result { min-height: 34px; display: grid; place-items: center; font: 800 20px/1.1 var(--disp); letter-spacing: .1em; text-transform: uppercase; color: #fff8e6; text-shadow: 0 2px 4px #000, 0 0 16px rgba(0,0,0,.8); white-space: normal; overflow-wrap: anywhere; text-wrap: balance; }
/* Polish RR-2: never cut ("BANG! NACHO MONREAL IS RELEASE"): the line wraps to a second line, and a long name shrinks a step */
.result.long { font-size: 17px; letter-spacing: .06em; }
.result.bang { color: #ffd77a; }
.result.safe { color: #d8f5c8; }
.cta { margin-top: 10px; width: 360px; height: 52px; font: 800 19px/1 var(--disp); letter-spacing: .1em; text-transform: uppercase; color: #140e04; background: linear-gradient(180deg, #fff6d2, var(--gold) 55%, #c4943e); border: 0; box-shadow: 0 0 0 1px #000, inset 0 -2px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.5); cursor: pointer; white-space: nowrap; transition: filter .3s, opacity .25s, visibility .25s; }
/* r90 LOOK L09: one status line; the gold button is there only when there is a tap (no dead button that repeats the line) */
.cta:disabled { visibility: hidden; opacity: 0; }
.cta:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
/* bottom panel: 01 DANIEL + state / 02 NIK + state */
.bottom { position: absolute; left: 40px; right: 40px; bottom: 24px; height: 72px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: center; background: linear-gradient(180deg, #17140e, #070605); border: 1px solid rgba(241,195,90,.9); padding: 0 16px; box-shadow: inset 0 1px 0 rgba(255,243,196,.25), 0 10px 30px rgba(0,0,0,.45); pointer-events: auto; }
.slot { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; min-width: 0; }
.slot.nik { grid-template-columns: 1fr auto; text-align: right; }
.slot em { grid-row: 1 / 3; font: 800 26px/1 var(--disp); font-style: normal; color: #1a1205; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); padding: 5px 8px 4px; }
.slot.nik em { grid-column: 2; }
.slot b { font: 600 12px/1.1 var(--num); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.slot span { font: 800 22px/1.1 var(--disp); letter-spacing: .03em; text-transform: uppercase; color: #fff8e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.slot span.wait { font: 700 15px/1.4 var(--num); color: var(--gold); letter-spacing: .26em; }
.slot span.lost { color: #ff8d7a; }
.slot span.safe { color: #cdf0b8; }

.tools { position: absolute; left: 50%; transform: translateX(-50%); bottom: 104px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; pointer-events: auto; max-width: 900px; }
.tools button, .tools select { font: 700 13px/1 var(--num); letter-spacing: .16em; text-transform: uppercase; color: var(--ivory); background: rgba(8,7,6,.82); border: 1px solid rgba(241,195,90,.55); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.tools select { appearance: none; -webkit-appearance: none; }
body.game .tools { display: none; }
.phonebar, .pchips { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); background: rgba(8,7,6,.94); border: 1px solid var(--gold); padding: 10px 16px; font: 700 14px/1 var(--num); letter-spacing: .14em; text-transform: uppercase; opacity: 0; transition: opacity .3s; pointer-events: none; }

/* phone (upright, <= 900 px): chips top-left, gear top-right, title, scene, result, button, bottom tabs */
@media (max-width: 899px) {

  .pgear { position: absolute; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 6px); }
  .top { top: calc(env(safe-area-inset-top, 0px) + 46px); }
  .badge { font-size: 11px; }
  .title { font-size: clamp(22px, 7.2vw, 30px); }
  .mid { bottom: calc(env(safe-area-inset-bottom, 0px) + 77px); width: min(353px, calc(100vw - 40px)); }
  .result { min-height: 24px; font-size: 16px; }
  .result.long { font-size: 14px; }
  .cta { width: 100%; height: 44px; font-size: 17px; margin-top: 6px; }
  .phonebar { display: grid; position: absolute; left: 0; right: 0; bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 65px); grid-template-columns: repeat(5, 1fr); align-items: start; padding-top: 10px; background: linear-gradient(180deg, rgba(14,11,7,.97), rgba(6,5,3,.98)); border-top: 1px solid rgba(241,195,90,.55); pointer-events: auto; }
  .phonebar a { text-align: center; font: 700 10px/1 var(--num); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-decoration: none; display: grid; gap: 5px; justify-items: center; }
  .phonebar a svg { display: block; }
  .phonebar a.on { color: var(--gold); }
  .tools { bottom: 140px; }
}
@media (max-width: 899px) and (max-height: 600px) { .top { top: calc(env(safe-area-inset-top, 0px) + 40px); } .title { font-size: 22px; } .mid { bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); } .result { min-height: 22px; font-size: 15px; } .cta { height: 40px; } .phonebar { height: calc(env(safe-area-inset-bottom, 0px) + 58px); } }
@media (max-width: 899px) and (orientation: landscape) { .top { top: 8px; } .mid { bottom: 12px; } .phonebar { display: none; } }
/* r87 Team G embed (?embed=1): the game's own frame wraps the page; mock site chrome off, the sound switch stays */
body.embed .bar, body.embed .pchips, body.embed .pgear, body.embed .phonebar { display: none !important; }
body.embed .tools { display: flex; bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 12px); left: auto; right: max(12px, env(safe-area-inset-right, 0px)); transform: none; }
body.embed .tools > :not(#sound) { display: none; }
body.embed .top { top: calc(env(safe-area-inset-top, 0px) + 16px); }
body.embed .mid { bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
/* Polish RR-1: on a laptop the bottom panel is 24 + 72 px (+ border) tall, so the button stands clear above it */
@media (min-width: 900px) { body.embed .mid { bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); } }
/* phone portrait: the title starts below the sound switch (it covered the CAREER MODE SHOWDOWN 17 plate at 390px) */
@media (max-width: 899px) and (orientation: portrait) { body.embed .top { top: calc(env(safe-area-inset-top, 0px) + 54px); } }

    if(hallLamps) hallLamps.visible=false; scene.fog=null; scene.background=new T.Color(0x0e0905); }
  /* the hand picture carries its own transparency (webp alpha), so it goes to the GPU as it is: no read-back pass over its pixels */
  { const hc=handImg||handPlaceholder(); hasHand=!!handImg; handAspect=hc.width/hc.height; const ht=texFrom(hc); ht.needsUpdate=true; ht.colorSpace=T.SRGBColorSpace; ht.anisotropy=8; hand.material.map=ht; const hm=PLATEMAP.hand&&PLATEMAP.hand.muzzle; if(hm){ HAND_MUZZLE.u=hm[0]; HAND_MUZZLE.v=hm[1]; } }
  SQUADS=sq; setBoards(LAYOUT.danielClub,LAYOUT.nikClub); }
/* Reflections: a Poly Haven ballroom HDRI (CC0, polyhaven.com), the 512x256 EXR "hall" from @pmndrs/assets 1.7.0 (CC0-1.0), shared with
   Chamber Men and cached. It adds reflections and a soft fill only, so polished steel, brass and gold read as metal; the table light stays
   the key. One small PMREM pass behind the loading screen (about 50 ms in the speed trace). If it fails to load the metals keep the lights. */
function loadLookEnv(){ if(!T.EXRLoader||LIGHT) return Promise.resolve(null);   /* r90 Light: no EXR (download, decode, PMREM); loungeEnv stands in */ return new T.EXRLoader().setDataType(T.FloatType).loadAsync("assets/ENV_LOUNGE_V1.exr").then(t=>{ const d=t.image&&t.image.data; if(d) for(let i=0;i<d.length;i++){ if(d[i]>LOOK_ENV_MAX) d[i]=LOOK_ENV_MAX; } t.needsUpdate=true; t.mapping=T.EquirectangularReflectionMapping; LOOK.hdri=t; }).catch(()=>null); }
/* the sunlit window in the picture is hundreds of times brighter than the room; capped, so polished steel shows a bright window, not a white blaze */
const LOOK_ENV_MAX=4;
/* r90 LOOK L29: at every level the revolver's steel reflects a small dark studio of its own: a softbox overhead and a little behind, a
   long strip behind, the oil lamp's warm glow on its left, the green felt below. Lying on the table it otherwise mirrors the room's dark
   ceiling, so the blued frame read as a black slab, the barrel as a black bar and the nickel drum as a plain chrome tube. Built once at
   load at the room's size (128), so the gun's shaders are the same programs; every other surface keeps the room. */
function gunStudio(pm){ const s=new T.Scene(), add=(w,h,c,x,y,z)=>{ const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(...c), side:T.DoubleSide})); m.position.set(x,y,z); m.lookAt(0,0,0); s.add(m); };
  s.add(new T.Mesh(new T.BoxGeometry(10,10,10),new T.MeshBasicMaterial({color:new T.Color(.014,.012,.011), side:T.BackSide})));
  add(10,10,[.018,.04,.022],0,-4.9,0); add(3.4,2.2,[2.2,2.1,1.95],0,4.7,-1.4); add(5,2,[2.6,2.5,2.3],0,3.4,-4.9); add(7,.45,[1.2,1.15,1.1],0,1.2,-4.9); add(1.5,1.5,[1.9,1.4,.85],-4.9,1.3,1.6);
  const t=pm.fromScene(s,.04,.1,20,{size:128}).texture; s.traverse(o=>{ if(o.isMesh){ o.geometry.dispose(); o.material.dispose(); } }); return t; }
const GUN_STEEL={blued:3, bluedBarrel:3, bluedPlain:2.2, worn:1.4, bright:1, drum:1.35, drumFace:1.5};   /* r91: the drum at .8/.9 read as dark grey plastic in its close-ups; nickel throws the softbox back brighter. The case-hardened hammer stays out of the studio: lying on the table its spur mirrored the softbox as a white blade */
/* r90 Light: the room's reflections from a small dark lounge of its own (warm wall lamps, a dim ceiling, the felt below), built in one
   small pass at the gun studio's size (128, the same shader programs) instead of loading and converting the EXR */
function loungeEnv(pm){ const s=new T.Scene(), add=(w,h,c,x,y,z)=>{ const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(...c), side:T.DoubleSide})); m.position.set(x,y,z); m.lookAt(0,0,0); s.add(m); };
  s.add(new T.Mesh(new T.BoxGeometry(10,10,10),new T.MeshBasicMaterial({color:new T.Color(.045,.032,.024), side:T.BackSide})));
  add(10,10,[.02,.045,.025],0,-4.9,0); add(4,4,[.16,.12,.085],0,4.9,0); add(1.4,1.4,[1.5,1.05,.6],-4.9,1.4,-1.5); add(1.4,1.4,[1.5,1.05,.6],4.9,1.4,-1.5); add(6,1.2,[.5,.38,.26],0,1.6,-4.9); add(6,1.2,[.32,.24,.17],0,1.6,4.9);
  const t=pm.fromScene(s,.04,.1,20,{size:128}).texture; s.traverse(o=>{ if(o.isMesh){ o.geometry.dispose(); o.material.dispose(); } }); return t; }
function buildEnv(){ if(!LOOK.hdri&&!LIGHT) return; const pm=new T.PMREMGenerator(renderer); if(scene.environment) scene.environment.dispose(); scene.environment=LIGHT?loungeEnv(pm):pm.fromEquirectangular(LOOK.hdri).texture;
  { const st=gunStudio(pm); Object.entries(GUN_STEEL).forEach(([k,v])=>{ GM[k].envMap=st; GM[k].envMapIntensity=v; GM[k].needsUpdate=true; }); GM.drum.roughness=.38; GM.drumFace.roughness=.42; GM.bright.roughness=.3;
    /* r91: the lit spin-blur disc (Balanced and up) is a copy of the drum face made before this, so it mirrored the dark room and read as a black record over the nickel drum; it now sees the same studio as the drum */
    const bmx=cyl.userData.blurMat; if(bmx&&bmx.isMeshStandardMaterial){ bmx.envMap=st; bmx.envMapIntensity=GUN_STEEL.drumFace; bmx.needsUpdate=true; } }   /* satin, so the flutes and the hammer show their shape instead of one mirror stripe */
  pm.dispose(); if(LOOK.hdri) LOOK.hdri.dispose();   /* the GPU copy goes; the small EXR stays in memory so a lost context can make the reflections again */
  scene.environmentIntensity=EXTRA_UP?.6:.5; M.floor.envMapIntensity=EXTRA_UP?.65:.5; }   /* the floor in the dark room only catches a faint sheen of it; in the café (Extra up) it reads as polished marble */
/* r90 warm-up (Reus Gate): every texture goes to the GPU and every shader compiles (in parallel where the browser can) BEFORE the page
   says it is ready, so the first frame anyone sees, and the first muzzle flash, smoke puff or spin blur, never stalls on a compile.
   The old page compiled each of those the first time it appeared, in the middle of a turn. Then js/gfxTier.js times a few real frames. */
function toGame2(type,extra){ if(EMBED) try{ parent.postMessage(Object.assign({type},extra||{}),location.origin); }catch(e){} }
async function warmUp(){ const all=new Set(); scene.traverse(o=>{ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(!m) return; for(const k in m){ const v=m[k]; if(v&&v.isTexture&&!v.isRenderTargetTexture) all.add(v); } }); });
  ["D","N"].forEach(k=>{ const c=boards[k].userData.spare; if(c) all.add(c.__tex); }); all.forEach(t=>{ try{ renderer.initTexture(t); }catch(e){} });
  toGame2("cms-rr-loading",{stage:"compile"});
  /* r90 MOTION M9: where the GPU cannot compile in the background (no KHR_parallel_shader_compile: most Chromebooks, software GL)
     compileAsync is one long blocking task (59.7 s in the container). The shaders are built a few materials at a time instead,
     each batch in its own task, so the game's loading screen keeps moving and hears that the page is still busy (cms-rr-loading
     after every batch) instead of timing out on a scene that would have worked. Same programs, same total GPU work. */
  if(!renderer.extensions.has("KHR_parallel_shader_compile")){ try{ const objs=[]; scene.traverse(o=>{ if(!o.material) return; let lit=false; o.traverse(q=>{ if(q.isLight) lit=true; }); if(!lit) objs.push(o); });
    /* renderer.compile() walks every object under its first argument, visible or not, so each batch compiles only its own objects
       (compile(obj, camera, scene)): the lights, environment and fog still come from the whole scene, so every batch builds the exact
       program the frame uses. An object with a light under it would add that light twice, so it is left to the full pass below. */
    const done=new Set(), batches=[]; let cur=[], fresh=0; objs.forEach(o=>{ const ms=(Array.isArray(o.material)?o.material:[o.material]); const n=ms.filter(m=>m&&!done.has(m)).length; if(!n) return; ms.forEach(m=>done.add(m)); cur.push(o); fresh+=n; if(fresh>=3){ batches.push(cur); cur=[]; fresh=0; } }); if(cur.length) batches.push(cur);
    for(const b of batches){ b.forEach(o=>renderer.compile(o,camera,scene)); toGame2("cms-rr-loading",{stage:"compile"}); await new Promise(r=>setTimeout(r,0)); }
  }catch(e){} }
  try{ await renderer.compileAsync(scene,camera); }catch(e){ try{ renderer.compile(scene,camera); }catch(_e){} }
  toGame2("cms-rr-loading",{stage:"calibrate"});
  try{ await GFXT.calibrate(renderer,()=>{ tick(false); renderer.render(scene,camera); },{frames:6}); }catch(e){ renderer.render(scene,camera); } }
/* r90: leaving the page (the game removes the frame when the roulette ends) hands every GPU buffer back at once instead of waiting for
   the garbage collector, so the next 3D screen starts with the memory free */
function disposeAll(){ cancelAnimationFrame(rafId); if(GOV) GOV.end(); const seen=new Set(); scene.traverse(o=>{ if(o.geometry&&!seen.has(o.geometry)){ seen.add(o.geometry); o.geometry.dispose(); } (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(!m||seen.has(m)) return; seen.add(m); for(const k in m){ const v=m[k]; if(v&&v.isTexture&&!seen.has(v)){ seen.add(v); v.dispose(); } } m.dispose(); }); });
  if(scene.environment) scene.environment.dispose(); ["D","N"].forEach(k=>{ const b=boards[k].userData; [b.first,b.spare].forEach(c=>{ if(c){ c.width=c.height=0; } }); }); leaving=true; renderer.dispose(); try{ renderer.forceContextLoss(); }catch(e){} }
/* r90 MOTION M30 + Light (Nik 2026-11-08: "3D light for Chamber Men and RRR is a guarantee"): a lost GPU context (a GPU reset on a
   Chromebook, a phone that drops it in the background) no longer ends the scene. The page keeps its place in the turn and waits;
   when the browser gives the context back, three.js uploads every geometry, texture and board picture again by itself, and the page
   makes again what lived only on the GPU (the reflections and the one shadow map), then draws on. js/gfxTier.js still lowers this
   device one level for next time. Only a context that never comes back (20 s on screen) hands the turn to the game's result card.
   Our own release on the way out is not a loss. */
let leaving=false, lostSent=false, lostTimer=0, lostLeft=0, lostMark=0, lostOn=false;
/* the 20 s count only on-screen time (Codex P2 on #1326): a phone that drops the context in the background and comes back is given the full wait */
function lostGiveUp(){ lostTimer=0; lostOn=false; if(leaving||lostSent||!renderer.getContext().isContextLost()) return;
  lostSent=true; if(EMBED) toGame("cms-rr-error",{message:"webgl context lost"}); else location.reload(); }
function lostClock(){ if(!lostOn) return; clearTimeout(lostTimer); lostTimer=0; if(document.visibilityState==="hidden"){ if(lostMark){ lostLeft-=Date.now()-lostMark; lostMark=0; } return; } lostMark=Date.now(); lostTimer=setTimeout(lostGiveUp,Math.max(0,lostLeft)); }
addEventListener("visibilitychange",lostClock);
renderer.domElement.addEventListener("webglcontextlost",e=>{ e.preventDefault(); if(leaving) return; cancelAnimationFrame(rafId); rafId=0; lostOn=true; lostLeft=20000; lostMark=0; lostClock(); },false);
/* on restore the frame clock keeps the last frame's time (as on the way back from the back-forward cache, Codex P2 on #1326), so tick()
   moves the turn clock past the gap and the turn picks up where it stopped instead of firing its cues together */
renderer.domElement.addEventListener("webglcontextrestored",()=>{ clearTimeout(lostTimer); lostTimer=0; lostOn=false; if(leaving||lostSent) return;
  try{ buildEnv(); }catch(e){} renderer.shadowMap.needsUpdate=true; if(window.__rrReady&&!rafId) rafId=requestAnimationFrame(frame); },false);
/* back-forward cache (Codex P2 on #1261): a page kept for Back is only paused and picks up again on pageshow; a real unload frees everything.
   On the way back "last" keeps the time of the final frame before the pause, so tick() moves the turn clock past the whole gap
   (the same pause as a hidden tab) and the turn resumes where it stopped instead of finishing at once with every cue */
addEventListener("pagehide",e=>{ if(e.persisted){ cancelAnimationFrame(rafId); rafId=0; return; } disposeAll(); });
addEventListener("pageshow",e=>{ if(e.persisted&&window.__rrReady&&!rafId) rafId=requestAnimationFrame(frame); });

/* ================= controls, hooks ================= */
/* r87 Team G embed (?embed=1, HO040-M1): the game sends {type:"cms-rr-setup", d, n, boards:{D,N}, seed,
   turns:[{fire,target,bulletChamber,stopChamber,hitSlot,aimSlot},{...}]}:
   both clubs, each manager's 15-player board for this season ({pos,name}: XI then 4 subs) and the outcomes from js/rosterRoulette.js.
   The button plays Daniel's turn, then Nik's, then hands back with "cms-rr-continue". The first tap turns sound on (it is the
   viewer's own tap inside this frame); the switch at the top turns it off. A board keeps the launch kit, and the launch rating
   and bench position of any player still on it; a new name shows no rating. */
const EMBED=qs.get("embed")==="1"; let GAME=null;
/* r88 Chamber Men: each turn's loadedChambers (the live chambers its manager's cylinder holds) names the bullet counts. */
function chamberCaption(g){ const t=g&&Array.isArray(g.turns)?g.turns:[]; if(t.length!==2||!t.every(x=>x&&Array.isArray(x.loadedChambers))) return "";
  const word=k=>k===1?"1 bullet":k+" bullets"; return "Daniel "+word(t[0].loadedChambers.length)+" · Nik "+word(t[1].loadedChambers.length)+" · Seven chambers"; }
const toGame=(type,extra)=>{ try{ parent.postMessage(Object.assign({type},extra||{}),location.origin); }catch(e){} };
function embedLabel(){ if(!GAME||playing) return; cta.disabled=false; cta.textContent=turn<2?(NAME[ORDER[turn%2]]+" spins"):"Continue"; }
if(EMBED){ document.body.classList.add("embed");
  addEventListener("message",e=>{ if(e.source!==parent||e.origin!==location.origin||!e.data||e.data.type!=="cms-rr-setup"||GAME) return; const g=e.data;
    /* red team RT5-FLOW-01: a page that cannot take the setup (its squads file failed, or a bad message) tells the game at
       once, so the game shows the result panel instead of a black stage with a dead button */
    if(!SQUADS||!g.boards||!Array.isArray(g.boards.D)||!Array.isArray(g.boards.N)||!Array.isArray(g.turns)||g.turns.length!==2){ toGame("cms-rr-error",{message:SQUADS?"setup":"squads"}); return; }
    const merge=(clubName,rows,formation)=>{ const base=clubByName(clubName), launch=[...base.xi,...base.subs]; const known=nm=>launch.find(r=>r[1]===nm);
      const rate=(r,k)=>Number.isInteger(r.rating)?r.rating:(k?k[2]:""); /* a signing shows the overall the game sent (a Special Player is never on a board: js/rosterRoulette.js specials) */
      const xi=rows.slice(0,11).map(r=>[r.pos,r.name,rate(r,known(r.name))]), subs=rows.slice(11,15).map(r=>{ const k=known(r.name); return [r.position||(k?k[0]:"SUB"),r.name,rate(r,k)]; });
      return Object.assign({},base,{club:clubName,xi,subs,formation:typeof formation==="string"?formation:null}); };
    const dEntry=merge(g.d,g.boards.D,g.formations&&g.formations.D), nEntry=merge(g.n,g.boards.N,g.formations&&g.formations.N);
    if(Number.isInteger(g.seed)) seed=g.seed>>>0;   /* cosmetic draws (sparks, smoke) start from the Showdown's seed on both phones */
    GAME=g; SQUADS={source:SQUADS.source,clubs:[dEntry,nEntry,...SQUADS.clubs.filter(c=>c!==clubByName(g.d)&&c!==clubByName(g.n))]}; LAYOUT.danielClub=g.d; LAYOUT.nikClub=g.n; setBoards(g.d,g.n); result.textContent=chamberCaption(g)||"One bullet. Seven chambers."; embedLabel(); if(manual===null) armAfterFrame=true; else toGame("cms-rr-armed"); });
  addEventListener("rr:end",e=>{ toGame("cms-rr-end",{detail:e.detail}); setTimeout(embedLabel,0); }); }
cta.addEventListener("click",()=>{ if(playing) return;
  if(EMBED){ if(!GAME) return; if(turn>=2){ if(cta.dataset.sent) return; cta.dataset.sent="1"; cta.disabled=true; toGame("cms-rr-continue"); return; }
    if(!SFX.on&&GAME.sound!==false){ SFX.enable(true); $("sound").textContent="Sound: on"; $("sound").setAttribute("aria-pressed","true"); }
    const o=GAME.turns[turn]; startTurn(o.fire===true,o.target||undefined,o); return; }
  startTurn(); });
$("sound").addEventListener("click",()=>{ const v=!SFX.on; SFX.enable(v); $("sound").textContent="Sound: "+(v?"on":"off"); $("sound").setAttribute("aria-pressed",String(v)); });
$("forceFire").addEventListener("click",()=>startTurn(true)); $("forceSafe").addEventListener("click",()=>startTurn(false));
$("reset").addEventListener("click",()=>{ turn=0; loaded=false; playing=null; done={D:null,N:null}; setBoards(LAYOUT.danielClub,LAYOUT.nikClub); slot(slotD,"At the table","wait"); slot(slotN,"Waits","wait"); setBusy(false); result.className="result"; result.textContent=chamberCaption(GAME)||"One bullet. Seven chambers."; });
if(qs.get("tools")!=="1") document.body.classList.add("game");
window.__rr={ get cylZ(){ return cyl.rotation.z; }, get rest(){ return {zoom:restZoom,shift:Math.round(restShift),lift:Math.round(closeLift),dbg:closeDbg}; }, get boardRects(){ camera.updateMatrixWorld(true); const o={}; ["D","N"].forEach(k=>{ const g=boards[k]; g.updateMatrixWorld(true); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; [-1,1].forEach(sx=>[-1,1].forEach(sy=>{ const v=g.userData.inner.localToWorld(new T.Vector3(sx*BOARD_W/2,sy*BOARD_H/2,0)).project(camera); const X=(v.x+1)/2*innerWidth, Y=(1-v.y)/2*innerHeight; x0=Math.min(x0,X); x1=Math.max(x1,X); y0=Math.min(y0,Y); y1=Math.max(y1,Y); })); o[k]=[x0,y0,x1,y1].map(Math.round); }); return o; }, get kits(){ return !!KITS; }, boardPng(key){ return boards[key].userData.canvas.toDataURL("image/png"); }, setBoards(d,n){ LAYOUT.danielClub=d; LAYOUT.nikClub=n; setBoards(d,n); }, play(o){ startTurn(o&&typeof o.fire==="boolean"?o.fire:undefined, o&&o.target); return playing; },
  clock(){ manual=performance.now()/1000; last=manual; }, advance(sec,draw){ if(manual===null) this.clock(); const n=Math.round(sec*30); for(let i=0;i<n;i++){ manual+=1/30; tick(i===n-1&&draw!==false); } }, get state(){ let aimDot=null; if(playing){ const mw=new T.Vector3(), md=new T.Vector3(); muzzle.getWorldPosition(mw); gun.getWorldDirection(md); const tg=boardAimWorld(playing.who).sub(mw); tg.y=0; tg.normalize(); md.y=0; md.normalize(); aimDot=md.dot(tg); } const ri=renderer.info; return {aimDot, calls:ri.render.calls, tris:ri.render.triangles, programs:ri.programs.length, turn, playing:!!playing, fire:playing?playing.fire:null, target:playing?playing.target.name:null, done, level:GFX.name, pixelRatio:renderer.getPixelRatio(), bulletAt, chamber, tt:playing?now()-playing.t0:null, cam:[camera.position.x,camera.position.y,camera.position.z], look:[camLook.x,camLook.y,camLook.z], fov:camera.fov, cylZ:cyl.rotation.z, handK}; } };

const fontsReady=Promise.race([Promise.all(['700 30px "Barlow Condensed"','800 30px "Barlow Condensed"','600 30px "Barlow Condensed"','900 30px "Big Shoulders Display"','800 30px "Big Shoulders Display"','400 40px "Rye"'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,3000))]);
Promise.all([fontsReady,loadAssets()]).then(async()=>{ toGame2("cms-rr-loading",{stage:"build"}); layout(); buildEnv(); { const opts=SQUADS?SQUADS.clubs.map(c=>`<option value="${c.club}">${c.club}</option>`).join(""):""; ["pickD","pickN"].forEach((id,i)=>{ const el=$(id); el.innerHTML=opts; el.value=i?LAYOUT.nikClub:LAYOUT.danielClub; el.addEventListener("change",()=>{ LAYOUT[i?"nikClub":"danielClub"]=el.value; setBoards(LAYOUT.danielClub,LAYOUT.nikClub); }); }); }
  camPos.copy(camRest); camLook.copy(lookRest); last=now(); cta.disabled=true;
  fitUnderTitle(); viewShift=restShift; viewZoom=restZoom;   /* 2.3.0 final pass F04 (L37 opening frames): the picture opens already shifted under the title; easing in from 0 drew the title across both boards on the first frames */
  await warmUp(); last=now();
  GOV=GFXT.governor(renderer,{key:"rrr",draw:()=>renderer.render(scene,camera)}); GFXT.overlay(()=>{ const r=renderer.info.render; return {calls:r.calls, tris:r.triangles, extra:"lights "+(EXTRA_UP?4:LIGHT?2:3)+" + shot flash"}; });
  window.__rrReady=true; if(!EMBED) cta.disabled=false; rafId=requestAnimationFrame(frame); requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add("ready"))); if(EMBED) requestAnimationFrame(()=>toGame("cms-rr-ready"));
  /* r90 Device check (?bench=1&gfx=N) and measurements (?showcase=1): the demo boards play the showcase turn on a loop (a shot, then a click), fixed seed, no game,
     no Firestore; js/gfxTier.js times the frames through the governor and posts the result to the Device check page */
  if(SHOWCASE&&!EMBED){ let n=0; const go=()=>startTurn(n++%2===0); addEventListener("rr:end",()=>setTimeout(()=>{ setBoards(LAYOUT.danielClub,LAYOUT.nikClub); go(); },800)); go(); } });
})();
