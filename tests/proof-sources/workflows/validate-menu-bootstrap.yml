name: Validate Home Bootstrap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  home-bootstrap-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate Home initializer against shell contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          const html = fs.readFileSync('index.html', 'utf8');
          const source = fs.readFileSync('js/menuExperience.js', 'utf8');
          const showdown = fs.readFileSync('js/showdown.js', 'utf8');
          const appCss = fs.readFileSync('css/app.css', 'utf8');
          const app = fs.readFileSync('js/app.js', 'utf8');
          const notices = fs.readFileSync('THIRD_PARTY_NOTICES.md', 'utf8');
          const appVersion = (app.match(/const APP_VERSION = "([^"]+)"/) || [])[1];
          const revision = (html.match(/<meta\s+name="app-asset-revision"\s+content="([^"]+)"/i) || [])[1];
          assert.ok(appVersion, 'APP_VERSION is missing.');
          assert.match(revision, new RegExp(`^${appVersion.replace(/\./g, '\\.')}\\-r[1-9]\\d*$`), 'Home shell cache identity must be a numbered revision for APP_VERSION.');

          const context = { console };
          context.window = context;
          vm.createContext(context);
          vm.runInContext(
            `${source}\n;globalThis.__menuExports = { initializeMenuExperience, decorateMainMenuTiles, getMenuExperienceIntegrity, getSavedShowdownMenuMeta, refreshMainMenuExperience };`,
            context,
            { filename: 'js/menuExperience.js' }
          );

          const api = context.__menuExports;
          // r87 (Nik 2026-11-01): Home has no music strip; music is the phone MUSIC tab and the desktop top-bar dock.
          assert.ok(!/MENU_MEDIA_SOURCES|bindMenuMediaControls|ensureMenuMediaSelector|menuMusic(?:Tile|Toggle|Mute|Status|Player)|menuMediaSelector/.test(source), 'The retired Home music strip must not return to js/menuExperience.js.');
          assert.ok(!/menuMusicTile|menuMusic(?:Toggle|Mute|Status|Player)|menuMediaSelector/.test(html), 'The retired Home music strip must not return to index.html.');

          assert.ok(html.includes('id="careerStatisticsButton"'), 'Current Home Statistics tile is missing.');
          assert.ok(!html.includes('id="trophyRoomButton"'), 'Deprecated Home Trophy Room id must not return.');
          // HO-030 (r78): startup shows the edited marble crops of the same licensed Reus photo; Home keeps the source portrait.
          assert.ok(html.includes(`id="startupAthlete" src="assets/LOADING_REUS_DESKTOP.webp?v=${revision}"`) && html.includes(`srcset="assets/LOADING_REUS_PHONE.webp?v=${revision}"`), 'The local versioned startup portrait is missing or stale.');
          assert.ok(source.includes(`thumbnail: "assets/marco-reus-2015-cc-by.webp?v=${revision}"`), 'Home must reuse the cached source portrait at the current revision.');
          assert.ok(notices.includes('CC BY 2.0') && notices.includes('Tim Reckmann'), 'The bundled portrait attribution is incomplete.');
          assert.ok(app.includes('finishStartupPresentation') && app.includes('STARTUP_SPLASH_EXIT_MS'), 'The finite startup presentation lifecycle is missing.');

          const initializer = api.initializeMenuExperience.toString();
          const decorator = api.decorateMainMenuTiles.toString();
          const integrity = api.getMenuExperienceIntegrity.toString();
          const saveMeta = api.getSavedShowdownMenuMeta.toString();
          const refresh = api.refreshMainMenuExperience.toString();

          assert.ok(!initializer.includes('trophyRoomButton'), 'Home initializer still depends on the removed Trophy Room tile.');
          assert.ok(!source.includes('const trophyRoom = document.getElementById("trophyRoomButton")'), 'Stale r7 Trophy Room startup dependency returned.');
          assert.ok(!source.includes('!newShowdown || !continueCareer || !legacy || !trophyRoom || !ruleBook'), 'All-or-nothing navigation-tile startup gate returned.');
          assert.ok(decorator.includes('careerStatisticsButton'), 'Home decorator must understand the current Statistics tile id.');
          assert.ok(initializer.includes('bindMenuFeedbackInteraction()') && initializer.includes('getMenuExperienceIntegrity()'), 'Home initializer lost required subsystems.');
          assert.ok(initializer.includes('throw new Error'), 'Incomplete Home initialization must fail loudly instead of silently returning.');
          assert.ok(!appCss.includes('.menuMediaSelector'), 'The retired Home media selector CSS must not return.');
          assert.ok(integrity.includes('feedbackBound'), 'Home integrity check must cover menu feedback.');
          assert.ok(saveMeta.includes('indicator: "No Active Showdown"') && saveMeta.includes('Showdown Complete') && saveMeta.includes('Season ${currentRound} / ${totalRounds}'), 'Saved-showdown header states are incomplete.');
          assert.ok(refresh.includes('document.getElementById("seasonIndicator")') && refresh.includes('saveMeta.indicator'), 'Home refresh must synchronize the global save indicator.');

          const creation = showdown.slice(showdown.indexOf('function createShowdown()'), showdown.indexOf('function isLeagueDatabaseReady()'));
          assert.ok(creation.indexOf('saveCurrentShowdown()') < creation.indexOf('window.refreshMainMenuExperience()'), 'New Showdown must save before synchronizing shell state.');
          assert.ok(creation.indexOf('window.refreshMainMenuExperience()') < creation.indexOf('showScreen("leagueWheelScreen")'), 'New Showdown must update the header before entering League selection.');

          console.log(`Home shell/menu initializer, save-indicator synchronization and strip-free Home bootstrap regression passed for ${revision}.`);
          NODE

      - name: Validate revision coherence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('js/app.js', 'utf8');
          const appVersion = (app.match(/const APP_VERSION = "([^"]+)"/) || [])[1];
          const revision = (html.match(/<meta\s+name="app-asset-revision"\s+content="([^"]+)"/i) || [])[1];
          assert.ok(appVersion, 'APP_VERSION is missing.');
          assert.match(revision, new RegExp(`^${appVersion.replace(/\./g, '\\.')}\\-r[1-9]\\d*$`), 'Home shell must expose a numbered runtime revision for APP_VERSION.');
          const refs = [...html.matchAll(/(?:src|href)="((?:js|css|data)\/[^"?#]+)(?:\?v=([^"#]+))?"/g)].map(match => ({ path: match[1], revision: match[2] || '' }));
          assert.ok(refs.length > 0, 'No local shell assets were found.');
          assert.deepStrictEqual(refs.filter(ref => ref.revision !== revision), [], 'All shell assets must share the exact current cache revision.');
          console.log(`Validated coherent ${revision} shell cache identity.`);
          NODE
