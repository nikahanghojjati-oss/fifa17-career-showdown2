<style>
/* Static selected-league study. All product copy comes from the live markup and leagueWheel.js. */
:root{color-scheme:dark;--gold:#f2c45b;--cream:#f4f1ea;--edge:#b98a2f;--ink:#07080a}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:1920px;height:1080px;min-height:1080px;isolation:isolate;overflow:hidden;
background:url('../../../../visual-assets/v10_1/league/assets/ENV_LEAGUE_PLATE_V1_1X.webp') center / cover no-repeat}
.stage::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 32%,transparent 73%,rgba(0,0,0,.36))}
header{height:64px;display:flex;align-items:center;gap:34px;padding:0 34px;background:rgba(7,8,10,.94);border-bottom:1px solid var(--edge)}
.brand{margin:0;font-size:17px;line-height:1.1;letter-spacing:.06em}
.brand span{display:block;color:var(--gold);font-size:13px;margin-top:4px}
nav{display:flex;align-self:stretch;align-items:stretch;gap:28px}
nav button{position:relative;padding:0 12px;border:0;border-bottom:3px solid transparent;background:transparent;color:#ccc8bc;font-size:12px;font-weight:700;letter-spacing:.19em}
nav button[aria-current]{color:var(--gold);border-bottom-color:var(--gold)}
nav button:disabled{opacity:.72}

.header-meta{margin-left:auto;display:flex;gap:12px;align-items:center}
.header-meta span,.header-meta button{padding:11px 14px;border:1px solid #8f7234;background:#08090b;color:var(--gold);font-size:12px;letter-spacing:.06em}
main{width:760px;margin:auto;text-align:center;padding-top:8px}
h1{width:760px;aspect-ratio:2332 / 456;margin:0 auto 7px;background:url('../../../../visual-assets/v10_1/shared/wordmarks/TITLE_LEAGUE_V1.webp') center / contain no-repeat}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#selectedLeague{display:flex;align-items:center;justify-content:center;gap:24px;margin:0 0 10px;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:.16em;color:var(--gold);text-shadow:0 2px 7px #000}
#selectedLeague::before,#selectedLeague::after{content:"";width:90px;height:1px;background:var(--edge)}
.wheel-shell{position:relative;width:580px;height:594px;margin:auto;padding-top:8px}
.wheelPointer{position:absolute;left:calc(50% - 17px);top:0;z-index:4;width:34px;height:34px;color:#ffda7c;font-size:32px;line-height:1;text-shadow:0 2px 4px #000}
#leagueWheel{position:relative;width:580px;height:580px;border-radius:50%;background:#0c0e10;box-shadow:0 16px 42px #000a}
.wheelTrack{position:absolute;inset:48px;border-radius:50%;background:conic-gradient(from -36deg,#ffdf88 0deg,#ddb349 72deg,#101214 72deg 360deg)}
.wheelTrack::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -36deg,#b99137 0 .4deg,transparent .4deg 71.6deg,#b99137 71.6deg 72deg)}
.rim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.wheelItem{position:absolute;left:50%;top:50%;width:160px;margin-left:-80px;display:flex;flex-direction:column;align-items:center;gap:8px;transform-origin:50% 0;transform:rotate(var(--a)) translateY(-220px);color:var(--gold);font-family:"Arial Narrow","Liberation Sans Narrow",Arial,sans-serif;font-size:17px;line-height:1.15;font-weight:700;white-space:nowrap}
.wheelItem img{display:block;width:52px;height:52px}
.wheelItem.item-0{--a:0deg;color:#121212}
.wheelItem.item-1{--a:72deg}
.wheelItem.item-2{--a:144deg}
.wheelItem.item-3{--a:216deg}
.wheelItem.item-4{--a:288deg}
/* As on the target, marks and names stay upright; their centers follow the live five-slice order. */
.wheelItem.item-1{left:calc(50% + 169px);top:calc(50% - 55px);transform:none}
.wheelItem.item-2{left:calc(50% + 93px);top:calc(50% + 62px);transform:none}
.wheelItem.item-3{left:calc(50% - 93px);top:calc(50% + 62px);transform:none}
.wheelItem.item-4{left:calc(50% - 169px);top:calc(50% - 55px);transform:none}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:108px;height:108px;z-index:4;border-radius:50%;border:5px solid #d2a441;background:#08090b;box-shadow:0 0 0 3px #fff0a455,0 6px 16px #000b;display:grid;place-items:center}
.hub img{width:88px;height:88px}
#leagueStateNote{margin:14px auto 12px;padding:10px 22px;min-height:62px;width:740px;background:rgba(8,9,12,.95);border:1px solid var(--edge);box-shadow:0 5px 20px #0008;color:var(--cream);font-size:16px;line-height:1.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:740px;margin:auto}
.actions button{min-height:62px;border:1px solid #ddba5f;border-radius:2px;font-family:"Arial Narrow","Liberation Sans Narrow",Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:.03em;cursor:default}
.primary{color:#100e06;background:linear-gradient(#ffeaa2,#f2c45b 60%,#cb9d32);box-shadow:inset 0 1px 0 #fff3c9,0 0 18px #e2b84a33}
.back{background:#090a0ce8;color:var(--gold)}
button:focus-visible{outline:3px solid #fff2bc;outline-offset:4px}
footer{position:absolute;bottom:0;width:100%;height:46px;display:flex;justify-content:center;align-items:center;gap:12px;border-top:1px solid #aa853d66;background:#07080ae8;color:#c4bcaa;font-size:12px}
@media(max-width:1800px){.stage{zoom:.9}}
@media(max-width:1600px){.stage{zoom:.8}}
@media(max-width:1400px){.stage{zoom:.7}}
@media(min-width:1921px){.stage{max-width:1920px;margin:auto}}
@media(max-width:1100px){header{gap:16px;padding:0 20px}nav{gap:3px}main{width:min(760px,96vw)}h1{max-width:100%}.header-meta{gap:5px}}
</style>
</head>
