<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Select League · Phone B (bold hierarchy)</title>
<style>
:root{--gold:#f5c518;--gold-hi:#ffd34d;--gold-deep:#d4a017;--cream:#e9dfc8;--text:#f4f1ea;--cond:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0c0f}
body{font-family:var(--cond);color:var(--text);-webkit-font-smoothing:antialiased}
.screen{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(rgba(6,7,9,.35),rgba(6,7,9,.8)),url("../../../../visual-assets/v10_1/league/assets/ENV_LEAGUE_PHONE_V1.webp") center/cover no-repeat,#0b0c0f}
.topBar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;position:relative;z-index:2}
.brand h1{margin:0;font:700 20px/1 var(--cond);letter-spacing:.04em;color:var(--cream)}
.brand p{margin:3px 0 0;font:600 11px/1 var(--cond);letter-spacing:.3em;color:var(--gold)}
.chips{display:flex;gap:8px}
.chip{padding:6px 9px;border:1px solid var(--gold-deep);background:rgba(0,0,0,.45);color:var(--gold-hi);font:700 11px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 0 4px}
.centre{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;min-height:0}
.hero{position:absolute;bottom:0;height:min(56vh,430px);width:auto;pointer-events:none;z-index:0}
.heroDaniel{left:-6px}
.heroNik{right:-6px}
.title{margin:0 0 2px}
.title img{display:block;height:auto}
#selectedLeague{display:flex;align-items:center;justify-content:center;gap:12px;min-height:28px;margin:0 0 2px;color:var(--gold-hi);font:700 22px/1.2 var(--cond);letter-spacing:.28em;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.85)}
#selectedLeague::before,#selectedLeague::after{content:"";flex:0 1 60px;height:1px;background:linear-gradient(to right,rgba(201,155,69,0),rgba(201,155,69,.9))}
#selectedLeague::after{transform:scaleX(-1)}
.wheel{position:relative;z-index:1;width:var(--wheel);height:var(--wheel);flex:0 0 auto;filter:drop-shadow(0 16px 26px rgba(0,0,0,.6))}
.wheel svg{display:block;width:100%;height:100%}
.stateNote{width:100%;max-width:360px;margin:8px 0 0;padding:9px 12px;border:1px solid rgba(245,197,24,.7);background:rgba(0,0,0,.55);color:#f6ebd0;font:500 15px/1.35 var(--cond);text-align:center}
.menuButton{width:100%;max-width:360px;height:56px;margin-top:8px;border:0;border-radius:2px;background:linear-gradient(#ffe066,#f5c518 60%,#d9a817);color:#0b0d10;font:700 18px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 18px rgba(245,197,24,.25)}
.backButton{width:100%;max-width:360px;height:44px;margin-top:8px;border:1px solid rgba(233,223,200,.4);border-radius:2px;background:rgba(0,0,0,.45);color:#efe6cf;font:700 15px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.appFoot{margin-top:auto;padding:6px 14px 8px;color:#d9cfb8;font:400 11px/1.25 var(--cond);letter-spacing:.08em;position:relative;z-index:2}

  :root{--wheel:min(86vw,44vh,330px)}
  .title img{width:min(72vw,300px)}
  .hero{height:min(58vh,450px)}
  .wheel{margin-top:-6px}
  .stateNote{font-size:14px;padding:8px 12px}
  .menuButton{height:64px;font-size:22px}
  .backButton{height:44px;font-size:15px}

</style>
</head>
