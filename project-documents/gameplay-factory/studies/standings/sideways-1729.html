<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standings · Sideways phone · JOB-1729</title>
<style>
/* Fonts and art are the shipped Team V files, linked by relative path (no copies). */
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:block;src:url('../../../../visual-assets/v10_1/shared/fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:block;src:url('../../../../visual-assets/v10_1/shared/fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:"Barlow";font-weight:400;font-display:block;src:url('../../../../visual-assets/v10_1/shared/fonts/barlow-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:"Barlow";font-weight:600;font-display:block;src:url('../../../../visual-assets/v10_1/shared/fonts/barlow-latin-600-normal.woff2') format('woff2')}
:root{
  color-scheme:dark;
  --gold-100:#fff3b0;--gold-300:#ffd34d;--gold-500:#f5c518;--gold-700:#d4a017;--ink:#07080a;--text:#f4f1ea;--text-2:#b9b3a4;--edge:rgba(212,160,23,.7);
  --condensed:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif;
  --nav:56px; /* the live phone bottom bar height (--sd-nav-bottom-h) */
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body)}
button{font:inherit;color:inherit;cursor:default}
.screen{position:relative;isolation:isolate;width:100%;height:100svh;overflow:hidden;background:var(--ink) url('../../../../visual-assets/v10_1/rivalry-statistics/assets/ENV_RV_PHONE_V1.webp') center 38%/cover no-repeat}
.screen::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(#07080a33,#07080a99 55%,#07080ae6)}
/* Daniel is LEFT, Nik is RIGHT (never mirrored). */
.heroes{position:absolute;z-index:1;left:0;right:0;top:0;height:calc((100svh - var(--nav)) * .8);pointer-events:none;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.heroes img{position:absolute;top:0;height:100%;width:auto;max-width:none;filter:drop-shadow(0 6px 8px #000b) drop-shadow(0 0 3px #ffd34d44)}
.heroes .daniel{left:-1%}.heroes .nik{right:-1%}
.gear{position:absolute;z-index:6;top:6px;right:6px;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--edge);border-radius:50%;background:#07080ab8;color:var(--gold-300)}
.gear svg{width:20px;height:20px;fill:currentColor}
.stage{position:absolute;z-index:3;left:0;right:0;top:0;bottom:var(--nav);display:flex;flex-direction:column;align-items:center;padding:4px 12px 7px;gap:3px}
header{flex:none;text-align:center;filter:drop-shadow(0 2px 6px #000b)}
.eyebrow{margin:0;font:600 10px/1.1 var(--condensed);letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;color:var(--text);text-shadow:0 1px 6px #000}
.eyebrow::before{content:"";display:block;width:16px;height:9px;margin:0 auto 1px;background:linear-gradient(180deg,var(--gold-100),var(--gold-300) 45%,var(--gold-700));clip-path:polygon(0 22%,25% 48%,50% 0,75% 48%,100% 22%,90% 85%,10% 85%)}
.wordmark{margin:1px auto 0;width:min(232px,60svh)}
.wordmark img{display:block;width:100%;height:auto}
.tagline{margin:-2px 0 0;font:600 10px/1.1 var(--condensed);letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;color:var(--text)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.board{flex:1 1 0;min-height:0;width:min(580px,70vw);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:auto minmax(0,1fr);column-gap:14px;row-gap:3px;padding:7px 12px 6px;border:1px solid var(--gold-300);background:linear-gradient(180deg,#090b0de6,#050709d6);box-shadow:0 12px 32px #000a,0 0 24px #f2c45b2e,inset 0 1px 0 #ffd34d24}
/* DOM order is the live order: toggle, section, progress, scoreboard, rows. Placement only moves it in the grid. */
.toggle{grid-column:2;grid-row:1;display:flex;min-height:0;border:1px solid var(--edge);background:#07080ad9}
.toggle button{flex:1 1 0;min-height:30px;padding:0 6px;border:0;background:transparent;font:600 13px/1 var(--condensed);letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.toggle button[aria-selected="true"]{color:var(--gold-300);background:linear-gradient(#ffd34d1c,#ffd34d08);box-shadow:inset 0 -2px var(--gold-300)}
.lead{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;min-height:0}
.section{margin:0;font:600 14px/1.1 var(--condensed);letter-spacing:.14em;text-transform:uppercase;text-align:center;color:var(--text)}
.progress{margin:2px 0 0;font:600 11px/1.2 var(--condensed);letter-spacing:.14em;text-transform:uppercase;text-align:center;color:var(--text-2)}
.scoreboard{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:4px;font-family:var(--condensed)}
.side{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.crest{width:34px;height:41px}.crest svg{display:block;width:100%;height:100%}
.side strong{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-300)}
.score{display:flex;flex-direction:column;align-items:center;gap:1px}
.score-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);white-space:nowrap}
.score-numbers{display:flex;align-items:baseline;gap:7px;font-variant-numeric:tabular-nums}
.score-numbers b{min-width:1.1ch;text-align:center;font-size:clamp(40px,14svh,54px);line-height:1.2;font-weight:700;color:var(--text)}
.score-numbers b.is-leader{color:var(--gold-300);text-shadow:0 0 18px #ffd34d80}
.score-numbers i{font-style:normal;font-size:24px;color:var(--text-2)}
.leader{min-height:14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-300)}
.rows{grid-column:2;grid-row:2;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));min-height:0}
.row{display:grid;grid-template-columns:1fr 1.9fr 1fr;align-items:center;min-height:0;border-top:1px solid #ffffff1a;font-family:var(--condensed)}
.val{font-size:17px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.val--daniel{text-align:right;padding-right:10px;color:var(--gold-300)}
.val--nik{text-align:left;padding-left:10px;color:var(--text)}
.label{text-align:center;color:#e6e0d0;font-size:12.5px;line-height:1;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.hub-nav{position:absolute;z-index:4;left:0;right:0;bottom:0;height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px;background:linear-gradient(#0a0b0ef5,#07080a);border-top:1px solid var(--edge)}
.hub-nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;color:#e9dfc8;text-decoration:none;font:600 11px/1 var(--condensed);letter-spacing:.1em}
.hub-nav a[aria-current]{color:var(--gold-500)}
.hub-nav a[aria-current]::after{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--gold-500)}
.hub-nav svg{flex:none;width:20px;height:20px;fill:currentColor}
@media(max-height:380px){.wordmark{width:min(196px,60svh)}.row{font-size:15px}.val{font-size:16px}.label{font-size:12px}.toggle button{min-height:28px}.crest{width:30px;height:36px}}
</style>
</head>
