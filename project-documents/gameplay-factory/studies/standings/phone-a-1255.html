<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STANDINGS</title>
<style>
@font-face{font-family:Barlow;src:url('../../../../visual-assets/v10_1/shared/fonts/barlow-condensed-latin-600-normal.woff2');font-weight:600}
@font-face{font-family:Barlow;src:url('../../../../visual-assets/v10_1/shared/fonts/barlow-condensed-latin-700-normal.woff2');font-weight:700}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07080a;color:#eeeae0;font-family:Barlow,sans-serif}
body{display:grid;place-items:center}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}
.phone{position:relative;isolation:isolate;width:100%;max-width:520px;height:100svh;min-height:0;display:grid;
 grid-template-rows:minmax(0,1fr) clamp(62px,10svh,84px) 44px clamp(258px,44svh,352px) 56px;
 gap:6px;padding:0 11px;background:#080909;overflow:hidden}
.scene{position:absolute;z-index:-2;inset:0 0 56px;background:url('../../../../visual-assets/v10_1/rivalry-statistics/assets/ENV_RV_PHONE_V1.webp') center top/cover no-repeat}
.scene:after{content:"";position:absolute;inset:36% 0 0;background:linear-gradient(transparent,#070909c9 48%,#070909 85%)}
.hero{position:relative;min-height:0}.portrait{position:absolute;top:0;height:calc(100% + 85px);width:58%;object-fit:contain;object-position:top center;filter:drop-shadow(0 0 6px #edba3e45)}
.daniel{left:-5%}.nik{right:-5%}.preview{position:absolute;top:10px;left:0;font-size:10px;letter-spacing:.08em;padding:3px 6px;border:1px solid #ae8c3c;background:#080909c9;text-transform:uppercase}
.settings{position:absolute;right:0;top:10px;width:42px;height:42px;border:1px solid #ebc54e;border-radius:50%;background:#080909cb;color:#edc851;display:grid;place-items:center;text-decoration:none}
.settings svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2}
.title{position:relative;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px;filter:drop-shadow(0 2px 5px #000)}
.title p{margin:0;font-size:10px;letter-spacing:.25em;line-height:1.2}.title h1{margin:0;min-height:0}
.title img{display:block;width:85%;height:clamp(36px,6svh,52px);object-fit:contain;margin:auto}
.title .tagline{font-size:10px;letter-spacing:.24em}
.frame{border:2px solid #ddb747;box-shadow:inset 0 0 0 2px #6a4c13,inset 0 0 18px #d7a11c1a,0 0 8px #e7b94320;background:linear-gradient(135deg,#16180fe8,#07090bf5 48%);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.tabs{display:flex;padding:4px;gap:0}.tabs button{flex:1;border:1px solid #ac8b32;background:#080a0c;color:#c6c5be;text-transform:uppercase;font-size:17px;letter-spacing:.03em}
.tabs button[aria-selected=true]{color:#ffe16a;background:linear-gradient(120deg,#373014,#15160f);box-shadow:inset 0 -2px 2px #ffd849,0 0 12px #ffcf4030}
.board{padding:8px 13px;display:grid;grid-template-rows:22px 15px 88px minmax(0,1fr);gap:3px;text-align:center;min-height:0}
.board h2{margin:0;font-size:20px;letter-spacing:.1em;line-height:22px}.progress{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.scoreboard{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:4px;align-items:center;min-width:0}
.manager{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}.manager strong{font-size:19px;letter-spacing:.04em;color:#f8d35b;text-transform:uppercase}
.crest{width:32px;height:38px;border:2px solid #d9b343;background:repeating-linear-gradient(0deg,#25564e 0 9px,#9daf86 9px 13px);clip-path:polygon(0 0,100% 0,92% 68%,50% 100%,8% 68%)}
.crest.nik-crest{background:repeating-linear-gradient(-20deg,#7e3455 0 9px,#e7bf4b 9px 12px)}
.score-label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.numbers{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.numbers b{font-size:48px}.numbers i{font-size:29px;font-style:normal;color:#b9b7ae}
.leader{display:block;color:#f4ce58;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.rows{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));min-height:0}
.row{display:grid;grid-template-columns:1fr 1.9fr 1fr;align-items:center;border-top:1px solid #bfa3419c;min-height:0;font-variant-numeric:tabular-nums}
.row b{font-size:20px;line-height:1;color:#f7d46a}.row b:last-child{color:#eeeae0}.row span{font-size:13px;line-height:1;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.nav{margin:0 -11px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #dcb83c;background:linear-gradient(#17170c,#080909);align-items:stretch}
.nav a{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;color:#e8e1cd;font-size:12px;letter-spacing:.04em;text-decoration:none;border-right:1px solid #b89a3830}
.nav a:last-child{border-right:0}.nav a[aria-current=page]{color:#ffe163;background:radial-gradient(ellipse at top,#7b5d222b,transparent)}
.nav svg{width:21px;height:21px;fill:currentColor;stroke:currentColor;stroke-width:1}
button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:-4px}
@media(max-height:700px){.row b{font-size:18px}}
@media(max-height:600px){.phone{gap:4px;grid-template-rows:minmax(0,1fr) 62px 44px 266px 56px}.portrait{height:calc(100% + 62px)}.settings{top:6px;width:36px;height:36px}.preview{top:6px}.board{grid-template-rows:20px 14px 78px minmax(0,1fr);padding:7px 12px;gap:2px}.board h2{font-size:18px;line-height:20px}.numbers b{font-size:43px}.manager strong{font-size:17px}.crest{width:27px;height:32px}.row b{font-size:18px}.row span{font-size:12px}}
@media(min-width:901px){.phone{grid-template-rows:minmax(0,1fr) 84px 44px 352px}.nav{display:none}}
</style>
</head>
<body>
<main class="phone" aria-label="STANDINGS">
 <div class="scene" aria-hidden="true"></div>
 <div class="hero">
  <img class="portrait daniel" src="../../../../visual-assets/v10_1/rivalry-statistics/assets/OVL_RV_DANIEL_PHONE_V1.webp" alt="" aria-hidden="true">
  <img class="portrait nik" src="../../../../visual-assets/v10_1/rivalry-statistics/assets/OVL_RV_NIK_PHONE_V1.webp" alt="" aria-hidden="true">

  <a class="settings" href="#" aria-label="SETTINGS"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-2h4l1 2 3 2 2 1v4l-2 1v3l2 1v4l-2 1-3 2h-4l-1-2-3-2-2-1v-4l2-1v-3L3 9V5l2-1Z"/><circle cx="12" cy="12" r="4"/></svg></a>
 </div>
 <header class="title">

  <button type="button" role="tab" aria-selected="false" tabindex="-1">Career</button>

  </div>
  <div class="rows">

   <div class="row"><b>0</b><span>Season Draws</span><b>0</b></div>
   <div class="row"><b>0</b><span>Season Losses</span><b>0</b></div>
   <div class="row"><b>0</b><span>Champions Leagues</span><b>0</b></div>
   <div class="row"><b>0</b><span>League Titles</span><b>0</b></div>
   <div class="row"><b>0</b><span>Domestic Cups</span><b>0</b></div>
   <div class="row"><b>0</b><span>Total Trophies</span><b>0</b></div>
  </div>
 </section>
 <nav class="nav" aria-label="HOME CAREER STANDINGS STATS RULES">

  <a href="#" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v4H3ZM3 10h18v4H3ZM3 17h18v4H3Z"/></svg>STANDINGS</a>
  <a href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h4v7H3ZM10 5h4v15h-4ZM17 9h4v11h-4ZM2 23h20"/></svg>STATS</a>
  <a href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h9l5 5v15H5ZM14 2v6h5"/></svg>RULES</a>
 </nav>
</main>
</body>
</html>
